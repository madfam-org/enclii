name: Public hygiene

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**/kustomization.yaml'

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public repository hygiene
        run: bash ./scripts/public-hygiene-check.sh
