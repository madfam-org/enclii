name: Public hygiene

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**/kustomization.yaml'

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check public repository hygiene
        run: bash ./scripts/public-hygiene-check.sh
      - name: Check boundary checkpoints
        run: bash ./scripts/boundary-checkpoint-check.sh
