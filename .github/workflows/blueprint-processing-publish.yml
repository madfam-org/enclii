name: Blueprint Processing Publish

# Build blueprint-harvester processing from madfam-org/blueprint-harvester and pin GitOps digest.
# Uses Enclii repo GHCR_PAT (blueprint-harvester org secret is often stale).

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: blueprint-harvester git ref (branch, tag, or SHA)
        required: false
        default: main
      deploy_ack:
        description: Type "production-kustomization" to acknowledge production publish.
        required: true
        type: string
      enable_overlay:
        description: Type "yes" to add processing-* manifests to active kustomization.
        required: false
        default: "no"
      reason:
        description: Audit reason (min 12 characters)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/madfam-org/blueprint-harvester
  HARVESTER_REPO: madfam-org/blueprint-harvester

jobs:
  preflight:
    name: Acknowledgement
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          DEPLOY_ACK: ${{ inputs.deploy_ack }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ACK" != "production-kustomization" ]; then
            echo "deploy_ack must be production-kustomization"
            exit 1
          fi
          if [ ${#REASON} -lt 12 ]; then
            echo "reason must be at least 12 characters"
            exit 1
          fi

  build-processing:
    name: Build & pin processing digest
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.HARVESTER_REPO }}
          ref: ${{ inputs.git_ref }}
          path: blueprint-harvester
          token: ${{ secrets.GHCR_PAT }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          echo "${GHCR_PAT}" | docker login ghcr.io -u madfam-bot --password-stdin

      - name: Build & push processing
        id: build
        uses: docker/build-push-action@v6
        with:
          context: blueprint-harvester
          file: blueprint-harvester/services/processing/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/processing:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/processing:main

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      # Keyless signing needs GitHub's ambient OIDC endpoint, Fulcio and Rekor all
      # at once. A transient hiccup here fails AFTER the image is pushed but
      # BEFORE the digest pin, so ArgoCD never rolls and the live host keeps
      # serving the previous build while main looks green — the crea-frontend
      # 2026-08-26 failure (run 33010085743, non-JSON from the OIDC endpoint;
      # a plain rerun fixed it). Retry the sign call only; the push above is
      # already done and never repeats.
      - name: Sign processing image
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}/processing@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Pin processing digest in GitOps
        working-directory: blueprint-harvester/infra/k8s/production
        env:
          PROCESSING_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          kustomize edit set image "${IMAGE_PREFIX}/processing=${IMAGE_PREFIX}/processing@${PROCESSING_DIGEST}"
          echo "Pinned processing @${PROCESSING_DIGEST}"

      - name: Enable processing overlay
        if: inputs.enable_overlay == 'yes'
        working-directory: blueprint-harvester
        run: |
          set -euo pipefail
          python3 scripts/enable_processing_prod_overlay.py --execute

      - name: Commit & push GitOps changes
        id: pin_commit
        working-directory: blueprint-harvester
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          git config user.name "madfam-ci[bot]"
          git config user.email "ci@madfam.io"
          git add infra/k8s/production/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No GitOps changes to commit"
            exit 0
          fi
          git commit -m "chore(gitops): pin processing digest from Enclii blueprint-processing-publish" \
            -m "Reason: ${REASON}"
          git push

      # The silent-stale-deploy guard. The dangerous state is not "a step failed"
      # but "the image was pushed and the digest pin never landed": GHCR has the
      # image, the run looks like an ordinary failure, ArgoCD was never handed a
      # new digest, and the live host quietly keeps serving the previous build.
      # crea-frontend hit exactly this on 2026-08-26 (run 33010085743) and it was
      # caught only by an external census deploy-gate. Make the state name itself.
      - name: Guard against silent stale deploy
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PIN_OUTCOME: ${{ steps.pin_commit.outcome }}
        run: |
          set -euo pipefail
          echo "build=${BUILD_OUTCOME} pin=${PIN_OUTCOME}"
          if [ "${BUILD_OUTCOME}" != "success" ]; then
            echo "No image was pushed; nothing to guard."
            exit 0
          fi
          if [ "${PIN_OUTCOME}" = "success" ]; then
            echo "Digest pin completed; the deployed digest matches this run."
            exit 0
          fi
          echo "::error title=Image pushed but NOT pinned/deployed::The image for this commit was"
          echo "::error::built and pushed to GHCR, but the digest pin did not complete"
          echo "::error::(build=${BUILD_OUTCOME}, pin=${PIN_OUTCOME})."
          echo "::error::"
          echo "::error::ArgoCD was never handed a new digest, so THE LIVE HOST IS STILL SERVING"
          echo "::error::THE PREVIOUS BUILD even though this run otherwise looks done."
          echo "::error::"
          echo "::error::Fix: rerun the failed jobs (gh run rerun <run-id> --failed)."
          exit 1
