name: Production Readiness Ratchet

# Self-contained ratchet (scripts vendored from internal-devops). F1-F5 are
# hard gates.

on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/package.json'
      - 'scripts/ratchet/**'
      - 'tests/scripts/test_production_readiness_ratchet.py'
      - '.github/workflows/production-readiness-ratchet.yml'
  push:
    branches: [main]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/package.json'
      - 'scripts/ratchet/**'
      - 'tests/scripts/test_production_readiness_ratchet.py'
      - '.github/workflows/production-readiness-ratchet.yml'

permissions:
  contents: read

jobs:
  ratchet:
    name: Production Readiness Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pyyaml pytest

      - name: Ratchet script tests
        run: pytest tests/scripts/test_production_readiness_ratchet.py -v

      - name: "F1: Image pinning check"
        id: f1
        run: python3 scripts/ratchet/check-image-pinning.py infra/k8s/

      - name: "F2: Probe timeout check"
        id: f2
        run: python3 scripts/ratchet/check-probe-timeouts.py infra/k8s/

      - name: "F3: Workspace exports check"
        id: f3
        run: python3 scripts/ratchet/check-workspace-exports.py

      - name: "F4: transpilePackages check"
        id: f4
        run: python3 scripts/ratchet/check-transpile-packages.py

      - name: "F5: Secret coverage check"
        id: f5
        run: python3 scripts/ratchet/check-secret-coverage.py infra/k8s/
