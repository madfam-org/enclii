name: Build MinIO Image

# Builds MinIO from its pinned upstream release (infra/docker/minio/Dockerfile)
# and publishes it to GHCR. Upstream registries stopped serving anonymous pulls,
# so workloads that run MinIO pull this image instead.
on:
  push:
    branches: [main]
    paths:
      - "infra/docker/minio/**"
      - ".github/workflows/minio-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/docker/minio/**"
      - ".github/workflows/minio-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: minio-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/madfam-org/enclii/minio
  MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
  MINIO_COMMIT: 07c3a429bfed433e49018cb0f78a52145d4bedeb  # pragma: allowlist secret -- public upstream git commit id, not a secret

jobs:
  build:
    name: Build + push minio image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether to push
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "push_image=false" >> "$GITHUB_OUTPUT"
          else
            echo "push_image=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.meta.outputs.push_image == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: infra/docker/minio
          file: infra/docker/minio/Dockerfile
          push: false
          load: true
          build-args: |
            MINIO_RELEASE=${{ env.MINIO_RELEASE }}
            MINIO_COMMIT=${{ env.MINIO_COMMIT }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.MINIO_RELEASE }}
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio
          labels: |
            org.opencontainers.image.source=https://github.com/madfam-org/enclii
            org.opencontainers.image.revision=${{ github.sha }}

      # The image must report exactly the release and commit production runs,
      # and must serve: start it, wait for the liveness endpoint, stop it.
      - name: Smoke check
        env:
          # Disposable credentials for a throwaway container that lives for seconds.
          SMOKE_USER: smoke
          SMOKE_PASS: smoke-smoke-smoke  # pragma: allowlist secret
        run: |
          set -euo pipefail
          IMG="${IMAGE_NAME}:${MINIO_RELEASE}"
          v="$(docker run --rm "$IMG" --version)"
          echo "$v"
          echo "$v" | grep -q "minio version ${MINIO_RELEASE}"
          echo "$v" | grep -q "commit-id=${MINIO_COMMIT}"
          docker run -d --name minio-smoke --user 1001 -e MINIO_ROOT_USER="$SMOKE_USER" -e MINIO_ROOT_PASSWORD="$SMOKE_PASS" \
            --tmpfs /data:uid=1001 -p 19000:9000 "$IMG" server /data --console-address :9001
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/minio/health/live >/dev/null; then echo "live"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:19000/minio/health/live >/dev/null
          docker rm -f minio-smoke >/dev/null

      - name: Push
        if: steps.meta.outputs.push_image == 'true'
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${MINIO_RELEASE}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${MINIO_RELEASE}")"
          echo "Published ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
