name: SDK TypeScript

# Lint, test, and verify OpenAPI type drift for @madfam/enclii-sdk.

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk-ts/**"
      - "docs/api/**"
      - "docs/api-reference/**"
      - ".github/workflows/sdk-ts.yml"
  pull_request:
    paths:
      - "packages/sdk-ts/**"
      - "docs/api/**"
      - "docs/api-reference/**"
      - ".github/workflows/sdk-ts.yml"

concurrency:
  group: sdk-ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        # No `version:` here on purpose. pnpm/action-setup reads the pnpm
        # version from the root package.json `packageManager` field, which is
        # the single source of truth for the pin (shared with the Dockerfiles).
        # Passing BOTH is a hard error in v4 and v6 unless the strings match
        # exactly: `version: 9` vs `pnpm@9.15.9` throws "Multiple versions of
        # pnpm specified".

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          # `working-directory: packages` resolves up to the workspace root
          # (only pnpm-workspace.yaml lives there), so the root lockfile is the
          # one that actually governs this install and the one to cache on.
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: packages
        run: pnpm install --frozen-lockfile --filter @madfam/enclii-sdk...

      - name: Typecheck
        working-directory: packages/sdk-ts
        run: pnpm run typecheck

      - name: Run tests
        working-directory: packages/sdk-ts
        run: pnpm run test

      - name: Verify OpenAPI type drift
        working-directory: packages/sdk-ts
        run: pnpm run verify-types

      - name: Build
        if: matrix.node-version == '22'
        working-directory: packages/sdk-ts
        run: pnpm run build
