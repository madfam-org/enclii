# Keeps the two secret-scanning pre-commit hooks from silently rotting again.
#
# enclii#551: both of them were broken on `main` and nobody noticed, because
# both fail in ways that look like nothing happening:
#
#   - detect-secrets was configured with `--baseline .secrets.baseline` while
#     that file was never tracked. On a file its filter selected it died with
#     `argument --baseline: Invalid path`; on every other file it printed
#     `(no files to check) Skipped`, which reads like a pass.
#   - gitleaks was configured with `args: ['--no-git']`, which got appended to
#     the v8.18.1 hook entry `gitleaks protect --staged`. `protect` does not
#     accept that flag, so every single run printed the CLI usage and exited
#     non-zero — including on files with no secrets in them.
#
# The net effect was that people committed with `--no-verify` to get past the
# hooks, i.e. commit-time secret scanning was off entirely.
#
# This workflow therefore checks two different things:
#   1. that each hook still runs to a clean exit on the repo as it stands, and
#   2. that they still *detect* — see the planted-secret step for why (1) alone
#      is not enough to prove a working scanner.

name: Pre-commit secret hooks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-hooks:
    name: detect-secrets + gitleaks
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The gitleaks hook is `language: golang`. The ARC runner image ships no
      # language toolchains on purpose, and with no `go` on PATH pre-commit
      # downloads whatever Go is newest from go.dev under GOTOOLCHAIN=local —
      # an unpinned toolchain that moves under us on every Go release.
      # `go-version-file` tracks the repo's own go directive instead, so this
      # does not become yet another place a Go version has to be bumped.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/cli/go.mod
          cache: false

      - name: Install pre-commit
        run: pip install --quiet pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      # Real scan: every tracked file the hook's exclude regex does not drop,
      # compared against .secrets.baseline. Fails on any finding not in it.
      - name: detect-secrets (all files)
        run: pre-commit run detect-secrets --all-files

      # detect-secrets-hook trims the baseline to the file list it is handed and
      # writes it back. Handed a partial list it truncates the baseline to that
      # subset, and the next invocation then reports every already-audited
      # finding in the other files as brand new. `require_serial: true` in
      # .pre-commit-config.yaml is what keeps it to one invocation; this asserts
      # that it worked, because the symptom otherwise is a red run full of
      # findings that are not real.
      - name: Baseline must not have been rewritten
        if: always()
        run: |
          if ! git diff --quiet -- .secrets.baseline; then
            echo "::error::the detect-secrets run rewrote .secrets.baseline — it was handed a partial file list; check require_serial"
            git diff --stat -- .secrets.baseline
            exit 1
          fi

      # This one proves only that the hook *invokes* cleanly, which is exactly
      # the regression #551 was about. It cannot prove more: the gitleaks hook
      # is `pass_filenames: false` and scans `--staged`, so on a fresh checkout
      # with nothing staged it has nothing to look at and passes trivially.
      - name: gitleaks (hook invokes cleanly)
        if: always()
        run: pre-commit run gitleaks --all-files

      # ...so detection is asserted separately, by planting a synthetic GitHub
      # PAT and requiring BOTH hooks to reject it. A hook that stops detecting
      # fails here even when both steps above are green.
      #
      # The token body is generated at run time, so this file contains no
      # secret-shaped literal for the scanners to trip over.
      - name: Both hooks must catch a planted secret
        if: always()
        run: |
          set -euo pipefail
          probe=.ci-secret-scan-selftest.txt
          cleanup() { git rm -q --cached "$probe" 2>/dev/null || true; rm -f "$probe"; }
          trap cleanup EXIT

          body=$(python3 -c "import secrets, string; print(''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)))")
          printf 'github_token = %s_%s\n' 'ghp' "$body" > "$probe"
          git add "$probe"

          if pre-commit run gitleaks > gl.out 2>&1; then
            echo "::error::gitleaks did not flag a planted GitHub PAT — it is no longer detecting"
            cat gl.out
            exit 1
          fi
          if pre-commit run detect-secrets --files "$probe" > ds.out 2>&1; then
            echo "::error::detect-secrets did not flag a planted GitHub PAT — it is no longer detecting"
            cat ds.out
            exit 1
          fi
          echo "Both hooks flagged the planted secret."
