name: Publish SDKs

on:
  push:
    tags:
      - "shared-lib-v*"
      - "ui-components-v*"
      - "config-v*"

jobs:
  publish:
    name: Publish @enclii SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Extract package name and version
        id: extract
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PKG_NAME=${TAG%-v*}
          VERSION=${TAG#*-v}
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install
        working-directory: packages

      - name: Build workspace dependencies
        if: steps.extract.outputs.pkg_name != 'shared-lib' && steps.extract.outputs.pkg_name != 'config'
        run: pnpm run --if-present build
        working-directory: packages/shared-lib

      - name: Build
        run: pnpm run --if-present build
        working-directory: packages/${{ steps.extract.outputs.pkg_name }}

      - name: Publish to npm.madfam.io
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/${{ steps.extract.outputs.pkg_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "@enclii/${{ steps.extract.outputs.pkg_name }} v${{ steps.extract.outputs.version }}"
          body: |
            ## Installation
            ```bash
            # Configure registry (first time only)
            npm config set @enclii:registry https://npm.madfam.io

            # Install
            pnpm add @enclii/${{ steps.extract.outputs.pkg_name }}@${{ steps.extract.outputs.version }}
            ```
          prerelease: ${{ contains(steps.extract.outputs.version, 'alpha') || contains(steps.extract.outputs.version, 'beta') }}
