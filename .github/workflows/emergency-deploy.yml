name: Emergency Deploy (GitHub-hosted)

# Emergency deployment workflow that uses ONLY GitHub-hosted runners
# Use this when self-hosted runners (ARC) are unavailable
# Reads services.json to dynamically build and deploy any service

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated, must match services.json names)'
        required: true
        default: 'switchyard-api'
        type: string
      skip_tests:
        description: 'Skip tests (emergency only)'
        required: false
        default: false
        type: boolean

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/madfam-org/enclii

jobs:
  resolve-matrix:
    name: Resolve Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve service matrix from services.json
        id: resolve
        run: |
          REQUESTED="${{ github.event.inputs.services }}"
          echo "Requested services: $REQUESTED"

          MATRIX_INCLUDE="[]"
          IFS=',' read -ra SVC_LIST <<< "$REQUESTED"
          for svc in "${SVC_LIST[@]}"; do
            svc=$(echo "$svc" | xargs)  # trim whitespace
            ENTRY=$(jq -c --arg name "$svc" '.services[] | select(.name == $name)' services.json)
            if [ -z "$ENTRY" ]; then
              echo "⚠️ Service '$svc' not found in services.json — skipping"
              continue
            fi
            MATRIX_INCLUDE=$(echo "$MATRIX_INCLUDE" | jq --argjson entry "$ENTRY" '. + [$entry]')
            echo "✅ Found: $svc"
          done

          COUNT=$(echo "$MATRIX_INCLUDE" | jq length)
          echo "Resolved $COUNT service(s) for emergency deploy"
          echo "matrix=$(echo "{\"include\":$MATRIX_INCLUDE}" | jq -c '.')" >> $GITHUB_OUTPUT

  emergency-build:
    name: 'Emergency: ${{ matrix.name }}'
    runs-on: ubuntu-latest
    needs: resolve-matrix
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        if: matrix.type == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Run tests
        if: github.event.inputs.skip_tests != 'true' && matrix.type == 'go'
        working-directory: ${{ matrix.path }}
        run: go test -v -short ./...
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Build and push ${{ matrix.name }}
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Optional Dockerfile stage from services.json (`target` field).
          # Empty = final stage. Matrix entries here are the raw
          # services.json objects, so the field flows through directly.
          target: ${{ matrix.target || '' }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            NPM_MADFAM_TOKEN=${{ secrets.NPM_MADFAM_TOKEN }}
          cache-from: type=gha,scope=emergency-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=emergency-${{ matrix.name }}

      # Keyless signing needs GitHub's ambient OIDC endpoint, Fulcio and Rekor all
      # at once. A transient hiccup fails AFTER the image is pushed, stranding the
      # run before the digest is collected — the crea-frontend 2026-08-26 failure
      # (run 33010085743, non-JSON from the OIDC endpoint; a plain rerun fixed it).
      # Retry the sign call only; the push above is already done and never repeats.
      - name: Sign ${{ matrix.name }} image
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.docker-build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

    outputs:
      image: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}

  deploy:
    name: Deploy via GitOps
    runs-on: ubuntu-latest
    needs: [emergency-build, resolve-matrix]
    if: always() && needs.emergency-build.result == 'success'
    permissions:
      contents: write
      # GHCR image read requires explicit packages:read scope on the workflow
      # token. Without it, `docker buildx imagetools inspect` HEADs return 403
      # even after `docker login` succeeds — the token simply isn't authorized
      # to read the manifest. Verified via run 24939981458 ("403 Forbidden"
      # against /v2/madfam-org/enclii/switchyard-api/manifests/<sha>).
      packages: read

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Install kustomize
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION="v5.4.3"
          curl -fsSLo /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Login to GHCR (for digest lookup)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Digests come from the registry, not from an artifact. This is the SAME
      # mechanism build-publish.yml adopted in #460 (v1.0.0-alpha.5), applied
      # here for the same reason: madfam-org is on the FREE plan, whose 500 MB
      # pool is shared between Actions artifacts AND GHCR packages, hard-stop
      # when full. Every deploy pushes another image version into that pool, so
      # the pool refills itself — it blocked twice in 24h on 2026-08-27 and a
      # purge bought only ~3h. An artifact hop here meant the break-glass path
      # was blocked exactly when it is reached for.
      #
      # `docker buildx imagetools inspect` reads the manifest GHCR already holds
      # for the tag the build job pushed. Two preconditions, both satisfied
      # above and both required:
      #   1. `docker login ghcr.io` — the "Login to GHCR" step above.
      #   2. `packages: read` on the job token — see this job's `permissions:`.
      #      Without it the manifest HEAD returns 403 even though login
      #      succeeded (run 24939981458).
      #
      # Reference safety: `:${{ github.sha }}` is pushed by the build job above
      # alongside `:latest`. We resolve the SHA tag, never `:latest`, because
      # `:latest` moves with every emergency run and could drift to an unrelated
      # build between build and deploy. The SHA tag is unique per commit and no
      # branch-moving reference is involved.
      #
      # Unlike build-publish.yml's pin job, this path does NOT cosign-verify
      # before pinning, and this change does not add that gate. Break-glass
      # intentionally carries less ceremony than the main path; the build job
      # above still signs each image with a hard-fail, and adding a new gate to
      # a workflow reached only when the normal path is already broken would be
      # a new way for the emergency to fail.
      - name: Derive digests from GHCR
        env:
          MATRIX: ${{ needs.resolve-matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          UPDATED=0

          while IFS= read -r line; do
            NAME=$(echo "$line" | jq -r '.name')
            IMAGE=$(echo "$line" | jq -r '.image')
            KUSTOMIZATION=$(echo "$line" | jq -r '.kustomization')
            KUSTOMIZE_IMAGE=$(echo "$line" | jq -r '.kustomize_image')

            IMAGE_TAG="ghcr.io/${{ github.repository }}/${IMAGE}:${{ github.sha }}"

            # Transient registry 5xx/timeouts must not look like "this service
            # did not build" — that would silently skip the pin and strand the
            # host, the very failure class this workflow exists to escape.
            DIGEST=""
            for wait in 0 5 15 30; do
              [ "$wait" -gt 0 ] && sleep "$wait"
              if DIGEST=$(docker buildx imagetools inspect "$IMAGE_TAG" \
                            --format '{{json .Manifest.Digest}}' 2>/tmp/inspect-"$NAME".err); then
                DIGEST=$(printf '%s' "$DIGEST" | tr -d '"[:space:]')
                [ -n "$DIGEST" ] && break
              fi
              DIGEST=""
            done

            if [ -z "$DIGEST" ]; then
              echo "::error::Failed to resolve digest for $IMAGE_TAG"
              head -c 300 /tmp/inspect-"$NAME".err 2>/dev/null || true; echo
              exit 1
            fi

            if [[ "$DIGEST" != sha256:* ]]; then
              echo "::error::Registry returned a non-sha256 digest for ${IMAGE_TAG}: ${DIGEST}"
              exit 1
            fi

            echo "Updating ${NAME}: ${KUSTOMIZE_IMAGE}@${DIGEST}"
            (cd "${KUSTOMIZATION}" && kustomize edit set image "${KUSTOMIZE_IMAGE}=ghcr.io/${{ github.repository }}/${IMAGE}@${DIGEST}")
            UPDATED=$((UPDATED + 1))
          done < <(echo "$MATRIX" | jq -c '.include[]')

          echo "Updated $UPDATED service digest(s)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A '**/kustomization.yaml'
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "build: emergency deploy ${{ github.event.inputs.services }}

          Triggered by: ${{ github.actor }}
          Source SHA: ${{ github.sha }}"
          git push origin main

      - name: Monitor
        run: |
          echo "Image digests committed to kustomization files."
          echo "ArgoCD will auto-sync within ~3 minutes."
          echo "Monitor: kubectl get applications -n argocd -w"
