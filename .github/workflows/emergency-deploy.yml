name: Emergency Deploy (GitHub-hosted)

# Emergency deployment workflow that uses ONLY GitHub-hosted runners
# Use this when self-hosted runners (ARC) are unavailable
# Reads services.json to dynamically build and deploy any service

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated, must match services.json names)'
        required: true
        default: 'switchyard-api'
        type: string
      skip_tests:
        description: 'Skip tests (emergency only)'
        required: false
        default: false
        type: boolean

env:
  GO_VERSION: '1.25.0'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/madfam-org/enclii

jobs:
  resolve-matrix:
    name: Resolve Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve service matrix from services.json
        id: resolve
        run: |
          REQUESTED="${{ github.event.inputs.services }}"
          echo "Requested services: $REQUESTED"

          MATRIX_INCLUDE="[]"
          IFS=',' read -ra SVC_LIST <<< "$REQUESTED"
          for svc in "${SVC_LIST[@]}"; do
            svc=$(echo "$svc" | xargs)  # trim whitespace
            ENTRY=$(jq -c --arg name "$svc" '.services[] | select(.name == $name)' services.json)
            if [ -z "$ENTRY" ]; then
              echo "⚠️ Service '$svc' not found in services.json — skipping"
              continue
            fi
            MATRIX_INCLUDE=$(echo "$MATRIX_INCLUDE" | jq --argjson entry "$ENTRY" '. + [$entry]')
            echo "✅ Found: $svc"
          done

          COUNT=$(echo "$MATRIX_INCLUDE" | jq length)
          echo "Resolved $COUNT service(s) for emergency deploy"
          echo "matrix=$(echo "{\"include\":$MATRIX_INCLUDE}" | jq -c '.')" >> $GITHUB_OUTPUT

  emergency-build:
    name: 'Emergency: ${{ matrix.name }}'
    runs-on: ubuntu-latest
    needs: resolve-matrix
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        if: matrix.type == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Run tests
        if: github.event.inputs.skip_tests != 'true' && matrix.type == 'go'
        working-directory: ${{ matrix.path }}
        run: go test -v -short ./...
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Build and push ${{ matrix.name }}
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            NPM_MADFAM_TOKEN=${{ secrets.NPM_MADFAM_TOKEN }}
          cache-from: type=gha,scope=emergency-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=emergency-${{ matrix.name }}

      - name: Sign ${{ matrix.name }} image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.docker-build.outputs.digest }}

    outputs:
      image: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}

  deploy:
    name: Deploy via GitOps
    runs-on: ubuntu-latest
    needs: [emergency-build, resolve-matrix]
    if: always() && needs.emergency-build.result == 'success'
    permissions:
      contents: write
      # GHCR image read requires explicit packages:read scope on the workflow
      # token. Without it, `docker buildx imagetools inspect` HEADs return 403
      # even after `docker login` succeeds — the token simply isn't authorized
      # to read the manifest. Verified via run 24939981458 ("403 Forbidden"
      # against /v2/madfam-org/enclii/switchyard-api/manifests/<sha>).
      packages: read

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Login to GHCR (for digest lookup)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image digests from services.json
        run: |
          set -euo pipefail
          UPDATED=0
          MODIFIED_FILES=""
          MATRIX='${{ needs.resolve-matrix.outputs.matrix }}'

          # NOTE: digest resolution uses `docker buildx imagetools inspect`
          # rather than `docker manifest inspect | jq -r '.digest'`. The
          # manifest-inspect JSON has no top-level `.digest` field (it's
          # either a manifest list with `.manifests[].digest` or a single
          # manifest with no self-digest), so the previous code returned
          # "null" → empty DIGEST → no-op `kustomize edit` → silent skip.
          # buildx imagetools authenticates via the docker login above and
          # prints `Digest: sha256:…` for both single-arch and index images.
          while IFS= read -r line; do
            NAME=$(echo "$line" | jq -r '.name')
            IMAGE=$(echo "$line" | jq -r '.image')
            KUSTOMIZATION=$(echo "$line" | jq -r '.kustomization')
            KUSTOMIZE_IMAGE=$(echo "$line" | jq -r '.kustomize_image')

            IMAGE_TAG="ghcr.io/${{ github.repository }}/${IMAGE}:${{ github.sha }}"
            DIGEST=$(docker buildx imagetools inspect "$IMAGE_TAG" | awk '/^Digest:/{print $2; exit}')
            if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
              echo "::error::Failed to resolve digest for $IMAGE_TAG"
              exit 1
            fi
            echo "Updating ${NAME}: ${KUSTOMIZE_IMAGE}@${DIGEST}"
            (cd "${KUSTOMIZATION}" && kustomize edit set image "${KUSTOMIZE_IMAGE}=ghcr.io/${{ github.repository }}/${IMAGE}@${DIGEST}")
            UPDATED=$((UPDATED + 1))
          done < <(echo "$MATRIX" | jq -c '.include[]')

          echo "Updated $UPDATED service digest(s)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A '**/kustomization.yaml'
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "build: emergency deploy ${{ github.event.inputs.services }}

          Triggered by: ${{ github.actor }}
          Source SHA: ${{ github.sha }}"
          git push origin main

      - name: Monitor
        run: |
          echo "Image digests committed to kustomization files."
          echo "ArgoCD will auto-sync within ~3 minutes."
          echo "Monitor: kubectl get applications -n argocd -w"
