name: Emergency Deploy (GitHub-hosted)

# Emergency deployment workflow that uses ONLY GitHub-hosted runners
# Use this when self-hosted runners (ARC) are unavailable

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated: switchyard-api,dispatch)'
        required: true
        default: 'switchyard-api'
        type: string
      skip_tests:
        description: 'Skip tests (emergency only)'
        required: false
        default: false
        type: boolean

env:
  GO_VERSION: '1.24.13'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/madfam-org/enclii

jobs:
  build-switchyard-api:
    name: Build switchyard-api
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.services, 'switchyard-api')
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Run tests
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        working-directory: apps/switchyard-api
        run: go test -v -short ./...
        continue-on-error: true

      - name: Build binary
        working-directory: apps/switchyard-api
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o switchyard-api ./cmd/api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/switchyard-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/switchyard-api:latest
            ${{ env.IMAGE_PREFIX }}/switchyard-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      image: ${{ env.IMAGE_PREFIX }}/switchyard-api:${{ github.sha }}

  deploy:
    name: Deploy via GitOps
    runs-on: ubuntu-latest
    needs: [build-switchyard-api]
    if: always() && (needs.build-switchyard-api.result == 'success' || needs.build-switchyard-api.result == 'skipped')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update switchyard-api image digest
        if: contains(github.event.inputs.services, 'switchyard-api') && needs.build-switchyard-api.result == 'success'
        working-directory: infra/k8s/production
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/switchyard-api
          TAG: ${{ github.sha }}
        run: |
          # Use tag-based reference (digest resolved by ArgoCD Image Updater on next poll)
          echo "Setting image: switchyard-api=${IMAGE}:${TAG}"
          kustomize edit set image "switchyard-api=${IMAGE}:${TAG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/production/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "$(cat <<'EOF'
          build: emergency update image digests for ${{ github.event.inputs.services }}

          Triggered by: ${{ github.actor }}
          Source SHA: ${{ github.sha }}
          EOF
          )"
          git push origin main

      - name: Monitor
        run: |
          echo "Image reference committed to kustomization.yaml."
          echo "ArgoCD will auto-sync within ~3 minutes."
          echo "Monitor: kubectl get application core-services -n argocd -w"
