name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild all Docker images (bypass Conservation Law)'
        required: false
        default: 'false'
        type: boolean
      services:
        description: 'Optional comma-separated service names to rebuild, e.g. switchyard-api,switchyard-ui'
        required: false
        default: ''
        type: string
      docker_runner:
        description: 'Optional runner label for Docker builds, e.g. ubuntu-latest to bypass saturated ARC'
        required: false
        default: ''
        type: string

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      - name: Auto-discover and lint Go modules
        run: |
          echo "🔍 Auto-discovering Go modules..."
          MODULES=$(find apps/ packages/ -name go.mod -exec dirname {} \; | sort)
          echo "Found modules:"
          echo "$MODULES"
          echo ""
          FAILED=0
          for mod in $MODULES; do
            # A Go module is defined by its go.mod, which is how $MODULES was
            # discovered in the first place -- NOT by whether it happens to keep
            # a *.go file at its root.
            #
            # This guard used to be `find "$mod" -maxdepth 1 -name '*.go'`, and
            # 5 of the 6 modules here put all their code under cmd/ and
            # internal/. So the guard fired for all 5, and the only module this
            # job ever linted was packages/otel-go. `golangci-lint` had never
            # run on apps/switchyard-api in a green build.
            #
            # `./...` already recurses, so the only thing the check has to
            # answer is "does this module contain any Go at all?".
            if ! find "$mod" -name '*.go' -print -quit | grep -q .; then
              echo "▶ Skipping $mod (module contains no Go files)"
              continue
            fi
            echo "▶ Linting $mod"
            (cd "$mod" && golangci-lint run --timeout=5m ./...) || FAILED=1
          done
          if [ $FAILED -eq 1 ]; then
            echo "❌ Lint failures detected"
            exit 1
          fi

      - name: Check Go formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted:"
            gofmt -l .
            exit 1
          fi

  # =============================================================================
  # OPERATION RATCHET: Stability Enforcement Jobs
  # =============================================================================

  manifest-audit:
    name: Manifest Audit (Ratchet)
    runs-on: ubuntu-latest
    # Run in parallel with lint for speed
    steps:
      - uses: actions/checkout@v7

      - name: Check critical config keys
        run: |
          echo "🔒 Operation Ratchet - Manifest Audit"
          echo ""
          FAILED=0

          # --- environment-patch.yaml ---
          echo "Checking: infra/k8s/production/environment-patch.yaml"
          ENV_PATCH="infra/k8s/production/environment-patch.yaml"
          for key in "ENCLII_OIDC_ISSUER" "ENCLII_OIDC_CLIENT_ID" "ENCLII_OIDC_CLIENT_SECRET" "ENCLII_EXTERNAL_JWKS_URL"; do
            if grep -q "$key" "$ENV_PATCH" 2>/dev/null; then
              echo "  ✅ $key"
            else
              echo "  ❌ MISSING: $key"
              FAILED=1
            fi
          done

          # --- cloudflared-unified.yaml ---
          # Since session 22, tunnel is remotely-managed via Cloudflare API.
          # Hostname routes are no longer in the YAML — verify remote-config mode instead.
          echo ""
          echo "Checking: infra/k8s/production/cloudflared-unified.yaml"
          CLOUDFLARED="infra/k8s/production/cloudflared-unified.yaml"
          if grep -q "remote config" "$CLOUDFLARED" 2>/dev/null || grep -q "tunnel run" "$CLOUDFLARED" 2>/dev/null; then
            echo "  ✅ Tunnel is remotely-managed (routes via Cloudflare API)"
          else
            echo "  ❌ Tunnel config missing remote-management indicators"
            FAILED=1
          fi

          # --- roundhouse.yaml ---
          echo ""
          echo "Checking: infra/k8s/base/roundhouse.yaml"
          ROUNDHOUSE="infra/k8s/base/roundhouse.yaml"
          if grep -q "imagePullSecrets:" "$ROUNDHOUSE" 2>/dev/null; then
            echo "  ✅ imagePullSecrets"
          else
            echo "  ❌ MISSING: imagePullSecrets"
            FAILED=1
          fi

          # --- dispatch deployment ---
          echo ""
          echo "Checking: apps/admin-console/k8s/deployment.yaml"
          DISPATCH="apps/admin-console/k8s/deployment.yaml"
          for key in "imagePullSecrets:" "ALLOWED_ADMIN_DOMAINS" "ALLOWED_ADMIN_ROLES" "NEXT_PUBLIC_JANUA_URL"; do
            if grep -q "$key" "$DISPATCH" 2>/dev/null; then
              echo "  ✅ $key"
            else
              echo "  ❌ MISSING: $key"
              FAILED=1
            fi
          done

          # --- Port consistency check (Operation Fortification) ---
          echo ""
          echo "🔒 Port Consistency Check (Fortification)"
          echo "Checking: infra/k8s/base/switchyard-api.yaml"
          API_MANIFEST="infra/k8s/base/switchyard-api.yaml"
          if grep -q "containerPort: 8080" "$API_MANIFEST"; then
            echo "  ❌ FORBIDDEN: containerPort: 8080 (must be 4200)"
            FAILED=1
          else
            echo "  ✅ containerPort: 4200"
          fi
          if grep -q "targetPort: 8080" "$API_MANIFEST"; then
            echo "  ❌ FORBIDDEN: targetPort: 8080 (must be 4200)"
            FAILED=1
          else
            echo "  ✅ targetPort: 4200"
          fi
          if grep -E "port: 8080" "$API_MANIFEST"; then
            echo "  ❌ FORBIDDEN: port 8080 found in manifest"
            FAILED=1
          else
            echo "  ✅ All ports use 4200"
          fi

          echo ""
          if [ $FAILED -eq 1 ]; then
            echo "❌ Manifest audit FAILED - critical config keys missing!"
            echo "   See SYSTEM_CONTEXT.md 'Operation Ratchet - Rules of Engagement'"
            exit 1
          fi
          echo "✅ Manifest audit passed (including port consistency)!"

  networkpolicy-port-lint:
    name: NetworkPolicy port consistency
    runs-on: ubuntu-latest
    # Cheap (~1.5s on the ~100-NP, ~70-workload infra/k8s tree). Runs in
    # parallel with lint. Prevents the 2026-05-04 status.enclii.dev outage
    # class: NetworkPolicy `ports:` clauses that don't intersect the
    # selected pods' containerPorts (silent CNI drop).
    # See scripts/check-networkpolicy-ports.py for the full rationale.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run NetworkPolicy port lint
        run: python3 scripts/check-networkpolicy-ports.py infra/k8s/

  dependabot-secret-trap-lint:
    name: Dependabot secret-trap lint
    runs-on: ubuntu-latest
    # Cheap (~0.2s over ~36 workflows). Prevents the 2026-08-07 class: a
    # `credentials:` block fed by a `secrets.` expression makes the WHOLE
    # workflow template invalid on Dependabot runs, which get an empty secret
    # store. The job never starts, so there is no test output and no cause to
    # read — and no rebase, recreate or rerun can fix it. Five coforma-studio
    # PRs and an unknown number of enclii ones sat unmergeable for weeks while
    # main stayed green, because pushes to main DO have the secrets.
    # See scripts/check-dependabot-secret-traps.py for the three accepted fixes.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run Dependabot secret-trap lint
        run: python3 scripts/check-dependabot-secret-traps.py .github/workflows/

  externalsecret-writer-lint:
    name: ExternalSecret multi-writer policy
    runs-on: ubuntu-latest
    # Prevents the 2026-06-13 / 2026-08-06 dhanam-secrets class: two or more
    # ExternalSecrets writing one Secret where a non-Merge writer does not
    # produce every key its co-writers do. Owner and Orphan both reconcile the
    # target down to their own keys, so every refresh deletes the uncovered
    # ones until the others re-reconcile — while every ExternalSecret still
    # reports Ready=True.
    #
    # Fails only on writers that actually lose keys, and reports which keys.
    # A non-Merge writer whose key set covers all co-writers (the healthy
    # enclii-dhanam-staging shape) is WARNed, not blocked.
    # See scripts/check-externalsecret-writers.py for the full rationale.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet pyyaml pytest

      - name: Run ExternalSecret writer self-tests
        run: pytest tests/scripts/test_check_externalsecret_writers.py -v

      - name: Run ExternalSecret multi-writer lint
        run: python3 scripts/check-externalsecret-writers.py infra/k8s/

  probe-target-lint:
    name: Probe target consistency
    runs-on: ubuntu-latest
    # Enforces that each synthetic-probe target's url port, `port` field and
    # `<service>.<namespace>` host all agree. This does NOT prove the Service
    # publishes the port — those manifests live in the product repos — that
    # check runs inside the probe itself (cloudflared_probe_target_misconfigured).
    # Also exercises the exporter embedded in the secret-key-count-exporter
    # ConfigMap, which is executed straight out of the manifest.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet pyyaml pytest

      - name: Run probe target lint
        run: python3 scripts/check-probe-targets.py infra/k8s/

      - name: Run probe target self-tests
        run: pytest tests/scripts/test_check_probe_targets.py -v

      - name: Run secret key-count exporter tests
        run: pytest tests/scripts/test_secret_key_count_exporter.py -v

      # Exercises the bash embedded in the ARC watchdog + pool-health manifests.
      # Both are scale-sensitive: they behaved correctly on a handful of runners
      # and failed on a large backlog, which is the only time they matter. The
      # scale cases are the point — do not trim them to make the job faster.
      - name: Run ARC watchdog + pool-health tests
        run: pytest tests/scripts/test_stuck_runner_watchdog.py tests/scripts/test_arc_pool_health.py -v

  intake-policy-parity:
    name: Intake/Vault-policy parity
    runs-on: ubuntu-latest
    # Cheap (sub-second). Every secrets-intake vault_path must be writable
    # under the switchyard-secret-writer policy — they drifted once (nauta,
    # enclii#379) and the first live use failed with an opaque 500 days after
    # the green merge. See scripts/check-intake-policy-parity.sh.
    steps:
      - uses: actions/checkout@v7

      - name: Run intake/policy parity check
        run: ./scripts/check-intake-policy-parity.sh

  status-configmap-drift:
    name: Status Configmap Drift (ST-3)
    runs-on: ubuntu-latest
    # Cheap (sub-second) — runs in parallel with lint.
    # Enforces: enclii configmap ⊆ madfam configmap (by url), no in-file
    # duplicates, well-formed JSON. See scripts/check-status-configmaps.sh
    # for the full invariant list and rationale.
    steps:
      - uses: actions/checkout@v7

      - name: Run status configmap drift check
        run: ./scripts/check-status-configmaps.sh

  zero-touch-boundary:
    name: Zero-Touch Boundary Check
    runs-on: ubuntu-latest
    # Phase 0 guardrail: legacy app-specific state is allowlisted, but new
    # app-specific Argo/status/tunnel/auth/secret/monitor/UI catalog entries in
    # Enclii fail CI. Client repos must own client desired state.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python test deps
        run: pip install --quiet pytest

      - name: Run zero-touch boundary script tests
        run: pytest tests/scripts/test_check_zero_touch_boundaries.py -v

      - name: Run zero-touch boundary check
        run: ./scripts/check-zero-touch-boundaries.sh

  golden-config:
    name: Golden Config Check (Ratchet)
    runs-on: ubuntu-latest
    # Run in parallel with lint for speed
    steps:
      - uses: actions/checkout@v7

      - name: Check golden config drift
        run: |
          echo "🔒 Operation Ratchet - Golden Config Check"
          echo ""
          if [ -x "./scripts/check-golden.sh" ]; then
            ./scripts/check-golden.sh
          else
            echo "⚠️ Golden config check not available (scripts/check-golden.sh missing)"
            echo "   Run './scripts/update-golden.sh' to initialize golden configs"
            exit 0  # Graceful skip if not initialized
          fi

  image-age-ratchet:
    name: Image Age Ratchet
    runs-on: ubuntu-latest
    # Cheap (<5s on a typical PR). Runs after manifest-audit + golden-config
    # in parallel — fails the build when a kustomization-pinned digest is
    # older than 30 days. Catches the 2026-05-04 selva-office class of
    # outage: CI failed for 3+h, no image rebuild, ArgoCD silently kept
    # serving 8h-old pods. See scripts/check-image-age.py for rationale.
    permissions:
      contents: read
      packages: read  # required so GITHUB_TOKEN can pull GHCR manifests
    env:
      # Per-image exemptions go here — one env var per stale image, with a
      # short reason + ETA. Rotate them out as deps catch up.
      # Shape: AGE_RATCHET_EXEMPT_<IMAGE_LEAF>: "<reason + ETA>"
      # Example:
      #   AGE_RATCHET_EXEMPT_DOCS_SITE: "static site, low risk, ETA 2026-06"
      #
      # Initial seed (introductory-PR exemptions). The ratchet is a guardrail
      # for *future* drift; carrying these three forward as documented lets
      # the gate land without forcing an off-scope mass-rebuild from a CI PR.
      # Rotate each out as the next routine deploy of that service rebuilds.
      AGE_RATCHET_EXEMPT_LANDING_PAGE: "static marketing site, low blast radius; ETA 2026-06 with next content refresh"
      # roundhouse: api/worker image split + base bumps (alpine 3.24,
      # docker 29.6.1-dind, pack 0.40.7, cosign/syft built from source)
      # landed 2026-07. The api image (`roundhouse`) scans clean and repins
      # on the first post-split main build. The worker image
      # (`roundhouse-worker`) still fails the HIGH/CRITICAL scan gate on
      # unfixable upstream CVEs inside the dind engine binaries
      # (containerd/runc: otel, grpc, x/net — no docker release with fixes
      # yet), so its bridge pin keeps the old digest until an owner decision
      # (see infra/k8s/production/kustomization.yaml). This exemption covers
      # that bridge entry too (exemption key = newName leaf = ROUNDHOUSE).
      # ROTATE OUT: once roundhouse-worker gets a passing scan + fresh pin.
      AGE_RATCHET_EXEMPT_ROUNDHOUSE: "api/worker split landed 2026-07; api repins on next main build, worker bridge pin blocked on upstream dind engine CVEs; ETA 2026-08 or next docker release with containerd/runc fixes"
      # Added 2026-08-07 to unblock the Loki storage fix during a live incident.
      # switchyard-api crossed 30 days at 31 days (digest built 2026-07-07); the
      # ratchet tripped on the CLOCK mid-session, not on any change in this PR --
      # main was green at 16:56Z and this PR ran at 00:06Z with nothing between
      # them but time. THIS IS ACKNOWLEDGED STALENESS, NOT A FIX: the correct
      # action is a rebuild + repin via the normal CI flow, which is a deploy and
      # not something this PR can do. ETA: next switchyard-api build. If this
      # comment is still here after that, the exemption is overdue and should be
      # deleted rather than re-dated.
      AGE_RATCHET_EXEMPT_SWITCHYARD_API: "clock-trip during the 2026-08-07 Loki incident; digest 2026-07-07 is 31d; rebuild+repin owed, ETA next switchyard-api build"
      AGE_RATCHET_EXEMPT_WAYBILL: "stable manifest serializer, no upstream CVE pressure; ETA 2026-06 alongside roundhouse"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet pyyaml requests

      - name: Run image age ratchet
        env:
          # GHCR_READ_TOKEN is preferred (org-wide read:packages PAT). Falls
          # back to GITHUB_TOKEN, which works for org-public images.
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-image-age.py

  unit-tests:
    name: Unit Tests
    # Always use GitHub-hosted runners for unit tests because service containers
    # (postgres, redis) require Docker, which isn't available on ARC self-hosted runners
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        # No `credentials:` here. Dependabot runs receive an EMPTY secret store,
        # so `${{ secrets.DOCKERHUB_* }}` resolved to '' and GitHub rejected the
        # entire workflow template — the job never started, producing a bare
        # "Set up job" failure with no test output. Proven on run 31069625312
        # (event=pull_request, actor=dependabot[bot], "Secret source: Dependabot"):
        #   The template is not valid. ci.yml (Line: 320, Col: 21): Unexpected value ''
        # main stayed green throughout because pushes DO have the secrets, so this
        # read as flaky dependency PRs rather than a workflow defect, and no rebase
        # or rerun could ever have fixed it. Safe to drop: these are public official
        # images needing no auth, on a public repo using GitHub-hosted runners.
        # Same fix as coforma-studio#119.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: enclii
          POSTGRES_PASSWORD: enclii_test
          POSTGRES_DB: enclii_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        # No `credentials:` here. Dependabot runs receive an EMPTY secret store,
        # so `${{ secrets.DOCKERHUB_* }}` resolved to '' and GitHub rejected the
        # entire workflow template — the job never started, producing a bare
        # "Set up job" failure with no test output. Proven on run 31069625312
        # (event=pull_request, actor=dependabot[bot], "Secret source: Dependabot"):
        #   The template is not valid. ci.yml (Line: 320, Col: 21): Unexpected value ''
        # main stayed green throughout because pushes DO have the secrets, so this
        # read as flaky dependency PRs rather than a workflow defect, and no rebase
        # or rerun could ever have fixed it. Safe to drop: these are public official
        # images needing no auth, on a public repo using GitHub-hosted runners.
        # Same fix as coforma-studio#119.
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Auto-discover and test Go modules
        run: |
          echo "🔍 Auto-discovering Go modules for testing..."
          MODULES=$(find apps/ packages/ -name go.mod -exec dirname {} \; | sort)
          COVERAGE_FILES=""
          TEST_FAILED=0
          for mod in $MODULES; do
            # Same guard as the lint job, and the same reason: keyed on the
            # module's go.mod, not on root-level *.go files. `go test` had never
            # run on apps/switchyard-api -- including the ~3,900 lines of tests
            # added by the PR that introduced this comment, which passed a green
            # CI without executing.
            if ! find "$mod" -name '*.go' -print -quit | grep -q .; then
              echo "▶ Skipping $mod (module contains no Go files)"
              continue
            fi
            echo "▶ Testing $mod"
            (cd "$mod" && go test -v -race -coverprofile=coverage.out -covermode=atomic ./...) || TEST_FAILED=1
            if [ -f "$mod/coverage.out" ]; then
              COVERAGE_FILES="$COVERAGE_FILES,$mod/coverage.out"
            fi
          done
          echo "COVERAGE_FILES=${COVERAGE_FILES#,}" >> $GITHUB_ENV
          exit $TEST_FAILED
        env:
          DATABASE_URL: postgres://enclii:enclii_test@localhost:5432/enclii_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key
          ENV: test

      # Per-module coverage FLOORS, not a single threshold.
      #
      # The flat 50% gate only ever saw packages/otel-go (97%), because the
      # discovery guard skipped everything else. With the guard fixed, the real
      # numbers are visible for the first time, and four of the six modules are
      # under 50%:
      #
      #   apps/roundhouse      27.0%
      #   apps/switchyard-api  34.7%
      #   apps/waybill         39.8%
      #   packages/cli         39.6%
      #   packages/otel-go     97.0%
      #   packages/sdk-go      70.5%
      #
      # TODO(platform): raising these to a common 50% is real test-writing work
      # and belongs with the lint cleanup on `fix/lint-gate-honesty`, not in a
      # cross-tenant fix. Keeping the flat 50% here would have meant either a
      # red build on every PR or reverting to the guard that measured nothing.
      #
      # A floor still ratchets: coverage may rise, and any drop below the
      # recorded figure fails. The floors are set 1 point under the measured
      # value to absorb ordinary churn without going slack.
      - name: Enforce coverage floors
        if: always()
        run: |
          # Floors are set from what THIS job measured, not from a local run.
          # The first values here came from `go test ./...` on a workstation and
          # two of them were unreachable in CI: roundhouse measured 27.0 locally
          # and 25.4 here, waybill 39.8 and 35.5. CI runs with -race, which
          # changes which paths execute, so the enforcing environment is the only
          # honest source for its own floor.
          #
          # These are a ratchet, not a target. Raise one when a module genuinely
          # improves; never lower one to make a red build green -- that converts
          # a real regression into a silent allowance, which is the whole failure
          # mode this gate exists to prevent.
          declare -A FLOOR=(
            ["apps/roundhouse"]=25
            ["apps/switchyard-api"]=33
            ["apps/waybill"]=35
            ["packages/cli"]=38
            ["packages/otel-go"]=90
            ["packages/sdk-go"]=69
          )
          MODULES=$(find apps/ packages/ -name go.mod -exec dirname {} \; | sort)
          FAILED=0
          MEASURED=0
          for mod in $MODULES; do
            if [ ! -f "$mod/coverage.out" ]; then
              echo "::error::$mod produced no coverage profile; the test job did not run it"
              FAILED=1
              continue
            fi
            COV=$(go tool cover -func="$mod/coverage.out" | grep "total:" | awk '{print $NF}' | sed 's/%//')
            if [ -z "$COV" ]; then
              echo "::error::$mod coverage profile is unreadable"
              FAILED=1
              continue
            fi
            MEASURED=$((MEASURED + 1))
            MIN=${FLOOR[$mod]:-50}
            echo "$mod: ${COV}% (floor ${MIN}%)"
            if [ "$(echo "$COV < $MIN" | bc -l)" -eq 1 ]; then
              echo "::error::$mod coverage ${COV}% fell below its ${MIN}% floor"
              FAILED=1
            fi
          done
          # A gate that measured nothing must not report success. This is the
          # failure mode being repaired: "skipped" read as "passed".
          if [ "$MEASURED" -eq 0 ]; then
            echo "::error::no module produced a coverage profile; the coverage gate measured nothing"
            exit 1
          fi
          [ "${FAILED}" -eq 1 ] && exit 1
          echo "All $MEASURED modules meet their coverage floor"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.COVERAGE_FILES }}
          flags: unit
          name: enclii-coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Auto-discover and build Go binaries
        run: |
          echo "🔍 Building Go binaries from services.json..."
          mkdir -p bin
          # Build all Go services from services.json
          for svc in $(jq -r '.services[] | select(.type == "go") | .path' services.json); do
            NAME=$(basename "$svc")
            echo "▶ Building $NAME"
            # Find all cmd/ entries
            if [ -d "$svc/cmd" ]; then
              for cmd_dir in "$svc"/cmd/*/; do
                CMD_NAME=$(basename "$cmd_dir")
                echo "  → $CMD_NAME"
                (cd "$svc" && go build -o "../../bin/${NAME}-${CMD_NAME}" "./cmd/${CMD_NAME}")
              done
            fi
          done
          echo ""
          echo "Built binaries:"
          ls -la bin/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: enclii-binaries
          path: bin/
          retention-days: 7

  # Boot the built binary against a real Postgres and issue real requests.
  #
  # Until this job existed, nothing in CI started the process, ran db.Migrate,
  # or made an HTTP request. The unit-tests job declares a postgres service that
  # nothing opens, and it exports DATABASE_URL while config.Load reads
  # ENCLII_DATABASE_URL (viper prefix ENCLII) — so a whole class of defect
  # (a migration that will not apply, a route that 500s before auth, a fatal at
  # boot) could not be caught by any gate. Compiling ./cmd/api was the only
  # check that touched this module.
  smoke:
    name: API Smoke (boots + serves)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enclii
          POSTGRES_PASSWORD: enclii_test
          POSTGRES_DB: enclii_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build the API binary
        run: |
          cd apps/switchyard-api && go build -o "${RUNNER_TEMP}/switchyard-api" ./cmd/api

      # The DSN carries the password as a query parameter rather than in the
      # `//user:password@host` position. lib/pq accepts both; this form keeps a
      # throwaway service-container credential out of the shape the pre-commit
      # secret scanner (correctly) refuses to let past.
      - name: Compose the test DSN
        id: dsn
        env:
          SMOKE_PGPASSWORD: enclii_test
        run: |
          echo "value=postgres://enclii@127.0.0.1:5432/enclii_smoke?sslmode=disable&password=${SMOKE_PGPASSWORD}" >> "$GITHUB_OUTPUT"

      # Migrations, boot and HTTP assertions. The script asserts in an order
      # where a failure cannot be missed — see its header.
      - name: Boot against Postgres and assert it serves
        run: |
          ./scripts/smoke-switchyard-api.sh "${RUNNER_TEMP}/switchyard-api" "${SMOKE_DSN}"
        env:
          SMOKE_DSN: ${{ steps.dsn.outputs.value }}

      # The DB-backed regression tests. These are build-tagged `integration`, so
      # the unit-tests job does not run them; this is the job that has a real
      # server to run them against.
      - name: Cross-tenant hostname regressions against real Postgres
        run: |
          cd apps/switchyard-api && go test -tags integration -count=1 ./internal/db/...
        env:
          TEST_DATABASE_URL: ${{ steps.dsn.outputs.value }}

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    # Keep UI tests off ARC; the self-hosted pool is reserved for Docker builds.
    needs: lint
    env:
      NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        working-directory: apps/switchyard-ui
        run: pnpm install --frozen-lockfile

      - name: Run linting
        working-directory: apps/switchyard-ui
        run: pnpm run lint

      - name: Run tests
        working-directory: apps/switchyard-ui
        run: pnpm test -- --coverage

      - name: Install dispatch dependencies
        working-directory: apps/admin-console
        run: pnpm install --frozen-lockfile

      - name: Run dispatch tests
        working-directory: apps/admin-console
        run: pnpm test

      - name: Install status dependencies
        working-directory: apps/status
        run: pnpm install --frozen-lockfile

      - name: Run status tests
        working-directory: apps/status
        run: pnpm test

      - name: Install shared-lib dependencies
        working-directory: packages/shared-lib
        run: pnpm install --frozen-lockfile

      - name: Run shared-lib tests
        working-directory: packages/shared-lib
        run: pnpm test -- --passWithNoTests

      - name: Install ui-components dependencies
        working-directory: packages/ui-components
        run: pnpm install --frozen-lockfile

      - name: Run ui-components tests
        working-directory: packages/ui-components
        run: pnpm test -- --passWithNoTests

      - name: Build shared UI packages
        run: |
          pnpm --filter @enclii/shared-lib build
          pnpm --filter @enclii/ui-components build
          pnpm --filter @madfam/enclii-sdk build

      - name: Build UI
        working-directory: apps/switchyard-ui
        run: pnpm run build

  # =============================================================================
  # OPERATION FORTIFICATION: Ecosystem E2E Tests (Blocking)
  # =============================================================================
  ecosystem-e2e:
    name: Ecosystem E2E (Blocking)
    runs-on: ubuntu-latest
    needs: [build, ui-tests]
    # Only run on main branch pushes (production validation)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/e2e-ecosystem/package-lock.json

      - name: Install dependencies
        working-directory: tests/e2e-ecosystem
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: tests/e2e-ecosystem
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: tests/e2e-ecosystem
        run: npx playwright test
        env:
          CI: true
          API_BASE_URL: https://api.enclii.dev
          APP_BASE_URL: https://app.enclii.dev
          JANUA_URL: https://auth.madfam.io

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-ecosystem-report
          path: tests/e2e-ecosystem/playwright-report/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: ui-tests

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install gosec
        run: |
          set -euo pipefail
          export GOBIN="${RUNNER_TEMP}/go-bin"
          mkdir -p "$GOBIN"
          echo "$GOBIN" >> "$GITHUB_PATH"

          for attempt in 1 2 3; do
            if go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4; then
              "$GOBIN/gosec" -version
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "Failed to install gosec after 3 attempts" >&2
          exit 1

      - name: Auto-discover and scan Go modules
        run: |
          # Full-tree Go-file check. The previous guard used -maxdepth 1, which
          # skips any module whose code lives entirely under cmd//internal//pkg/
          # — i.e. the standard layout. Measured 2026-07-29: it skipped 5 of 6
          # modules (switchyard-api's 351 Go files included) while printing a
          # cheerful "Skipping (no Go files)". The scanned/skipped counters are
          # the read-proof, and scanning ZERO modules is a failure, not a pass.
          #
          # RATCHET, not a hard zero: first full-coverage run found 40
          # pre-existing findings in the never-scanned modules (measured
          # 2026-07-29 — incl. 3x G101 hardcoded-credentials and 1x G201
          # SQL-format, tracked for triage). Failing hard on all 40 would
          # freeze every unrelated merge behind old debt — the
          # permanently-red-control antipattern. A module may only come in AT
          # OR UNDER its baseline; lower the number here as findings are
          # fixed. New findings anywhere fail the gate immediately.
          #
          # Tier-1 triage 2026-07-29: all G101 verified false positives
          # (#nosec'd), waybill G201 rewritten to a constant COALESCE query,
          # 2x switchyard G201 safe-builder sites #nosec'd. Baselines below
          # re-measured with the gosec version PINNED ABOVE (v2.22.4) — the
          # runner's own read-proof showed the original 16/22 carried slack
          # from a newer-gosec measurement (v2.22.4 counts: 5/15). If the
          # pin is ever bumped, re-measure every baseline in the same run:
          # newer gosec adds rule classes (G117/G118/G122/G7xx) these
          # numbers do not cover.
          declare -A BASELINE=(
            [apps/roundhouse]=1
            [apps/switchyard-api]=1
            [apps/waybill]=0
            [packages/cli]=14
            [packages/otel-go]=0
            [packages/sdk-go]=0
          )
          MODULES=$(find apps/ packages/ -name go.mod -exec dirname {} \; | sort)
          FAILED=0
          SCANNED=0
          SKIPPED=0
          for mod in $MODULES; do
            if ! find "$mod" -name '*.go' -not -path '*/vendor/*' -print -quit | grep -q .; then
              echo "▶ Skipping $mod (no Go files anywhere in the module)"
              SKIPPED=$((SKIPPED+1))
              continue
            fi
            echo "▶ Security scan: $mod"
            OUT="$RUNNER_TEMP/gosec-$(echo "$mod" | tr / -).txt"
            (cd "$mod" && gosec -exclude=G104,G115,G204,G301,G302,G306 -exclude-generated ./...) >"$OUT" 2>&1 || true
            # gosec's own summary line ("Issues : N") is the count source — no
            # external JSON parser needed on the runner image.
            COUNT=$(grep -oE 'Issues[[:space:]]*:[[:space:]]*[0-9]+' "$OUT" | grep -oE '[0-9]+' | head -1)
            if [ -z "$COUNT" ]; then
              echo "❌ $mod: gosec emitted no summary — that is a failed read, not a pass"
              tail -20 "$OUT"
              FAILED=1
              continue
            fi
            BASE=${BASELINE[$mod]:-0}
            echo "  gosec: module=$mod issues=$COUNT baseline=$BASE"
            if [ "$COUNT" -gt "$BASE" ]; then
              echo "❌ $mod: $COUNT findings exceed the ratchet baseline of $BASE — new findings must be fixed, not accumulated"
              cat "$OUT"
              FAILED=1
            fi
            SCANNED=$((SCANNED+1))
          done
          echo "gosec read-proof: scanned=$SCANNED skipped=$SKIPPED"
          if [ "$SCANNED" -eq 0 ]; then
            echo "❌ Security scan examined ZERO modules — a scan that reads nothing must not pass"
            exit 1
          fi
          if [ $FAILED -eq 1 ]; then
            echo "❌ Security scan failures detected"
            exit 1
          fi

      - name: Check for vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Same full-tree discovery + read-proof as the gosec step above; the
          # old -maxdepth 1 guard silently limited govulncheck to 1 of 6 modules.
          MODULES=$(find apps/ packages/ -name go.mod -exec dirname {} \; | sort)
          FAILED=0
          SCANNED=0
          SKIPPED=0
          for mod in $MODULES; do
            if ! find "$mod" -name '*.go' -not -path '*/vendor/*' -print -quit | grep -q .; then
              echo "▶ Skipping $mod (no Go files anywhere in the module)"
              SKIPPED=$((SKIPPED+1))
              continue
            fi
            echo "▶ Vulnerability check: $mod"
            (cd "$mod" && govulncheck ./...) || FAILED=1
            SCANNED=$((SCANNED+1))
          done
          echo "govulncheck read-proof: scanned=$SCANNED skipped=$SKIPPED"
          if [ "$SCANNED" -eq 0 ]; then
            echo "❌ Vulnerability check examined ZERO modules — a scan that reads nothing must not pass"
            exit 1
          fi
          if [ $FAILED -eq 1 ]; then
            echo "❌ govulncheck vulnerabilities detected"
            exit 1
          fi

  # =============================================================================
  # CONSERVATION LAW (ADR-001 Law 6): Differential Builds
  # Only rebuild services that have actually changed.
  # Reads services.json to dynamically detect changes per service.
  # =============================================================================
  detect-changes:
    name: Detect Changes (Conservation Law)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_changes: ${{ steps.build-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Build service matrix from services.json
        id: build-matrix
        run: |
          echo "🔍 Conservation Law - Building change matrix from services.json..."

          # Get changed files between HEAD~1 and HEAD
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          # Build matrix of changed services
          SERVICES_JSON=$(cat services.json)
          MATRIX_INCLUDE="[]"
          FORCE_ALL=false
          REQUESTED_SERVICES="${{ github.event.inputs.services || '' }}"

          if echo "$CHANGED_FILES" | grep -q "^services.json$"; then
            echo "services.json changed; rebuilding every registered service"
            FORCE_ALL=true
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_build || 'false' }}" = "true" ]; then
            echo "workflow_dispatch force_build=true; rebuilding every registered service"
            FORCE_ALL=true
          fi
          if [ -n "$REQUESTED_SERVICES" ]; then
            echo "workflow_dispatch requested services: $REQUESTED_SERVICES"
          fi

          while IFS= read -r line; do
            NAME=$(echo "$line" | jq -r '.name')
            PATH_PREFIX=$(echo "$line" | jq -r '.path')
            DEPS=$(echo "$line" | jq -r '.dependencies // [] | .[]')
            DOCKERFILE=$(echo "$line" | jq -r '.dockerfile')
            # Optional Dockerfile stage to build (--target). Empty = final
            # stage. Lets one Dockerfile publish multiple images (e.g.
            # roundhouse api vs roundhouse-worker dind stages).
            TARGET=$(echo "$line" | jq -r '.target // ""')
            IMAGE=$(echo "$line" | jq -r '.image')
            KUSTOMIZATION=$(echo "$line" | jq -r '.kustomization')
            KUSTOMIZE_IMAGE=$(echo "$line" | jq -r '.kustomize_image')
            SCAN=$(echo "$line" | jq -r '.scan')
            BUILD_ARGS=$(echo "$line" | jq -c '.build_args // {}')

            if [ ! -d "$PATH_PREFIX" ]; then
              echo "::error::services.json entry '$NAME' path does not exist: $PATH_PREFIX"
              exit 1
            fi
            if [ ! -f "$DOCKERFILE" ]; then
              echo "::error::services.json entry '$NAME' dockerfile does not exist: $DOCKERFILE"
              exit 1
            fi
            if [ ! -d "$KUSTOMIZATION" ]; then
              echo "::error::services.json entry '$NAME' kustomization does not exist: $KUSTOMIZATION"
              exit 1
            fi
            for dep in $DEPS; do
              if [ ! -d "$dep" ]; then
                echo "::error::services.json entry '$NAME' dependency does not exist: $dep"
                exit 1
              fi
            done

            # Check if service or its dependencies changed. An explicit
            # workflow_dispatch services list is an override, not an addition
            # to changed-path detection; this keeps targeted rebuilds precise
            # after docs or workflow-only remediations.
            CHANGED=false
            if [ "$FORCE_ALL" == "true" ]; then
              CHANGED=true
            elif [ -n "$REQUESTED_SERVICES" ]; then
              if echo "$REQUESTED_SERVICES" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -qx "$NAME"; then
                CHANGED=true
              fi
            else
              if echo "$CHANGED_FILES" | grep -q "^${PATH_PREFIX}/"; then
                CHANGED=true
              fi
              for dep in $DEPS; do
                if echo "$CHANGED_FILES" | grep -q "^${dep}/"; then
                  CHANGED=true
                fi
              done
            fi

            if [ "$CHANGED" == "true" ]; then
              ENTRY=$(jq -n \
                --arg name "$NAME" \
                --arg path "$PATH_PREFIX" \
                --arg dockerfile "$DOCKERFILE" \
                --arg target "$TARGET" \
                --arg image "$IMAGE" \
                --arg kustomization "$KUSTOMIZATION" \
                --arg kustomize_image "$KUSTOMIZE_IMAGE" \
                --argjson scan "$SCAN" \
                --argjson build_args "$BUILD_ARGS" \
                '{name: $name, path: $path, dockerfile: $dockerfile, target: $target, image: $image, kustomization: $kustomization, kustomize_image: $kustomize_image, scan: $scan, build_args: $build_args}')
              MATRIX_INCLUDE=$(echo "$MATRIX_INCLUDE" | jq --argjson entry "$ENTRY" '. + [$entry]')
            fi

            echo "  $NAME: changed=$CHANGED"
          done < <(echo "$SERVICES_JSON" | jq -c '.services[]')

          COUNT=$(echo "$MATRIX_INCLUDE" | jq length)
          echo ""
          echo "📊 $COUNT service(s) need rebuilding"

          if [ "$COUNT" -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            # Output empty matrix — downstream jobs check has_changes
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "matrix=$(echo "{\"include\":$MATRIX_INCLUDE}" | jq -c '.')" >> $GITHUB_OUTPUT
          fi

  # =============================================================================
  # MATRIX DOCKER BUILD: Single template builds any service from services.json
  # =============================================================================
  docker-build:
    name: 'Build: ${{ matrix.name }}'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_runner != '' && inputs.docker_runner || (vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest') }}
    needs: [build, ui-tests, detect-changes, ecosystem-e2e]
    if: |
      always() &&
      (needs.build.result == 'success') &&
      (needs.ui-tests.result == 'success') &&
      (needs.ecosystem-e2e.result == 'success' || needs.ecosystem-e2e.result == 'skipped') &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for cosign keyless signing via OIDC
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    outputs:
      # Collect all build digests for the commit-digests job
      # Each matrix leg outputs its digest as an environment variable
      built_services: ${{ steps.collect.outputs.built_services }}

    steps:
      - uses: actions/checkout@v7

      # Wait for Docker daemon (DinD sidecar) to be ready on self-hosted runners
      - name: Wait for Docker daemon
        if: vars.ARC_BOOTSTRAP_COMPLETE == 'true'
        run: |
          echo "Waiting for Docker daemon to be ready..."
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon is ready!"
              docker version
              exit 0
            fi
            echo "Attempt $i/30: Docker not ready, waiting 2 seconds..."
            sleep 2
          done
          echo "ERROR: Docker daemon did not become ready in time"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'

      - name: Prepare build args
        id: prep
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
        run: |
          # Convert build_args JSON to Docker build-arg format
          BUILD_ARGS_JSON='${{ toJSON(matrix.build_args) }}'
          if [ "$BUILD_ARGS_JSON" != "{}" ] && [ "$BUILD_ARGS_JSON" != "null" ] && [ -n "$BUILD_ARGS_JSON" ]; then
            BUILD_ARGS=$(echo "$BUILD_ARGS_JSON" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"')
          else
            BUILD_ARGS=""
          fi
          # Append private registry token for @janua packages (switchyard-ui)
          if [ -n "$NPM_MADFAM_TOKEN" ]; then
            BUILD_ARGS=$(printf '%s\nNPM_MADFAM_TOKEN=%s' "$BUILD_ARGS" "$NPM_MADFAM_TOKEN")
          fi
          # Build identity for downstream observability (audit ST-2):
          # services that surface a build banner (e.g. enclii-status footer)
          # consume NEXT_PUBLIC_COMMIT_SHA / NEXT_PUBLIC_BUILD_DATE via
          # ARG declarations in their Dockerfile. Services that don't
          # declare the ARGs simply ignore these — `docker buildx`
          # warns but does not fail on unrecognised build-args.
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_ARGS=$(printf '%s\nNEXT_PUBLIC_COMMIT_SHA=%s\nNEXT_PUBLIC_BUILD_DATE=%s' \
            "$BUILD_ARGS" "${{ github.sha }}" "$BUILD_DATE")
          echo "build_args<<EOF" >> $GITHUB_OUTPUT
          echo "$BUILD_ARGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.name }}
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Optional Dockerfile stage from services.json (`target` field).
          # Empty string = build the final stage (action omits --target).
          target: ${{ matrix.target || '' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: ${{ steps.prep.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Sign ${{ matrix.name }} image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.docker-build.outputs.digest }}

      - name: Collect build info
        id: collect
        run: |
          DIGEST="${{ steps.docker-build.outputs.digest }}"
          echo "${{ matrix.name }}|${{ matrix.image }}|${{ matrix.kustomization }}|${{ matrix.kustomize_image }}|${DIGEST}" > /tmp/digest-${{ matrix.name }}.txt
          echo "built_services=${{ matrix.name }}:${{ matrix.image }}:${{ matrix.kustomization }}:${{ matrix.kustomize_image }}:${DIGEST}" >> $GITHUB_OUTPUT

      - name: Upload digest artifact
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.name }}
          path: /tmp/digest-${{ matrix.name }}.txt
          retention-days: 1

  # =============================================================================
  # IMAGE VULNERABILITY SCANNING: Trivy scan after Docker build
  # =============================================================================
  image-scan:
    name: 'Scan: ${{ matrix.name }}'
    runs-on: ubuntu-latest
    needs: [docker-build, detect-changes]
    # RFC 0017 Tier B (see build-publish.yml header): sibling build failures
    # must not block scanning (and later pinning) of services that DID build.
    # docker-build is a matrix job, so its aggregate result is 'failure' when
    # any one leg fails — each leg below checks for its own digest artifact
    # and skips gracefully when its build did not produce one.
    if: |
      always() &&
      contains(fromJSON('["success", "failure"]'), needs.docker-build.result) &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Download digest artifact
        if: matrix.scan == true
        # The artifact is missing when THIS service's build leg failed —
        # tolerate that (partial success) and let the resolve step decide.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: /tmp/digest-${{ matrix.name }}

      - name: Resolve scan image digest
        if: matrix.scan == true
        id: scan-ref
        run: |
          DIGEST_FILE="/tmp/digest-${{ matrix.name }}/digest-${{ matrix.name }}.txt"
          if [ ! -s "$DIGEST_FILE" ]; then
            echo "::warning::No digest artifact for ${{ matrix.name }} — its build failed or was skipped; skipping scan (RFC 0017 Tier B partial success)"
            echo "have_digest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS='|' read -r NAME IMAGE KUSTOMIZATION KUSTOMIZE_IMAGE DIGEST < "$DIGEST_FILE"
          if [ -z "$IMAGE" ] || [ -z "$DIGEST" ]; then
            echo "::error::Malformed digest artifact for ${{ matrix.name }}"
            cat "$DIGEST_FILE"
            exit 1
          fi
          echo "have_digest=true" >> "$GITHUB_OUTPUT"
          echo "image_ref=ghcr.io/${{ github.repository }}/${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: matrix.scan == true && steps.scan-ref.outputs.have_digest == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Scan ${{ matrix.name }}
        id: trivy
        if: matrix.scan == true && steps.scan-ref.outputs.have_digest == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.scan-ref.outputs.image_ref }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Without this the action ignores `severity` whenever the format is
          # sarif ("Building SARIF report with all severities") and exit-code 1
          # then fires on ANY finding — MEDIUM/LOW included. That is what
          # failed the switchyard-api/-ui scans in run 28844295061 despite
          # zero unignored HIGH/CRITICAL findings. Keep the gate at the
          # documented HIGH,CRITICAL policy.
          limit-severities-for-sarif: true
          # Root .trivyignore: justified, rotation-noted exceptions only
          # (currently the pack CLI's embedded docker/docker in the
          # switchyard-api image — see the file for the rotation condition).
          trivyignores: .trivyignore
        env:
          # Trivy authenticates to the registry ITSELF; it does not reliably
          # inherit the credentials `docker/login-action` wrote above. Without
          # these it requests an ANONYMOUS pull token, and every package under
          # madfam-org is private, so GHCR answers `DENIED: denied` and the scan
          # fails as though the image were missing:
          #
          #   remote error: GET https://ghcr.io/token?scope=repository%3A…%3Apull
          #     &service=ghcr.io: DENIED: denied
          #
          # The failure is worse than a red scan. `commit-digests` pins only
          # services whose scan passed, and switchyard-api has NO ArgoCD app and
          # NO push-triggered deploy — the digest pin IS its deploy path. So a
          # scan that cannot authenticate silently stops the service from ever
          # shipping while main CI reports the merge as done. That is exactly
          # what happened to enclii#379: merged 15:36, never deployed, and
          # `enclii secrets provision oidc --platform nauta` kept failing on a
          # control plane that predated it. See enclii#380.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_PAT || github.token }}

      - name: Record scan outcome for digest pinning
        # Runs on scan success AND failure: commit-digests consumes these
        # markers to pin only services whose own scan passed (RFC 0017
        # Tier B — a failed sibling scan must not block the others).
        if: always() && matrix.scan == true && steps.scan-ref.outputs.have_digest == 'true'
        run: |
          mkdir -p /tmp/scan-results
          if [ "${{ steps.trivy.outcome }}" = "success" ]; then
            echo "pass" > "/tmp/scan-results/scan-result-${{ matrix.name }}.txt"
          else
            echo "fail" > "/tmp/scan-results/scan-result-${{ matrix.name }}.txt"
          fi

      - name: Upload scan outcome artifact
        if: always() && matrix.scan == true && steps.scan-ref.outputs.have_digest == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: scan-result-${{ matrix.name }}
          path: /tmp/scan-results/scan-result-${{ matrix.name }}.txt
          retention-days: 1

      - name: Skip scan (not configured)
        if: matrix.scan != true
        run: echo "⏭️ Trivy scan not enabled for ${{ matrix.name }}"

      - name: Upload Trivy SARIF results
        if: always() && matrix.scan == true && steps.scan-ref.outputs.have_digest == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .
        continue-on-error: true

  # =============================================================================
  # UNIFIED DIGEST COMMIT: Update ALL kustomization files with image digests
  # Replaces commit-core-digests + commit-ecosystem-digests
  # Groups services by kustomization path to minimize commits
  # =============================================================================
  commit-digests:
    name: Commit Image Digests
    runs-on: ubuntu-latest
    needs: [docker-build, image-scan, detect-changes]
    # RFC 0017 Tier B (see build-publish.yml header): sibling failures must
    # NOT block deploy of successful builds. docker-build and image-scan are
    # matrix jobs whose aggregate result is 'failure' if any one leg fails
    # (this skipped every pin in run 28844290008 when roundhouse/waybill
    # failed to build, leaving dispatch's good image unpinned). Run whenever
    # at least the build matrix executed, then gate PER SERVICE below on
    # that service's own digest artifact + scan outcome.
    if: |
      always() &&
      contains(fromJSON('["success", "failure"]'), needs.docker-build.result) &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_build == 'true'))
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Install kustomize
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION="v5.4.3"
          curl -fsSLo /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Download all digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Download scan outcome artifacts
        # Uploaded by the image-scan matrix legs. A service with scan
        # enabled is only pinned when its own marker reads "pass".
        # Tolerate zero matches (no scan-enabled service built this run).
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: scan-result-*
          path: /tmp/scan-results
          merge-multiple: true

      - name: Login to GHCR (for signature verification)
        # Private GHCR packages require registry auth for cosign verify's
        # signature manifest reads. Prefer the org package PAT when present,
        # matching the reusable build-publish workflow.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'

      - name: Update all service digests from build artifacts
        run: |
          UPDATED=0
          MODIFIED_FILES=""
          MATRIX='${{ needs.detect-changes.outputs.matrix }}'

          # Get list of services that were actually built (from the matrix)
          BUILT_NAMES=$(echo "$MATRIX" | jq -r '.include[].name')

          # Build a lookup map from digest artifacts (primary source — no GHCR delay)
          declare -A ARTIFACT_DIGESTS
          if [ -d /tmp/digests ]; then
            for f in /tmp/digests/digest-*.txt; do
              [ -f "$f" ] || continue
              IFS='|' read -r A_NAME A_IMAGE A_KUST A_KUST_IMAGE A_DIGEST < "$f"
              ARTIFACT_DIGESTS["$A_NAME"]="$A_IMAGE|$A_KUST|$A_KUST_IMAGE|$A_DIGEST"
              echo "Loaded artifact digest for ${A_NAME}: ${A_DIGEST}"
            done
          fi

          for NAME in $BUILT_NAMES; do
            DIGEST=""
            IMAGE=""
            KUSTOMIZATION=""
            KUSTOMIZE_IMAGE=""

            # Primary: use digest from build artifact (instant, no network)
            if [ -n "${ARTIFACT_DIGESTS[$NAME]:-}" ]; then
              IFS='|' read -r IMAGE KUSTOMIZATION KUSTOMIZE_IMAGE DIGEST <<< "${ARTIFACT_DIGESTS[$NAME]}"
              echo "Using artifact digest for ${NAME}: ${DIGEST}"
            fi

            # Do not resolve from GHCR when the artifact is missing. The build
            # artifact digest is the signed source of truth; resolving tags or
            # manifests after the fact can pin an unsigned digest into GitOps.
            if [ -z "$DIGEST" ]; then
              echo "WARNING: Missing digest artifact for ${NAME}; skipping this service instead of pinning an unverifiable registry fallback"
              continue
            fi

            # Per-service scan gate (RFC 0017 Tier B): a scan-enabled service
            # is pinned only when ITS OWN Trivy scan passed in this run.
            # Sibling scan failures skip only that sibling.
            SCAN_REQUIRED=$(echo "$MATRIX" | jq -r --arg name "$NAME" '.include[] | select(.name == $name) | .scan')
            if [ "$SCAN_REQUIRED" = "true" ]; then
              SCAN_RESULT_FILE="/tmp/scan-results/scan-result-${NAME}.txt"
              if [ ! -f "$SCAN_RESULT_FILE" ] || [ "$(cat "$SCAN_RESULT_FILE")" != "pass" ]; then
                echo "WARNING: Trivy scan for ${NAME} is missing or did not pass; skipping pin for this service (siblings still deploy)"
                continue
              fi
            fi

            if [ -n "$DIGEST" ]; then
              REF="ghcr.io/${{ github.repository }}/${IMAGE}@${DIGEST}"
              echo "Verifying cosign signature for ${REF}"

              VERIFIED=0
              for WAIT in 0 5 10 20 30 60; do
                if [ "$WAIT" -gt 0 ]; then
                  echo "Signature not visible yet for ${REF}, retrying in ${WAIT}s..."
                  sleep "$WAIT"
                fi

                if COSIGN_EXPERIMENTAL=1 cosign verify \
                  --certificate-identity-regexp='^https://github\.com/madfam-org/[A-Za-z0-9_.-]+/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml@refs/(heads/main|tags/v[0-9].*)$' \
                  --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
                  "$REF" >/tmp/cosign-verify-${NAME}.json 2>/tmp/cosign-verify-${NAME}.err; then
                  VERIFIED=1
                  break
                fi
              done

              if [ "$VERIFIED" -ne 1 ]; then
                echo "WARNING: Refusing to pin unsigned or unverifiable digest ${REF}; skipping this service"
                cat /tmp/cosign-verify-${NAME}.err || true
                continue
              fi

              echo "Updating ${NAME} in ${KUSTOMIZATION}: signed digest=${DIGEST}"
              (cd "${KUSTOMIZATION}" && kustomize edit set image "${KUSTOMIZE_IMAGE}=ghcr.io/${{ github.repository }}/${IMAGE}@${DIGEST}")
              UPDATED=$((UPDATED + 1))
              KUST_FILE="${KUSTOMIZATION}/kustomization.yaml"
              if ! echo "$MODIFIED_FILES" | grep -q "$KUST_FILE"; then
                MODIFIED_FILES="$MODIFIED_FILES $KUST_FILE"
              fi
            else
            echo "ERROR: Could not resolve ${NAME} digest from artifact"
          fi
          done

          echo "Updated $UPDATED service digest(s)"
          echo "UPDATED=$UPDATED" >> $GITHUB_ENV
          echo "MODIFIED_FILES=$MODIFIED_FILES" >> $GITHUB_ENV

          EXPECTED=$(echo "$BUILT_NAMES" | wc -l | tr -d ' ')
          if [ "$UPDATED" -lt "$EXPECTED" ]; then
            echo "WARNING: Only $UPDATED/$EXPECTED service digests resolved"
          fi

          if [ "$UPDATED" -eq 0 ]; then
            echo "ERROR: No digests resolved despite $EXPECTED services built"
            exit 1
          fi

          # Save modified kustomization files for retry
          for f in $MODIFIED_FILES; do
            BACKUP="/tmp/$(echo "$f" | tr '/' '_')"
            cp "$f" "$BACKUP"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retry loop: handles concurrent pushes
          for ATTEMPT in 1 2 3; do
            echo "Push attempt $ATTEMPT/3"
            git fetch origin main
            git reset --hard origin/main

            # Re-apply our digest changes on top of latest remote
            for f in $MODIFIED_FILES; do
              BACKUP="/tmp/$(echo "$f" | tr '/' '_')"
              cp "$BACKUP" "$f"
            done

            git add $MODIFIED_FILES
            git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
            git commit -m "chore(deploy): update $UPDATED service digest(s)"

            if git push origin main; then
              echo "Push succeeded on attempt $ATTEMPT"
              exit 0
            fi
            echo "Push failed (likely concurrent update), retrying..."
            sleep $((ATTEMPT * 2))
          done
          echo "ERROR: Failed to push after 3 attempts"
          exit 1

  # =============================================================================
  # DEPLOYMENT VERIFICATION: Validate ArgoCD sync and smoke test production
  # =============================================================================
  verify-deployment:
    name: Verify Deployment Trigger
    runs-on: ubuntu-latest
    needs: [docker-build, detect-changes]
    if: |
      always() &&
      needs.docker-build.result == 'success' &&
      github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Setup and Validate kubectl
        id: kubectl-setup
        run: |
          # Check if KUBECONFIG_PRODUCTION secret is configured
          KUBECONFIG_B64="${{ secrets.KUBECONFIG_PRODUCTION }}"

          if [ -z "$KUBECONFIG_B64" ]; then
            echo "⚠️  KUBECONFIG_PRODUCTION secret not configured"
            echo "   Deployment verification will be skipped"
            echo "   To enable: Add KUBECONFIG_PRODUCTION secret with base64-encoded kubeconfig"
            echo "has_cluster_access=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Setup kubeconfig
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          # Validate cluster connectivity (5s timeout)
          if kubectl cluster-info --request-timeout=5s &>/dev/null; then
            echo "✅ Cluster access verified"
            echo "has_cluster_access=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Cannot connect to cluster (kubeconfig may be invalid or cluster unreachable)"
            echo "   Deployment verification will be skipped"
            echo "has_cluster_access=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for ArgoCD sync
        if: steps.kubectl-setup.outputs.has_cluster_access == 'true'
        run: |
          echo "⏳ Waiting 30s for ArgoCD to detect digest changes..."
          sleep 30

      - name: Check ArgoCD Application Status
        if: steps.kubectl-setup.outputs.has_cluster_access == 'true'
        run: |
          echo "🔍 Checking ArgoCD applications..."
          kubectl get applications -n argocd -o wide

      - name: Check Image Updates (dynamic from services.json)
        if: steps.kubectl-setup.outputs.has_cluster_access == 'true'
        run: |
          echo "📋 Checking current images in deployments..."
          SERVICES_JSON=$(cat services.json)
          echo "$SERVICES_JSON" | jq -r '.services[] | select(.deploy_check != null) | .deploy_check' | while read deploy; do
            IMAGE=$(kubectl get deployment "$deploy" -n enclii -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "not found")
            echo "  $deploy: $IMAGE"
          done

      - name: Production smoke test
        if: steps.kubectl-setup.outputs.has_cluster_access == 'true'
        run: |
          echo "🏥 Running production smoke tests..."
          FAILED=0
          for url in https://api.enclii.dev/health https://app.enclii.dev https://auth.madfam.io/health; do
            echo "Checking $url..."
            SUCCESS=0
            for attempt in 1 2 3; do
              if curl -sf --max-time 10 "$url" > /dev/null; then
                SUCCESS=1
                break
              fi
              echo "  ⏳ Attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            if [ $SUCCESS -eq 1 ]; then
              echo "  ✅ $url"
            else
              echo "  ❌ FAILED: $url (after 3 attempts)"
              FAILED=1
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "❌ Smoke tests failed!"
            exit 1
          fi
          echo "✅ All smoke tests passed"

      - name: Validate NetworkPolicy Port Consistency
        if: steps.kubectl-setup.outputs.has_cluster_access == 'true'
        run: |
          echo "🔍 Validating NetworkPolicy port consistency..."
          ./scripts/validate-network-ports.sh || echo "⚠️  Port mismatches detected (non-blocking)"
        continue-on-error: true

      - name: Skip Notice
        if: steps.kubectl-setup.outputs.has_cluster_access != 'true'
        run: |
          echo "ℹ️  Deployment verification skipped (no cluster access)"
          echo ""
          echo "To enable deployment verification:"
          echo "  1. Generate kubeconfig with cluster access"
          echo "  2. Base64 encode: cat kubeconfig | base64 -w0"
          echo "  3. Add as repository secret: KUBECONFIG_PRODUCTION"
          echo ""
          echo "This job will pass but deployment status was not verified."

  # =============================================================================
  # LIFECYCLE EVENTS: Report build status to Enclii deployment tracking
  # =============================================================================
  report-lifecycle:
    name: Report Lifecycle Events
    runs-on: ubuntu-latest
    needs: [docker-build, detect-changes, commit-digests]
    if: |
      always() &&
      needs.docker-build.result == 'success' &&
      needs.commit-digests.result == 'success' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Report build events from services.json
        run: |
          MATRIX='${{ needs.detect-changes.outputs.matrix }}'
          BUILT_NAMES=$(echo "$MATRIX" | jq -r '.include[].name')

          for SERVICE in $BUILT_NAMES; do
            # Report image_pushed event
            echo "Reporting image_pushed for $SERVICE..."
            curl -sf -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
              -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{
                "repo_full_name": "madfam-org/enclii",
                "commit_sha": "${{ github.sha }}",
                "branch": "${{ github.ref_name }}",
                "ref": "${{ github.ref }}",
                "event_type": "image_pushed",
                "source": "ci_callback",
                "message": "'"$SERVICE"' build image_pushed",
                "metadata": {
                  "image": "ghcr.io/madfam-org/enclii/'"$SERVICE"'",
                  "workflow": "ci",
                  "service": "'"$SERVICE"'",
                  "commit_digests_result": "${{ needs.commit-digests.result }}"
                }
              }' || true

            # Report digest_committed event
            echo "Reporting digest_committed for $SERVICE..."
            curl -sf -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
              -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{
                "repo_full_name": "madfam-org/enclii",
                "commit_sha": "${{ github.sha }}",
                "branch": "${{ github.ref_name }}",
                "ref": "${{ github.ref }}",
                "event_type": "digest_committed",
                "source": "ci_callback",
                "message": "'"$SERVICE"' digest committed to kustomization",
                "metadata": {
                  "image": "ghcr.io/madfam-org/enclii/'"$SERVICE"'",
                  "workflow": "ci",
                  "service": "'"$SERVICE"'"
                }
              }' || true
          done

  # =============================================================================
  # BUILD FAILURE REPORTING: Report failed builds to lifecycle tracking
  # =============================================================================
  report-build-failure:
    name: Report Build Failures
    runs-on: ubuntu-latest
    needs: [docker-build, detect-changes]
    if: |
      always() &&
      needs.docker-build.result == 'failure' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Report build failure events
        run: |
          MATRIX='${{ needs.detect-changes.outputs.matrix }}'
          BUILT_NAMES=$(echo "$MATRIX" | jq -r '.include[].name')
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          for SERVICE in $BUILT_NAMES; do
            echo "Reporting build_failed for $SERVICE..."
            curl -sf -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
              -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{
                "repo_full_name": "madfam-org/enclii",
                "commit_sha": "${{ github.sha }}",
                "branch": "${{ github.ref_name }}",
                "ref": "${{ github.ref }}",
                "event_type": "build_failed",
                "source": "ci_callback",
                "message": "'"$SERVICE"' build failed",
                "metadata": {
                  "image": "ghcr.io/madfam-org/enclii/'"$SERVICE"'",
                  "workflow": "ci",
                  "service": "'"$SERVICE"'",
                  "run_url": "'"$RUN_URL"'"
                }
              }' || true
          done

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, ui-tests, security-scan, manifest-audit, golden-config, status-configmap-drift, zero-touch-boundary, networkpolicy-port-lint, image-age-ratchet, ecosystem-e2e, dependabot-secret-trap-lint]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "❌ Security scan failed"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Lint failed"
            exit 1
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          if [ "${{ needs.ui-tests.result }}" != "success" ]; then
            echo "❌ UI tests failed"
            exit 1
          fi
          if [ "${{ needs.manifest-audit.result }}" != "success" ]; then
            echo "❌ Manifest audit failed (Operation Ratchet)"
            exit 1
          fi
          if [ "${{ needs.golden-config.result }}" != "success" ]; then
            echo "❌ Golden config check failed (Operation Ratchet)"
            exit 1
          fi
          if [ "${{ needs.status-configmap-drift.result }}" != "success" ]; then
            echo "❌ Status configmap drift check failed (audit ST-3)"
            exit 1
          fi
          if [ "${{ needs.zero-touch-boundary.result }}" != "success" ]; then
            echo "❌ Zero-touch boundary check failed (new app-specific Enclii catalog state detected)"
            exit 1
          fi
          if [ "${{ needs.dependabot-secret-trap-lint.result }}" != "success" ]; then
            echo "Dependabot secret-trap lint failed — a workflow is unrunnable by Dependabot"
            FAILED=1
          fi
          if [ "${{ needs.networkpolicy-port-lint.result }}" != "success" ]; then
            echo "❌ NetworkPolicy port consistency check failed (prevents 2026-05-04 outage class)"
            exit 1
          fi
          if [ "${{ needs.image-age-ratchet.result }}" != "success" ]; then
            echo "❌ Image Age Ratchet failed (digest >30d behind main — see scripts/check-image-age.py)"
            exit 1
          fi
          # Ecosystem E2E is only required on main branch pushes
          if [ "${{ needs.ecosystem-e2e.result }}" == "failure" ]; then
            echo "❌ Ecosystem E2E failed (Operation Fortification)"
            exit 1
          fi
          echo "✅ All CI checks passed (including Operation Ratchet + Fortification)!"
