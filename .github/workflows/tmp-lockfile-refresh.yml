# TEMPORARY, this branch only: regenerate pnpm-lock.yaml with the registry
# credential CI already holds (org secret NPM_MADFAM_TOKEN), then prove the
# admin-console migration against it (frozen install, jest, tsc) and publish
# the lockfile as an artifact. No secret leaves the job.
# Removed in the commit that lands the lockfile (same pattern as #813).
name: tmp lockfile refresh
on:
  push:
    branches: [fix/admin-console-k8s-client-node-1x]
    paths:
      - apps/admin-console/package.json
      - .github/workflows/tmp-lockfile-refresh.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regenerate the lockfile only
        run: |
          set -euo pipefail
          test -n "$NPM_MADFAM_TOKEN" || { echo "::error::NPM_MADFAM_TOKEN is empty in this run"; exit 1; }
          pnpm install --lockfile-only --ignore-scripts
          git diff --stat -- pnpm-lock.yaml
          for p in request tough-cookie uuid @kubernetes/client-node; do
            echo "$p: $(grep -oE "^  '?$p@[0-9][^:']*" pnpm-lock.yaml | sort -u | tr '\n' ' ')"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-k8s-client-node-1x
          path: pnpm-lock.yaml
          retention-days: 1
      - name: Install dispatch dependencies against the new lockfile
        working-directory: apps/admin-console
        run: pnpm install --frozen-lockfile
      - name: Run dispatch tests
        working-directory: apps/admin-console
        run: pnpm test
      - name: Type-check dispatch
        working-directory: apps/admin-console
        run: npx tsc --noEmit -p .
