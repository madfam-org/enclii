name: Blueprint DB Migrate

# Run Alembic migration 002+ against production Postgres using the API image.
# Requires blueprint-harvester GitOps API digest to include db/migrations.

on:
  workflow_dispatch:
    inputs:
      deploy_ack:
        description: Type "production-kustomization" to acknowledge production DB migration.
        required: true
        type: string
      reason:
        description: Audit reason (min 12 characters)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  preflight:
    name: Acknowledgement
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          DEPLOY_ACK: ${{ inputs.deploy_ack }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ACK" != "production-kustomization" ]; then
            echo "deploy_ack must be production-kustomization"
            exit 1
          fi
          if [ ${#REASON} -lt 12 ]; then
            echo "reason must be at least 12 characters"
            exit 1
          fi

  migrate:
    name: Run blueprint-harvester-db-migrate
    needs: preflight
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          repository: madfam-org/blueprint-harvester
          ref: main
          token: ${{ secrets.GHCR_PAT }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0

      - name: Resolve API image digest
        id: image
        run: |
          set -euo pipefail
          FILE="infra/k8s/production/kustomization.yaml"
          DIGEST="$(grep -B1 'name: ghcr.io/madfam-org/blueprint-harvester/api$' "$FILE" \
            | grep 'digest:' | sed 's/.*digest:[[:space:]]*//' | tr -d ' \r')"
          if [ -z "${DIGEST}" ]; then
            echo "Could not resolve API digest from kustomization.yaml" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Using API image digest ${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign API digest (Kyverno)
        env:
          COSIGN_EXPERIMENTAL: "true"
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          API_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          echo "${GHCR_PAT}" | docker login ghcr.io -u madfam-bot --password-stdin
          REF="ghcr.io/madfam-org/blueprint-harvester/api@${API_DIGEST}"
          if COSIGN_EXPERIMENTAL=1 cosign verify \
            --certificate-identity-regexp='^https://github\.com/madfam-org/[A-Za-z0-9_.-]+/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml@refs/(heads/main|tags/v[0-9].*)$' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            "${REF}" 2>/dev/null; then
            echo "Digest already signed: ${REF}"
          else
            echo "Signing ${REF}"
            cosign sign --yes "${REF}"
          fi

      - name: Run migration via API pod
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="blueprint-harvester"
          BUNDLE_DIR="$(mktemp -d)"
          cp -a db/migrations/. "${BUNDLE_DIR}/"
          cp scripts/run_prod_alembic_migrate.sh "${BUNDLE_DIR}/"
          cp scripts/normalize_migrate_database_url.py "${BUNDLE_DIR}/"
          cp scripts/verify_tag_provenance_schema.py "${BUNDLE_DIR}/"
          tar czf /tmp/migrate.tgz -C "${BUNDLE_DIR}" .
          rm -rf "${BUNDLE_DIR}"
          API_POD="$(kubectl get pods -n "$NS" -l app=blueprint-harvester-api \
            -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.metadata.name}{"\n"}{end}' | head -1)"
          if [ -z "${API_POD}" ]; then
            echo "::error::No running blueprint-harvester-api pod"
            exit 1
          fi
          echo "Running Alembic in pod ${API_POD} (reason: ${REASON})"
          kubectl cp /tmp/migrate.tgz "${NS}/${API_POD}:/tmp/migrate.tgz"
          kubectl exec -n "$NS" "${API_POD}" -- sh -c '
            set -eu
            export PYTHONPATH=/app
            BUNDLE=/tmp/migrate-bundle
            rm -rf "${BUNDLE}"
            mkdir -p "${BUNDLE}"
            tar xzf /tmp/migrate.tgz -C "${BUNDLE}"
            cd "${BUNDLE}"
            sh run_prod_alembic_migrate.sh
          '
          kubectl annotate deployment blueprint-harvester-api -n "$NS" \
            enclii.dev/last-db-migrate-reason="$REASON" --overwrite

      - name: Patch admin catalog token (optional)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
          ADMIN_TOKEN: ${{ secrets.BLUEPRINT_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::warning::BLUEPRINT_ADMIN_API_TOKEN not set on enclii; skip secret patch"
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="blueprint-harvester"
          kubectl patch secret blueprint-harvester-secrets -n "$NS" --type merge \
            -p "{\"stringData\":{\"BLUEPRINT_ADMIN_API_TOKEN\":\"${ADMIN_TOKEN}\"}}"
          echo "Patched BLUEPRINT_ADMIN_API_TOKEN in blueprint-harvester-secrets"
