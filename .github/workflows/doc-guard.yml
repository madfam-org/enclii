# DocGuard Workflow - Documentation Quality Enforcement
#
# Part of the Solarpunk Foundry ecosystem
# Checks: env var documentation, banned terminology, dead links
#
# Source: https://github.com/madfam-org/solarpunk-foundry
#
# Scans active doc trees only (excludes docs/archive and repo-root README/ROADMAP
# competitor mentions until a dedicated terminology cleanup lands).

name: Documentation Lint

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '.env.example'
      - '.github/workflows/doc-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '.env.example'
      - '.github/workflows/doc-guard.yml'

jobs:
  doc-guard:
    name: DocGuard
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        doc-path:
          - docs/production
          - docs/runbooks
          - docs/architecture
          - docs/cli
    steps:
      - uses: actions/checkout@v7

      - name: Run DocGuard (${{ matrix.doc-path }})
        uses: madfam-org/solarpunk-foundry/.github/actions/doc-guard@1915aa192c8422fd7171dc6f8bd9cf9e54dfb88d # main (2026-09-23)
        with:
          doc-path: './${{ matrix.doc-path }}'
          strict: true
          check-links: false
          check-env-vars: false
          # Terminology: disabled until competitive-analysis docs are rewritten or
          # archived (see docs/production/COMMERCIAL_GA_TRACKER.md). Link/env
          # checks remain off for this workflow.
          check-terminology: false
