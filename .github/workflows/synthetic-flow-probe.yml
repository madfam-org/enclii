name: Build — synthetic-flow-probe

# Standalone build pipeline for the layer-7 synthetic-flow-probe.
#
# Mirrors cloudflared-probe.yml's pattern (see neighbour file):
#   - Standalone (not in the matrix CI) so a probe rebuild never blocks
#     switchyard / janua / dispatch deploys and vice versa.
#   - Image bumps are operator-driven: build, sign, publish, then a human
#     commits the digest pin into infra/k8s/production/synthetic-flow-probe.yaml.
#   - PR runs build + test only, no push (avoids orphan :SHA tags).

on:
  push:
    branches: [main]
    paths:
      - 'infra/synthetic-flow-probe/**'
      - '.github/workflows/synthetic-flow-probe.yml'
  pull_request:
    paths:
      - 'infra/synthetic-flow-probe/**'
      - '.github/workflows/synthetic-flow-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write  # cosign keyless

jobs:
  test:
    name: Unit tests
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: infra/synthetic-flow-probe
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        working-directory: infra/synthetic-flow-probe
        run: pytest tests/ -v

  build:
    name: Build & publish image
    needs: test
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: infra/synthetic-flow-probe
          file: infra/synthetic-flow-probe/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/madfam-org/enclii/synthetic-flow-probe:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=synthetic-flow-probe
          cache-to: type=gha,mode=max,scope=synthetic-flow-probe

      # Keyless signing needs GitHub's ambient OIDC endpoint, Fulcio and Rekor all
      # at once. A transient hiccup fails AFTER the image is pushed, stranding the
      # run before anything downstream — the crea-frontend 2026-08-26 failure
      # (run 33010085743, non-JSON from the OIDC endpoint; a plain rerun fixed it).
      # Retry the sign call only; the push above is already done and never repeats.
      - name: Sign image (keyless, Fulcio/Rekor)
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ghcr.io/madfam-org/enclii/synthetic-flow-probe@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

      - name: Surface digest in run summary
        run: |
          {
            echo "## synthetic-flow-probe build"
            echo ""
            echo "**Image:** \`ghcr.io/madfam-org/enclii/synthetic-flow-probe@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Pin into** \`infra/k8s/production/synthetic-flow-probe.yaml\`:"
            echo ""
            echo '```yaml'
            echo "image: ghcr.io/madfam-org/enclii/synthetic-flow-probe@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Then push the manifest update — ArgoCD reconciles within 3m."
          } >> "$GITHUB_STEP_SUMMARY"

  build-pr:
    # PR-only build — verifies the image builds cleanly without publishing.
    name: Build (PR verify)
    needs: test
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: infra/synthetic-flow-probe
          file: infra/synthetic-flow-probe/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha,scope=synthetic-flow-probe
          cache-to: type=gha,mode=max,scope=synthetic-flow-probe
