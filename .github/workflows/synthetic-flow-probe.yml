name: Build — synthetic-flow-probe

# Standalone build pipeline for the layer-7 synthetic-flow-probe.
#
# Mirrors cloudflared-probe.yml's pattern (see neighbour file):
#   - Standalone (not in the matrix CI) so a probe rebuild never blocks
#     switchyard / janua / dispatch deploys and vice versa.
#   - Image bumps are operator-driven: build, sign, publish, then a human
#     commits the digest pin into infra/k8s/production/synthetic-flow-probe.yaml.
#   - PR runs build + test only, no push (avoids orphan :SHA tags).

on:
  push:
    branches: [main]
    paths:
      - 'infra/synthetic-flow-probe/**'
      - '.github/workflows/synthetic-flow-probe.yml'
  pull_request:
    paths:
      - 'infra/synthetic-flow-probe/**'
      - '.github/workflows/synthetic-flow-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write  # cosign keyless

jobs:
  test:
    name: Unit tests
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: infra/synthetic-flow-probe
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        working-directory: infra/synthetic-flow-probe
        run: pytest tests/ -v

  build:
    name: Build & publish image
    needs: test
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: infra/synthetic-flow-probe
          file: infra/synthetic-flow-probe/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/madfam-org/enclii/synthetic-flow-probe:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=synthetic-flow-probe
          cache-to: type=gha,mode=max,scope=synthetic-flow-probe

      - name: Sign image (keyless, Fulcio/Rekor)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes "ghcr.io/madfam-org/enclii/synthetic-flow-probe@${{ steps.build.outputs.digest }}"

      - name: Surface digest in run summary
        run: |
          {
            echo "## synthetic-flow-probe build"
            echo ""
            echo "**Image:** \`ghcr.io/madfam-org/enclii/synthetic-flow-probe@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Pin into** \`infra/k8s/production/synthetic-flow-probe.yaml\`:"
            echo ""
            echo '```yaml'
            echo "image: ghcr.io/madfam-org/enclii/synthetic-flow-probe@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Then push the manifest update — ArgoCD reconciles within 3m."
          } >> "$GITHUB_STEP_SUMMARY"

  build-pr:
    # PR-only build — verifies the image builds cleanly without publishing.
    name: Build (PR verify)
    needs: test
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: infra/synthetic-flow-probe
          file: infra/synthetic-flow-probe/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha,scope=synthetic-flow-probe
          cache-to: type=gha,mode=max,scope=synthetic-flow-probe
