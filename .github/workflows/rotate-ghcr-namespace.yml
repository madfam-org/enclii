name: Rotate GHCR credentials (namespace)

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Target namespace for ghcr-credentials refresh
        required: true
        type: string
      reason:
        description: Audit reason (min 12 chars)
        required: true
        type: string

permissions:
  contents: read

jobs:
  rotate:
    name: Rotate ghcr-credentials in ${{ inputs.namespace }}
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Validate inputs
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ ${#REASON} -lt 12 ]; then
            echo "reason must be at least 12 characters"
            exit 1
          fi

      - uses: azure/setup-kubectl@v5

      - name: Rotate GHCR pull secret
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: madfam-bot
          NS: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_PAT:-}" ]; then
            echo "::error::GHCR_PAT not configured on madfam-org/enclii"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          kubectl cluster-info --request-timeout=15s
          kubectl create secret docker-registry ghcr-credentials \
            --namespace="${NS}" \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_USERNAME}" \
            --docker-password="${GHCR_PAT}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Updated ${NS}/ghcr-credentials"

      - name: Restart janua-website if applicable
        if: inputs.namespace == 'janua'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          kubectl rollout restart deployment/janua-website -n janua
          kubectl rollout status deployment/janua-website -n janua --timeout=300s
