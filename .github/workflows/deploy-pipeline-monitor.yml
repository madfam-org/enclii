name: Build — deploy-pipeline-monitor

# Standalone build pipeline for the deploy-pipeline freshness monitor.
#
# Mirrors the cloudflared-probe workflow (.github/workflows/cloudflared-probe.yml):
#   - PR/push touching infra/deploy-pipeline-monitor/** → build + smoke (no push)
#   - main push touching infra/deploy-pipeline-monitor/** → build, sign, push :SHA
#   - workflow_dispatch → build, sign, push :SHA
#
# Image is consumed by infra/k8s/production/monitoring/deploy-pipeline-monitor.yaml.
# After publish, the operator copies the digest from the run summary into the
# `image: ghcr.io/.../deploy-pipeline-monitor@sha256:<digest>` line and pushes
# the manifest update — ArgoCD (`deploy-pipeline-monitor` Application)
# reconciles within ~3m.

on:
  push:
    branches: [main]
    paths:
      - 'infra/deploy-pipeline-monitor/**'
      - '.github/workflows/deploy-pipeline-monitor.yml'
  pull_request:
    paths:
      - 'infra/deploy-pipeline-monitor/**'
      - '.github/workflows/deploy-pipeline-monitor.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write  # cosign keyless

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: infra/deploy-pipeline-monitor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        working-directory: infra/deploy-pipeline-monitor
        run: pytest tests/ -v

  build:
    name: Build & publish image
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: infra/deploy-pipeline-monitor
          file: infra/deploy-pipeline-monitor/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          # No :latest — Kyverno disallow-latest-tag rejects.
          tags: |
            ghcr.io/madfam-org/enclii/deploy-pipeline-monitor:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=deploy-pipeline-monitor
          cache-to: type=gha,mode=max,scope=deploy-pipeline-monitor

      # Keyless signing needs GitHub's ambient OIDC endpoint, Fulcio and Rekor all
      # at once. A transient hiccup fails AFTER the image is pushed, stranding the
      # run before anything downstream — the crea-frontend 2026-08-26 failure
      # (run 33010085743, non-JSON from the OIDC endpoint; a plain rerun fixed it).
      # Retry the sign call only; the push above is already done and never repeats.
      - name: Sign image (keyless, Fulcio/Rekor)
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ghcr.io/madfam-org/enclii/deploy-pipeline-monitor@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

      - name: Commit digest pin
        id: pin_commit
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Matches both the all-zero sentinel and any previously pinned digest.
          apply_our_digest() {
            sed -E -i "s#ghcr.io/madfam-org/enclii/deploy-pipeline-monitor(@sha256:[a-f0-9]{64}|:[A-Za-z0-9._-]+)#ghcr.io/madfam-org/enclii/deploy-pipeline-monitor@${DIGEST}#g" infra/k8s/production/monitoring/deploy-pipeline-monitor.yaml
          }
          apply_our_digest
          git add infra/k8s/production/monitoring/deploy-pipeline-monitor.yaml
          git diff --cached --quiet && echo "Digest already pinned" && exit 0
          git commit -m "build: pin deploy-pipeline-monitor image"
          # The push races other pins landing on main: several self-pinning
          # workflows fire on the same push (2026-10-01, run 36815916309 lost
          # this race and left a built image unpinned). Same recovery as the
          # commit-digests job in build-publish.yml: on rejection, reset onto
          # the fresh tip and re-apply our digest (idempotent) rather than
          # rebasing, then retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt ${attempt} rejected (non-fast-forward); reset onto fresh main and re-apply the digest"
            sleep $((attempt * 2))
            git fetch origin main
            git reset --hard origin/main
            apply_our_digest
            if git diff --quiet -- infra/k8s/production/monitoring/deploy-pipeline-monitor.yaml; then
              echo "Fresh main already pins this digest; nothing to push."
              exit 0
            fi
            git add infra/k8s/production/monitoring/deploy-pipeline-monitor.yaml
            git commit -m "build: pin deploy-pipeline-monitor image"
          done
          echo "::error::Could not push the deploy-pipeline-monitor digest pin after 5 attempts; investigate push contention on main."
          exit 1

      - name: Surface digest in run summary
        run: |
          {
            echo "## deploy-pipeline-monitor build"
            echo ""
            echo "**Image:** \`ghcr.io/madfam-org/enclii/deploy-pipeline-monitor@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Pinned into** \`infra/k8s/production/monitoring/deploy-pipeline-monitor.yaml\` on main pushes:"
            echo ""
            echo '```yaml'
            echo "image: ghcr.io/madfam-org/enclii/deploy-pipeline-monitor@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Then push the manifest update — ArgoCD (\`deploy-pipeline-monitor\` Application) reconciles within ~3m."
          } >> "$GITHUB_STEP_SUMMARY"

      # The silent-stale-deploy guard. The dangerous state is not "a step failed"
      # but "the image was pushed and the digest pin never landed": GHCR has the
      # image, the run looks like an ordinary failure, ArgoCD was never handed a
      # new digest, and the live host quietly keeps serving the previous build.
      # crea-frontend hit exactly this on 2026-08-26 (run 33010085743) and it was
      # caught only by an external census deploy-gate. Make the state name itself.
      - name: Guard against silent stale deploy
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PIN_OUTCOME: ${{ steps.pin_commit.outcome }}
        run: |
          set -euo pipefail
          echo "build=${BUILD_OUTCOME} pin=${PIN_OUTCOME}"
          if [ "${BUILD_OUTCOME}" != "success" ]; then
            echo "No image was pushed; nothing to guard."
            exit 0
          fi
          if [ "${PIN_OUTCOME}" = "success" ]; then
            echo "Digest pin completed; the deployed digest matches this run."
            exit 0
          fi
          echo "::error title=Image pushed but NOT pinned/deployed::The image for this commit was"
          echo "::error::built and pushed to GHCR, but the digest pin did not complete"
          echo "::error::(build=${BUILD_OUTCOME}, pin=${PIN_OUTCOME})."
          echo "::error::"
          echo "::error::ArgoCD was never handed a new digest, so THE LIVE HOST IS STILL SERVING"
          echo "::error::THE PREVIOUS BUILD even though this run otherwise looks done."
          echo "::error::"
          echo "::error::Fix: rerun the failed jobs (gh run rerun <run-id> --failed)."
          exit 1


  build-pr:
    name: Build (PR verify)
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: infra/deploy-pipeline-monitor
          file: infra/deploy-pipeline-monitor/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha,scope=deploy-pipeline-monitor
          cache-to: type=gha,mode=max,scope=deploy-pipeline-monitor
