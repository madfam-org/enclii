name: Reusable — Build, sign, publish, pin

# Reusable build-publish pipeline for MADFAM service repos (routecraft,
# forj, bloom-scroll, blueprint-harvester, digifab-quoting, subtext, …).
#
# What it does, per service in the `services` matrix:
#   1. Build with Docker Buildx (GHA cache)
#   2. Push to GHCR as :${SHA} (no :latest — Kyverno disallows)
#   3. Sign keyless with cosign (Fulcio + Rekor OIDC)
# Then, across all services once:
#   4. Re-derive each service's digest FROM THE REGISTRY (see below)
#   5. kustomize edit set image → @sha256:<digest> in kustomization.yaml
#   6. Commit the digest pin back to main (triggers ArgoCD sync)
#      Partial success: if the build matrix has mixed results, pin still runs
#      and commits digests for every service whose :${SHA} tag resolves in
#      GHCR. Sibling build failures must not block deploy of successful builds
#      (RFC 0017 Tier B — forj-api 4-day outage class).
#   7. (optional) POST an Enclii lifecycle callback
#
# WHY THE PIN JOB READS THE REGISTRY INSTEAD OF AN ARTIFACT
#
#   Until 2026-08-27 the build matrix handed digests to the pin job through an
#   `actions/upload-artifact` → `actions/download-artifact` hop. That hop put
#   GitHub *billing* on the deploy hot path, and it broke twice in 24h:
#
#     ##[error]Failed to CreateArtifact: Artifact storage quota has been hit.
#
#   madfam-org is on the FREE plan: a fixed 500 MB pool shared between Actions
#   artifacts AND GHCR packages, hard-stop when full, no overage billing. Every
#   deploy pushes another image version into that same pool, so the pool refills
#   itself — a purge on 2026-08-27 04:35Z cleared it, uploads resumed for ~3h,
#   and it re-blocked at ~07:33Z with zero uploads org-wide for the next 6h+.
#   Meanwhile the images themselves built, pushed and signed GREEN every time.
#   The result is the exact silent-drift state this pipeline exists to prevent:
#   main goes green, ArgoCD is never handed a digest, and ~15 caller repos keep
#   serving their previous build.
#
#   The registry already knows every digest it accepted. Asking it removes the
#   dependency entirely: `docker buildx imagetools inspect` reads the manifest
#   for the `:${{ github.sha }}` tag the build job just pushed. No artifact, no
#   quota, no billing coupling. ADR-010: load-bearing paths must not depend on
#   GitHub billing.
#
#   Why `:${{ github.sha }}` is a safe reference to derive from: it is the only
#   tag this workflow pushes (there is deliberately no `:latest` — Kyverno's
#   disallow-latest-tag rejects it), and it is unique per commit. The tag can
#   only be rewritten by another run building the SAME commit, and such a run
#   is by definition producing the artifact this pipeline wants pinned. There
#   is no branch-moving tag anywhere in the push, so there is no reference that
#   could drift to an unrelated build between build and pin.
#
#   Belt and braces: the derived digest is still cosign-verified against the
#   madfam-org workflow identity before it is pinned (unchanged), so a digest
#   read from a compromised or confused registry response cannot be deployed.
#
# What it accepts:
#   services:            JSON array of {name, dockerfile, paths?}
#   image_prefix:        e.g. "ghcr.io/madfam-org/routecraft"
#   kustomization_path:  e.g. "infra/k8s/production"
#   cosign_release:      default "v2.4.3" (known-good on ARC runners)
#   enclii_notify_event: default "image-digest-committed"; "" to skip notify
#   ci_user_name / ci_user_email: identity on the digest-pin commit
#   rebuild_all_paths:   regex; files matching this trigger "build all"
#                         (workflow-file, manifests, etc.)
#
# Secrets it expects (via `secrets: inherit`):
#   DOCKER_USERNAME / DOCKER_TOKEN (optional — soft-fail)
#   MADFAM_BOT_PAT (legacy only — do not place it on the hot path; stale PATs
#                   must not override the repo-scoped GITHUB_TOKEN)
#   GHCR_PAT (optional — registry auth override for GHCR push/pull; falls
#             through to the repo-scoped GITHUB_TOKEN otherwise)
#   ENCLII_API_URL / ENCLII_DEPLOY_TOKEN (optional — for callback)
#   ENCLII_COMMIT_TOKEN (optional — PAT to push past branch protection;
#                        falls through to GITHUB_TOKEN otherwise)
#   NPM_MADFAM_TOKEN (required for repos consuming @janua/@madfam/@forj/@cotiza
#                     scoped packages from npm.madfam.io)
#
# BuildKit secret: npmrc
#   This workflow forwards `NPM_MADFAM_TOKEN` to `docker/build-push-action`
#   as a BuildKit secret named `npmrc`. Consumer Dockerfiles MUST mount it
#   on any `pnpm install` line that needs auth to npm.madfam.io:
#
#       RUN --mount=type=secret,id=npmrc,target=/root/.npmrc,required=true \
#           pnpm install --frozen-lockfile
#
#   The secret never lands in an image layer. Do NOT `COPY .npmrc ./`
#   into the build context — the committed `.npmrc` only carries scope
#   mappings and the auth token must come from the secret mount.
#
# Why this is safe:
#   - Base-image-mirror preference lives in each repo's Dockerfiles
#     (use `public.ecr.aws/docker/library/...` to sidestep Docker Hub
#     rate limits; this workflow doesn't dictate the FROM line).
#   - Cosign is pinned to a specific installer + release; unpinned
#     installers break on self-hosted runners.
#   - Docker Hub login is soft-fail: missing creds don't halt the run,
#     and base-image pulls go through the mirror anyway.

on:
  workflow_call:
    inputs:
      services:
        description: |
          JSON array of service definitions. Example:
          [{"name":"bff","dockerfile":"apps/bff/Dockerfile","paths":"apps/bff packages"},
           {"name":"api","dockerfile":"apps/api/Dockerfile","paths":"apps/api"},
           {"name":"web","context":"frontend","dockerfile":"frontend/Dockerfile",
            "paths":"frontend",
            "build_args":"API_BASE_URL=https://api.almanac.solar"}]
          Fields:
            - name:       service name (becomes image suffix)
            - dockerfile: path to Dockerfile from repo root
            - context:    (optional) build context; defaults to "."
                          Set this when the Dockerfile's COPY paths are
                          relative to a subdir, not the repo root.
            - target:     (optional) Dockerfile stage to build
                          (`docker build --target`). Omit to build the
                          final stage. Lets one Dockerfile publish
                          multiple images (one service entry per stage).
            - paths:      (optional) space-separated paths for change
                          detection on push triggers. Service is rebuilt
                          when the diff touches any of its paths.
            - build_args: (optional) newline-separated KEY=VALUE pairs
                          forwarded to `docker build --build-arg`. Use
                          for compile-time-baked values (Flutter
                          --dart-define, Next.js NEXT_PUBLIC_*).
                          Without this, Dockerfile ARGs only see defaults.
            - implicit_dockerfile_dir:
                          (optional, default true) add the Dockerfile's
                          containing directory to the change filter. Set false
                          for root-level aggregate Dockerfiles such as
                          services/Dockerfile.ingestion so they do not watch
                          an entire monorepo service tree.
                          NOTE: the `dockerfile` path AND its containing
                          directory are ALWAYS implicitly part of the
                          filter for services that declare any `paths`.
                          So `dockerfile: "frontend/Dockerfile"` always
                          watches `frontend/Dockerfile` and `frontend/**`,
                          even if `paths` would otherwise miss them.
                          Services that omit `paths` entirely keep the
                          legacy "always build" behavior.
        required: true
        type: string
      image_prefix:
        description: Image path prefix, e.g. "ghcr.io/madfam-org/routecraft".
        required: true
        type: string
      kustomization_path:
        description: Directory containing the kustomization.yaml to pin.
        required: true
        type: string
      cosign_release:
        description: cosign release tag.
        required: false
        type: string
        default: v2.4.3
      cosign_installer_ref:
        description: sigstore/cosign-installer ref.
        required: false
        type: string
        default: v3.7.0
      enclii_notify_event:
        description: Event name to POST to Enclii lifecycle (empty = skip).
        required: false
        type: string
        default: image-digest-committed
      ci_user_name:
        description: git user.name for the digest-pin commit.
        required: false
        type: string
        default: madfam-ci[bot]
      ci_user_email:
        description: git user.email for the digest-pin commit.
        required: false
        type: string
        default: ci@madfam.io
      rebuild_all_paths:
        description: |
          Extended regex; if any changed file matches, rebuild ALL
          services (not just the ones whose `paths` changed). Typical
          use: workflow file + k8s manifests.
        required: false
        type: string
        default: '^(\.github/workflows/.*\.yml|infra/k8s/(production|overlays)/)'
      build_runner:
        description: |
          Optional runner label for Docker build jobs. Leave empty to use
          the platform default, or set to ubuntu-latest for repos that need
          to avoid unavailable ARC/self-hosted capacity.
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  detect-changes:
    name: Detect changed services
    # Keep lightweight orchestration off scarce ARC builders. Only Docker
    # builds need the self-hosted runner pool.
    runs-on: ${{ inputs.build_runner != '' && inputs.build_runner || (vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest') }}
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Compute service matrix
        id: filter
        env:
          SERVICES_INPUT: ${{ inputs.services }}
          REBUILD_ALL_PATHS: ${{ inputs.rebuild_all_paths }}
        run: |
          set -euo pipefail

          services_all=$(printf '%s' "$SERVICES_INPUT" | jq -c .)
          echo "Input services: $services_all"

          # Manual re-dispatch with a service override — skip the change
          # detection entirely and build what the user asked for.
          override='${{ github.event.inputs.services || '' }}'
          if [ -n "$override" ]; then
            picked=$(echo "$services_all" | jq -c --arg list "$override" \
              '[.[] | select(.name as $n | ($list | split(",")) | index($n))]')
            echo "matrix=$picked" >> "$GITHUB_OUTPUT"
            echo "any=$(echo "$picked" | jq 'length > 0')" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Change detection. `github.event.before` is empty on
          # workflow_dispatch; fall through to HEAD~1 in that case.
          changed=$(git diff --name-only "${{ github.event.before || '' }}" "${{ github.sha }}" 2>/dev/null \
            || git diff --name-only HEAD~1 HEAD 2>/dev/null \
            || true)
          echo "Changed files:"
          echo "${changed:-<none>}"

          # Services whose `paths` glob-root matched a changed file.
          # while-read (NOT `for row in $()`) preserves JSON with spaces.
          #
          # The effective filter for each service is its declared `paths`
          # PLUS implicit entries derived from its `dockerfile`:
          #   1. The dockerfile path itself (exact match)
          #   2. The directory containing the dockerfile (prefix match)
          # This ensures Dockerfile-only diffs and any change under the
          # dockerfile's home directory always trigger a rebuild — closing
          # the "Dockerfile bump silently skipped" class of bug
          # (bloom-scroll PR #72 / commit b9f7699 was the canary symptom).
          #
          # Backward-compatible: a service with no declared `paths` keeps
          # falling through to the no-paths fallback below (which builds
          # it on every push). We do NOT auto-add implicit paths to such
          # services, because doing so would flip them from "always build"
          # to "build only when their dir changed" — a behavior change
          # forj and digifab-quoting explicitly rely on.
          picked='[]'
          while IFS= read -r row; do
            [ -z "$row" ] && continue
            paths=$(echo "$row" | jq -r '.paths // empty')
            # Skip services with no declared paths — handled by the
            # no-paths fallback below.
            [ -z "$paths" ] && continue

            dockerfile=$(echo "$row" | jq -r '.dockerfile // empty')
            implicit_df_dir=$(echo "$row" | jq -r 'if has("implicit_dockerfile_dir") then .implicit_dockerfile_dir else true end')
            df_dir=""
            if [ -n "$dockerfile" ]; then
              df_dir=$(dirname "$dockerfile")
              # Treat "." (dockerfile at repo root) as no implicit dir.
              [ "$df_dir" = "." ] && df_dir=""
            fi

            effective_paths="$paths"
            if [ "$implicit_df_dir" != "false" ] && [ -n "$df_dir" ]; then
              effective_paths="$effective_paths $df_dir"
            fi
            echo "Service '$(echo "$row" | jq -r '.name')' effective filter: $effective_paths (dockerfile=$dockerfile implicit_dockerfile_dir=$implicit_df_dir)"

            matched=0
            # Prefix match: any change under one of the declared/implicit dirs.
            for p in $effective_paths; do
              # Strip trailing slash to normalize before re-adding it.
              p="${p%/}"
              if echo "$changed" | grep -q "^$p/"; then
                picked=$(echo "$picked" | jq -c --argjson svc "$row" '. + [$svc]')
                matched=1
                break
              fi
            done
            # Exact-file match on the dockerfile itself (catches the
            # repo-root Dockerfile case where df_dir is empty, AND
            # protects against malformed prefix grep on edge filenames).
            if [ "$matched" = "0" ] && [ -n "$dockerfile" ]; then
              if echo "$changed" | grep -qFx "$dockerfile"; then
                picked=$(echo "$picked" | jq -c --argjson svc "$row" '. + [$svc]')
              fi
            fi
          done < <(echo "$services_all" | jq -c '.[]')

          # Workflow / infra changes rebuild all services.
          if echo "$changed" | grep -qE "$REBUILD_ALL_PATHS"; then
            echo "rebuild_all triggered by infra/workflow change"
            picked="$services_all"
          fi

          # Fallback: if a service has no `paths`, always build it
          # (so minimal configs keep working).
          no_paths=$(echo "$services_all" | jq -c '[.[] | select(.paths == null or .paths == "")]')
          if [ "$(echo "$no_paths" | jq 'length')" != "0" ]; then
            picked=$(jq -c -s '.[0] + .[1] | unique_by(.name)' <(echo "$picked") <(echo "$no_paths"))
          fi

          # Compact to single-line for GITHUB_OUTPUT.
          picked=$(echo "$picked" | jq -c .)

          echo "matrix=$picked" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$picked" | jq 'length > 0')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ${{ inputs.build_runner != '' && inputs.build_runner || (vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # Docker Hub login BEFORE buildx, so buildx picks up creds when
      # its container starts. Conditional + soft-fail so missing creds
      # don't halt — Dockerfiles should use `public.ecr.aws/docker/library/*`
      # as their base anyway, but this keeps the auth path available
      # when it IS configured.
      - name: Log in to Docker Hub
        if: ${{ env.DH_USER != '' && env.DH_TOKEN != '' }}
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: ${{ inputs.cosign_release }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v7
        env:
          # Don't spend the org's artifact quota on build diagnostics.
          #
          # The docker actions toolkit uploads a "build record" artifact after
          # every build. It is purely diagnostic — nothing here consumes it,
          # and `provenance: false` below means no attestation depends on it —
          # but it competes for the same capped account-wide artifact storage
          # as the digest artifact, which IS load-bearing (the `pin` job
          # downloads it to commit the digest pins ArgoCD rolls on).
          #
          # ADR-010: load-bearing paths must not depend on GitHub billing.
          # Both env vars are documented in docker/build-push-action.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          # `context` defaults to "." (repo root). Services with a
          # subdirectory build root (e.g. bloom-scroll's backend/ and
          # frontend/, where Dockerfile COPY paths are relative to the
          # subdir) can set it per-service in the matrix JSON.
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile }}
          # Optional Dockerfile stage (`target` in the service entry).
          # Empty string = final stage (the action omits --target).
          target: ${{ matrix.service.target || '' }}
          platforms: linux/amd64
          push: true
          provenance: false
          # No :latest — Kyverno `disallow-latest-tag` rejects.
          tags: |
            ${{ inputs.image_prefix }}/${{ matrix.service.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Per-service build-args (one KEY=VALUE per line). Use this for
          # compile-time-baked values like Flutter `--dart-define`, Next.js
          # `NEXT_PUBLIC_*`, or any other value the Dockerfile reads via
          # `ARG`. Add `"build_args": "K=V\nK2=V2"` to the service entry in
          # the matrix JSON.
          #
          # Without this, Dockerfile ARGs only see their declared defaults
          # — the trap that bit bloom-scroll (almanac.solar shipped a
          # `localhost:8000` Flutter bundle) and karafiel (build-time
          # NEXT_PUBLIC_API_URL silently dropping to localhost).
          build-args: ${{ matrix.service.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          # BuildKit secret: forwarded to Dockerfiles via
          #   RUN --mount=type=secret,id=npmrc,target=/root/.npmrc ...
          # Carries the auth token for npm.madfam.io scoped packages
          # (@janua, @madfam, @forj, @cotiza). Never lands in an image layer.
          # Repos that don't consume private packages can still receive the
          # secret harmlessly — it's only read when a Dockerfile mounts it.
          secrets: |
            npmrc=//npm.madfam.io/:_authToken=${{ secrets.NPM_MADFAM_TOKEN }}

      # Keyless signing depends on THREE remote services at once — GitHub's
      # ambient OIDC endpoint, Fulcio, and Rekor — and a hiccup in any of them
      # fails the step. The image is already built and pushed by this point, so
      # a bare failure here strands the run BEFORE the digest artifact, the pin
      # job finds no digests, ArgoCD never syncs, and main goes green while the
      # live host keeps serving the previous build. That is exactly what bit
      # crea-frontend on 2026-08-26 (run 33010085743): GitHub's OIDC endpoint
      # returned non-JSON and cosign reported
      #   getting key from Fulcio: fetching ambient OIDC credentials:
      #   invalid character 'u' looking for beginning of value
      # A plain `gh run rerun --failed` then succeeded — i.e. it was transient
      # and a retry was the entire fix. Retry in-step so the run never reaches
      # that stranded state. Only the sign call is retried; the build/push above
      # is untouched and never repeats.
      - name: Sign image (keyless, Fulcio/Rekor)
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ${{ inputs.image_prefix }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

      # No artifact hop. The digest is recorded here for humans only — the pin
      # job re-derives it from GHCR (see the header note). Writing it to the
      # step summary keeps the run self-documenting: when a pin looks wrong,
      # this is the value the build actually produced, next to the value the
      # registry later reported.
      - name: Record digest in run summary
        env:
          SVC: ${{ matrix.service.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
        run: |
          set -euo pipefail
          echo "service=${SVC} digest=${DIGEST}"
          echo "tag-ref=${IMAGE_PREFIX}/${SVC}:${GITHUB_SHA}"
          {
            echo "### Built \`${SVC}\`"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| tag ref | \`${IMAGE_PREFIX}/${SVC}:${GITHUB_SHA}\` |"
            echo "| pinned as | \`${IMAGE_PREFIX}/${SVC}@${DIGEST}\` |"
            echo ""
            echo "The \`pin\` job re-reads this digest from GHCR via the tag ref"
            echo "above; it does not receive it through an artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  pin:
    name: Commit digest pins
    needs: [detect-changes, build]
    # Pin every successfully built service even when sibling matrix jobs fail.
    if: >-
      always() &&
      needs.detect-changes.outputs.any == 'true' &&
      needs.build.result != 'cancelled' &&
      needs.build.result != 'skipped'
    # Digest pinning is git/kustomize/curl work; do not burn an ARC build slot.
    runs-on: ${{ inputs.build_runner != '' && inputs.build_runner || (vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest') }}
    permissions:
      contents: write
      packages: read
    # Surfaced so the deploy-state-guard can assert on WORK DONE, not just on
    # this job's result. This job reports success when every meaningful step
    # skipped behind `count == 0`, so `pin.result == 'success'` alone is not
    # evidence that anything was pinned.
    outputs:
      pins_written: ${{ steps.digests.outputs.count }}
      pin_commit: ${{ steps.commit.outputs.pin_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          # PAT if the caller provides ENCLII_COMMIT_TOKEN (to bypass
          # branch protection); fall through to the repo-scoped GITHUB_TOKEN.
          # Do not fall back to MADFAM_BOT_PAT: an expired org bot token can
          # otherwise break every caller even when GITHUB_TOKEN has package
          # and contents permissions.
          token: ${{ secrets.ENCLII_COMMIT_TOKEN || github.token }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: ${{ inputs.cosign_release }}

      - name: Log in to GHCR for digest verification
        # Private GHCR packages require registry auth for cosign verify's
        # manifest reads. Build jobs log in before push/sign; the separate pin
        # job needs its own login before verifying the signed digest.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      # Digests come from the registry, not from an artifact. `docker buildx
      # imagetools inspect` reads the manifest GHCR holds for the tag the build
      # job pushed.
      #
      # Two preconditions, both already satisfied by this job and both required:
      #   1. `docker login ghcr.io` — the step above (private packages need it).
      #   2. `packages: read` on the job token — declared in this job's
      #      `permissions:`. WITHOUT IT the manifest HEAD returns 403 even
      #      though the login succeeded, because the token is not authorized to
      #      read the manifest. Verified in this repo on run 24939981458
      #      ("403 Forbidden" against
      #      /v2/madfam-org/enclii/switchyard-api/manifests/<sha>), which is why
      #      emergency-deploy.yml carries the same pair for the same call.
      #
      # A service whose build failed never pushed its tag, so the
      # inspect fails for it and it is skipped — which reproduces the old
      # "pin every service that succeeded, skip the rest" partial-success
      # behavior without the artifact (RFC 0017 Tier B).
      #
      # This writes the same `name=sha256:...` lines the artifact used to carry
      # into digests/*.txt, so every downstream step is unchanged.
      - name: Derive digests from GHCR
        id: digests
        env:
          SERVICES_MATRIX: ${{ needs.detect-changes.outputs.matrix }}
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
        run: |
          set -euo pipefail
          mkdir -p digests
          count=0
          missing=""

          while IFS= read -r svc; do
            [ -n "$svc" ] || continue
            ref="${IMAGE_PREFIX}/${svc}:${GITHUB_SHA}"

            # Transient registry 5xx/timeouts must not look like "this service
            # did not build" — that would silently skip the pin and strand the
            # host, the very failure class this job exists to close. Retry
            # before concluding the tag is absent.
            digest=""
            for wait in 0 5 15 30; do
              [ "$wait" -gt 0 ] && sleep "$wait"
              if digest=$(docker buildx imagetools inspect "$ref" \
                            --format '{{json .Manifest.Digest}}' 2>/tmp/inspect-"$svc".err); then
                digest=$(printf '%s' "$digest" | tr -d '"[:space:]')
                [ -n "$digest" ] && break
              fi
              digest=""
            done

            if [ -z "$digest" ]; then
              echo "::notice::No image found at ${ref}; treating '${svc}' as not built in this run."
              head -c 300 /tmp/inspect-"$svc".err 2>/dev/null || true; echo
              missing="${missing} ${svc}"
              continue
            fi

            if [[ "$digest" != sha256:* ]]; then
              echo "::error::Registry returned a non-sha256 digest for ${ref}: ${digest}"
              exit 1
            fi

            printf '%s=%s\n' "$svc" "$digest" > "digests/${svc}.txt"
            echo "resolved ${svc} -> ${digest}"
            count=$((count + 1))
          done < <(printf '%s' "$SERVICES_MATRIX" | jq -r '.[].name')

          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### Digests resolved from GHCR"
            echo ""
            echo "resolved: **${count}**${missing:+ · not found:\`${missing}\`}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -eq 0 ]; then
            echo "No images found in GHCR for this commit; nothing to pin."
          fi

      - name: Update kustomization image digests
        if: steps.digests.outputs.count != '0'
        env:
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
          KUSTOMIZATION_PATH: ${{ inputs.kustomization_path }}
        run: |
          set -euo pipefail
          cd "$KUSTOMIZATION_PATH"
          shopt -s nullglob
          # Absolute path only. The old relative `../../../digests/*.txt` glob
          # assumed a kustomization exactly three levels deep and silently
          # matched nothing otherwise; the digests are written to the workspace
          # root by the derive step, so address them there unambiguously.
          for f in "$GITHUB_WORKSPACE"/digests/*.txt; do
            [ -f "$f" ] || continue
            line=$(cat "$f")
            name="${line%%=*}"
            digest="${line#*=}"
            if [[ "$digest" != sha256:* ]]; then
              echo "ERROR: Refusing to pin non-sha256 digest for $name: $digest"
              exit 1
            fi
            ref="${IMAGE_PREFIX}/${name}@${digest}"
            echo "Verifying cosign signature for $ref"
            verified=0
            for wait in 0 5 10 20 30 60; do
              if [ "$wait" -gt 0 ]; then
                echo "Signature not visible yet for $ref, retrying in ${wait}s..."
                sleep "$wait"
              fi
              if COSIGN_EXPERIMENTAL=1 cosign verify \
                --certificate-identity-regexp='^https://github\.com/madfam-org/[A-Za-z0-9_.-]+/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml@refs/(heads/main|tags/v[0-9].*)$' \
                --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
                "$ref" >/tmp/cosign-verify-${name}.json 2>/tmp/cosign-verify-${name}.err; then
                verified=1
                break
              fi
            done
            if [ "$verified" -ne 1 ]; then
              echo "ERROR: Refusing to pin unsigned or unverifiable digest $ref"
              cat /tmp/cosign-verify-${name}.err || true
              exit 1
            fi
            echo "Pinning signed digest $name to $digest"
            kustomize edit set image "${IMAGE_PREFIX}/${name}=${IMAGE_PREFIX}/${name}@${digest}"
          done

      - name: Commit & push digest update
        id: commit
        if: steps.digests.outputs.count != '0'
        env:
          CI_USER_NAME: ${{ inputs.ci_user_name }}
          CI_USER_EMAIL: ${{ inputs.ci_user_email }}
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
          KUSTOMIZATION_PATH: ${{ inputs.kustomization_path }}
        run: |
          set -euo pipefail
          git config user.name "$CI_USER_NAME"
          git config user.email "$CI_USER_EMAIL"
          target="${KUSTOMIZATION_PATH}/kustomization.yaml"

          # Re-apply THIS run's already-derived, already-verified digests onto
          # whatever the kustomization currently holds. Idempotent: `kustomize
          # edit set image` sets each image to our digest regardless of the
          # line's current value, so it produces the same result whether the
          # tree is pristine or already carries a competitor's pin. The digests
          # were persisted to $GITHUB_WORKSPACE/digests/*.txt by the derive
          # step and verified (signature-gated) by "Update kustomization image
          # digests"; we do NOT re-verify here, we only re-materialize the edit.
          apply_our_digests() {
            ( set -euo pipefail
              cd "$KUSTOMIZATION_PATH"
              shopt -s nullglob
              for f in "$GITHUB_WORKSPACE"/digests/*.txt; do
                [ -f "$f" ] || continue
                line=$(cat "$f")
                name="${line%%=*}"
                digest="${line#*=}"
                # Defense in depth: the derive step already rejected non-sha256,
                # but never let a bad value reach a commit on main.
                if [[ "$digest" != sha256:* ]]; then
                  echo "ERROR: refusing to pin non-sha256 digest for $name: $digest"
                  exit 1
                fi
                kustomize edit set image "${IMAGE_PREFIX}/${name}=${IMAGE_PREFIX}/${name}@${digest}"
              done
            )
          }

          if git diff --quiet -- "$target"; then
            # Not a failure: the kustomization already carries these exact
            # digests (a rebuild of an unchanged tree reproduces them). The
            # host is NOT stale in this case, so report the digests as pinned
            # by recording the commit that already holds them.
            echo "No digest changes to commit; kustomization already at this run's digests."
            echo "pin_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- "$target"
          git commit -m "ci: pin image digests from ${{ github.sha }}"

          # The push races anything that lands on the branch mid-build (a docs
          # merge, or ANOTHER build's pin) and a non-fast-forward here strands
          # BUILT, SIGNED digests unpinned — with `gh run rerun` useless,
          # because a rerun re-checks-out the ORIGINAL stale SHA (bit
          # accionables-madlab 2026-08-17 and nauta the same day, run
          # 32063785498).
          #
          # On rejection we do NOT `git pull --rebase` the pin commit: when the
          # work that landed is ITSELF a pin (two builds finishing close
          # together — crea-map #224/#225 on 2026-09-01, run 33563405147), both
          # commits touch the same `digest:` line and the rebase dies with a
          # CONFLICT that `set -e` turns into a hard step failure — the exact
          # race this loop was meant to survive. Instead: reset onto the fresh
          # remote tip and RE-MATERIALIZE our digests on top of it. Because the
          # re-apply is idempotent, replaying over a competitor's pin cleanly
          # supersedes it with our just-built, just-signed image (newer pin
          # wins, which is what we want — the alternative is prod stranded on
          # the older image). A genuine conflict — someone hand-editing the
          # kustomization structure so `kustomize edit` can't parse it — still
          # fails loudly, because apply_our_digests runs under `set -e`.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pin_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt ${attempt} rejected (non-fast-forward); reset onto fresh ${GITHUB_REF_NAME} and re-apply our digests"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            apply_our_digests
            if git diff --quiet -- "$target"; then
              # The tip already pins exactly our digests (a competitor pinned
              # the same image, or ours). Nothing to push; we are done.
              echo "Fresh ${GITHUB_REF_NAME} already carries this run's digests; nothing to push."
              echo "pin_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add -- "$target"
            git commit -m "ci: pin image digests from ${{ github.sha }}"
          done
          echo "::error::Could not push digest pins after 5 attempts; branch is moving faster than the pin can rebase. Prod may be stranded on the previous image — investigate ${GITHUB_REF_NAME} push contention."
          exit 1

      # Registering a Release is not optional bookkeeping. Enclii's reconciler
      # owns the replica count — which is why the ArgoCD Applications it
      # generates list /spec/replicas under ignoreDifferences — and it derives
      # desired_replicas from Releases. A service with none stays pinned at 0
      # replicas while ArgoCD reports Synced at the correct digest forever.
      #
      # This step was silently dead org-wide. It gated on secrets.ENCLII_API_URL
      # and authenticated with secrets.ENCLII_DEPLOY_TOKEN, and NO repository in
      # madfam-org has either: the credential is called ENCLII_CALLBACK_TOKEN
      # (janua, dhanam, phynd-crm, enclii). So `env.ENCLII_API_URL != ''` was
      # false everywhere and the step was skipped on every green run. Releases
      # stopped being recorded around 2026-06-01 and nobody noticed, because
      # already-scaled services keep running — they just stop getting Release
      # rows. The first service onboarded after that (angelia) could never
      # start at all, with no error anywhere in the pipeline.
      #
      # So: accept the name the org actually uses, fall back to the documented
      # endpoint rather than requiring a secret to hold a public URL, and only
      # skip when there is genuinely no credential.
      - name: Notify enclii lifecycle
        if: ${{ steps.digests.outputs.count != '0' && inputs.enclii_notify_event != '' }}
        env:
          # ENCLII_CALLBACK_TOKEN is the lifecycle credential and must match the
          # server's ENCLII_ARGOCD_WEBHOOK_SECRET. It is NOT an `enclii tokens
          # create` API token — /v1/callbacks/lifecycle-event compares the
          # bearer against config.ArgocdWebhookSecret, so a personal API token
          # always 401s here.
          ENCLII_TOKEN: ${{ secrets.ENCLII_CALLBACK_TOKEN || secrets.ENCLII_DEPLOY_TOKEN }}
          ENCLII_API_URL: ${{ secrets.ENCLII_API_URL || 'https://api.enclii.dev' }}
          EVENT: ${{ inputs.enclii_notify_event }}
          # Needed to reconstruct each image reference from the digest files.
          # It is set on the kustomization step, which is a DIFFERENT step, so
          # it is not inherited here.
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
        run: |
          if [ -z "${ENCLII_TOKEN:-}" ]; then
            echo "::warning::No ENCLII_CALLBACK_TOKEN (or ENCLII_DEPLOY_TOKEN) is set for this"
            echo "::warning::repository, so no Enclii Release will be registered for this build."
            echo "::warning::A service with no Release stays at desired_replicas 0 and cannot"
            echo "::warning::start, while ArgoCD reports Synced. This is not a cosmetic skip."
            exit 0
          fi
          # The payload must match types.LifecycleEventCreate. The previous body
          # was {project, commit, event} — not one of those is a field on that
          # struct, so ShouldBindJSON failed every required binding and the
          # endpoint answered 400. Combined with `|| true`, that produced a
          # green step that had never once worked. Observed directly on
          # 2026-08-13: `lifecycle callback -> HTTP 400`.
          #
          # A Release is only created for event_type "image_pushed"
          # (types.LifecycleImagePushed); the handler ignores every other type
          # for that purpose. The service is resolved from metadata.service,
          # then from candidates derived from metadata.image — for
          # ghcr.io/org/<project>/<svc> that yields "<project>-<svc>" first,
          # which is how enclii names per-workload services. So the image must
          # be sent, one event PER SERVICE, not one per run.
          #
          # janua/.github/workflows/docker-publish.yml is the reference: it is
          # the shape that was still producing Releases before this path went
          # quiet.
          shopt -s nullglob
          sent=0; failed=0
          # Single canonical path (the derive step writes here). This used to
          # glob both `digests/*.txt` and the absolute path, which matched the
          # same file twice and posted every event twice — harmless, since
          # findOrCreateRelease is idempotent per git SHA, but it doubled the
          # calls and made the log read as two services. The seen_svcs guard
          # below is kept as a cheap invariant.
          seen_svcs=" "
          for f in "$GITHUB_WORKSPACE"/digests/*.txt; do
            [ -f "$f" ] || continue
            line=$(cat "$f")
            svc="${line%%=*}"
            digest="${line#*=}"
            [ -n "$svc" ] && [ -n "$digest" ] || continue
            case "$seen_svcs" in *" $svc "*) continue ;; esac
            seen_svcs="$seen_svcs$svc "
            image="${IMAGE_PREFIX}/${svc}"

            # metadata.service MUST be project-qualified. The server resolves it
            # with ServiceRepository.GetByName, which is
            #     SELECT ... FROM services WHERE name = $1
            # with NO project filter — so a bare matrix name like "landing"
            # matches whichever service in the WHOLE platform is called that,
            # and the Release is attached to another project's service. Observed
            # on 2026-08-13: angelia posted metadata.service "landing", the
            # event recorded resolution as SUCCESSFUL, and angelia-landing still
            # had zero releases.
            #
            # "<project>-<svc>" is exactly the first candidate
            # extractServiceCandidates derives from the image path, and how
            # enclii names per-workload services, so this agrees with the
            # server rather than working around it.
            proj="${IMAGE_PREFIX##*/}"
            qualified="$svc"
            [ -n "$proj" ] && [ "$proj" != "$svc" ] && qualified="${proj}-${svc}"

            export REPO="$GITHUB_REPOSITORY" SHA="$GITHUB_SHA" \
                   BRANCH="$GITHUB_REF_NAME" REF="$GITHUB_REF" \
                   SVC="$qualified" IMG="$image" DIG="$digest" EV="$EVENT"
            # Built with python rather than a heredoc so every value is JSON-escaped.
            # Kept to ONE line: a multi-line snippet inside this block scalar dedents
            # to column 0 and silently terminates the YAML block.
            body=$(python3 -c 'import json,os;e=os.environ;print(json.dumps({"repo_full_name":e["REPO"],"commit_sha":e["SHA"],"branch":e["BRANCH"],"ref":e["REF"],"event_type":"image_pushed","source":"ci_callback","message":e["SVC"]+" "+e["EV"],"metadata":{"service":e["SVC"],"image":e["IMG"],"digest":e["DIG"],"workflow":"build-publish"}}))')

            code=$(printf '%s' "$body" | curl -sS -o /tmp/enclii-notify.out -w '%{http_code}' \
              -X POST "$ENCLII_API_URL/v1/callbacks/lifecycle-event" \
              -H "Authorization: Bearer $ENCLII_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @- || echo 000)
            echo "lifecycle callback [$svc] -> HTTP $code"
            case "$code" in
              2*) sent=$((sent + 1)) ;;
              401|403)
                echo "::error::Enclii rejected the lifecycle callback (HTTP $code). This endpoint"
                echo "::error::compares the bearer against the server's ENCLII_ARGOCD_WEBHOOK_SECRET,"
                echo "::error::so an 'enclii tokens create' API token will always fail here."
                failed=$((failed + 1)) ;;
              400)
                echo "::error::Enclii rejected the payload (HTTP 400) for '$svc'. Required fields are"
                echo "::error::repo_full_name, commit_sha, branch, ref, event_type, source."
                head -c 300 /tmp/enclii-notify.out 2>/dev/null || true; echo
                failed=$((failed + 1)) ;;
              *)
                echo "::warning::Lifecycle callback for '$svc' returned HTTP $code."
                head -c 300 /tmp/enclii-notify.out 2>/dev/null || true; echo
                failed=$((failed + 1)) ;;
            esac
          done

          # Without a Release the reconciler holds desired_replicas at 0, so a
          # silent failure here means the service can never start while every
          # other signal stays green. Fail the job instead.
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed lifecycle callback(s) failed; those services will not get a"
            echo "::error::Release and cannot scale off 0 replicas."
            exit 1
          fi
          echo "registered $sent release event(s)"

  # ---------------------------------------------------------------------------
  # The silent-stale-deploy guard.
  #
  # The dangerous state in this pipeline is not "a job failed" — it is "a job
  # failed AFTER the image was pushed but BEFORE the digest pin landed". The
  # image exists in GHCR, main carries a green-looking squash, ArgoCD was never
  # given a new digest, and the live host quietly keeps serving the previous
  # build. crea-frontend hit exactly this on 2026-08-26 (run 33010085743) when
  # keyless signing died on a transient OIDC hiccup; nothing in the run said
  # "your deploy did not happen" and it was caught only by an external census
  # deploy-gate.
  #
  # The retry above makes that far less likely, but "less likely" is not a
  # signal. This job's whole purpose is to make the state name itself: if the
  # build job pushed images and the pin job did not succeed, fail with a message
  # that says the host is stale and what to do about it. It costs one short
  # ubuntu job per run and it is the only thing standing between a transient
  # network error and an undetected stale production host.
  #
  # WHY THE GUARD ALSO CHECKS pins_written (2026-08-27)
  #
  #   Asserting `pin.result == 'success'` was not enough. The pin job reports
  #   success when every meaningful step SKIPS behind "count == 0" — kustomize
  #   edit, commit/push and the lifecycle notify are all gated on that. So the
  #   combination (build=success, pin=success, zero digests resolved) passed the
  #   guard while nothing was pinned and the host stayed stale. Observed on
  #   2026-08-27 in run 33037992340, where all three pin steps skipped; that run
  #   only went red because `build` also failed. Had the build reported success
  #   with the digests unresolved, the guard would have exited 0 on a stale host.
  #
  #   So the guard now asserts on WORK DONE, not on job status:
  #   when the build succeeded, at least one digest must have been resolved
  #   and pinned.
  #
  #   TRUTH TABLE — build.result × pin.result × pins_written
  #
  #   build      pin        pins_written  verdict  why
  #   ---------- ---------- ------------- -------- -------------------------------
  #   skipped    *          *             PASS     no build ran; nothing to stale
  #   cancelled  *          *             PASS     operator/CI aborted deliberately
  #   success    success    >0            PASS     the happy path: images pinned
  #   success    success    0             FAIL     THE GAP. Job green, nothing
  #                                                pinned, host stale, main green.
  #   success    failure    *             FAIL     pushed, pin broke mid-flight
  #   success    cancelled  *             FAIL     pushed, pin aborted before pinning
  #   success    skipped    *             FAIL     pushed, pin never ran at all
  #   failure    success    >0            PASS     partial success (RFC 0017 Tier B):
  #                                                a sibling matrix leg failed, but
  #                                                every service that DID build is
  #                                                pinned. The failed leg reds its
  #                                                own job; this guard is about
  #                                                pushed-but-unpinned, and nothing
  #                                                pushed here went unpinned.
  #   failure    success    0             FAIL     every leg failed to produce a
  #                                                pinnable image — but if any leg
  #                                                pushed before dying, that image
  #                                                is unpinned. Fail loudly.
  #   failure    failure    *             FAIL     as above, plus the pin broke
  #   failure    cancelled  *             FAIL     as above
  #   failure    skipped    *             FAIL     as above
  #
  #   `pins_written` is empty (not "0") whenever the pin job never reached its
  #   derive step — a checkout/kustomize/login failure, or the job being skipped
  #   outright. Empty is treated as 0, which lands those rows in FAIL exactly as
  #   the table intends.
  # ---------------------------------------------------------------------------
  deploy-state-guard:
    name: Guard against silent stale deploy
    needs: [detect-changes, build, pin]
    if: always() && needs.detect-changes.outputs.any == 'true'
    # Must run on the SAME pool as the jobs it guards.
    #
    # On ubuntu-latest this job dies before its first step whenever
    # GitHub-hosted minutes are unavailable — a 0-step failure — while build
    # and pin succeed on ARC. That inverts the alarm: it reports "THE LIVE HOST
    # IS STILL SERVING THE PREVIOUS BUILD" on deploys that were in fact fine.
    # Verified tonight as `Guard against silent stale deploy steps=0` on kalya
    # and acervo among others.
    #
    # This is the one alarm that must stay trustworthy: repeated false reds
    # train operators to ignore the real thing (acervo's run had a genuine
    # `Commit digest pins` failure sitting right next to the false one).
    #
    # Safe to move: the job shells out to nothing — no gh, no curl, no jq, no
    # checkout. It only compares `needs.*.result` values, so it needs no
    # outside vantage point and no tooling the ARC image lacks. (The two `gh`
    # mentions below are inside echoed operator instructions, not commands.)
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    steps:
      - name: Fail loudly when images were pushed but not pinned
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PIN_RESULT: ${{ needs.pin.result }}
          # Empty whenever the pin job never reached its derive step (skipped
          # job, or a failure in checkout/kustomize/cosign/login before it).
          PINS_WRITTEN: ${{ needs.pin.outputs.pins_written }}
          PIN_COMMIT: ${{ needs.pin.outputs.pin_commit }}
        run: |
          set -euo pipefail
          # Normalize empty -> 0 so "the pin job never got that far" lands in
          # the same FAIL rows as "the pin job resolved nothing".
          pins="${PINS_WRITTEN:-0}"
          case "$pins" in ''|*[!0-9]*) pins=0 ;; esac
          echo "build=${BUILD_RESULT} pin=${PIN_RESULT} pins_written=${pins} pin_commit=${PIN_COMMIT:-<none>}"

          # Row: build=skipped|cancelled -> PASS. Nothing was attempted, so no
          # image was pushed and nothing can be stale.
          if [ "$BUILD_RESULT" = "skipped" ] || [ "$BUILD_RESULT" = "cancelled" ]; then
            echo "No build ran; nothing to guard."
            exit 0
          fi

          # Rows: pin=success AND pins_written>0 -> PASS.
          # This is the ONLY passing outcome once a build ran, and it covers
          # both build=success (happy path) and build=failure (RFC 0017 Tier B
          # partial success: every service that built is pinned).
          if [ "$PIN_RESULT" = "success" ] && [ "$pins" -gt 0 ]; then
            echo "Digest pin completed: ${pins} digest(s) pinned at ${PIN_COMMIT:-HEAD}."
            echo "The deployed digest matches this run."
            exit 0
          fi

          # Everything else FAILS. Distinguish the two shapes so the operator
          # message names the actual state rather than a generic one.
          if [ "$PIN_RESULT" = "success" ]; then
            echo "::error title=Pin job green but NOTHING was pinned::The digest pin job reported"
            echo "::error::success, but it resolved ZERO digests (pins_written=${pins}), so every"
            echo "::error::step that would have pinned, committed and notified was SKIPPED."
            echo "::error::"
            echo "::error::A green pin job is not evidence of a deploy. This is the exact gap that"
            echo "::error::let a stale host pass the guard before 2026-08-27."
            echo "::error::"
            echo "::error::Most likely: no image was found in GHCR at the :<commit-sha> tag for any"
            echo "::error::service — the builds did not push, or the registry read was denied."
            echo "::error::Check the 'Derive digests from GHCR' step in the pin job."
          else
            echo "::error title=Image pushed but NOT pinned/deployed::The image(s) for this commit"
            echo "::error::were built and pushed to GHCR, but the digest pin did not complete"
            echo "::error::(build=${BUILD_RESULT}, pin=${PIN_RESULT}, pins_written=${pins})."
          fi
          echo "::error::"
          echo "::error::ArgoCD was never handed a new digest, so THE LIVE HOST IS STILL SERVING"
          echo "::error::THE PREVIOUS BUILD even though this commit is green on main."
          echo "::error::"
          echo "::error::Fix: rerun the failed jobs for this run (gh run rerun <run-id> --failed)."
          echo "::error::Do not merge over this; a later run that touches different paths may not"
          echo "::error::rebuild this service at all, leaving the host stale indefinitely."
          exit 1
