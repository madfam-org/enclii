name: Reusable — Build, sign, publish, pin

# Reusable build-publish pipeline for MADFAM service repos (routecraft,
# forj, bloom-scroll, blueprint-harvester, digifab-quoting, subtext, …).
#
# What it does, per service in the `services` matrix:
#   1. Build with Docker Buildx (GHA cache)
#   2. Push to GHCR as :${SHA} (no :latest — Kyverno disallows)
#   3. Sign keyless with cosign (Fulcio + Rekor OIDC)
#   4. Emit a digest artifact
# Then, across all services once:
#   5. kustomize edit set image → @sha256:<digest> in kustomization.yaml
#   6. Commit the digest pin back to main (triggers ArgoCD sync)
#      Partial success: if the build matrix has mixed results, pin still runs
#      and commits digests for every service that uploaded an artifact.
#      Sibling build failures must not block deploy of successful builds
#      (RFC 0017 Tier B — forj-api 4-day outage class).
#   7. (optional) POST an Enclii lifecycle callback
#
# What it accepts:
#   services:            JSON array of {name, dockerfile, paths?}
#   image_prefix:        e.g. "ghcr.io/madfam-org/routecraft"
#   kustomization_path:  e.g. "infra/k8s/production"
#   cosign_release:      default "v2.4.3" (known-good on ARC runners)
#   enclii_notify_event: default "image-digest-committed"; "" to skip notify
#   ci_user_name / ci_user_email: identity on the digest-pin commit
#   rebuild_all_paths:   regex; files matching this trigger "build all"
#                         (workflow-file, manifests, etc.)
#
# Secrets it expects (via `secrets: inherit`):
#   DOCKER_USERNAME / DOCKER_TOKEN (optional — soft-fail)
#   MADFAM_BOT_PAT (legacy only — do not place it on the hot path; stale PATs
#                   must not override the repo-scoped GITHUB_TOKEN)
#   GHCR_PAT (optional — registry auth override for GHCR push/pull; falls
#             through to the repo-scoped GITHUB_TOKEN otherwise)
#   ENCLII_API_URL / ENCLII_DEPLOY_TOKEN (optional — for callback)
#   ENCLII_COMMIT_TOKEN (optional — PAT to push past branch protection;
#                        falls through to GITHUB_TOKEN otherwise)
#   NPM_MADFAM_TOKEN (required for repos consuming @janua/@madfam/@forj/@cotiza
#                     scoped packages from npm.madfam.io)
#
# BuildKit secret: npmrc
#   This workflow forwards `NPM_MADFAM_TOKEN` to `docker/build-push-action`
#   as a BuildKit secret named `npmrc`. Consumer Dockerfiles MUST mount it
#   on any `pnpm install` line that needs auth to npm.madfam.io:
#
#       RUN --mount=type=secret,id=npmrc,target=/root/.npmrc,required=true \
#           pnpm install --frozen-lockfile
#
#   The secret never lands in an image layer. Do NOT `COPY .npmrc ./`
#   into the build context — the committed `.npmrc` only carries scope
#   mappings and the auth token must come from the secret mount.
#
# Why this is safe:
#   - Base-image-mirror preference lives in each repo's Dockerfiles
#     (use `public.ecr.aws/docker/library/...` to sidestep Docker Hub
#     rate limits; this workflow doesn't dictate the FROM line).
#   - Cosign is pinned to a specific installer + release; unpinned
#     installers break on self-hosted runners.
#   - Docker Hub login is soft-fail: missing creds don't halt the run,
#     and base-image pulls go through the mirror anyway.

on:
  workflow_call:
    inputs:
      services:
        description: |
          JSON array of service definitions. Example:
          [{"name":"bff","dockerfile":"apps/bff/Dockerfile","paths":"apps/bff packages"},
           {"name":"api","dockerfile":"apps/api/Dockerfile","paths":"apps/api"},
           {"name":"web","context":"frontend","dockerfile":"frontend/Dockerfile",
            "paths":"frontend",
            "build_args":"API_BASE_URL=https://api.almanac.solar"}]
          Fields:
            - name:       service name (becomes image suffix)
            - dockerfile: path to Dockerfile from repo root
            - context:    (optional) build context; defaults to "."
                          Set this when the Dockerfile's COPY paths are
                          relative to a subdir, not the repo root.
            - target:     (optional) Dockerfile stage to build
                          (`docker build --target`). Omit to build the
                          final stage. Lets one Dockerfile publish
                          multiple images (one service entry per stage).
            - paths:      (optional) space-separated paths for change
                          detection on push triggers. Service is rebuilt
                          when the diff touches any of its paths.
            - build_args: (optional) newline-separated KEY=VALUE pairs
                          forwarded to `docker build --build-arg`. Use
                          for compile-time-baked values (Flutter
                          --dart-define, Next.js NEXT_PUBLIC_*).
                          Without this, Dockerfile ARGs only see defaults.
            - implicit_dockerfile_dir:
                          (optional, default true) add the Dockerfile's
                          containing directory to the change filter. Set false
                          for root-level aggregate Dockerfiles such as
                          services/Dockerfile.ingestion so they do not watch
                          an entire monorepo service tree.
                          NOTE: the `dockerfile` path AND its containing
                          directory are ALWAYS implicitly part of the
                          filter for services that declare any `paths`.
                          So `dockerfile: "frontend/Dockerfile"` always
                          watches `frontend/Dockerfile` and `frontend/**`,
                          even if `paths` would otherwise miss them.
                          Services that omit `paths` entirely keep the
                          legacy "always build" behavior.
        required: true
        type: string
      image_prefix:
        description: Image path prefix, e.g. "ghcr.io/madfam-org/routecraft".
        required: true
        type: string
      kustomization_path:
        description: Directory containing the kustomization.yaml to pin.
        required: true
        type: string
      cosign_release:
        description: cosign release tag.
        required: false
        type: string
        default: v2.4.3
      cosign_installer_ref:
        description: sigstore/cosign-installer ref.
        required: false
        type: string
        default: v3.7.0
      enclii_notify_event:
        description: Event name to POST to Enclii lifecycle (empty = skip).
        required: false
        type: string
        default: image-digest-committed
      ci_user_name:
        description: git user.name for the digest-pin commit.
        required: false
        type: string
        default: madfam-ci[bot]
      ci_user_email:
        description: git user.email for the digest-pin commit.
        required: false
        type: string
        default: ci@madfam.io
      rebuild_all_paths:
        description: |
          Extended regex; if any changed file matches, rebuild ALL
          services (not just the ones whose `paths` changed). Typical
          use: workflow file + k8s manifests.
        required: false
        type: string
        default: '^(\.github/workflows/.*\.yml|infra/k8s/(production|overlays)/)'
      build_runner:
        description: |
          Optional runner label for Docker build jobs. Leave empty to use
          the platform default, or set to ubuntu-latest for repos that need
          to avoid unavailable ARC/self-hosted capacity.
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  detect-changes:
    name: Detect changed services
    # Keep lightweight orchestration off scarce ARC builders. Only Docker
    # builds need the self-hosted runner pool.
    runs-on: ${{ inputs.build_runner != '' && inputs.build_runner || (vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest') }}
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compute service matrix
        id: filter
        env:
          SERVICES_INPUT: ${{ inputs.services }}
          REBUILD_ALL_PATHS: ${{ inputs.rebuild_all_paths }}
        run: |
          set -euo pipefail

          services_all=$(printf '%s' "$SERVICES_INPUT" | jq -c .)
          echo "Input services: $services_all"

          # Manual re-dispatch with a service override — skip the change
          # detection entirely and build what the user asked for.
          override='${{ github.event.inputs.services || '' }}'
          if [ -n "$override" ]; then
            picked=$(echo "$services_all" | jq -c --arg list "$override" \
              '[.[] | select(.name as $n | ($list | split(",")) | index($n))]')
            echo "matrix=$picked" >> "$GITHUB_OUTPUT"
            echo "any=$(echo "$picked" | jq 'length > 0')" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Change detection. `github.event.before` is empty on
          # workflow_dispatch; fall through to HEAD~1 in that case.
          changed=$(git diff --name-only "${{ github.event.before || '' }}" "${{ github.sha }}" 2>/dev/null \
            || git diff --name-only HEAD~1 HEAD 2>/dev/null \
            || true)
          echo "Changed files:"
          echo "${changed:-<none>}"

          # Services whose `paths` glob-root matched a changed file.
          # while-read (NOT `for row in $()`) preserves JSON with spaces.
          #
          # The effective filter for each service is its declared `paths`
          # PLUS implicit entries derived from its `dockerfile`:
          #   1. The dockerfile path itself (exact match)
          #   2. The directory containing the dockerfile (prefix match)
          # This ensures Dockerfile-only diffs and any change under the
          # dockerfile's home directory always trigger a rebuild — closing
          # the "Dockerfile bump silently skipped" class of bug
          # (bloom-scroll PR #72 / commit b9f7699 was the canary symptom).
          #
          # Backward-compatible: a service with no declared `paths` keeps
          # falling through to the no-paths fallback below (which builds
          # it on every push). We do NOT auto-add implicit paths to such
          # services, because doing so would flip them from "always build"
          # to "build only when their dir changed" — a behavior change
          # forj and digifab-quoting explicitly rely on.
          picked='[]'
          while IFS= read -r row; do
            [ -z "$row" ] && continue
            paths=$(echo "$row" | jq -r '.paths // empty')
            # Skip services with no declared paths — handled by the
            # no-paths fallback below.
            [ -z "$paths" ] && continue

            dockerfile=$(echo "$row" | jq -r '.dockerfile // empty')
            implicit_df_dir=$(echo "$row" | jq -r 'if has("implicit_dockerfile_dir") then .implicit_dockerfile_dir else true end')
            df_dir=""
            if [ -n "$dockerfile" ]; then
              df_dir=$(dirname "$dockerfile")
              # Treat "." (dockerfile at repo root) as no implicit dir.
              [ "$df_dir" = "." ] && df_dir=""
            fi

            effective_paths="$paths"
            if [ "$implicit_df_dir" != "false" ] && [ -n "$df_dir" ]; then
              effective_paths="$effective_paths $df_dir"
            fi
            echo "Service '$(echo "$row" | jq -r '.name')' effective filter: $effective_paths (dockerfile=$dockerfile implicit_dockerfile_dir=$implicit_df_dir)"

            matched=0
            # Prefix match: any change under one of the declared/implicit dirs.
            for p in $effective_paths; do
              # Strip trailing slash to normalize before re-adding it.
              p="${p%/}"
              if echo "$changed" | grep -q "^$p/"; then
                picked=$(echo "$picked" | jq -c --argjson svc "$row" '. + [$svc]')
                matched=1
                break
              fi
            done
            # Exact-file match on the dockerfile itself (catches the
            # repo-root Dockerfile case where df_dir is empty, AND
            # protects against malformed prefix grep on edge filenames).
            if [ "$matched" = "0" ] && [ -n "$dockerfile" ]; then
              if echo "$changed" | grep -qFx "$dockerfile"; then
                picked=$(echo "$picked" | jq -c --argjson svc "$row" '. + [$svc]')
              fi
            fi
          done < <(echo "$services_all" | jq -c '.[]')

          # Workflow / infra changes rebuild all services.
          if echo "$changed" | grep -qE "$REBUILD_ALL_PATHS"; then
            echo "rebuild_all triggered by infra/workflow change"
            picked="$services_all"
          fi

          # Fallback: if a service has no `paths`, always build it
          # (so minimal configs keep working).
          no_paths=$(echo "$services_all" | jq -c '[.[] | select(.paths == null or .paths == "")]')
          if [ "$(echo "$no_paths" | jq 'length')" != "0" ]; then
            picked=$(jq -c -s '.[0] + .[1] | unique_by(.name)' <(echo "$picked") <(echo "$no_paths"))
          fi

          # Compact to single-line for GITHUB_OUTPUT.
          picked=$(echo "$picked" | jq -c .)

          echo "matrix=$picked" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$picked" | jq 'length > 0')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ${{ inputs.build_runner != '' && inputs.build_runner || (vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # Docker Hub login BEFORE buildx, so buildx picks up creds when
      # its container starts. Conditional + soft-fail so missing creds
      # don't halt — Dockerfiles should use `public.ecr.aws/docker/library/*`
      # as their base anyway, but this keeps the auth path available
      # when it IS configured.
      - name: Log in to Docker Hub
        if: ${{ env.DH_USER != '' && env.DH_TOKEN != '' }}
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: ${{ inputs.cosign_release }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v7
        with:
          # `context` defaults to "." (repo root). Services with a
          # subdirectory build root (e.g. bloom-scroll's backend/ and
          # frontend/, where Dockerfile COPY paths are relative to the
          # subdir) can set it per-service in the matrix JSON.
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile }}
          # Optional Dockerfile stage (`target` in the service entry).
          # Empty string = final stage (the action omits --target).
          target: ${{ matrix.service.target || '' }}
          platforms: linux/amd64
          push: true
          provenance: false
          # No :latest — Kyverno `disallow-latest-tag` rejects.
          tags: |
            ${{ inputs.image_prefix }}/${{ matrix.service.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Per-service build-args (one KEY=VALUE per line). Use this for
          # compile-time-baked values like Flutter `--dart-define`, Next.js
          # `NEXT_PUBLIC_*`, or any other value the Dockerfile reads via
          # `ARG`. Add `"build_args": "K=V\nK2=V2"` to the service entry in
          # the matrix JSON.
          #
          # Without this, Dockerfile ARGs only see their declared defaults
          # — the trap that bit bloom-scroll (almanac.solar shipped a
          # `localhost:8000` Flutter bundle) and karafiel (build-time
          # NEXT_PUBLIC_API_URL silently dropping to localhost).
          build-args: ${{ matrix.service.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          # BuildKit secret: forwarded to Dockerfiles via
          #   RUN --mount=type=secret,id=npmrc,target=/root/.npmrc ...
          # Carries the auth token for npm.madfam.io scoped packages
          # (@janua, @madfam, @forj, @cotiza). Never lands in an image layer.
          # Repos that don't consume private packages can still receive the
          # secret harmlessly — it's only read when a Dockerfile mounts it.
          secrets: |
            npmrc=//npm.madfam.io/:_authToken=${{ secrets.NPM_MADFAM_TOKEN }}

      - name: Sign image (keyless, Fulcio/Rekor)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes "${{ inputs.image_prefix }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}"

      - name: Emit digest artifact
        run: |
          mkdir -p digests
          printf '%s=%s\n' "${{ matrix.service.name }}" "${{ steps.build.outputs.digest }}" \
            > "digests/${{ matrix.service.name }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service.name }}
          path: digests/

  pin:
    name: Commit digest pins
    needs: [detect-changes, build]
    # Pin every successfully built service even when sibling matrix jobs fail.
    if: >-
      always() &&
      needs.detect-changes.outputs.any == 'true' &&
      needs.build.result != 'cancelled' &&
      needs.build.result != 'skipped'
    # Digest pinning is git/kustomize/curl work; do not burn an ARC build slot.
    runs-on: ${{ inputs.build_runner != '' && inputs.build_runner || (vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest') }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT if the caller provides ENCLII_COMMIT_TOKEN (to bypass
          # branch protection); fall through to the repo-scoped GITHUB_TOKEN.
          # Do not fall back to MADFAM_BOT_PAT: an expired org bot token can
          # otherwise break every caller even when GITHUB_TOKEN has package
          # and contents permissions.
          token: ${{ secrets.ENCLII_COMMIT_TOKEN || github.token }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: ${{ inputs.cosign_release }}

      - name: Log in to GHCR for digest verification
        # Private GHCR packages require registry auth for cosign verify's
        # manifest reads. Build jobs log in before push/sign; the separate pin
        # job needs its own login before verifying the signed digest.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Download all digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Skip when no successful builds produced digests
        id: digests
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(digests/*.txt "$GITHUB_WORKSPACE"/digests/*.txt)
          count=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No digest artifacts from successful builds; skipping pin."
          fi

      - name: Update kustomization image digests
        if: steps.digests.outputs.count != '0'
        env:
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
          KUSTOMIZATION_PATH: ${{ inputs.kustomization_path }}
        run: |
          set -euo pipefail
          cd "$KUSTOMIZATION_PATH"
          shopt -s nullglob
          for f in ../../../digests/*.txt "$GITHUB_WORKSPACE"/digests/*.txt; do
            [ -f "$f" ] || continue
            line=$(cat "$f")
            name="${line%%=*}"
            digest="${line#*=}"
            if [[ "$digest" != sha256:* ]]; then
              echo "ERROR: Refusing to pin non-sha256 digest for $name: $digest"
              exit 1
            fi
            ref="${IMAGE_PREFIX}/${name}@${digest}"
            echo "Verifying cosign signature for $ref"
            verified=0
            for wait in 0 5 10 20 30 60; do
              if [ "$wait" -gt 0 ]; then
                echo "Signature not visible yet for $ref, retrying in ${wait}s..."
                sleep "$wait"
              fi
              if COSIGN_EXPERIMENTAL=1 cosign verify \
                --certificate-identity-regexp='^https://github\.com/madfam-org/[A-Za-z0-9_.-]+/\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml@refs/(heads/main|tags/v[0-9].*)$' \
                --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
                "$ref" >/tmp/cosign-verify-${name}.json 2>/tmp/cosign-verify-${name}.err; then
                verified=1
                break
              fi
            done
            if [ "$verified" -ne 1 ]; then
              echo "ERROR: Refusing to pin unsigned or unverifiable digest $ref"
              cat /tmp/cosign-verify-${name}.err || true
              exit 1
            fi
            echo "Pinning signed digest $name to $digest"
            kustomize edit set image "${IMAGE_PREFIX}/${name}=${IMAGE_PREFIX}/${name}@${digest}"
          done

      - name: Commit & push digest update
        if: steps.digests.outputs.count != '0'
        env:
          CI_USER_NAME: ${{ inputs.ci_user_name }}
          CI_USER_EMAIL: ${{ inputs.ci_user_email }}
          KUSTOMIZATION_PATH: ${{ inputs.kustomization_path }}
        run: |
          set -euo pipefail
          git config user.name "$CI_USER_NAME"
          git config user.email "$CI_USER_EMAIL"
          target="${KUSTOMIZATION_PATH}/kustomization.yaml"
          if git diff --quiet -- "$target"; then
            echo "No digest changes to commit."
            exit 0
          fi
          git add -- "$target"
          git commit -m "ci: pin image digests from ${{ github.sha }}"
          git push

      - name: Notify enclii lifecycle
        if: ${{ steps.digests.outputs.count != '0' && inputs.enclii_notify_event != '' && env.ENCLII_API_URL != '' }}
        env:
          ENCLII_API_URL: ${{ secrets.ENCLII_API_URL }}
          ENCLII_DEPLOY_TOKEN: ${{ secrets.ENCLII_DEPLOY_TOKEN }}
          EVENT: ${{ inputs.enclii_notify_event }}
        run: |
          curl -sS -X POST "$ENCLII_API_URL/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer $ENCLII_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"project\":\"${{ github.event.repository.name }}\",\"commit\":\"${{ github.sha }}\",\"event\":\"$EVENT\"}" \
            || true
