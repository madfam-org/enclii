name: Blueprint Service Publish

# Publish reviewed API, ML and compliance sources through the existing Enclii release credential.
# Keep the currently configured enclii service image namespaces; never copy a digest
# between registries. A successful pin still needs Enclii runtime acceptance.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to publish (requires the exact current main SHA)
        required: true
        type: choice
        default: api
        options: [api, ml, compliance]
      git_ref:
        description: Exact current main SHA with successful CI
        required: true
        type: string
      deploy_ack:
        description: Type "production-kustomization" to acknowledge production publish.
        required: true
        type: string
      reason:
        description: Audit reason (min 12 characters)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

env:
  SERVICE: ${{ inputs.service }}
  IMAGE_PREFIX: ${{ inputs.service != 'api' && 'ghcr.io/madfam-org/enclii' || 'ghcr.io/madfam-org/blueprint-harvester' }}
  HARVESTER_REPO: madfam-org/blueprint-harvester

concurrency:
  group: blueprint-service-publish-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Acknowledgement
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          SOURCE_SHA: ${{ inputs.git_ref }}
          DEPLOY_ACK: ${{ inputs.deploy_ack }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          [[ "$SERVICE" == "api" || "$SERVICE" == "ml" || "$SERVICE" == "compliance" ]] || { echo "Unsupported service"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "git_ref must be an exact commit SHA"; exit 1; }
          if [ "$DEPLOY_ACK" != "production-kustomization" ]; then
            echo "deploy_ack must be production-kustomization"
            exit 1
          fi
          if [ ${#REASON} -lt 12 ]; then
            echo "reason must be at least 12 characters"
            exit 1
          fi

  build-service:
    name: Build & pin service digest
    timeout-minutes: 45
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.HARVESTER_REPO }}
          ref: main
          path: blueprint-harvester
          token: ${{ secrets.GHCR_PAT }}

      - name: Require current main and successful exact-source CI
        working-directory: blueprint-harvester
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          SOURCE_SHA: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh run list -R "$HARVESTER_REPO" --workflow ci.yml --branch main \
            --event push --commit "$SOURCE_SHA" --limit 1 --json status,conclusion > /tmp/source-ci.json
          jq -e 'length == 1 and .[0].status == "completed" and .[0].conclusion == "success"' /tmp/source-ci.json

      - name: Resolve product source revision
        id: source
        working-directory: blueprint-harvester
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          echo "${GHCR_PAT}" | docker login ghcr.io -u madfam-bot --password-stdin

      - name: Build & push service
        id: build
        uses: docker/build-push-action@v6
        with:
          context: blueprint-harvester
          file: blueprint-harvester/services/${{ inputs.service }}/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/madfam-org/blueprint-harvester
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ inputs.service }}:${{ steps.source.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ inputs.service }}:main

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      # Retry signing only; never pin an unsigned image.
      - name: Sign service image
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}/${{ inputs.service }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz"
          echo "6703a3a70a0c47cf0b37694030b54f1175a9dfeb17b3818b623ed58b9dbc2a77  /tmp/kustomize.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          sudo install /tmp/kustomize /usr/local/bin/kustomize

      - name: Pin service digest in GitOps
        working-directory: blueprint-harvester/infra/k8s/production
        env:
          SERVICE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          kustomize edit set image "ghcr.io/madfam-org/blueprint-harvester/${SERVICE}=${IMAGE_PREFIX}/${SERVICE}@${SERVICE_DIGEST}"
          echo "Pinned ${SERVICE} @${SERVICE_DIGEST}"

      - name: Commit & push digest pin
        id: pin_commit
        working-directory: blueprint-harvester
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "Source main advanced; rebuild the new reviewed head"; exit 1; }
          git config user.name "madfam-ci[bot]"
          git config user.email "ci@madfam.io"
          if git diff --quiet infra/k8s/production/kustomization.yaml; then
            echo "No digest changes to commit"
            exit 0
          fi
          git add infra/k8s/production/kustomization.yaml
          git commit -m "chore(gitops): pin ${SERVICE} digest from Enclii blueprint-api-publish" \
            -m "Reason: ${REASON}"
          git push

      # A pushed image is not a deployed release; fail if its pin never lands.
      - name: Guard against silent stale deploy
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PIN_OUTCOME: ${{ steps.pin_commit.outcome }}
        run: |
          set -euo pipefail
          echo "build=${BUILD_OUTCOME} pin=${PIN_OUTCOME}"
          if [ "${BUILD_OUTCOME}" != "success" ]; then
            echo "No image was pushed; nothing to guard."
            exit 0
          fi
          if [ "${PIN_OUTCOME}" = "success" ]; then
            echo "Digest pin completed; verify rollout through Enclii before accepting production."
            exit 0
          fi
          echo "::error title=Image pushed but NOT pinned/deployed::The image for this commit was"
          echo "::error::built and pushed to GHCR, but the digest pin did not complete"
          echo "::error::(build=${BUILD_OUTCOME}, pin=${PIN_OUTCOME})."
          echo "::error::"
          echo "::error::ArgoCD was never handed a new digest, so THE LIVE HOST IS STILL SERVING"
          echo "::error::THE PREVIOUS BUILD even though this run otherwise looks done."
          echo "::error::"
          echo "::error::Fix: rerun the failed jobs (gh run rerun <run-id> --failed)."
          exit 1
