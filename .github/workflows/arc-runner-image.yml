name: Build ARC Runner Image

# Builds and publishes the MADFAM hardened ARC runner image
# (infra/docker/arc-runner) to GHCR.
#
# Why this runs on github-hosted ubuntu-latest, not on our self-hosted
# ARC pool: chicken-and-egg. The whole point of this workflow is to
# produce the runner image our ARC pool will consume. If we tried to
# build it on the broken pool, the build would fail for the very
# reasons we're fixing.
#
# Tag scheme:
#   :<git-sha>  immutable, used for provenance + pre-merge testing
#   :stable     moved to point at the latest main build
#
# See infra/docker/arc-runner/README.md for image rationale and the
# rebuild cadence policy.
#
# Since G16 the image also carries the commons render environment
# (libGL/X, Liberation fonts, OpenSCAD 2026.02.13). The "Smoke-check the
# render environment" step below gates every build on it, because a runner
# image that has drifted from yantra4d's platform image renders geometry
# that does not match production. Since G31 that step also RENDERS a BOSL2
# part in the built image: version strings and library presence are not
# enough — 2026.02.01 satisfied both and still could not render the
# platform's pinned BOSL2.

on:
  push:
    branches: [main]
    paths:
      - "infra/docker/arc-runner/**"
      - ".github/workflows/arc-runner-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/docker/arc-runner/**"
      - ".github/workflows/arc-runner-image.yml"
  workflow_dispatch:
    inputs:
      tag_stable:
        description: "Move :stable to point at this build (main only)."
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write  # for cosign keyless signing

concurrency:
  group: arc-runner-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/madfam-org/enclii/arc-runner

jobs:
  build:
    name: Build + push arc-runner image
    runs-on: ubuntu-latest
    # Raised from 20 with G16: the OpenSCAD AppImage is ~84 MB to download and
    # extracts to a few hundred MB, and the smoke check runs the image after.
    # Cached layers make the steady state fast; this covers a cold cache.
    timeout-minutes: 35

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag_sha: ${{ steps.meta.outputs.tag_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute tags
        id: meta
        run: |
          TAG_SHA="${GITHUB_SHA::12}"
          echo "tag_sha=${TAG_SHA}" >> "$GITHUB_OUTPUT"
          # On main pushes (or workflow_dispatch with tag_stable=true on main),
          # also publish :stable. Never on PRs.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "publish_stable=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && \
               [ "${GITHUB_REF}" = "refs/heads/main" ] && \
               [ "${{ inputs.tag_stable }}" = "true" ]; then
            echo "publish_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_stable=false" >> "$GITHUB_OUTPUT"
          fi
          # PRs: build but don't push to keep the registry clean.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "push_image=false" >> "$GITHUB_OUTPUT"
          else
            echo "push_image=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.meta.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble image tag list
        id: tags
        run: |
          TAGS="${IMAGE_NAME}:${{ steps.meta.outputs.tag_sha }}"
          if [ "${{ steps.meta.outputs.publish_stable }}" = "true" ]; then
            TAGS="${TAGS}
          ${IMAGE_NAME}:stable"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/arc-runner
          file: infra/docker/arc-runner/Dockerfile
          push: ${{ steps.meta.outputs.push_image == 'true' }}
          # Also load into the local daemon so the smoke check below can run
          # the image we just built. On PRs (push=false) this is the ONLY copy
          # that exists; on main it costs one extra local export and means the
          # smoke check gates the same bits that were pushed.
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          # Buildx cache via GHA cache backend — keeps rebuilds fast
          # when only the Dockerfile changes but the base image is hot.
          cache-from: type=gha,scope=arc-runner
          cache-to: type=gha,mode=max,scope=arc-runner
          labels: |
            org.opencontainers.image.source=https://github.com/madfam-org/enclii
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            enclii.dev/component=arc-runner

      # The render environment (G16) is the reason commons cartridges can build
      # on this pool at all, and every one of these three assertions maps to a
      # failure we have actually seen:
      #   - `openscad --version` pinned to the exact snapshot: the Ubuntu
      #     archive's openscad is older and silently renders DIFFERENT geometry
      #     for Gridfinity extended syntax, so "openscad exists" is not enough.
      #   - Liberation fonts: a missing font does not error, it renders boxes,
      #     and the part ships with unreadable labels.
      #   - libGL.so.1 loadable from Python: this is precisely how OCP
      #     (CadQuery's kernel) fails — `ctypes.CDLL` at import time, with the
      #     misleading message "CadQuery is not installed".
      # The Dockerfile checks the same things at build time; this re-checks
      # them through `docker run` on the final image, which is what the pool
      # actually executes (build-layer state and final-image state can differ).
      #
      # The distinction is load-bearing for the OpenSCAD payload specifically:
      # the build-time check runs as root (the image is still in its `USER
      # root` section there), while this one inherits the final image's `USER
      # runner`. A squashfs tree extracted root-only would sail through the
      # build and fail every real job; only this step sees that.
      - name: Smoke-check the render environment
        env:
          SMOKE_IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag_sha }}
          EXPECTED_OPENSCAD: "2026.02.13"
          # The platform's pinned BOSL2. Must match yantra4d's submodule commit
          # (v2.0.753) — rendering against a DIFFERENT BOSL2 than production
          # uses would make this check theatre.
          BOSL2_COMMIT: "fcfce7c7"
        run: |
          set -euo pipefail
          run() { docker run --rm --entrypoint bash "${SMOKE_IMAGE}" -c "$1"; }

          echo "::group::openscad --version"
          # OpenSCAD prints its version to stderr; xvfb-run because it is a Qt app.
          version_out="$(run 'xvfb-run -a openscad --version 2>&1' || true)"
          echo "${version_out}"
          echo "::endgroup::"
          if ! grep -q "${EXPECTED_OPENSCAD}" <<<"${version_out}"; then
            echo "::error::openscad did not report ${EXPECTED_OPENSCAD}. Got: ${version_out}"
            echo "::error::The image MUST match yantra4d apps/api/Dockerfile's OpenSCAD snapshot."
            exit 1
          fi

          echo "::group::fonts"
          # `|| true` so a missing font reaches the explicit check below with a
          # useful message, instead of `set -e` killing the step on the listing.
          run 'fc-list | grep -i liberation | head -5' || true
          echo "::endgroup::"
          if ! run 'fc-list | grep -qi liberation'; then
            echo "::error::Liberation fonts are missing (fc-list has no match)."
            echo "::error::Cartridges label parts with them; without them renders show boxes."
            exit 1
          fi

          echo "::group::libGL loadable from Python (OCP import path)"
          # Held in a variable so the python source uses double quotes and the
          # shell layer uses single ones — no nested-quote escaping to get wrong
          # on the next edit of this step.
          libgl_probe='import ctypes; ctypes.CDLL("libGL.so.1"); print("libGL.so.1 OK")'
          if ! run "python3 -c '${libgl_probe}'"; then
            echo "::error::libGL.so.1 is not loadable. OCP/CadQuery will die at import with"
            echo "::error::'CadQuery is not installed (libGL.so.1: cannot open shared object file)'."
            exit 1
          fi
          echo "::endgroup::"

          # ---------------------------------------------------------------
          # BOSL2 render (G31). The three checks above all PASSED on the
          # 2026.02.01 image that could not render a single anchored BOSL2
          # primitive: `openscad --version` was right, fonts were there, libGL
          # loaded — and `include <BOSL2/std.scad>; cube(..., anchor=...)`
          # still died with
          #   Assertion '(is_list($tags_shown) || ($tags_shown == "ALL"))'
          #   failed in libs/BOSL2/attachments.scad, line 3809
          # leaving an empty top-level object. Presence checks cannot see that;
          # only an actual render can. So the image build now renders one.
          #
          # BOSL2 is cloned on the HOST (the image has git, but keeping the
          # network out of the container makes the failure mode unambiguous)
          # and mounted read-only. Ownership does not matter for a read-only
          # bind, and OPENSCADPATH points at the PARENT directory because
          # `include <BOSL2/std.scad>` resolves BOSL2 as a subdirectory.
          echo "::group::BOSL2 ${BOSL2_COMMIT} renders (the G31 incompatibility)"
          BOSL2_DIR="${RUNNER_TEMP}/oscad-libs"
          mkdir -p "${BOSL2_DIR}"
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/BelfrySCAD/BOSL2 "${BOSL2_DIR}/BOSL2"
          git -C "${BOSL2_DIR}/BOSL2" fetch --quiet --depth 1 origin "${BOSL2_COMMIT}"
          git -C "${BOSL2_DIR}/BOSL2" checkout --quiet FETCH_HEAD
          echo "BOSL2 at $(git -C "${BOSL2_DIR}/BOSL2" rev-parse --short HEAD)"

          SMOKE_DIR="${RUNNER_TEMP}/oscad-smoke"
          mkdir -p "${SMOKE_DIR}"
          # The image runs as `runner` (uid 1001), which happens to match the
          # host runner uid on ubuntu-latest — but do not rely on that: a uid
          # mismatch would fail the write and read as "OpenSCAD cannot render
          # BOSL2", which is exactly the wrong conclusion.
          chmod 777 "${SMOKE_DIR}"
          # printf, not a heredoc: a heredoc terminator has to sit at column
          # zero, which would break out of this YAML block scalar.
          # These are verbatim the two lines from ruling G31.
          printf '%s\n' \
            'include <BOSL2/std.scad>' \
            'cube([1,1,1], anchor=[-1,-1,-1]);' \
            > "${SMOKE_DIR}/smoke.scad"
          cat "${SMOKE_DIR}/smoke.scad"

          render_rc=0
          docker run --rm \
            -v "${BOSL2_DIR}:/opt/oscad-libs:ro" \
            -v "${SMOKE_DIR}:/work" \
            -e OPENSCADPATH=/opt/oscad-libs \
            --entrypoint bash "${SMOKE_IMAGE}" -c \
            'cd /work && xvfb-run -a openscad -o /work/smoke.stl smoke.scad 2>&1' \
            || render_rc=$?
          echo "::endgroup::"

          if [ "${render_rc}" -ne 0 ]; then
            echo "::error::openscad ${EXPECTED_OPENSCAD} failed to render BOSL2 ${BOSL2_COMMIT} (exit ${render_rc})."
            echo "::error::This is the G31 incompatibility: the snapshot is too old for BOSL2 v2.0.753."
            echo "::error::Try the next files.openscad.org/snapshots build and bump both ARGs."
            exit 1
          fi
          # Exit 0 is NOT sufficient: the 2026.02.01 failure printed "Current
          # top level object is empty" and could still leave a stub file, so
          # assert real geometry came out.
          if [ ! -s "${SMOKE_DIR}/smoke.stl" ]; then
            echo "::error::openscad exited 0 but produced no/empty STL for the BOSL2 smoke part."
            exit 1
          fi
          STL_BYTES="$(wc -c < "${SMOKE_DIR}/smoke.stl" | tr -d ' ')"
          echo "BOSL2 smoke STL: ${STL_BYTES} bytes"
          if [ "${STL_BYTES}" -lt 200 ]; then
            echo "::error::BOSL2 smoke STL is ${STL_BYTES} bytes — too small to be a rendered cube."
            exit 1
          fi

          {
            echo "## Render environment smoke"
            echo ""
            echo "- OpenSCAD: \`$(tr -d '\r' <<<"${version_out}" | head -1)\`"
            echo "- BOSL2 \`${BOSL2_COMMIT}\` render: \`${STL_BYTES}\` byte STL"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Render environment smoke check passed."

      - name: Report image size
        env:
          SMOKE_IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag_sha }}
        run: |
          set -euo pipefail
          # Informational, not a gate: the repo has no image-size budget for
          # this image. Reporting the total AND the delta against the upstream
          # base on every build is what makes an unexpected jump visible in
          # review — the extracted OpenSCAD squashfs dominates the overlay, so
          # a bad bump shows up here first.
          SIZE_BYTES="$(docker image inspect "${SMOKE_IMAGE}" --format '{{.Size}}')"
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))
          echo "arc-runner image size: ${SIZE_MB} MiB"

          # The base is already in the local daemon as a build parent; pull is
          # a no-op if so. Non-fatal — a registry hiccup must not fail a build
          # over a number we only print.
          BASE_REF="$(awk -F= '/^ARG BASE_IMAGE=/{i=$2} /^ARG BASE_TAG=/{t=$2} END{print i":"t}' \
            infra/docker/arc-runner/Dockerfile)"
          DELTA_LINE="base \`${BASE_REF}\` size unavailable (registry not reachable); delta not computed."
          if docker pull -q "${BASE_REF}" >/dev/null 2>&1; then
            BASE_BYTES="$(docker image inspect "${BASE_REF}" --format '{{.Size}}')"
            BASE_MB=$(( BASE_BYTES / 1024 / 1024 ))
            DELTA_MB=$(( SIZE_MB - BASE_MB ))
            echo "base ${BASE_REF}: ${BASE_MB} MiB; overlay adds ${DELTA_MB} MiB"
            DELTA_LINE="Base \`${BASE_REF}\` is \`${BASE_MB} MiB\`, so this overlay (CI deps + the G16 render environment) adds \`${DELTA_MB} MiB\`."
          fi

          {
            echo "## Image size"
            echo ""
            echo "\`${SIZE_MB} MiB\` total, uncompressed (local daemon view)."
            echo ""
            echo "${DELTA_LINE}"
            echo ""
            echo "Within the overlay, the extracted OpenSCAD AppImage dominates"
            echo "(~84 MiB download, a few hundred MiB on disk); libGL/X,"
            echo "Liberation fonts and xvfb are a few tens of MiB."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        if: steps.meta.outputs.push_image == 'true'
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.3

      # Keyless signing needs GitHub's ambient OIDC endpoint, Fulcio and Rekor all
      # at once. A transient hiccup fails AFTER the image is pushed, stranding the
      # run before anything downstream — the crea-frontend 2026-08-26 failure
      # (run 33010085743, non-JSON from the OIDC endpoint; a plain rerun fixed it).
      # Retry the sign call only; the push above is already done and never repeats.
      - name: Sign image (keyless)
        if: steps.meta.outputs.push_image == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Sign by digest, not tag — tags are mutable, digests aren't.
          IMAGE_REF="${IMAGE_NAME}@${DIGEST}"
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## ARC runner image build"
            echo ""
            echo "- Pushed: \`${{ steps.meta.outputs.push_image }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Tags:"
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
            echo ""
            echo "Consume from Helm values:"
            echo '```yaml'
            echo "image: ${IMAGE_NAME}:stable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
