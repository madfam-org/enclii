name: GitOps Argo Sync

# Platform break-glass: sync a single Argo CD Application using production kubeconfig.
# Used when external repos (e.g. blueprint-harvester) lack ENCLII_API_TOKEN / KUBECONFIG secrets.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Argo Application name (argocd namespace)
        required: true
        default: blueprint-harvester-services
        type: string
      reason:
        description: Audit reason for sync (min 12 characters)
        required: true
        type: string
      deploy_ack:
        description: Type "production-kustomization" to acknowledge production sync
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Acknowledgement
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          DEPLOY_ACK: ${{ inputs.deploy_ack }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ACK" != "production-kustomization" ]; then
            echo "deploy_ack must be production-kustomization"
            exit 1
          fi
          if [ ${#REASON} -lt 12 ]; then
            echo "reason must be at least 12 characters"
            exit 1
          fi

  sync:
    name: Sync ${{ inputs.app }}
    needs: preflight
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    environment: production
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0

      - name: Sync Argo Application
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
          APP: ${{ inputs.app }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::KUBECONFIG_PRODUCTION secret is not configured on madfam-org/enclii"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          kubectl cluster-info --request-timeout=15s
          NS="argocd"
          if ! kubectl get application "$APP" -n "$NS" >/dev/null 2>&1; then
            echo "Argo Application ${APP} not found in ${NS}" >&2
            kubectl get applications -n "$NS" || true
            exit 1
          fi
          kubectl patch application "$APP" -n "$NS" --type merge -p \
            "{\"metadata\":{\"annotations\":{\"enclii.dev/last-ops-reason\":\"${REASON}\"}},\"operation\":{\"sync\":{\"syncStrategy\":{\"apply\":{\"force\":false}}},\"initiatedBy\":{\"username\":\"github-actions-enclii-gitops-sync\"}}}"
          echo "Sync requested for ${APP} in ${NS}"

      - name: Wait for sync completion
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="argocd"
          for i in $(seq 1 40); do
            phase="$(kubectl get application "$APP" -n "$NS" -o jsonpath='{.status.sync.status}' 2>/dev/null || echo Unknown)"
            health="$(kubectl get application "$APP" -n "$NS" -o jsonpath='{.status.health.status}' 2>/dev/null || echo Unknown)"
            echo "attempt $i: sync=$phase health=$health"
            if [ "$phase" = "Synced" ]; then
              echo "Argo sync phase reached Synced (health=$health)"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Timed out waiting for Synced+Healthy; continuing with rollout steps"
          kubectl get application "$APP" -n "$NS" -o jsonpath='{range .status.resources[*]}{.kind}/{.name} sync={.status} health={.health.status}{"\n"}{end}' 2>/dev/null || true

      - name: Refresh GHCR pull secret (blueprint-harvester)
        if: inputs.app == 'blueprint-harvester-services'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: madfam-bot
        run: |
          set -euo pipefail
          if [ -z "${GHCR_PAT:-}" ]; then
            echo "::warning::GHCR_PAT not set on enclii repo; skipping pull-secret refresh"
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="blueprint-harvester"
          kubectl create secret docker-registry ghcr-credentials \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_USERNAME}" \
            --docker-password="${GHCR_PAT}" \
            --namespace="${NS}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Refreshed ghcr-credentials in ${NS}"

      - name: Rollout restart landing (Demo GA)
        if: inputs.app == 'blueprint-harvester-services'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="blueprint-harvester"
          DEP="blueprint-harvester-landing"
          echo "Current landing image:"
          kubectl get deploy "$DEP" -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' || true
          kubectl rollout restart deployment/"$DEP" -n "$NS"
          kubectl rollout status deployment/"$DEP" -n "$NS" --timeout=300s || {
            echo "::error::Landing rollout failed; pod diagnostics:"
            kubectl get pods -n "$NS" -l app="$DEP" -o wide || true
            kubectl describe pods -n "$NS" -l app="$DEP" | tail -80 || true
            exit 1
          }
          echo "Pods after rollout:"
          kubectl get pods -n "$NS" -l app="$DEP" -o wide
          kubectl get pods -n "$NS" -l app="$DEP" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.phase}{" "}{.spec.containers[0].image}{"\n"}{end}'

      - name: Rollout restart API (tag-provenance / digest pin)
        if: inputs.app == 'blueprint-harvester-services'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="blueprint-harvester"
          DEP="blueprint-harvester-api"
          echo "Current API image:"
          kubectl get deploy "$DEP" -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' || true
          kubectl rollout restart deployment/"$DEP" -n "$NS"
          kubectl rollout status deployment/"$DEP" -n "$NS" --timeout=300s || {
            echo "::error::API rollout failed"
            kubectl get pods -n "$NS" -l app="$DEP" -o wide || true
            exit 1
          }
          kubectl get pods -n "$NS" -l app="$DEP" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.phase}{" "}{.spec.containers[0].image}{"\n"}{end}'
