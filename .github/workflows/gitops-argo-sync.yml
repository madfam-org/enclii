name: GitOps Argo Sync

# Platform break-glass: sync a single Argo CD Application using production kubeconfig.
# Used when external repos (e.g. blueprint-harvester) lack ENCLII_API_TOKEN / KUBECONFIG secrets.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Argo Application (core-services recovery syncs API and docs Deployments only)
        required: true
        default: blueprint-harvester-services
        type: string
      revision:
        description: Exact reviewed Git revision (required for core-services)
        required: false
        default: ''
        type: string
      reason:
        description: Audit reason for sync (min 12 characters)
        required: true
        type: string
      deploy_ack:
        description: Type "production-kustomization" to acknowledge production sync
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Acknowledgement
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs
        env:
          DEPLOY_ACK: ${{ inputs.deploy_ack }}
          REASON: ${{ inputs.reason }}
          APP: ${{ inputs.app }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ACK" != "production-kustomization" ]; then
            echo "deploy_ack must be production-kustomization"
            exit 1
          fi
          if [ ${#REASON} -lt 12 ]; then
            echo "reason must be at least 12 characters"
            exit 1
          fi
          if [ "$APP" = "core-services" ] && ! [[ "$REVISION" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "core-services requires an exact reviewed 40-character Git revision"
            exit 1
          fi

  sync:
    name: Sync ${{ inputs.app }}
    needs: preflight
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    environment: production
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0

      - name: Sync Argo Application
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
          APP: ${{ inputs.app }}
          REASON: ${{ inputs.reason }}
          REVISION: ${{ inputs.revision }}
          REQUEST_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::KUBECONFIG_PRODUCTION secret is not configured on madfam-org/enclii"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          umask 077
          SYNC_TMP=$(mktemp -d)
          trap 'rm -rf "$SYNC_TMP"' EXIT
          kubectl get application "$APP" -n argocd -o json > "$SYNC_TMP/current.json"
          python3 - "$SYNC_TMP/current.json" "$SYNC_TMP/requested.json" <<'PY_SYNC'
          import json, os, sys
          from pathlib import Path
          app = json.loads(Path(sys.argv[1]).read_text())
          if app.get("operation"):
              sys.exit("An Argo operation is already active; inspect it before retrying")
          metadata = app["metadata"]
          if not metadata.get("resourceVersion"):
              sys.exit("Application resourceVersion is missing; refusing an unconditional write")
          annotations = metadata.setdefault("annotations", {})
          annotations["enclii.dev/last-ops-reason"] = os.environ["REASON"]
          annotations["enclii.dev/last-ops-request-id"] = os.environ["REQUEST_ID"]
          sync = {"prune": False, "syncStrategy": {"apply": {"force": False}}}
          if os.environ["APP"] == "core-services":
              # Bounded recovery: only the reviewed report API and docs images.
              # Construct this allowlist afresh; never inherit a selective sync.
              sync["resources"] = [
                  {"group": "apps", "kind": "Deployment", "name": "switchyard-api", "namespace": "enclii"},
                  {"group": "apps", "kind": "Deployment", "name": "docs-site", "namespace": "enclii"},
              ]
          if os.environ.get("REVISION"):
              sync["revision"] = os.environ["REVISION"]
          app["operation"] = {
              "sync": sync,
              "initiatedBy": {"username": "github-actions-enclii-gitops-sync"},
              "info": [{"name": "enclii-request-id", "value": os.environ["REQUEST_ID"]}],
          }
          Path(sys.argv[2]).write_text(json.dumps(app))
          PY_SYNC
          # Replace is an atomic resourceVersion CAS. Never retry a conflict or
          # merge a concurrent operation's revision/resources/automated fields.
          kubectl replace -f "$SYNC_TMP/requested.json" >/dev/null
          echo "Sync requested for ${APP}; prune=false; request=${REQUEST_ID}"

      - name: Wait for sync completion
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
          APP: ${{ inputs.app }}
          REVISION: ${{ inputs.revision }}
          REQUEST_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          umask 077
          SYNC_TMP=$(mktemp -d)
          trap 'rm -rf "$SYNC_TMP"' EXIT
          for i in $(seq 1 40); do
            kubectl get application "$APP" -n argocd -o json > "$SYNC_TMP/current.json"
            state=$(python3 - "$SYNC_TMP/current.json" <<'PY_WAIT'
          import json, os, sys
          from pathlib import Path
          app = json.loads(Path(sys.argv[1]).read_text())
          state = app.get("status", {}).get("operationState", {})
          info = state.get("operation", {}).get("info", [])
          ours = any(item.get("name") == "enclii-request-id" and item.get("value") == os.environ["REQUEST_ID"] for item in info)
          phase = state.get("phase", "Unknown")
          if not ours:
              print("waiting")
          elif phase in ("Failed", "Error"):
              print("failed")
          elif phase == "Succeeded" and state.get("finishedAt"):
              expected = os.environ.get("REVISION")
              actual = state.get("syncResult", {}).get("revision")
              print("completed" if not expected or actual == expected else "wrong_revision")
          else:
              print("waiting")
          PY_WAIT
            )
            echo "attempt $i: request=${REQUEST_ID} state=$state"
            case "$state" in
              completed)
                if [ "$APP" = "core-services" ]; then
                  # An unrelated platform service may already be Degraded.
                  # Verify the recovery target; the operator also checks its exact digest.
                  kubectl rollout status deployment/switchyard-api -n enclii --timeout=300s
                fi
                echo "Requested Argo operation completed successfully"
                exit 0
                ;;
              failed|wrong_revision)
                echo "::error::Requested Argo operation failed or applied an unexpected revision"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the requested Argo operation to complete"
          exit 1

      - name: Refresh GHCR pull secret (blueprint-harvester)
        if: inputs.app == 'blueprint-harvester-services'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: madfam-bot
        run: |
          set -euo pipefail
          if [ -z "${GHCR_PAT:-}" ]; then
            echo "::warning::GHCR_PAT not set on enclii repo; skipping pull-secret refresh"
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="blueprint-harvester"
          kubectl create secret docker-registry ghcr-credentials \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_USERNAME}" \
            --docker-password="${GHCR_PAT}" \
            --namespace="${NS}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Refreshed ghcr-credentials in ${NS}"

      - name: Rollout restart landing (Demo GA)
        if: inputs.app == 'blueprint-harvester-services'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="blueprint-harvester"
          DEP="blueprint-harvester-landing"
          echo "Current landing image:"
          kubectl get deploy "$DEP" -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' || true
          kubectl rollout restart deployment/"$DEP" -n "$NS"
          kubectl rollout status deployment/"$DEP" -n "$NS" --timeout=300s || {
            echo "::error::Landing rollout failed; pod diagnostics:"
            kubectl get pods -n "$NS" -l app="$DEP" -o wide || true
            kubectl describe pods -n "$NS" -l app="$DEP" | tail -80 || true
            exit 1
          }
          echo "Pods after rollout:"
          kubectl get pods -n "$NS" -l app="$DEP" -o wide
          kubectl get pods -n "$NS" -l app="$DEP" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.phase}{" "}{.spec.containers[0].image}{"\n"}{end}'

      - name: Rollout restart API (tag-provenance / digest pin)
        if: inputs.app == 'blueprint-harvester-services'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="blueprint-harvester"
          DEP="blueprint-harvester-api"
          echo "Current API image:"
          kubectl get deploy "$DEP" -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' || true
          kubectl rollout restart deployment/"$DEP" -n "$NS"
          kubectl rollout status deployment/"$DEP" -n "$NS" --timeout=300s || {
            echo "::error::API rollout failed"
            kubectl get pods -n "$NS" -l app="$DEP" -o wide || true
            exit 1
          }
          kubectl get pods -n "$NS" -l app="$DEP" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.phase}{" "}{.spec.containers[0].image}{"\n"}{end}'

      - name: Rollout restart CEQ API (JWT env / JWKS validation)
        if: inputs.app == 'ceq-services'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="ceq"
          DEP="ceq-api"
          INTERNAL_JWKS="http://janua-api.janua.svc.cluster.local/.well-known/jwks.json"
          INTERNAL_JANUA="http://janua-api.janua.svc.cluster.local"

          echo "Apply CEQ network policies from main (includes allow-janua-egress)"
          curl -fsSL "https://raw.githubusercontent.com/madfam-org/ceq/main/infrastructure/k8s/network-policies.yaml" \
            | kubectl apply -f -

          echo "Hard-refresh Argo revision for ceq-services"
          kubectl patch application ceq-services -n argocd --type merge -p \
            '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}' || true
          sleep 10
          kubectl patch application ceq-services -n argocd --type merge -p \
            '{"operation":{"sync":{"syncStrategy":{"apply":{"force":false}}},"initiatedBy":{"username":"github-actions-ceq-jwks"}}}' || true
          sleep 15

          echo "JANUA env on deployment (pre-patch):"
          kubectl set env deployment/"$DEP" -n "$NS" --list | grep JANUA || true
          CURRENT_JWKS="$(kubectl set env deployment/"$DEP" -n "$NS" --list | awk -F= '/^JANUA_JWKS_URL=/{print $2}')"
          if [ "$CURRENT_JWKS" != "$INTERNAL_JWKS" ]; then
            echo "Patching JANUA_JWKS_URL -> in-cluster Janua"
            kubectl set env deployment/"$DEP" -n "$NS" \
              "JANUA_JWKS_URL=${INTERNAL_JWKS}" \
              "JANUA_API_URL=${INTERNAL_JANUA}"
          fi

          echo "Clear Pending ceq-api pods blocking rollout"
          kubectl get pods -n "$NS" -l app=ceq-api --field-selector=status.phase=Pending -o name \
            | xargs -r kubectl delete -n "$NS" --wait=false

          DESIRED="$(kubectl get deploy "$DEP" -n "$NS" -o jsonpath='{.spec.replicas}')"
          echo "Serializing rollout (desired replicas=${DESIRED})"
          kubectl scale deployment/"$DEP" -n "$NS" --replicas=1
          kubectl rollout restart deployment/"$DEP" -n "$NS"
          if ! kubectl rollout status deployment/"$DEP" -n "$NS" --timeout=300s; then
            echo "::error::ceq-api rollout failed"
            kubectl get pods -n "$NS" -l app=ceq-api -o wide || true
            kubectl describe pods -n "$NS" -l app=ceq-api | tail -80 || true
            kubectl logs -n "$NS" deployment/ceq-api --tail=40 || true
            exit 1
          fi
          if [ "${DESIRED}" != "1" ]; then
            kubectl scale deployment/"$DEP" -n "$NS" --replicas="${DESIRED}"
            kubectl rollout status deployment/"$DEP" -n "$NS" --timeout=300s || {
              echo "::warning::Second ceq-api replica did not become ready; auth may still work on one pod"
              kubectl get pods -n "$NS" -l app=ceq-api -o wide || true
            }
          fi
          echo "JANUA env on deployment (post-rollout):"
          kubectl set env deployment/"$DEP" -n "$NS" --list | grep JANUA || true
          echo "Verify in-cluster JWKS from ceq-api pod"
          CEQ_POD="$(kubectl get pod -n "$NS" -l app=ceq-api -o jsonpath='{.items[0].metadata.name}')"
          kubectl exec -n "$NS" "$CEQ_POD" -- python -c "import urllib.request as u; print('JWKS fetch ok:', u.urlopen('http://janua-api.janua.svc.cluster.local/.well-known/jwks.json', timeout=5).read(120))" || true
          kubectl logs -n "$NS" -l app=ceq-api --tail=30 | grep -Ei 'jwks|janua|401|invalid' || true
          echo "ceq-api pods after rollout:"
          kubectl get pods -n "$NS" -l app=ceq-api -o wide

      - name: Rollout restart CEQ Studio (auth probe / session UX)
        if: inputs.app == 'ceq-services'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          NS="ceq"
          DEP="ceq-studio"
          kubectl rollout restart deployment/"$DEP" -n "$NS"
          kubectl rollout status deployment/"$DEP" -n "$NS" --timeout=300s
