name: Blueprint Thingiverse Secrets

# Patch THINGIVERSE_* keys into blueprint-harvester-secrets and restart ingestion.
# Requires repo secrets: KUBECONFIG_PRODUCTION, THINGIVERSE_API_KEY

on:
  workflow_dispatch:
    inputs:
      deploy_ack:
        description: Type "production-kustomization" to acknowledge production secret patch.
        required: true
        type: string
      reason:
        description: Audit reason (min 12 characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Acknowledgement
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          DEPLOY_ACK: ${{ inputs.deploy_ack }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ACK" != "production-kustomization" ]; then
            echo "deploy_ack must be production-kustomization"
            exit 1
          fi
          if [ ${#REASON} -lt 12 ]; then
            echo "reason must be at least 12 characters"
            exit 1
          fi

  patch:
    name: Patch Thingiverse secrets
    needs: preflight
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    environment: production
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.0

      - name: Patch blueprint-harvester-secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
          THINGIVERSE_API_KEY: ${{ secrets.THINGIVERSE_API_KEY }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ -z "${THINGIVERSE_API_KEY:-}" ]; then
            echo "::error::THINGIVERSE_API_KEY not set on madfam-org/enclii"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          kubectl cluster-info --request-timeout=15s
          NS="blueprint-harvester"
          kubectl patch secret blueprint-harvester-secrets -n "$NS" --type merge \
            -p "{\"stringData\":{\"THINGIVERSE_API_KEY\":\"${THINGIVERSE_API_KEY}\",\"THINGIVERSE_OPERATOR_APPROVED\":\"true\"}}"
          echo "Patched THINGIVERSE_* in blueprint-harvester-secrets (reason: ${REASON})"
          kubectl rollout restart deployment/blueprint-harvester-ingestion -n "$NS"
          kubectl rollout status deployment/blueprint-harvester-ingestion -n "$NS" --timeout=180s
          kubectl annotate deployment blueprint-harvester-ingestion -n "$NS" \
            enclii.dev/last-thingiverse-secrets-reason="$REASON" --overwrite

      - name: Verify ingestion health endpoint
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            CURRENT_CONTEXT="$(kubectl config current-context)"
            CLUSTER_NAME="$(kubectl config view --raw -o jsonpath="{.contexts[?(@.name==\"${CURRENT_CONTEXT}\")].context.cluster}")"
            kubectl config set-cluster "${CLUSTER_NAME}" \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          fi
          kubectl cluster-info --request-timeout=15s
          POD="$(kubectl get pods -n blueprint-harvester -l app=blueprint-harvester-ingestion \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')"
          test -n "$POD"
          kubectl exec -n blueprint-harvester "$POD" -- sh -c 'test -n "$THINGIVERSE_API_KEY" && test "$THINGIVERSE_OPERATOR_APPROVED" = "true"'
          echo "Ingestion pod has THINGIVERSE env configured"
