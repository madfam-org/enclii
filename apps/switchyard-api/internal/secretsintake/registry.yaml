# Secret intake routing registry — friendly target id → Vault + ESO.
# Values are NEVER stored here. Add entries via PR review.
targets:
  ceq/vast-api-key:
    label: CEQ VAST API Key
    description: Orchestrator worker VAST provider key
    vault_path: secret/ceq
    namespace: ceq
    external_secret: ceq-orchestrator-secrets
    keys:
      - VAST_API_KEY

  ceq/janua-client-secret:
    label: CEQ Janua OAuth client secret
    description: CEQ studio/API Janua confidential client
    vault_path: secret/ceq
    namespace: ceq
    external_secret: ceq-janua-client-secret
    keys:
      - JANUA_CLIENT_SECRET

  lexidrop/oidc-janua:
    label: LexiDrop Janua OAuth client
    description: LexiDrop dashboard (ld-app.madfam.io) OIDC confidential client — id + secret for the api-side callback
    vault_path: secret/lexidrop
    namespace: lexidrop
    external_secret: lexidrop-secrets
    keys:
      - janua_client_id
      - janua_client_secret

  lexidrop/selva-inference:
    label: LexiDrop Selva inference token
    description: LexiDrop's worker token for Selva's OpenAI-compatible inference gateway (inference.selva.town) — powers the /find AI naming assistant. Same per-platform pattern as fortuna's openai_api_key at secret/fortuna.
    vault_path: secret/lexidrop
    namespace: lexidrop
    external_secret: lexidrop-selva
    keys:
      - selva_api_token

  dhanam/stripe-mx-live:
    label: Dhanam Stripe MX live keys
    description: Production MX Stripe secret + webhook signing secret
    vault_path: secret/dhanam
    namespace: dhanam
    external_secret: dhanam-secrets
    keys:
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET

  dhanam/oidc-janua:
    label: Dhanam Janua OAuth client
    description: Dhanam app OIDC client registered in Janua (not comms/financial)
    vault_path: secret/dhanam
    namespace: dhanam
    external_secret: dhanam-secrets
    keys:
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_ISSUER

  dhanam/session-auth:
    label: Dhanam session / NextAuth secrets
    description: App session signing — not platform comms
    vault_path: secret/dhanam
    namespace: dhanam
    external_secret: dhanam-secrets
    keys:
      - SESSION_SECRET
      - NEXTAUTH_SECRET

  karafiel/web-oidc-janua:
    label: Karafiel tenant app Janua OAuth client
    description: Tenant SSO for app.karafiel.mx (separate from Karafiel Admin operator client)
    vault_path: secret/karafiel
    namespace: karafiel
    external_secret: karafiel-web-oidc
    keys:
      - web_oidc_client_id
      - web_janua_secret_key
      - web_oidc_issuer

  # Karafiel admin console session-cookie key (karafiel KF-12, ruling R42: app
  # sessions use their own secret, never the Janua OAuth client secret). A
  # single-key target so `--generate admin_session_secret` mints it without
  # prompting for any other key: 32 bytes of crypto/rand, written into Vault and
  # never returned. Rotating it signs every operator out once.
  karafiel/admin-session:
    label: Karafiel admin session secret
    description: Signs the admin.karafiel.mx operator session cookie (HS256); mint server-side with --generate admin_session_secret; must never equal the Janua client secret
    vault_path: secret/karafiel
    namespace: karafiel
    external_secret: karafiel-admin-session # pragma: allowlist secret — Kubernetes object name, not a credential
    keys:
      - admin_session_secret

  phynd-crm/oidc-janua:
    label: Phynd CRM Janua OAuth client
    description: Staff SSO for crm.madfam.io
    vault_path: secret/phynd-crm
    namespace: phynd-crm
    external_secret: phynd-crm-secrets
    keys:
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_ISSUER

  dhanam/app-infra:
    label: Dhanam app infra (R2, CF, observability)
    description: Dhanam-owned storage and telemetry — not Resend/SendGrid
    vault_path: secret/dhanam
    namespace: dhanam
    external_secret: dhanam-secrets
    keys:
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_ENDPOINT
      - CLOUDFLARE_API_TOKEN
      - NEXT_PUBLIC_POSTHOG_KEY
      - SENTRY_DSN

  platform/comms-resend-api-key:
    label: MADFAM shared Resend API key
    description: Single org Resend account — canonical in secret/comms; fan-out via ESO to janua, phynd-crm, madfam-site
    vault_path: secret/comms
    namespace: enclii
    external_secret: enclii-secrets
    keys:
      - resend-api-key

  enclii/internal-api-key:
    label: Enclii internal API key
    description: Switchyard ↔ Roundhouse internal auth
    vault_path: secret/enclii
    namespace: enclii
    external_secret: enclii-internal-api-key
    keys:
      - INTERNAL_API_KEY

  coupler/janua-service-token:
    label: Coupler Janua service token
    description: Shared machine token for Coupler gateway delegation to Janua (must match JANUA_SERVICE_TOKEN on janua-api)
    vault_path: secret/coupler
    namespace: coupler
    external_secret: coupler-gateway-secrets
    keys:
      - JANUA_SERVICE_TOKEN

  # Nauta writes LOWERCASE Vault properties, unlike dhanam/ceq/coupler above.
  # That is not a style choice to normalise away: nauta's ExternalSecrets
  # reference `property: janua_client_id`, and ESO is all-or-nothing per
  # ExternalSecret — a case mismatch here syncs ZERO keys and the pods start
  # with no environment at all.
  nauta/oidc-janua:
    label: Nauta Janua OAuth client (cockpit)
    description: Nauta fractional-CTO cockpit OIDC client (app.nauta.quest)
    vault_path: secret/nauta
    namespace: nauta
    external_secret: nauta-web-secrets
    keys:
      - janua_client_id
      - janua_client_secret

  # PARKED, deliberately. The nauta-portal client is registered and real, but no
  # ExternalSecret projects these two properties yet, so nothing consumes them.
  # They are intaken anyway because a Janua client_secret is shown exactly once:
  # capturing it now costs nothing and avoids a rotation on the day the portal
  # surface is wired. Extra properties at a Vault path are ignored by ESO, which
  # only fails on properties it references and cannot find.
  nauta/oidc-janua-portal:
    label: Nauta Janua OAuth client (white-labeled client workspace)
    description: Nauta tier-3 client workspace OIDC client (crea.madfam.io) — parked until an ExternalSecret projects it
    vault_path: secret/nauta
    namespace: nauta
    external_secret: nauta-web-secrets
    keys:
      - janua_portal_client_id
      - janua_portal_client_secret

  # The entitlement fail-open alarm's probe key (nauta #297). The probe reads a
  # client ERP surface guarded by NAUTA_INTERNAL_PROBE_KEY and holds the SAME
  # value on both sides — deliberately NOT janua_internal_api_key: a probe whose
  # job is to ask "is the identity credential missing?" must not itself carry a
  # credential to the identity provider. This key authorises nothing but the read.
  #
  # No consumer references it yet: the web pod's projection lives in
  # web-external-secret.yaml + _secrets-template.yaml (not committed as of this
  # target), and the alarm CronJob mounts its own copy. So like oidc-janua-portal
  # above, this is a parked extra property at secret/nauta — ESO only fails on
  # properties it references and cannot find, so an unmapped extra is ignored.
  # external_secret is nauta-web-secrets, the object the web-side mapping will
  # land in; until that mapping exists the post-intake force-sync refreshes it
  # harmlessly (the key is a no-op extra there). LOWERCASE property, to match the
  # `property:` field nauta's ExternalSecret will reference (ESO is all-or-nothing
  # per ExternalSecret). No `generate:` block is needed: --generate mints any key
  # the target declares, at the default 32 bytes of crypto/rand, so the operator
  # can `--generate nauta_internal_probe_key` and never handle a value.
  nauta/internal-probe-key:
    label: Nauta entitlement fail-open probe key (#297)
    description: Clave interna de la sonda del alarma de apertura-por-falla de entitlements de nauta; mismo valor en ambos lados, NO es janua_internal_api_key; generable en el servidor con --generate nauta_internal_probe_key
    vault_path: secret/nauta
    namespace: nauta
    external_secret: nauta-web-secrets
    keys:
      - nauta_internal_probe_key

  # crea-map, symbiosis-hcm and the nauta feed tokens below were added after the
  # operator had to fall back to break-glass `vault kv patch` inside vault-0 on
  # 2026-09-03: the secrets these apps needed that night had no intake target,
  # so the only route into Vault was the one route intake exists to replace.
  # Like nauta above, these write LOWERCASE Vault properties to match the
  # `property:` fields their ExternalSecrets reference.
  #
  # crea-map and symbiosis-hcm are deployed through Enclii, not from this repo's
  # infra/ tree, so their ExternalSecret names are not verifiable here. The names
  # below follow the convention in docs/rfcs/2026-09-01-client-in-a-day.md
  # (`<app>-secrets`). If one is wrong the Vault merge still succeeds and
  # `external_secret_refreshed: false` comes back in the intake status — the
  # force-sync is skipped, not silently reported as done. Fix the name here, do
  # not paper over it by dropping the field.
  crea-map/internal-api-key:
    label: crea-map clave interna (compuerta de humo)
    description: Clave interna compartida que resguarda la compuerta de humo del MAP — el llamador la envía y crea-map la coteja
    vault_path: secret/crea-map
    namespace: crea-map
    external_secret: crea-map-secrets
    keys:
      - internal_api_key

  # The inbound provisioner key is isolated from Kalya's database/login secret.
  # This exact property is also read by the native Kalya feed provisioner.
  kalya/internal-api-key:
    label: Kalya clave interna de aprovisionamiento
    description: Clave entrante para aprovisionar tenants y tokens de feeds; generada y custodiada en el servidor
    vault_path: secret/kalya
    namespace: kalya
    external_secret: kalya-internal-api-key # pragma: allowlist secret — Kubernetes object name, not a credential
    keys:
      - internal_api_key

  crea-map/kalya-feeds:
    label: crea-map feeds de kalya (ocupación y capacidad)
    description: URLs de los feeds de kalya que crea-map consume; el token del feed viaja dentro de la URL, por eso el valor completo es secreto
    vault_path: secret/crea-map
    namespace: crea-map
    external_secret: crea-map-secrets
    keys:
      - kalya_occupancy_feed_url
      - kalya_capacity_feed_url

  # crea-map's Selva AI-gateway bearer (#303). Operator-supplied, NOT --generate:
  # the value is a token minted on the Selva side, so Switchyard must not mint its
  # own — this is a value-intake target like kalya-feeds/oidc above. Same path and
  # ExternalSecret as the other crea-map targets — the intake write is a merge, so
  # it lands alongside them without clobbering. LOWERCASE property to match the
  # `property:` field crea-map's ExternalSecret references (ESO is all-or-nothing).
  crea-map/selva-api-key:
    label: crea-map Selva AI-gateway bearer (#303)
    description: Bearer con el que crea-map llama a la puerta de enlace de IA Selva; valor acuñado del lado de Selva y provisto por el operador (no se genera en el servidor)
    vault_path: secret/crea-map
    namespace: crea-map
    external_secret: crea-map-secrets
    keys:
      - selva_api_key

  # crea-map's RLS-por-caso switch (K23, #303). A plain on/off string, default
  # "false" — operator-supplied, value-intake, never generated. It rides the same
  # crea-map path and ExternalSecret as a merged extra property. LOWERCASE to
  # match the ExternalSecret's `property:` field (ESO is all-or-nothing).
  crea-map/rls-por-caso:
    label: crea-map RLS-por-caso switch (K23) — value 'false'/'true'
    description: Interruptor de RLS por caso del MAP (K23); cadena on/off simple, por defecto "false", provista por el operador
    vault_path: secret/crea-map
    namespace: crea-map
    external_secret: crea-map-secrets
    keys:
      - rls_por_caso

  # crea-map → janua payment-mail machine client (crea-map #688, janua #635).
  # The OIDC provisioner (config/ecosystem-oidc-provision.yaml →
  # crea-map-payment-mail) mints the client_credentials pair and files it here
  # as a MERGE at crea-map's path. crea-map reads JANUA_MAIL_CLIENT_ID to bind
  # every staff payment-mail intent to this client, and JANUA_MAIL_CLIENT_SECRET
  # only in the (suspended) payment-mail recovery sweep. LOWERCASE properties.
  crea-map/janua-mail-client:
    label: crea-map cliente de correo de pagos (janua, client_credentials)
    description: Par client_credentials del cliente máquina de crea-map hacia janua para los avisos de pago al personal (audiencia janua-email, alcance crea-map:payment-mail, ligado a la organización de Crea Tu Mundo); lo acuña el aprovisionador OIDC, no el operador
    vault_path: secret/crea-map
    namespace: crea-map
    external_secret: crea-map-secrets
    keys:
      - janua_mail_client_id
      - janua_mail_client_secret

  # symbiosis-hcm is the PRODUCER of the absence feed; crea-map cross-reads
  # map_absence_feed_key and consumes it as HCM_FEED_API_KEY. Intaking both keys
  # at the producer's path keeps one copy of the truth — the consumer's
  # ExternalSecret points back at secret/symbiosis-hcm rather than holding a
  # second copy that can drift on rotation.
  symbiosis-hcm/map-absence-feed:
    label: symbiosis-hcm feed de ausencias hacia el MAP
    description: URL y llave del feed de ausencias que symbiosis-hcm publica y crea-map consume como HCM_FEED_API_KEY
    vault_path: secret/symbiosis-hcm
    namespace: symbiosis-hcm
    external_secret: symbiosis-hcm-secrets
    keys:
      - map_absence_feed_url
      - map_absence_feed_key

  nauta/kalya-feed-tokens:
    label: Nauta tokens de feeds de kalya
    description: Tokens con los que nauta lee los feeds de kalya para las superficies de cliente
    vault_path: secret/nauta
    namespace: nauta
    external_secret: nauta-kalya-feeds # pragma: allowlist secret — Kubernetes object name, not a credential
    keys:
      - kalya_feed_tokens

  nauta/symbiosis-hcm-token:
    label: Nauta token de symbiosis-hcm
    description: Token con el que nauta llama a symbiosis-hcm para las superficies de RH del portal
    vault_path: secret/nauta
    namespace: nauta
    external_secret: nauta-web-secrets
    keys:
      - symbiosis_hcm_token

  # The OIDC-autoprovision landing for the nauta→Symbiosis-HCM machine edge.
  # `enclii secrets provision oidc --platform nauta-symbiosis-hcm` mints an
  # org-bound client_credentials client (audience symbiosis-hcm, scope hcm:hr)
  # and files its id+secret HERE. Distinct from nauta/symbiosis-hcm-token above:
  # that one holds a single static bearer (the pre-OAuth path); these two are the
  # runtime-minted OAuth pair nauta #264's `nauta-hcm-oauth` ExternalSecret reads.
  #
  # Same vault_path (secret/nauta) as every other nauta target — the write is a
  # MERGE (VaultClient.MergeSecretData reads-then-overlays), so these two keys
  # land ALONGSIDE janua_client_id, database_url and the rest; nothing is
  # clobbered. LOWERCASE properties, because nauta's ExternalSecret references
  # `property: symbiosis_hcm_oauth_client_id` and ESO is all-or-nothing.
  #
  # external_secret is nauta-hcm-oauth (the DEDICATED, isolated ExternalSecret
  # nauta #264 added), NOT nauta-web-secrets — so a not-yet-synced key degrades
  # only the RH slice, and the post-intake force-sync annotates the right object.
  nauta/symbiosis-hcm-oauth:
    label: Nauta cliente OAuth de symbiosis-hcm (client_credentials)
    description: Par id+secreto del cliente máquina org-bound (audience symbiosis-hcm, scope hcm:hr) con el que nauta acuña tokens de RH; lo escribe `enclii secrets provision oidc --platform nauta-symbiosis-hcm`
    vault_path: secret/nauta
    namespace: nauta
    external_secret: nauta-hcm-oauth
    keys:
      - symbiosis_hcm_oauth_client_id
      - symbiosis_hcm_oauth_client_secret

  janua/internal-api-key:
    label: Janua internal API key
    description: Shared internal key for service-to-service calls into janua-api (peer of enclii/internal-api-key)
    vault_path: secret/janua
    namespace: janua
    external_secret: janua-secrets
    keys:
      - internal_api_key

  # Angelia Courier — third-party messaging goes through one door
  # (internal-devops decisions/2026-09-05-third-party-messaging-via-angelia-courier.md,
  # angelia docs/adr/0010-courier-outbound-comms-substrate.md).
  #
  # ANGELIA OWNS ALL OF THEM. The "verifier-owns, cross-path read" pattern the
  # estate already uses for phynd ↔ selva: the platform that VERIFIES a
  # credential owns its canonical property, and every consumer reads that one
  # copy cross-path through its own ExternalSecret rather than holding a second
  # copy that drifts on rotation. Angelia verifies every one of these — the
  # producer keys against COURIER_PRODUCER_KEYS, the bot tokens against the
  # channel adapters, the receiver secret against the Alertmanager route — so
  # secret/angelia is the single writable home for all of them.
  #
  # These are LOWERCASE Vault properties, matching angelia's ExternalSecret
  # `property:` fields. ESO is all-or-nothing per ExternalSecret: a case
  # mismatch here syncs ZERO keys and angelia-api starts with courier
  # armed=false, which looks exactly like "not provisioned yet".
  #
  # Everything Courier ships with is INERT until these are populated: with no
  # key the routes answer 503 not_provisioned. Intaking a target does not arm
  # anything by itself — the operator still runs the target with a real value.
  angelia/courier-producer-keys:
    label: Angelia Courier producer keys
    description: Per-producer keys for POST /v1/courier/send. One property per calling system so a single producer can be revoked without touching the others; angelia's ExternalSecret template assembles them into COURIER_PRODUCER_KEYS. Producers read only their OWN key cross-path.
    vault_path: secret/angelia
    namespace: angelia
    external_secret: angelia-courier-secrets
    keys:
      - courier_producer_key_alarms
      - courier_producer_key_enclii_ops
      - courier_producer_key_tulana
      - courier_producer_key_madfam_site

  angelia/courier-channel-tokens:
    label: Angelia Courier channel bot tokens
    description: Bot tokens for Courier's direct channel adapters. Bot tokens only — never an incoming webhook URL, which is bound to one channel at creation and cannot serve an envelope whose recipient varies. Read own-path by angelia-api and by nothing else.
    vault_path: secret/angelia
    namespace: angelia
    external_secret: angelia-courier-secrets
    keys:
      - courier_telegram_bot_token
      - courier_slack_bot_token

  angelia/courier-alertmanager:
    label: Angelia Courier Alertmanager receiver secret
    description: Shared secret for POST /v1/courier/alertmanager. Deliberately NOT a producer key — a producer key authorises arbitrary envelopes to arbitrary recipients, this one authorises exactly one thing. Read own-path by angelia-api, cross-path by enclii's Alertmanager in the monitoring namespace.
    vault_path: secret/angelia
    namespace: angelia
    external_secret: angelia-courier-secrets
    keys:
      - courier_alertmanager_secret

  # Courier Part A — the durable delivery ledger (angelia
  # docs/runbooks/courier-provisioning.md, Step 0). With COURIER_LEDGER=postgres
  # angelia-api reads DATABASE_URL for PgLedger and REFUSES TO START without it
  # (no silent fall-back to in-memory); with COURIER_LEDGER unset the value is
  # ignored, so writing it first is safe. It is a connection string that
  # carries the angelia role's password, hence a secret and not a ConfigMap
  # value. Submit it with --value-file; --generate would mint random bytes that
  # are not a URL.
  angelia/courier-database-url:
    label: Angelia Courier ledger database URL
    description: Postgres connection string for Courier's durable ledger (PgLedger + retry worker) against the angelia database, never synapse. Carries the role password. angelia-courier-secrets projects it as DATABASE_URL on angelia-api. Inert until COURIER_LEDGER=postgres; apply migrations 0001-0004 before setting that env.
    vault_path: secret/angelia
    namespace: angelia
    external_secret: angelia-courier-secrets
    keys:
      - courier_database_url

  # R23 (internal-devops docket, ruled 2026-09-05, sequenced AFTER O21):
  # customer-facing notification webhooks go through Courier's `webhook`
  # channel (angelia #23). Each producer that sends to customer-supplied HTTPS
  # targets signs its payloads with ITS OWN key, so a customer's receiver can
  # tell which MADFAM service the delivery came from and one producer's key can
  # be revoked without silencing the others. The property SUFFIX is the pairing
  # mechanism: `courier_webhook_signing_key_<suffix>` pairs with that producer's
  # `courier_producer_key_<suffix>` on the same path; angelia's ExternalSecret
  # assembles them by prefix into COURIER_WEBHOOK_SIGNING_KEYS. A suffix that
  # matches no producer key is a signing key nobody can use; a producer with no
  # signing key authenticates normally and is refused 503 not_provisioned on the
  # webhook channel alone. Running this target is the arming step for the
  # channel — do not run it before O21 (one real page delivered) is accepted.
  angelia/courier-webhook-signing-keys:
    label: Angelia Courier webhook signing keys
    description: Per-producer HMAC-SHA256 signing keys for Courier's `webhook` channel (customer-supplied HTTPS targets, R23). One property per producer, suffix-paired with that producer's courier_producer_key_<suffix>; angelia's ExternalSecret template assembles them by prefix into COURIER_WEBHOOK_SIGNING_KEYS. Read own-path by angelia-api only — a producer never holds its own signing key. Inert until run; run only after O21.
    vault_path: secret/angelia
    namespace: angelia
    external_secret: angelia-courier-secrets
    keys:
      - courier_webhook_signing_key_alarms
      - courier_webhook_signing_key_enclii_ops
      - courier_webhook_signing_key_tulana
      - courier_webhook_signing_key_madfam_site

  # Per-tenant REGISTRAR credentials. Porkbun API keys are per Porkbun ACCOUNT,
  # and CTM holds creatumundo.mx in its own Porkbun account — the estate's
  # global ENCLII_PORKBUN_* pair cannot see that domain at all (Porkbun answers
  # INVALID_DOMAIN, which reads like a typo). This target is how CTM's key pair
  # reaches Vault without any human, agent, or terminal scrollback holding a
  # copy of it.
  #
  # Read at REQUEST time by switchyard-api's Vault client, not projected by ESO
  # into the pod: registrar accounts arrive whenever a client onboards, and an
  # env-var pair per tenant would mean an ExternalSecret edit plus a restart for
  # each one. There is deliberately no external_secret here — nothing should
  # mount these into a pod's environment.
  #
  # The Vault path and property names are matched by
  # ecosystem/tenants.json → registrar; changing one without the other resolves
  # to "credentials missing", not to a wrong-account call.
  crea/porkbun-registrar:
    label: CTM Porkbun registrar API credentials
    description: Llave y llave secreta de la cuenta Porkbun de Crea Tu Mundo (creatumundo.mx). Permiten que Enclii opere el registrador del cliente por API. Requisito del lado de Porkbun - la cuenta debe habilitar el acceso API por dominio en su tablero.
    vault_path: secret/crea
    namespace: crea
    keys:
      - porkbun_api_key
      - porkbun_secret_key

  # Telesia (onboarded 2026-09-12, enclii#546). Two targets, one Vault path.
  #
  # LOWERCASE properties throughout, matching the `property:` fields telesia's
  # ExternalSecrets reference. ESO is all-or-nothing per ExternalSecret: one
  # case mismatch syncs ZERO keys and the pods start with no environment at all,
  # which presents as a broken image rather than a naming error.
  #
  # Telesia's ExternalSecrets are currently GATED OUT of its kustomization and
  # the namespace runs on plain Secrets (the lexidrop/periplo/eido pattern),
  # because `secrets vault-backfill` could not write secret/telesia at all — the
  # Switchyard Vault token's policy covers only paths an intake target already
  # created (enclii#546, second comment; enclii#383). These targets are the
  # declaration that closes that loop: the Vault policy for secret/telesia is
  # the operator's to grant, and it is granted against these ids.
  telesia/oidc-janua:
    label: Telesia Janua OAuth client
    description: Telesia completionist dashboard (app.telesia.quest) OIDC confidential client — id + secret, filed by `enclii secrets provision oidc --platform telesia`
    vault_path: secret/telesia
    namespace: telesia
    external_secret: telesia-web-secrets  # pragma: allowlist secret
    keys:
      - janua_client_id
      - janua_client_secret

  # The runtime datastore triple. telesia-api and telesia-worker read the SAME
  # three properties from this one path; a Target carries a single
  # external_secret, so the post-intake force-sync annotates telesia-api-secrets
  # and telesia-worker-secrets is refreshed on its own refreshInterval. Do not
  # split this into two targets to work around that — two targets writing the
  # same three properties to the same path is how a rotation lands on one
  # consumer and not the other.
  #
  # direct_database_url is deliberately alongside database_url: Prisma migrate
  # must not run through PgBouncer, and telesia's pooled DSN is not available
  # yet either way (the onboarding PgBouncer step was denied — enclii#546).
  telesia/runtime:
    label: Telesia runtime datastores
    description: Telesia's Postgres and Redis DSNs — pooled database_url for the app, direct_database_url for Prisma migrate (never pooled), redis_url for the quest-sync queue. Read by telesia-api and telesia-worker.
    vault_path: secret/telesia
    namespace: telesia
    external_secret: telesia-api-secrets  # pragma: allowlist secret
    keys:
      - database_url
      - direct_database_url
      - redis_url

  # creator-census (2026-09-24) — the census web (cc-app.madfam.io), a Next.js
  # BFF that signs in through Janua. Its Deployment mounts Secret
  # creator-census-web (optional: true) for JANUA_CLIENT_SECRET and
  # SESSION_SECRET, and refuses sign-in ("not configured") until both exist.
  # JANUA_CLIENT_ID is PLAIN config in the Deployment, not a secret, so it is not
  # a key here: the operator copies it from the `provision oidc` output.
  #
  # TWO targets, one path, one ExternalSecret — deliberately. The CLI prompts
  # for every key of a target that is not in --generate, so a single target
  # holding both keys would make `--generate session_secret` demand the Janua
  # client secret at a masked prompt, a value no human holds (the provisioner
  # writes it straight from Janua). Splitting keeps each write route to exactly
  # one property: web-oidc is written only by `enclii secrets provision oidc
  # --platform creator-census-web`; web-session only by
  # `enclii secrets intake submit creator-census/web-session --generate session_secret`.
  # Intake writes are merges, so the two land side by side in secret/creator-census.
  #
  # LOWERCASE keys, because that is what Vault stores: the intake API lowercases
  # every key before the merge (normalizeVaultSecretKey), so JANUA_CLIENT_SECRET
  # would land as janua_client_secret anyway. Declaring the stored name makes
  # the ExternalSecret contract readable here: census maps
  # `property: janua_client_secret` -> JANUA_CLIENT_SECRET and
  # `property: session_secret` -> SESSION_SECRET. ESO is all-or-nothing per
  # ExternalSecret, so an upper-case `property:` there syncs ZERO keys.
  creator-census/web-oidc:
    label: Creator Census web Janua OAuth client secret
    description: Creator Census web (cc-app.madfam.io) Janua confidential client secret, filed by `enclii secrets provision oidc --platform creator-census-web`. The client_id is plain Deployment config, not stored here.
    vault_path: secret/creator-census
    namespace: creator-census
    external_secret: creator-census-web  # pragma: allowlist secret
    keys:
      - janua_client_secret

  creator-census/web-session:
    label: Creator Census web session signing secret
    description: Signs the census web BFF session cookie. Mint server-side with --generate session_secret (32 bytes crypto/rand, never returned); rotating it signs every user out.
    vault_path: secret/creator-census
    namespace: creator-census
    external_secret: creator-census-web  # pragma: allowlist secret
    keys:
      - session_secret

  # creator-census (2026-09-25): the house-mode YouTube Data API key. It comes from the
  # ONE Google Cloud project MADFAM audits for the census (YouTube API Services policy: one
  # project per API client, never a second project to multiply quota), restricted to the
  # YouTube Data API v3. The operator types it at the masked prompt; it is never pasted
  # anywhere else. Same Vault path as the web targets (intake writes merge). The census
  # ExternalSecret creator-census-config maps `property: youtube_api_key` (lowercase, as
  # Vault stores it) and ships only AFTER this intake is ready: an ExternalSecret mapping a
  # key that does not exist yet blocks the whole app's first sync (creator-census #23).
  creator-census/youtube-key:
    label: Creator Census YouTube Data API key
    description: The API key of MADFAM's one audited YouTube project for the census (house mode), restricted to the YouTube Data API v3. Typed at the masked prompt; never a second key from another project.
    vault_path: secret/creator-census
    namespace: creator-census
    external_secret: creator-census-config  # pragma: allowlist secret
    keys:
      - youtube_api_key

  # family-history (2026-10-01) — the public family-history product: the web
  # (fh-app.madfam.io), a Next.js BFF that signs in through Janua, and the API
  # (audience family-history-api). Everything lands in ONE Vault path,
  # secret/family-history, delivered by two ExternalSecrets in the
  # family-history namespace: family-history-api and family-history-web
  # (family-history repo, infra/k8s/production/externalsecret-{api,web}.yaml).
  # DATABASE_URL / DIRECT_DATABASE_URL are NOT here: like creator-census, they
  # come from the onboarding project Secret family-history-secrets.
  #
  # THREE targets, one path — one write route per property, the creator-census
  # split. web-oidc is written only by `enclii secrets provision oidc
  # --platform family-history-web` (both the client id and the secret: unlike
  # creator-census, the web reads AUTH_JANUA_CLIENT_ID from the Secret, so the
  # id never sits in the public repo). web-session only by
  # `enclii secrets intake submit family-history/web-session --generate fh_session_secret`,
  # which would otherwise prompt for the Janua pair at a masked prompt.
  # api-access is the only human-typed value. Intake writes are merges, so the
  # three land side by side in secret/family-history.
  #
  # LOWERCASE keys, because that is what Vault stores (normalizeVaultSecretKey)
  # and what the ExternalSecrets map: `property: fh_early_access_allowlist`,
  # `auth_janua_client_id`, `auth_janua_client_secret`, `fh_session_secret`.
  # ESO is all-or-nothing per ExternalSecret: family-history-web stays
  # NotReady until web-oidc AND web-session have both been written.
  family-history/api-access:
    label: Family History API early-access allowlist
    description: Comma-separated Janua subjects or emails let into the early-access app (FH_EARLY_ACCESS_ALLOWLIST). Personal data, so it lives only in Vault. Must not be empty; an empty value fails closed and nobody gets in. Typed at the masked prompt; never generated.
    vault_path: secret/family-history
    namespace: family-history
    external_secret: family-history-api  # pragma: allowlist secret
    keys:
      - fh_early_access_allowlist

  family-history/web-oidc:
    label: Family History web Janua OAuth client
    description: Family History web (fh-app.madfam.io) Janua confidential client id + secret, filed by `enclii secrets provision oidc --platform family-history-web`. No human types either value.
    vault_path: secret/family-history
    namespace: family-history
    external_secret: family-history-web  # pragma: allowlist secret
    keys:
      - auth_janua_client_id
      - auth_janua_client_secret

  family-history/web-session:
    label: Family History web session signing secret
    description: Signs and encrypts the family-history web session cookie (FH_SESSION_SECRET); never the Janua client secret. Mint server-side with --generate fh_session_secret (32 bytes crypto/rand, never returned); rotating it signs every user out.
    vault_path: secret/family-history
    namespace: family-history
    external_secret: family-history-web  # pragma: allowlist secret
    keys:
      - fh_session_secret

  # Digital-twins machine edges (2026-10-03). Nine client_credentials pairs,
  # each written ONLY by `enclii secrets provision oidc --platform <id>`
  # (config/ecosystem-oidc-provision.yaml); no human types either value.
  #
  # Each consumer gets a DEDICATED `<app>-service-clients` Secret, owned by its
  # own ExternalSecret. These targets never merge into, or claim ownership of, a
  # consumer's existing Secret: an Owner ExternalSecret over an existing Secret
  # deletes every key it does not produce. The named ExternalSecrets are
  # PLANNED; each consumer repo adds its own. Until it exists, intake still
  # merges the pair into Vault and reports external_secret_refreshed: false,
  # which is expected and harmless: ESO reads the pair on its first sync.
  #
  # LOWERCASE keys, as Vault stores them (normalizeVaultSecretKey); the planned
  # ExternalSecrets must map these `property:` names byte for byte.
  pravara-mes/yantra4d-step-reader:
    label: Pravara MES → Yantra4D STEP reader client
    description: Janua client_credentials pair (pravara-yantra4d-step-reader, scope yantra4d:render) Pravara uses to pull STEP exports from Yantra4D. Filed by `enclii secrets provision oidc --platform pravara-yantra4d-step-reader`.
    vault_path: secret/pravara-mes
    namespace: pravara-mes
    external_secret: pravara-service-clients  # pragma: allowlist secret
    keys:
      - yantra4d_step_reader_client_id
      - yantra4d_step_reader_client_secret

  pravara-mes/asset-shells-publisher-madfam-ecosystem:
    label: Pravara MES → asset-shells instance publisher client (madfam-ecosystem)
    description: Janua client_credentials pair (pravara-asset-shells-publisher.madfam-ecosystem, org-bound, scopes asset-shells:publish-instances + asset-shells:read). Filed by `enclii secrets provision oidc --platform pravara-asset-shells-publisher-madfam-ecosystem`.
    vault_path: secret/pravara-mes
    namespace: pravara-mes
    external_secret: pravara-service-clients  # pragma: allowlist secret
    keys:
      - asset_shells_publisher_madfam_ecosystem_client_id
      - asset_shells_publisher_madfam_ecosystem_client_secret

  # fabrication-prep (the slicing service) is not deployed yet; pravara-mes is
  # the consumer, so the pair lands at pravara's path regardless.
  pravara-mes/fabrication-prep-client:
    label: Pravara MES → fabrication-prep slicing client
    description: Janua client_credentials pair (pravara-fabrication-prep, scope fabrication-prep:slice) Pravara uses to submit slice jobs and read their results. Filed by `enclii secrets provision oidc --platform pravara-fabrication-prep`.
    vault_path: secret/pravara-mes
    namespace: pravara-mes
    external_secret: pravara-service-clients  # pragma: allowlist secret
    keys:
      - fabrication_prep_client_id
      - fabrication_prep_client_secret

  yantra4d/asset-shells-publisher:
    label: Yantra4D → asset-shells type publisher client
    description: Janua client_credentials pair (yantra4d-asset-shells-publisher, scope asset-shells:publish-types). Filed by `enclii secrets provision oidc --platform yantra4d-asset-shells-publisher`.
    vault_path: secret/yantra4d
    namespace: yantra4d
    external_secret: yantra4d-service-clients  # pragma: allowlist secret
    keys:
      - asset_shells_publisher_client_id
      - asset_shells_publisher_client_secret

  # fashion-cabinet's manifests carry no namespace; Enclii onboarding defaults
  # it to the project name (fashion-cabinet, Argo app fashion-cabinet-services).
  fashion-cabinet/asset-shells-publisher:
    label: Fashion Cabinet → asset-shells type publisher client
    description: Janua client_credentials pair (fashion-cabinet-asset-shells-publisher, scope asset-shells:publish-types). Filed by `enclii secrets provision oidc --platform fashion-cabinet-asset-shells-publisher`.
    vault_path: secret/fashion-cabinet
    namespace: fashion-cabinet
    external_secret: fashion-cabinet-service-clients  # pragma: allowlist secret
    keys:
      - asset_shells_publisher_client_id
      - asset_shells_publisher_client_secret

  forj/pravara-intake:
    label: Forj → Pravara MES order intake client (madfam-ecosystem)
    description: Janua client_credentials pair (forj-pravara-intake.madfam-ecosystem, org-bound, scope pravara-mes:jobs). Filed by `enclii secrets provision oidc --platform forj-pravara-intake-madfam-ecosystem`.
    vault_path: secret/forj
    namespace: forj
    external_secret: forj-service-clients  # pragma: allowlist secret
    keys:
      - pravara_intake_client_id
      - pravara_intake_client_secret

  # Cotiza's repository and namespace are both digifab-quoting.
  digifab-quoting/pravara-intake:
    label: Cotiza → Pravara MES job intake client (madfam-ecosystem)
    description: Janua client_credentials pair (cotiza-pravara-intake.madfam-ecosystem, org-bound, scope pravara-mes:jobs). Filed by `enclii secrets provision oidc --platform cotiza-pravara-intake-madfam-ecosystem`.
    vault_path: secret/digifab-quoting
    namespace: digifab-quoting
    external_secret: digifab-quoting-service-clients  # pragma: allowlist secret
    keys:
      - pravara_intake_client_id
      - pravara_intake_client_secret

  # zavlo has no cluster deployment yet (no k8s manifests in its repo), so the
  # namespace is the repo name, the onboarding default. The pair waits in Vault.
  # zavlo-backend reads ZAVLO_CFDI_EMITTER_CLIENT_ID / _SECRET.
  zavlo/cfdi-emitter:
    label: Zavlo → Karafiel CFDI emitter client
    description: Janua client_credentials pair (zavlo-cfdi-emitter, scope cfdi:issue) for Karafiel's CFDI billing bridge. Filed by `enclii secrets provision oidc --platform zavlo-cfdi-emitter`.
    vault_path: secret/zavlo
    namespace: zavlo
    external_secret: zavlo-service-clients  # pragma: allowlist secret
    keys:
      - zavlo_cfdi_emitter_client_id
      - zavlo_cfdi_emitter_client_secret

  routecraft/billing-relay:
    label: RouteCraft → Dhanam billing relay client
    description: Janua client_credentials pair (routecraft-billing-relay, scope billing:events) for Dhanam's billing APIs. Filed by `enclii secrets provision oidc --platform routecraft-billing-relay`.
    vault_path: secret/routecraft
    namespace: routecraft
    external_secret: routecraft-service-clients  # pragma: allowlist secret
    keys:
      - billing_relay_client_id
      - billing_relay_client_secret

  # voxa (2026-10-04) — Voxa's API → Selva inference gateway machine edge
  # (ecosystem-oidc platform voxa-selva, scope selva:infer). Written only by
  # `enclii secrets provision oidc --platform voxa-selva`; no human types either
  # value. Delivered by a DEDICATED, planned `voxa-service-clients`
  # ExternalSecret in the voxa namespace that maps these LOWERCASE properties
  # to SELVA_CLIENT_ID / SELVA_CLIENT_SECRET, never by the hand-made
  # voxa-secrets Secret. Voxa ignores the pair until SELVA_ENABLED=true.
  voxa/selva-client:
    label: Voxa → Selva inference client
    description: Janua client_credentials pair (voxa-selva, scope selva:infer) for Selva's inference gateway, used for word suggestions sent as X-Sensitivity restricted. Filed by `enclii secrets provision oidc --platform voxa-selva`.
    vault_path: secret/voxa
    namespace: voxa
    external_secret: voxa-service-clients  # pragma: allowlist secret
    keys:
      - selva_client_id
      - selva_client_secret

  # voxa web session + API runtime (2026-10-04). voxa-secrets is the onboarding
  # Secret (written by `enclii onboard`, not by ESO), so intake cannot reach it:
  # these two values get DEDICATED, planned ExternalSecrets of their own, one
  # write route per property — the family-history split. Planned ExternalSecrets
  # are harmless until they exist: intake merges into Vault and reports
  # external_secret_refreshed: false; ESO reads the value on its first sync.
  #
  # web-session is written only by
  # `enclii secrets intake submit voxa/web-session --generate auth_secret`
  # (32 bytes crypto/rand, never returned). It is Auth.js's own AUTH_SECRET
  # (ruling R42), never the Janua client secret; the planned voxa-web-session
  # ExternalSecret maps `property: auth_secret` → AUTH_SECRET.
  #
  # api-runtime carries REDIS_URL for cross-pod co-editing: the shared platform
  # Redis with its password and Voxa's OWN DB index (the first free index ≥ 10 by
  # `redis-cli INFO keyspace` on the host, the telesia recipe). The URL is composed
  # on the host and typed at the masked prompt; never generated, never in chat.
  # The planned voxa-api-runtime ExternalSecret maps `property: redis_url` →
  # REDIS_URL. Staging takes a DIFFERENT index from production.
  #
  # LOWERCASE keys, as Vault stores them (normalizeVaultSecretKey); the planned
  # ExternalSecrets must map these `property:` names byte for byte.
  voxa/web-session:
    label: Voxa web session signing secret
    description: Auth.js AUTH_SECRET for the Voxa web app (signs and encrypts the session cookie); never the Janua client secret. Mint server-side with --generate auth_secret (32 bytes crypto/rand, never returned); rotating it signs every user out.
    vault_path: secret/voxa
    namespace: voxa
    external_secret: voxa-web-session  # pragma: allowlist secret
    keys:
      - auth_secret

  voxa-staging/web-session:
    label: Voxa staging web session signing secret
    description: Auth.js AUTH_SECRET for Voxa staging; never the Janua client secret and never the production value. Mint server-side with --generate auth_secret (32 bytes crypto/rand, never returned); rotating it signs every staging user out.
    vault_path: secret/voxa-staging
    namespace: voxa-staging
    external_secret: voxa-web-session  # pragma: allowlist secret
    keys:
      - auth_secret

  voxa/api-runtime:
    label: Voxa API runtime Redis URL
    description: REDIS_URL for Voxa's cross-pod co-editing sync hub — the shared platform Redis with its password and Voxa's own DB index (first free index ≥ 10 by `redis-cli INFO keyspace`). Composed on the host and typed at the masked prompt; never generated.
    vault_path: secret/voxa
    namespace: voxa
    external_secret: voxa-api-runtime  # pragma: allowlist secret
    keys:
      - redis_url

  voxa-staging/api-runtime:
    label: Voxa staging API runtime Redis URL
    description: REDIS_URL for Voxa staging's co-editing sync hub — the shared platform Redis with a DB index DIFFERENT from production's (first free index ≥ 10 by `redis-cli INFO keyspace`). Composed on the host and typed at the masked prompt; never generated.
    vault_path: secret/voxa-staging
    namespace: voxa-staging
    external_secret: voxa-api-runtime  # pragma: allowlist secret
    keys:
      - redis_url

  # yantra4d backend Secret, adopted from a hand-written object. The live
  # Secret's values are copied into Vault server-side by
  # `enclii secrets vault-backfill yantra4d-secrets --namespace yantra4d --vault-path secret/yantra4d`
  # (never printed); the yantra4d repo's ExternalSecret `yantra4d-secrets`
  # (creationPolicy Merge, deletionPolicy Retain) then keeps it in step. Later
  # value changes go through this target.
  yantra4d/backend-secrets:
    label: Yantra4D backend secrets
    description: Values the yantra4d backend and render-worker read from yantra4d-secrets (Janua issuer/audience, Selva gateway, webhook secrets, tier overrides, access grants, render-artifact object store).
    vault_path: secret/yantra4d
    namespace: yantra4d
    external_secret: yantra4d-secrets  # pragma: allowlist secret
    keys:
      - JANUA_ISSUER
      - JANUA_AUDIENCE
      - AI_BASE_URL
      - AI_API_KEY
      - COTIZA_WEBHOOK_SECRET
      - FORGESIGHT_WEBHOOK_SECRET
      - TIER_OVERRIDES
      - PROJECT_ACCESS_GRANTS
      - RENDER_ARTIFACT_S3_ENDPOINT
      - RENDER_ARTIFACT_S3_ACCESS_KEY_ID
      - RENDER_ARTIFACT_S3_SECRET_ACCESS_KEY

  # Generated server-side only:
  # `enclii secrets intake submit yantra4d/redis --generate redis_password`.
  # 32 bytes of crypto/rand, base64url, so it is safe inside a redis:// URL.
  yantra4d/redis:
    label: Yantra4D Redis password
    description: requirepass for yantra4d-redis; consumed through the yantra4d repo's ExternalSecret yantra4d-redis-auth.
    vault_path: secret/yantra4d
    namespace: yantra4d
    external_secret: yantra4d-redis-auth  # pragma: allowlist secret
    keys:
      - redis_password
