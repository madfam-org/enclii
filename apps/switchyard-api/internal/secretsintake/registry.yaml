# Secret intake routing registry — friendly target id → Vault + ESO.
# Values are NEVER stored here. Add entries via PR review.
targets:
  ceq/vast-api-key:
    label: CEQ VAST API Key
    description: Orchestrator worker VAST provider key
    vault_path: secret/ceq
    namespace: ceq
    external_secret: ceq-orchestrator-secrets
    keys:
      - VAST_API_KEY

  ceq/janua-client-secret:
    label: CEQ Janua OAuth client secret
    description: CEQ studio/API Janua confidential client
    vault_path: secret/ceq
    namespace: ceq
    external_secret: ceq-janua-client-secret
    keys:
      - JANUA_CLIENT_SECRET

  lexidrop/oidc-janua:
    label: LexiDrop Janua OAuth client
    description: LexiDrop dashboard (ld-app.madfam.io) OIDC confidential client — id + secret for the api-side callback
    vault_path: secret/lexidrop
    namespace: lexidrop
    external_secret: lexidrop-secrets
    keys:
      - janua_client_id
      - janua_client_secret

  lexidrop/selva-inference:
    label: LexiDrop Selva inference token
    description: LexiDrop's worker token for Selva's OpenAI-compatible inference gateway (inference.selva.town) — powers the /find AI naming assistant. Same per-platform pattern as fortuna's openai_api_key at secret/fortuna.
    vault_path: secret/lexidrop
    namespace: lexidrop
    external_secret: lexidrop-selva
    keys:
      - selva_api_token

  dhanam/stripe-mx-live:
    label: Dhanam Stripe MX live keys
    description: Production MX Stripe secret + webhook signing secret
    vault_path: secret/dhanam
    namespace: dhanam
    external_secret: dhanam-secrets
    keys:
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET

  dhanam/oidc-janua:
    label: Dhanam Janua OAuth client
    description: Dhanam app OIDC client registered in Janua (not comms/financial)
    vault_path: secret/dhanam
    namespace: dhanam
    external_secret: dhanam-secrets
    keys:
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_ISSUER

  dhanam/session-auth:
    label: Dhanam session / NextAuth secrets
    description: App session signing — not platform comms
    vault_path: secret/dhanam
    namespace: dhanam
    external_secret: dhanam-secrets
    keys:
      - SESSION_SECRET
      - NEXTAUTH_SECRET

  karafiel/web-oidc-janua:
    label: Karafiel tenant app Janua OAuth client
    description: Tenant SSO for app.karafiel.mx (separate from Karafiel Admin operator client)
    vault_path: secret/karafiel
    namespace: karafiel
    external_secret: karafiel-web-oidc
    keys:
      - web_oidc_client_id
      - web_janua_secret_key
      - web_oidc_issuer

  phynd-crm/oidc-janua:
    label: Phynd CRM Janua OAuth client
    description: Staff SSO for crm.madfam.io
    vault_path: secret/phynd-crm
    namespace: phynd-crm
    external_secret: phynd-crm-secrets
    keys:
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_ISSUER

  dhanam/app-infra:
    label: Dhanam app infra (R2, CF, observability)
    description: Dhanam-owned storage and telemetry — not Resend/SendGrid
    vault_path: secret/dhanam
    namespace: dhanam
    external_secret: dhanam-secrets
    keys:
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_ENDPOINT
      - CLOUDFLARE_API_TOKEN
      - NEXT_PUBLIC_POSTHOG_KEY
      - SENTRY_DSN

  platform/comms-resend-api-key:
    label: MADFAM shared Resend API key
    description: Single org Resend account — canonical in secret/comms; fan-out via ESO to janua, phynd-crm, madfam-site
    vault_path: secret/comms
    namespace: enclii
    external_secret: enclii-secrets
    keys:
      - resend-api-key

  enclii/internal-api-key:
    label: Enclii internal API key
    description: Switchyard ↔ Roundhouse internal auth
    vault_path: secret/enclii
    namespace: enclii
    external_secret: enclii-internal-api-key
    keys:
      - INTERNAL_API_KEY

  coupler/janua-service-token:
    label: Coupler Janua service token
    description: Shared machine token for Coupler gateway delegation to Janua (must match JANUA_SERVICE_TOKEN on janua-api)
    vault_path: secret/coupler
    namespace: coupler
    external_secret: coupler-gateway-secrets
    keys:
      - JANUA_SERVICE_TOKEN

  # Nauta writes LOWERCASE Vault properties, unlike dhanam/ceq/coupler above.
  # That is not a style choice to normalise away: nauta's ExternalSecrets
  # reference `property: janua_client_id`, and ESO is all-or-nothing per
  # ExternalSecret — a case mismatch here syncs ZERO keys and the pods start
  # with no environment at all.
  nauta/oidc-janua:
    label: Nauta Janua OAuth client (cockpit)
    description: Nauta fractional-CTO cockpit OIDC client (nauta.madfam.io / cto.madfam.io)
    vault_path: secret/nauta
    namespace: nauta
    external_secret: nauta-web-secrets
    keys:
      - janua_client_id
      - janua_client_secret

  # PARKED, deliberately. The nauta-portal client is registered and real, but no
  # ExternalSecret projects these two properties yet, so nothing consumes them.
  # They are intaken anyway because a Janua client_secret is shown exactly once:
  # capturing it now costs nothing and avoids a rotation on the day the portal
  # surface is wired. Extra properties at a Vault path are ignored by ESO, which
  # only fails on properties it references and cannot find.
  nauta/oidc-janua-portal:
    label: Nauta Janua OAuth client (white-labeled client workspace)
    description: Nauta tier-3 client workspace OIDC client (crea.madfam.io) — parked until an ExternalSecret projects it
    vault_path: secret/nauta
    namespace: nauta
    external_secret: nauta-web-secrets
    keys:
      - janua_portal_client_id
      - janua_portal_client_secret

  # crea-map, symbiosis-hcm and the nauta feed tokens below were added after the
  # operator had to fall back to break-glass `vault kv patch` inside vault-0 on
  # 2026-09-03: the secrets these apps needed that night had no intake target,
  # so the only route into Vault was the one route intake exists to replace.
  # Like nauta above, these write LOWERCASE Vault properties to match the
  # `property:` fields their ExternalSecrets reference.
  #
  # crea-map and symbiosis-hcm are deployed through Enclii, not from this repo's
  # infra/ tree, so their ExternalSecret names are not verifiable here. The names
  # below follow the convention in docs/rfcs/2026-09-01-client-in-a-day.md
  # (`<app>-secrets`). If one is wrong the Vault merge still succeeds and
  # `external_secret_refreshed: false` comes back in the intake status — the
  # force-sync is skipped, not silently reported as done. Fix the name here, do
  # not paper over it by dropping the field.
  crea-map/internal-api-key:
    label: crea-map clave interna (compuerta de humo)
    description: Clave interna compartida que resguarda la compuerta de humo del MAP — el llamador la envía y crea-map la coteja
    vault_path: secret/crea-map
    namespace: crea-map
    external_secret: crea-map-secrets
    keys:
      - internal_api_key

  crea-map/kalya-feeds:
    label: crea-map feeds de kalya (ocupación y capacidad)
    description: URLs de los feeds de kalya que crea-map consume; el token del feed viaja dentro de la URL, por eso el valor completo es secreto
    vault_path: secret/crea-map
    namespace: crea-map
    external_secret: crea-map-secrets
    keys:
      - kalya_occupancy_feed_url
      - kalya_capacity_feed_url

  # symbiosis-hcm is the PRODUCER of the absence feed; crea-map cross-reads
  # map_absence_feed_key and consumes it as HCM_FEED_API_KEY. Intaking both keys
  # at the producer's path keeps one copy of the truth — the consumer's
  # ExternalSecret points back at secret/symbiosis-hcm rather than holding a
  # second copy that can drift on rotation.
  symbiosis-hcm/map-absence-feed:
    label: symbiosis-hcm feed de ausencias hacia el MAP
    description: URL y llave del feed de ausencias que symbiosis-hcm publica y crea-map consume como HCM_FEED_API_KEY
    vault_path: secret/symbiosis-hcm
    namespace: symbiosis-hcm
    external_secret: symbiosis-hcm-secrets
    keys:
      - map_absence_feed_url
      - map_absence_feed_key

  nauta/kalya-feed-tokens:
    label: Nauta tokens de feeds de kalya
    description: Tokens con los que nauta lee los feeds de kalya para las superficies de cliente
    vault_path: secret/nauta
    namespace: nauta
    external_secret: nauta-web-secrets
    keys:
      - kalya_feed_tokens

  nauta/symbiosis-hcm-token:
    label: Nauta token de symbiosis-hcm
    description: Token con el que nauta llama a symbiosis-hcm para las superficies de RH del portal
    vault_path: secret/nauta
    namespace: nauta
    external_secret: nauta-web-secrets
    keys:
      - symbiosis_hcm_token

  janua/internal-api-key:
    label: Janua internal API key
    description: Shared internal key for service-to-service calls into janua-api (peer of enclii/internal-api-key)
    vault_path: secret/janua
    namespace: janua
    external_secret: janua-secrets
    keys:
      - internal_api_key

  # Angelia Courier — third-party messaging goes through one door
  # (internal-devops decisions/2026-09-05-third-party-messaging-via-angelia-courier.md,
  # angelia docs/adr/0010-courier-outbound-comms-substrate.md).
  #
  # ANGELIA OWNS ALL THREE. The "verifier-owns, cross-path read" pattern the
  # estate already uses for phynd ↔ selva: the platform that VERIFIES a
  # credential owns its canonical property, and every consumer reads that one
  # copy cross-path through its own ExternalSecret rather than holding a second
  # copy that drifts on rotation. Angelia verifies every one of these — the
  # producer keys against COURIER_PRODUCER_KEYS, the bot tokens against the
  # channel adapters, the receiver secret against the Alertmanager route — so
  # secret/angelia is the single writable home for all of them.
  #
  # These are LOWERCASE Vault properties, matching angelia's ExternalSecret
  # `property:` fields. ESO is all-or-nothing per ExternalSecret: a case
  # mismatch here syncs ZERO keys and angelia-api starts with courier
  # armed=false, which looks exactly like "not provisioned yet".
  #
  # Everything Courier ships with is INERT until these are populated: with no
  # key the routes answer 503 not_provisioned. Intaking a target does not arm
  # anything by itself — the operator still runs the target with a real value.
  angelia/courier-producer-keys:
    label: Angelia Courier producer keys
    description: Per-producer keys for POST /v1/courier/send. One property per calling system so a single producer can be revoked without touching the others; angelia's ExternalSecret template assembles them into COURIER_PRODUCER_KEYS. Producers read only their OWN key cross-path.
    vault_path: secret/angelia
    namespace: angelia
    external_secret: angelia-courier-secrets
    keys:
      - courier_producer_key_alarms
      - courier_producer_key_enclii_ops
      - courier_producer_key_tulana
      - courier_producer_key_madfam_site

  angelia/courier-channel-tokens:
    label: Angelia Courier channel bot tokens
    description: Bot tokens for Courier's direct channel adapters. Bot tokens only — never an incoming webhook URL, which is bound to one channel at creation and cannot serve an envelope whose recipient varies. Read own-path by angelia-api and by nothing else.
    vault_path: secret/angelia
    namespace: angelia
    external_secret: angelia-courier-secrets
    keys:
      - courier_telegram_bot_token
      - courier_slack_bot_token

  angelia/courier-alertmanager:
    label: Angelia Courier Alertmanager receiver secret
    description: Shared secret for POST /v1/courier/alertmanager. Deliberately NOT a producer key — a producer key authorises arbitrary envelopes to arbitrary recipients, this one authorises exactly one thing. Read own-path by angelia-api, cross-path by enclii's Alertmanager in the monitoring namespace.
    vault_path: secret/angelia
    namespace: angelia
    external_secret: angelia-courier-secrets
    keys:
      - courier_alertmanager_secret

  # R23 (internal-devops docket, ruled 2026-09-05, sequenced AFTER O21):
  # customer-facing notification webhooks go through Courier's `webhook`
  # channel (angelia #23). Each producer that sends to customer-supplied HTTPS
  # targets signs its payloads with ITS OWN key, so a customer's receiver can
  # tell which MADFAM service the delivery came from and one producer's key can
  # be revoked without silencing the others. The property SUFFIX is the pairing
  # mechanism: `courier_webhook_signing_key_<suffix>` pairs with that producer's
  # `courier_producer_key_<suffix>` on the same path; angelia's ExternalSecret
  # assembles them by prefix into COURIER_WEBHOOK_SIGNING_KEYS. A suffix that
  # matches no producer key is a signing key nobody can use; a producer with no
  # signing key authenticates normally and is refused 503 not_provisioned on the
  # webhook channel alone. Running this target is the arming step for the
  # channel — do not run it before O21 (one real page delivered) is accepted.
  angelia/courier-webhook-signing-keys:
    label: Angelia Courier webhook signing keys
    description: Per-producer HMAC-SHA256 signing keys for Courier's `webhook` channel (customer-supplied HTTPS targets, R23). One property per producer, suffix-paired with that producer's courier_producer_key_<suffix>; angelia's ExternalSecret template assembles them by prefix into COURIER_WEBHOOK_SIGNING_KEYS. Read own-path by angelia-api only — a producer never holds its own signing key. Inert until run; run only after O21.
    vault_path: secret/angelia
    namespace: angelia
    external_secret: angelia-courier-secrets
    keys:
      - courier_webhook_signing_key_alarms
      - courier_webhook_signing_key_enclii_ops
      - courier_webhook_signing_key_tulana
      - courier_webhook_signing_key_madfam_site
