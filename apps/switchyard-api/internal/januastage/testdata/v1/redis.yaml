apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: janua-staging-redis
  namespace: janua-staging
  labels:
    app.kubernetes.io/name: janua-staging-redis
    app.kubernetes.io/part-of: janua-staging
    enclii.dev/service: janua-staging-redis
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: janua-staging-redis
  namespace: janua-staging
  labels: &id001
    app.kubernetes.io/name: janua-staging-redis
    app.kubernetes.io/part-of: janua-staging
    enclii.dev/service: janua-staging-redis
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: janua-staging-redis
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: docker.io/library/redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        command:
        - /bin/sh
        - -ec
        - exec redis-server --appendonly yes --save 60 1 --maxmemory 128mb --maxmemory-policy
          noeviction --requirepass "$REDIS_PASSWORD"
        env:
        - name: REDIS_PASSWORD
          valueFrom: &id002
            secretKeyRef:
              name: janua-staging-redis
              key: password
        - name: REDISCLI_AUTH
          valueFrom: *id002
        ports:
        - name: redis
          containerPort: 6379
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        startupProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - ping
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - ping
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - ping
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: janua-staging-redis
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: janua-staging-redis
  namespace: janua-staging
  labels:
    app.kubernetes.io/name: janua-staging-redis
    app.kubernetes.io/part-of: janua-staging
    enclii.dev/service: janua-staging-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: janua-staging-redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
