apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: janua-staging-secrets
  namespace: janua-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: janua-staging-secrets
    creationPolicy: Owner
  data:
  - secretKey: database-url
    remoteRef:
      key: secret/janua-staging
      property: database_url
  - secretKey: redis-url
    remoteRef:
      key: secret/janua-staging
      property: redis_url
  - secretKey: jwt-secret-key
    remoteRef:
      key: secret/janua-staging
      property: jwt_secret_key
  - secretKey: jwt-private-key
    remoteRef:
      key: secret/janua-staging
      property: jwt_private_key
  - secretKey: jwt-public-key
    remoteRef:
      key: secret/janua-staging
      property: jwt_public_key
  - secretKey: secret-key
    remoteRef:
      key: secret/janua-staging
      property: secret_key
  - secretKey: field-encryption-key
    remoteRef:
      key: secret/janua-staging
      property: field_encryption_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: janua-staging-ca
  namespace: janua-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: janua-staging-ca
    creationPolicy: Owner
  data:
  - secretKey: ca.crt
    remoteRef:
      key: secret/janua-staging
      property: database_ca
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: janua-staging-redis
  namespace: janua-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: janua-staging-redis
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      key: secret/janua-staging
      property: redis_password
