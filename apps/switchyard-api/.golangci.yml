version: "2"

run:
  timeout: 5m
  go: "1.26"
  # tests MUST stay true. With tests:false the linter cannot see test files, so
  # `unused` reported 8 production symbols as dead that tests actually call --
  # generateStatusConfigmap alone has 16 test references, and one is literally
  # named clearSentryCacheForTest. Deleting on that report would have broken the
  # suite. The "false positives" that motivated tests:false were errcheck and
  # unused-mock complaints inside test files; both are excluded by path below,
  # which silences the noise without blinding every linter to test code.
  tests: true

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - unused
    - errcheck
    - staticcheck
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test files: mocks and fakes are routinely declared ahead of the test that
      # will use them, and helpers ignore errors on fixtures that cannot fail.
      # Scoped to _test.go so both linters still apply in full to production code
      # -- the point of tests:true is that `unused` can SEE these files, not that
      # it must report on them.
      - path: '_test\.go'
        linters:
          - errcheck
          - unused
          - staticcheck
      # staticcheck style suggestions
      - linters:
          - staticcheck
        text: "QF"
      - linters:
          - staticcheck
        text: "ST1005"
      - linters:
          - staticcheck
        text: "SA6005"
      # errcheck: best-effort operations where error is non-blocking
      - linters:
          - errcheck
        text: "RegisterValidation"
      - linters:
          - errcheck
        text: "AuditLogs\\.Log"
      - linters:
          - errcheck
        text: "LogAudit"
      - linters:
          - errcheck
        text: "UpdateStatus"
      - linters:
          - errcheck
        text: "UpdateDeliveryStatus"
      - linters:
          - errcheck
        text: "WriteJSON"
      - linters:
          - errcheck
        text: "\\.Del\\b"
      - linters:
          - errcheck
        text: "json\\.Unmarshal"
      - linters:
          - errcheck
        text: "\\.Close"
      - linters:
          - errcheck
        text: "\\.Write"
      - linters:
          - errcheck
        text: "Sscanf"
      - linters:
          - errcheck
        text: "Decode"

      # ---------------------------------------------------------------------
      # TODO(platform): pre-existing findings, owned by branch
      # `fix/lint-gate-honesty`. Remove these entries as that branch fixes them.
      #
      # CI never actually linted this module: the discovery guard in ci.yml
      # skipped any module with no *.go file at its ROOT, and switchyard-api
      # keeps none, so `golangci-lint` had never run here in a green build. Only
      # packages/otel-go was ever linted. Fixing that guard surfaced these 14
      # findings all at once.
      #
      # They are listed individually, by symbol, rather than by disabling the
      # linters. That is deliberate: a blanket `unused: off` would make the gate
      # vacuous again the moment it started running, which is the exact failure
      # being repaired. Every NEW finding — including a new unused symbol —
      # still fails the job.
      #
      # Most of them exist because `run.tests: false` hides the test files that
      # are the only users of these symbols, so "unused" here often means "used
      # only by tests". That diagnosis belongs to the lint-honesty branch, not
      # to this one.
      - linters:
          - staticcheck
        path: "cmd/api/main.go"
        text: "ST1019"
      - linters:
          - unused
        text: "applyDefaultConfig"
      - linters:
          - unused
        text: "buildProjectCardAggregate"
      - linters:
          - unused
        text: "compactProjectProcessesForActiveSummary"
      - linters:
          - unused
        text: "clearSentryCacheForTest"
      - linters:
          - unused
        text: "generateStatusConfigmap"
      - linters:
          - unused
        text: "fixedTeamResolver"
      - linters:
          - unused
        text: "sqlErrNoRows"
      - linters:
          - unused
        text: "marshalTLS"
      - linters:
          - unused
        text: "presignKeyRegex"
      - linters:
          - unused
        text: "redactQuerySignatures"
      - linters:
          - unused
        text: "resendEmail"

formatters:
  enable:
    - gofmt

issues:
  # Uncapped on purpose. At 20/5 the report was TRUNCATED: switchyard-api showed
  # exactly 20 issues while 90 existed, so "the list" was never the list. A gate
  # that silently drops findings reads as cleaner than it is.
  max-issues-per-linter: 0
  max-same-issues: 0

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
