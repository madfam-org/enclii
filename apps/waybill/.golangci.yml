version: "2"

run:
  timeout: 5m
  go: "1.26"
  tests: false  # Skip linting test files (many false positives)

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - unused
    - errcheck
    - staticcheck
  exclusions:
    presets:
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: "^QF"
      - linters:
          - errcheck
        text: "\\.Close"

      # TODO(platform): pre-existing finding, owned by branch
      # `fix/lint-gate-honesty`. CI's module discovery skipped this module
      # entirely (no *.go at the module root), so lint had never run on it.
      # Listed by symbol so every NEW finding still fails the job.
      #
      # Both linters see the same dead store — ineffassign as "ineffectual
      # assignment", staticcheck as SA4006 — so silencing only one just hands
      # the report to the other.
      - linters:
          - ineffassign
          - staticcheck
        path: "internal/budgets/cost.go"
        text: "gbMonths"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 20
  max-same-issues: 5
