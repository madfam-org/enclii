apiVersion: batch/v1
kind: CronJob
metadata:
  name: status-recorder-enclii
  namespace: enclii
  labels:
    app: status-recorder-enclii
    app.kubernetes.io/component: status-recorder
    app.kubernetes.io/instance: status-enclii
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 55
      template:
        metadata:
          labels:
            app: status-recorder-enclii
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recorder
              image: docker.io/curlimages/curl@sha256:08e466006f0860e54fc299378de998935333e0e130a15f6f98482e9f8dab3058
              # --retry-connrefused: the first connect from a brand-new pod is
              # refused until the NetworkPolicy controller has admitted the
              # pod's IP (seconds). Without retries every run failed once
              # (curl exit 7) and restarted, which showed as CrashLoopBackOff
              # and doubled the pod churn of a once-a-minute job. -S keeps the
              # error text in the log. No --max-time: the madfam record call
              # legitimately takes ~20 s; activeDeadlineSeconds still bounds it.
              command:
                - curl
                - -sSf
                - --retry
                - "3"
                - --retry-connrefused
                - --retry-delay
                - "2"
                - -X
                - POST
                - -H
                - "Authorization: Bearer $(CRON_SECRET)"
                - "http://status-enclii.enclii.svc.cluster.local/api/status/record"
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: status-secrets
                      key: cron-secret
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 100
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
          restartPolicy: OnFailure
