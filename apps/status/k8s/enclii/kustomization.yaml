apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: status-enclii

namespace: enclii

resources:
  - ../base
  - configmap.yaml
  - cronjob.yaml

# Instance-specific labels
commonLabels:
  app.kubernetes.io/instance: status-enclii

# Patches for Enclii-specific configuration
patches:
  # Update deployment name and selectors
  - patch: |-
      - op: replace
        path: /metadata/name
        value: status-enclii
      - op: replace
        path: /spec/selector/matchLabels/app
        value: status-enclii
      - op: replace
        path: /spec/template/metadata/labels/app
        value: status-enclii
    target:
      kind: Deployment
      name: status

  # Update configMapKeyRef to use overlay-specific ConfigMap
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: status
      spec:
        template:
          spec:
            containers:
            - name: status
              env:
              - name: SITE_NAME
                valueFrom:
                  configMapKeyRef:
                    name: status-config-enclii
              - name: SITE_URL
                valueFrom:
                  configMapKeyRef:
                    name: status-config-enclii
              - name: NEXT_PUBLIC_APP_URL
                valueFrom:
                  configMapKeyRef:
                    name: status-config-enclii
              - name: SERVICES_CONFIG
                valueFrom:
                  configMapKeyRef:
                    name: status-config-enclii
              - name: PROMETHEUS_URL
                valueFrom:
                  configMapKeyRef:
                    name: status-config-enclii
    target:
      kind: Deployment
      name: status

  # Update service name and selector
  - patch: |-
      - op: replace
        path: /metadata/name
        value: status-enclii
      - op: replace
        path: /spec/selector/app
        value: status-enclii
    target:
      kind: Service
      name: status

  # Update PDB name and selector
  - patch: |-
      - op: replace
        path: /metadata/name
        value: status-pdb-enclii
      - op: replace
        path: /spec/selector/matchLabels/app
        value: status-enclii
    target:
      kind: PodDisruptionBudget
      name: status-pdb

images:
  - name: ghcr.io/madfam-org/enclii-status
    newName: ghcr.io/madfam-org/enclii/enclii-status
    digest: sha256:3102d00b5b4eda239a186a19c13fe89029a5165841518455ebf61a9c71f0c262
