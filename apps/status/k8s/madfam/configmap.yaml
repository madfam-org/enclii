apiVersion: v1
kind: ConfigMap
metadata:
  name: status-config-madfam
  namespace: enclii
data:
  site-name: "MADFAM System Status"
  site-url: "https://status.madfam.io"
  prometheus-url: "http://prometheus.monitoring.svc.cluster.local:9090"
  response-time-thresholds: '{"fast":1500,"normal":2500,"slow":4000}'
  auto-incidents-enabled: "true"
  auto-incident-threshold: "2"
  # Services to monitor for MADFAM Ecosystem (all projects)
  # NOTE: Only services with working health endpoints are monitored.
  # Services without /health endpoints (Yantra4D API, Karafiel API, MADFAM CMS)
  # and non-existent services (MES Admin) have been removed to avoid false signals.
  # Re-add them when external repos add proper health endpoints.
  services-config: |
    [
      {
        "name": "Enclii API",
        "url": "https://api.enclii.dev/health/ready",
        "href": "https://api.enclii.dev",
        "group": "Enclii",
        "description": "Control plane API"
      },
      {
        "name": "Enclii Dashboard",
        "url": "https://app.enclii.dev",
        "group": "Enclii",
        "description": "Web management console"
      },
      {
        "name": "Enclii Admin",
        "url": "https://admin.enclii.dev",
        "group": "Enclii",
        "description": "Infrastructure operations"
      },
      {
        "name": "Enclii Docs",
        "url": "https://docs.enclii.dev",
        "group": "Enclii",
        "description": "Platform documentation"
      },
      {
        "name": "Vault",
        "url": "https://vault.enclii.dev/v1/sys/health",
        "href": "https://vault.enclii.dev",
        "group": "Enclii",
        "description": "Secret management"
      },
      {
        "name": "Auth",
        "url": "https://auth.madfam.io/health",
        "href": "https://auth.madfam.io",
        "group": "Janua",
        "description": "SSO authentication service"
      },
      {
        "name": "Janua Website",
        "url": "https://janua.dev",
        "group": "Janua",
        "description": "Product landing page"
      },
      {
        "name": "Janua Docs",
        "url": "https://docs.janua.dev",
        "group": "Janua",
        "description": "Authentication documentation"
      },
      {
        "name": "Dhanam API",
        "url": "https://api.dhan.am/health",
        "href": "https://api.dhan.am",
        "group": "Dhanam",
        "description": "Financial platform API"
      },
      {
        "name": "Dhanam Admin",
        "url": "https://admin.dhan.am",
        "group": "Dhanam",
        "description": "Financial operations console"
      },
      {
        "name": "Dhanam Web",
        "url": "https://dhan.am",
        "group": "Dhanam",
        "description": "Landing page"
      },
      {
        "name": "Dhanam App",
        "url": "https://app.dhan.am",
        "group": "Dhanam",
        "description": "User application"
