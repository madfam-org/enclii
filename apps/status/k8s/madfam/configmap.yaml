apiVersion: v1
kind: ConfigMap
metadata:
  name: status-config-madfam
  namespace: enclii
data:
  site-name: "MADFAM System Status"
  site-url: "https://status.madfam.io"
  prometheus-url: "http://prometheus.monitoring.svc.cluster.local:9090"
  response-time-thresholds: '{"fast":1500,"normal":2500,"slow":4000}'
  auto-incidents-enabled: "true"
  auto-incident-threshold: "2"
  # Services monitored by status.madfam.io.
  #
  # Schema (RFC 0002 S1 — product family grouping):
  #   - name         : display name
  #   - url          : health probe URL
  #   - href         : optional user-facing URL (falls back to url)
  #   - group        : fine-grained product grouping (e.g. "Karafiel")
  #   - family       : optional product family wrapping multiple groups
  #                    (e.g. "MADFAM Platform"). Drives the two-level
  #                    collapsible UI. Services without `family` fall into
  #                    the "Other" family.
  #   - description  : short description
  #
  # Product families (RFC 0002 S1):
  #   MADFAM Platform      — avala, factlas, karafiel, dhanam, tezca, fortuna, phynecrm, enclii, janua
  #   Selva Swarm          — selva-office services
  #   Rondelio             — rondel.io family
  #   Digital Fabrication  — digifab, yantra4d, pravara-mes, primavera3d, forj, forgesight
  #   Content & Creative   — blueprint, coforma, almanac, ceq, nuit
  #   MADFAM Corporate     — madfam.io, platform-wide infra (npm, deal-sniper)
  #
  # Updated: 2026-04-20 — 57 services across 17 groups. Renamed
  # "Bloom Scroll" group to "Almanac" (product brand) and split
  # into Web + API rows after the netpol port-8080 fix brought both
  # endpoints green (tunnel was dropping 100% of traffic at the
  # NetworkPolicy layer since the web pod binds 8080 not 80).
  #
  # Updated: 2026-04-19 — 56 services across 17 groups. Added Factlas
  # group (web, atlas, api, tiles) after the Geographic Fact Graph
  # platform went live (all four endpoints verified 200 pre-add).
  #
  # Updated: 2026-04-17 (late) — 52 services across 16 groups after the
  # status.madfam.io audit. Added 3 coverage gaps verified with live
  # curl: app.karafiel.mx, enclii.dev (landing), sniper.madfam.io
  # (foundry-scout / deal-sniper).
  #
  # Earlier 2026-04-17: added 8 services that were live in prod but
  # missing from tracking (Avala, Cotiza API, Primavera3D, Nuit, Forj,
  # Almanac / Bloom Scroll, Blueprint Harvester). Six of those
  # currently return 502 because the repos exist + DNS + tunnels are
  # wired but the pods aren't healthy; the status page correctly
  # surfaces that outage rather than hiding it — remediation is on
  # the service side, not the status page.
  #
  # Previous: 2026-04-15 — 41 services across 15 groups (Karafiel
  # URLs fixed to /login, AutoSwarm → Selva Office on selva.town).
  #
  # Intentional exclusions — not a bug, do not add without thinking:
  #   - status.madfam.io + status.enclii.dev — cannot reliably monitor
  #     oneself. If the status page is down, its own up-check is
  #     meaningless. Use the external StatusCake / UptimeRobot probe
  #     (configured in Cloudflare) as the backstop.
  #   - grafana.enclii.dev + metrics.enclii.dev — the monitoring
  #     stack. Meta-monitoring your own monitoring creates blind
  #     spots; monitor via external probe.
  #   - ssh.madfam.io — Cloudflare tunnel endpoint, doesn't speak
  #     HTTP. Probe failure == tunnel outage == status page is
  #     probably broken too.
  #   - agents-api.madfam.io, agents.madfam.io, agents-admin.madfam.io,
  #     agents-ws.madfam.io — being retired by the pending Selva
  #     cutover (selva.town replaces). Adding them would add flake
  #     sources that get torn down in the same maintenance window.
  #   - Vault (deferred — not initialized/unsealed yet).
  #   - MES Admin (pravara-gateway image doesn't exist).
  #   - api.yantra4d.com + cms.madfam.io — return 404 on / with no
  #     documented /health path. Re-add once upstream exposes a probe
  #     endpoint.
