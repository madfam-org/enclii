apiVersion: v1
kind: ConfigMap
metadata:
  name: status-config-madfam
  namespace: enclii
data:
  site-name: "MADFAM System Status"
  site-url: "https://status.madfam.io"
  prometheus-url: "http://prometheus.monitoring.svc.cluster.local:9090"
  response-time-thresholds: '{"fast":1500,"normal":2500,"slow":4000}'
  auto-incidents-enabled: "true"
  auto-incident-threshold: "2"
  # Services to monitor for MADFAM Ecosystem (all projects)
  # Updated: 2026-04-10 — 42 services across 15 groups
  # NOTE: Only services with working health endpoints are monitored.
  # Excluded to avoid false-alarm auto-incidents:
  #   - Vault (not initialized/unsealed — deferred; re-add after deploy)
  #   - MES Admin (pravara-gateway not deployed; re-add when image exists)
  #   - Yantra4D API, MADFAM CMS (no /health endpoints)
  # Re-add them when external repos add proper health endpoints.
  services-config: |
