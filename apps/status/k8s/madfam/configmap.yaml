apiVersion: v1
kind: ConfigMap
metadata:
    name: status-config-madfam
    namespace: enclii
data:
    auto-incident-threshold: "2"
    auto-incidents-enabled: "true"
    prometheus-url: http://prometheus.monitoring.svc.cluster.local:9090
    response-time-thresholds: '{"fast":1500,"normal":2500,"slow":4000}'
    services-config: |
        [
              {
                "name": "Enclii API",
                "url": "https://api.enclii.dev/health/public",
                "href": "https://api.enclii.dev",
                "group": "Enclii",
                "family": "MADFAM Platform",
                "description": "Control plane API"
              },
              {
                "name": "Enclii Dashboard",
                "url": "https://app.enclii.dev",
                "group": "Enclii",
                "family": "MADFAM Platform",
                "description": "Web management console"
              },
              {
                "name": "Enclii Admin",
                "url": "https://admin.enclii.dev",
                "group": "Enclii",
                "family": "MADFAM Platform",
                "description": "Infrastructure operations"
              },
              {
                "name": "Enclii Docs",
                "url": "https://docs.enclii.dev",
                "group": "Enclii",
                "family": "MADFAM Platform",
                "description": "Platform documentation"
              },
              {
                "name": "Enclii Landing",
                "url": "https://enclii.dev",
                "href": "https://enclii.dev",
                "group": "Enclii",
                "family": "MADFAM Platform",
                "description": "Product landing page"
              },
              {
                "name": "Auth",
                "url": "https://auth.madfam.io/health",
                "href": "https://auth.madfam.io",
                "group": "Janua",
                "family": "MADFAM Platform",
                "description": "SSO authentication service"
              },
              {
                "name": "Janua Website",
                "url": "https://janua.dev",
                "group": "Janua",
                "family": "MADFAM Platform",
                "description": "Product landing page"
              },
              {
                "name": "Janua Docs",
                "url": "https://docs.janua.dev",
                "group": "Janua",
                "family": "MADFAM Platform",
                "description": "Authentication documentation"
              },
              {
                "name": "MADFAM Website",
                "url": "https://madfam.io",
                "group": "MADFAM Site",
                "family": "MADFAM Corporate",
                "description": "Corporate website"
              },
              {
                "name": "NPM Registry",
                "url": "https://npm.madfam.io",
                "group": "Platform",
                "family": "MADFAM Corporate",
                "description": "Private Verdaccio registry"
              },
              {
                "name": "Deal Sniper",
                "url": "https://sniper.madfam.io",
                "href": "https://sniper.madfam.io",
                "group": "Platform",
                "family": "MADFAM Corporate",
                "description": "Hetzner auction intelligence (foundry-scout)"
              }
            ]
    site-name: MADFAM System Status
    site-url: https://status.madfam.io
