  # from tracking (Avala, Cotiza API, Primavera3D, Nuit, Forj, Bloom Scroll/
  # Almanac, Blueprint Harvester). See GAP_REMEDIATION_PLAN.md.
  # Previous update: 2026-04-15 — 41 services across 15 groups (Karafiel URLs
  # fixed to /login, AutoSwarm → Selva Office with selva.town domains)
  # NOTE: Only services with working health endpoints are monitored.
  # Excluded to avoid false-alarm auto-incidents:
  #   - Vault (not initialized/unsealed — deferred; re-add after deploy)
  #   - MES Admin (pravara-gateway not deployed; re-add when image exists)
  #   - Yantra4D API, MADFAM CMS (no /health endpoints)
  # Re-add them when external repos add proper health endpoints.
