apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: status-madfam

namespace: enclii

resources:
  - ../base
  - configmap.yaml
  - cronjob.yaml

# Instance-specific labels
commonLabels:
  app.kubernetes.io/instance: status-madfam

# Patches for MADFAM-specific configuration
patches:
  # Update deployment name and selectors
  - patch: |-
      - op: replace
        path: /metadata/name
        value: status-madfam
      - op: replace
        path: /spec/selector/matchLabels/app
        value: status-madfam
      - op: replace
        path: /spec/template/metadata/labels/app
        value: status-madfam
    target:
      kind: Deployment
      name: status

  # Update configMapKeyRef to use overlay-specific ConfigMap
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: status
      spec:
        template:
          spec:
            containers:
            - name: status
              env:
              - name: SITE_NAME
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: SITE_URL
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: NEXT_PUBLIC_APP_URL
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: SERVICES_CONFIG
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: PROMETHEUS_URL
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
    target:
      kind: Deployment
      name: status

  # Update service name and selector
  - patch: |-
      - op: replace
        path: /metadata/name
        value: status-madfam
      - op: replace
        path: /spec/selector/app
        value: status-madfam
    target:
      kind: Service
      name: status

  # Update PDB name and selector
  - patch: |-
      - op: replace
        path: /metadata/name
        value: status-pdb-madfam
      - op: replace
        path: /spec/selector/matchLabels/app
        value: status-madfam
    target:
      kind: PodDisruptionBudget
      name: status-pdb

images:
  - name: ghcr.io/madfam-org/enclii-status
    newName: ghcr.io/madfam-org/enclii/enclii-status
    digest: sha256:f563a8a1121db96dd8e2c0f48e013c30fbfd48ba154474c4981fbc2a69479ed6
