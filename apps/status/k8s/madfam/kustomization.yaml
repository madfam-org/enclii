apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: status-madfam

namespace: enclii

resources:
  - ../base
  - configmap.yaml
  - cronjob.yaml
  - stale-outage-digest.yaml

# Instance-specific labels
commonLabels:
  app.kubernetes.io/instance: status-madfam

# Patches for MADFAM-specific configuration
patches:
  # Update deployment name and selectors
  - patch: |-
      - op: replace
        path: /metadata/name
        value: status-madfam
      - op: replace
        path: /spec/selector/matchLabels/app
        value: status-madfam
      - op: replace
        path: /spec/template/metadata/labels/app
        value: status-madfam
    target:
      kind: Deployment
      name: status

  # Add configmap version annotation to trigger pod restart on config changes
  - patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          enclii.dev/configmap-version: "2026-04-15-v1"
    target:
      kind: Deployment
      name: status

  # Opt this Deployment in to Stakater Reloader (Tier 1).
  # Reloader watches deployments carrying this annotation and restarts them
  # when their referenced ConfigMaps/Secrets change. This complements the
  # `enclii.dev/configmap-version` patch above (manual bump) by automating
  # rollouts when the ConfigMap content changes without a version bump.
  # Runbook: docs/runbooks/CONFIG_RELOAD_RUNBOOK.md
  - patch: |-
      - op: add
        path: /spec/template/metadata/annotations/reloader.stakater.com~1match
        value: "true"
    target:
      kind: Deployment
      name: status

  # Update configMapKeyRef to use overlay-specific ConfigMap
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: status
      spec:
        template:
          spec:
            containers:
            - name: status
              env:
              - name: SITE_NAME
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: SITE_URL
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: NEXT_PUBLIC_APP_URL
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: SERVICES_CONFIG
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: PROMETHEUS_URL
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: RESPONSE_TIME_THRESHOLDS
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: AUTO_INCIDENTS_ENABLED
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
              - name: AUTO_INCIDENT_THRESHOLD
                valueFrom:
                  configMapKeyRef:
                    name: status-config-madfam
    target:
      kind: Deployment
      name: status

  # Update service name and selector
  - patch: |-
      - op: replace
        path: /metadata/name
        value: status-madfam
      - op: replace
        path: /spec/selector/app
        value: status-madfam
    target:
      kind: Service
      name: status

  # Update PDB name and selector
  - patch: |-
      - op: replace
        path: /metadata/name
        value: status-pdb-madfam
      - op: replace
        path: /spec/selector/matchLabels/app
        value: status-madfam
    target:
      kind: PodDisruptionBudget
      name: status-pdb

images:
  - name: ghcr.io/madfam-org/enclii-status
    newName: ghcr.io/madfam-org/enclii/enclii-status
    digest: sha256:756bf057601b4616d959da4de220242c10802b72f0f90bf7b383a55c857f6843
