# Dispatch ServiceAccount + ClusterRole + ClusterRoleBinding
#
# These permissions back the live-cluster reads the Dispatch UI now performs:
# - /api/topology              -> nodes, namespaces, pods, services, deployments
# - /api/argocd/applications   -> applications.argoproj.io (read + patch on
#                                 [name]/sync; superadmin only at the route layer)
# - /api/storage/volumes       -> volumes.longhorn.io, replicas.longhorn.io
# - /api/network-policies      -> networkpolicies.networking.k8s.io
#
# Operator runbook (post-merge):
#   kubectl apply -f apps/admin-console/k8s/rbac.yaml
#   kubectl rollout restart deploy/dispatch -n enclii   # pick up the SA token
#
# These permissions are READ-ONLY except for the targeted patch on
# applications.argoproj.io (required to trigger ArgoCD syncs from the UI).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch
  namespace: enclii
  labels:
    app: dispatch
    enclii.dev/managed-by: manual
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dispatch-cluster-reader
  labels:
    app: dispatch
    enclii.dev/managed-by: manual
rules:
  # Core read access for topology/inventory views
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - services
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps  # metadata-only reads for displaying names; no Secret access
    verbs: ["get", "list", "watch"]

  # Workload listing for deployment counts per namespace
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]

  # NetworkPolicy view (read-only — managed by switchyard-api)
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "watch"]

  # ArgoCD: read all Applications, plus targeted patch for sync triggers
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applicationsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
    verbs: ["patch"]   # required for Sync Now (operation.sync merge-patch)

  # Longhorn storage health
  - apiGroups: ["longhorn.io"]
    resources:
      - volumes
      - replicas
      - engines
      - nodes
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-cluster-reader
  labels:
    app: dispatch
    enclii.dev/managed-by: manual
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dispatch-cluster-reader
subjects:
  - kind: ServiceAccount
    name: dispatch
    namespace: enclii
