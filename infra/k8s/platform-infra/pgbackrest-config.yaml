---
# pgBackRest configuration for continuous WAL archiving to Cloudflare R2.
#
# P1.1 of the Enclii remediation plan — moves Postgres RPO from 24h (daily
# pg_dump) down to ~1 min (continuous WAL shipping with archive_timeout=60s).
#
# Design notes:
#   - Stanza `main` is the logical name for the cluster's archive repository.
#     Pick a stable name; renaming the stanza invalidates all existing backups.
#   - `repo1-path=/pgbackrest/enclii-main` scopes this cluster's archives
#     under the shared `enclii-backups` R2 bucket. If another cluster ever
#     shares the bucket (preview DBs, secondary clusters), use a different
#     path prefix.
#   - `repo1-retention-full=7` + `repo1-retention-diff=3` keeps a week of
#     full backups and the last 3 differentials. WAL segments tied to any
#     surviving backup are retained automatically — do not set
#     repo1-retention-archive unless you understand PITR retention implications.
#   - `compress-type=zstd` + `compress-level=6` → roughly 3-5x compression
#     for typical OLTP workloads, lower CPU than gzip-9.
#   - `repo1-cipher-type=aes-256-cbc` enables client-side encryption of
#     archives in R2. Passphrase lives in the `pgbackrest-r2-credentials`
#     secret. **Operator decision**: set cipher-type to `none` and omit the
#     passphrase if you want to trade CPU cost for simpler key management
#     (R2 is encrypted at rest by Cloudflare regardless — this is defense
#     in depth).
#   - `archive-async=y` + `archive-push-queue-max=2GiB` → WAL pushes happen
#     off the critical path. If R2 is unreachable, WAL accumulates on the
#     shared volume up to 2GiB before Postgres itself starts blocking
#     (caught earlier by PostgresWALDiskUsageHigh alert at 80%).
#   - `log-level-console=info` keeps sidecar logs actionable; bump to
#     `detail` only for debugging.
#
# See: https://pgbackrest.org/configuration.html
# See: docs/runbooks/POSTGRES_WAL_ARCHIVING.md for operator procedures.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbackrest-config
  namespace: data
  labels:
    app.kubernetes.io/name: pgbackrest
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
data:
  pgbackrest.conf: |
    [global]
    # ----- repository: Cloudflare R2 (S3-compatible) -----
    repo1-type=s3
    repo1-path=/pgbackrest/enclii-main
    repo1-s3-bucket=enclii-backups
    # R2 endpoint template. Concrete host is resolved from env var
    # R2_ACCOUNT_ID in the sidecar (see postgres.yaml).
    repo1-s3-endpoint=${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
    repo1-s3-region=auto
    repo1-s3-uri-style=path
    repo1-storage-verify-tls=y
    # CA bundle resolution differs by container:
    #   - Postgres container: minimal Debian image with no /etc/ssl/certs;
    #     the wrapper script at /opt/pgbackrest/bin/pgbackrest sets
    #     SSL_CERT_FILE=/opt/pgbackrest/ca-certificates.crt (bundled by
    #     the init container).
    #   - pgbackrest sidecar: alpine-based image with its own
    #     /etc/ssl/certs/ca-certificates.crt — OpenSSL finds it by default.
    # Don't set repo1-storage-ca-file here because that path only exists
    # in the postgres container (the volume isn't mounted in the sidecar).

    # ----- retention -----
    repo1-retention-full=7
    repo1-retention-full-type=count
    repo1-retention-diff=3

    # ----- compression + encryption -----
    # Use 'zst' (3-letter form) not 'zstd'. The Debian-bundled
    # pgbackrest binary in the postgres container (2.58 in Bookworm
    # backports) and the sidecar's 2.55 both accept 'zst' as the
    # canonical name; only the sidecar's older form accepts 'zstd'.
    compress-type=zst
    compress-level=6
    repo1-cipher-type=aes-256-cbc
    # cipher-pass is loaded from the pgbackrest-r2-credentials secret via
    # the PGBACKREST_REPO1_CIPHER_PASS env var — pgBackRest reads env vars
    # named PGBACKREST_<OPTION_UPPER> automatically.

    # ----- R2 operations-cost control (repo bundling) -----
    # WHY: R2 bills Class A operations ($4.50/M after 1M free). Without
    # bundling, pgBackRest stores every WAL segment + backup file as an
    # individual object and issues a directory LIST before writes, so a repo
    # that accumulates hundreds of thousands of small objects generates
    # millions of ListObjects/mo. Measured 2026-08-06: enclii-backups drove
    # ~9.24M ListObjects/mo (~200k/day) = ~$40/mo of a $42.80 Cloudflare bill,
    # ~95% of it, on a 427k-object repo. See
    # internal-devops/docs/finance/INFRASTRUCTURE_COGS.md §6.
    #
    # repo1-bundle=y combines files below repo1-bundle-limit into larger
    # objects (default target repo1-bundle-size=1GiB). This slashes object
    # count and the per-file LIST/PUT operations. It is SAFE to enable on an
    # existing repo: it only changes how NEW backups are written; existing
    # unbundled objects stay readable, and PITR/restore are unaffected. The
    # benefit accrues as old unbundled WAL expires out of retention.
    # Supported by both pgBackRest versions in play (sidecar 2.55, postgres
    # container 2.58; repo-bundle since 2.29).
    repo1-bundle=y
    repo1-bundle-limit=20MiB

    # ----- archive-push tuning -----
    # Run archive-push async so Postgres never blocks on R2 latency.
    archive-async=y
    archive-push-queue-max=2GiB
    spool-path=/var/lib/pgbackrest/spool
    # Per-process worker count for archive-push. R2 tolerates high
    # parallelism; 4 is a safe default for a 2-core Postgres pod.
    process-max=4

    # ----- logging -----
    log-level-console=info
    log-level-file=detail
    log-path=/var/log/pgbackrest

    # ----- lock path (allowed in [global]) -----
    lock-path=/tmp/pgbackrest

    [main]
    # Stanza name — referenced by archive_command in postgresql.conf.
    # Do not rename after first backup. Ever.
    #
    # pgBackRest 2.49+ requires stanza-only options (pg1-*) to live under
    # the stanza section, NOT [global]. Putting them in [global] passes
    # parser but every command fails with:
    #   "configuration file contains stanza-only option 'pg1-path' in
    #    global section 'global'"
    # Followed by "ERROR [037]: check command requires option: pg1-path".
    # That broke the entire backup pipeline on 2026-04-19 when this image
    # was upgraded. Moving them here fixes it. (See enclii issue.)
    # pg1-path is the actual postgres PGDATA. The postgres container
    # mounts the PVC's `postgres/` subdir at /var/lib/postgresql/data
    # (subPath=postgres), so PGDATA inside the container resolves to
    # /var/lib/postgresql/data — NOT /var/lib/postgresql/data/postgres.
    # The sidecar's mount uses the same subPath, so pg1-path must match.
    pg1-path=/var/lib/postgresql/data
    pg1-port=5432
    pg1-user=postgres
    # Postgres' unix socket is shared between containers via a named
    # emptyDir volume mounted at /var/run/postgresql in BOTH the
    # postgres and pgbackrest containers (postgres-socket volume
    # in postgres.yaml). Without that shared mount, the sidecar saw
    # "/var/run/postgresql/.s.PGSQL.5432" missing and failed every
    # check with "[027] no database found".
    #
    # Don't use pg1-host=127.0.0.1 — that flips pgbackrest into SSH
    # remote-host mode, which expects pgbackrest to be runnable as a
    # remote process via SSH (which is NOT how a sidecar works).
    pg1-socket-path=/var/run/postgresql
