apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Shared data services (data namespace)
  - postgres.yaml
  - redis.yaml

  # Backup infrastructure (data namespace)
  - postgres-backup.yaml
