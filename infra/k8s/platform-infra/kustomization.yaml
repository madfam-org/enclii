apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Shared data services (data namespace)
  - postgres.yaml
  - redis.yaml
  - pgbouncer.yaml

  # Backup infrastructure (data namespace)
  - postgres-backup.yaml
  - backup-verify-cronjob.yaml
  # The logical pg_dumpall restore drill is the CronJob in
  # production/backup/restore-drill-cronjob.yaml (backup ArgoCD app); run it
  # on demand with scripts/backup-restore-drill.sh.

  # P1.1 — WAL archiving to R2 via pgBackRest.
  # Existing postgres-backup.yaml (daily pg_dump) stays in place for a
  # 30-day dual-write soak. Retire it only after WAL/PITR restore is proven
  # in 3 consecutive DR drills.
  - postgres-wal-config.yaml
  - pgbackrest-config.yaml
  - pgbackrest-cronjobs.yaml
  - pgbackrest-r2-credentials.externalsecret.yaml
  # pgbackrest-r2-credentials.yaml.template is retained only as a break-glass
  # literal Secret reference; normal production sync is Vault-backed above.
  # Monthly DR drill: restores the latest backup + WAL to a side-channel
  # PVC, starts it and checks contents and replay recency. Its signal is
  # the CronJob's last successful time (kube-state-metrics), alerted in
  # monitoring/prometheus.yaml pgbackrest-health-rules.
  - postgres-pgbackrest-restore-drill.yaml

  # Monitoring exporters (data namespace)
  - postgres-exporter.yaml
