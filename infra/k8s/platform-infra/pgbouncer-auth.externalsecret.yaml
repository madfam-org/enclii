---
# pgbouncer_auth's password for the shared pgbouncer (namespace data).
#
# pgbouncer logs in to Postgres as pgbouncer_auth to run auth_query
# (pgbouncer.ini in pgbouncer.yaml), so this one credential is the only one the
# pooler needs to hold for roles that have no userlist line. The pgbouncer
# Deployment's init container writes it as the first line of userlist.txt; the
# same value is set on the Postgres role by scripts/pgbouncer-auth-query.sh
# migrate, which reads it from this Secret in the cluster.
#
# ONE WRITER. The Vault property is written only by
#   enclii secrets intake submit data/pgbouncer-auth \
#     --generate pgbouncer_auth_password --reason "..."
# (registry: apps/switchyard-api/internal/secretsintake/registry.yaml). It lives
# at secret/enclii because pgbouncer is platform infrastructure and the intake
# writer policy already covers that path; the enclii-secrets ExternalSecret does
# not reference the property, so it ignores it.
#
# ROTATION. Re-run the intake command, wait for this ExternalSecret to sync
# (refreshInterval, or the intake force-sync), re-run `pgbouncer-auth-query.sh
# migrate` so the role gets the new password, then restart the pgbouncer
# Deployment so the init container rebuilds the userlist. Between the migrate
# and the restart, pooler pods still on the old password cannot run auth_query;
# roles with a userlist line are unaffected.
#
# deletionPolicy Retain: deleting this ExternalSecret must not pull the
# credential out from under running pooler pods.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbouncer-auth
  namespace: data
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: pgbouncer-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The Secret key is the file name the init container reads
    # (/etc/pgbouncer-auth/pgbouncer_auth_password) and the key
    # pgbouncer-auth-query.sh migrate reads; renaming it breaks both.
    - secretKey: pgbouncer_auth_password  # pragma: allowlist secret
      remoteRef:
        key: secret/enclii
        property: pgbouncer_auth_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
