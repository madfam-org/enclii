---
# pgBackRest restore drill: proves that the R2 repository can actually be
# restored and that the restored cluster STARTS and holds data. Without a
# passing drill we have backups but no proven recovery.
#
# Runs monthly on the 1st (see `schedule`). Restores the latest backup plus
# every archived WAL segment into a side-channel PVC, starts a throwaway
# Postgres on it with archiving OFF, and then checks the result. The drill
# FAILS unless ALL of these hold:
#   1. `pgbackrest info` succeeds and the stanza lists at least one backup.
#   2. `pgbackrest restore` succeeds.
#   3. The restored cluster starts, finishes WAL replay and is promoted
#      (`pg_is_in_recovery()` = false), and no archive-get failed on the way
#      (no pgBackRest ERROR line in the restored server's log).
#   4. It holds at least MIN_DATABASES non-template databases and at least
#      MIN_USER_TABLES user tables across them.
#   5. Replay reached a transaction no older than MAX_REPLAY_AGE_SECONDS
#      before the drill started. That is the point-in-time chain
#      (full + diff + WAL) proven end to end, not just a base backup.
# A drill that restores nothing, or restores an old snapshot, exits non-zero.
#
# Why it never passed before 2026-09-24 (two defects, both in this file):
#   - It restored into the PVC ROOT. A fresh ext4 volume holds `lost+found`
#     (root, 0700), so `rm -rf <root>/*` as uid 999 failed under `set -e`
#     before pgBackRest ran, and pgBackRest refuses a non-empty target anyway.
#   - It passed `--no-archive-check`, which is not a `restore` option.
#   A hand-fixed one-off Job (restore into a chowned `pgdata/` subdirectory,
#   no `--no-archive-check`) completed in 25 minutes on 2026-05-06. That fix
#   never reached this CronJob.
#
# Why the 2026-10-01 run, the first after that fix, still failed (about 20
# minutes in, exit 1; its container log was gone before anyone read it). Two
# more defects, either one enough to fail every run:
#   - No NetworkPolicy let this pod out. `default-deny-egress` selects every
#     pod in `data` and no allow rule matched app=pgbackrest-restore-drill, so
#     DNS and HTTPS to R2 are refused once kube-router programs the pod (a new
#     pod gets a short unfiltered window first, which is why the apt init step
#     and the start of the restore worked). Every WAL segment is fetched by a
#     NEW archive-get process (new DNS lookup, new TLS connection), so the
#     replay cannot work. Fixed by `pgbackrest-restore-drill-egress` in
#     infra/k8s/policies/data-network-policies.yaml.
#   - `pg_ctl -w` does not wait for the replay. With hot_standby=off the
#     postmaster reports itself started as soon as redo BEGINS, and refuses
#     every connection ("Hot standby mode is disabled") until it promotes, so
#     the `pg_is_in_recovery()` check ran against a server still replaying
#     and failed with "restored cluster is still in recovery". Reproduced with
#     this script and these images; the drill now waits for promotion.
#   Also hardened, because both defects could have produced a false PASS:
#     PostgreSQL treats a FAILED restore_command exactly like "no more WAL in
#     the archive" and promotes early, so the drill fails on any pgBackRest
#     ERROR in the restored server's log; and MAX_REPLAY_AGE_SECONDS is 30 min,
#     not 6 h (the newest backup, 00:00 UTC, is only 4-5 h older than the
#     scheduled run, so a replay that stopped at the base backup passed 6 h).
#
# Why a side-channel restore (not "restore in place"):
#   - In-place would destroy the live DB.
#   - Side-channel exercises the full restore path, including the R2 round trip.
#   - The restored data is deleted on exit (trap), so no tenant data rests on
#     the drill PVC between runs.
#
# SAFETY: the restored cluster must never write into the production repo. The
# restore passes `--archive-mode=off` (pgBackRest writes archive_mode=off
# into postgresql.auto.conf) and the server is also started with
# `-c archive_mode=off`, so the new timeline it creates on promotion is never
# pushed to R2. Nor can the drill touch the live database: it mounts no
# Postgres data or spool volume (only its own scratch PVC below), gets no
# service-account token, its server listens on a local socket only, and its
# egress policy allows DNS, 80 and 443 and nothing else (no 5432). The
# pgBackRest commands it runs (info, restore, archive-get) only read the repo.
# tests/scripts/test_pgbackrest_restore_drill.py pins all of this.
#
# PASS/FAIL SIGNAL: the Job's exit code. kube-state-metrics publishes
# kube_cronjob_status_last_successful_time for this CronJob, and the
# pgbackrest-health-rules in monitoring/prometheus.yaml alert when it is
# missing (never succeeded) or older than 35 days. The old textfile metric
# (pgbackrest_restore_drill_*) was never emitted: this pod mounts no
# node-exporter textfile directory. The reason is kept too: every failure
# path prints the restored server's log tail and then, as its LAST line,
# `RESTORE DRILL FAILED: <why>`; terminationMessagePolicy
# FallbackToLogsOnError stores that tail as the pod's termination message,
# which outlives the container log (`enclii ops pods diagnose -n data`).
#
# pgBackRest VERSION: pinned to PGBACKREST_DEB_VERSION below. It must equal
# the version that writes the repository (the postgres pod's archive-push,
# 2.59.1 since 2026-09-18). The binary is installed and bundled exactly as
# the postgres pod does it (postgres.yaml initContainer), so a passing drill
# also proves that bundling method.
#
# Owner: solarpunk@madfam (internal-devops)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgbackrest-restore-drill-pvc
  namespace: data
  labels:
    app.kubernetes.io/name: pgbackrest-restore-drill
    app.kubernetes.io/component: backup-verification
    app.kubernetes.io/part-of: enclii
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # The 2026-09-13 full backup was 2.1GB of data files; the restored
      # cluster also needs room for replayed WAL (pg_wal) and growth. 4Gi was
      # sized in May for ~1.6GB and no longer fits. Longhorn allows online
      # expansion (allowVolumeExpansion: true), and the PVC is detached
      # between drills.
      storage: 8Gi
  storageClassName: longhorn
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pgbackrest-restore-drill
  namespace: data
  labels:
    app.kubernetes.io/name: pgbackrest-restore-drill
    app.kubernetes.io/component: backup-verification
    app.kubernetes.io/part-of: enclii
spec:
  # 1st of each month at 06:00 (controller-local time), after the weekly full.
  schedule: "0 6 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Keep finished drill Jobs (and their logs) for 7 days.
      ttlSecondsAfterFinished: 604800
      # Restore + WAL replay + checks. Replay length depends on how much WAL
      # has accumulated since the last full/diff.
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: pgbackrest-restore-drill
        spec:
          restartPolicy: Never
          serviceAccountName: pgbackrest-runner
          # The drill never calls the Kubernetes API. Without a token, the
          # runner account's pods/exec grant in `data` is out of its reach.
          automountServiceAccountToken: false
          # No fsGroup on purpose: a recursive group chown at mount time
          # would give group write on any leftover data directory, which
          # Postgres refuses to start on. The init container creates the
          # uid-999 `pgdata/` subdirectory instead.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Installs the PINNED pgBackRest version and bundles it the same
            # way the postgres pod does (binary + ldd libs + CA bundle behind
            # a wrapper). Runs as root only because apt needs it; it exits
            # before the drill container starts.
            - name: install-pgbackrest
              image: docker.io/postgres:15-bookworm@sha256:3436058afb51dbc169c96cdf6c91d1d235eef176b427e6bded8b0c76dda0d1c3
              terminationMessagePolicy: FallbackToLogsOnError
              securityContext:
                privileged: false
                runAsUser: 0
                runAsNonRoot: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: [ALL]
                  add:
                    [SETUID, SETGID, CHOWN, FOWNER, FSETID, DAC_OVERRIDE,
                     DAC_READ_SEARCH, NET_BIND_SERVICE]
              env:
                - name: PGBACKREST_DEB_VERSION
                  value: "2.59.1-1.pgdg12+1"
                - name: PGBACKREST_EXPECTED_VERSION
                  value: "pgBackRest 2.59.1"
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  install_pinned() {
                    apt-get update >/dev/null
                    apt-get install -y --no-install-recommends \
                      "pgbackrest=${PGBACKREST_DEB_VERSION}" ca-certificates >/dev/null
                  }
                  # The live PGDG suite keeps only recent versions. When the
                  # pin has rotated out of it, fall back to the PGDG archive
                  # suite (same signing key), which keeps every version.
                  if ! install_pinned; then
                    echo "pinned ${PGBACKREST_DEB_VERSION} not in the live PGDG suite; trying apt-archive"
                    sed -E 's#https?://apt\.postgresql\.org/pub/repos/apt/? +([a-z]+)-pgdg .*$#http://apt-archive.postgresql.org/pub/repos/apt \1-pgdg-archive main#' \
                      /etc/apt/sources.list.d/pgdg.list > /etc/apt/sources.list.d/pgdg-archive.list
                    install_pinned
                  fi
                  GOT="$(pgbackrest version)"
                  if [ "${GOT}" != "${PGBACKREST_EXPECTED_VERSION}" ]; then
                    echo "FAIL: installed '${GOT}', expected '${PGBACKREST_EXPECTED_VERSION}'" >&2
                    exit 1
                  fi
                  mkdir -p /opt/pgbackrest/bin /opt/pgbackrest/lib
                  for lib in $(ldd /usr/bin/pgbackrest | awk '/=> \//{print $3}' | sort -u); do
                    cp -L "$lib" /opt/pgbackrest/lib/
                  done
                  cp /etc/ssl/certs/ca-certificates.crt /opt/pgbackrest/ca-certificates.crt
                  cp /usr/bin/pgbackrest /opt/pgbackrest/lib/pgbackrest.real
                  cat > /opt/pgbackrest/bin/pgbackrest <<'WRAPPER'
                  #!/bin/sh
                  export LD_LIBRARY_PATH=/opt/pgbackrest/lib
                  export SSL_CERT_FILE=/opt/pgbackrest/ca-certificates.crt
                  exec /opt/pgbackrest/lib/pgbackrest.real "$@"
                  WRAPPER
                  chmod 755 /opt/pgbackrest/bin/pgbackrest /opt/pgbackrest/lib/pgbackrest.real
                  # Restore into a SUBDIRECTORY owned by the postgres uid; the
                  # volume root holds lost+found and must not be the target.
                  install -d -o 999 -g 999 -m 0700 /var/lib/restore-drill/pgdata
                  echo "installed: $(/opt/pgbackrest/bin/pgbackrest version)"
              volumeMounts:
                - name: pgbackrest-binary
                  mountPath: /opt/pgbackrest
                - name: restore-target
                  mountPath: /var/lib/restore-drill
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          containers:
            - name: drill
              # Same image and digest as the production postgres container,
              # so the restored cluster starts on the binaries (and pgvector)
              # it would really be restored onto.
              image: docker.io/pgvector/pgvector:pg15@sha256:bd12d6788a617f4147d5a2ae0b56d07921398adabfe5a033bd3f50c245df55a1
              # A failed run's last log lines (ending with the RESTORE DRILL
              # FAILED line) become the pod's termination message.
              terminationMessagePolicy: FallbackToLogsOnError
              securityContext:
                privileged: false
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: [ALL]
              env:
                - name: PGBACKREST_CONFIG
                  value: /etc/pgbackrest.conf
                # Overrides of pgbackrest.conf for this pod: every path
                # pgBackRest writes must be writable scratch, and archive-get
                # runs synchronously. Environment options (unlike
                # command-line ones) are ignored by commands they do not
                # apply to, and they are inherited by the archive-get that
                # the restored server runs as its restore_command.
                - name: PGBACKREST_LOG_LEVEL_FILE
                  value: "off"
                - name: PGBACKREST_LOG_PATH
                  value: /tmp/pgbackrest/log
                - name: PGBACKREST_LOCK_PATH
                  value: /tmp/pgbackrest/lock
                - name: PGBACKREST_SPOOL_PATH
                  value: /tmp/pgbackrest/spool
                - name: PGBACKREST_ARCHIVE_ASYNC
                  value: "n"
                # Thresholds. Tuned for the shared data/postgres instance
                # (9+ tenant databases). A restore below them is a failure.
                - name: MIN_DATABASES
                  value: "5"
                - name: MIN_USER_TABLES
                  value: "500"
                # The archive trails real time by a minute or two
                # (archive_timeout=60, and the sidecar's `pgbackrest check`
                # forces a WAL switch every 30 s), and the replay keeps
                # chasing it while the drill runs, so a complete replay ends
                # at or after the drill start. 30 min allows for an archiver
                # hiccup. The old 6 h proved nothing: the newest backup
                # (00:00 UTC) is only 4-5 h older than the scheduled run, so
                # a replay that stopped at the base backup passed.
                - name: MAX_REPLAY_AGE_SECONDS
                  value: "1800"
                # The script's own budget for restore + replay. It runs out
                # before the Job's activeDeadlineSeconds (7200), so a run
                # that is too slow still prints its FAIL line instead of
                # being killed without one (DeadlineExceeded).
                - name: DRILL_DEADLINE_SECONDS
                  value: "6600"
              envFrom:
                - secretRef:
                    name: pgbackrest-r2-credentials
                    optional: false
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  START_EPOCH=$(date +%s)
                  PGDATA_DIR=/var/lib/restore-drill/pgdata
                  PGLOG=/tmp/restore-drill-postgres.log
                  PGBR=/opt/pgbackrest/bin/pgbackrest
                  mkdir -p /tmp/pgbackrest/log /tmp/pgbackrest/lock /tmp/pgbackrest/spool

                  # Every failure prints the restored server's log tail (minus
                  # pgBackRest's long "command begin" option dumps) and then
                  # the FAIL line LAST, so the termination message names it.
                  fail() {
                    if [ -s "${PGLOG}" ]; then
                      echo "--- restored server log, last 40 lines ---" >&2
                      grep -v 'command begin' "${PGLOG}" | tail -n 40 >&2 || true
                    fi
                    echo "[$(date -Iseconds)] RESTORE DRILL FAILED: $*" >&2
                    exit 1
                  }
                  remaining() { echo $(( START_EPOCH + DRILL_DEADLINE_SECONDS - $(date +%s) )); }
                  cleanup() {
                    pg_ctl -D "${PGDATA_DIR}" stop -m immediate >/dev/null 2>&1 || true
                    # Never leave restored tenant data at rest on the PVC.
                    find "${PGDATA_DIR}" -mindepth 1 -delete 2>/dev/null || true
                  }
                  trap cleanup EXIT

                  echo "[$(date -Iseconds)] Restore drill starting ($(${PGBR} version))"

                  echo "[1/5] Stanza info"
                  INFO=$(${PGBR} --stanza=main info) || fail "pgbackrest info failed"
                  echo "${INFO}"
                  grep -Eq '^ +(full|diff|incr) backup: ' <<<"${INFO}" || fail "stanza 'main' lists no backups"

                  echo "[2/5] Restore latest backup + archived WAL into ${PGDATA_DIR}"
                  find "${PGDATA_DIR}" -mindepth 1 -delete
                  # --cmd makes the generated restore_command call the wrapper
                  # (which sets LD_LIBRARY_PATH), not the bare binary.
                  ${PGBR} --stanza=main \
                    --pg1-path="${PGDATA_DIR}" \
                    --cmd="${PGBR}" \
                    --archive-mode=off \
                    --log-level-console=info \
                    restore || fail "pgbackrest restore failed"
                  [ -f "${PGDATA_DIR}/global/pg_control" ] || fail "pg_control missing after restore"
                  chmod 0700 "${PGDATA_DIR}"
                  # Local-socket trust only, independent of the restored
                  # pg_hba.conf; the server listens on no TCP address.
                  echo "local all all trust" > /tmp/drill-pg_hba.conf
                  echo "  restored size: $(du -sh "${PGDATA_DIR}" | cut -f1)"
                  [ "$(remaining)" -gt 0 ] || fail "the restore used up the ${DRILL_DEADLINE_SECONDS}s budget"

                  echo "[3/5] Start the restored cluster (archive OFF, local socket only) and replay WAL"
                  # hot_standby=off: the server accepts no connection until
                  # replay ends and it promotes, and the recovery-parameter
                  # checks against the primary do not apply. It does NOT make
                  # `pg_ctl -w` wait for that: the postmaster reports itself
                  # started as soon as redo BEGINS (this is what failed the
                  # 2026-10-01 run), so wait for promotion below.
                  # timezone=UTC fixes the format of the replay time step 5 parses.
                  pg_ctl -D "${PGDATA_DIR}" -l "${PGLOG}" -w -t "$(remaining)" \
                    -o "-c archive_mode=off -c hot_standby=off -c port=5433 -c listen_addresses='' -c unix_socket_directories=/tmp -c hba_file=/tmp/drill-pg_hba.conf -c shared_buffers=128MB -c shared_preload_libraries='' -c log_timezone=UTC -c timezone=UTC" \
                    start || fail "restored cluster did not start"
                  echo "  replaying archived WAL, waiting for promotion"
                  until pg_isready -q -h /tmp -p 5433; do
                    pg_ctl -D "${PGDATA_DIR}" status >/dev/null 2>&1 || fail "restored cluster stopped during WAL replay"
                    [ "$(remaining)" -gt 0 ] || fail "WAL replay still running after ${DRILL_DEADLINE_SECONDS}s"
                    sleep 10
                  done
                  PSQL="psql -h /tmp -p 5433 -U postgres -X -v ON_ERROR_STOP=1 -tA"
                  [ "$(${PSQL} -d postgres -c 'SELECT pg_is_in_recovery()')" = "f" ] || fail "restored cluster is still in recovery"
                  # PostgreSQL treats a FAILED restore_command exactly like "no
                  # more WAL" and promotes early. pgBackRest logs a segment
                  # that is simply not in the archive (the normal end of the
                  # replay) as INFO; any other failure (DNS, TLS, R2, decrypt)
                  # is an ERROR line in this log.
                  ARCHIVE_ERRORS=$(grep -cE 'P[0-9]{2} +(ERROR|ASSERT): ' "${PGLOG}" || true)
                  [ "${ARCHIVE_ERRORS}" -eq 0 ] || fail "archive-get failed ${ARCHIVE_ERRORS} time(s) during WAL replay, so the replay may have stopped early"
                  WAL_SEGMENTS=$(grep -c 'restored log file .* from archive' "${PGLOG}" || true)
                  echo "  promoted after replaying ${WAL_SEGMENTS} WAL segments from the archive"

                  echo "[4/5] Validate restored contents"
                  DBS=$(${PSQL} -d postgres -c "SELECT datname FROM pg_database WHERE NOT datistemplate AND datallowconn ORDER BY 1")
                  DB_COUNT=0; TABLES=0
                  for DB in ${DBS}; do
                    N=$(${PSQL} -d "${DB}" -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE c.relkind IN ('r','p') AND n.nspname NOT IN ('pg_catalog','information_schema') AND n.nspname NOT LIKE 'pg_toast%'") \
                      || fail "cannot query restored database ${DB}"
                    echo "  ${DB}: ${N} user tables"
                    DB_COUNT=$((DB_COUNT + 1)); TABLES=$((TABLES + N))
                  done
                  echo "  databases=${DB_COUNT} user_tables=${TABLES}"
                  [ "${DB_COUNT}" -ge "${MIN_DATABASES}" ] || fail "only ${DB_COUNT} databases restored (< ${MIN_DATABASES})"
                  [ "${TABLES}" -ge "${MIN_USER_TABLES}" ] || fail "only ${TABLES} user tables restored (< ${MIN_USER_TABLES})"

                  echo "[5/5] Prove the point-in-time chain reached recent WAL"
                  LAST_TX=$(sed -n 's/.*last completed transaction was at log time \(.*\)$/\1/p' "${PGLOG}" | tail -n 1)
                  [ -n "${LAST_TX}" ] || fail "no 'last completed transaction' line: WAL replay evidence missing"
                  # timezone=UTC: strip the fraction and the +00 offset.
                  LAST_TX_EPOCH=$(date -u -d "${LAST_TX%%[.+]*}" +%s) || fail "cannot parse replay time '${LAST_TX}'"
                  REPLAY_AGE=$((START_EPOCH - LAST_TX_EPOCH))
                  echo "  last replayed transaction: ${LAST_TX} (${REPLAY_AGE}s before drill start)"
                  [ "${REPLAY_AGE}" -le "${MAX_REPLAY_AGE_SECONDS}" ] || fail "restored data is ${REPLAY_AGE}s old (> ${MAX_REPLAY_AGE_SECONDS}s): WAL chain incomplete"

                  echo "[$(date -Iseconds)] RESTORE DRILL PASSED in $(( $(date +%s) - START_EPOCH ))s: databases=${DB_COUNT} user_tables=${TABLES} wal_segments=${WAL_SEGMENTS} replay_age=${REPLAY_AGE}s"
              volumeMounts:
                - name: pgbackrest-binary
                  mountPath: /opt/pgbackrest
                  readOnly: true
                - name: pgbackrest-config
                  mountPath: /etc/pgbackrest.conf
                  subPath: pgbackrest.conf
                  readOnly: true
                - name: restore-target
                  mountPath: /var/lib/restore-drill
                # In case the restored postgresql.conf includes a conf.d
                # directory that exists only in the production pod.
                - name: conf-d
                  mountPath: /etc/postgresql/conf.d
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
          volumes:
            - name: pgbackrest-binary
              emptyDir:
                medium: Memory
                # The bundle (binary + libs + CA) is ~60MB; 64Mi left no room.
                sizeLimit: 128Mi
            - name: pgbackrest-config
              configMap:
                name: pgbackrest-config
                defaultMode: 0644
            - name: restore-target
              persistentVolumeClaim:
                claimName: pgbackrest-restore-drill-pvc
            - name: conf-d
              emptyDir:
                sizeLimit: 1Mi
