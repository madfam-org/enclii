---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbackrest-r2-credentials
  namespace: data
  labels:
    app.kubernetes.io/name: pgbackrest
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/managed-by: enclii
  annotations:
    # Live secret/pgbackrest-r2-credentials exists (deletionPolicy: Retain).
    # Ignore Argo health until Vault path secret/pgbackrest-r2 is backfilled.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: pgbackrest-r2-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: R2_ACCOUNT_ID
      remoteRef:
        key: secret/pgbackrest-r2
        property: r2_account_id
    - secretKey: PGBACKREST_REPO1_S3_KEY
      remoteRef:
        key: secret/pgbackrest-r2
        property: r2_access_key_id
    - secretKey: PGBACKREST_REPO1_S3_KEY_SECRET
      remoteRef:
        key: secret/pgbackrest-r2
        property: r2_secret_access_key
    - secretKey: PGBACKREST_REPO1_CIPHER_PASS
      remoteRef:
        key: secret/pgbackrest-r2
        property: pgbackrest_cipher_pass
