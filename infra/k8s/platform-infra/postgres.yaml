---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: enclii
data:
  init-enclii.sh: |
    #!/bin/bash
    set -e
    psql -U postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='enclii'" | grep -q 1 || \
      psql -U postgres -c "CREATE ROLE enclii WITH LOGIN SUPERUSER CREATEDB CREATEROLE PASSWORD '${POSTGRES_PASSWORD}';"
    psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='enclii'" | grep -q 1 || \
      psql -U postgres -c "CREATE DATABASE enclii OWNER enclii;"
    echo "Init complete"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
# P1.1: dedicated PVC for pgBackRest spool + async WAL queue. Kept separate
# from the Postgres data PVC so spool growth never threatens database storage.
# Sized for ~2GiB of in-flight WAL (archive-push-queue-max) plus several
# hours of spool on an R2 outage. Upgradable in-place via Longhorn.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgbackrest-spool-pvc
  namespace: data
  labels:
    app: postgres
    app.kubernetes.io/name: pgbackrest
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: enclii
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: enclii
    spec:
      # PostgreSQL official image runs initdb as root, then drops to UID 999.
      # securityContext allows root but blocks privilege escalation.
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # P1.1: initContainer copies the pgbackrest binary from the pgBackRest
      # image into a shared volume so the Postgres container (which has no
      # pgbackrest installed) can invoke it as archive_command. This keeps
      # the official Postgres image untouched and makes pgBackRest version
      # bumps a simple image tag change here.
      initContainers:
        - name: pgbackrest-binary
          # MUST be glibc-compatible — the binary copied here runs from
          # the postgres container, which is Debian/glibc. The previous
          # woblerr/pgbackrest:alpine image ships a musl-linked binary,
          # which postgres' archive_command fails with "exit code 127:
          # cannot execute: required file not found". Use the same
          # postgres:15-bookworm base so libc + ld-linux versions match
          # exactly, and apt-install pgbackrest from Debian's package
          # repo at init time.
          image: docker.io/postgres:15-bookworm
          # Network access is required for apt-get; this initContainer
          # is gated behind NetworkPolicy data namespace egress (DNS
          # only by default). To install successfully, ensure
          # postgres-egress (or a sibling NP for app=postgres init
          # containers) allows port 80 + 443 to apt mirrors.
          securityContext:
            # apt's package downloader runs as the `_apt` user (uid
            # 42). When the container starts as a non-root uid (e.g.
            # the inherited uid 999 from runAsNonRoot enforcement),
            # apt cannot setgroups/seteuid to drop to _apt and
            # downloads fail with "Failed to setgroups (1)". Run the
            # init container as root and disable the runAsNonRoot
            # constraint here. This is acceptable because the init
            # container exits cleanly before postgres ever starts —
            # the running pod's attack surface is the postgres
            # container which keeps its strict security context.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem must be FALSE for apt to write
            # under /var/lib/apt and /var/cache/apt.
            readOnlyRootFilesystem: false
            capabilities:
              # Restore the Docker default capability set so apt's
              # internals (chmod, chown, setgroups) work. The init
              # container exits before postgres starts, so this
              # broader cap set is not present in the running pod.
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
                - CHOWN
                - FOWNER
                - FSETID
                - DAC_OVERRIDE
                - DAC_READ_SEARCH
                - NET_BIND_SERVICE
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # Install pgbackrest from the Debian backports/main repo.
              # Also install ca-certificates explicitly — postgres:15-
              # bookworm doesn't ship it by default, and pgbackrest's
              # TLS verification of R2 needs the Mozilla CA bundle.
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends pgbackrest ca-certificates >/dev/null
              # Copy the binary AND every shared library it links to.
              # The postgres container is the same Debian/glibc base,
              # but doesn't have libssh2/libxml2/libcrypto installed
              # (postgres image is minimal). Without LD_LIBRARY_PATH
              # pointing at the bundled libs, the binary fails with
              # "libssh2.so.1: cannot open shared object file".
              mkdir -p /opt/pgbackrest/bin /opt/pgbackrest/lib
              for lib in $(ldd /usr/bin/pgbackrest | awk '/=> \//{print $3}' | sort -u); do
                cp -L "$lib" /opt/pgbackrest/lib/
              done
              # Bundle the CA certificates too — postgres:15-bookworm
              # has them, but the running postgres container doesn't
              # (minimal base). Without this, pgbackrest fails with
              # "unable to verify certificate presented by R2".
              cp /etc/ssl/certs/ca-certificates.crt /opt/pgbackrest/ca-certificates.crt
              # Wrap the binary in a shell script that sets
              # LD_LIBRARY_PATH so postgres' archive_command (which
              # lives in postgresql.conf and can't easily set env)
              # picks up the bundled libs transparently. Also point
              # OpenSSL/curl at the bundled CA store.
              cp /usr/bin/pgbackrest /opt/pgbackrest/lib/pgbackrest.real
              cat > /opt/pgbackrest/bin/pgbackrest <<'WRAPPER'
              #!/bin/sh
              export LD_LIBRARY_PATH=/opt/pgbackrest/lib
              export SSL_CERT_FILE=/opt/pgbackrest/ca-certificates.crt
              exec /opt/pgbackrest/lib/pgbackrest.real "$@"
              WRAPPER
              chmod 755 /opt/pgbackrest/bin/pgbackrest /opt/pgbackrest/lib/pgbackrest.real
              echo "pgbackrest installed (glibc + bundled libs + CA): $(/opt/pgbackrest/bin/pgbackrest version)"
              echo "Library bundle: $(ls /opt/pgbackrest/lib/)"
              echo "CA bundle: $(wc -l < /opt/pgbackrest/ca-certificates.crt) lines"
          volumeMounts:
            # Mount the shared volume at /opt/pgbackrest (parent of
            # bin/ and lib/) so we can install both the binary and
            # its bundled shared libraries.
            - name: pgbackrest-binary
              mountPath: /opt/pgbackrest
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      containers:
        - name: postgres
          # pgvector/pgvector:pg15 is stock postgres:15 with the pgvector
          # extension pre-installed (required by bloom-scroll's bloom_cards
          # similarity search). Drop-in wire-compatible with postgres:15.
          image: docker.io/pgvector/pgvector:pg15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          env:
            - name: POSTGRES_DB
              value: "enclii"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          envFrom:
            # P1.1: R2 credentials + optional cipher passphrase. pgBackRest
            # natively reads env vars named PGBACKREST_<OPTION_UPPER>.
            # R2_ACCOUNT_ID feeds the S3 endpoint template in pgbackrest.conf.
            - secretRef:
                name: pgbackrest-r2-credentials
                # Optional so Postgres starts even when the R2 creds
                # haven't been provisioned yet. pgBackRest backups will
                # fail loudly in that state, but the main DB stays up.
                optional: true
          # WAL archiving config passed via individual -c flags (the
          # alternative path the prior comment recommended). The
          # /etc/postgresql/conf.d/wal-archive.conf file is still
          # mounted but unused — keeping the configmap around as
          # documentation of what these flags express.
          #
          # archive_command runs from inside the postgres container,
          # invoking the pgbackrest binary that the initContainer
          # copied into the shared /opt/pgbackrest/bin/ volume. The
          # binary reads /etc/pgbackrest/pgbackrest.conf (mounted
          # in the postgres container at that exact path) and pushes
          # WAL segments to R2.
          #
          # archive_mode=on requires a server RESTART to flip on.
          # Setting it in args ensures every fresh pod has it from
          # boot — not a runtime GUC change.
          args:
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "archive_mode=on"
            - "-c"
            - "archive_command=/opt/pgbackrest/bin/pgbackrest --stanza=main archive-push %p"
            - "-c"
            - "archive_timeout=60"
            - "-c"
            - "max_wal_senders=10"
            - "-c"
            - "wal_keep_size=1024"
            - "-c"
            - "hot_standby=on"
            - "-c"
            - "wal_compression=on"
            - "-c"
            - "wal_sender_timeout=60s"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            # P1.1: mount pgbackrest binary + bundled libs so
            # archive_command can run inside the Postgres container.
            # Volume contains: bin/pgbackrest (wrapper script),
            # lib/pgbackrest.real (real ELF), lib/*.so.* (deps).
            - name: pgbackrest-binary
              mountPath: /opt/pgbackrest
              readOnly: true
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
            - name: pgbackrest-spool
              mountPath: /var/lib/pgbackrest
            - name: pgbackrest-logs
              mountPath: /var/log/pgbackrest
            - name: postgres-wal-config
              mountPath: /etc/postgresql/conf.d/wal-archive.conf
              subPath: wal-archive.conf
              readOnly: true
            # Shared with the pgbackrest sidecar so it can reach the
            # /var/run/postgresql/.s.PGSQL.5432 unix socket. Postgres
            # creates the socket here when it starts; without the
            # shared mount the sidecar's pgbackrest check exits
            # "[027] no database found".
            - name: postgres-socket
              mountPath: /var/run/postgresql
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
        # ----------------------------------------------------------------
        # P1.1: pgBackRest sidecar
        # ----------------------------------------------------------------
        # Responsibilities:
        #   - Drains the async archive-push queue populated by Postgres'
        #     archive_command, streaming WAL segments to R2.
        #   - Serves as the `kubectl exec` target for operator runs of
        #     `pgbackrest backup`, `info`, `check`, and `restore`.
        #   - Deliberately does NOT run archive-push itself; Postgres drives
        #     that via the shared binary in the main container.
        # Why a sidecar and not a separate Job?
        #   - archive-async=y spawns a background worker that needs to stay
        #     resident to drain the spool.
        #   - Operator `kubectl exec` into the sidecar keeps pgbackrest ops
        #     off the Postgres container's attack surface.
        - name: pgbackrest
          image: docker.io/woblerr/pgbackrest:2.55.1-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 999        # align with postgres UID for PGDATA access
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          # Long-running loop: run periodic self-check so pod Readiness is
          # a genuine signal. Real archive work happens in the primary
          # container's archive_command invocation (shared spool + binary).
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "[$(date -Iseconds)] pgbackrest sidecar starting"
              echo "[$(date -Iseconds)] version: $(pgbackrest version)"
              while true; do
                if pgbackrest --stanza=main check >/dev/null 2>&1; then
                  touch /tmp/pgbackrest-healthy
                else
                  rm -f /tmp/pgbackrest-healthy
                fi
                sleep 30
              done
          env:
            # Mount path is /etc/pgbackrest.conf (file in /etc/, not in
            # /etc/pgbackrest/ subdir). The woblerr/pgbackrest:alpine
            # image bakes /etc/pgbackrest/ as mode 750 owned by an image-
            # local pgbackrest user (NOT uid 999). When this sidecar runs
            # as runAsUser:999, it can't traverse the directory at all
            # ("Permission denied" on every pgbackrest invocation since
            # 2026-04-19). Mounting the config at /etc/ directly bypasses
            # the locked subdir. pgbackrest checks /etc/pgbackrest.conf
            # before /etc/pgbackrest/pgbackrest.conf, so this path is
            # discovered via the default search.
            - name: PGBACKREST_CONFIG
              value: /etc/pgbackrest.conf
          envFrom:
            - secretRef:
                name: pgbackrest-r2-credentials
                # Optional so Postgres starts even when the R2 creds
                # haven't been provisioned yet. pgBackRest backups will
                # fail loudly in that state, but the main DB stays up.
                optional: true
          volumeMounts:
            # Need PGDATA access for `check` / `backup` / `restore` commands.
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
            - name: pgbackrest-spool
              mountPath: /var/lib/pgbackrest
            - name: pgbackrest-logs
              mountPath: /var/log/pgbackrest
            - name: pgbackrest-tmp
              mountPath: /tmp
            # Shared with postgres container — sidecar reads the
            # libpq unix socket created by postgres at /.s.PGSQL.5432.
            - name: postgres-socket
              mountPath: /var/run/postgresql
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Readiness cannot depend on R2 reachability: the sidecar is
          # co-located with postgres, and the Service selector picks
          # only pods where ALL containers are Ready. If the sidecar
          # goes NotReady on R2 failure, postgres.data.svc drops its
          # endpoint and every dependent service sees ECONNREFUSED —
          # even though the DB itself is happily accepting connections.
          # So readiness checks only process liveness; archive health
          # is surfaced via Prometheus (pgbackrest_check_healthy metric
          # from the pgbackrest-check CronJob).
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - pgbackrest
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - pgbackrest
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-scripts
          configMap:
            name: postgres-init
        # P1.1: shared tmpfs for the pgbackrest binary, populated by the
        # initContainer from the pgbackrest image. Memory medium keeps the
        # binary (~30MB) resident without a PVC round-trip.
        - name: pgbackrest-binary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: pgbackrest-config
          configMap:
            name: pgbackrest-config
            defaultMode: 0644
        - name: postgres-wal-config
          configMap:
            name: postgres-wal-config
            defaultMode: 0644
        # Durable spool — survives pod restarts so WAL in flight is not lost.
        - name: pgbackrest-spool
          persistentVolumeClaim:
            claimName: pgbackrest-spool-pvc
        # Logs — emptyDir + stdout scraped by Fluent Bit.
        - name: pgbackrest-logs
          emptyDir:
            sizeLimit: 256Mi
        - name: pgbackrest-tmp
          emptyDir:
            sizeLimit: 64Mi
        # Shared between postgres + pgbackrest sidecar so the latter
        # can reach the libpq unix socket. Memory medium keeps the
        # socket inode in tmpfs (no PVC round-trip).
        - name: postgres-socket
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: enclii
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: postgres
