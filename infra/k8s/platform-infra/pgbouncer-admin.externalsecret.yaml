# pgbouncer_admin's password for the shared pgbouncer (namespace data).
#
# pgbouncer.ini names pgbouncer_admin in admin_users and stats_users (the admin
# console: SHOW USERS, SHOW POOLS, RELOAD). The console has no Postgres
# backend, so auth_query cannot answer for it: the user needs a line in
# userlist.txt. Until 2026-10-22 nothing wrote that line (the hand-kept
# pgbouncer-userlist Secret never carried it), so the console refused every
# login and `scripts/pgbouncer-auth-query.sh verify` failed its SHOW USERS
# check. The pgbouncer Deployment's init container now writes
# `"pgbouncer_admin" "<this value>"` second, right after pgbouncer_auth's line,
# when this Secret exists.
#
# The value is a pgbouncer-only credential: pgbouncer_admin does not need to be
# a Postgres role for the console, and get_auth never returns it
# (scripts/sql/pgbouncer-auth-query.sql), so it cannot be used to log in to a
# database through the pooler with this password unless the Postgres role
# has the same one.
#
# ONE WRITER. The Vault property is written only by
#   enclii secrets intake submit data/pgbouncer-admin \
#     --generate pgbouncer_admin_password --reason "..."
# (registry: apps/switchyard-api/internal/secretsintake/registry.yaml), at
# secret/enclii like pgbouncer_auth_password; enclii-secrets does not map it.
#
# OPTIONAL ON PURPOSE. The Deployment mounts this Secret with optional: true:
# until intake writes the property this ExternalSecret reports
# SecretSyncedError, no Secret exists, and the pooler starts exactly as before
# (no admin line, console closed). After the submit, restart the pgbouncer
# Deployment so the init container rebuilds the userlist.
#
# ROTATION. Re-run the intake command, wait for the sync, restart pgbouncer.
# Nothing else holds the value.
#
# deletionPolicy Retain: deleting this ExternalSecret must not pull the
# credential out from under running pooler pods.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbouncer-admin
  namespace: data
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: pgbouncer-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The Secret key is the file name the init container reads
    # (/etc/pgbouncer-admin/pgbouncer_admin_password); renaming it turns the
    # console off again.
    - secretKey: pgbouncer_admin_password  # pragma: allowlist secret
      remoteRef:
        key: secret/enclii
        property: pgbouncer_admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
