---
# PgBouncer Connection Pooler
# Shared connection pooler for all databases in the cluster.
# Services connect to pgbouncer.data.svc.cluster.local:6432 instead of postgres:5432.
# Required when 8+ databases × multiple services = 100+ connections exceed Postgres limits.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: data
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: enclii
data:
  pgbouncer.ini: |
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = plain
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 400
    default_pool_size = 20
    min_pool_size = 2
    reserve_pool_size = 5
    reserve_pool_timeout = 3
    max_db_connections = 40
    server_lifetime = 3600
    server_idle_timeout = 600
    server_connect_timeout = 15
    server_login_retry = 1
    query_timeout = 300
    query_wait_timeout = 120
    client_idle_timeout = 0
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60
    ignore_startup_parameters = extra_float_digits,search_path
    admin_users = pgbouncer_admin
    stats_users = pgbouncer_admin

    [databases]
    ; Each database connects to the shared Postgres instance
    enclii = host=postgres.data.svc.cluster.local port=5432 dbname=enclii
    forgesight = host=postgres.data.svc.cluster.local port=5432 dbname=forgesight
    madfam_site = host=postgres.data.svc.cluster.local port=5432 dbname=madfam_site
    karafiel = host=postgres.data.svc.cluster.local port=5432 dbname=karafiel
    pravara = host=postgres.data.svc.cluster.local port=5432 dbname=pravara
    dhanam = host=postgres.data.svc.cluster.local port=5432 dbname=dhanam
    janua = host=postgres.data.svc.cluster.local port=5432 dbname=janua
    tezca = host=postgres.data.svc.cluster.local port=5432 dbname=tezca
    selva = host=postgres.data.svc.cluster.local port=5432 dbname=selva
    * = host=postgres.data.svc.cluster.local port=5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: data
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: enclii
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: connection-pooler
        app.kubernetes.io/part-of: enclii
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: docker.io/edoburu/pgbouncer:v1.25.1-p0@sha256:c7bfcaa24de830e29588bb9ad1eb39cebaf07c27149e1974445899b695634bb4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6432
              name: pgbouncer
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          startupProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: pgbouncer-userlist
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
              readOnly: true
      volumes:
        - name: pgbouncer-config
          configMap:
            name: pgbouncer-config
        - name: pgbouncer-userlist
          secret:
            secretName: pgbouncer-userlist
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: data
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: enclii
spec:
  ports:
    - port: 6432
      targetPort: 6432
      name: pgbouncer
  selector:
    app: pgbouncer
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
  namespace: data
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: enclii
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: pgbouncer
