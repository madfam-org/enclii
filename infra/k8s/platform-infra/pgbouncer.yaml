---
# PgBouncer Connection Pooler
# Shared connection pooler for all databases in the cluster.
# Services connect to pgbouncer.data.svc.cluster.local:6432 instead of postgres:5432.
# Required when 8+ databases × multiple services = 100+ connections exceed Postgres limits.
#
# AUTHENTICATION (2026-10-21, auth_query). pgbouncer looks a role's password up
# in Postgres (auth_query, through the SECURITY DEFINER function
# pgbouncer.get_auth in the postgres database, as role pgbouncer_auth) when the
# role has no line in userlist.txt. Lines in userlist.txt still win, so the
# move is additive: every role that works through the pooler today keeps its
# line and its behaviour, and a role with no line (ceq, 2026-10-18) starts to
# work. The end state is a userlist with only pgbouncer_auth and
# pgbouncer_admin; shrinking it is a separate owner step.
#   - pgbouncer_admin (admin_users/stats_users, the admin console) gets its
#     line from Vault too (2026-10-22): secret/enclii, property
#     pgbouncer_admin_password, intake target data/pgbouncer-admin, through the
#     pgbouncer-admin ExternalSecret. The console has no Postgres backend, so
#     auth_query cannot answer for it. That Secret is optional: without it the
#     pooler runs as before and the console stays closed.
#   - The DDL is owner-run: scripts/sql/pgbouncer-auth-query.sql through
#     scripts/pgbouncer-auth-query.sh migrate (rollback: ... rollback).
#   - pgbouncer_auth's password comes from Vault (secret/enclii, property
#     pgbouncer_auth_password; intake target data/pgbouncer-auth) through the
#     pgbouncer-auth ExternalSecret. The init container below writes it as the
#     first userlist line; the value is never in git.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: data
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: enclii
data:
  pgbouncer.ini: |
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    ; AUTH (2026-10-21). md5, not plain: with auth_query the password
    ; pgbouncer gets back is the role's stored verifier, and every role on this
    ; cluster is SCRAM (PostgreSQL 15 default password_encryption, switchyard
    ; writes SCRAM verifiers). Under md5 pgbouncer uses SCRAM automatically for
    ; a SCRAM verifier, and passes the client's SCRAM keys on to Postgres, so
    ; it never needs the plaintext. Lines in userlist.txt that hold plaintext
    ; get an MD5 challenge instead of a cleartext one. plain cannot check a
    ; SCRAM verifier at all. Move to scram-sha-256 once the userlist holds only
    ; plaintext lines pgbouncer itself uses (see the module comment).
    auth_type = md5
    ; userlist.txt is built by the init container: pgbouncer_auth's line from
    ; the pgbouncer-auth Secret, then every line of the pgbouncer-userlist
    ; Secret (which switchyard-api still writes on onboarding).
    auth_file = /etc/pgbouncer/userlist.txt
    auth_user = pgbouncer_auth
    auth_dbname = postgres
    auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
    pool_mode = transaction
    max_client_conn = 400
    ; SERVER-SIDE SIZING (2026-09-24). Postgres has max_connections = 100
    ; (3 reserved for superusers) for ~25 databases. With min_pool_size = 2,
    ; server_idle_timeout = 600 and pools of 20-40 per database, this pooler
    ; alone held 60 of the 99 open connections, all idle. Every :00 cron burst
    ; then hit "remaining connection slots are reserved": karafiel's health
    ; check failed (2 of 3 API pods unready), a CTM CFDI PDF fetch 500'd, and
    ; HCM's avisos sweep raised "too many clients". In transaction mode an idle
    ; server connection serves nobody, so: keep none warm (min 0), release idle
    ; ones after a minute (60), and bound each database lower (10/2/15).
    ;
    ; TWO REPLICAS (2026-10-17). These limits are PER POOLER POD, and there
    ; are now 2, so each per-database bound is halved: 2 x 7 = 14 server
    ; connections per database at most, one fewer than the single pod's 15.
    ; No database can take more of Postgres than it could before.
    ; Budget against Postgres: 2 pods x 7 x the number of databases busy at
    ; the same moment. With max_connections 200 (197 usable) and about 60
    ; kept for direct 5432 clients (karafiel, janua, enclii, migrations,
    ; exporters, pgBackRest), 9 databases can sit at their cap at once
    ; (2 x 7 x 9 = 126 of 137). With max_connections still 100 it is the
    ; same exposure as before this change. Idle pools hold nothing
    ; (min_pool_size 0, server_idle_timeout 60).
    default_pool_size = 5
    min_pool_size = 0
    reserve_pool_size = 2
    reserve_pool_timeout = 3
    max_db_connections = 7
    server_lifetime = 3600
    server_idle_timeout = 60
    server_connect_timeout = 15
    server_login_retry = 1
    query_timeout = 300
    query_wait_timeout = 120
    client_idle_timeout = 0
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60
    ignore_startup_parameters = extra_float_digits,search_path
    admin_users = pgbouncer_admin
    stats_users = pgbouncer_admin

    [databases]
    ; Each database connects to the shared Postgres instance
    enclii = host=postgres.data.svc.cluster.local port=5432 dbname=enclii
    forgesight = host=postgres.data.svc.cluster.local port=5432 dbname=forgesight
    madfam_site = host=postgres.data.svc.cluster.local port=5432 dbname=madfam_site
    karafiel = host=postgres.data.svc.cluster.local port=5432 dbname=karafiel
    pravara = host=postgres.data.svc.cluster.local port=5432 dbname=pravara
    dhanam = host=postgres.data.svc.cluster.local port=5432 dbname=dhanam
    janua = host=postgres.data.svc.cluster.local port=5432 dbname=janua
    tezca = host=postgres.data.svc.cluster.local port=5432 dbname=tezca
    selva = host=postgres.data.svc.cluster.local port=5432 dbname=selva
    * = host=postgres.data.svc.cluster.local port=5432
  # Login roles that connect to Postgres directly (5432), never through this
  # pooler: migrators and clients whose DSN names postgres.data. pgbouncer does
  # not read this key; switchyard-api's userlist drift checker does, and does
  # not report these roles as missing from the userlist. One role per line;
  # `#` starts a comment. The first eight are from internal-devops
  # audits/2026-10-17-infra-stability/lanes/W1-P.md (W1P-5): zero pooled
  # attempts in about 9 hours of pooler logs.
  direct-connect-roles: |
    app_admin
    janua_migrator
    phyne
    posthog
    selva_migrator
    telesia
    tlacuilo
    voxa_app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: data
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: enclii
spec:
  # 2 replicas on different nodes (2026-10-17): one pooler pod was a single
  # point of failure for every pooled database, and its PDB allowed draining
  # it. Pool sizes in pgbouncer.ini are halved to match.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: connection-pooler
        app.kubernetes.io/part-of: enclii
      annotations:
        # pgbouncer.ini is mounted with subPath, so a ConfigMap edit never
        # reaches the running pod. Bump this with every pgbouncer.ini change
        # to roll the pod (maxSurge 1 / maxUnavailable 0).
        enclii.dev/pgbouncer-ini-rev: "2026-10-21-auth-query"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Never both replicas on one node. With maxSurge 1 a rollout needs a
      # third node for a moment; there are three workload nodes. If one is
      # down, the rollout waits (maxUnavailable 0) instead of stacking pods.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: pgbouncer
              topologyKey: kubernetes.io/hostname
      # Builds /etc/pgbouncer/userlist.txt in a memory-backed emptyDir:
      # pgbouncer_auth's line first; then, when the optional pgbouncer-admin
      # Secret is mounted, pgbouncer_admin's line (and any pgbouncer_admin line
      # in the hand-kept list is dropped); then the hand-kept userlist minus
      # any pgbouncer_auth line. Runs again on every pod start, which is when
      # pgbouncer would re-read the file anyway (switchyard-api restarts the
      # Deployment after it edits the userlist Secret).
      # The password is checked to be what intake --generate mints (unpadded
      # base64url, at least 32 characters): such a value cannot break the
      # quoted userlist format. A missing or odd value stops the pod here, and
      # with maxUnavailable 0 the old pods keep serving.
      initContainers:
        - name: build-userlist
          image: docker.io/edoburu/pgbouncer:v1.25.1-p0@sha256:c7bfcaa24de830e29588bb9ad1eb39cebaf07c27149e1974445899b695634bb4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077
              src=/etc/pgbouncer-userlist-source/userlist.txt
              pw_file=/etc/pgbouncer-auth/pgbouncer_auth_password
              admin_file=/etc/pgbouncer-admin/pgbouncer_admin_password
              out=/etc/pgbouncer-generated/userlist.txt
              check_pw() {
                case "$2" in
                  *[!A-Za-z0-9_-]*) echo "$1 password has characters outside base64url; refusing" >&2; exit 1 ;;
                esac
                if [ "${#2}" -lt 32 ]; then
                  echo "$1 password is shorter than 32 characters; refusing" >&2
                  exit 1
                fi
              }
              pw="$(cat "$pw_file")"
              check_pw pgbouncer_auth "$pw"
              admin=""
              if [ -e "$admin_file" ]; then
                admin="$(cat "$admin_file")"
                check_pw pgbouncer_admin "$admin"
              fi
              [ -r "$src" ] || { echo "$src is not readable" >&2; exit 1; }
              {
                printf '"pgbouncer_auth" "%s"\n' "$pw"
                if [ -n "$admin" ]; then
                  printf '"pgbouncer_admin" "%s"\n' "$admin"
                  grep -v -e '^"pgbouncer_auth"' -e '^"pgbouncer_admin"' "$src" || true
                else
                  grep -v '^"pgbouncer_auth"' "$src" || true
                fi
              } > "$out.tmp"
              mv "$out.tmp" "$out"
              own=1
              [ -z "$admin" ] || own=2
              listed=$(( $(grep -c '^"' "$out") - own ))
              if [ -n "$admin" ]; then
                echo "userlist.txt: pgbouncer_auth + pgbouncer_admin + ${listed} line(s) from pgbouncer-userlist"
              else
                echo "userlist.txt: pgbouncer_auth + ${listed} line(s) from pgbouncer-userlist (admin console closed, pgbouncer-admin not mounted)"
              fi
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "100m"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pgbouncer-userlist
              mountPath: /etc/pgbouncer-userlist-source
              readOnly: true
            - name: pgbouncer-auth
              mountPath: /etc/pgbouncer-auth
              readOnly: true
            - name: pgbouncer-admin
              mountPath: /etc/pgbouncer-admin
              readOnly: true
            - name: pgbouncer-generated
              mountPath: /etc/pgbouncer-generated
      containers:
        - name: pgbouncer
          image: docker.io/edoburu/pgbouncer:v1.25.1-p0@sha256:c7bfcaa24de830e29588bb9ad1eb39cebaf07c27149e1974445899b695634bb4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6432
              name: pgbouncer
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          startupProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            # Same path as before, so a pod of the previous ReplicaSet that
            # restarts during the rollout (it reads the new pgbouncer.ini, with
            # auth_query, through its subPath mount) still finds the userlist
            # where it expects it. Without pgbouncer_auth's line it simply
            # cannot use auth_query; every role with a line keeps working.
            - name: pgbouncer-generated
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
              readOnly: true
      volumes:
        - name: pgbouncer-config
          configMap:
            name: pgbouncer-config
        - name: pgbouncer-userlist
          secret:
            secretName: pgbouncer-userlist
        # Synced by the pgbouncer-auth ExternalSecret. Not optional: until
        # intake has written the Vault property, new pods wait in
        # ContainerCreating and the old ones keep serving (maxUnavailable 0).
        - name: pgbouncer-auth
          secret:
            secretName: pgbouncer-auth  # pragma: allowlist secret
        # Synced by the pgbouncer-admin ExternalSecret. Optional: until intake
        # writes the Vault property the volume is empty, the init container
        # writes no admin line, and the admin console stays closed.
        - name: pgbouncer-admin
          secret:
            secretName: pgbouncer-admin  # pragma: allowlist secret
            optional: true
        - name: pgbouncer-generated
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: data
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: enclii
spec:
  ports:
    - port: 6432
      targetPort: 6432
      name: pgbouncer
  selector:
    app: pgbouncer
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
  namespace: data
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: enclii
spec:
  # minAvailable 1 with 2 replicas: a drain can evict one pooler, never both.
  # (maxUnavailable 1 on a single replica protected nothing.)
  minAvailable: 1
  selector:
    matchLabels:
      app: pgbouncer
