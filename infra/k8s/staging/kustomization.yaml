apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enclii-staging

resources:
  - ../base

patchesStrategicMerge:
  - replicas-patch.yaml
  - environment-patch.yaml

configMapGenerator:
  - name: env-config
    literals:
      - ENCLII_ENV=staging
      - ENCLII_LOG_LEVEL=info
      - ENCLII_METRICS_ENABLED=true
      - ENCLII_RATE_LIMIT_REQUESTS_PER_MINUTE=5000

images:
  - name: switchyard-api
    newName: ghcr.io/madfam-org/enclii/switchyard-api
    digest: sha256:18dd93456149e3927ed36f11dc6473a19eccf49211d5deadb91a9aac3f677f94

commonLabels:
  environment: staging
  app.kubernetes.io/part-of: enclii
