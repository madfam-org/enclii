apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enclii-staging

resources:
  - ../base

patchesStrategicMerge:
  - replicas-patch.yaml
  - environment-patch.yaml

configMapGenerator:
  - name: env-config
    literals:
      - ENCLII_ENV=staging
      - ENCLII_LOG_LEVEL=info
      - ENCLII_METRICS_ENABLED=true
      - ENCLII_RATE_LIMIT_REQUESTS_PER_MINUTE=5000

images:
  - name: switchyard-api
    newName: ghcr.io/madfam-org/enclii/switchyard-api
    digest: sha256:d91082dd1cb3b3f2476af15cf3367af2d1a93e8212fde0cd6dd04462100dae9a

commonLabels:
  environment: staging
  app.kubernetes.io/part-of: enclii
