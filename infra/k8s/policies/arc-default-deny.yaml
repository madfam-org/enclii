# =============================================================================
# ARC (Actions Runner Controller) Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for arc-system and arc-runners namespaces.
# arc-system: ARC controller (manages runner scale sets, K8s API access).
# arc-runners: Ephemeral GitHub Actions runner pods (HTTPS to GitHub API).
# Managed by enclii repo; synced by the ArgoCD `network-policies` app
# (infra/argocd/apps/network-policies.yaml, automated + selfHeal) — merges to
# main roll out without a manual kubectl apply.
#
# NOTE (2026-07-06): `runner-egress` below intentionally allows ALL egress on
# 443/80/22/6443 + DNS. There is no host-level allowlist here — sigstore
# (fulcio/rekor/oauth2/tuf-repo-cdn) and GitHub OIDC endpoints are already
# reachable. Cosign keyless failures on the runners are NOT caused by this
# policy; see docs/runbooks/ARC_COSIGN_KEYLESS_SIGNING.md before adding rules.
# =============================================================================

# ---- arc-system namespace ----

# Default deny all ingress to arc-system namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: arc-system
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from arc-system namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: arc-system
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Prometheus -> ARC controller metrics (port 8080)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arc-controller-metrics-ingress
  namespace: arc-system
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gha-rs-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080

# Allow ARC controller egress (DNS + K8s API + HTTPS for GitHub API)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arc-controller-egress
  namespace: arc-system
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gha-rs-controller
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API server for managing runner pods and scale sets
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # HTTPS egress for GitHub API (runner registration, webhook)
    # Port 443 already covered above

# Allow ARC scale-set listener egress (DNS + K8s API + GitHub API)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arc-listener-egress
  namespace: arc-system
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: runner-scale-set-listener
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS for GitHub API and the in-cluster Kubernetes API service
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

# ---- arc-runners namespace ----

# Default deny all ingress to arc-runners namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: arc-runners
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from arc-runners namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: arc-runners
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow runner pods egress (DNS + build internet + Kubernetes API)
# Runners need broad HTTPS access for: GitHub API, GHCR, npm, pip, Go modules, etc.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-egress
  namespace: arc-runners
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTP for package downloads (some registries use HTTP)
    - to: []
      ports:
        - protocol: TCP
          port: 80
    # HTTPS for GitHub API, container registries, package managers
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Kubernetes API for Enclii-provisioned self-deploy jobs
    - to: []
      ports:
        - protocol: TCP
          port: 6443
    # SSH for git operations (port 22)
    - to: []
      ports:
        - protocol: TCP
          port: 22
