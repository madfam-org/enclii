# =============================================================================
# Vault Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the vault namespace.
# Contains: HashiCorp Vault (port 8200)
# Accessed by: enclii (switchyard-api lockbox client), external-secrets (ESO),
#              Selva workers (MADFAM platform-slice tooling only), monitoring
#              (Prometheus), cloudflare-tunnel (Vault UI)
# Managed by enclii repo, applied via kubectl (no ArgoCD app for policies dir).
# =============================================================================

# Default deny all ingress to vault namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vault
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from vault namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: vault
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow enclii namespace -> Vault API (switchyard-api lockbox client)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-ingress-enclii
  namespace: vault
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: enclii
      ports:
        - protocol: TCP
          port: 8200

# Allow external-secrets namespace -> Vault API (ESO ClusterSecretStore)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-ingress-eso
  namespace: vault
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - protocol: TCP
          port: 8200

# Allow Selva worker pods -> Vault API.
#
# NetworkPolicy cannot distinguish tenant-vs-platform tasks inside a shared
# worker deployment. The tighter boundary is enforced above this layer by
# Selva's PLATFORM_ORG_ID/AUDIENCE_FILTER_ENABLED gates and by Vault's
# Kubernetes-auth role/policy. This policy only keeps non-worker pods out of
# the Vault network path.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-ingress-selva-workers
  namespace: vault
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: selva
          podSelector:
            matchLabels:
              app.kubernetes.io/name: workers
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 8200

# Allow monitoring namespace -> Vault API (Prometheus metrics scraping)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-ingress-monitoring
  namespace: vault
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8200

# Allow cloudflare-tunnel namespace -> Vault API (Vault UI access)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-ingress-tunnel
  namespace: vault
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 8200

# Allow vault egress.
#
# Vault mostly behaves as a sink, but the Kubernetes auth method must call the
# API server TokenReview endpoint when validating ESO/Selva service-account
# JWTs. Keep this narrow: DNS plus the in-cluster Kubernetes API service only.
# External production API-server CIDRs are sensitive infrastructure inventory
# and must be supplied by internal-devops overlays, not this public repo.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-egress
  namespace: vault
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
