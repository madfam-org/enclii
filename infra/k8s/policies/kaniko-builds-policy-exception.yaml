---
# Kyverno PolicyException for Roundhouse Kaniko build Jobs and Pods.
#
# Kaniko needs in-container UID 0 to unpack OCI layer ownership and permission
# metadata. The generated Pods remain unprivileged: privileged=false,
# allowPrivilegeEscalation=false, and seccomp RuntimeDefault. Kaniko also needs
# default in-container capabilities such as CAP_CHOWN to unpack OCI layers, so
# it cannot set capabilities.drop: ["ALL"] without failing builds.
apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: kaniko-builds-runasroot
  namespace: enclii-builds
  annotations:
    policies.kyverno.io/description: >-
      Roundhouse Kaniko build Jobs and Pods must run as UID 0 inside the
      container to unpack OCI image layers while remaining host-unprivileged.
    policies.kyverno.io/severity: medium
spec:
  exceptions:
    - policyName: require-run-as-nonroot
      ruleNames:
        - run-as-non-root
    - policyName: restrict-capabilities
      ruleNames:
        - drop-all-capabilities
        - autogen-drop-all-capabilities
  match:
    any:
      - resources:
          kinds:
            - Job
            - Pod
          namespaces:
            - enclii-builds
          names:
            - build-*
            - '*-rebuild-*'
            - kaniko-*
