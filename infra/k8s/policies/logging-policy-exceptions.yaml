# Kyverno PolicyExceptions for Logging namespace
# Fluent Bit requires hostPath mounts (/var/log, /var/lib/docker/containers)
# to collect pod logs. Loki StatefulSet may trigger autogen host-port rules.
# Exceptions are scoped to the logging namespace only.
---
apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: logging-stack
  namespace: logging
spec:
  exceptions:
    - policyName: disallow-host-path
      ruleNames:
        - host-path
        - autogen-host-path
    - policyName: block-host-ports
      ruleNames:
        - deny-host-ports
        - autogen-deny-host-ports
    # fluent-bit must run as root to read the kubelet's 0750 root:root
    # /var/log/pods tree (2026-07-28 loki ingestion blackout; caps stay
    # dropped, rootfs stays read-only).
    - policyName: require-run-as-nonroot
      ruleNames:
        - run-as-non-root
        - autogen-run-as-non-root
  match:
    any:
      - resources:
          namespaces:
            - logging
          kinds:
            - DaemonSet
            - StatefulSet
            - Pod
          names:
            - fluent-bit*
            - loki*
