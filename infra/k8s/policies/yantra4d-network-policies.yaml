# Allow Cloudflare tunnel + nginx proxy -> yantra4d-backend (4d-api.madfam.io)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yantra4d-backend-ingress
  namespace: yantra4d
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: yantra4d-backend
  policyTypes:
    - Ingress
  ingress:
    # Direct access via Cloudflare tunnel (4d-api.madfam.io)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 5000
    # Proxy from nginx landing within namespace
    - from:
        - podSelector:
            matchLabels:
              app: yantra4d-landing
      ports:
        - protocol: TCP
          port: 5000

# Allow yantra4d-landing egress (DNS + proxy to backend within namespace)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yantra4d-landing-egress
  namespace: yantra4d
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: yantra4d-landing
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Proxy to backend within namespace
    - to:
        - podSelector:
            matchLabels:
              app: yantra4d-backend
      ports:
        - protocol: TCP
          port: 5000

# Allow yantra4d-backend egress (DNS + HTTPS + PostgreSQL)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yantra4d-backend-egress
  namespace: yantra4d
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: yantra4d-backend
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS egress for external APIs
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # PostgreSQL in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

