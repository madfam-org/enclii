# =============================================================================
# Yantra4D Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the yantra4d namespace.
# Contains: yantra4d-landing (nginx frontend, cloudflare tunnel, proxies to backend),
#           yantra4d-backend (Python API, PostgreSQL),
#           yantra4d-studio (web app, cloudflare tunnel),
#           yantra4d-admin (admin UI, cloudflare tunnel).
# Managed by enclii repo, applied via kubectl (no ArgoCD app for policies dir).
# =============================================================================

# Default deny all ingress to yantra4d namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: yantra4d
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from yantra4d namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: yantra4d
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Cloudflare tunnel -> yantra4d-landing (4d.madfam.io)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yantra4d-landing-ingress
  namespace: yantra4d
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: yantra4d-landing
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 80

# Allow Cloudflare tunnel -> yantra4d-studio (4d-app.madfam.io)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
