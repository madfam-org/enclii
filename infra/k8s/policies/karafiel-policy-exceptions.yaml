# Kyverno PolicyExceptions for Karafiel namespace
# Karafiel images are cosign-signed by GitHub Actions, but the mutation
# webhook conflicts with ArgoCD sync on the verify-images annotation.
---
apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: karafiel-cosign-exception
  namespace: karafiel
spec:
  exceptions:
    - policyName: verify-image-signatures
      ruleNames:
        - verify-image
        - autogen-verify-image
  match:
    any:
      - resources:
          namespaces:
            - karafiel
          kinds:
            - Deployment
            - Pod
            - ReplicaSet
