# Allow mes-mqtt-bridge egress (DNS + MQTT + PostgreSQL + Redis)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mes-mqtt-bridge-egress
  namespace: pravara-mes
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: mes-mqtt-bridge
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # MQTT broker (standard port 1883, TLS port 8883)
    - to: []
      ports:
        - protocol: TCP
          port: 1883
        - protocol: TCP
          port: 8883
    # HTTPS egress
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # PostgreSQL in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

