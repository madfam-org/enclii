# =============================================================================
# Pravara-MES Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the pravara-mes namespace.
# Contains: pravara-api (Django API, cloudflare tunnel),
#           pravara-ui (Next.js frontend, cloudflare tunnel),
#           pravara-gateway (admin gateway, cloudflare tunnel),
#           pravara-worker (Celery worker),
#           telemetry-worker (telemetry data processor),
#           mes-mqtt-bridge (MQTT bridge for IoT devices),
#           inference-service (ML inference),
#           mes-ha-bridge (Home Assistant bridge).
# Backend services connect to PostgreSQL + Redis in data namespace.
# Managed by enclii repo, applied via kubectl (no ArgoCD app for policies dir).
# =============================================================================

# Default deny all ingress to pravara-mes namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: pravara-mes
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from pravara-mes namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: pravara-mes
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Cloudflare tunnel -> pravara-ui (mes.madfam.io)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pravara-ui-ingress
  namespace: pravara-mes
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: pravara-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 4501

# Allow Cloudflare tunnel -> pravara-api (mes-api.madfam.io)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pravara-api-ingress
  namespace: pravara-mes
  labels:
