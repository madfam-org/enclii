      ports:
        - protocol: TCP
          port: 5432
    # Redis in pravara-mes namespace (local instance)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/part-of: pravara-mes
      ports:
        - protocol: TCP
          port: 6379
    # EMQX MQTT broker in pravara-mes namespace (local instance)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: emqx
              app.kubernetes.io/part-of: pravara-mes
      ports:
        - protocol: TCP
          port: 1883

