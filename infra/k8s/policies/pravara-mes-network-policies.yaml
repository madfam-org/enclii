# =============================================================================
# Egress: Application pods
# =============================================================================

# Allow pravara-api egress (DNS + HTTPS + local PostgreSQL + local Redis + Centrifugo)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pravara-api-egress
  namespace: pravara-mes
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: pravara-api
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS egress for external APIs, OIDC
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # PostgreSQL in pravara-mes namespace (local instance)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/part-of: pravara-mes
      ports:
        - protocol: TCP
          port: 5432
    # Redis in pravara-mes namespace (local instance)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/part-of: pravara-mes
      ports:
        - protocol: TCP
          port: 6379
    # Centrifugo in pravara-mes namespace (real-time push)
    - to:
        - podSelector:
            matchLabels:
              app: centrifugo
      ports:
        - protocol: TCP
          port: 8000

