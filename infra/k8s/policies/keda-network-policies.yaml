# =============================================================================
# KEDA Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the keda namespace.
# Contains: KEDA operator (controller), KEDA metrics API server,
#           KEDA admission webhooks (ScaledObject validation)
# Accessed by: kube-system (API server aggregation + webhook calls),
#              monitoring (Prometheus scraping)
# Internal: metrics-server ↔ operator gRPC on port 9666
# Manages: ScaledObjects across all namespaces (needs K8s API access)
# Managed by enclii repo, applied via kubectl (no ArgoCD app for policies dir).
# =============================================================================

# Default deny all ingress to keda namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from keda namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# KEDA HTTP add-on egress — K8s API server, DNS, and intra-namespace services.
# The add-on operator and external scaler query Kubernetes endpoints and route
# through the interceptor admin/scaler Services. Some CNIs do not treat the
# Kubernetes Service IP as ordinary external ipBlock traffic, so the apiserver
# ports are allowed without a destination selector.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-http-addon-egress
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-add-ons-http
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API service
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Intra-namespace add-on services: scaler gRPC, interceptor admin/proxy,
    # and operator metrics.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9090

# KEDA HTTP add-on ingress — allow add-on components to talk to each other in
# the keda namespace. The external scaler polls the interceptor admin endpoint.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-http-addon-ingress
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-add-ons-http
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9090

# KEDA operator egress — K8s API server, DNS, intra-namespace, and trigger backends
# The operator watches ScaledObjects across all namespaces and manages HPAs,
# so it needs access to the K8s API server on ports 443 and 6443.
# It also connects to trigger backends (e.g. Redis) to check scaling metrics.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-operator-egress
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keda-operator
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API server (manage HPAs, read ScaledObjects, patch Deployments)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Intra-namespace: operator -> metrics server communication and HTTP
    # add-on external scaler gRPC metric polling.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9666
    # Trigger backends: Redis in data namespace (ScaledObject metric polling)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - protocol: TCP
          port: 6379

# KEDA metrics server egress — K8s API server and DNS
# The metrics server registers as an aggregated API and needs API server access.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-metrics-server-egress
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keda-operator-metrics-apiserver
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API server (register aggregated API, read ScaledObjects)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Intra-namespace: metrics server -> operator gRPC communication
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 9666

# Allow kube-system -> KEDA metrics server (API server aggregation layer)
# The K8s API server proxies external.metrics.k8s.io requests to KEDA.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-metrics-ingress-apiserver
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keda-operator-metrics-apiserver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9666

# Allow monitoring namespace -> KEDA operator (Prometheus metrics scraping)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-operator-ingress-monitoring
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keda-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080

# KEDA admission webhooks egress — K8s API server and DNS
# The admission webhook validates ScaledObjects by querying the K8s API.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-admission-webhooks-egress
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keda-admission-webhooks
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API server (validate ScaledObjects, check API group resources)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

# Allow kube-system -> KEDA admission webhooks (API server calls webhook)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-admission-webhooks-ingress
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keda-admission-webhooks
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 443

# Allow intra-namespace ingress to KEDA operator on gRPC port 9666
# The metrics API server calls the operator via gRPC for ScaledObject resolution.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-operator-ingress-grpc
  namespace: keda
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keda-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 9666
