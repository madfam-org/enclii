# Allow roundhouse-api egress (DNS + HTTPS + K8s API + Redis)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roundhouse-api-egress
  namespace: enclii
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: roundhouse-api
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS egress for container registry push (ghcr.io), GitHub API
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # K8s API for build job management
    - to: []
      ports:
        - protocol: TCP
          port: 6443
    # Redis in enclii namespace
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

# Allow roundhouse worker egress (DNS + HTTPS + K8s API + Redis + switchyard-api callbacks)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roundhouse-worker-egress
  namespace: enclii
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: roundhouse
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS egress for container registry, GitHub API
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # K8s API for build job management
    - to: []
      ports:
        - protocol: TCP
          port: 6443
    # Redis in enclii namespace
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Callbacks to switchyard-api
    - to:
        - podSelector:
            matchLabels:
              app: switchyard-api
      ports:
        - protocol: TCP
          port: 4200
