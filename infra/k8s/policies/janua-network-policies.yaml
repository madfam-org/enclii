# =============================================================================
# Janua Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for namespace isolation.
# Janua is the SSO/OIDC provider — network isolation is critical.
# Managed by enclii repo. ArgoCD app `network-policies` syncs this directory
# (infra/k8s/policies) with automated prune and selfHeal, so edits here go
# live on merge and hand-applied drift is reverted.
# =============================================================================

# Default deny all ingress to janua namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: janua
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from janua namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: janua
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Cloudflare tunnel + application namespaces → janua-api (port 8080)
# Uses label selector — any namespace with enclii.dev/type=application gets access
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: janua-api-ingress
  namespace: janua
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: janua-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Browser SSO via Cloudflare tunnel
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
        # Server-side SSO from all application namespaces
        - namespaceSelector:
            matchLabels:
              enclii.dev/type: application
      ports:
        - protocol: TCP
          port: 8080

# Allow monitoring namespace → janua-api metrics listener (port 9464)
# janua-api serves Prometheus text on a dedicated listener (METRICS_PORT 9464,
# GET /metrics only). The public app port 8080 serves no metrics. This is the
# only rule that admits 9464, and it admits only the monitoring namespace
# (main Prometheus and rules-eval), so the tunnel and other namespaces cannot
# reach it.
# Bare namespaceSelector: a from-entry combining namespaceSelector and
# podSelector has rendered as deny-all on this k3s cluster.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: janua-api-ingress-monitoring
  namespace: janua
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: janua-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9464

