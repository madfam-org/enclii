# Allow janua-api egress to data namespace (PostgreSQL + Redis) and DNS + HTTPS
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: janua-api-egress
  namespace: janua
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: janua-api
  policyTypes:
    - Egress
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # PostgreSQL in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # pgbouncer in data namespace — janua's runtime pool routes through
    # transaction pooling (pgbouncer adoption ruling, move 3); without this
    # rule the k3s reject reads as ConnectionRefusedError on the ClusterIP,
    # which is easy to misdiagnose as pgbouncer being down.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: pgbouncer
      ports:
        - protocol: TCP
          port: 6432
    # Redis in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # HTTPS egress for external APIs (email provider, OAuth callbacks)
    - to: []
      ports:
        - protocol: TCP
          port: 443

