# Allow dhanam-api egress to data namespace (PostgreSQL + Redis) and DNS
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dhanam-api-egress
  namespace: dhanam
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: dhanam-api
  policyTypes:
    - Egress
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # PostgreSQL in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # HTTPS egress for external APIs (payment providers, OIDC)
    - to: []
      ports:
        - protocol: TCP
          port: 443

# Allow dhanam-admin egress (DNS + HTTPS for SSO)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dhanam-admin-egress
  namespace: dhanam
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: dhanam-admin
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 443

