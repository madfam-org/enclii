# =============================================================================
# Dhanam Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for namespace isolation.
# Managed by enclii repo, synced via ArgoCD.
# =============================================================================

# Default deny all ingress to dhanam namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dhanam
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from dhanam namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: dhanam
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Cloudflare tunnel → dhanam-api (port 4300)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dhanam-api-ingress
  namespace: dhanam
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: dhanam-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 4300

