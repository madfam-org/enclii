# Allow forgesight-crawler egress (DNS + HTTP + HTTPS for web scraping)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgesight-crawler-egress
  namespace: forgesight
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: forgesight-crawler
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTP for web scraping
    - to: []
      ports:
        - protocol: TCP
          port: 80
    # HTTPS for web scraping
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # PostgreSQL in data namespace (store crawl results)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis in data namespace (crawl queue)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
