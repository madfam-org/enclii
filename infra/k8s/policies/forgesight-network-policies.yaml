# Allow forgesight-api egress (DNS + HTTPS + PostgreSQL + Redis)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgesight-api-egress
  namespace: forgesight
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: forgesight-api
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS egress for external APIs
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # PostgreSQL in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

# Allow forgesight-www egress (DNS only — static site)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgesight-www-egress
  namespace: forgesight
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: forgesight-www
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53

# Allow forgesight-app egress (DNS + HTTPS for SSR API calls)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgesight-app-egress
