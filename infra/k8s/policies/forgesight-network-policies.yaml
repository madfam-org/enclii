# =============================================================================
# Forgesight Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the forgesight namespace.
# Contains: forgesight-api (Python API, PostgreSQL + Redis),
#           forgesight-admin (admin UI, cloudflare tunnel),
#           forgesight-www (static marketing site, cloudflare tunnel),
#           forgesight-app (web application, cloudflare tunnel),
#           forgesight-crawler (web scraper, HTTPS egress only).
# Managed by enclii repo, applied via kubectl (no ArgoCD app for policies dir).
# =============================================================================

# Default deny all ingress to forgesight namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: forgesight
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from forgesight namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: forgesight
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Cloudflare tunnel -> forgesight-www (forgesight.quest, www.forgesight.quest)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgesight-www-ingress
  namespace: forgesight
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: forgesight-www
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 3000

# Allow Cloudflare tunnel -> forgesight-app (app.forgesight.quest)
---
apiVersion: networking.k8s.io/v1
