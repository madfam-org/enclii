# =============================================================================
# Dhanam Namespace ResourceQuota
# =============================================================================
# Protects against "noisy neighbor" resource exhaustion
# Ensures dhanam workloads stay within defined boundaries
# =============================================================================

apiVersion: v1
kind: ResourceQuota
metadata:
  name: dhanam-compute-limit
  namespace: dhanam
  labels:
    app.kubernetes.io/name: dhanam
    app.kubernetes.io/component: resource-quota
    app.kubernetes.io/managed-by: enclii
spec:
  hard:
    # Base: 3.4 CPU / 3Gi across 6 pods (3 services x 2 replicas)
    # Headroom: +6.6 CPU / +9Gi for rolling update surge + future services
    # Previous limits.cpu: 6 caused pods stuck Pending during rolling updates (90% at 5400m)
    requests.cpu: "5"
    limits.cpu: "10"
    requests.memory: 6Gi
    limits.memory: 12Gi
