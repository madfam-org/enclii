# =============================================================================
# Status Pod NetworkPolicies (enclii namespace)
# =============================================================================
# Egress rules for status page pods in the enclii namespace.
# Pods: status-enclii (port 4204), status-madfam (port 4204)
# CronJobs: status-recorder-*, stale-outage-digest-*
# Managed by enclii repo, synced via ArgoCD network-policies Application.
#
# NOTE: The enclii namespace has default-deny egress. Every status CronJob
# that curls an in-namespace status service must be selected by the CronJob
# egress policy below.
# =============================================================================

# Allow status pods egress to DNS, HTTP/HTTPS (service checks), and PostgreSQL
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: status-egress
  namespace: enclii
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - status-enclii
          - status-madfam
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTP (service health checks within cluster)
    - ports:
        - protocol: TCP
          port: 80
    # HTTPS (external service checks + Prometheus)
    - ports:
        - protocol: TCP
          port: 443
    # PostgreSQL in data namespace (status history)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - protocol: TCP
          port: 5432

# Allow status CronJob pods egress to DNS + status service (HTTP)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: status-recorder-egress
  namespace: enclii
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - status-recorder-enclii
          - status-recorder-madfam
          - stale-outage-digest-enclii
          - stale-outage-digest-madfam
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTP to status service within namespace (port 80 via ClusterIP)
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - status-enclii
                  - status-madfam
      ports:
        - protocol: TCP
          port: 4204
