      ports:
        - protocol: TCP
          port: 5432
    # Redis in data namespace (Celery broker)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
