# =============================================================================
# Karafiel Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the karafiel namespace.
# Contains: karafiel-api (Django REST API, cloudflare tunnel + PostgreSQL + Redis),
#           karafiel-web (Next.js frontend, cloudflare tunnel),
#           karafiel-admin (Django admin, cloudflare tunnel),
#           karafiel-beat (Celery beat scheduler),
#           karafiel-worker (Celery worker).
# Managed by enclii repo, applied via kubectl (no ArgoCD app for policies dir).
# =============================================================================

# Default deny all ingress to karafiel namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: karafiel
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from karafiel namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: karafiel
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Cloudflare tunnel -> karafiel-web (kf.madfam.io, kf-app.madfam.io)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: karafiel-web-ingress
  namespace: karafiel
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: karafiel-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 3050

# Allow Cloudflare tunnel -> karafiel-api (kf-api.madfam.io)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: karafiel-api-ingress
  namespace: karafiel
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: karafiel-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 8000

# Allow Cloudflare tunnel -> karafiel-admin (kf-admin.madfam.io)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: karafiel-admin-ingress
  namespace: karafiel
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: karafiel-admin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
