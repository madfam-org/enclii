# =============================================================================
# Janua Namespace ResourceQuota + LimitRange
# =============================================================================
# Protects against resource exhaustion in the Janua SSO namespace
# Ensures janua workloads stay within defined boundaries
# =============================================================================

apiVersion: v1
kind: ResourceQuota
metadata:
  name: janua-compute-limit
  namespace: janua
  labels:
    app.kubernetes.io/name: janua
    app.kubernetes.io/component: resource-quota
    app.kubernetes.io/managed-by: enclii
spec:
  hard:
    # Base: 5 services (api, admin, dashboard, docs, website) x 1-2 replicas
    # Headroom: allows HPA scaling + rolling update surge
    requests.cpu: "6"
    limits.cpu: "12"
    requests.memory: 8Gi
    limits.memory: 16Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: janua-container-limits
  namespace: janua
  labels:
    app.kubernetes.io/name: janua
    app.kubernetes.io/component: limit-range
    app.kubernetes.io/managed-by: enclii
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "4"
        memory: "4Gi"
      min:
        cpu: "10m"
        memory: "16Mi"
