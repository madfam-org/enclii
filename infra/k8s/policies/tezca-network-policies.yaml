# =============================================================================
# Tezca Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the tezca namespace.
# Contains: tezca-web (Django frontend, cloudflare tunnel),
#           tezca-api (Django REST API, cloudflare tunnel),
#           tezca-admin (Django admin, cloudflare tunnel),
#           tezca-beat (Celery beat scheduler),
#           tezca-worker (Celery worker).
# Backend services connect to PostgreSQL in data namespace + tezca-redis in-namespace.
# Managed by enclii repo, applied via kubectl (no ArgoCD app for policies dir).
# =============================================================================

# Default deny all ingress to tezca namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from tezca namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Cloudflare tunnel -> tezca-web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tezca-web-ingress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tezca-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 3000

# Allow Cloudflare tunnel -> tezca-api
---
apiVersion: networking.k8s.io/v1
