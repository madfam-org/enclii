# Allow tezca-beat egress (DNS + PostgreSQL + Redis — no inbound traffic)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tezca-beat-egress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tezca-beat
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis in data namespace (Celery broker)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # tezca-redis in-namespace (Celery broker — beat connects to tezca-redis:6379)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tezca-redis
      ports:
        - protocol: TCP
          port: 6379

