# =============================================================================
# Tezca Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for namespace isolation.
# Tezca is a Django/Next.js application with Elasticsearch, Redis, and Celery.
# Services: tezca-api (8000), tezca-web (3000), tezca-admin (3001),
#           tezca-worker, tezca-beat, tezca-es (9200), tezca-redis (6379)
# Managed by enclii repo, applied via kubectl (no ArgoCD app for policies dir).
# =============================================================================

# Default deny all ingress to tezca namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from tezca namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Cloudflare tunnel -> tezca-api (port 8000)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tezca-api-ingress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tezca-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 8000

