# Allow tezca-api/worker/beat -> tezca-es (Elasticsearch port 9200)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tezca-es-ingress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tezca-es
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - tezca-api
                  - tezca-worker
                  - tezca-beat
      ports:
        - protocol: TCP
          port: 9200

# Allow tezca-api/worker/beat -> tezca-redis (port 6379)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tezca-redis-ingress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tezca-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - tezca-api
                  - tezca-worker
                  - tezca-beat
      ports:
        - protocol: TCP
          port: 6379

# Allow tezca-api/worker/beat egress to data namespace (PostgreSQL), ES, Redis, DNS, HTTPS (R2)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tezca-api-egress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - tezca-api
          - tezca-worker
          - tezca-beat
  policyTypes:
    - Egress
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # PostgreSQL in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Elasticsearch within tezca namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tezca-es
      ports:
        - protocol: TCP
          port: 9200
    # Redis within tezca namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tezca-redis
      ports:
        - protocol: TCP
          port: 6379
    # HTTPS egress for R2 storage, external APIs
    - to: []
      ports:
        - protocol: TCP
          port: 443

# Allow tezca-web/admin egress (DNS + HTTPS for SSR API calls)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tezca-web-egress
  namespace: tezca
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - tezca-web
          - tezca-admin
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 443

