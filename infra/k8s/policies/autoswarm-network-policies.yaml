# =============================================================================
# AutoSwarm Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the autoswarm namespace.
# Contains: nexus-api (FastAPI, port 4300), office-ui (Next.js, port 3000),
#           colyseus (Colyseus room server, port 4303), admin (Next.js, port 3000),
#           gateway (WebSocket gateway, port 4304), workers (background, no port).
# Managed by enclii repo, synced via ArgoCD network-policies Application.
# =============================================================================

# Default deny all ingress to autoswarm namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: autoswarm
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from autoswarm namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: autoswarm
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow all pods -> kube-dns (UDP/TCP 53)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-egress
  namespace: autoswarm
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# Allow Cloudflare tunnel -> nexus-api (agents-api.madfam.io)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexus-api-ingress
  namespace: autoswarm
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nexus-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 4300

