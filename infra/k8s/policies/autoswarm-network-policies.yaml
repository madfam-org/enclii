# Allow intra-namespace ingress to nexus-api from office-ui, admin, colyseus, gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexus-api-internal-ingress
  namespace: autoswarm
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nexus-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: office-ui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: admin
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: colyseus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 4300

