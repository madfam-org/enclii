# Allow nexus-api egress (HTTPS + PostgreSQL via PgBouncer + Redis)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexus-api-egress
  namespace: autoswarm
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nexus-api
  policyTypes:
    - Egress
  egress:
    # HTTPS egress for external APIs, OIDC
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # PgBouncer in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: pgbouncer
      ports:
        - protocol: TCP
          port: 6432
    # Redis in data namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

