# Allow pgbouncer egress to DNS + postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer-egress
  namespace: data
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: pgbouncer
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Connect to postgres
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

# Allow postgres egress (DNS only — database is a sink)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-egress
  namespace: data
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Egress
  egress:
    # DNS — required for any outbound name lookup
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # HTTPS to Cloudflare R2 — pgBackRest sidecar streams WAL + base
    # backups to *.r2.cloudflarestorage.com. Without this, the
    # archive_command silently fails every WAL flush (pg_wal builds
    # up, eventually hits archive-push-queue-max=2GiB and blocks
    # postgres). pgbackrest stanza-create / check / backup also hang
    # waiting for the R2 endpoint TCP handshake.
    - to: []
      ports:
        - protocol: TCP
          port: 443

