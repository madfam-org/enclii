# =============================================================================
# Data Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the shared data namespace.
# Contains: PostgreSQL (5432), PgBouncer (6432), Redis (6379), backup CronJobs.
# Accessed by: enclii, janua, dhanam, tezca, data, forgesight, karafiel,
#              pravara-mes, madfam-site, yantra4d, posthog
# Managed by enclii repo, synced via ArgoCD network-policies Application.
# =============================================================================

# Default deny all ingress to data namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: data
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from data namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: data
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow application namespaces -> PostgreSQL (port 5432)
# When adding a new namespace, add a namespaceSelector entry below AND apply live:
#   kubectl apply -f infra/k8s/policies/data-network-policies.yaml
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: data
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: enclii
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: janua
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dhanam
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tezca
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgesight
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: karafiel
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pravara-mes
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: madfam-site
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: yantra4d
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: posthog
      ports:
        - protocol: TCP
          port: 5432

