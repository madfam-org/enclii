# =============================================================================
# Data Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the shared data namespace.
# Contains: PostgreSQL (5432), PgBouncer (6432), Redis (6379), backup CronJobs.
# Uses label selectors — new namespaces auto-gain access via EnsureNamespace()
# labels (enclii.dev/data-access: "true"). No manual edits needed for onboarding.
# Managed by enclii repo, synced via ArgoCD network-policies Application.
# =============================================================================

# Default deny all ingress to data namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: data
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from data namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: data
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow application namespaces -> PostgreSQL (port 5432)
# Uses label selector — any namespace with enclii.dev/data-access=true gets access
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: data
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              enclii.dev/data-access: "true"
      ports:
        - protocol: TCP
          port: 5432

