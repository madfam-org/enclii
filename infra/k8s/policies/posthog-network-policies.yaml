# =============================================================================
# PostHog Namespace NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the posthog namespace.
# Contains: PostHog web, worker, plugins, ClickHouse, Redpanda.
# Depends on: PostgreSQL (data:5432), Redis (data:6379).
# Accessed by: cloudflare-tunnel (web UI), enclii (API SDK calls).
# Managed by enclii repo, applied via kubectl (no ArgoCD app for policies dir).
# =============================================================================

# Default deny all ingress to posthog namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: posthog
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from posthog namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: posthog
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Cloudflare Tunnel -> PostHog web (UI + API)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress-cloudflare
  namespace: posthog
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: posthog
      role: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 8000

# Allow enclii namespace -> PostHog web (API SDK calls from switchyard)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress-enclii
  namespace: posthog
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: posthog
      role: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: enclii
      ports:
        - protocol: TCP
          port: 8000

# Allow PostHog intra-namespace communication (web <-> worker <-> plugins <-> ClickHouse <-> Redpanda)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intra-namespace
  namespace: posthog
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}

# Allow PostHog pods egress to PostgreSQL (data namespace, port 5432)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-postgres
  namespace: posthog
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

# Allow PostHog pods egress to Redis (data namespace, port 6379)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-redis
  namespace: posthog
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

# Allow all pods egress to kube-dns (port 53 UDP/TCP)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-dns
  namespace: posthog
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# Allow HTTPS egress (443) for external API calls, ClickHouse/Redpanda image pulls,
# and PostHog telemetry/license checks
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-https
  namespace: posthog
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443
