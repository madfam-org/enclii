# =============================================================================
# Monitoring Namespace — Default-Deny NetworkPolicies
# =============================================================================
# Default-deny + explicit allow rules for the monitoring namespace.
# Contains: Prometheus (9090), Grafana (3000), Alertmanager (9093/9094),
#           Node Exporter (9100 via DaemonSet).
# Prometheus scrapes all namespaces; Grafana exposed via Cloudflare tunnel.
# Managed by enclii repo, applied via kubectl (no ArgoCD app for policies dir).
# =============================================================================

# Default deny all ingress to monitoring namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress

# Default deny all egress from monitoring namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress

# Allow Prometheus egress (DNS + K8s API for service discovery + scrape targets)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API server for service discovery (443 and 6443)
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Scrape targets across all namespaces (metrics ports)
    # Switchyard API (4200), Roundhouse (8080), exporters (9090-9200 range),
    # Node exporter (9100), ArgoCD (8082-8084), Kyverno (8000)
    - to: []
      ports:
        - protocol: TCP
          port: 4200
        - protocol: TCP
          port: 4290
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 9121
        - protocol: TCP
          port: 9187
        - protocol: TCP
          port: 2000
    # Alertmanager within namespace
    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - protocol: TCP
          port: 9093

# Allow Prometheus ingress (self-scrape and Grafana data source queries)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    # Grafana queries Prometheus data source
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090

# Allow Grafana ingress from Cloudflare tunnel (port 3000)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 3000

# Allow Grafana egress (DNS + Prometheus + Alertmanager data sources)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Prometheus data source
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # Alertmanager data source
    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - protocol: TCP
          port: 9093

# Allow Alertmanager ingress (Prometheus alerts + peer clustering)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Ingress
  ingress:
    # Prometheus sends alerts
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9093
    # Grafana queries Alertmanager
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9093
    # Alertmanager cluster peer communication
    - from:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - protocol: TCP
          port: 9094

# Allow Alertmanager egress (DNS + SMTP for email notifications + peer clustering)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # SMTP for email notifications (smtp.gmail.com:587)
    - to: []
      ports:
        - protocol: TCP
          port: 587
    # HTTPS for webhook notifications
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Alertmanager cluster peer communication within namespace
    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - protocol: TCP
          port: 9094

# Allow node-exporter ingress from Prometheus
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9100

# Allow node-exporter egress (DNS only)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
