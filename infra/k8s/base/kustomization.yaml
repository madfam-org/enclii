apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # SECURITY NOTE: Using development secrets for local testing only
  # For production, create secrets.yaml from secrets.yaml.TEMPLATE and use:
  #   - Sealed Secrets (recommended)
  #   - External Secrets Operator
  #   - HashiCorp Vault
  # See ../SECRETS_MANAGEMENT.md for details
  - secrets.dev.yaml
  - postgres.yaml
  - redis.yaml
  - rbac.yaml
  - switchyard-api.yaml
  - switchyard-ui.yaml
  - landing-page.yaml
  - docs-site.yaml
  # ingress-nginx.yaml removed — Cloudflare Tunnel handles all production routing
  # Keeping the file for local development reference
  - monitoring.yaml
  - network-policies.yaml
  - kyverno-exceptions/roundhouse-exception.yaml
  # NOTE: external-services-exception.yaml removed - Janua/Dhanam manifests now include proper security contexts

# Note: commonLabels removed - it adds to selectors which are immutable.
# Labels are already defined in individual manifests.

images:
  - name: switchyard-api
    newName: ghcr.io/madfam-org/enclii/switchyard-api
    newTag: latest
  - name: switchyard-ui
    newName: ghcr.io/madfam-org/enclii/switchyard-ui
    newTag: latest
  - name: landing-page
    newName: ghcr.io/madfam-org/enclii/landing-page
    newTag: latest
  - name: docs-site
    newName: ghcr.io/madfam-org/enclii/docs-site
    newTag: latest

namespace: default