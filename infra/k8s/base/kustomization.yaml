apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Production secrets (jwt-secrets + postgres-credentials pointing to data namespace)
  # For local dev, add secrets.dev.yaml and postgres.yaml manually
  - secrets.production.yaml
  - redis.yaml
  - rbac.yaml
  - switchyard-rbac.yaml
  - switchyard-api.yaml
  - switchyard-ui.yaml
  - landing-page.yaml
  - docs-site.yaml
  # ingress-nginx.yaml removed — Cloudflare Tunnel handles all production routing
  # Keeping the file for local development reference
  - roundhouse.yaml
  - waybill.yaml
  - monitoring.yaml
  - network-policies.yaml
  - kyverno-exceptions/roundhouse-exception.yaml
  # NOTE: external-services-exception.yaml removed - Janua/Dhanam manifests now include proper security contexts

# Note: commonLabels removed - it adds to selectors which are immutable.
# Labels are already defined in individual manifests.

# Note: images transformer is intentionally omitted from the base.
# Base manifests use short placeholder names (e.g. image: switchyard-api).
# The production overlay (production/kustomization.yaml) handles the full
# transformation: name → newName (GHCR path) + digest.
# If the base also transforms images, it fires first and changes the name,
# preventing the production overlay's digest transformer from matching.

namespace: default