---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: enclii
type: Opaque
stringData:
  username: postgres
  password: password
  database: enclii_dev
  database-url: "postgres://postgres:password@postgres:5432/enclii_dev?sslmode=require"

---
# Redis Secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: enclii-system
type: Opaque
data:
  # Redis is configured without password for development
  password: ""

