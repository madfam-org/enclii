---
# Public-safe development secret manifest template.
#
# This file is intentionally tracked so local kind/dev clusters have a schema to
# copy from, but it must never contain real, reusable, or scanner-valid secrets.
# Replace every __CHANGE_ME__ value in a private local overlay or through the
# approved secret store before applying.
#
# Production and staging secrets must come from External Secrets Operator,
# Sealed Secrets, or Vault-backed Enclii secret management.

---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: enclii-postgres-dev
  labels:
    app: postgres
    app.kubernetes.io/name: enclii
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: enclii
type: Opaque
stringData:
  username: __CHANGE_ME_LOCAL_ONLY__
  password: __CHANGE_ME_LOCAL_ONLY__
  database: enclii_dev
  database-url: postgresql://__CHANGE_ME_LOCAL_ONLY__:__CHANGE_ME_LOCAL_ONLY__@postgres:5432/enclii_dev

---
# Redis Secret
apiVersion: v1
kind: Secret
metadata:
  name: enclii-redis-dev
  namespace: enclii-dev
type: Opaque
stringData:
  password: __CHANGE_ME_LOCAL_ONLY__

---
# JWT Secret for local token signing
apiVersion: v1
kind: Secret
metadata:
  name: enclii-jwt-dev
  labels:
    app.kubernetes.io/name: enclii
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: enclii
type: Opaque
stringData:
  jwt-secret: __CHANGE_ME_LOCAL_ONLY__
  jwt-issuer: local-dev-only
  private-key-placeholder: __GENERATE_LOCAL_PRIVATE_KEY_OUTSIDE_GIT__

---
# Container Registry Secret
apiVersion: v1
kind: Secret
metadata:
  name: enclii-registry-dev
  namespace: enclii-dev
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: __CHANGE_ME_LOCAL_ONLY__

---
# Application Configuration Secret
apiVersion: v1
kind: Secret
metadata:
  name: enclii-app-dev
  namespace: enclii-dev
type: Opaque
stringData:
  database-url: postgresql://__CHANGE_ME_LOCAL_ONLY__:__CHANGE_ME_LOCAL_ONLY__@postgres:5432/enclii_dev
  redis-url: redis://:__CHANGE_ME_LOCAL_ONLY__@redis:6379/0
  oidc-client-secret: __CHANGE_ME_LOCAL_ONLY__
  registry-url: registry.local.invalid
  build-cache-dir: /tmp/enclii-build-cache

---
# TLS Certificate Secret placeholder
apiVersion: v1
kind: Secret
metadata:
  name: enclii-tls-dev
  namespace: enclii-dev
type: kubernetes.io/tls
stringData:
  tls.crt: __GENERATE_LOCAL_CERT_OUTSIDE_GIT__
  tls.key: __GENERATE_LOCAL_KEY_OUTSIDE_GIT__
