---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-site
  labels:
    app: docs-site
    app.kubernetes.io/name: docs-site
    app.kubernetes.io/component: documentation
    app.kubernetes.io/part-of: enclii
    enclii.dev/managed-by: switchyard
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: docs-site
  template:
    metadata:
      labels:
        app: docs-site
        app.kubernetes.io/name: docs-site
        app.kubernetes.io/component: documentation
        app.kubernetes.io/part-of: enclii
        enclii.dev/managed-by: switchyard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: docs-site
          image: docs-site
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80  # TODO: Rebuild image with nginx-unprivileged to use 8080
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          startupProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docs-site
  labels:
    app: docs-site
spec:
  ports:
    - port: 80
      targetPort: 80  # Container nginx listens on 80 (deployed image uses default nginx, not nginx-unprivileged:8080)
      name: http
  selector:
    app: docs-site
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: docs-site-pdb
  labels:
    app: docs-site
    app.kubernetes.io/name: docs-site
    app.kubernetes.io/part-of: enclii
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: docs-site
