---
# Allow Switchyard API to access database and cache
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switchyard-api-egress
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: switchyard-api
  policyTypes:
  - Egress
  egress:
  # Allow access to DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow access to Postgres in data namespace (cross-namespace)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: data
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow access to Redis in local namespace (enclii)
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow access to Redis in data namespace (cross-namespace, used by roundhouse)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: data
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow Switchyard API to enqueue builds to Roundhouse API. Without this,
  # BuildMode=roundhouse silently falls back to in-process Docker builds in
  # the API pod, which fail in production because Docker is not available.
  - to:
    - podSelector:
        matchLabels:
          app: roundhouse-api
    ports:
    - protocol: TCP
      port: 8080
  # Allow access to Kubernetes API (for reconcilers)
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
# Additive egress for Switchyard API -> Vault (secret intake / lockbox writer).
# Kept separate from switchyard-api-egress (service reconciliation may overwrite it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switchyard-api-vault-egress
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: switchyard-api
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vault
    ports:
    - protocol: TCP
      port: 8200
---
# Additive egress policy for Switchyard API -> Roundhouse API.
# Kept separate from switchyard-api-egress because that policy is also managed
# by service reconciliation and live patches can be overwritten.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switchyard-api-roundhouse-egress
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: switchyard-api
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: roundhouse-api
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080
---
# Additive egress policy for Switchyard API -> Waybill billing API.
# Kept separate from switchyard-api-egress because that policy is also managed
# by service reconciliation and live patches can be overwritten.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switchyard-api-waybill-egress
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: switchyard-api
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: waybill
    ports:
    - protocol: TCP
      port: 8080
---
# Allow ingress traffic to Switchyard API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switchyard-api-ingress
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: switchyard-api
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  # Allow traffic from Cloudflare tunnel
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
    ports:
    - protocol: TCP
      port: 4200
  # Allow traffic from UI pods (when deployed)
  - from:
    - podSelector:
        matchLabels:
          app: switchyard-ui
  # Allow traffic from monitoring (Prometheus)
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 4200
  # Allow Converge Dash to read Enclii observability as an infra source of truth.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: converge-dash
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - converge-api
          - converge-worker
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 4200
---
# Restrict Redis access to Switchyard API + Roundhouse
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [switchyard-api, roundhouse-api, roundhouse]
    ports:
    - protocol: TCP
      port: 6379
---
# Allow ingress to docs-site only from Cloudflare tunnel
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docs-site-ingress
  labels:
    app.kubernetes.io/name: docs-site
    app.kubernetes.io/component: documentation
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: docs-site
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
    ports:
    # Match docs-site containerPort: 80 (nginx serves on :80; rebuild to
    # nginx-unprivileged + 8080 is tracked separately in the Deployment).
    # Previously declared 8080 — every cloudflared→docs-site packet was
    # silently CNI-dropped. NP port lint flagged this 2026-05-05.
    - protocol: TCP
      port: 80
---
# Allow ingress to landing-page only from Cloudflare tunnel
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: landing-page-ingress
  labels:
    app.kubernetes.io/name: landing-page
    app.kubernetes.io/component: marketing
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: landing-page
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
    ports:
    # Match landing-page containerPort: 4204. Previously declared 80 —
    # silent CNI drop. NP port lint flagged this 2026-05-05.
    - protocol: TCP
      port: 4204
---
# Allow ingress to roundhouse only from switchyard-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roundhouse-ingress
  labels:
    app.kubernetes.io/name: roundhouse
    app.kubernetes.io/component: build-system
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: roundhouse-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: switchyard-api
    ports:
    - protocol: TCP
      port: 8080
---
# Additive egress policy for Roundhouse worker -> Switchyard API callbacks.
# Kept separate from generated/service-managed policies so the build-complete
# callback path remains stable even when service reconciliation rewrites the
# broader roundhouse-worker-egress policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roundhouse-switchyard-callback-egress
  labels:
    app.kubernetes.io/name: roundhouse
    app.kubernetes.io/component: build-system
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: roundhouse
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: switchyard-api
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 4200
---
# Additive ingress policy for Switchyard API build-complete callbacks from
# Roundhouse workers. The Switchyard service exposes port 80, which forwards to
# the API pod's container port 4200.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switchyard-api-roundhouse-callback-ingress
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: switchyard-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: roundhouse
    ports:
    - protocol: TCP
      port: 4200
---
# Allow ingress to switchyard-ui only from Cloudflare tunnel
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switchyard-ui-ingress
  labels:
    app.kubernetes.io/name: switchyard-ui
    app.kubernetes.io/component: web-ui
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: switchyard-ui
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
    ports:
    - protocol: TCP
      port: 4201
---
# Allow ingress to waybill from switchyard-api (metrics) and Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waybill-ingress
  labels:
    app.kubernetes.io/name: waybill
    app.kubernetes.io/component: billing
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: waybill
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: switchyard-api
    ports:
    # Match waybill containerPort: 8080. Previously declared 4290 —
    # silent CNI drop. NP port lint flagged this 2026-05-05.
    - protocol: TCP
      port: 8080
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    # Match waybill containerPort: 8080 (named "metrics"). The historical
    # value 4290 referred to a separate metrics port that no longer exists
    # on the pod — Prometheus scrapes were silently CNI-dropped.
    - protocol: TCP
      port: 8080
---
# Waybill egress — DNS and Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waybill-egress
  labels:
    app.kubernetes.io/name: waybill
    app.kubernetes.io/component: billing
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: waybill
  policyTypes:
  - Egress
  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: data
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
---
# Allow ingress to dispatch only from Cloudflare tunnel
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dispatch-ingress
  labels:
    app.kubernetes.io/name: dispatch
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: dispatch
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
    ports:
    - protocol: TCP
      port: 4203
