---
# Image Cleanup CronJob
# Removes unused container images weekly to prevent disk space issues
# Runs every Sunday at 3:00 AM UTC
#
# Note: This runs crictl on the host via hostPID, requires privileged access
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-cleanup
  namespace: kube-system
  labels:
    app.kubernetes.io/name: image-cleanup
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: enclii
spec:
  schedule: "0 3 * * 0"  # Sundays at 3am UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: image-cleanup
        spec:
          hostPID: true
          restartPolicy: OnFailure
          # Run on control-plane node
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: cleanup
              image: rancher/k3s:v1.33.6-k3s1
              command:
                - /bin/sh
                - -c
                - |
                  echo "Starting image cleanup at $(date)"
                  echo "Disk usage before cleanup:"
                  df -h /
                  echo ""
                  echo "Pruning unused images..."
                  crictl rmi --prune 2>/dev/null || echo "Warning: crictl prune failed (may need host access)"
                  echo ""
                  echo "Disk usage after cleanup:"
                  df -h /
                  echo "Cleanup completed at $(date)"
              securityContext:
                privileged: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              volumeMounts:
                - name: host-root
                  mountPath: /host
                  readOnly: false
          volumes:
            - name: host-root
              hostPath:
                path: /
                type: Directory
