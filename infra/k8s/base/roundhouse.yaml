---
# Roundhouse Build Pipeline
# Secure container builds using Kaniko (no Docker socket)
#
# Security features:
# - BUILD_MODE=kaniko uses Kubernetes Jobs instead of Docker-in-Docker
# - No privileged containers
# - No Docker socket access
# - Pod Security Standards compliant (restricted)
# - RBAC scoped to enclii-builds namespace only
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: roundhouse
  namespace: enclii
  labels:
    app.kubernetes.io/name: roundhouse
    app.kubernetes.io/part-of: enclii
---
# RBAC: Allow Roundhouse to create Jobs in the builds namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roundhouse-builder
  namespace: enclii-builds
  labels:
    app.kubernetes.io/name: roundhouse
    app.kubernetes.io/part-of: enclii
rules:
  # Create and monitor build Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Get logs from build pods
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roundhouse-builder
  namespace: enclii-builds
  labels:
    app.kubernetes.io/name: roundhouse
    app.kubernetes.io/part-of: enclii
subjects:
  - kind: ServiceAccount
    name: roundhouse
    namespace: enclii
roleRef:
  kind: Role
  name: roundhouse-builder
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundhouse
  namespace: enclii
  labels:
    app: roundhouse
    app.kubernetes.io/name: roundhouse
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: enclii
    enclii.dev/managed-by: switchyard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: roundhouse
  template:
    metadata:
      labels:
        app: roundhouse
        app.kubernetes.io/name: roundhouse
        app.kubernetes.io/component: build-pipeline
        app.kubernetes.io/part-of: enclii
        enclii.dev/managed-by: switchyard
    spec:
      serviceAccountName: roundhouse
      imagePullSecrets:
        - name: ghcr-credentials
      # Security context - non-privileged
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Avoid GPU nodes
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu
                    operator: DoesNotExist
      containers:
        - name: roundhouse-worker
          image: roundhouse
          imagePullPolicy: Always
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Build mode: Use Kaniko for secure rootless builds
            - name: BUILD_MODE
              value: "kaniko"
            # Redis connection
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
            # Container registry
            - name: REGISTRY
              value: "ghcr.io/madfam-org"
            - name: REGISTRY_USER
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: username
                  optional: true
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: password
                  optional: true
            # Kaniko-specific settings
            - name: KANIKO_CACHE_REPO
              value: "ghcr.io/madfam-org/cache"
            - name: KANIKO_GIT_CREDENTIALS
              value: "git-credentials"
            # Callback to Switchyard API
            - name: SWITCHYARD_INTERNAL_URL
              value: "http://switchyard-api:4200"
            - name: SWITCHYARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: enclii-secrets
                  key: internal-api-key
                  optional: true
            # Build settings
            - name: MAX_CONCURRENT_BUILDS
              value: "3"
            - name: BUILD_TIMEOUT
              value: "30m"
            - name: GENERATE_SBOM
              value: "true"  # SBOM generation using Syft
            - name: SIGN_IMAGES
              value: "true"  # Image signing using Cosign
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Worker process health monitoring
          startupProbe:
            exec:
              command: ["pgrep", "-f", "roundhouse"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f roundhouse"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # No volume mounts needed for Kaniko mode
          # Builds happen in separate Jobs, not in this pod
      # No volumes needed for Kaniko mode
      volumes: []
---
# Roundhouse API Deployment
# HTTP API that receives build requests from Switchyard and enqueues to Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundhouse-api
  namespace: enclii
  labels:
    app: roundhouse-api
    app.kubernetes.io/name: roundhouse-api
    app.kubernetes.io/component: build-api
    app.kubernetes.io/part-of: enclii
    enclii.dev/managed-by: switchyard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: roundhouse-api
  template:
    metadata:
      labels:
        app: roundhouse-api
        app.kubernetes.io/name: roundhouse-api
        app.kubernetes.io/component: build-api
        app.kubernetes.io/part-of: enclii
        enclii.dev/managed-by: switchyard
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roundhouse-api
          image: roundhouse
          # Override the default entrypoint to run the API binary
          command: ["/usr/local/bin/roundhouse-api"]
          imagePullPolicy: Always
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
            - name: API_PORT
              value: "8080"
            - name: SWITCHYARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: enclii-secrets
                  key: internal-api-key
                  optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service for Roundhouse API
apiVersion: v1
kind: Service
metadata:
  name: roundhouse
  namespace: enclii
  labels:
    app.kubernetes.io/name: roundhouse
    app.kubernetes.io/part-of: enclii
spec:
  selector:
    app: roundhouse-api
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
# PodDisruptionBudget for roundhouse-api
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: roundhouse-api
  namespace: enclii
  labels:
    app: roundhouse-api
    app.kubernetes.io/name: roundhouse-api
    app.kubernetes.io/part-of: enclii
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: roundhouse-api
