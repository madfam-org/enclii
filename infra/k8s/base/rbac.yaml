---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: switchyard-api
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: enclii
---
# RBAC permissions tightened based on actual code usage analysis:
# - ConfigMaps: cluster inventory reads plus initial-bootstrap receipt creates
# - Secrets: lifecycle access for deployment env var injection
# - Removed: replicasets write access (only list/watch needed for rollback)
# - Added: persistentvolumeclaims (used by volume management)
# - Added: namespace delete (used by webhook_handlers.go)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: switchyard-api
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: enclii
rules:
# Platform inventory reads; the console has no cluster credentials.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["longhorn.io"]
  resources: ["replicas"]
  verbs: ["get", "list", "watch"]
# Namespaces: create for new projects/environments, get/list/watch for queries, delete for cleanup,
# patch for audited ops (cosign namespace labels)
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["create", "get", "list", "watch", "patch", "delete"]
# Deployments: full lifecycle management for service deployments
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
# ReplicaSets: read-only for rollback (finding previous image versions)
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
# StatefulSets/DaemonSets: `enclii ops pods restart` rollout restarts. The only
# write is kubectl rollout restart's patch of the pod-template annotation
# kubectl.kubernetes.io/restartedAt; Deployments use the rule above, which is
# already cluster-wide. RBAC cannot express the namespace allowlist without one
# Role per namespace, so the API enforces it: ENCLII_OPS_RESTART_NAMESPACES,
# never kube-*, platform_admin rank only.
- apiGroups: ["apps"]
  resources: ["statefulsets", "daemonsets"]
  verbs: ["get", "patch"]
# Services: full lifecycle management for service networking
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
# Read-only Service backend observations for the platform-rank inventory API.
# No endpoint writes, pod exec or network-policy changes are granted.
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list"]
# ConfigMaps: hostname inventory reads for domain truth reconciliation
# create: the fixed initial-bootstrap Job retains its immutable intent and
# result receipts as ConfigMaps in the project addon namespace
# (isolated_initial_job.go / isolated_initial_receipt.go). No update/delete.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create"]
# Pods: read-only + logs for monitoring and debugging
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Pods: `enclii ops pods restart pod/<name>` deletes ONE pod owned by a
# ReplicaSet, StatefulSet or DaemonSet, with a UID precondition and the pod's
# own grace period, so its controller recreates it (the StatefulSet
# OrderedReady case). Same API-side allowlist and rank as above.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
# PersistentVolumeClaims: volume management for stateful services
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["create", "get", "list", "watch", "update", "delete"]
# PersistentVolumes: read-only storage diagnostics for Enclii ops
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch"]
# StorageClasses: Longhorn GA manifest reconcile (ops.storage.storageclass-apply)
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "create"]
# Ingresses: custom domain and routing management
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
# NetworkPolicies: security isolation for service namespaces
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
# Secrets: env var injection for deployments
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
# Argo Applications: GitOps status/drift diagnostics plus audited sync, retire, and runtime onboarding
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
# ExternalSecrets: secret reconciliation diagnostics plus audited refresh requests
- apiGroups: ["external-secrets.io"]
  resources: ["externalsecrets"]
  verbs: ["get", "list", "watch", "patch"]
# CloudNativePG clusters: managed Postgres addon lifecycle
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
# CloudNativePG backups (2026-10-26). The provisioner and the reconciler's
# backup sweep create each addon's daily ScheduledBackup, and Deprovision
# deletes it; before this rule every one of those calls was refused, so no
# addon could have had a schedule even with the store configured. patch: the
# sweep suspends the schedule of a hibernated cluster and resumes it on wake.
# CNPG creates Backup objects from the schedule. delete (2026-11-01): the sweep
# deletes a Backup of an Enclii schedule stuck in walArchivingFailing once WAL
# archiving is healthy again, because CNPG never ends that phase and the
# schedule takes no other backup until it goes. Audited, UID-preconditioned
# (internal/addons/postgres_backup.go, clearWedgedBackups).
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["scheduledbackups"]
  verbs: ["create", "get", "list", "watch", "patch", "delete"]
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["backups"]
  verbs: ["get", "list", "watch", "delete"]
# Longhorn: read diagnostics plus audited orphan prune and CPU settings apply
- apiGroups: ["longhorn.io"]
  resources: ["volumes"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["longhorn.io"]
  resources: ["settings"]
  verbs: ["get", "list", "watch", "patch"]
# Policy reports and exceptions: read-only governance diagnostics for Enclii ops
- apiGroups: ["wgpolicyk8s.io"]
  resources: ["policyreports"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kyverno.io"]
  resources: ["policyexceptions"]
  verbs: ["get", "list", "watch"]
# The fixed initial-bootstrap Job proves its namespace enforces signed images
# by reading this one ClusterPolicy before admission (isolated_initial_job.go).
# Read-only, and limited to that single object.
- apiGroups: ["kyverno.io"]
  resources: ["clusterpolicies"]
  resourceNames: ["verify-image-signatures"]
  verbs: ["get"]
# ARC runner sets: read-only CI runner diagnostics for Enclii ops
- apiGroups: ["actions.github.com"]
  resources: ["autoscalingrunnersets"]
  verbs: ["get", "list", "watch"]
# Batch jobs: service-managed CronJobs plus Enclii-first audited run-once triggers
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
# update: the initial-bootstrap Job is created suspended and activated once
# by a single conditional update (isolated_initial_job.go).
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: switchyard-api
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: enclii
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: switchyard-api
subjects:
- kind: ServiceAccount
  name: switchyard-api
  namespace: enclii
