---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waybill
  labels:
    app: waybill
    app.kubernetes.io/name: waybill
    app.kubernetes.io/component: billing
    app.kubernetes.io/part-of: enclii
    enclii.dev/managed-by: switchyard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: waybill
  template:
    metadata:
      labels:
        app: waybill
        app.kubernetes.io/name: waybill
        app.kubernetes.io/component: billing
        app.kubernetes.io/part-of: enclii
        enclii.dev/managed-by: switchyard
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: waybill
          image: waybill
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: waybill-secrets
                  key: DATABASE_URL
            # The service key every caller presents on /internal and /api/v1.
            # NOT optional, on purpose: Waybill refuses to start without it,
            # and a missing key here holds the new pod in
            # CreateContainerConfigError while the running one keeps serving.
            # Projected into enclii-secrets by the waybill-internal-api-key
            # ExternalSecret from intake target enclii/waybill-internal-api-key
            # (docs/runbooks/SECRET_INTAKE.md). The callers read the same key:
            # switchyard-api (ENCLII_WAYBILL_INTERNAL_API_KEY), the Roundhouse
            # worker (WAYBILL_API_KEY) and Weighbridge (monitoring namespace).
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: enclii-secrets
                  key: waybill-internal-api-key
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: waybill-pdb
  labels:
    app: waybill
    app.kubernetes.io/name: waybill
    app.kubernetes.io/part-of: enclii
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: waybill
