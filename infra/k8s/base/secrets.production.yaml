# PostgreSQL credentials pointing at the REAL production database (data namespace)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: enclii
type: Opaque
stringData:
  username: enclii
  password: TempPassword123
  database: enclii
  database-url: "postgres://enclii:TempPassword123@postgres-0.postgres.data.svc.cluster.local:5432/enclii?sslmode=disable"
