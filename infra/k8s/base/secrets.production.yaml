# Production Secrets — TEMPLATE STUBS ONLY
# ==========================================
#
# WARNING: This file contains PLACEHOLDER values only.
# It exists so that ArgoCD can manage the Secret objects (keeping them in the
# desired-state manifest set), while the REAL secret data is applied directly
# on the cluster via `kubectl create secret`.
#
# ArgoCD's `ignoreDifferences` for Secret .data/.stringData (configured in
# project-appset.yaml) ensures that cluster-side values are never overwritten
# by these stubs during sync.
#
# --- OPERATOR INSTRUCTIONS ---
#
# To set or rotate secrets on the cluster:
#
#   # JWT signing key (RS256):
#   openssl genrsa -out /tmp/jwt-private.pem 2048
#   kubectl -n enclii create secret generic jwt-secrets \
#     --from-literal=jwt-secret="$(openssl rand -hex 32)" \
#     --from-literal=jwt-issuer="enclii-production" \
#     --from-file=private-key=/tmp/jwt-private.pem \
#     --dry-run=client -o yaml | kubectl apply -f -
#   rm /tmp/jwt-private.pem
#
#   # PostgreSQL credentials:
#   kubectl -n enclii create secret generic postgres-credentials \
#     --from-literal=username="enclii" \
#     --from-literal=password="<ROTATED_PASSWORD>" \
#     --from-literal=database="enclii" \
#     --from-literal=database-url="postgres://enclii:<ROTATED_PASSWORD>@postgres.data.svc.cluster.local:5432/enclii?sslmode=disable" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# See docs/security/SECRET_ROTATION_LOG.md for the rotation history and procedure.
# ==========================================
---
# JWT Secret for token signing (referenced by switchyard-api.yaml env vars)
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secrets
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: enclii
type: Opaque
# Secret data is intentionally omitted. Real values are managed in-cluster and
# must not be represented as Git placeholders, because Argo syncs can otherwise
# overwrite the production signing key with invalid data.
---
# PostgreSQL credentials pointing at the production database (data namespace)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: enclii
type: Opaque
# Secret data is intentionally omitted. Real values are managed in-cluster and
# must not be represented as Git placeholders.
