---
# Ecosystem service-auth bridge
#
# Source of truth:
#   enclii/ecosystem-service-auth
#
# This is intentionally narrow and create-or-merge. It declaratively maintains the
# cross-service auth keys required for Dhanam <-> Cotiza plus the Cotiza runtime
# keys needed after the target Secret was recreated during Vault/ESO recovery.
# creationPolicy=Orphan lets ESO create missing targets during zero-touch
# provisioning without ownerRef-pruning them.
#
# TODO(ops): move the source Secret to Vault/Janua Lockbox once a write-capable
# Vault service role is available for this path. The target ExternalSecrets can
# then switch from `kubernetes-store` to `vault-store` without changing the
# consuming workloads.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dhanam-ecosystem-service-auth
  namespace: dhanam
  labels:
    app.kubernetes.io/name: dhanam-ecosystem-service-auth
    app.kubernetes.io/component: service-auth
    app.kubernetes.io/part-of: madfam-ecosystem
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: ClusterSecretStore
  target:
    name: dhanam-secrets
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: COTIZA_WEBHOOK_SECRET
      remoteRef:
        key: ecosystem-service-auth
        property: cotiza_webhook_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: FEDERATION_API_TOKEN
      remoteRef:
        key: ecosystem-service-auth
        property: dhanam_federation_api_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

---
