---
# Ecosystem service-auth bridge
#
# Source of truth:
#   enclii/ecosystem-service-auth
#
# This is intentionally narrow. It declaratively maintains the cross-service auth
# keys required for Dhanam <-> Cotiza plus the Cotiza runtime keys needed after
# the target Secret was recreated during Vault/ESO recovery.
#
# creationPolicy MUST be Merge on any target that more than one ExternalSecret
# writes. ESO has no create-if-missing-AND-merge policy: Owner and Orphan both
# reconcile the target's data down to exactly the keys THAT ES produces, so a
# 2-key Orphan writer wipes every other writer's keys on each 15m refresh. That
# is what caused the 2026-06-13 dhanam-secrets incident, and it was still
# happening on 2026-08-06: dhanam-secrets cycled 23 keys -> 10 -> 23 as this ES
# reset it to 2 keys, -extended re-merged 10, then core re-merged 13 ~2.5min
# later. Any pod starting inside that window came up with no DATABASE_URL and
# CrashLooped. Measured at 1-in-6 samples over 42 minutes.
#
# The consequence of Merge is that the target Secret must PRE-EXIST (all three
# dhanam writers are now Merge). deletionPolicy: Retain keeps it alive; when
# provisioning a brand-new namespace, create an empty dhanam-secrets first.
#
# TODO(ops): move the source Secret to Vault/Janua Lockbox once a write-capable
# Vault service role is available for this path. The target ExternalSecrets can
# then switch from `kubernetes-store` to `vault-store` without changing the
# consuming workloads.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dhanam-ecosystem-service-auth
  namespace: dhanam
  labels:
    app.kubernetes.io/name: dhanam-ecosystem-service-auth
    app.kubernetes.io/component: service-auth
    app.kubernetes.io/part-of: madfam-ecosystem
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: ClusterSecretStore
  target:
    name: dhanam-secrets
    # Merge, never Orphan/Owner: dhanam-secrets is also written by the dhanam
    # repo's `dhanam-secrets` (13 keys) and `dhanam-secrets-extended` (10 keys).
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: COTIZA_WEBHOOK_SECRET
      remoteRef:
        key: ecosystem-service-auth
        property: cotiza_webhook_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: FEDERATION_API_TOKEN
      remoteRef:
        key: ecosystem-service-auth
        property: dhanam_federation_api_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: digifab-quoting-dhanam-auth
  namespace: digifab-quoting
  labels:
    app.kubernetes.io/name: digifab-quoting-dhanam-auth
    app.kubernetes.io/component: service-auth
    app.kubernetes.io/part-of: madfam-ecosystem
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: ClusterSecretStore
  target:
    name: digifab-quoting-secrets
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: ecosystem-service-auth
        property: digifab_database_url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: REDIS_URL
      remoteRef:
        key: ecosystem-service-auth
        property: digifab_redis_url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: JWT_SECRET
      remoteRef:
        key: ecosystem-service-auth
        property: digifab_jwt_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: S3_BUCKET
      remoteRef:
        key: ecosystem-service-auth
        property: digifab_s3_bucket
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: DHANAM_API_URL
      remoteRef:
        key: ecosystem-service-auth
        property: digifab_dhanam_api_url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: DHANAM_API_TOKEN
      remoteRef:
        key: ecosystem-service-auth
        property: dhanam_federation_api_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: DHANAM_BILLING_SECRET
      remoteRef:
        key: ecosystem-service-auth
        property: cotiza_webhook_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: DHANAM_WEBHOOK_URL
      remoteRef:
        key: ecosystem-service-auth
        property: digifab_dhanam_webhook_url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: DHANAM_WEBHOOK_SECRET
      remoteRef:
        key: ecosystem-service-auth
        property: cotiza_webhook_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
