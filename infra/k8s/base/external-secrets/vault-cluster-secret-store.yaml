---
# External Secrets Operator - Vault ClusterSecretStore
# Provides centralized secret management via HashiCorp Vault
#
# Prerequisites:
# 1. Vault deployed and initialized (infra/argocd/apps/vault.yaml)
# 2. Vault Kubernetes auth method enabled:
#      vault auth enable kubernetes
#      vault write auth/kubernetes/config \
#        kubernetes_host="https://kubernetes.default.svc:443"
# 3. ESO reader policy created in Vault:
#      vault policy write eso-reader - <<EOF
#      path "secret/data/*" {
#        capabilities = ["read"]
#      }
#      EOF
# 4. Kubernetes auth role created:
#      vault write auth/kubernetes/role/eso-reader \
#        bound_service_account_names=external-secrets \
#        bound_service_account_namespaces=external-secrets \
#        audience=vault \
#        policies=eso-reader \
#        ttl=1h
#
# Usage:
# Create ExternalSecret resources referencing store: vault-store
# See docs/infrastructure/SECRETS_MANAGEMENT.md for examples

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-store
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secrets-management
    app.kubernetes.io/managed-by: enclii
spec:
  provider:
    vault:
      # Vault server address (cluster-internal DNS)
      server: "http://vault.vault.svc.cluster.local:8200"
      # KV v2 secrets engine path
      path: "secret"
      version: "v2"
      # Kubernetes auth method (service account token exchange)
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-reader"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences:
              - vault
