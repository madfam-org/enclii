---
# External Secrets Operator - Vault ClusterSecretStore
# Provides centralized secret management via HashiCorp Vault
#
# Prerequisites:
# 1. Vault deployed and initialized (infra/argocd/apps/vault.yaml)
# 2. Vault Kubernetes auth method enabled and configured with a token reviewer
#    (secret vault/vault-token-reviewer) — see
#    enclii/scripts/repair-vault-eso-auth.sh
# 3. vault-egress NetworkPolicy must allow the REAL apiserver endpoint
#    (post-DNAT), not just the ClusterIP — see
#    infra/k8s/policies/vault-network-policies.yaml
# 4. ESO reader policy + kubernetes auth role eso-reader bound to
#    external-secrets/external-secrets with audience "vault"
#
# History: between the 2026-05-18 Vault rebootstrap and 2026-07-15 this store
# used a static eso-reader token bridge because the Vault pod could not reach
# the Kubernetes API for TokenReview (post-DNAT NetworkPolicy miss). Fixed and
# verified 2026-07-15; a periodic fallback token remains in
# external-secrets/vault-eso-token (weekly-renewed by the
# vault-eso-token-renew CronJob) as break-glass.
#
# Usage:
# Create ExternalSecret resources referencing store: vault-store
# See docs/infrastructure/SECRETS_MANAGEMENT.md for examples

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-store
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secrets-management
    app.kubernetes.io/managed-by: enclii
spec:
  provider:
    vault:
      # Vault server address (cluster-internal DNS)
      server: "http://vault.vault.svc.cluster.local:8200"
      # KV v2 secrets engine path
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-reader
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences:
              - vault
