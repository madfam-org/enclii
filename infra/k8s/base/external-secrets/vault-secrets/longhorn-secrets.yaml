apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: longhorn-secrets
  namespace: longhorn-system
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: longhorn-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: BACKUP_TARGET_CREDENTIAL_SECRET
      remoteRef:
        key: secret/longhorn-system
        property: backup_target_credential_secret
