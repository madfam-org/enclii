apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgesight-secrets
  namespace: forgesight
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: forgesight-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/forgesight
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/forgesight
        property: redis_url
    - secretKey: SECRET_KEY
      remoteRef:
        key: secret/forgesight
        property: secret_key
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: secret/forgesight
        property: oidc_client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: secret/forgesight
        property: oidc_client_secret
    - secretKey: SCRAPER_API_KEY
      remoteRef:
        key: secret/forgesight
        property: scraper_api_key
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: secret/forgesight
        property: r2_access_key_id
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/forgesight
        property: r2_secret_access_key
    - secretKey: POSTHOG_API_KEY
      remoteRef:
        key: secret/forgesight
        property: posthog_api_key
