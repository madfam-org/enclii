apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pravara-mes-secrets
  namespace: pravara-mes
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: pravara-mes-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: secret/pravara-mes
        property: postgres_user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/pravara-mes
        property: postgres_password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: secret/pravara-mes
        property: postgres_db
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/pravara-mes
        property: redis_url
    - secretKey: SECRET_KEY
      remoteRef:
        key: secret/pravara-mes
        property: secret_key
    - secretKey: CENTRIFUGO_API_KEY
      remoteRef:
        key: secret/pravara-mes
        property: centrifugo_api_key
    - secretKey: CENTRIFUGO_TOKEN_SECRET
      remoteRef:
        key: secret/pravara-mes
        property: centrifugo_token_secret
    - secretKey: MQTT_USERNAME
      remoteRef:
        key: secret/pravara-mes
        property: mqtt_username
    - secretKey: MQTT_PASSWORD
      remoteRef:
        key: secret/pravara-mes
        property: mqtt_password
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: secret/pravara-mes
        property: oidc_client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: secret/pravara-mes
        property: oidc_client_secret
