apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: karafiel-secrets
  namespace: karafiel
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: karafiel-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/karafiel
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/karafiel
        property: redis_url
    - secretKey: SECRET_KEY
      remoteRef:
        key: secret/karafiel
        property: secret_key
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: secret/karafiel
        property: oidc_client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: secret/karafiel
        property: oidc_client_secret
    - secretKey: OIDC_ISSUER
      remoteRef:
        key: secret/karafiel
        property: oidc_issuer
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: secret/karafiel
        property: stripe_secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: secret/karafiel
        property: stripe_webhook_secret
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: secret/karafiel
        property: r2_access_key_id
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/karafiel
        property: r2_secret_access_key
    - secretKey: R2_ENDPOINT
      remoteRef:
        key: secret/karafiel
        property: r2_endpoint
    - secretKey: POSTHOG_API_KEY
      remoteRef:
        key: secret/karafiel
        property: posthog_api_key
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: secret/karafiel
        property: django_secret_key
    - secretKey: CELERY_BROKER_URL
      remoteRef:
        key: secret/karafiel
        property: celery_broker_url
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: secret/karafiel
        property: smtp_password
    # ── Dhanam credit metering (Phase 2 monetization) ──
    # Companion to madfam-org/karafiel feat/dhanam-metering, which adds
    # the metering client + 17 unit tests AND the same two keys to
    # karafiel's own infra/k8s/production/api-external-secret.yaml —
    # that file is the canonical ExternalSecret ArgoCD actually deploys
    # (see infra/argocd/projects/karafiel/config.json: manifestPath is
    # the karafiel repo, not enclii). This stanza keeps the enclii-side
    # mirror in sync so a future migration to enclii-managed manifests
    # doesn't have to backfill.
    #
    # TODO(ops): populate the Vault paths before either PR merges.
    # Use `vault kv put secret/karafiel` with two fields:
    #   dhanam_api_url       set to the prod base URL (api.dhan.am/v1)
    #   dhanam_billing_webhook_secret   read from Dhanam's own vault
    #     entry at secret/dhanam (field: billing_webhook_secret)
    # The webhook value MUST equal Dhanam's BILLING_WEBHOOK_SECRET
    # exactly — rotate the two together or every karafiel→Dhanam
    # metering POST will 401 at the HMAC guard.
    - secretKey: DHANAM_API_URL
      remoteRef:
        key: secret/karafiel
        property: dhanam_api_url
    - secretKey: DHANAM_BILLING_WEBHOOK_SECRET
      remoteRef:
        key: secret/karafiel
        property: dhanam_billing_webhook_secret
