apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: selva-secrets
  namespace: selva
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: selva-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/selva
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/selva
        property: redis_url
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: secret/selva
        property: openai_api_key
