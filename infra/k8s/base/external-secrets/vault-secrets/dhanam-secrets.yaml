# Core Dhanam financial + auth secrets (Vault → dhanam-secrets).
# Extended keys (Metamap, SMTP, Banxico, …) live in dhanam-secrets-extended.yaml.
# Optional/deferred keys (R2, Cloudflare, Sentry, SendGrid) intentionally omitted —
# see internal-devops/runbooks/2026-06-16-dhanam-secrets-recovery-session.md
# Last Updated: 2026-06-16
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dhanam-secrets
  namespace: dhanam
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: dhanam-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/dhanam
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/dhanam
        property: redis_url
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/dhanam
        property: jwt_secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: secret/dhanam
        property: jwt_refresh_secret
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: secret/dhanam
        property: oidc_client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: secret/dhanam
        property: oidc_client_secret
    - secretKey: OIDC_ISSUER
      remoteRef:
        key: secret/dhanam
        property: oidc_issuer
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: secret/dhanam
        property: stripe_secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: secret/dhanam
        property: stripe_webhook_secret
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: secret/dhanam
        property: encryption_key
    - secretKey: POSTHOG_API_KEY
      remoteRef:
        key: secret/dhanam
        property: posthog_api_key
