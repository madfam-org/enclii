apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: madfam-site-secrets
  namespace: madfam-site
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: madfam-site-secrets
    # Merge (not Owner): madfam-cms/madfam-web envFrom this secret; Merge
    # guarantees operator-added keys survive syncs.
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/madfam-site
        property: database_url
    - secretKey: PAYLOAD_SECRET
      remoteRef:
        key: secret/madfam-site
        property: payload_secret
    - secretKey: SESSION_SECRET
      remoteRef:
        key: secret/madfam-site
        property: session_secret
    - secretKey: NEXT_PUBLIC_POSTHOG_KEY
      remoteRef:
        key: secret/madfam-site
        property: next_public_posthog_key
    # Canonical Resend — secret/comms. See decisions/2026-06-16-platform-comms-and-dhanam-secret-custody.md
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: secret/comms
        property: resend_api_key
