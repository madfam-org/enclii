apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: madfam-site-secrets
  namespace: madfam-site
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: madfam-site-secrets
    # Merge, not Owner: the live secret holds DATABASE_URL and PAYLOAD_SECRET
    # (envFrom-required by madfam-cms and madfam-web) which have no Vault home —
    # secret/madfam-site does not exist and its path is not in the
    # switchyard-secret-writer policy (root-token gated). Owner would wipe them
    # on first successful sync and take the site down.
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    # Only map properties that exist. secret/madfam-site is entirely absent in
    # Vault; restore the mappings below once the operator has extended the
    # writer policy and backfilled the path:
    #   next_public_posthog_key -> NEXT_PUBLIC_POSTHOG_KEY
    #   session_secret          -> SESSION_SECRET
    # plus new homes for the live-only DATABASE_URL / PAYLOAD_SECRET.
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: secret/comms
        property: resend_api_key
