apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: madfam-site-secrets
  namespace: madfam-site
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: madfam-site-secrets
    # Merge (not Owner): madfam-web envFrom this secret; Merge
    # guarantees operator-added keys survive syncs. PAYLOAD_SECRET (madfam-cms
    # retired, ruling R52) and NEXT_PUBLIC_POSTHOG_KEY (no PostHog code in
    # madfam-site) were dropped on 2026-10-01; Merge leaves already-synced
    # keys in the live Secret until an operator removes them.
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/madfam-site
        property: database_url
    - secretKey: SESSION_SECRET
      remoteRef:
        key: secret/madfam-site
        property: session_secret
    # Canonical Resend — secret/comms. See decisions/2026-06-16-platform-comms-and-dhanam-secret-custody.md
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: secret/comms
        property: resend_api_key
