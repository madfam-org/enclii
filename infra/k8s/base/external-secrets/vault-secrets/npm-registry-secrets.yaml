apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: npm-registry-secrets
  namespace: npm-registry
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: npm-registry-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: HTPASSWD
      remoteRef:
        key: secret/npm-registry
        property: htpasswd
