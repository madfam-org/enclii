apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: janua-secrets
  namespace: janua
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: janua-secrets
    # Merge (not Owner): keeps operator break-glass keys (e.g. metrics-token)
    # from being wiped on sync. ESO only manages the keys mapped below.
    creationPolicy: Merge
    deletionPolicy: Retain
  # secretKey names match janua-api env refs (lowercase-dashed).
  data:
    - secretKey: database-url
      remoteRef:
        key: secret/janua
        property: database_url
    - secretKey: redis-url
      remoteRef:
        key: secret/janua
        property: redis_url
    - secretKey: secret-key
      remoteRef:
        key: secret/janua
        property: secret_key
    - secretKey: field-encryption-key
      remoteRef:
        key: secret/janua
        property: field_encryption_key
    - secretKey: jwt-secret
      remoteRef:
        key: secret/janua
        property: jwt_secret
    - secretKey: jwt-private-key
      remoteRef:
        key: secret/janua
        property: jwt_private_key
    - secretKey: jwt-public-key
      remoteRef:
        key: secret/janua
        property: jwt_public_key
    - secretKey: dhanam-webhook-secret
      remoteRef:
        key: secret/janua
        property: dhanam_webhook_secret
    - secretKey: oauth-github-client-id
      remoteRef:
        key: secret/janua
        property: oauth_github_client_id
    - secretKey: oauth-github-client-secret
      remoteRef:
        key: secret/janua
        property: oauth_github_client_secret
    - secretKey: internal-api-key
      remoteRef:
        key: secret/janua
        property: internal_api_key
    # Fan-out from platform comms — same org Resend account
    - secretKey: resend-api-key
      remoteRef:
        key: secret/comms
        property: resend_api_key
    # GA Gate A (internal-devops#204): shared dhanam federation bearer token.
    # Canonical home is secret/dhanam#federation_api_token (the value
    # dhanam-api validates against).
    - secretKey: federation-api-token
      remoteRef:
        key: secret/dhanam
        property: federation_api_token
    # Coupler gateway delegation — same value as
    # coupler-gateway-secrets/janua-service-token
    - secretKey: janua-service-token
      remoteRef:
        key: secret/coupler
        property: janua_service_token
