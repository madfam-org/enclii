apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: janua-secrets
  namespace: janua
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: janua-secrets
    # Merge, not Owner: the live secret predates ESO (2026-01-09) and holds
    # operator-managed keys with no Vault home yet (jwt-secret, jwt-private-key,
    # jwt-public-key, dhanam-webhook-secret, oauth-github-client-id/-secret,
    # internal-api-key). janua-api consumes those keys directly; Owner would
    # replace them on first successful sync. Backfilling them into secret/janua
    # requires adding secret/data/janua to the switchyard-secret-writer policy
    # (root-token gated — see internal-devops runbooks).
    creationPolicy: Merge
    deletionPolicy: Retain
  # secretKey names match what janua-api env refs actually consume
  # (lowercase-dashed). Only map Vault properties that exist — one missing
  # property fails the whole ExternalSecret.
  data:
    - secretKey: database-url
      remoteRef:
        key: secret/janua
        property: database_url
    - secretKey: redis-url
      remoteRef:
        key: secret/janua
        property: redis_url
    - secretKey: secret-key
      remoteRef:
        key: secret/janua
        property: secret_key
    - secretKey: field-encryption-key
      remoteRef:
        key: secret/janua
        property: field_encryption_key
    # Fan-out from platform comms — same org Resend account
    - secretKey: resend-api-key
      remoteRef:
        key: secret/comms
        property: resend_api_key
    # GA Gate A (internal-devops#204): shared dhanam federation bearer token.
    # Canonical home is secret/dhanam#federation_api_token (matches the value
    # dhanam-api validates against); secret/janua is not writable by the
    # intake policy yet, so map from the canonical path.
    - secretKey: federation-api-token
      remoteRef:
        key: secret/dhanam
        property: federation_api_token
    # TODO(coupler intake): restore janua-service-token <- secret/coupler
    # #janua_service_token once secret/coupler exists in Vault
    # (coupler-gateway-secrets ES fails on the same missing path today).
