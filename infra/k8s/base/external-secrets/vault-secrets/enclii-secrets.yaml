apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enclii-secrets
  namespace: enclii
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: enclii-secrets
    # Merge, not Owner: keeps operator break-glass keys (e.g. keys set via
    # `enclii secrets set` before their Vault home exists) from being wiped
    # on sync. ESO only manages the keys mapped below.
    creationPolicy: Merge
    deletionPolicy: Retain
  # secretKey names match what switchyard-api/roundhouse/switchyard-ui env
  # refs actually consume (lowercase-dashed). The previous UPPERCASE mappings
  # referenced 18 Vault properties that never existed (values live in
  # dedicated secrets: enclii-oidc-credentials, roundhouse-registry-credentials,
  # jwt-secrets, redis-auth, enclii-cloudflare-credentials, ...), which kept
  # this ExternalSecret in SecretSyncedError since 2026-06-16.
  data:
    - secretKey: database-url
      remoteRef:
        key: secret/enclii
        property: database_url
    - secretKey: internal-api-key
      remoteRef:
        key: secret/enclii
        property: internal_api_key
    - secretKey: posthog-key
      remoteRef:
        key: secret/enclii
        property: posthog_key
    # GA Gate A (internal-devops#204): shared dhanam federation bearer token.
    # switchyard-api reads FEDERATION_API_TOKEN from this key (optional ref).
    # Value verified identical to secret/dhanam#federation_api_token.
    - secretKey: federation-api-token
      remoteRef:
        key: secret/enclii
        property: federation_api_token
    # Canonical Resend — secret/comms (not secret/enclii). See decisions/2026-06-16-platform-comms-and-dhanam-secret-custody.md
    - secretKey: resend-api-key
      remoteRef:
        key: secret/comms
        property: resend_api_key
