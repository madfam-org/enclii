apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: yantra4d-secrets
  namespace: yantra4d
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: yantra4d-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/yantra4d
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/yantra4d
        property: redis_url
    - secretKey: SECRET_KEY
      remoteRef:
        key: secret/yantra4d
        property: secret_key
