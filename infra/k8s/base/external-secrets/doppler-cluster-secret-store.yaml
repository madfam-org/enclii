---
# Doppler ClusterSecretStore
# Enables incremental migration of secrets to Doppler alongside the existing
# Kubernetes-native ClusterSecretStore.
#
# Prerequisites:
#   1. Create a Doppler service token for the project/config
#   2. Create the auth secret from the template:
#      cp doppler-secret-store-secret.yaml.template doppler-secret-store-secret.yaml
#      # Edit with real token
#      kubectl apply -f doppler-secret-store-secret.yaml
#   3. Apply this manifest:
#      kubectl apply -f doppler-cluster-secret-store.yaml
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: doppler-store
  labels:
    app.kubernetes.io/name: doppler-secret-store
    app.kubernetes.io/part-of: enclii
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-auth
            namespace: external-secrets
            key: doppler-token
