---
# External Secrets Operator - ClusterSecretStore
# Provides centralized secret management across all namespaces
#
# Current provider: Kubernetes (cross-namespace secret copying)
# See docs/infrastructure/SECRETS_MANAGEMENT.md for future provider options
#
# Setup:
# 1. Ensure the external-secrets namespace exists
# 2. Apply this ClusterSecretStore
# 3. Create ExternalSecrets in your namespaces

apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secrets-management

---
# ClusterSecretStore for Kubernetes secrets (cross-namespace copying)
# This is the active provider — secrets are managed via kubectl in the enclii namespace
# and copied to other namespaces via ExternalSecret resources.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: kubernetes-store
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secrets-management
spec:
  provider:
    kubernetes:
      # Reference secrets from the 'enclii' namespace
      remoteNamespace: enclii
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
---
# ClusterSecretStore for build-system secrets that live outside the enclii
# runtime namespace. Used by infra jobs that need the current npm token without
# duplicating secret values into Git.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: enclii-builds-kubernetes-store
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secrets-management
spec:
  provider:
    kubernetes:
      remoteNamespace: enclii-builds
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
