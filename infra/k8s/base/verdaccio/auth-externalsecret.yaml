# Verdaccio htpasswd — sourced from Vault, NOT from this repo.
#
# 2026-09-07 incident: this file replaces `secret.yaml`, a plain `kind: Secret`
# that carried the bcrypt hash of the registry admin user in a PUBLIC
# repository, at bcrypt cost 5. Cost 5 is 32 rounds — roughly 1/32 the work of
# the cost-10 default — so the published hash was cheap to attack offline, and
# `git rm` does not remove it from history. The hash is therefore treated as
# disclosed: the remediation is ROTATION (see
# `scripts/operator/npm-registry-admin-password-rotate.sh`), not deletion.
#
# The Secret name (`verdaccio-auth`) and key (`htpasswd`) are unchanged, so
# `deployment.yaml`'s volume mount needs no edit. The deployment carries
# `reloader.stakater.com/auto: "true"` with `strategy: Recreate`, so a Vault
# rotation propagates to the pod on its own: ESO refreshes the Secret, Reloader
# sees the change, and the single-replica pod is recreated (~30s).
#
# Store choice: `vault-store` (the only ClusterSecretStore backed by real
# Vault). The `kubernetes-store` / `enclii-builds-kubernetes-store` stores used
# by `token-rotation-externalsecrets.yaml` are Kubernetes providers that mirror
# Secrets out of the `enclii` / `enclii-builds` namespaces — they hold no Vault
# data and are the wrong substrate for an operator-rotated credential.
#
# Vault path: `secret/npm-registry`, property `htpasswd` — the path this repo
# already declares for this namespace in
# `infra/k8s/base/external-secrets/vault-secrets/npm-registry-secrets.yaml` and
# documents in `docs/infrastructure/EXTERNAL_SECRETS.md`. The `eso-reader`
# policy grants `read` on `secret/data/*`, so NO Vault policy change is needed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: verdaccio-auth
  namespace: npm-registry
  labels:
    app.kubernetes.io/name: verdaccio
    app.kubernetes.io/component: auth
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: verdaccio-auth
    # Owner, not Merge: `verdaccio-auth` has exactly one writer (this
    # ExternalSecret), and a Merge-only writer never CREATES its target — the
    # Secret would simply never appear on a fresh cluster. See
    # scripts/check-externalsecret-writers.py.
    creationPolicy: Owner
    # Retain: deleting this ExternalSecret must not delete the credential the
    # running registry is authenticating against.
    deletionPolicy: Retain
  data:
    - secretKey: htpasswd
      remoteRef:
        key: secret/npm-registry
        property: htpasswd
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
