apiVersion: v1
kind: ConfigMap
metadata:
  name: verdaccio-config
  namespace: npm-registry
  labels:
    app.kubernetes.io/name: verdaccio
    app.kubernetes.io/component: config
data:
  config.yaml: |
    # Verdaccio Configuration for npm.madfam.io
    # MADFAM Private Package Registry

    storage: /verdaccio/storage
    plugins: /verdaccio/plugins

    # Web UI configuration
    web:
      title: MADFAM Package Registry
      logo: https://madfam.io/logo.png
      primary_color: "#6366f1"
      favicon: https://madfam.io/favicon.ico
      gravatar: true
      sort_packages: asc
      darkMode: true

    # Authentication - dual auth: Janua API keys (primary) + htpasswd (fallback)
    # Janua plugin validates Bearer tokens via POST /api/v1/api-keys/verify.
    # htpasswd remains as fallback for local dev and migration period.
    # To revert to htpasswd-only: remove the janua-keys block below.
    auth:
      janua-keys:
        janua_url: https://api.janua.dev
        cache_ttl_ms: 300000          # 5 min cache to avoid hammering Janua
      htpasswd:
        file: /verdaccio/conf/htpasswd
        max_users: 100
        algorithm: bcrypt

    # Security settings
    # API tokens extended to 365d to prevent recurring CI/CD breakage.
    # Automated rotation via Selva NPM tools (selva_npm_rotate_token).
    security:
      api:
        legacy: true
        jwt:
          sign:
            expiresIn: 365d
          verify:
            maxAge: 366d
      web:
        sign:
          expiresIn: 7d

    # Uplinks to public registries
    uplinks:
      npmjs:
        url: https://registry.npmjs.org/
        timeout: 30s
        maxage: 10m
        fail_timeout: 5m
        max_fails: 3
        cache: true

    # Package access rules - MADFAM ecosystem scopes
    packages:
      # Core MADFAM packages
      '@madfam/*':
        access: $authenticated
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions

      # Dhanam - Finance platform
      '@dhanam/*':
        access: $authenticated
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions

      # Janua - Auth platform (public read for SDK consumers)
      '@janua/*':
        access: $all
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions

      # Cotiza - Quoting platform
      '@cotiza/*':
        access: $authenticated
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions

      # Fortuna - Lottery platform
      '@fortuna/*':
        access: $authenticated
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions

      # Avala - Insurance platform
      '@avala/*':
        access: $authenticated
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions

      # Forgesight - Analytics platform
      '@forgesight/*':
        access: $authenticated
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions

      # Coforma - Form builder
      '@coforma/*':
        access: $authenticated
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions

      # Forj - Workflow automation
      '@forj/*':
        access: $authenticated
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions

      # Enclii - Platform as a Service (public read for SDK consumers)
      '@enclii/*':
        access: $all
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions

      # All other packages - proxy to npmjs
      '**':
        access: $all
        publish: $authenticated
        unpublish: false  # IMMUTABLE: prevents overwriting published versions
        proxy: npmjs

    # Server settings
    server:
      keepAliveTimeout: 60

    # Logging
    logs:
      type: stdout
      format: pretty
      level: info

    # Rate limiting and audit
    middlewares:
      audit:
        enabled: true

    # Feature flags
    experiments:
      changePassword: true
      search: true
