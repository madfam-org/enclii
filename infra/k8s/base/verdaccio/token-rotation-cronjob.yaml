---
# NPM Token Rotation CronJob
# Runs every Sunday at 02:00 UTC.
# 1. Logs into npm.madfam.io to get a fresh JWT.
# 2. Decodes the JWT and checks expiry.
# 3. If expiry < 30 days: rotates NPM_MADFAM_TOKEN across all org repos via gh secret set.
# 4. Pushes npm_token_expiry_days metric to pushgateway for Prometheus.
apiVersion: v1
kind: ConfigMap
metadata:
  name: npm-token-rotation-script
  namespace: npm-registry
  labels:
    app.kubernetes.io/name: verdaccio
    app.kubernetes.io/component: token-rotation
data:
  rotate.sh: |
    #!/bin/sh
    set -euo pipefail

    VERDACCIO_URL="${VERDACCIO_URL:-https://npm.madfam.io}"
    PUSHGATEWAY_URL="${PUSHGATEWAY_URL:-http://pushgateway.monitoring.svc.cluster.local:9091}"
    ROTATION_THRESHOLD_DAYS="${ROTATION_THRESHOLD_DAYS:-30}"
    ORG="${GITHUB_ORG:-madfam-org}"
    SECRET_NAME="${GH_SECRET_NAME:-NPM_MADFAM_TOKEN}"

    log() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] $*"; }

    # ------------------------------------------------------------------
    # Step 1: Authenticate against Verdaccio
    # ------------------------------------------------------------------
    log "INFO  Authenticating against ${VERDACCIO_URL}"
    LOGIN_RESPONSE=$(curl -sf -X POST \
      "${VERDACCIO_URL}/-/verdaccio/sec/login" \
      -H 'Content-Type: application/json' \
      -d "{\"username\":\"${NPM_REGISTRY_USER}\",\"password\":\"${NPM_REGISTRY_PASSWORD}\"}" \
    ) || { log "ERROR Login request failed"; exit 1; }

    TOKEN=$(echo "${LOGIN_RESPONSE}" | jq -r '.token // empty')
    if [ -z "${TOKEN}" ]; then
      log "ERROR No token in login response"
      echo "${LOGIN_RESPONSE}" | jq . 2>/dev/null || echo "${LOGIN_RESPONSE}"
      exit 1
    fi
    log "INFO  Token obtained (length=${#TOKEN})"

    # ------------------------------------------------------------------
    # Step 2: Decode JWT and check expiry
    # ------------------------------------------------------------------
    # JWT is base64url-encoded; decode the payload (second segment).
    PAYLOAD=$(echo "${TOKEN}" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
    EXP=$(echo "${PAYLOAD}" | jq -r '.exp // empty')

    if [ -z "${EXP}" ]; then
      log "WARN  Could not extract exp from JWT payload; treating as needing rotation"
      DAYS_LEFT=0
    else
      NOW=$(date +%s)
      DAYS_LEFT=$(( (EXP - NOW) / 86400 ))
    fi

    log "INFO  Token expires in ${DAYS_LEFT} day(s) (threshold: ${ROTATION_THRESHOLD_DAYS}d)"

    # ------------------------------------------------------------------
    # Step 3: Push metric to Pushgateway
    # ------------------------------------------------------------------
    push_metric() {
      cat <<METRIC_EOF | curl -sf --data-binary @- "${PUSHGATEWAY_URL}/metrics/job/npm_token_rotation" || \
        log "WARN  Failed to push metric to pushgateway"
    # HELP npm_token_expiry_days Days until NPM registry token expires
    # TYPE npm_token_expiry_days gauge
    npm_token_expiry_days ${DAYS_LEFT}
    # HELP npm_token_rotation_last_run Unix timestamp of last rotation check
    # TYPE npm_token_rotation_last_run gauge
    npm_token_rotation_last_run $(date +%s)
    METRIC_EOF
    }
    push_metric

    # ------------------------------------------------------------------
    # Step 4: Rotate across repos if expiry is close
    # ------------------------------------------------------------------
    if [ "${DAYS_LEFT}" -ge "${ROTATION_THRESHOLD_DAYS}" ]; then
      log "INFO  Token has ${DAYS_LEFT}d remaining (>= ${ROTATION_THRESHOLD_DAYS}d). No rotation needed."
      exit 0
    fi

    log "INFO  Token has ${DAYS_LEFT}d remaining. Rotating across ${ORG} repos..."

    # List all repos in the org (pagination: up to 500)
    REPOS=$(gh repo list "${ORG}" --limit 500 --json name -q '.[].name')
    ROTATED=0
    FAILED=0

    for REPO in ${REPOS}; do
      log "INFO  Setting ${SECRET_NAME} on ${ORG}/${REPO}"
      if echo "${TOKEN}" | gh secret set "${SECRET_NAME}" \
        --repo "${ORG}/${REPO}" 2>/dev/null; then
        ROTATED=$((ROTATED + 1))
      else
        log "WARN  Failed to set secret on ${ORG}/${REPO} (may lack Actions)"
        FAILED=$((FAILED + 1))
      fi
    done

    log "INFO  Rotation complete: ${ROTATED} updated, ${FAILED} skipped"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: npm-token-rotation
  namespace: npm-registry
  labels:
    app.kubernetes.io/name: verdaccio
    app.kubernetes.io/component: token-rotation
    app.kubernetes.io/part-of: enclii-platform
spec:
  schedule: "0 2 * * 0"   # Every Sunday at 02:00 UTC
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600    # 10 min hard limit
      template:
        metadata:
          labels:
            app.kubernetes.io/name: verdaccio
            app.kubernetes.io/component: token-rotation
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: rotate
              image: ghcr.io/madfam-org/enclii/alpine-gh@sha256:e9c68fd809b0962d37ccf6c6793c3c4ec7e081b2dea4daf0c5dd912c9f6dd1a4
              # Alpine 3.x + curl + jq + gh CLI. Source: infra/docker/alpine-gh.
              command: ["/bin/sh", "/scripts/rotate.sh"]
              env:
                - name: NPM_REGISTRY_USER
                  valueFrom:
                    secretKeyRef:
                      name: npm-token-rotation-creds
                      key: username
                - name: NPM_REGISTRY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: npm-token-rotation-creds
                      key: password
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: npm-token-rotation-creds
                      key: gh_token
                - name: VERDACCIO_URL
                  value: "https://npm.madfam.io"
                - name: PUSHGATEWAY_URL
                  value: "http://pushgateway.monitoring.svc.cluster.local:9091"
                - name: ROTATION_THRESHOLD_DAYS
                  value: "30"
                - name: GITHUB_ORG
                  value: "madfam-org"
                - name: GH_SECRET_NAME
                  value: "NPM_MADFAM_TOKEN"
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: npm-token-rotation-script
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
---
# Secret template -- actual values managed via ExternalSecrets / Vault
apiVersion: v1
kind: Secret
metadata:
  name: npm-token-rotation-creds
  namespace: npm-registry
  labels:
    app.kubernetes.io/name: verdaccio
    app.kubernetes.io/component: token-rotation
type: Opaque
stringData:
  username: "admin@madfam.io"
  password: "REPLACE_VIA_EXTERNALSECRET"
  gh_token: "REPLACE_VIA_EXTERNALSECRET"
