---
# NPM Token Rotation CronJob
# Runs every Sunday at 02:00 UTC.
# 1. Validates the current token (/-/whoami must return .username; optional publish dry-run).
# 2. Decodes JWT expiry when applicable.
# 3. If expiry < 30 days OR token fails validation: logs in via htpasswd and rotates.
# 4. Propagates NPM_MADFAM_TOKEN to org repos (optional NPM_ROTATION_REPO_ALLOWLIST).
# 5. Pushes npm_token_expiry_days metric to pushgateway for Prometheus.
#
# npm-token-rotation-creds must include token and gh_token. username/password are
# optional break-glass inputs for re-login when the provider secret includes them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: npm-token-rotation-script
  namespace: npm-registry
  labels:
    app.kubernetes.io/name: verdaccio
    app.kubernetes.io/component: token-rotation
data:
  rotate.sh: |
    #!/bin/sh
    set -euo pipefail

    VERDACCIO_URL="${VERDACCIO_URL:-https://npm.madfam.io}"
    PUSHGATEWAY_URL="${PUSHGATEWAY_URL:-http://pushgateway.monitoring.svc.cluster.local:9091}"
    ROTATION_THRESHOLD_DAYS="${ROTATION_THRESHOLD_DAYS:-30}"
    ORG="${GITHUB_ORG:-madfam-org}"
    SECRET_NAME="${GH_SECRET_NAME:-NPM_MADFAM_TOKEN}"
    REPO_ALLOWLIST="${NPM_ROTATION_REPO_ALLOWLIST:-}"

    log() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] $*"; }

    verify_token_works() {
      WHOAMI_BODY=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
        "${VERDACCIO_URL}/-/whoami" 2>/dev/null || echo '{}')
      USERNAME=$(printf '%s' "${WHOAMI_BODY}" | jq -r '.username // empty' 2>/dev/null || true)
      if [ -z "${USERNAME}" ]; then
        log "WARN  Token failed whoami (no username). body=${WHOAMI_BODY}"
        return 1
      fi
      log "INFO  Token whoami OK (user=${USERNAME})"

      if [ "${VERIFY_PUBLISH:-true}" = "true" ]; then
        SMOKE_DIR=$(mktemp -d)
        printf '%s\n' \
          '{' \
          '  "name": "@madfam/npm-publish-smoke",' \
          '  "version": "0.0.0-smoke",' \
          '  "private": true' \
          '}' > "${SMOKE_DIR}/package.json"
        if (cd "${SMOKE_DIR}" && \
          NPM_CONFIG_REGISTRY="${VERDACCIO_URL}" \
          npm publish --dry-run --access restricted >/dev/null 2>&1); then
          log "INFO  Token publish dry-run OK"
        else
          log "WARN  Token publish dry-run failed"
          rm -rf "${SMOKE_DIR}"
          return 1
        fi
        rm -rf "${SMOKE_DIR}"
      fi
      return 0
    }

    login_for_token() {
      if [ -z "${NPM_REGISTRY_USER:-}" ] || [ -z "${NPM_REGISTRY_PASSWORD:-}" ]; then
        log "ERROR Registry username/password are required when the current token needs renewal"
        exit 1
      fi

      log "INFO  Authenticating against ${VERDACCIO_URL}"
      LOGIN_RESPONSE=$(curl -sf -X POST \
        "${VERDACCIO_URL}/-/verdaccio/sec/login" \
        -H 'Content-Type: application/json' \
        -d "{\"username\":\"${NPM_REGISTRY_USER}\",\"password\":\"${NPM_REGISTRY_PASSWORD}\"}" \
      ) || { log "ERROR Login request failed"; exit 1; }

      TOKEN=$(echo "${LOGIN_RESPONSE}" | jq -r '.token // empty')
      if [ -z "${TOKEN}" ]; then
        log "ERROR No token in login response"
        echo "${LOGIN_RESPONSE}" | jq . 2>/dev/null || echo "${LOGIN_RESPONSE}"
        exit 1
      fi
      log "INFO  Token obtained (length=${#TOKEN})"
    }

    compute_days_left() {
      TOKEN_PAYLOAD_SEGMENT=$(printf '%s' "${TOKEN}" | cut -d. -f2)
      PADDING=$(( (4 - ${#TOKEN_PAYLOAD_SEGMENT} % 4) % 4 ))
      if [ "${PADDING}" -gt 0 ]; then
        TOKEN_PAYLOAD_SEGMENT="${TOKEN_PAYLOAD_SEGMENT}$(printf '=%.0s' $(seq 1 "${PADDING}"))"
      fi

      PAYLOAD=$(printf '%s' "${TOKEN_PAYLOAD_SEGMENT}" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
      EXP=$(printf '%s' "${PAYLOAD}" | jq -r '.exp // empty' 2>/dev/null || true)

      if [ -z "${EXP}" ]; then
        log "WARN  Could not extract exp from JWT payload; treating as needing rotation"
        DAYS_LEFT=0
      else
        NOW=$(date +%s)
        DAYS_LEFT=$(( (EXP - NOW) / 86400 ))
      fi
    }

    # ------------------------------------------------------------------
    # Step 1: Check the current token when one is already provisioned
    # ------------------------------------------------------------------
    TOKEN="${NPM_MADFAM_TOKEN:-}"
    if [ -n "${TOKEN}" ]; then
      log "INFO  Using provisioned npm token (length=${#TOKEN})"
    else
      log "INFO  No provisioned npm token found; requesting one from Verdaccio"
      login_for_token
    fi

    compute_days_left
    log "INFO  Token expires in ${DAYS_LEFT} day(s) (threshold: ${ROTATION_THRESHOLD_DAYS}d)"

    TOKEN_VALID=0
    if verify_token_works; then
      TOKEN_VALID=1
    fi

    # ------------------------------------------------------------------
    # Step 2: Push metric to Pushgateway
    # ------------------------------------------------------------------
    push_metric() {
      METRIC_ATTEMPT=1
      METRIC_MAX_ATTEMPTS=6
      while [ "${METRIC_ATTEMPT}" -le "${METRIC_MAX_ATTEMPTS}" ]; do
        if cat <<METRIC_EOF | curl -sf --data-binary @- "${PUSHGATEWAY_URL}/metrics/job/npm_token_rotation"; then
    # HELP npm_token_expiry_days Days until NPM registry token expires
    # TYPE npm_token_expiry_days gauge
    npm_token_expiry_days ${DAYS_LEFT}
    # HELP npm_token_rotation_last_run Unix timestamp of last rotation check
    # TYPE npm_token_rotation_last_run gauge
    npm_token_rotation_last_run $(date +%s)
    METRIC_EOF
          log "INFO  Metric pushed to pushgateway"
          return 0
        fi

        if [ "${METRIC_ATTEMPT}" -ge "${METRIC_MAX_ATTEMPTS}" ]; then
          log "WARN  Failed to push metric to pushgateway after ${METRIC_ATTEMPT} attempts"
          return 0
        fi

        log "INFO  Pushgateway metric endpoint not ready (${METRIC_ATTEMPT}/${METRIC_MAX_ATTEMPTS}); retrying"
        METRIC_ATTEMPT=$((METRIC_ATTEMPT + 1))
        sleep 5
      done
    }
    push_metric

    # ------------------------------------------------------------------
    # Step 3: Rotate across repos if expiry is close
    # ------------------------------------------------------------------
    if [ "${TOKEN_VALID}" -eq 1 ] && [ "${DAYS_LEFT}" -ge "${ROTATION_THRESHOLD_DAYS}" ]; then
      log "INFO  Token valid with ${DAYS_LEFT}d remaining (>= ${ROTATION_THRESHOLD_DAYS}d). No rotation needed."
      exit 0
    fi

    if [ "${TOKEN_VALID}" -eq 0 ]; then
      log "INFO  Current token failed validation; requesting a fresh Verdaccio token..."
    else
      log "INFO  Token expires in ${DAYS_LEFT}d (< ${ROTATION_THRESHOLD_DAYS}d). Requesting a fresh token..."
    fi
    login_for_token
    if ! verify_token_works; then
      log "ERROR Fresh token failed validation (whoami/publish dry-run). Aborting rotation."
      exit 1
    fi
    compute_days_left
    log "INFO  Fresh token expires in ${DAYS_LEFT} day(s)"
    push_metric

    log "INFO  Propagating ${SECRET_NAME} across ${ORG} repos..."

    if [ -n "${REPO_ALLOWLIST}" ]; then
      REPOS=$(printf '%s' "${REPO_ALLOWLIST}" | tr ',' ' ')
      log "INFO  Using repo allowlist (${REPO_ALLOWLIST})"
    else
      REPOS=$(gh repo list "${ORG}" --limit 500 --json name -q '.[].name')
    fi
    ROTATED=0
    FAILED=0

    for REPO in ${REPOS}; do
      log "INFO  Setting ${SECRET_NAME} on ${ORG}/${REPO}"
      if echo "${TOKEN}" | gh secret set "${SECRET_NAME}" \
        --repo "${ORG}/${REPO}" 2>/dev/null; then
        ROTATED=$((ROTATED + 1))
      else
        log "WARN  Failed to set secret on ${ORG}/${REPO} (may lack Actions)"
        FAILED=$((FAILED + 1))
      fi
    done

    log "INFO  Rotation complete: ${ROTATED} updated, ${FAILED} skipped"

    # Org-level secret (preferred for new repos); requires GH_TOKEN with admin:org
    if [ "${SET_ORG_SECRET:-true}" = "true" ]; then
      if echo "${TOKEN}" | gh secret set "${SECRET_NAME}" --org "${ORG}" 2>/dev/null; then
        log "INFO  Updated org-level ${SECRET_NAME}"
      else
        log "WARN  Could not set org-level ${SECRET_NAME} (check gh_token scopes)"
      fi
    fi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: npm-token-rotation
  namespace: npm-registry
  labels:
    app.kubernetes.io/name: verdaccio
    app.kubernetes.io/component: token-rotation
    app.kubernetes.io/part-of: enclii-platform
spec:
  schedule: "0 2 * * 0"   # Every Sunday at 02:00 UTC
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600    # 10 min hard limit
      template:
        metadata:
          labels:
            app.kubernetes.io/name: verdaccio
            app.kubernetes.io/component: token-rotation
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: rotate
              image: ghcr.io/madfam-org/enclii/switchyard-api@sha256:e9c68fd809b0962d37ccf6c6793c3c4ec7e081b2dea4daf0c5dd912c9f6dd1a4
              # Alpine 3.x + curl + jq + gh CLI. Source: infra/docker/alpine-gh.
              # Hosted under an existing GHCR package so cluster pull credentials
              # inherit the same package access path as other Enclii workloads.
              command: ["/bin/sh", "/scripts/rotate.sh"]
              env:
                - name: NPM_REGISTRY_USER
                  valueFrom:
                    secretKeyRef:
                      name: npm-token-rotation-creds
                      key: username
                      optional: true
                - name: NPM_REGISTRY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: npm-token-rotation-creds
                      key: password
                      optional: true
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: npm-token-rotation-creds
                      key: gh_token
                - name: NPM_MADFAM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: npm-token-rotation-creds
                      key: token
                      optional: true
                - name: VERDACCIO_URL
                  value: "https://npm.madfam.io"
                - name: PUSHGATEWAY_URL
                  value: "http://pushgateway.monitoring.svc.cluster.local:9091"
                - name: ROTATION_THRESHOLD_DAYS
                  value: "30"
                - name: GITHUB_ORG
                  value: "madfam-org"
                - name: GH_SECRET_NAME
                  value: "NPM_MADFAM_TOKEN"
                - name: VERIFY_PUBLISH
                  value: "true"
                - name: SET_ORG_SECRET
                  value: "true"
                - name: NPM_ROTATION_REPO_ALLOWLIST
                  value: "janua,dhanam,forj,karafiel,enclii,avala,forgesight,rondelio,janua-react-sdk"
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: npm-token-rotation-script
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
---
# Secret template -- actual values managed via ExternalSecrets / Vault
apiVersion: v1
kind: Secret
metadata:
  name: npm-token-rotation-creds
  namespace: npm-registry
  labels:
    app.kubernetes.io/name: verdaccio
    app.kubernetes.io/component: token-rotation
type: Opaque
stringData:
  # Template only — production values come from ExternalSecrets / operator.
  username: "admin@madfam.io"
  # password: optional; required only for automated re-login when token expires
  # or fails publish smoke and the provider secret includes a password property
