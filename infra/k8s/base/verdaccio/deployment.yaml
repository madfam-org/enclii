apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio
  namespace: npm-registry
  labels:
    app.kubernetes.io/name: verdaccio
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: enclii-platform
spec:
  replicas: 1
  # Strategy: Recreate, NOT RollingUpdate.
  # 2026-05-04 incident (caught here): Verdaccio is single-replica + RWO Longhorn
  # PVC. RollingUpdate with maxSurge=1 spawns the new pod BEFORE the old one
  # terminates, but the RWO PVC can only attach to one node at a time. New pod
  # gets `Multi-Attach error` and stays ContainerCreating until the volume is
  # manually detached (took ~18 min in the May 4 incident, with npm.madfam.io
  # 502'ing the entire window).
  # Recreate kills the old pod first → PVC detaches cleanly → new pod attaches
  # on its target node → ~30s clean cutover instead of indefinite hang.
  # Reloader annotation below ensures ConfigMap-only changes also trigger this
  # restart, removing the need for manual `kubectl rollout restart` on every
  # ConfigMap edit.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: verdaccio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verdaccio
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4873"
        prometheus.io/path: "/-/metrics"
        # Auto-restart pod when ConfigMap or Secret it consumes changes.
        # Pairs with strategy:Recreate above so config rolls cleanly without
        # operator intervention. Reloader watches volumes (configMap/secret).
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: verdaccio
          image: docker.io/verdaccio/verdaccio:5@sha256:9d622d256378c6e7ae09f384774ee2f0f8ac67a66c066db55921a0b7218abc4c
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4873
              protocol: TCP

          env:
            - name: VERDACCIO_PORT
              value: "4873"
            - name: VERDACCIO_PUBLIC_URL
              value: "https://npm.madfam.io"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          volumeMounts:
            - name: config
              mountPath: /verdaccio/conf/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: htpasswd
              mountPath: /verdaccio/conf/htpasswd
              subPath: htpasswd
            - name: janua-auth-plugin
              mountPath: /verdaccio/plugins/verdaccio-auth-janua
              readOnly: true
            - name: storage
              mountPath: /verdaccio/storage

          startupProbe:
            httpGet:
              path: /-/ping
              port: http
            failureThreshold: 15
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Verdaccio needs write access
            capabilities:
              drop:
                - ALL

      volumes:
        - name: config
          configMap:
            name: verdaccio-config
        - name: htpasswd
          secret:
            secretName: verdaccio-auth
            items:
              - key: htpasswd
                path: htpasswd
        - name: janua-auth-plugin
          configMap:
            name: verdaccio-janua-plugin
        - name: storage
          persistentVolumeClaim:
            claimName: verdaccio-storage
