---
# Kyverno Image Security Policies for Enclii
# These policies control image sources and verify signatures
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Limits container images to approved registries only.
      This prevents pulling from untrusted sources.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          # Exclude infrastructure namespaces (kube-system, kyverno, longhorn, ARC, etc.)
          - resources:
              namespaceSelector:
                matchLabels:
                  enclii.dev/type: infrastructure
      validate:
        message: >-
          Images must come from approved registries:
          ghcr.io/madfam-org, ghcr.io/cloudnative-pg, gcr.io, docker.io, quay.io, registry.k8s.io, docker.elastic.co
        pattern:
          spec:
            containers:
              - image: "ghcr.io/madfam-org/* | ghcr.io/cloudnative-pg/* | gcr.io/* | docker.io/* | quay.io/* | registry.k8s.io/* | docker.elastic.co/*"
            =(initContainers):
              - image: "ghcr.io/madfam-org/* | ghcr.io/cloudnative-pg/* | gcr.io/* | docker.io/* | quay.io/* | registry.k8s.io/* | docker.elastic.co/*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies that container images are signed with Cosign.
      All production namespaces require signed images.
      Verifies signatures using keyless Cosign with GitHub Actions OIDC.
      Namespaces must opt-in with the label enclii.dev/verify-signatures: "true".
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  enclii.dev/verify-signatures: "true"
      verifyImages:
        - imageReferences:
            - "ghcr.io/madfam-org/*"
          mutateDigest: false
          verifyDigest: true
          required: true
          useCache: true
          imageRegistryCredentials:
            secrets:
              - ghcr-credentials
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    # Kyverno 3.1.x only supports exact keyless.subject values;
                    # repo/workflow regex enforcement requires a Kyverno upgrade
                    # or explicit subject enumeration.
                    #
                    # When subject enforcement is restored, the pattern must
                    # also accept commit-SHA refs. Since #620, callers may pin
                    # .github/workflows/build-publish.yml by 40-hex SHA, and
                    # their signatures carry the identity
                    #   .../build-publish.yml@<40-hex sha>
                    # The pre-c7205639 regexp ended in
                    #   @refs/(heads/main|tags/v[0-9].*)$
                    # and would refuse those pods ("no matching signatures").
                    # End it in, for example:
                    #   @(refs/(heads/main|tags/v[0-9].*)|[0-9a-f]{40})$
                    # The matching rule is the "Resolve trusted signer
                    # identity" pin-job self-check in build-publish.yml.
                    # See docs/infrastructure/KYVERNO_POLICIES.md.
                    rekor:
                      url: https://rekor.sigstore.dev
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-pull-policy
  annotations:
    policies.kyverno.io/title: Require imagePullPolicy
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Ensures containers specify an explicit imagePullPolicy
      for predictable behavior.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-pull-policy
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaceSelector:
                matchLabels:
                  enclii.dev/type: infrastructure
      validate:
        message: "imagePullPolicy should be explicitly set to IfNotPresent or Always."
        pattern:
          spec:
            containers:
              - imagePullPolicy: "IfNotPresent | Always"
