# Cross-namespace RBAC for enclii's own services.
#
# These Roles and RoleBindings live OUTSIDE the enclii namespace on purpose:
#   - data:          switchyard-api manages the shared PgBouncer config,
#                    userlist and rollout (app-role provisioning);
#   - argocd:        switchyard-api manages project Applications;
#                    Argo tracking declarations remain a platform-bootstrap action;
#   - enclii-builds: roundhouse runs build Jobs.
#
# They used to sit in infra/k8s/base, where the production overlay's
# `namespace: enclii` rewrote every one of them into `enclii`, so none was
# effective (onboard ensure failed: "configmaps pgbouncer-config is forbidden"
# in namespace data, 2026-10-14). This kustomization has NO namespace field,
# so each resource keeps its declared namespace. Synced by the
# cross-namespace-rbac Application (infra/argocd/apps/cross-namespace-rbac.yaml).
---
# Role: allows opt-in runtime ArgoCD Application reconciliation
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: switchyard-argocd-application-manager
  namespace: argocd
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: provisioning
    enclii.dev/managed-by: platform
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Fixed Karafiel source-parent and restricted-project authority reads.
  # No list/watch or writes; the existing namespaced binding is reused.
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    resourceNames: ["project-applications"]
    verbs: ["get"]
  - apiGroups: ["argoproj.io"]
    resources: ["appprojects"]
    resourceNames: ["karafiel-staging"]
    verbs: ["get"]
---
# RoleBinding: binds the ArgoCD Application manager role to switchyard-api
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: switchyard-argocd-application-manager
  namespace: argocd
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: provisioning
    enclii.dev/managed-by: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: switchyard-argocd-application-manager
subjects:
  - kind: ServiceAccount
    name: switchyard-api
    namespace: enclii
---
# Role: allows switchyard-api to manage PgBouncer config in data namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: switchyard-pgbouncer-manager
  namespace: data
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: provisioning
    enclii.dev/managed-by: platform
rules:
  # Read and update PgBouncer ConfigMap
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["pgbouncer-config"]
  # Read and update PgBouncer userlist Secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update"]
    resourceNames: ["pgbouncer-userlist"]
  # Read (only) pgbouncer_auth's password, so the userlist drift checker can
  # confirm the auth_query path works: the Secret exists and its value matches
  # the role's stored verifier in Postgres (a half-landed rotation shows up).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["pgbouncer-auth"]
  # Patch PgBouncer Deployment for rollout restart
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames: ["pgbouncer"]
---
# RoleBinding: binds the Role to switchyard-api ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: switchyard-pgbouncer-manager
  namespace: data
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: provisioning
    enclii.dev/managed-by: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: switchyard-pgbouncer-manager
subjects:
  - kind: ServiceAccount
    name: switchyard-api
    namespace: enclii
---
# RBAC: Allow Roundhouse to create Jobs in the builds namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roundhouse-builder
  namespace: enclii-builds
  labels:
    app.kubernetes.io/name: roundhouse
    app.kubernetes.io/part-of: enclii
rules:
  # Create and monitor build Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Get logs from build pods
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roundhouse-builder
  namespace: enclii-builds
  labels:
    app.kubernetes.io/name: roundhouse
    app.kubernetes.io/part-of: enclii
subjects:
  - kind: ServiceAccount
    name: roundhouse
    namespace: enclii
roleRef:
  kind: Role
  name: roundhouse-builder
  apiGroup: rbac.authorization.k8s.io

---
# Fixed Argo installation inventory reads; no self-management or workload changes.
# The sole namespace-scoped list is StatefulSets in argocd for complete HA-layout
# observation (Limit 16; truncated, unknown and mixed layouts remain HELD).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: switchyard-argocd-inventory-reader
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: inventory
    enclii.dev/managed-by: platform
  namespace: argocd
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts
  resourceNames:
  - argocd-application-controller
  - argocd-applicationset-controller
  - argocd-dex-server
  - argocd-notifications-controller
  - argocd-redis
  - argocd-redis-ha
  - argocd-redis-ha-haproxy
  - argocd-repo-server
  - argocd-server
  verbs:
  - get
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  resourceNames:
  - argocd-application-controller
  - argocd-applicationset-controller
  - argocd-dex-server
  - argocd-notifications-controller
  - argocd-redis
  - argocd-redis-ha
  - argocd-redis-ha-haproxy
  - argocd-server
  verbs:
  - get
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  resourceNames:
  - argocd-application-controller
  - argocd-applicationset-controller
  - argocd-dex-server
  - argocd-notifications-controller
  - argocd-redis
  - argocd-redis-ha
  - argocd-redis-ha-haproxy
  - argocd-server
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: switchyard-argocd-inventory-reader
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: inventory
    enclii.dev/managed-by: platform
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: switchyard-argocd-inventory-reader
subjects:
- kind: ServiceAccount
  name: switchyard-api
  namespace: enclii
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: switchyard-argocd-inventory-reader
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: inventory
    enclii.dev/managed-by: platform
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - applications.argoproj.io
  - applicationsets.argoproj.io
  - appprojects.argoproj.io
  verbs:
  - get
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  resourceNames:
  - argocd-application-controller
  - argocd-applicationset-controller
  - argocd-server
  verbs:
  - get
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  resourceNames:
  - argocd-application-controller
  - argocd-applicationset-controller
  - argocd-server
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: switchyard-argocd-inventory-reader
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: inventory
    enclii.dev/managed-by: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: switchyard-argocd-inventory-reader
subjects:
- kind: ServiceAccount
  name: switchyard-api
  namespace: enclii
