# Stuck-runner watchdog
#
# ARC's EphemeralRunner CRs sometimes stay in `Running` status long after
# the GitHub job they reference has completed. When all max-capacity
# slots get pinned to these zombies, the listener sees no room for new
# runners and queued jobs stall indefinitely (observed ~2x in a 90-min
# window on 2026-04-19). Manual fix: `kubectl delete ephemeralrunner <name>`.
#
# This CronJob automates the safe subset of that fix. Every 5 min, list
# EphemeralRunners and delete:
#   - CRs older than 20 min whose matching runner pod no longer exists or is
#     no longer Running.
#   - CRs older than 20 min whose runner logs show GitHub has cancelled or lost
#     the runner registration but the runner process has not exited.
#   - CRs older than 4h even if their matching pod still says Running.
#
# It intentionally does NOT delete a live Running pod at the 20-min mark:
# Playwright/e2e and multi-image deploy jobs can legitimately exceed that.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stuck-runner-watchdog
  namespace: arc-runners
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: platform-watchdog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stuck-runner-watchdog
  namespace: arc-runners
rules:
  - apiGroups: ["actions.github.com"]
    resources: ["ephemeralrunners"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stuck-runner-watchdog
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: stuck-runner-watchdog
    namespace: arc-runners
roleRef:
  kind: Role
  name: stuck-runner-watchdog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stuck-runner-watchdog
  namespace: arc-runners
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: platform-watchdog
spec:
  # Every 5 minutes. 20-min age threshold inside the script, so worst
  # case a stuck runner is cleared within 25 min total.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: stuck-runner-watchdog
        spec:
          restartPolicy: Never
          serviceAccountName: stuck-runner-watchdog
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              # bitnamilegacy preserves pinned debian-12 tags; bitnami/kubectl only publishes `latest` since Aug 2025.
              image: bitnamilegacy/kubectl:1.33.4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -ec
                - |
                  set -euo pipefail
                  ORPHAN_THRESHOLD_SEC=1200  # 20 minutes
                  RUNNING_THRESHOLD_SEC=14400 # 4 hours

                  delete_ephemeralrunner() {
                    target="$1"
                    for delay in 1 2 4 8 16 32; do
                      if kubectl -n arc-runners delete ephemeralrunner "$target" --ignore-not-found; then
                        return 0
                      fi
                      echo "  warn: delete failed for $target; retrying in ${delay}s" >&2
                      sleep "$delay"
                    done
                    echo "  error: failed to delete stale EphemeralRunner $target after retries" >&2
                    return 1
                  }

                  # List all EphemeralRunners with creation timestamp +
                  # the workflow run they reference (if any).
                  kubectl -n arc-runners get ephemeralrunners \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.creationTimestamp}{"|"}{.status.phase}{"|"}{.status.workflowRunId}{"\n"}{end}' \
                    | while IFS='|' read -r name created phase run_id; do
                      [ -z "$name" ] && continue

                      # Use GNU date semantics via `date --date=` ; bitnami/kubectl
                      # ships debian-slim which has GNU date.
                      created_sec=$(date -d "$created" +%s)
                      now=$(date +%s)
                      age=$(( now - created_sec ))

                      pod_phase=""
                      pod_lookup="$(kubectl -n arc-runners get pod "$name" -o jsonpath='{.status.phase}' 2>&1)" || {
                        if echo "$pod_lookup" | grep -Eiq 'not found|NotFound'; then
                          pod_phase="missing"
                        else
                          echo "  warn: could not read pod for $name; leaving runner untouched this cycle" >&2
                          continue
                        fi
                      }
                      pod_phase="${pod_phase:-${pod_lookup:-missing}}"
                      echo "candidate: $name (age ${age}s, er_phase=${phase:-unknown}, pod_phase=${pod_phase:-missing}, workflow_run=${run_id:-none})"

                      # If no jobWorkflowRunId, it's a fresh CR waiting — leave alone.
                      # (Stuck CRs have a run_id from a long-completed workflow.)
                      if [ -z "$run_id" ]; then
                        echo "  skip: no workflow run id"
                        continue
                      fi

                      if [ "${pod_phase:-missing}" = "Running" ] && [ "$age" -ge "$ORPHAN_THRESHOLD_SEC" ]; then
                        runner_log="$(kubectl -n arc-runners logs "$name" -c runner --tail=80 2>/dev/null || true)"
                        if echo "$runner_log" | grep -Eq 'Registration .* was not found|Job cancellation request'; then
                          echo "  deleting stale EphemeralRunner $name after runner log showed cancellation or missing registration"
                          delete_ephemeralrunner "$name"
                          continue
                        fi
                      fi

                      if [ "${pod_phase:-missing}" = "Running" ] && [ "$age" -lt "$RUNNING_THRESHOLD_SEC" ]; then
                        echo "  skip: matching pod is still Running and below ${RUNNING_THRESHOLD_SEC}s hard ceiling"
                        continue
                      fi

                      if [ "${pod_phase:-missing}" != "Running" ] && [ "$age" -lt "$ORPHAN_THRESHOLD_SEC" ]; then
                        echo "  skip: non-running/missing pod is below ${ORPHAN_THRESHOLD_SEC}s orphan threshold"
                        continue
                      fi

                      echo "  deleting stale EphemeralRunner $name"
                      delete_ephemeralrunner "$name"
                  done
              terminationMessagePolicy: FallbackToLogsOnError
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
