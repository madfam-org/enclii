# Stuck-runner watchdog
#
# ARC's EphemeralRunner CRs sometimes stay in `Running` status long after
# the GitHub job they reference has completed. When all max-capacity
# slots get pinned to these zombies, the listener sees no room for new
# runners and queued jobs stall indefinitely (observed ~2x in a 90-min
# window on 2026-04-19). Manual fix: `kubectl delete ephemeralrunner <name>`.
#
# This CronJob automates the safe subset of that fix. Every 5 min, list
# EphemeralRunners and delete:
#   - CRs older than 20 min whose matching runner pod no longer exists or is
#     no longer Running.
#   - CRs older than 20 min whose runner logs show GitHub has cancelled or lost
#     the runner registration but the runner process has not exited.
#   - CRs older than 4h even if their matching pod still says Running.
#
# It intentionally does NOT delete a live Running pod at the 20-min mark:
# Playwright/e2e and multi-image deploy jobs can legitimately exceed that.
#
# Scale limits (added 2026-08-10 after this watchdog slept through an outage):
# every cycle reads at most MAX_SCAN EphemeralRunners via an explicit API
# `limit`, and reads pods once in bulk rather than once per runner. Both were
# unbounded before, and both failure modes are backlog-proportional — the
# watchdog worked fine in normal conditions and died in exactly the conditions
# it exists to detect. It reported nothing while doing so, which is why the
# bounded path now logs a loud BACKLOG line instead of exiting non-zero.
#
# This watchdog clears stuck runners. It does NOT page anyone; see
# pool-health-alert.yaml for the detector that does.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stuck-runner-watchdog
  namespace: arc-runners
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: platform-watchdog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stuck-runner-watchdog
  namespace: arc-runners
rules:
  - apiGroups: ["actions.github.com"]
    resources: ["ephemeralrunners"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stuck-runner-watchdog
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: stuck-runner-watchdog
    namespace: arc-runners
roleRef:
  kind: Role
  name: stuck-runner-watchdog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stuck-runner-watchdog
  namespace: arc-runners
  labels:
    app.kubernetes.io/managed-by: enclii
    app.kubernetes.io/component: platform-watchdog
spec:
  # Every 5 minutes. 20-min age threshold inside the script, so worst
  # case a stuck runner is cleared within 25 min total.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: stuck-runner-watchdog
        spec:
          restartPolicy: Never
          serviceAccountName: stuck-runner-watchdog
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              # bitnamilegacy preserves pinned debian-12 tags; bitnami/kubectl only publishes `latest` since Aug 2025.
              image: bitnamilegacy/kubectl:1.33.4@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -ec
                - |
                  set -euo pipefail
                  ORPHAN_THRESHOLD_SEC=1200  # 20 minutes
                  RUNNING_THRESHOLD_SEC=14400 # 4 hours
                  # Hard ceiling on how many EphemeralRunners we will pull in one
                  # cycle. This bounds peak memory by construction rather than by
                  # hoping the limit is generous enough — see the backlog guard
                  # below for why that distinction cost us an outage.
                  MAX_SCAN=400
                  # Overridable so tests/scripts/test_stuck_runner_watchdog.py can
                  # point at a fixture dir. In the cluster nothing sets it and the
                  # projected volume path below is used.
                  SERVICEACCOUNT_DIR="${SERVICEACCOUNT_DIR:-/var/run/secrets/kubernetes.io/serviceaccount}"
                  KUBE_API="https://${KUBERNETES_SERVICE_HOST:-kubernetes.default.svc}:${KUBERNETES_SERVICE_PORT:-443}"
                  KUBECTL=(
                    kubectl
                    --server="$KUBE_API"
                    --certificate-authority="${SERVICEACCOUNT_DIR}/ca.crt"
                    --token="$(cat "${SERVICEACCOUNT_DIR}/token")"
                  )

                  delete_ephemeralrunner() {
                    target="$1"
                    for delay in 1 2 4 8 16 32; do
                      if "${KUBECTL[@]}" --request-timeout=10s -n arc-runners delete ephemeralrunner "$target" --ignore-not-found; then
                        return 0
                      fi
                      echo "  warn: delete failed for $target; retrying in ${delay}s" >&2
                      sleep "$delay"
                    done
                    echo "  error: failed to delete stale EphemeralRunner $target after retries" >&2
                    return 1
                  }

                  cleanup_ephemeralrunner() {
                    target="$1"
                    if ! delete_ephemeralrunner "$target"; then
                      echo "  warn: leaving $target for the next watchdog cycle after cleanup retries were exhausted" >&2
                    fi
                  }

                  runner_worker_state() {
                    target="$1"
                    output="$("${KUBECTL[@]}" --request-timeout=10s -n arc-runners exec "$target" -c runner -- /bin/sh -c 'if ps -eo args | grep "[R]unner.Worker" >/dev/null; then echo active; else echo inactive; fi' 2>&1)" || {
                      echo "  warn: could not inspect runner worker process for $target; leaving runner untouched this cycle: $output" >&2
                      echo "unknown"
                      return 0
                    }

                    case "$output" in
                      active|inactive)
                        echo "$output"
                        ;;
                      *)
                        echo "  warn: unexpected runner worker inspection output for $target; leaving runner untouched this cycle: $output" >&2
                        echo "unknown"
                        ;;
                    esac
                  }

                  # Fetch EphemeralRunners through the raw API with an explicit
                  # `limit`, NOT `kubectl get ephemeralrunners`.
                  #
                  # Why: an EphemeralRunner CR is ~5.8 KB because it embeds the
                  # whole runner pod template. An unbounded list of 3,149 of them
                  # is ~18 MB of JSON, and kubectl's deserialization multiplies
                  # that several times over — far past this container's limit. On
                  # 2026-08-10 that is exactly what happened: every cycle was
                  # OOMKilled while the pool sat at 3,149 stuck runners. The
                  # watchdog died precisely when it was needed, and stayed dead
                  # for the whole outage. `limit` makes that structurally
                  # impossible instead of merely unlikely.
                  ER_API="/apis/actions.github.com/v1alpha1/namespaces/arc-runners/ephemeralrunners"
                  er_page="$("${KUBECTL[@]}" --request-timeout=30s get --raw "${ER_API}?limit=${MAX_SCAN}")"

                  # A `continue` token means the namespace holds more than
                  # MAX_SCAN runners. That is a backlog, not a stuck runner, and
                  # this watchdog cannot drain it one delete at a time — 3,149
                  # deletes at ~10s timeouts would outrun the */5 schedule while
                  # concurrencyPolicy: Forbid silently skipped every later cycle.
                  # Say so loudly and keep working on the bounded page; the
                  # arc-pool-health CronJob is what pages a human for this.
                  if [ -n "$(printf '%s' "$er_page" | jq -r '.metadata.continue // ""')" ]; then
                    echo "BACKLOG: more than ${MAX_SCAN} EphemeralRunners present; scanning the first ${MAX_SCAN} only." >&2
                    echo "BACKLOG: a backlog this size means runners are not registering — check for phase=Outdated and see runbooks/arc-runner-image-rebuild.md" >&2
                  fi

                  # One bulk pod read per cycle instead of one per runner. The old
                  # code issued a `get pod` per EphemeralRunner: at 3,149 runners
                  # that is 3,149 sequential round trips at a 10s timeout, which
                  # could never finish inside a 5-minute schedule even with
                  # unlimited memory. Absence from this map means the pod is gone.
                  pod_phases="$("${KUBECTL[@]}" --request-timeout=30s -n arc-runners get pods \
                    -o jsonpath='{range .items[*]}{.metadata.name}={.status.phase}{"\n"}{end}')" || {
                    echo "error: could not list pods; skipping this cycle rather than guessing pod state" >&2
                    exit 0
                  }

                  printf '%s' "$er_page" \
                    | jq -r '.items[] | [.metadata.name, .metadata.creationTimestamp, (.status.phase // ""), (.status.workflowRunId // "")] | join("|")' \
                    | while IFS='|' read -r name created phase run_id; do
                      [ -z "$name" ] && continue

                      # Use GNU date semantics via `date --date=` ; bitnami/kubectl
                      # ships debian-slim which has GNU date.
                      created_sec=$(date -d "$created" +%s)
                      now=$(date +%s)
                      age=$(( now - created_sec ))

                      # Look the pod up in the map fetched once above. The bulk
                      # read already succeeded (we exit the cycle otherwise), so
                      # a name that is absent genuinely has no pod — there is no
                      # "API error" case left to confuse with "missing".
                      pod_phase="$(printf '%s\n' "$pod_phases" | grep -m1 -F "${name}=" | cut -d= -f2- || true)"
                      pod_phase="${pod_phase:-missing}"
                      echo "candidate: $name (age ${age}s, er_phase=${phase:-unknown}, pod_phase=${pod_phase:-missing}, workflow_run=${run_id:-none})"

                      # If no jobWorkflowRunId, it's a fresh CR waiting — leave alone.
                      # (Stuck CRs have a run_id from a long-completed workflow.)
                      if [ -z "$run_id" ]; then
                        echo "  skip: no workflow run id"
                        continue
                      fi

                      if [ "${pod_phase:-missing}" = "Running" ] && [ "$age" -ge "$ORPHAN_THRESHOLD_SEC" ]; then
                        worker_state="$(runner_worker_state "$name")"
                        if [ "$worker_state" = "inactive" ]; then
                          echo "  deleting stale EphemeralRunner $name after assigned runner had no active worker process"
                          cleanup_ephemeralrunner "$name"
                          continue
                        fi

                        runner_log="$("${KUBECTL[@]}" --request-timeout=10s -n arc-runners logs "$name" -c runner --tail=80 2>/dev/null || true)"
                        if echo "$runner_log" | grep -Eq 'Registration .* was not found|Job cancellation request'; then
                          echo "  deleting stale EphemeralRunner $name after runner log showed cancellation or missing registration"
                          cleanup_ephemeralrunner "$name"
                          continue
                        fi
                      fi

                      if [ "${pod_phase:-missing}" = "Running" ] && [ "$age" -lt "$RUNNING_THRESHOLD_SEC" ]; then
                        echo "  skip: matching pod is still Running and below ${RUNNING_THRESHOLD_SEC}s hard ceiling"
                        continue
                      fi

                      if [ "${pod_phase:-missing}" != "Running" ] && [ "$age" -lt "$ORPHAN_THRESHOLD_SEC" ]; then
                        echo "  skip: non-running/missing pod is below ${ORPHAN_THRESHOLD_SEC}s orphan threshold"
                        continue
                      fi

                      echo "  deleting stale EphemeralRunner $name"
                      cleanup_ephemeralrunner "$name"
                  done
              terminationMessagePolicy: FallbackToLogsOnError
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  # 128Mi was not enough to deserialize a large EphemeralRunner
                  # list and the container was OOMKilled every cycle through the
                  # 2026-08-10 outage. The real fix is the `limit=MAX_SCAN` page
                  # in the script — this is headroom, not the mechanism. Raising
                  # it alone would only have moved the cliff from 3,149 runners
                  # to some larger number and left the same failure waiting.
                  cpu: 100m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
