# Source: gha-runner-scale-set/templates/autoscalingrunnerset.yaml
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: madfam-runners-blue
  namespace: arc-runners
  labels:
    app.kubernetes.io/component: "autoscaling-runner-set"
    helm.sh/chart: gha-rs-0.14.0
    app.kubernetes.io/name: madfam-runners-blue
    app.kubernetes.io/instance: madfam-runners-blue
    app.kubernetes.io/version: "0.14.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: madfam-runners-blue
    actions.github.com/scale-set-namespace: arc-runners
  annotations:
    actions.github.com/values-hash: 0d1e35d3aeb08226581d53f64236ad81fae07dcd90f75dd8cd8c5a597f79990
    actions.github.com/cleanup-manager-role-binding: madfam-runners-blue-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: madfam-runners-blue-gha-rs-manager

spec:
  githubConfigUrl: https://github.com/madfam-org
  githubConfigSecret: github-app-secret
  runnerScaleSetName: madfam-runners-blue
  maxRunners: 20
  minRunners: 1
  listenerTemplate:
    spec:
      containers:
      - name: listener
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault

  template:
    metadata:
      labels:
        arc.enclii.dev/active: "true"
        arc.enclii.dev/color: blue
      annotations:
        arc.enclii.dev/deployed-at: ""
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      nodeSelector: 
        role: builder
      terminationGracePeriodSeconds: 
        300
      tolerations: 
        - effect: NoSchedule
          key: builder
          operator: Equal
          value: "true"
      restartPolicy: Never
      serviceAccountName: arc-runner
      initContainers:
      - name: init-dind-externals
        
        image: ghcr.io/madfam-org/enclii/arc-runner:stable@sha256:73e54271d5484955955da8bcf711002dddca9b87b25d8344cb3e21c305040b69
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker:dind@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        resources:
          requests:
            # Same defect as the runner container: kubelet's eviction message
            # named BOTH ("Container dind was using 80Ki, request is 0"). The
            # figure is small because the shared `work` volume holds the bulk,
            # but a container with request 0 is always an eviction candidate.
            # Deliberately no cpu/memory request added here — the builder nodes
            # already sit at 94-95% CPU and changing their scheduling weight is
            # a separate decision from stopping disk evictions.
            ephemeral-storage: 2Gi
          limits:
            ephemeral-storage: 8Gi
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command:
              - docker
              - info
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
      containers:
      - name: runner
        
        command: 
          - /home/runner/run.sh
        image: 
          ghcr.io/madfam-org/enclii/arc-runner:stable@sha256:73e54271d5484955955da8bcf711002dddca9b87b25d8344cb3e21c305040b69
        imagePullPolicy: 
          Always
        resources:
          limits:
            cpu: 1500m
            memory: 6Gi
            # Cap a runaway job's disk instead of letting it take the node — and
            # with it every other runner scheduled there. Raised 12Gi -> 16Gi
            # alongside the request: peak measured usage was 8.11Gi with a browser
            # download, apt packages and two service containers on one runner, and
            # 12Gi left too little headroom above that for a heavier E2E shard.
            ephemeral-storage: 16Gi
          requests:
            cpu: 400m
            memory: 2Gi
            # LOAD-BEARING. Without an ephemeral-storage REQUEST the scheduler
            # scores this pod's disk usage as zero, packs runners onto a node
            # without accounting for their checkouts, and kubelet then evicts
            # whichever pods exceed their request once the node crosses its
            # eviction threshold (~12Gi free). Every runner exceeds zero, so
            # every runner is a candidate.
            #
            # Measured 2026-08-07: four runners evicted from foundry-builder-01
            # inside 20 minutes, each reported by kubelet as
            # "Container runner was using ~3073816Ki, request is 0".
            #
            # This is what a dying runner looks like from GitHub's side: no step
            # is marked `failure`, the in-flight step and everything after are
            # recorded not-run, and logs return BlobNotFound because the runner
            # died before uploading. It is indistinguishable from a flaky test,
            # and it was misdiagnosed as one across several repositories.
            #
            # RAISED 6Gi -> 10Gi on 2026-08-07 after E2E runners kept dying while
            # every other job type survived. Measured live on foundry-builder-01
            # through the kubelet summary API: concurrent runners were using 8.11,
            # 7.14, 6.81, 5.06, 2.69 and 0.90 Gi. The heavy ones EXCEED a 6Gi
            # request, and kubelet evicts pods over their request first — so the
            # Playwright E2E pods were structurally always the victims, which is
            # exactly the selectivity observed (three incidents in seven hours,
            # never Build, Lint or Security Scan).
            #
            # That node was at 184/225Gi used with 31.8Gi free — near the 10% hard
            # eviction threshold — with nine runners packed on it while
            # foundry-worker-01 sat at 31% with 62Gi free. A 10Gi request covers
            # real peak usage AND thins packing density (~22 slots instead of 37),
            # so the node stops being driven into its own threshold.
            ephemeral-storage: 10Gi
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
      
      volumes:
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      
      - name: work
        emptyDir:
          # Bound the workspace so a runaway checkout fails ITS OWN step with a
          # clear disk error, instead of silently inflating the pod's ephemeral
          # usage until kubelet evicts the whole runner mid-job — the
          # BlobNotFound / no-step-marked-failure signature that reads as a flaky
          # test. Deliberately below the 16Gi container limit.
          sizeLimit: 14Gi
