# Source: gha-runner-scale-set-controller/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-controller-gha-rs-controller
  namespace: arc-system
  labels:
    helm.sh/chart: gha-rs-controller-0.14.0
    app.kubernetes.io/name: gha-rs-controller
    app.kubernetes.io/namespace: arc-system
    app.kubernetes.io/instance: arc-controller
    app.kubernetes.io/version: "0.14.0"
    app.kubernetes.io/part-of: gha-rs-controller
    app.kubernetes.io/managed-by: Helm
    actions.github.com/controller-service-account-namespace: arc-system
    actions.github.com/controller-service-account-name: arc-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gha-rs-controller
      app.kubernetes.io/namespace: arc-system
      app.kubernetes.io/instance: arc-controller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: "manager"
      labels:
        app.kubernetes.io/part-of: gha-rs-controller
        app.kubernetes.io/component: controller-manager
        app.kubernetes.io/version: 0.14.0
        app.kubernetes.io/name: gha-rs-controller
        app.kubernetes.io/namespace: arc-system
        app.kubernetes.io/instance: arc-controller
    spec:
      serviceAccountName: arc-controller
      containers:
      - name: manager
        image: "ghcr.io/actions/gha-runner-scale-set-controller:0.14.0"
        imagePullPolicy: IfNotPresent
        args:
        - "--auto-scaling-runner-set-only"
        - "--enable-leader-election"
        - "--leader-election-id=arc-controller-gha-rs-controller"
        - "--log-level=info"
        - "--log-format=json"
        - "--runner-max-concurrent-reconciles=2"
        - "--update-strategy=immediate"
        - "--listener-metrics-addr="
        - "--listener-metrics-endpoint="
        - "--metrics-addr=:8080"
        command:
        - "/manager"
        ports:
        - containerPort: 8080
          protocol: TCP
          name: metrics
        env:
        - name: CONTROLLER_MANAGER_CONTAINER_IMAGE
          value: "ghcr.io/actions/gha-runner-scale-set-controller:0.14.0"
        - name: CONTROLLER_MANAGER_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
        securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      terminationGracePeriodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: gha-rs-controller
              topologyKey: kubernetes.io/hostname
            weight: 100
