---
# CNPG R2 backup credentials.
#
# This creates the secret shape expected by
# cluster.yaml spec.backup.barmanObjectStore.s3Credentials without committing
# credential material to Git. The source Secret is the same R2 backup
# credential used by the existing logical backup CronJobs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cnpg-r2-credentials
  namespace: data
  labels:
    app.kubernetes.io/name: postgres-ha
    app.kubernetes.io/component: database-ha
    app.kubernetes.io/part-of: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: data-kubernetes-store
    kind: ClusterSecretStore
  target:
    name: cnpg-r2-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: r2-backup-credentials
        property: access-key-id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: r2-backup-credentials
        property: secret-access-key
