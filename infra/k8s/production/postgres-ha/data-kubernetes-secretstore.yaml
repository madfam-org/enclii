---
# Kubernetes-backed secret source for data namespace backup credentials.
#
# The active R2 backup credential source is data/r2-backup-credentials. This
# ClusterSecretStore lets ESO derive CNPG's expected Secret shape from that
# existing credential without duplicating credential material in Git.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: data-kubernetes-store
  labels:
    app.kubernetes.io/name: postgres-ha
    app.kubernetes.io/component: database-ha
    app.kubernetes.io/part-of: enclii
spec:
  provider:
    kubernetes:
      remoteNamespace: data
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
