---
# Fluent Bit - Log collector and forwarder
# Deployed as DaemonSet on every node (including builder) to collect pod logs
# and forward them to Loki with Kubernetes metadata enrichment.
#
# Two parsers:
#   - logrus: regex parser for switchyard-api/CLI text logs
#   - zap:    JSON parser for roundhouse/waybill structured logs
#
# Log path: /var/log/pods/ (standard K8s pod log directory)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
      - nodes/proxy
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging
---
# Fluent Bit parsers configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-parsers
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
data:
  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

    # Logrus text format (switchyard-api, CLI)
    # Example: time="2026-03-20T10:15:30Z" level=info msg="Server started" port=4200
    [PARSER]
        Name        logrus
        Format      regex
        Regex       ^time="(?<time>[^"]+)" level=(?<level>[^ ]+) msg="(?<message>[^"]*)"(?<extra>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%SZ
        Time_Keep   On

    # Zap JSON format (roundhouse, waybill)
    # Example: {"level":"info","ts":1711000000.123,"caller":"main.go:42","msg":"Build started"}
    [PARSER]
        Name        zap
        Format      json
        Time_Key    ts
        Time_Format %s.%L
        Time_Keep   On
---
# Fluent Bit pipeline configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush           5
        Log_Level       info
        Daemon          off
        Parsers_File    /fluent-bit/etc/parsers.conf
        HTTP_Server     On
        HTTP_Listen     0.0.0.0
        HTTP_Port       2020
        Health_Check    On
        HC_Errors_Count 5
        HC_Retry_Failure_Count 5
        HC_Period       60
        storage.path    /var/fluent-bit/state
        storage.sync    normal
        storage.checksum off
        storage.max_chunks_up 128

    # Tail all pod logs from the standard K8s log path
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/pods/*/*/*.log
        Parser            cri
        DB                /var/fluent-bit/state/tail-pods.db
        DB.locking        true
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        Rotate_Wait       30
        Read_from_Head    false
        # Stat-based scanning, no inotify. Running as root (required to read
        # 0750 root:root /var/log/pods) the process shares uid 0's node-wide
        # fs.inotify.max_user_instances quota with kubelet/containerd/journald;
        # inotify_init failed with EMFILE the moment the permission fix landed
        # and the pod crashlooped. Polling costs a little CPU and up to
        # Refresh_Interval seconds of pickup latency for NEW files; it needs no
        # inotify instance at all. (2026-07-28 blackout follow-up.)
        Inotify_Watcher   false

    # Enrich with Kubernetes metadata (namespace, pod, container, labels)
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.pods.
        Merge_Log           On
        Merge_Log_Key       parsed
        Keep_Log            On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Labels              On
        Annotations         Off
        Buffer_Size         0

    # Lift nested kubernetes metadata for Loki label extraction
    [FILTER]
        Name          nest
        Match         kube.*
        Operation     lift
        Nested_under  kubernetes

    # Forward to Loki
    [OUTPUT]
        Name                 loki
        Match                kube.*
        Host                 loki.logging.svc.cluster.local
        Port                 3100
        Labels               job=fluent-bit
        Label_Keys           $namespace_name,$pod_name,$container_name
        Remove_Keys          logtag,stream
        Auto_Kubernetes_Labels Off
        Line_Format          json
        Retry_Limit          5
        Workers              2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        app.kubernetes.io/component: logging
        app.kubernetes.io/part-of: enclii
      annotations:
        # Trigger rolling restart when config changes. NOTE: these are literal
        # strings, not real checksums — a ConfigMap edit does NOT roll pods by
        # itself. Bump the rev suffix in the same commit as any config change
        # (2026-07-28: rev bumped for Inotify_Watcher false).
        checksum/config: "fluent-bit-config-r2"
        checksum/parsers: "fluent-bit-parsers"
    spec:
      serviceAccountName: fluent-bit
      # Run on all nodes including builder
      tolerations:
        - key: builder
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Pod-level security
      # Node log collection requires root: /var/log/pods is 0750 root:root on
      # the foundry nodes, so uid 1000 can neither traverse nor read it and
      # fluent-bit tailed zero files from 2026-06-03 until this fix (see
      # internal-devops runbooks/2026-07-28-loki-ingestion-blackout.md).
      # Root + drop-ALL caps + readOnlyRootFilesystem is the upstream
      # fluent-bit/promtail posture for node log agents. Admission is covered
      # by the logging-stack PolicyException (require-run-as-nonroot).
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: docker.io/fluent/fluent-bit:3.2.4@sha256:a185ac0516e1f35568ff0662f12c4ada0ea38c4300ed223d0fde485599dff5b5
          ports:
            - name: http-metrics
              containerPort: 2020
              protocol: TCP
          # Container-level security
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: parsers
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/fluent-bit/state
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http-metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: parsers
          configMap:
            name: fluent-bit-parsers
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        # Ephemeral state for tail DB and buffering
        - name: state
          emptyDir:
            sizeLimit: 128Mi
