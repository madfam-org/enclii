---
# Loki - Log aggregation engine
# Single-binary mode (monolithic) suitable for small clusters.
# Receives logs from Fluent Bit, stores on Longhorn PVC, retains for 48h.
#
# Retention was 168h (7 days) until 2026-08-07. It was cut to 48h after the
# 5Gi volume filled with 10.9Gi of Longhorn SNAPSHOTS (actualSize 218% of
# nominal) and Loki deadlocked at startup building tsdb from WALs -- it dies
# before reaching the compactor that would free space, so it cannot recover on
# its own at any timescale. See limits_config below and
# internal-devops runbooks/2026-08-07-loki-snapshot-exhaustion.md.
#
# Query via Grafana (add Loki datasource: http://loki.logging.svc.cluster.local:3100)
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      log_level: warn
      grpc_server_max_recv_msg_size: 8388608
      grpc_server_max_send_msg_size: 8388608

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2026-03-20"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      filesystem:
        directory: /loki/chunks
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem

    limits_config:
      # SIZING MUST AGREE WITH THE VOLUME. On 2026-08-07 this asked for 168h of
      # retention at up to 10 MB/s ingestion while volumeClaimTemplates requested
      # 5Gi. Those cannot both be true for a 40-namespace cluster: even a small
      # fraction of the permitted rate fills 5Gi in well under a day. Loki filled
      # the volume and began failing at STARTUP --
      #   error initialising module: store
      #   mkdir /loki/tsdb-index/scratch/...: no space left on device
      # -- which is a DEADLOCK, not slow degradation: it dies while building tsdb
      # from WALs, so it never reaches the compactor that would delete old data.
      # It sat at 933 restarts and could not have recovered on its own.
      #
      # The cost was not "no logs". Centralised logging was the only surface that
      # would have reported a failed rollout, so while this was down a dhanam
      # prod promote failed ~17h and meridian's API stayed down ~12d, unnoticed.
      # See internal-devops runbooks/2026-08-07-failed-rollout-sweep.md
      retention_period: 48h
      ingestion_rate_mb: 2
      ingestion_burst_size_mb: 4
      max_streams_per_user: 10000
      max_entries_limit_per_query: 5000
      max_query_series: 500
      reject_old_samples: true
      reject_old_samples_max_age: 48h

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: loki
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
spec:
  replicas: 1
  serviceName: loki
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: logging
        app.kubernetes.io/part-of: enclii
      annotations:
        checksum/config: "loki-config"
    spec:
      serviceAccountName: loki
      # Pod-level security
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Avoid scheduling on builder node (saves builder resources for CI)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: builder
                    operator: DoesNotExist
      containers:
        - name: loki
          image: docker.io/grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
          args:
            - -config.file=/etc/loki/loki.yaml
            - -target=all
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          # Container-level security
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki.yaml
              subPath: loki.yaml
              readOnly: true
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: loki-config
        # Loki needs a writable /tmp for WAL and temp files
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  # Persistent volume for log data (Longhorn CSI)
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: loki
          app.kubernetes.io/component: logging
          app.kubernetes.io/part-of: enclii
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            # STAYS 5Gi. An earlier draft of this PR raised it to 20Gi; that was
            # wrong. The volume was never too small -- it held 10.9 Gi of
            # SNAPSHOTS on 5 Gi of nominal space (actualSize 218%), because the
            # `default` recurring-job group retains 7 daily snapshots and Loki
            # rewrites its TSDB index constantly, so each one approached a full
            # copy. A 20 Gi volume would simply have grown 20 Gi of snapshots and
            # failed identically a few weeks later.
            #
            # The real fixes are the retention above (48h, 2 MB/s ingest cap) and
            # the `high-churn` recurring-job group in
            # infra/helm/longhorn/recurring-jobs.yaml, which retains 2 local
            # snapshots instead of 7. With both, 5 Gi is comfortable.
            storage: 5Gi
---
# ServiceAccount for Loki (minimal — no cluster-wide access needed)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
---
# NetworkPolicy: default deny all in logging namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: logging
  labels:
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# NetworkPolicy: Loki ingress - accept logs from Fluent Bit and queries from Grafana
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-ingress
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    # From Fluent Bit (log ingestion)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fluent-bit
      ports:
        - protocol: TCP
          port: 3100
    # From Grafana in monitoring namespace (log queries)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 3100
---
# NetworkPolicy: Loki egress - DNS only (filesystem storage, no external calls)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-egress
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Egress
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
---
# NetworkPolicy: Fluent Bit egress - DNS, Loki, K8s API (for metadata)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fluent-bit-egress
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  policyTypes:
    - Egress
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # Loki (log forwarding)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
    # Kubernetes API server (metadata enrichment)
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
