# Merge-only Vault sync for Roundhouse ↔ Switchyard shared secret.
# Does not replace the manually shaped enclii-secrets keys (database-url, etc.).
# Requires Vault secret/enclii/internal_api_key (backfill via scripts/backfill-vault-path-from-k8s-secret.sh).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enclii-internal-api-key
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: enclii-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: internal-api-key
      remoteRef:
        key: secret/enclii
        property: internal_api_key
