# Merge-only sync for Roundhouse ↔ Switchyard shared secret.
# Interim: kubernetes-store reads canonical source secret until Vault
# secret/enclii/internal_api_key is backfilled (scripts/ga-o10-enclii-vault-backfill.sh).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enclii-internal-api-key
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: ClusterSecretStore
  target:
    name: enclii-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: internal-api-key
      remoteRef:
        key: enclii-internal-api-key-source
        property: internal-api-key
