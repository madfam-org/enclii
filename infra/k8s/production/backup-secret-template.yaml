# ==============================================================================
# Backup Secrets Template (Longhorn + PostgreSQL)
# ==============================================================================
#
# INSTRUCTIONS:
# 1. Replace all REPLACE_ME values with your actual R2 credentials
# 2. Apply both secrets:
#      kubectl apply -f backup-secret-template.yaml
# 3. Longhorn will pick up the backup target from values.yaml automatically
# 4. PostgreSQL CronJob references r2-backup-credentials in data namespace
#
# To create R2 credentials:
#   1. Go to Cloudflare Dashboard → R2
#   2. Create bucket: enclii-backups
#   3. Go to Manage R2 API Tokens
#   4. Create token with Object Read & Write permissions
#   5. Copy Account ID, Access Key ID, and Secret Access Key
#
# ==============================================================================

# Longhorn backup credentials (longhorn-system namespace)
apiVersion: v1
kind: Secret
metadata:
  name: longhorn-backup-secret
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_ENDPOINTS: "https://REPLACE_ME.r2.cloudflarestorage.com"

---
# PostgreSQL backup credentials (data namespace)
apiVersion: v1
kind: Secret
metadata:
  name: r2-backup-credentials
  namespace: data
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
type: Opaque
stringData:
  account-id: "REPLACE_ME"
  access-key-id: "REPLACE_ME"
  secret-access-key: "REPLACE_ME"
