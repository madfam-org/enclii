---
# Object-store credential for managed-Postgres addon backups, projected from
# Vault.
#
# WHY THIS EXISTS (2026-10-26). switchyard-api replicates
# enclii/enclii-db-backup-credentials into every addon namespace, because CNPG
# resolves barmanObjectStore.s3Credentials in the Cluster's own namespace
# (apps/switchyard-api/internal/addons/postgres_backup.go). That source Secret
# had no writer of record and had never existed, so no addon had ever been
# backed up and AddonBackupNeverCompleted fired for every live addon cluster.
#
# ONE WRITER. The values live at secret/enclii:addon_backup_access_key_id and
# secret/enclii:addon_backup_secret_access_key. Their only writer is the intake
# target `enclii/addon-db-backups`
# (apps/switchyard-api/internal/secretsintake/registry.yaml). The token is an R2 API token scoped to
# the enclii-addon-db-backups bucket only (docs/runbooks/ADDON_BACKUPS.md).
#
# BEFORE THE FIRST SUBMIT this reports SecretSyncedError and the Secret does
# not exist. That is the safe state: the provisioner and the reconciler's
# backup sweep refuse to write any backup stanza without it, and log the
# unprotected count at ERROR on every sweep.
#
# AFTER IT, within one reconciler sweep (about ten minutes), every live, awake
# addon cluster gets the copied credential, a backup-egress NetworkPolicy,
# spec.backup and a daily ScheduledBackup whose first run is immediate.
#
# Keys: the s3Credentials key names the provisioner writes into spec.backup.
# Renaming one breaks every addon's archiving at once; guarded by
# tests/scripts/test_addon_backup_wiring.py.
#
# SHAPE. `dataFrom.extract` reads the secret/enclii path and the template
# writes exactly two keys from it (engineVersion v2, whose default merge policy
# replaces the data: no other property of secret/enclii reaches this Secret,
# which matters because Switchyard copies it into every addon namespace).
#
# NOT FORCE-SYNCED by intake: the intake target names no external_secret, so
# a submit lands within this refreshInterval (15 min), then within one backup
# sweep (10 min). To shorten it, `enclii ops secrets sync-sweep --apply
# --reason "..."` after the submit.
#
# deletionPolicy: Retain, so deleting this ExternalSecret does not pull the
# credential out from under clusters that archive WAL with it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enclii-db-backup-credentials
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: addon-backups
    app.kubernetes.io/part-of: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: enclii-db-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        ACCESS_KEY_ID: "{{ .addon_backup_access_key_id }}"
        SECRET_ACCESS_KEY: "{{ .addon_backup_secret_access_key }}"
  dataFrom:
    - extract:
        key: secret/enclii
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
