---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: switchyard-api
spec:
  template:
    metadata:
      annotations:
        # Reload pods when platform webhook/callback secrets change (Stakater Reloader).
        reloader.stakater.com/auto: "true"
    spec:
      containers:
      - name: switchyard-api
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        env:
        # Production fail-closed gate (IsProduction + callback auth; see callback_auth.go)
        - name: ENCLII_ENV
          value: "production"
        # Redis - K8s internal DNS (locked from external access)
        # Config reads ENCLII_REDIS_HOST/PORT, not URL (see config/config.go:165-167)
        - name: ENCLII_REDIS_HOST
          value: "redis.enclii.svc.cluster.local"
        - name: ENCLII_REDIS_PORT
          value: "6379"
        # Token Expiration - 8 hours for better UX (default: 15 min)
        # See: Investigation - app.enclii.dev Authentication Session Loss (Jan 2026)
        - name: ENCLII_ACCESS_TOKEN_EXPIRE_MINUTES
          value: "480"
        - name: ENCLII_LOG_LEVEL
          value: "warn"
        - name: ENCLII_RATE_LIMIT_REQUESTS_PER_MINUTE
          value: "10000"
        - name: ENCLII_DB_POOL_SIZE
          value: "50"
        - name: ENCLII_CACHE_TTL_SECONDS
          value: "7200"
        - name: ENCLII_ENABLE_PROFILING
          value: "false"
        - name: ENCLII_MAX_REQUEST_SIZE
          value: "10MB"
        # CORS - Allow cross-origin requests from web UI and admin dashboard
        - name: ENCLII_ALLOWED_ORIGINS
          value: "https://app.enclii.dev,https://admin.enclii.dev"
        # SSO Configuration - Janua Integration (Full OIDC mode)
        # Web UI uses OIDC login flow, CLI uses PKCE direct auth
        - name: ENCLII_AUTH_MODE
          value: "oidc"
        # OIDC Provider Configuration
        - name: ENCLII_OIDC_ISSUER
          value: "https://auth.madfam.io"
        - name: ENCLII_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: enclii-oidc-credentials
              key: client-id
        - name: ENCLII_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: enclii-oidc-credentials
              key: client-secret
        - name: ENCLII_OIDC_REDIRECT_URL
          value: "https://api.enclii.dev/v1/auth/callback"
        - name: ENCLII_POST_LOGIN_REDIRECT_URL
          value: "https://app.enclii.dev/auth/callback"
        # External JWKS for CLI/API token validation
        # Note: Janua issues tokens with iss=auth.madfam.io (Operation ALIAS)
        - name: ENCLII_EXTERNAL_JWKS_URL
          value: "https://auth.madfam.io/.well-known/jwks.json"
        - name: ENCLII_EXTERNAL_ISSUER
          value: "https://auth.madfam.io"
        # Janua JWT audience claim (matches Janua's JWT_AUDIENCE default)
        - name: ENCLII_JANUA_AUDIENCE
          value: "janua.dev"
        # Admin email mapping for OIDC providers that don't include roles in JWT
        - name: ENCLII_ADMIN_EMAILS
          value: "admin@madfam.io"
        # Container Registry Credentials (for pushing built images)
        - name: ENCLII_REGISTRY
          value: "ghcr.io/madfam-org"
        - name: ENCLII_REGISTRY_USERNAME
          valueFrom:
            secretKeyRef:
              name: roundhouse-registry-credentials
              key: username
        - name: ENCLII_REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roundhouse-registry-credentials
              key: password
        # GitHub Webhook Secret (for verifying webhook signatures)
        - name: ENCLII_GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: enclii-github-webhook
              key: secret
        # Build Worker Configuration
        - name: ENCLII_BUILD_MODE
          value: "roundhouse"
        - name: ENCLII_ROUNDHOUSE_URL
          value: "http://roundhouse:80"
        - name: ENCLII_ROUNDHOUSE_API_KEY
          valueFrom:
            secretKeyRef:
              name: enclii-secrets
              key: internal-api-key
              optional: true
        - name: ENCLII_SELF_URL
          value: "http://switchyard-api"
        # Janua API URL for GitHub token retrieval
        - name: ENCLII_JANUA_API_URL
          value: "https://auth.madfam.io"
        # Self-serve signup (P3.2 Sprint 1 — disabled-by-default in code)
        - name: ENCLII_SIGNUP_ENABLED
          value: "true"
        # Janua admin/service token for the on-behalf GitHub-link OAuth calls
        # during signup. Required whenever ENCLII_SIGNUP_ENABLED=true (config.Load
        # fails fast otherwise). Sourced from enclii-secrets/janua-admin-token
        # (canonical value = janua-secrets/janua-service-token). Optional ref so a
        # missing key can't CreateContainerConfigError; the fail-fast in code is
        # the intended guard when signup is enabled without the token.
        - name: ENCLII_JANUA_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: enclii-secrets
              key: janua-admin-token
              optional: true
        - name: ENCLII_SELF_SERVICE_API_BASE_URL
          value: "https://api.enclii.dev"
        - name: ENCLII_APP_BASE_URL
          value: "https://app.enclii.dev"
        - name: ENCLII_RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: enclii-secrets
              key: resend-api-key
              optional: true
        - name: ENCLII_EMAIL_FROM_ADDRESS
          value: "noreply@enclii.dev"
        - name: ENCLII_EMAIL_FROM_NAME
          value: "Enclii"
        # Session Revocation - fail closed in production (SOC 2)
        - name: ENCLII_SESSION_REVOCATION_FAIL_MODE
          value: "closed"
        # Audit log file fallback path
        - name: ENCLII_AUDIT_FALLBACK_PATH
          value: "/var/log/enclii/audit-fallback.jsonl"
        # ArgoCD Webhook Secret (for sync callback authentication)
        - name: ENCLII_ARGOCD_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: enclii-argocd-webhook
              key: secret
              optional: true
        # Provisioning: Postgres admin connection (for DB/role creation during onboarding)
        - name: ENCLII_POSTGRES_ADMIN_URL
          valueFrom:
            secretKeyRef:
              name: enclii-postgres-admin
              key: url
              optional: true
        # GitHub Token (for auto-committing ArgoCD apps during onboarding)
        - name: ENCLII_GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: enclii-github-token
              key: token
              optional: true
        # Cloudflare Integration (for domain status sync)
        - name: ENCLII_CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: enclii-cloudflare-credentials
              key: api-token
              optional: true
        - name: ENCLII_CLOUDFLARE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: enclii-cloudflare-credentials
              key: account-id
              optional: true
        - name: ENCLII_CLOUDFLARE_ZONE_ID
          valueFrom:
            secretKeyRef:
              name: enclii-cloudflare-credentials
              key: zone-id
              optional: true
        - name: ENCLII_CLOUDFLARE_TUNNEL_ID
          valueFrom:
            secretKeyRef:
              name: enclii-cloudflare-credentials
              key: tunnel-id
              optional: true
        # Porkbun Integration (registrar fallback for zones not yet in Cloudflare)
        - name: ENCLII_PORKBUN_API_KEY
          valueFrom:
            secretKeyRef:
              name: enclii-porkbun-credentials
              key: api-key
              optional: true
        - name: ENCLII_PORKBUN_SECRET_API_KEY
          valueFrom:
            secretKeyRef:
              name: enclii-porkbun-credentials
              key: secret-api-key
              optional: true
        - name: ENCLII_PORKBUN_API_BASE_URL
          value: "https://api.porkbun.com/api/json/v3"
        # PostHog Analytics (self-hosted at analytics.madfam.io)
        - name: ENCLII_POSTHOG_API_KEY
          valueFrom:
            secretKeyRef:
              name: enclii-secrets
              key: ENCLII_POSTHOG_API_KEY
              optional: true
        # Vault writer for audited secret intake + vault-backfill (P0)
        - name: ENCLII_SECRET_ROTATION_ENABLED
          value: "true"
        - name: ENCLII_VAULT_ADDRESS
          value: "http://vault.vault.svc.cluster.local:8200"
        - name: ENCLII_VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: vault-credentials
              key: token
              optional: true
        # Dhanam billing federation — checkout relay (mirrors janua#453).
        # POST /v1/billing/checkout resolves the caller's Dhanam customer and
        # opens a hosted checkout for enclii_pro, returning the real Dhanam
        # checkout URL. ENCLII_DHANAM_FEDERATION_URL is the Dhanam federation
        # API origin; the relay calls {url}/v1/customers/resolve then
        # /v1/customers/{id}/checkout. See checkout_handlers.go.
        - name: ENCLII_DHANAM_FEDERATION_URL
          value: "https://api.dhan.am"
        # FEDERATION_API_TOKEN — ecosystem-shared bearer for Dhanam customer
        # federation (same secret name Janua uses; NOT ENCLII_-prefixed).
        # optional:true so the deployment rolls out before the secret exists;
        # the relay fails closed (503) until it is provisioned.
        # OPERATOR: create key `federation-api-token` in secret `enclii-secrets`.
        - name: FEDERATION_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: enclii-secrets
              key: federation-api-token
              optional: true
        # Tier-blocked 402 upgrade link — enclii-owned upgrade page. Must NOT
        # point at the dead dhanam.madfam.io host (NXDOMAIN). See tier.go.
        - name: ENCLII_TIER_UPGRADE_URL
          value: "https://app.enclii.dev/upgrade?plan=pro"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 4200
          initialDelaySeconds: 15
          periodSeconds: 3
          timeoutSeconds: 3
          successThreshold: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: 4200
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 2
