---
# Secret Rotation CronJob
# Runs every 90 days to rotate secrets via the switchyard-api rotation controller
# See: apps/switchyard-api/internal/rotation/controller.go
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-rotation
  namespace: enclii
  labels:
    app: secret-rotation
    app.kubernetes.io/name: secret-rotation
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: enclii
spec:
  # Run at 3:00 AM UTC on the 1st of every 3rd month (Jan, Apr, Jul, Oct)
  schedule: "0 3 1 1,4,7,10 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: secret-rotation
        spec:
          restartPolicy: OnFailure
          serviceAccountName: switchyard-api
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: secret-rotation
              image: ghcr.io/madfam-org/enclii/switchyard-api@sha256:c68b36c1ef7898e6b1843df497dffcfb1378d7c0bf6a8e9878a156f818a41133
              imagePullPolicy: IfNotPresent
              command: ["/app/switchyard-api"]
              args: ["--mode=rotate-secrets"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: ENCLII_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: switchyard-api-secrets
                      key: ENCLII_DATABASE_URL
                - name: ENCLII_ENVIRONMENT
                  value: "production"
                - name: ENCLII_SECRET_ROTATION_ENABLED
                  value: "true"
                - name: ENCLII_VAULT_ADDRESS
                  valueFrom:
                    secretKeyRef:
                      name: vault-credentials
                      key: address
                      optional: true
                - name: ENCLII_VAULT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vault-credentials
                      key: token
                      optional: true
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
              volumeMounts:
                - name: tmp-volume
                  mountPath: /tmp
          volumes:
            - name: tmp-volume
              emptyDir: {}
