apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.webhook.enclii: |
    url: http://switchyard-api.enclii.svc.cluster.local/v1/callbacks/argocd-sync
    headers:
    - name: Authorization
      value: Bearer $argocd-webhook-secret
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [enclii-sync-notification]
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [enclii-sync-failure-notification]
  template.enclii-sync-notification: |
    webhook:
      enclii:
        method: POST
        body: |
          {
            "app_name": "{{.app.metadata.name}}",
            "trigger": "sync-succeeded",
            "sync_status": "{{.app.status.sync.status}}",
            "health_status": "{{.app.status.health.status}}",
            "revision": "{{.app.status.sync.revision}}",
            "images": {{toJson .app.status.summary.images}},
            "started_at": "{{.app.status.operationState.startedAt}}",
            "finished_at": "{{.app.status.operationState.finishedAt}}"
          }
  template.enclii-sync-failure-notification: |
    webhook:
      enclii:
        method: POST
        body: |
          {
            "app_name": "{{.app.metadata.name}}",
            "trigger": "sync-failed",
            "sync_status": "{{.app.status.sync.status}}",
            "health_status": "{{.app.status.health.status}}",
            "revision": "{{.app.status.sync.revision}}",
            "images": {{toJson .app.status.summary.images}},
            "started_at": "{{.app.status.operationState.startedAt}}",
            "finished_at": "{{.app.status.operationState.finishedAt}}",
            "error_message": "{{.app.status.operationState.message}}"
          }
