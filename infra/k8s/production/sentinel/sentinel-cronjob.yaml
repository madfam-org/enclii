---
# OPERATION SENTINEL - Drift Detection CronJob
# The "Watchman" - Automated daily infrastructure audit
# Applied: 2026-01-17

apiVersion: v1
kind: Namespace
metadata:
  name: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-script
  namespace: sentinel
data:
  infra-audit.sh: |
    #!/bin/bash
    # ============================================
    # SENTINEL INFRASTRUCTURE AUDIT SCRIPT
    # The "Watchman" - Drift Detection System
    # ============================================

    set -euo pipefail

    VIOLATIONS=0
    TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

    echo "============================================"
    echo "🛡️  SENTINEL INFRASTRUCTURE AUDIT"
    echo "    Timestamp: ${TIMESTAMP}"
    echo "============================================"
    echo ""

    # --------------------------------------------
    # CHECK 1: Exposed database Services
    # Law 1: Databases MUST NOT be exposed through NodePort/LoadBalancer
    # --------------------------------------------
    echo "📍 CHECK 1: Kubernetes Database Service Exposure"
    echo "   Rule: No database Service uses NodePort or LoadBalancer"

    EXPOSED_DB_SERVICES=$(kubectl get services -A -o json 2>/dev/null | \
        jq -r '.items[] |
        select(.spec.type == "NodePort" or .spec.type == "LoadBalancer") |
        . as $svc |
        .spec.ports[]? |
        .port as $port |
        select([5432,6379,3306,27017] | index($port)) |
        "\($svc.metadata.namespace)/\($svc.metadata.name):\(.port) \($svc.spec.type)"' || true)

    if [ -n "$EXPOSED_DB_SERVICES" ]; then
        echo "   ❌ VIOLATION: Database Service exposed outside the cluster"
        echo "$EXPOSED_DB_SERVICES" | while read line; do
            echo "      - $line"
        done
        VIOLATIONS=$((VIOLATIONS + 1))
    else
        echo "   ✅ PASS: No database Service exposed through NodePort/LoadBalancer"
    fi
    echo ""

    # --------------------------------------------
    # CHECK 2: CrashLoopBackOff > 10 minutes
    # Rule: No zombie pods allowed
    # --------------------------------------------
    echo "📍 CHECK 2: CrashLoopBackOff Pods"
    echo "   Rule: No pods in CrashLoopBackOff > 10 minutes"

    CRASHLOOP_PODS=$(kubectl get pods -A -o json 2>/dev/null | \
        jq -r '.items[] |
        select(any(.status.containerStatuses[]?; .state.waiting.reason == "CrashLoopBackOff")) |
        "\(.metadata.namespace)/\(.metadata.name)"' || true)

    if [ -n "$CRASHLOOP_PODS" ]; then
        echo "   ❌ VIOLATION: Pods in CrashLoopBackOff detected"
        echo "$CRASHLOOP_PODS" | while read pod; do
            echo "      - $pod"
        done
        VIOLATIONS=$((VIOLATIONS + 1))
    else
        echo "   ✅ PASS: No CrashLoopBackOff pods found"
    fi
    echo ""

    # --------------------------------------------
    # CHECK 3: hostPort Usage in Pods
    # Law 1: No hostPort allowed
    # --------------------------------------------
    echo "📍 CHECK 3: hostPort Usage"
    echo "   Rule: No pods using hostPort"

    HOSTPORT_PODS=$(kubectl get pods -A -o json 2>/dev/null | \
        jq -r '.items[] |
        select(any(.spec.containers[]?.ports[]?; .hostPort != null)) |
        "\(.metadata.namespace)/\(.metadata.name)"' || true)

    if [ -n "$HOSTPORT_PODS" ]; then
        echo "   ❌ VIOLATION: Pods using hostPort detected"
        echo "$HOSTPORT_PODS" | while read pod; do
            echo "      - $pod"
        done
        VIOLATIONS=$((VIOLATIONS + 1))
    else
        echo "   ✅ PASS: No hostPort usage detected"
    fi
    echo ""

    # --------------------------------------------
    # CHECK 4: Kubernetes Tunnel Ownership
    # Law 4: Only the approved cloudflare-tunnel namespace may run cloudflared
    # --------------------------------------------
    echo "📍 CHECK 4: Kubernetes Tunnel Ownership"
    echo "   Rule: cloudflared runs only in cloudflare-tunnel namespace"

    CLOUDFLARED_PODS=$(kubectl get pods -A -l app=cloudflared -o json 2>/dev/null | \
        jq -r '.items[] | "\(.metadata.namespace)/\(.metadata.name):\(.status.phase)"' || true)
    UNAPPROVED_TUNNELS=$(echo "$CLOUDFLARED_PODS" | grep -v '^cloudflare-tunnel/' || true)
    APPROVED_RUNNING_TUNNELS=$(echo "$CLOUDFLARED_PODS" | grep '^cloudflare-tunnel/.*:Running$' || true)

    if [ -n "$UNAPPROVED_TUNNELS" ]; then
        echo "   ❌ VIOLATION: cloudflared pod outside cloudflare-tunnel namespace"
        echo "$UNAPPROVED_TUNNELS" | while read pod; do
            echo "      - $pod"
        done
        VIOLATIONS=$((VIOLATIONS + 1))
    elif [ -z "$APPROVED_RUNNING_TUNNELS" ]; then
        echo "   ❌ VIOLATION: no approved cloudflared pod is Running"
        VIOLATIONS=$((VIOLATIONS + 1))
    else
        echo "   ✅ PASS: cloudflared is running only in approved namespace"
    fi
    echo ""

    # --------------------------------------------
    # CHECK 5: Core Deployment Readiness
    # Rule: Core API deployments must have all desired replicas ready
    # --------------------------------------------
    echo "📍 CHECK 5: Core Deployment Readiness"
    echo "   Rule: Core API deployments must have all desired replicas ready"

    check_deployment_ready() {
        local name=$1
        local namespace=$2
        local deployment=$3
        local desired=$(kubectl -n "$namespace" get deployment "$deployment" -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
        local ready=$(kubectl -n "$namespace" get deployment "$deployment" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
        desired=${desired:-0}
        ready=${ready:-0}
        if [ "$desired" -gt 0 ] && [ "$ready" -ge "$desired" ]; then
            echo "   ✅ $name: $ready/$desired ready"
        else
            echo "   ❌ $name: $ready/$desired ready (UNHEALTHY)"
            VIOLATIONS=$((VIOLATIONS + 1))
        fi
    }

    check_deployment_ready "janua-api" "janua" "janua-api"
    check_deployment_ready "switchyard-api" "enclii" "switchyard-api"
    echo ""

    # --------------------------------------------
    # CHECK 6: Redis Internal DNS Usage
    # Law 3: Redis via redis.data.svc.cluster.local
    # --------------------------------------------
    echo "📍 CHECK 6: Redis URL Configuration"
    echo "   Rule: Redis accessed via K8s internal DNS only"

    EXTERNAL_REDIS=$(kubectl get deployments -A -o json 2>/dev/null | \
        jq -r '.items[].spec.template.spec.containers[]?.env[]? |
        select((.name // "") | test("REDIS")) |
        select((.value // "") | test("95\\.217|0\\.0\\.0\\.0|localhost:6379")) |
        .value' | head -5 || true)

    if [ -n "$EXTERNAL_REDIS" ]; then
        echo "   ❌ VIOLATION: External Redis URLs detected"
        echo "$EXTERNAL_REDIS" | while read url; do
            echo "      - $url"
        done
        VIOLATIONS=$((VIOLATIONS + 1))
    else
        echo "   ✅ PASS: Redis using internal DNS"
    fi
    echo ""

    # --------------------------------------------
    # FINAL VERDICT
    # --------------------------------------------
    echo "============================================"
    echo "🏁 AUDIT COMPLETE"
    echo "============================================"

    if [ "$VIOLATIONS" -eq 0 ]; then
        echo "✅ STATUS: PASS - All checks passed"
        echo "   Infrastructure compliant with ADR-001"
        exit 0
    else
        echo "❌ STATUS: FAIL - $VIOLATIONS violation(s) detected"
        echo "   Review ADR-001 and remediate immediately"
        exit 1
    fi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-sa
  namespace: sentinel

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinel-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinel-reader-binding
subjects:
  - kind: ServiceAccount
    name: sentinel-sa
    namespace: sentinel
roleRef:
  kind: ClusterRole
  name: sentinel-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: infra-audit
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: audit
spec:
  schedule: "0 9 * * *"  # Daily at 9:00 AM UTC
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sentinel
            app.kubernetes.io/component: audit
        spec:
          serviceAccountName: sentinel-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sentinel
              image: docker.io/bitnamilegacy/kubectl:1.33.4
              imagePullPolicy: Always
              command:
                - /bin/bash
                - /scripts/infra-audit.sh
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: script
              configMap:
                name: sentinel-script
                defaultMode: 0755
          restartPolicy: Never
