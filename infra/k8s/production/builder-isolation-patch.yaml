# =============================================================================
# Builder Node Isolation Patch
# =============================================================================
# Production control-plane workloads must not schedule on foundry-builder-01.
#
# The builder node is reserved for ARC runner and build-executor workloads.
# It carries label `role=builder` and should carry taint
# `builder=true:NoSchedule`. This patch is the GitOps backstop: even if the
# taint drifts, these long-running Enclii services require nodes whose `role`
# label is not `builder` (or where the label is absent).
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: switchyard-api
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values:
                      - builder
---
