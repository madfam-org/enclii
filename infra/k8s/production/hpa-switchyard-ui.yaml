apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: switchyard-ui
  namespace: enclii
  labels:
    app.kubernetes.io/name: switchyard-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: enclii
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: switchyard-ui
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
