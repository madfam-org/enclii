apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enclii-porkbun-credentials
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: enclii-porkbun-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: secret/enclii
        property: porkbun_api_key
    - secretKey: secret-api-key
      remoteRef:
        key: secret/enclii
        property: porkbun_secret_api_key
