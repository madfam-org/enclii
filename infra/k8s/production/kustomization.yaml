apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: enclii
resources:
- ../base
- hpa-switchyard-api.yaml
- hpa-switchyard-ui.yaml
- hpa-roundhouse-api.yaml
- porkbun-credentials.externalsecret.yaml
- enclii-internal-api-key.externalsecret.yaml
- enclii-resend-api-key.externalsecret.yaml
- switchyard-api-signature-policyexception.yaml
- roundhouse-waybill-signature-policyexception.yaml
- docs-site-signature-policyexception.yaml
# NOTE: cloudflared.yaml removed - using existing cloudflared in cloudflare-tunnel namespace
# The cloudflare-tunnel namespace has working cloudflared pods with proper credentials
# - cloudflared.yaml
# Redis Sentinel HA is now an independent ArgoCD Application rather than part
# of this kustomization. It deploys to the `data` namespace alongside the
# existing single-instance Redis in `data` (not `enclii`). See:
#   infra/argocd/apps/redis-sentinel.yaml   (ArgoCD Application)
#   infra/k8s/redis-sentinel/               (Kustomize overlay)
#   docs/runbooks/redis-sentinel-migration.md
# The `redis` Deployment in `enclii` namespace (switchyard-api cache) is NOT
# migrated to Sentinel in P1.3 — it is single-tenant and lower-criticality.
# oidc-secrets.yaml not needed - using local mode with external JWKS
# build-secrets.yaml not in git - apply manually via kubectl
# - build-secrets.yaml
# cloudflare-secrets.yaml for domain status sync (optional - create secret directly via kubectl)
# - cloudflare-secrets.yaml

patchesStrategicMerge:
- replicas-patch.yaml
- environment-patch.yaml
- security-patch.yaml
- anti-affinity-patch.yaml
- builder-isolation-patch.yaml
configMapGenerator:
- literals:
  - ENCLII_ENV=production
  - ENCLII_LOG_LEVEL=warn
  - ENCLII_METRICS_ENABLED=true
  - ENCLII_RATE_LIMIT_REQUESTS_PER_MINUTE=10000
  - ENCLII_ENABLE_PROFILING=false
  name: env-config
# NOTE: dispatch is intentionally absent. Its GitOps source of truth is
# apps/admin-console/k8s/kustomization.yaml (ArgoCD project `dispatch`,
# manifestPath apps/admin-console/k8s) — that is where CI pins its digest.
# A duplicate entry here is dead config: no resource in this kustomization
# uses an image named `dispatch`, and a stale digest here only misleads
# audits into thinking the pin never happened.
# BRIDGE PIN: roundhouse-worker intentionally points at the pre-split
# combined `roundhouse` image digest so the worker keeps running exactly
# what it runs today until CI's first post-split build pushes the new
# ghcr.io/madfam-org/enclii/roundhouse-worker image and repins this entry
# (commit-digests runs `kustomize edit set image roundhouse-worker=...`,
# which rewrites both newName and digest). Do not hand-edit.
images:
- digest: sha256:ecef95bf2382dc0c9a344c20804562dce55faf7aed05ca060518ab309f4a0250
  name: docs-site
  newName: ghcr.io/madfam-org/enclii/docs-site
- digest: sha256:a162da9f298b1a2664968ca3890deb01d06d8f74b6a2fa0277710681307ba41e
  name: landing-page
  newName: ghcr.io/madfam-org/enclii/landing-page
- digest: sha256:705b277ae2322f7d9779221ac39bbe39f0281dfd1f79c4e06d67595704754579
  name: roundhouse
  newName: ghcr.io/madfam-org/enclii/roundhouse
- digest: sha256:01c8de1054c5c18e0deea24ef5514f305ee9032c0efead09eb134aa15cff18c9
  name: roundhouse-worker
  newName: ghcr.io/madfam-org/enclii/roundhouse-worker
- digest: sha256:8de8b2e816a255e2df9988c826a4e90d6ae75ea3bf6c416663e8a51cfbce3d25
  name: switchyard-api
  newName: ghcr.io/madfam-org/enclii/switchyard-api
- digest: sha256:91417e1fb64eb7ebe481f200ec49d43656ad324f5ece1d654fc187139db419d3
  name: switchyard-ui
  newName: ghcr.io/madfam-org/enclii/switchyard-ui
- digest: sha256:4a1f77486d9841c1def7f28907fa6a3ab2a5d3eebb92bb5340d9c8fa02bae3b2
  name: waybill
  newName: ghcr.io/madfam-org/enclii/waybill
# Note: commonLabels removed - it adds to selectors which are immutable.
# Labels are already defined in base manifests.
commonAnnotations:
  config.kubernetes.io/local-config: "false"
