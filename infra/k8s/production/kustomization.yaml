apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: enclii
resources:
- ../base
- hpa-switchyard-api.yaml
- hpa-switchyard-ui.yaml
- hpa-roundhouse-api.yaml
# NOTE: cloudflared.yaml removed - using existing cloudflared in cloudflare-tunnel namespace
# The cloudflare-tunnel namespace has working cloudflared pods with proper credentials
# - cloudflared.yaml
# Redis Sentinel HA is now an independent ArgoCD Application rather than part
# of this kustomization. It deploys to the `data` namespace alongside the
# existing single-instance Redis in `data` (not `enclii`). See:
#   infra/argocd/apps/redis-sentinel.yaml   (ArgoCD Application)
#   infra/k8s/redis-sentinel/               (Kustomize overlay)
#   docs/runbooks/redis-sentinel-migration.md
# The `redis` Deployment in `enclii` namespace (switchyard-api cache) is NOT
# migrated to Sentinel in P1.3 — it is single-tenant and lower-criticality.
# oidc-secrets.yaml not needed - using local mode with external JWKS
# build-secrets.yaml not in git - apply manually via kubectl
# - build-secrets.yaml
# cloudflare-secrets.yaml for domain status sync (optional - create secret directly via kubectl)
# - cloudflare-secrets.yaml

patchesStrategicMerge:
- replicas-patch.yaml
- environment-patch.yaml
- security-patch.yaml
- anti-affinity-patch.yaml
- builder-isolation-patch.yaml
configMapGenerator:
- literals:
  - ENCLII_ENV=production
  - ENCLII_LOG_LEVEL=warn
  - ENCLII_METRICS_ENABLED=true
  - ENCLII_RATE_LIMIT_REQUESTS_PER_MINUTE=10000
  - ENCLII_ENABLE_PROFILING=false
  name: env-config
images:
- digest: sha256:5eadc0383e1b98a8b4eeec7ecef012b3468913f084522837c1ef9d5e48ca0a40
  name: dispatch
  newName: ghcr.io/madfam-org/enclii/dispatch
- digest: sha256:d718a262ac3afdfbdecf968c8a0f358670a5abb0f69727df419a5926146d38ca
  name: docs-site
  newName: ghcr.io/madfam-org/enclii/docs-site
- digest: sha256:958bcf148db7f270572a767eca68dac1b779e5fb81f944f7b2fe40b9558ee478
  name: landing-page
  newName: ghcr.io/madfam-org/enclii/landing-page
- digest: sha256:220f4013bdea59bb74faaa1107f9285a1fbd1a0be04adb0b96c98fb37cb3772b
  name: roundhouse
  newName: ghcr.io/madfam-org/enclii/roundhouse
- digest: sha256:bcb7fd65810446c49508e2aefa9ef75aa73da9f94f83e93430d039e52572a861
  name: switchyard-api
  newName: ghcr.io/madfam-org/enclii/switchyard-api
- digest: sha256:4ed0cb7b8c38742c5717e5702d1188ae612e392282424460e296954dc49c0128
  name: switchyard-ui
  newName: ghcr.io/madfam-org/enclii/switchyard-ui
- digest: sha256:2ac256bb26c4bc67b74a391f43471f50b5fb785393cc9c28bf3016ab14ae1cd7
  name: waybill
  newName: ghcr.io/madfam-org/enclii/waybill
# Note: commonLabels removed - it adds to selectors which are immutable.
# Labels are already defined in base manifests.
commonAnnotations:
  config.kubernetes.io/local-config: "false"
