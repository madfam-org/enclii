# Merge-only sync for signup verification email (Resend).
# Interim: kubernetes-store reads bridge secret until Vault secret/enclii/resend_api_key
# is backfilled (scripts/ga-resend-bridge-bootstrap.sh).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enclii-resend-api-key
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: ClusterSecretStore
  target:
    name: enclii-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: resend-api-key
      remoteRef:
        key: enclii-resend-api-key-source
        property: resend-api-key
