# DEPRECATED — retire after secret/comms is populated and enclii-secrets syncs resend-api-key from Vault.
# Merge-only fallback: kubernetes-store bridge until orchestrator completes
#   enclii secrets intake submit platform/comms-resend-api-key
# Then remove this resource from infra/k8s/production/kustomization.yaml
# and run scripts/force-sync-comms-fanout.sh once.
#
# Merge-only sync for signup verification email (Resend).
# Interim: kubernetes-store reads bridge secret until Vault secret/comms/resend_api_key
# is backfilled (scripts/backfill-resend-vault-key.sh with VAULT_PATH=secret/comms/resend_api_key).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enclii-resend-api-key
  labels:
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: ClusterSecretStore
  target:
    name: enclii-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: resend-api-key
      remoteRef:
        key: enclii-resend-api-key-source
        property: resend-api-key
