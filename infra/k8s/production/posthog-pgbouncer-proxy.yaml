# Stub PgBouncer service for PostHog
# PostHog's init containers expect posthog-pgbouncer:6543 to be available.
# Since bitnami/pgbouncer images were removed from Docker Hub, this ExternalName
# service routes PgBouncer traffic directly to the shared PostgreSQL instance.
# PostHog connects directly to Postgres without connection pooling.
#
# ExternalName resolves postgres.data.svc.cluster.local dynamically via DNS,
# eliminating the hardcoded ClusterIP that breaks if the postgres Service is recreated.
---
apiVersion: v1
kind: Service
metadata:
  name: posthog-pgbouncer
  namespace: posthog
  labels:
    app: posthog-pgbouncer
spec:
  type: ExternalName
  externalName: postgres.data.svc.cluster.local
  ports:
    - port: 6543
      targetPort: 5432
      protocol: TCP
      name: postgresql
