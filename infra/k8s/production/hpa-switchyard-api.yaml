apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: switchyard-api
  namespace: enclii
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: enclii
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: switchyard-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 140
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 142
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
