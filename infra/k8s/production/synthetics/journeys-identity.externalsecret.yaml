# The synthetic staging identity, projected from Vault.
#
# ONE WRITER. The values reach Vault only through the intake target
# `synthetics/dhanam-staging-checkout`
# (apps/switchyard-api/internal/secretsintake/registry.yaml), typed by the
# owner at the masked prompt; intake force-syncs this ExternalSecret after the
# write. Never generated, never in a manifest, a commit, a PR or a log.
#
#   DHANAM_STAGING_SYNTH_EMAIL            Janua email of the synthetic staging identity (no MFA)
#   DHANAM_STAGING_SYNTH_PASSWORD         its Janua password
#   DHANAM_STAGING_SYNTH_STRIPE_TEST_KEY  a Stripe TEST restricted key (rk_test_): Checkout Sessions
#                                         read, Customers read, Subscriptions write. Used only to
#                                         reset and clean up the identity's test subscription.
#
# The runner refuses to start unless all three are present and the key is a
# test-mode key; it refuses mid-run on any live-mode sign.
#
# BEFORE THE FIRST SUBMIT this reports SecretSyncedError and the Secret does
# not exist: the CronJob's pods fail with CreateContainerConfigError and
# SyntheticJourneysNotRunning fires after 45 minutes. That is the intended
# signal, not noise: the buyer is not running.
#
# deletionPolicy: Retain, so deleting this ExternalSecret does not delete the
# identity out from under a running Job.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: journeys-dhanam-staging-synthetic
  labels:
    app.kubernetes.io/name: journeys
    app.kubernetes.io/component: synthetics
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: journeys-dhanam-staging-synthetic
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DHANAM_STAGING_SYNTH_EMAIL  # pragma: allowlist secret
      remoteRef:
        key: secret/synthetics
        property: dhanam_staging_synth_email
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: DHANAM_STAGING_SYNTH_PASSWORD  # pragma: allowlist secret
      remoteRef:
        key: secret/synthetics
        property: dhanam_staging_synth_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: DHANAM_STAGING_SYNTH_STRIPE_TEST_KEY  # pragma: allowlist secret
      remoteRef:
        key: secret/synthetics
        property: dhanam_staging_synth_stripe_test_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
