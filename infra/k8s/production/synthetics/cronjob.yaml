# S-Gate 1 synthetic buyer: every 15 minutes, buy Dhanam Essentials on
# STAGING with Stripe TEST mode and prove the webhook flipped the tier.
#
# What one run does (journey `dhanam.staging.essentials.checkout`, runner in
# the private ops repo, tools/journeys): sign in as the synthetic staging
# identity (Node-side), reset it to the free tier, load staging pricing, open
# the Essentials checkout through the staging API, type Stripe's published
# test card (4242 4242 4242 4242) on checkout.stripe.com, assert Stripe's
# redirect back to staging, assert the staging API shows Essentials, then
# have Dhanam staging cancel the test subscription (its synthetic-cancel
# endpoint; the runner holds no Stripe key). The runner refuses to run unless the session
# is cs_test_, every host is a staging host, and no live Stripe key appears.
#
# Outcome: synthetic_journey_* metrics pushed to the pushgateway; rules
# SyntheticCheckoutFailing (2 consecutive failures) and
# SyntheticJourneysNotRunning (no success for 45 minutes) in
# monitoring/prometheus.yaml (`synthetic-journeys-rules.yml`).
#
# Sizing: one headless Chromium. activeDeadlineSeconds (14 min) ends a hung
# run before the next schedule; backoffLimit 0 because a retry would hide a
# failure from the streak and buy a second test subscription.
#
# Verified locally against the image built from tools/journeys/Dockerfile:
# runs as uid/gid 1001 (`pwuser`) with a read-only root filesystem, every
# capability dropped and /tmp, /app/out and /dev/shm as the only writable
# paths.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: journeys-dhanam-staging-checkout
  labels:
    app.kubernetes.io/name: journeys
    app.kubernetes.io/component: synthetics
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 840
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: journeys
            app.kubernetes.io/component: synthetics
            app.kubernetes.io/part-of: enclii
        spec:
          serviceAccountName: journeys
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: journeys
              image: journeys
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: JOURNEYS_MODE
                  value: staging-full
                - name: JOURNEYS_FILTER
                  value: '^dhanam\.staging\.essentials\.checkout$'
                - name: JOURNEYS_WORKERS
                  value: "1"
                - name: JOURNEYS_OUT
                  value: /app/out
                - name: JOURNEYS_PUSHGATEWAY_URL
                  value: http://pushgateway.monitoring.svc.cluster.local:9091
                - name: HOME
                  value: /tmp
                - name: NPM_CONFIG_UPDATE_NOTIFIER
                  value: "false"
                - name: DHANAM_STAGING_SYNTH_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: journeys-dhanam-staging-synthetic
                      key: DHANAM_STAGING_SYNTH_EMAIL
                - name: DHANAM_STAGING_SYNTH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: journeys-dhanam-staging-synthetic
                      key: DHANAM_STAGING_SYNTH_PASSWORD
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 1500m
                  memory: 2Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: out
                  mountPath: /app/out
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
            - name: out
              emptyDir:
                sizeLimit: 512Mi
            # Chromium's shared memory; the container default (64Mi) crashes tabs.
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
