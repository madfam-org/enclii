# One headless Chromium at a time (concurrencyPolicy: Forbid). The quota fits
# one run plus the Job history the CronJob keeps; a second concurrent pod is
# refused by the quota as well as by the CronJob.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: synthetics-quota
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 3Gi
    pods: "2"
    count/jobs.batch: "8"
    persistentvolumeclaims: "0"
    services: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
