# DRAFT PR, WAITING ON OWNER RULINGS (money-engine journeys plan, 2026-10-11):
#   decision 9  a scoped permission rule for enclii
#               infra/k8s/production/{plausible,synthetics}/** (or the owner
#               applies synthetics PRs himself), and
#   decision 7  the Monday report (this run feeds it).
# Merging the PR that adds this file IS turning it on: it is listed in
# kustomization.yaml, and the synthetics Argo app syncs it.
#
# The weekly visitor's-eye pass in PRODUCTION: the journeys runner
# (internal-devops tools/journeys) in its default `pre-session` mode walks
# every public entry, demo, value-ladder rung and paid SKU up to the checkout
# boundary and stops there. Its safety layer is in code and unit-tested:
#   - GET only: every non-GET browser request is aborted and recorded;
#   - no checkout session, ever: a deny-list of session-creating URLs is
#     aborted on ANY method (the signed-link GET included);
#   - no typing, no forms, no sign-in; nothing here holds a credential;
#   - analytics endpoints are answered 202 inside the browser, so synthetic
#     traffic never reaches a collector;
#   - at most 1 request per second per host; a bot challenge or a 429 is
#     reported "blocked" and never bypassed;
#   - top-level navigation off the MADFAM estate is aborted.
# No Secret is mounted: production journeys need none.
#
# Scope: the money engine's journeys only. The geometry-fabrication products
# (Cotiza, Yantra4D, forj, Pravara, the fashion cabinet, pliego, zavlo) are
# another workstream's and are filtered out below; drop the filter only when
# that workstream asks for their journeys here.
#
# Outcome:
#   - synthetic_journey_* metrics per journey to the pushgateway, labelled
#     env="production" (rules: synthetic-journeys-production-rules.yml in
#     monitoring/prometheus.yaml, WARNING only: decision 6's recommendation
#     pages only for money paths that work today, and those already page
#     through the blackbox revenue probes every minute);
#   - the run's summary printed to the pod log at the end, so an agent reads
#     the weekly result with `enclii ops pods logs` (no bucket, no Grafana);
#     traces and the HTML board stay in the pod's emptyDir and are lost when
#     the Job is cleaned up (a private R2 bucket is the J4 follow-up).
#
# Known gap: the runner pushes success=0 for a journey whose failure is a
# RECORDED known issue too (it has no "known" label yet), so the rules below
# count failures, not new failures; the summary in the log separates them.
#
# Sizing: two browsers at most (JOURNEYS_WORKERS=2), about 100 journeys at
# 1 request/second/host: about 1.5-2 hours. activeDeadlineSeconds 4h. It runs
# Monday 11:00 UTC (05:00 CDMX), when the */15 staging buyer is the only
# other synthetics pod; the namespace quota is raised to fit both
# (resource-quota.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: journeys-production-weekly
  labels:
    app.kubernetes.io/name: journeys
    app.kubernetes.io/component: synthetics
spec:
  schedule: "0 11 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: journeys
            app.kubernetes.io/component: synthetics
            app.kubernetes.io/part-of: enclii
            journeys.madfam.io/mode: pre-session
        spec:
          serviceAccountName: journeys
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: journeys
              image: journeys
              imagePullPolicy: IfNotPresent
              # Run the suite, then print the human summary to the log (the
              # agent's read path), and keep the suite's exit code.
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  npx playwright test; rc=$?;
                  echo '----- journeys summary.md -----';
                  cat "$JOURNEYS_OUT/summary.md" 2>/dev/null || echo 'no summary written';
                  exit $rc
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: JOURNEYS_MODE
                  value: pre-session
                # Every journey except the geometry-fabrication products'.
                - name: JOURNEYS_FILTER
                  value: '^(?!.*(cotiza|yantra4d|forj|pravara|fashion|pliego|zavlo)).*$'
                - name: JOURNEYS_WORKERS
                  value: "2"
                - name: JOURNEYS_RPS
                  value: "1"
                - name: JOURNEYS_OUT
                  value: /app/out
                - name: JOURNEYS_PUSHGATEWAY_URL
                  value: http://pushgateway.monitoring.svc.cluster.local:9091
                - name: HOME
                  value: /tmp
                - name: NPM_CONFIG_UPDATE_NOTIFIER
                  value: "false"
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 1500m
                  memory: 2Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: out
                  mountPath: /app/out
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: out
              emptyDir:
                sizeLimit: 1Gi
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
