# =============================================================================
# Kube-System Pod Refresh CronJob
# =============================================================================
# Monthly rolling restart of long-running kube-system pods to ensure
# freshness, pick up security patches, and prevent stale state accumulation.
#
# Wave 13 Stability Recommendation (Feb 2026):
# - metrics-server, coredns, local-path-provisioner were 59+ days old
# - Monthly refresh maintains pod hygiene without service disruption
#
# Schedule: First Sunday of each month at 03:00 UTC (maintenance window)
# =============================================================================

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-system-maintenance
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-system-maintenance
    app.kubernetes.io/part-of: enclii
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-system-maintenance
  labels:
    app.kubernetes.io/name: kube-system-maintenance
    app.kubernetes.io/part-of: enclii
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-system-maintenance
  labels:
    app.kubernetes.io/name: kube-system-maintenance
    app.kubernetes.io/part-of: enclii
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-system-maintenance
subjects:
  - kind: ServiceAccount
    name: kube-system-maintenance
    namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-system-refresh
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-system-refresh
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: enclii
  annotations:
    description: "Monthly rolling restart of kube-system deployments"
spec:
  # First Sunday of each month at 03:00 UTC
  # Cron: minute(0) hour(3) day(*) month(*) weekday(0=Sunday)
  # With day-of-month 1-7 to ensure first week
  schedule: "0 3 1-7 * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kube-system-refresh
            app.kubernetes.io/component: maintenance
        spec:
          serviceAccountName: kube-system-maintenance
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: bitnamilegacy/kubectl:1.33.4
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== Kube-System Pod Refresh Started ==="
                  echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                  echo ""

                  # List current pod ages
                  echo "=== Current Pod Ages ==="
                  kubectl get pods -n kube-system -o custom-columns='NAME:.metadata.name,AGE:.metadata.creationTimestamp' --no-headers | \
                    while read name created; do
                      echo "$name: $created"
                    done
                  echo ""

                  # Rolling restart deployments (zero-downtime)
                  echo "=== Rolling Restart Deployments ==="

                  # CoreDNS
                  if kubectl get deployment coredns -n kube-system >/dev/null 2>&1; then
                    echo "Restarting coredns..."
                    kubectl rollout restart deployment/coredns -n kube-system
                    kubectl rollout status deployment/coredns -n kube-system --timeout=120s
                    echo "coredns: OK"
                  fi

                  # Metrics Server
                  if kubectl get deployment metrics-server -n kube-system >/dev/null 2>&1; then
                    echo "Restarting metrics-server..."
                    kubectl rollout restart deployment/metrics-server -n kube-system
                    kubectl rollout status deployment/metrics-server -n kube-system --timeout=120s
                    echo "metrics-server: OK"
                  fi

                  # Local Path Provisioner
                  if kubectl get deployment local-path-provisioner -n kube-system >/dev/null 2>&1; then
                    echo "Restarting local-path-provisioner..."
                    kubectl rollout restart deployment/local-path-provisioner -n kube-system
                    kubectl rollout status deployment/local-path-provisioner -n kube-system --timeout=120s
                    echo "local-path-provisioner: OK"
                  fi

                  echo ""
                  echo "=== Refresh Complete ==="
                  echo "All kube-system deployments refreshed successfully."
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
