---
# AlertManager Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'innovacionesmadfam@gmail.com'
      smtp_auth_username: 'innovacionesmadfam@gmail.com'
      smtp_auth_password_file: '/etc/alertmanager/smtp-password'
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'severity', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      routes:
        # Critical alerts - immediate notification
        - match:
            severity: critical
          receiver: 'critical-receiver'
          group_wait: 10s
          repeat_interval: 1h

        # Warning alerts - grouped notifications
        - match:
            severity: warning
          receiver: 'warning-receiver'
          group_wait: 1m
          repeat_interval: 4h

    receivers:
      - name: 'default-receiver'
        email_configs:
          - to: 'admin@madfam.io'
            send_resolved: true

      - name: 'critical-receiver'
        email_configs:
          - to: 'admin@madfam.io'
            send_resolved: true
            headers:
              Subject: '[CRITICAL] {{ .CommonLabels.alertname }} - Enclii'

      - name: 'warning-receiver'
        email_configs:
          - to: 'admin@madfam.io'
            send_resolved: true
            headers:
              Subject: '[WARNING] {{ .CommonLabels.alertname }} - Enclii'

    inhibit_rules:
      # If a critical alert is firing, inhibit warnings for the same service
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'service']

    templates: []
---
# AlertManager SMTP Secret — NOT committed to git.
# Create manually before deploying AlertManager:
#
#   kubectl create secret generic alertmanager-smtp-secret -n monitoring \
#     --from-literal=smtp-password='YOUR_GMAIL_APP_PASSWORD'
#
# Use a Gmail App Password (not account password).
# Long-term: migrate to Resend SMTP relay or External Secrets Operator.
---
# AlertManager PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
---
# AlertManager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: enclii
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.26.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--cluster.listen-address="
            - "--web.external-url=https://alertmanager.enclii.dev"
          ports:
            - containerPort: 9093
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: smtp-secret
              mountPath: /etc/alertmanager/smtp-password
              subPath: smtp-password
              readOnly: true
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: smtp-secret
          secret:
            secretName: alertmanager-smtp-secret
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
---
# AlertManager Service
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093
      name: http
  selector:
    app: alertmanager
