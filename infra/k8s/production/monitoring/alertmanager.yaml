---
# AlertManager Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'innovacionesmadfam@gmail.com'
      smtp_auth_username: 'innovacionesmadfam@gmail.com'
      smtp_auth_password_file: '/etc/alertmanager/smtp-password'
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'severity', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      routes:
        # Critical alerts - immediate notification
        - match:
            severity: critical
          receiver: 'critical-receiver'
          group_wait: 10s
          repeat_interval: 1h

        # Warning alerts - grouped notifications
        - match:
            severity: warning
          receiver: 'warning-receiver'
          group_wait: 1m
          repeat_interval: 4h

    receivers:
      - name: 'default-receiver'
        email_configs:
          - to: 'admin@madfam.io'
            send_resolved: true

      # ===================================================================
      # Telegram — availability remediation Tier 0.3
      # (internal-devops/roadmaps/2026-08-26-availability-remediation-9999.md).
      # Telegram is the operator's main channel; Slack below is kept as a
      # secondary, pre-existing route.
      #
      # INERT until the operator completes Tier 0.1:
      #   1. Create the bot via @BotFather, write its token to Vault at
      #      secret/alertmanager, property telegram_bot_token (synced by
      #      alertmanager-telegram-credentials.externalsecret.yaml into the
      #      alertmanager-telegram-secret Secret this pod mounts at
      #      /etc/alertmanager/telegram-bot-token).
      #   2. Add the bot to the target chat/channel/group and resolve its
      #      numeric chat_id (e.g. via https://api.telegram.org/bot<token>/
      #      getUpdates after sending the bot a message, or @userinfobot for
      #      a private chat).
      #   3. Replace the chat_id: 0 placeholder below with that real,
      #      nonzero chat_id in BOTH telegram_configs blocks. This step is a
      #      config-code edit, not a Vault write: Alertmanager's chat_id
      #      field has no file-based / secret-sourced variant (confirmed
      #      against prometheus/alertmanager v0.26.0's config/notifiers.go —
      #      TelegramConfig.ChatID is a plain required int64, unlike
      #      BotToken which does support bot_token_file), and this repo has
      #      no config-templating step that could inject a Vault-sourced
      #      scalar into this literal at deploy time. Adding one is out of
      #      scope for this program (no new moving parts).
      #      chat_id: 0 is used (not a string placeholder) because
      #      Alertmanager's decoder requires a real int64 here -- a
      #      non-numeric placeholder fails `amtool check-config` outright.
      #      0 is not a valid Telegram chat id, so this is unambiguously a
      #      sentinel, not a value someone could mistake for real and leave
      #      in place.
      # Until both steps land, requests to the Telegram API will fail loudly
      # in the alertmanager notification log rather than silently -- unlike
      # the empty Slack webhook file this program exists to fix, an invalid
      # bot token/chat_id produces an explicit send error, not silence.
      # ===================================================================
      - name: 'critical-receiver'
        email_configs:
          - to: 'admin@madfam.io'
            send_resolved: true
            headers:
              Subject: '[CRITICAL] {{ .CommonLabels.alertname }} - Enclii'
        telegram_configs:
          - bot_token_file: '/etc/alertmanager/telegram-bot-token'
            chat_id: 0
            message: '[CRITICAL] {{ .CommonLabels.alertname }}: {{ .CommonAnnotations.description }}'
            parse_mode: ''
            send_resolved: true
        slack_configs:
          - api_url_file: '/etc/alertmanager/slack-webhook-url'
            channel: '#alerts-critical'
            title: '[CRITICAL] {{ .CommonLabels.alertname }}'
            text: '{{ .CommonAnnotations.description }}'
            send_resolved: true

      - name: 'warning-receiver'
        email_configs:
          - to: 'admin@madfam.io'
            send_resolved: true
            headers:
              Subject: '[WARNING] {{ .CommonLabels.alertname }} - Enclii'
        telegram_configs:
          - bot_token_file: '/etc/alertmanager/telegram-bot-token'
            chat_id: 0
            message: '[WARNING] {{ .CommonLabels.alertname }}: {{ .CommonAnnotations.description }}'
            parse_mode: ''
            send_resolved: true
        slack_configs:
          - api_url_file: '/etc/alertmanager/slack-webhook-url'
            channel: '#alerts-warning'
            title: '[WARNING] {{ .CommonLabels.alertname }}'
            text: '{{ .CommonAnnotations.description }}'
            send_resolved: true

    inhibit_rules:
      # If a critical alert is firing, inhibit warnings for the same service
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'service']

    templates: []
---
# AlertManager SMTP Secret — NOT committed to git.
# Create manually before deploying AlertManager:
#
#   kubectl create secret generic alertmanager-smtp-secret -n monitoring \
#     --from-literal=smtp-password='YOUR_GMAIL_APP_PASSWORD'
#
# Use a Gmail App Password (not account password).
# Long-term: migrate to Resend SMTP relay or External Secrets Operator.
---
# AlertManager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  # Single replica because the backing PVC alertmanager-data is RWO (Longhorn doesn't
  # support RWX without an NFS shim). With replicas=2 the second pod sat in
  # ContainerCreating for 25 days hitting Multi-Attach errors. True HA alertmanager
  # would need a StatefulSet with volumeClaimTemplates so each peer has its own
  # volume — out of scope here. Recreate strategy ensures the old pod releases
  # the volume before the new one tries to attach.
  # Cutover complete: HA StatefulSet (alertmanager-statefulset.yaml) owns alerting.
  # Keep Deployment at 0 so Argo does not fight the legacy RWO PVC attach loop.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: enclii
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: docker.io/prom/alertmanager:v0.26.0@sha256:361db356b33041437517f1cd298462055580585f26555c317df1a3caf2868552
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--cluster.listen-address=0.0.0.0:9094"
            - "--cluster.peer=alertmanager-cluster.monitoring.svc.cluster.local:9094"
            - "--web.external-url=https://alertmanager.enclii.dev"
          ports:
            - containerPort: 9093
              name: http
            - containerPort: 9094
              name: cluster
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: smtp-secret
              mountPath: /etc/alertmanager/smtp-password
              subPath: smtp-password
              readOnly: true
            - name: slack-secret
              mountPath: /etc/alertmanager/slack-webhook-url
              subPath: slack-webhook-url
              readOnly: true
            - name: telegram-secret
              mountPath: /etc/alertmanager/telegram-bot-token
              subPath: bot-token
              readOnly: true
            - name: data
              mountPath: /alertmanager
          startupProbe:
            httpGet:
              path: /-/ready
              port: 9093
            failureThreshold: 15
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: smtp-secret
          secret:
            secretName: alertmanager-smtp-secret
        - name: slack-secret
          secret:
            secretName: alertmanager-slack-secret
        - name: telegram-secret
          secret:
            # Populated by alertmanager-telegram-credentials.externalsecret.yaml.
            # INERT (Secret has no data / pod mount 404s) until the operator
            # completes Tier 0.1 — see the telegram_configs comment above.
            secretName: alertmanager-telegram-secret
            optional: true
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
---
# AlertManager PVC — persistent alert state across restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# AlertManager Service
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093
      name: http
  selector:
    app: alertmanager
---
# Headless Service for AlertManager cluster peer discovery
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-cluster
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9094
      targetPort: 9094
      name: cluster
  selector:
    app: alertmanager
---
# AlertManager PDB — prevent simultaneous eviction during node drain
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager-pdb
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: alertmanager
