---
# Alertmanager Telegram bot token — availability remediation Tier 0.3
# (internal-devops/roadmaps/2026-08-26-availability-remediation-9999.md).
#
# INERT, and deliberately kept that way: this ExternalSecret is HALF of the
# two-part prerequisite for Telegram alerting. It stays in the kustomization
# so the Vault path and target Secret name stay documented and versioned,
# and so the day the operator writes the token the Secret simply appears.
# The pod mounts it with `optional: true`, so a missing Secret cannot block
# startup. It currently reports SecretSyncedError because Vault
# secret/alertmanager has no telegram_bot_token key yet.
#
# There are NO telegram_configs in alertmanager.yml right now. They were
# removed 2026-08-26 after `chat_id: 0` — intended as an inert sentinel —
# crashlooped alertmanager-2: Alertmanager v0.26.0 rejects a zero chat_id at
# config LOAD time ("missing chat_id on telegram_config"), not at send time,
# and the process exits 1 in under a second.
#
# Only the bot token is sourceable from Vault. Telegram's chat_id has NO
# file-based secret variant in Alertmanager's config schema (confirmed
# against config/notifiers.go in prometheus/alertmanager v0.26.0, the
# version deployed here — TelegramConfig.ChatID is a plain required int64,
# unlike BotToken/BotTokenFile which do support a file). There is also no
# existing config-templating step in this repo (checked: no envsubst step
# touches monitoring manifests, no CI substitution for alertmanager.yml)
# that could inject a Vault-sourced scalar into that literal at deploy time.
# The chat_id must therefore be committed as a literal.
#
# To re-enable Telegram, in ONE commit, once BOTH prerequisites exist:
#   1. Vault: write secret/alertmanager telegram_bot_token=<@BotFather token>.
#   2. Resolve the real numeric chat_id (add the bot to the target chat, then
#      https://api.telegram.org/bot<token>/getUpdates, or @userinfobot).
#   3. Re-add telegram_configs to the critical/warning receivers in
#      alertmanager.yaml with bot_token_file:
#      /etc/alertmanager/telegram-bot-token and that real chat_id.
# Tracker: internal-devops issue #496 era
# roadmaps/2026-08-26-availability-remediation-9999.md Tier 0.1/0.2.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: bot-token
      remoteRef:
        key: secret/alertmanager
        property: telegram_bot_token
