---
# Alertmanager Telegram bot token — availability remediation Tier 0.3
# (internal-devops/roadmaps/2026-08-26-availability-remediation-9999.md).
#
# INERT until the operator completes Tier 0.1: create the bot via
# @BotFather and write its token into Vault at secret/alertmanager,
# property telegram_bot_token. Until that write happens this ExternalSecret
# has nothing to sync and alertmanager-telegram-secret will not exist, so
# the telegram_configs receiver in alertmanager.yml (bot_token_file
# pointing at this Secret) will fail to load its token and that receiver
# will not send.
#
# Only the bot token is sourced from Vault. Telegram's chat_id has NO
# file-based secret variant in Alertmanager's config schema (confirmed
# against config/notifiers.go in prometheus/alertmanager v0.26.0, the
# version deployed here — TelegramConfig.ChatID is a plain required int64,
# unlike BotToken/BotTokenFile which do support a file). There is also no
# existing config-templating step in this repo (checked: no envsubst step
# touches monitoring manifests, no CI substitution for alertmanager.yml)
# that could inject a Vault-sourced scalar into that literal at deploy
# time, and adding one is out of scope for this program (no new moving
# parts, per the Tier 0.3 decision to port rules rather than deploy an
# operator). The operator must therefore also edit the chat_id placeholder
# directly in infra/k8s/production/monitoring/alertmanager.yaml's
# telegram_configs block after creating the chat/channel with the bot —
# see the comment on that block.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: bot-token
      remoteRef:
        key: secret/alertmanager
        property: telegram_bot_token
