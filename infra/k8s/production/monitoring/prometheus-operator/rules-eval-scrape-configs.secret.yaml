# =============================================================================
# additionalScrapeConfigs Secret for the `rules-eval` Prometheus CR.
#
# DELIBERATE TEMPORARY DUPLICATION — read this before touching either copy.
#
# The list below is a byte-for-byte copy of the `scrape_configs:` list from
# the existing hand-rolled Prometheus's ConfigMap
# (../prometheus.yaml, ConfigMap/prometheus-config, key prometheus.yml,
# `scrape_configs:` section — read READ-ONLY to produce this file, never
# edited). Every job_name, relabel_config, comment and honor_labels flag is
# copied verbatim; only the wrapping `scrape_configs:` key was stripped and
# the list re-indented to start at column 0, which is what
# `additionalScrapeConfigs` (a raw scrape_config list spliced under the
# operator-managed Prometheus's own generated config) requires.
#
# WHY DUPLICATE INSTEAD OF SHARING: `rules-eval` needs the same metrics the
# existing Prometheus already scrapes so that resurrected PrometheusRules
# (which reference series like `up{job="switchyard-api"}`, `pg_up`,
# `redis_up`, `kube_pod_container_status_restarts_total`, etc.) have
# something to evaluate against. There is no supported way to point
# `additionalScrapeConfigs` at "whatever the other Prometheus scrapes" — it
# has to be an explicit list. Federating from the existing Prometheus instead
# was considered and rejected for Phase A: federation only exposes a
# filtered/aggregated subset via a single `/federate` scrape, which would
# make `up{job=...}` labels wrong (federated series carry the federating
# job's own `job` label unless relabeled) and silently break every rule that
# matches on the original job name. Verbatim duplication keeps every alert
# rule's label matching correct with zero rewriting, at the cost of a
# temporary second copy of the scrape config.
#
# THIS IS TEMPORARY. Phase B (see ../README.md) consolidates: once rules-eval
# is proven, retarget the EXISTING Prometheus's own rule_files to load from
# PrometheusRule CRDs (or migrate scrape targets to ServiceMonitor/PodMonitor
# objects the operator discovers), and delete this Secret + the duplicated
# scrape config it holds. Until then:
#
#   - Any scrape target change to the existing Prometheus
#     (../prometheus.yaml's `scrape_configs:`) must be mirrored here by hand,
#     or rules-eval's view of the cluster silently diverges from the primary
#     Prometheus's view. This is the same class of "silent drift" failure
#     mode this whole program exists to eliminate elsewhere — it is being
#     accepted here, briefly and explicitly, as the cost of an incremental,
#     non-destructive rollout that does not touch the primary stack.
#   - #440 (fix/monitoring-resurrect-dead-rules) owns edits to
#     ../prometheus.yaml. Any future scrape-config change there should note
#     in its PR description that this file needs the same update.
#
# Generated via:
#   sed -n '/^    scrape_configs:/,/^  enclii-alerts.yml:/p' ../prometheus.yaml \
#     | sed '1d;$d' | sed 's/^      /  /'
# (manually verified to parse as a valid YAML list of 16 scrape_config
# entries, matching job_name-for-job_name against the source.)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: rules-eval-additional-scrape-configs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: rules-eval
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
type: Opaque
stringData:
  scrape-configs.yaml: |
    # Prometheus self-monitoring
    - job_name: 'prometheus'
      static_configs:
        - targets: ['localhost:9090']

    # Kubernetes API server
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
        - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

    # Kubernetes nodes
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
        - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

    # Kubernetes node cadvisor metrics
    - job_name: 'kubernetes-cadvisor'
      kubernetes_sd_configs:
        - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      metrics_path: /metrics/cadvisor
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

    # Kubernetes pods with prometheus.io annotations
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: pod

    # Kubernetes services with prometheus.io annotations
    - job_name: 'kubernetes-services'
      kubernetes_sd_configs:
        - role: endpoints
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
          action: replace
          target_label: __address__
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
        - action: labelmap
          regex: __meta_kubernetes_service_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: namespace
        - source_labels: [__meta_kubernetes_service_name]
          action: replace
          target_label: service

    # Switchyard API metrics
    - job_name: 'switchyard-api'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - enclii
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app]
          action: keep
          regex: switchyard-api
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http
      metrics_path: /metrics

    # Pushgateway — batch/CronJob metrics. honor_labels: true required, see
    # ../prometheus.yaml's own comment on this job for the full incident
    # history (2026-08-11).
    - job_name: 'pushgateway'
      honor_labels: true
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - monitoring
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          action: keep
          regex: pushgateway
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: pushgateway

    # Node exporter metrics (host CPU, memory, disk, network)
    - job_name: 'node-exporter'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - monitoring
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          action: keep
          regex: node-exporter

    # Kubernetes OBJECT state (jobs, pods, deployments). honor_labels: true is
    # LOAD-BEARING — see ../prometheus.yaml's comment on this job.
    - job_name: 'kube-state-metrics'
      honor_labels: true
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - monitoring
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          action: keep
          regex: kube-state-metrics
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http-metrics

    # Redis metrics (redis-exporter in data namespace)
    - job_name: 'redis'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - data
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          action: keep
          regex: redis-exporter

    # PostgreSQL metrics (postgres-exporter in data namespace)
    - job_name: 'postgres'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - data
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          action: keep
          regex: postgres-exporter

    # Roundhouse Build Worker metrics
    - job_name: 'roundhouse'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - enclii
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app]
          action: keep
          regex: roundhouse
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: metrics
      metrics_path: /metrics

    # ArgoCD metrics
    - job_name: 'argocd'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - argocd
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port]
          action: replace
          target_label: __address__
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
        - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__

    # Kyverno metrics
    - job_name: 'kyverno'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - kyverno
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          action: keep
          regex: admission-controller|background-controller
      metrics_path: /metrics

    # External Secrets metrics
    - job_name: 'external-secrets'
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - external-secrets
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: true
