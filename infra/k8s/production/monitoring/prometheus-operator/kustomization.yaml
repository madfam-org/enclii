apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - operator.yaml
  - rules-eval-rbac.yaml
  - rules-eval-scrape-configs.secret.yaml
  - rules-eval-network-policy.yaml
  - rules-eval-prometheus.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: monitoring
    includeSelectors: false
    includeTemplates: false

commonAnnotations:
  enclii.dev/component: monitoring
