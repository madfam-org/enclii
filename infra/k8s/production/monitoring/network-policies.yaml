---
# Default deny all ingress and egress in monitoring namespace
# All traffic must be explicitly allowed by the policies below
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: monitoring
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Prometheus ingress — in-cluster only: Grafana (datasource), AlertManager and
# rules-eval.
#
# NO CLOUDFLARE TUNNEL RULE (2026-10-04). Prometheus has no authentication of
# its own, and this rule let the public route prometheus.enclii.dev serve the
# UI and the whole HTTP API (targets, labels, every series) to anyone on the
# internet — front-door audit finding FDY-01 (P0). Read metrics through
# Grafana, which requires a login, or port-forward for break-glass work.
# Without this rule default-deny-all refuses cloudflared, so the public route
# answers 502 until its tunnel route and DNS record are removed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Ingress
  ingress:
  # From Grafana (datasource queries)
  - from:
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 9090
  # From AlertManager (silences API)
  - from:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9090
  # From rules-eval, which scrapes this Prometheus through its Service's
  # scrape annotations; without it the main instance is unmonitored.
  - from:
    - podSelector:
        matchLabels:
          app: rules-eval
    ports:
    - protocol: TCP
      port: 9090
---
# Node-exporter ingress — from both Prometheus instances only.
# The DaemonSet's pods carry app.kubernetes.io/name (node-exporter.yaml), not
# `app`. This policy used to select `app: node-exporter`, matched no pod, and
# left default-deny-all refusing every scrape: node metrics were blank on all
# four nodes until 2026-09-25.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    - podSelector:
        matchLabels:
          app: rules-eval
    ports:
    - protocol: TCP
      port: 9100
---
# Node-exporter egress — DNS only (exposes metrics, doesn't initiate connections)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  policyTypes:
  - Egress
  egress:
  # DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
---
# Prometheus egress — DNS, scrape targets, K8s API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Egress
  egress:
  # DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Scrape targets in kube-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  # Scrape targets in enclii
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: enclii
  # Scrape targets in argocd
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
  # Scrape targets in kyverno
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kyverno
  # Scrape targets in monitoring (alertmanager, grafana, self)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # Scrape targets in external-secrets
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: external-secrets
  # Scrape targets in data (redis-exporter, postgres-exporter)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: data
  # Scrape targets in cloudflare-tunnel (cloudflared metrics)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
  # Scrape targets in longhorn-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: longhorn-system
  # Application namespaces: the apps' own ServiceMonitor and annotation
  # targets. Every application namespace wears enclii.dev/data-access=true.
  # No port pin, because metrics ports differ per app and move; each app
  # namespace runs default-deny ingress and admits the monitoring namespace
  # only on its metrics port, so the destination still decides what is
  # reachable. Until 2026-09-25 this list named only platform namespaces and
  # every app scrape (routecraft, dhanam, janua, ceq, avala, ...) was refused
  # here at the source.
  - to:
    - namespaceSelector:
        matchLabels:
          enclii.dev/data-access: "true"
  # Platform namespaces with scrape targets that lack that label.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: npm-registry
    ports:
    - protocol: TCP
      port: 4873
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: arc-system
    ports:
    - protocol: TCP
      port: 8080
  # yantra4d (the backend's /metrics on its pod port). Not labelled
  # data-access, and it shouldn't be just for this: that label also admits
  # the namespace to the shared data services, which yantra4d doesn't use.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: yantra4d
    ports:
    - protocol: TCP
      port: 5000
  # angelia (Courier's alarm page counter, angelia-api's metrics listener on
  # its pod port 9464, scraped by the kubernetes-pods annotation job). Not
  # labelled data-access: angelia runs its own database and must not be
  # admitted to the shared data services. The angelia side admits the
  # monitoring namespace on 9464 only (angelia-api-ingress-metrics.yaml). Feeds
  # CourierPageBudgetExceeded (prometheus.yaml).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: angelia
    ports:
    - protocol: TCP
      port: 9464
  # Kubernetes API server
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
# AlertManager egress — DNS, SMTP, the Angelia Courier receiver, Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
  - Egress
  egress:
  # DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # SMTP (Gmail)
  - to: []
    ports:
    - protocol: TCP
      port: 587
  # The Angelia Courier receiver — the estate's ONE last mile for third-party
  # messaging (internal-devops
  # decisions/2026-09-05-third-party-messaging-via-angelia-courier.md M1).
  # `critical-receiver`, `warning-receiver` and `courier-only-receiver` POST to
  # http://angelia-api.angelia.svc.cluster.local/v1/courier/alertmanager. That
  # Service listens on 80 and targets CONTAINER port 8787, and a NetworkPolicy
  # matches the container port, not the Service port: writing 80 here would be
  # a rule that permits nothing while reading as though it permits the traffic.
  #
  # ONE SELECTOR SHAPE per `to:` item, and nothing else in it. k3s's netpol
  # controller renders a combined namespaceSelector+podSelector entry as
  # deny-everything — the estate has already paid for that lesson twice
  # (angelia PR #9, and the gossip rule below carries the same warning). A
  # namespace-wide allow to `angelia` on one port is the shape that works.
  #
  # This REPLACES the blanket `to: []` port-443 egress added 2026-09-04 for the
  # slack_configs blocks. Those blocks are gone, so the estate's alerting no
  # longer needs to reach the public internet at all on 443: the last mile is
  # an in-cluster Service. Keeping the rule would leave alertmanager able to
  # POST anywhere on the internet for no configured reason, which is exactly
  # the direct last mile the decision removes.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: angelia
    ports:
    - protocol: TCP
      port: 8787
  # Prometheus (for silences API etc.)
  - to:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090
  # Memberlist gossip to the OTHER alertmanager replicas (TCP + UDP 9094).
  # Absent since default-deny landed: all three "HA" members ran as isolated
  # singletons for months — no silence replication, no dedup — visible as
  # "Failed to join ...:9094: connection refused" in every member's log.
  # Harmless while notifications went nowhere; a triple-page bug the moment a
  # real receiver (Telegram, 0.1) is armed. Bare same-namespace podSelector on
  # purpose: k3s's netpol controller renders combined namespaceSelector+
  # podSelector entries as deny-everything (angelia PR #9, 2026-08-26).
  - to:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9094
    - protocol: UDP
      port: 9094
---
# AlertManager ingress — in-cluster only: Prometheus, Grafana and replica
# gossip. Rules evaluation and alert senders in other namespaces have their own
# policies (alertmanager-ingress-rules-eval, alertmanager-ingress-alert-senders).
#
# No Cloudflare tunnel rule: AlertManager is not published. Read alerts and
# manage silences in Grafana's Alerting view, which requires a login, or
# port-forward for break-glass work.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    # Grafana — its provisioned AlertManager datasource (grafana.yaml);
    # grafana-egress already carries the matching rule.
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 9093
  # Memberlist gossip from the OTHER alertmanager replicas — pair of the
  # egress rule above; both sides are needed under default-deny.
  - from:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9094
    - protocol: UDP
      port: 9094
---
# AlertManager ingress — alert senders in other namespaces. A namespace that
# carries the label `enclii.dev/alert-sender: "true"` may reach the v2 API on
# 9093. The label is declared on the Namespace by whoever owns that namespace,
# the same way `enclii.dev/data-access` admits a namespace to Postgres
# (../../policies/data-network-policies.yaml); no namespace is named here.
# Which pods inside a labelled namespace may open 9093 is decided by that
# namespace's own egress policy.
#
# A bare namespaceSelector, like the data-access rules. Do not pair it with a
# podSelector in the same `from` entry: this cluster's policy controller has
# rendered that combined form as deny-all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-ingress-alert-senders
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          enclii.dev/alert-sender: "true"
    ports:
    - protocol: TCP
      port: 9093
---
# Grafana egress — DNS, Prometheus datasource, OIDC provider
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
  - Egress
  egress:
  # DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Prometheus datasource
  - to:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090
  # AlertManager datasource
  - to:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9093
  # Loki datasource (logging namespace)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: logging
      podSelector:
        matchLabels:
          app.kubernetes.io/name: loki
    ports:
    - protocol: TCP
      port: 3100
  # OIDC provider (auth.madfam.io) — external HTTPS
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# Grafana ingress — from Cloudflare tunnel only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
    ports:
    - protocol: TCP
      port: 3000
---
# Blackbox exporter ingress: the main Prometheus only, on the probe port. It
# is the exporter's one client (the `blackbox-revenue` scrape job); nothing
# else needs to ask it to probe anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blackbox-exporter-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: blackbox-exporter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9115
---
# Blackbox exporter egress: DNS, and HTTPS to the public revenue hostnames.
# The probes deliberately leave through the public edge (Cloudflare, then back
# in through the tunnel) so they see what a customer sees; that needs 443 to
# any address, like grafana-egress's OIDC rule. Only 443: every module sets
# fail_if_not_ssl, so a plain-HTTP target fails rather than needing port 80.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blackbox-exporter-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: blackbox-exporter
  policyTypes:
  - Egress
  egress:
  # DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Public HTTPS (the probe targets)
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# Pushgateway ingress from the synthetic journeys (infra/k8s/production/synthetics).
# The runner pushes synthetic_journey_* after every run and reads the previous
# run's group back first, both on 9091. Additive to `pushgateway-ingress` in
# deploy-pipeline-monitor.yaml, which admits only the monitoring namespace and
# the npm-registry token rotation. Without this the push is silently dropped
# and the synthetic buyer's alerts can only ever fire as NotRunning.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pushgateway-ingress-synthetics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: pushgateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: synthetics
      podSelector:
        matchLabels:
          app.kubernetes.io/name: journeys
    ports:
    - protocol: TCP
      port: 9091
