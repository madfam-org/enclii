---
# Default deny all ingress and egress in monitoring namespace
# All traffic must be explicitly allowed by the policies below
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: monitoring
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Prometheus ingress — from Cloudflare tunnel (UI) and Grafana (datasource)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Ingress
  ingress:
  # From Cloudflare tunnel (prometheus.enclii.dev UI)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
    ports:
    - protocol: TCP
      port: 9090
  # From Grafana (datasource queries)
  - from:
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 9090
  # From AlertManager (silences API)
  - from:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9090
---
# Node-exporter ingress — from Prometheus only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: node-exporter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9100
---
# Node-exporter egress — DNS only (exposes metrics, doesn't initiate connections)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: node-exporter
  policyTypes:
  - Egress
  egress:
  # DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
---
# Prometheus egress — DNS, scrape targets, K8s API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Egress
  egress:
  # DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Scrape targets in kube-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  # Scrape targets in enclii
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: enclii
  # Scrape targets in argocd
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
  # Scrape targets in kyverno
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kyverno
  # Scrape targets in monitoring (alertmanager, grafana, self)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # Scrape targets in external-secrets
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: external-secrets
  # Scrape targets in data (redis-exporter, postgres-exporter)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: data
  # Scrape targets in cloudflare-tunnel (cloudflared metrics)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
  # Scrape targets in longhorn-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: longhorn-system
  # Kubernetes API server
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
# AlertManager egress — DNS, SMTP, the Angelia Courier receiver, Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
  - Egress
  egress:
  # DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # SMTP (Gmail)
  - to: []
    ports:
    - protocol: TCP
      port: 587
  # The Angelia Courier receiver — the estate's ONE last mile for third-party
  # messaging (internal-devops
  # decisions/2026-09-05-third-party-messaging-via-angelia-courier.md M1).
  # Both `critical-receiver` and `warning-receiver` POST to
  # http://angelia-api.angelia.svc.cluster.local/v1/courier/alertmanager. That
  # Service listens on 80 and targets CONTAINER port 8787, and a NetworkPolicy
  # matches the container port, not the Service port: writing 80 here would be
  # a rule that permits nothing while reading as though it permits the traffic.
  #
  # ONE SELECTOR SHAPE per `to:` item, and nothing else in it. k3s's netpol
  # controller renders a combined namespaceSelector+podSelector entry as
  # deny-everything — the estate has already paid for that lesson twice
  # (angelia PR #9, and the gossip rule below carries the same warning). A
  # namespace-wide allow to `angelia` on one port is the shape that works.
  #
  # This REPLACES the blanket `to: []` port-443 egress added 2026-09-04 for the
  # slack_configs blocks. Those blocks are gone, so the estate's alerting no
  # longer needs to reach the public internet at all on 443: the last mile is
  # an in-cluster Service. Keeping the rule would leave alertmanager able to
  # POST anywhere on the internet for no configured reason, which is exactly
  # the direct last mile the decision removes.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: angelia
    ports:
    - protocol: TCP
      port: 8787
  # Prometheus (for silences API etc.)
  - to:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090
  # Memberlist gossip to the OTHER alertmanager replicas (TCP + UDP 9094).
  # Absent since default-deny landed: all three "HA" members ran as isolated
  # singletons for months — no silence replication, no dedup — visible as
  # "Failed to join ...:9094: connection refused" in every member's log.
  # Harmless while notifications went nowhere; a triple-page bug the moment a
  # real receiver (Telegram, 0.1) is armed. Bare same-namespace podSelector on
  # purpose: k3s's netpol controller renders combined namespaceSelector+
  # podSelector entries as deny-everything (angelia PR #9, 2026-08-26).
  - to:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9094
    - protocol: UDP
      port: 9094
---
# AlertManager ingress — from Prometheus (in-cluster) and the Cloudflare
# tunnel (external UI at alertmanager.enclii.dev). Without the tunnel rule the
# default-deny-all policy blocks cloudflared, so the route 502s while the
# backend is healthy — mirror grafana-ingress below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
    ports:
    - protocol: TCP
      port: 9093
  # Memberlist gossip from the OTHER alertmanager replicas — pair of the
  # egress rule above; both sides are needed under default-deny.
  - from:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9094
    - protocol: UDP
      port: 9094
---
# Grafana egress — DNS, Prometheus datasource, OIDC provider
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
  - Egress
  egress:
  # DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Prometheus datasource
  - to:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090
  # AlertManager datasource
  - to:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9093
  # Loki datasource (logging namespace)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: logging
      podSelector:
        matchLabels:
          app.kubernetes.io/name: loki
    ports:
    - protocol: TCP
      port: 3100
  # OIDC provider (auth.madfam.io) — external HTTPS
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# Grafana ingress — from Cloudflare tunnel only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare-tunnel
    ports:
    - protocol: TCP
      port: 3000
