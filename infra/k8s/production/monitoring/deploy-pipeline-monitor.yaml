---
# Deploy-pipeline freshness monitor
# ----------------------------------------------------------------------------
# Closes the silent-failure gap exemplified by 2026-05-04: selva-office CI
# failed on main at 02:29 → no image rebuilt → ArgoCD had nothing new → pods
# stayed 8h-old. Undetected for 3h.
#
# This CronJob runs every 5 min, queries the GitHub API for each repo in the
# `deploy-pipeline-monitor-repos` ConfigMap, computes freshness + failure
# metrics, and pushes them to the existing `pushgateway.monitoring` service.
# Prometheus scrapes pushgateway, the rules below fire alerts.
#
# Sibling probes:
#   - infra/cloudflared-probe/  → in-cluster reachability (network layer)
#   - infra/synthetic-flow-probe/ → user-flow E2E (in flight)
#   - this                       → CI/build pipeline freshness (deploy layer)
# Together: full-stack observability of the deploy + serve path.
#
# Image is built and pinned by .github/workflows/deploy-pipeline-monitor.yml.
# CI surfaces the digest in the run summary; an operator commits the
# `image: ghcr.io/.../deploy-pipeline-monitor@sha256:<digest>` line below.
# ----------------------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: deploy-pipeline-monitor-repos
  namespace: monitoring
  labels:
    app: deploy-pipeline-monitor
    app.kubernetes.io/name: deploy-pipeline-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
data:
  # 14 critical-path repos. Adding a repo: append below; per-repo `branch`
  # defaults to `main` (override only if the repo's deploy branch differs).
  repos.json: |
    {
      "repos": [
        {"repo": "madfam-org/karafiel"},
        {"repo": "madfam-org/tezca"},
        {"repo": "madfam-org/dhanam"},
        {"repo": "madfam-org/forgesight"},
        {"repo": "madfam-org/janua"},
        {"repo": "madfam-org/selva-office"},
        {"repo": "madfam-org/enclii"},
        {"repo": "madfam-org/phynd-crm"},
        {"repo": "madfam-org/fortuna"},
        {"repo": "madfam-org/rondelio"},
        {"repo": "madfam-org/madfam-site"},
        {"repo": "madfam-org/digifab-quoting"},
        {"repo": "madfam-org/pravara-mes"},
        {"repo": "madfam-org/sim4d"}
      ]
    }

---
# GitHub API token is sourced from the existing `enclii/enclii-github-token`
# Secret via the legacy Kubernetes-backed ClusterSecretStore. Secret-writer
# follow-up: create a least-privilege token under Vault path
# `secret/monitoring/deploy-pipeline-monitor.github_token`, then switch this
# ExternalSecret back to `vault-store`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: deploy-pipeline-monitor-creds
  namespace: monitoring
  labels:
    app.kubernetes.io/name: deploy-pipeline-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: ClusterSecretStore
  target:
    name: deploy-pipeline-monitor-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: enclii-github-token
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-pipeline-monitor
  namespace: monitoring
  labels:
    app: deploy-pipeline-monitor
    app.kubernetes.io/name: deploy-pipeline-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-main-parity-reader
  namespace: argocd
  labels:
    app.kubernetes.io/name: argo-main-parity-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-main-parity-reader
  namespace: argocd
  labels:
    app.kubernetes.io/name: argo-main-parity-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
subjects:
  - kind: ServiceAccount
    name: deploy-pipeline-monitor
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-main-parity-reader

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deploy-pipeline-monitor
  namespace: monitoring
  labels:
    app: deploy-pipeline-monitor
    app.kubernetes.io/name: deploy-pipeline-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  # Every 5 minutes — matches the alert "for: 0m, expr > 1800" cadence.
  # 14 repos × 2 GitHub API calls = 28 req/run = 336 req/hour. Authenticated
  # GitHub limit is 5000 req/hour, so we sit at ~7% utilization with plenty
  # of headroom for retries.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: deploy-pipeline-monitor
            app.kubernetes.io/name: deploy-pipeline-monitor
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/part-of: enclii
        spec:
          serviceAccountName: deploy-pipeline-monitor
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              # CI rewrites this to a digest-pinned image — see
              # .github/workflows/deploy-pipeline-monitor.yml run summary.
              image: ghcr.io/madfam-org/enclii/deploy-pipeline-monitor@sha256:88630fb74165c2553028a2654b269a19d543a31007d499c808978a371f461e45
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: REPOS_PATH
                  value: /etc/deploy-pipeline-monitor/repos.json
                - name: PUSHGATEWAY_URL
                  value: http://pushgateway-headless.monitoring.svc.cluster.local:9091
                - name: PUSH_JOB
                  value: deploy_pipeline_monitor
                - name: REQUEST_TIMEOUT_SECONDS
                  value: "10"
                - name: LOG_LEVEL
                  value: INFO
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: deploy-pipeline-monitor-creds
                      key: GITHUB_TOKEN
              resources:
                requests:
                  cpu: "20m"
                  memory: "48Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              volumeMounts:
                - name: repos
                  mountPath: /etc/deploy-pipeline-monitor
                  readOnly: true
          volumes:
            - name: repos
              configMap:
                name: deploy-pipeline-monitor-repos

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argo-main-parity-monitor
  namespace: monitoring
  labels:
    app: deploy-pipeline-monitor
    app.kubernetes.io/name: argo-main-parity-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: deploy-pipeline-monitor
            app.kubernetes.io/name: argo-main-parity-monitor
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/part-of: enclii
        spec:
          serviceAccountName: deploy-pipeline-monitor
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              image: ghcr.io/madfam-org/enclii/deploy-pipeline-monitor@sha256:88630fb74165c2553028a2654b269a19d543a31007d499c808978a371f461e45
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /app/check_argo_main_parity.py
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: ARGOCD_NAMESPACE
                  value: argocd
                - name: PUSHGATEWAY_URL
                  value: http://pushgateway-headless.monitoring.svc.cluster.local:9091
                - name: PUSH_JOB
                  value: argo_main_parity_monitor
                - name: REQUEST_TIMEOUT_SECONDS
                  value: "10"
                - name: LOG_LEVEL
                  value: INFO
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: deploy-pipeline-monitor-creds
                      key: GITHUB_TOKEN
              resources:
                requests:
                  cpu: "20m"
                  memory: "48Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deploy-pipeline-monitor-egress
  namespace: monitoring
  labels:
    app: deploy-pipeline-monitor
    app.kubernetes.io/name: deploy-pipeline-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: deploy-pipeline-monitor
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 9091
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Kubernetes API service access for Argo/Application CR reads.
    # Some CNIs do not treat Service IPs as ordinary external ipBlock
    # traffic, so allow the apiserver ports without a destination selector.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app: pushgateway
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
        app.kubernetes.io/name: pushgateway
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: enclii
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pushgateway
          image: quay.io/prometheus/pushgateway:v1.11.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app: pushgateway
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  selector:
    app: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway-headless
  namespace: monitoring
  labels:
    app: pushgateway
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  clusterIP: None
  selector:
    app: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: pushgateway
  endpoints:
    - port: http
      interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pushgateway-ingress
  namespace: monitoring
  labels:
    app: pushgateway
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: pushgateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9091
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: npm-registry
          podSelector:
            matchLabels:
              app.kubernetes.io/name: verdaccio
      ports:
        - protocol: TCP
          port: 9091

---
# Alerting rules
# ----------------------------------------------------------------------------
# Routed to alertmanager via the existing severity routes. Category
# `deploy-pipeline` is new — it groups all CI/build/deploy freshness alerts
# so the on-call rotation can mute them independently of platform-layer
# incidents during planned maintenance.
#
# 30-min thresholds reflect the original gap: had this monitor been live on
# 2026-05-04 02:29 UTC, the first alert would have fired at 02:59 — instead
# of 05:30 when a human noticed.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: deploy-pipeline-monitor-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: deploy-pipeline-monitor-rules
    app.kubernetes.io/part-of: enclii
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: argo-main-parity-monitor
      interval: 1m
      rules:
        - alert: ArgoMainParityDrift
          expr: argo_main_parity_drift_sources > 0
          for: 5m
          labels:
            severity: critical
            category: deploy-parity
          annotations:
            summary: "ArgoCD deployed revision differs from GitHub main"
            description: >
              At least one Git-backed prod ArgoCD source tracks `main` but is
              not deployed at the current GitHub main SHA. Inspect
              `argo_main_parity_source_ok` labels for the app/repo/path.
            runbook: docs/runbooks/deploy-pipeline-monitor.md
        - alert: ArgoMainParityMonitorFailed
          expr: argo_main_parity_probe_ok == 0
          for: 5m
          labels:
            severity: warning
            category: deploy-parity
          annotations:
            summary: "Argo main parity monitor failed"
            description: >
              The parity monitor could not list Argo apps, query GitHub, or
              push metrics. Check the `argo-main-parity-monitor` CronJob logs.
            runbook: docs/runbooks/deploy-pipeline-monitor.md
        - alert: ArgoMainParityMonitorStale
          expr: time() - argo_main_parity_last_run_timestamp_seconds > 900 or absent(argo_main_parity_last_run_timestamp_seconds)
          for: 0m
          labels:
            severity: warning
            category: deploy-parity
          annotations:
            summary: "Argo main parity monitor has not pushed metrics in >15 min"
            description: >
              The parity monitor is stale or missing. Check CronJob scheduling,
              GHCR pull credentials, network egress, and Pushgateway health.
            runbook: docs/runbooks/deploy-pipeline-monitor.md
    - name: deploy-pipeline-monitor
      interval: 1m
      rules:
        - alert: MainCIFailingForTooLong
          # The headline alert. Fires when the latest CI run on a tracked
          # branch is failed AND the failing commit was pushed >30 min ago.
          # Implies: no new image, no rebuild, ArgoCD has nothing new.
          expr: repo_main_blocked_seconds > 1800
          for: 0m
          labels:
            severity: critical
            category: deploy-pipeline
          annotations:
            summary: "{{ $labels.repo }} main CI has been failing for >30 min"
            description: |
              Latest CI run on `{{ $labels.branch }}` of `{{ $labels.repo }}`
              is failed. The failing commit was pushed {{ $value | humanizeDuration }}
              ago — no image has been rebuilt → no deploys are reaching ArgoCD
              → live pods are drifting from `main`.
              Open the Actions tab on the repo, identify the failing run,
              fix or rerun it.
              Runbook: docs/runbooks/deploy-pipeline-monitor.md

        - alert: MainCommitsAccumulatingNotDeployed
          # Catch the case where main HEAD is older than X minutes without
          # an even newer CI completion — i.e. commits are landing but the
          # build pipeline isn't keeping up. The argocd_app_info_revision_*
          # series isn't reliably scraped today, so the simpler heuristic is:
          # ci_age - commit_age > 30 min  (CI is lagging behind main).
          expr: |
            (repo_main_latest_commit_age_seconds
             - repo_main_latest_ci_age_seconds) > 1800
          for: 5m
          labels:
            severity: warning
            category: deploy-pipeline
          annotations:
            summary: "{{ $labels.repo }} main has unbuilt commits (>30 min)"
            description: |
              `{{ $labels.repo }}` main HEAD is {{ $value | humanizeDuration }}
              newer than the most recent completed CI run. Either CI is
              stalled, the workflow filter isn't matching, or the runner
              fleet is starved. ArgoCD will reconcile the *previous* image
              until this clears.

        - alert: MainCIConsecutiveFailures
          # Three failures in a row on main is almost always a real bug, not
          # a flake — flag for the originating team even before the 30 min
          # blocked-seconds threshold trips.
          expr: repo_main_ci_failure_streak_count >= 3
          for: 15m
          labels:
            severity: warning
            category: deploy-pipeline
          annotations:
            summary: "{{ $labels.repo }} main CI: 3+ consecutive failures"
            description: |
              `{{ $labels.repo }}` has {{ $value }} consecutive non-success
              CI runs on `{{ $labels.branch }}`. Likely a real defect rather
              than a flake.

        - alert: DeployPipelineMonitorNotRunning
          # If the CronJob hasn't pushed in 15 min, we have no signal. Fail loud.
          expr: |
            time() - deploy_pipeline_monitor_last_run_timestamp_seconds > 900
            or absent(deploy_pipeline_monitor_last_run_timestamp_seconds)
          for: 5m
          labels:
            severity: warning
            category: deploy-pipeline
          annotations:
            summary: "deploy-pipeline-monitor has not pushed metrics in >15 min"
            description: |
              The CronJob is supposed to push every 5 min. Either it is not
              scheduling (check `kubectl -n monitoring get cronjob`), the
              GitHub token expired, or pushgateway is unreachable.

        - alert: DeployPipelineMonitorRepoProbeFailing
          # Per-repo probe failures (auth scope wrong, repo renamed, etc.)
          # don't break the others, but we still want to know.
          expr: repo_main_probe_ok == 0
          for: 30m
          labels:
            severity: warning
            category: deploy-pipeline
          annotations:
            summary: "deploy-pipeline-monitor cannot probe {{ $labels.repo }}"
            description: |
              The monitor has been unable to fetch state from
              `{{ $labels.repo }}` for 30+ minutes. Likely causes: PAT scope
              missing the repo, repo renamed, or branch deleted. The monitor
              keeps running for the other repos.
