---
# Deploy-pipeline freshness monitor
# ----------------------------------------------------------------------------
# Closes the silent-failure gap exemplified by 2026-05-04: selva-office CI
# failed on main at 02:29 → no image rebuilt → ArgoCD had nothing new → pods
# stayed 8h-old. Undetected for 3h.
#
# This CronJob runs every 5 min, queries the GitHub API for each repo in the
# `deploy-pipeline-monitor-repos` ConfigMap, computes freshness + failure
# metrics, and pushes them to the existing `pushgateway.monitoring` service.
# Prometheus scrapes pushgateway, the rules below fire alerts.
#
# Sibling probes:
#   - infra/cloudflared-probe/  → in-cluster reachability (network layer)
#   - infra/synthetic-flow-probe/ → user-flow E2E (in flight)
#   - this                       → CI/build pipeline freshness (deploy layer)
# Together: full-stack observability of the deploy + serve path.
#
# Image is built and pinned by .github/workflows/deploy-pipeline-monitor.yml.
# CI surfaces the digest in the run summary; an operator commits the
# `image: ghcr.io/.../deploy-pipeline-monitor@sha256:<digest>` line below.
# ----------------------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: deploy-pipeline-monitor-repos
  namespace: monitoring
  labels:
    app: deploy-pipeline-monitor
    app.kubernetes.io/name: deploy-pipeline-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
data:
  # 14 critical-path repos. Adding a repo: append below; per-repo `branch`
  # defaults to `main` (override only if the repo's deploy branch differs).
  #
  # THIS LIST IS FROZEN LEGACY STATE — do not extend it. check-zero-touch-
  # boundaries.sh rejects any new entry, because monitor targets belong in
  # onboarding/Argo state, not hardcoded per-app in Enclii. avala was added
  # here on 2026-08-11 and correctly bounced by that guard.
  #
  # What that means for coverage, since the two monitors answer different
  # questions:
  #
  #   - "did the rollout land" — argo-main-parity-monitor, which DISCOVERS its
  #     targets by listing Argo Applications. avala needs no entry anywhere; it
  #     was already enumerated, and the new argo_main_rollout_* metrics cover it
  #     from the moment they deploy. This is the signal that was missing on
  #     2026-08-07, and it is the one this change actually fixes.
  #
  #   - "is CI failing on main" — check_main_ci.py, driven by this frozen list,
  #     so avala is NOT covered for CI freshness. Closing that gap properly
  #     means deriving these targets from Argo state the way the parity monitor
  #     already does, which is a separate change and the shape the zero-touch
  #     boundary is pointing at.
  repos.json: |
    {
      "repos": [
        {"repo": "madfam-org/karafiel"},
        {"repo": "madfam-org/tezca"},
        {"repo": "madfam-org/dhanam"},
        {"repo": "madfam-org/forgesight"},
        {"repo": "madfam-org/janua"},
        {"repo": "madfam-org/selva-office"},
        {"repo": "madfam-org/enclii"},
        {"repo": "madfam-org/phynd-crm"},
        {"repo": "madfam-org/fortuna"},
        {"repo": "madfam-org/rondelio"},
        {"repo": "madfam-org/madfam-site"},
        {"repo": "madfam-org/digifab-quoting"},
        {"repo": "madfam-org/pravara-mes"},
        {"repo": "madfam-org/sim4d"}
      ]
    }

---
# GitHub API token is sourced from the existing `enclii/enclii-github-token`
# Secret via the legacy Kubernetes-backed ClusterSecretStore. Secret-writer
# follow-up: create a least-privilege token under Vault path
# `secret/monitoring/deploy-pipeline-monitor.github_token`, then switch this
# ExternalSecret back to `vault-store`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: deploy-pipeline-monitor-creds
  namespace: monitoring
  labels:
    app.kubernetes.io/name: deploy-pipeline-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: kubernetes-store
    kind: ClusterSecretStore
  target:
    name: deploy-pipeline-monitor-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: enclii-github-token
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-pipeline-monitor
  namespace: monitoring
  labels:
    app: deploy-pipeline-monitor
    app.kubernetes.io/name: deploy-pipeline-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-main-parity-reader
  namespace: argocd
  labels:
    app.kubernetes.io/name: argo-main-parity-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-main-parity-reader
  namespace: argocd
  labels:
    app.kubernetes.io/name: argo-main-parity-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
subjects:
  - kind: ServiceAccount
    name: deploy-pipeline-monitor
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-main-parity-reader

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deploy-pipeline-monitor
  namespace: monitoring
  labels:
    app: deploy-pipeline-monitor
    app.kubernetes.io/name: deploy-pipeline-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  # Every 5 minutes — matches the alert "for: 0m, expr > 1800" cadence.
  # 14 repos × 2 GitHub API calls = 28 req/run = 336 req/hour. Authenticated
  # GitHub limit is 5000 req/hour, so we sit at ~7% utilization with plenty
  # of headroom for retries.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: deploy-pipeline-monitor
            app.kubernetes.io/name: deploy-pipeline-monitor
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/part-of: enclii
        spec:
          serviceAccountName: deploy-pipeline-monitor
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              # CI rewrites this to a digest-pinned image — see
              # .github/workflows/deploy-pipeline-monitor.yml run summary.
              image: ghcr.io/madfam-org/enclii/deploy-pipeline-monitor@sha256:70283b3ecb23ec3dcafa8cd924680e37c424abcb180efaf2e4569df4e8591afc
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: REPOS_PATH
                  value: /etc/deploy-pipeline-monitor/repos.json
                - name: PUSHGATEWAY_URL
                  value: http://pushgateway-headless.monitoring.svc.cluster.local:9091
                - name: PUSH_JOB
                  value: deploy_pipeline_monitor
                - name: REQUEST_TIMEOUT_SECONDS
                  value: "10"
                - name: LOG_LEVEL
                  value: INFO
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: deploy-pipeline-monitor-creds
                      key: GITHUB_TOKEN
              resources:
                requests:
                  cpu: "20m"
                  memory: "48Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              volumeMounts:
                - name: repos
                  mountPath: /etc/deploy-pipeline-monitor
                  readOnly: true
          volumes:
            - name: repos
              configMap:
                name: deploy-pipeline-monitor-repos

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argo-main-parity-monitor
  namespace: monitoring
  labels:
    app: deploy-pipeline-monitor
    app.kubernetes.io/name: argo-main-parity-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: deploy-pipeline-monitor
            app.kubernetes.io/name: argo-main-parity-monitor
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/part-of: enclii
        spec:
          serviceAccountName: deploy-pipeline-monitor
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              image: ghcr.io/madfam-org/enclii/deploy-pipeline-monitor@sha256:70283b3ecb23ec3dcafa8cd924680e37c424abcb180efaf2e4569df4e8591afc
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /app/check_argo_main_parity.py
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: ARGOCD_NAMESPACE
                  value: argocd
                - name: PUSHGATEWAY_URL
                  value: http://pushgateway-headless.monitoring.svc.cluster.local:9091
                - name: PUSH_JOB
                  value: argo_main_parity_monitor
                - name: REQUEST_TIMEOUT_SECONDS
                  value: "10"
                - name: LOG_LEVEL
                  value: INFO
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: deploy-pipeline-monitor-creds
                      key: GITHUB_TOKEN
              resources:
                requests:
                  cpu: "20m"
                  memory: "48Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deploy-pipeline-monitor-egress
  namespace: monitoring
  labels:
    app: deploy-pipeline-monitor
    app.kubernetes.io/name: deploy-pipeline-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: deploy-pipeline-monitor
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 9091
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Kubernetes API service access for Argo/Application CR reads.
    # Some CNIs do not treat Service IPs as ordinary external ipBlock
    # traffic, so allow the apiserver ports without a destination selector.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app: pushgateway
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
        app.kubernetes.io/name: pushgateway
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: enclii
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pushgateway
          image: quay.io/prometheus/pushgateway:v1.11.1@sha256:03738d278e082ee9821df730c741b3b465c251fc2b68a85883def301a55a6215
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app: pushgateway
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  selector:
    app: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway-headless
  namespace: monitoring
  labels:
    app: pushgateway
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  clusterIP: None
  selector:
    app: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: pushgateway
  endpoints:
    - port: http
      interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pushgateway-ingress
  namespace: monitoring
  labels:
    app: pushgateway
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: pushgateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9091
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: npm-registry
          podSelector:
            matchLabels:
              app.kubernetes.io/name: verdaccio
      ports:
        - protocol: TCP
          port: 9091

# The PrometheusRule (deploy-pipeline-monitor-rules) that used to live here
# was removed 2026-08-26 (availability remediation Tier 0.3). Its own header
# comment already documented it as inert ("THIS PrometheusRule IS INERT ON
# THIS CLUSTER") because no prometheus-operator runs here.
#
# Of its 8 rules:
#   - 5 (group `deploy-pipeline-monitor`: MainCIFailingForTooLong,
#     MainCommitsAccumulatingNotDeployed, MainCIConsecutiveFailures,
#     DeployPipelineMonitorNotRunning, DeployPipelineMonitorRepoProbeFailing)
#     were ported into
#     infra/k8s/production/monitoring/prometheus.yaml's prometheus-rules
#     ConfigMap, key deploy-pipeline-freshness-rules.yml. Their metrics are
#     genuinely emitted by check_main_ci.py and have no live equivalent.
#   - 3 (group `argo-main-parity-monitor`: ArgoMainParityDrift,
#     ArgoMainParityMonitorFailed, ArgoMainParityMonitorStale) were DELETED,
#     not ported: that ConfigMap's deploy-parity-alerts.yml key already
#     covers this exact monitor with a redesigned signal
#     (argo_main_rollout_ok / argo_main_rollout_failed_sources) that fixes
#     the false-green the drift-sources approach had during the 2026-08-07
#     avala-services incident. Porting the superseded rules would double
#     up on every real rollout failure.
#
# The `prometheus-rules` ConfigMap is the only rule source this Prometheus
# actually loads (rule_files: /etc/prometheus/rules/*.yml).
