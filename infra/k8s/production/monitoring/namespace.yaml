---
# Monitoring Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: enclii
---
# Resource Quotas for monitoring namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    # 2026-09-24: +2Gi limits for Prometheus (2Gi→4Gi, it was OOM-looping
    # ~7.4k restarts) and +2 PVC slots so the operator-managed rules-eval
    # (0/1 for 28 d, blocked ONLY by the PVC count) can claim its volume.
    limits.memory: 10Gi
    persistentvolumeclaims: "8"
