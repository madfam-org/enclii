apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dashboard ConfigMaps generator
configMapGenerator:
  - name: grafana-dashboard-roundhouse
    namespace: monitoring
    files:
      - roundhouse-builds.json
    options:
      labels:
        grafana_dashboard: "true"
  - name: grafana-dashboard-secrets-rotation
    namespace: monitoring
    files:
      - secrets-rotation.json
    options:
      labels:
        grafana_dashboard: "true"

  - name: grafana-dashboard-node-maintenance
    namespace: monitoring
    files:
      - node-maintenance.json
    options:
      labels:
        grafana_dashboard: "true"

  - name: grafana-dashboard-cluster-capacity
    namespace: monitoring
    files:
      - cluster-capacity.json
    options:
      labels:
        grafana_dashboard: "true"

  - name: grafana-dashboard-api-latency
    namespace: monitoring
    files:
      - api-latency.json
    options:
      labels:
        grafana_dashboard: "true"

  - name: grafana-dashboard-cost-trends
    namespace: monitoring
    files:
      - cost-trends.json
    options:
      labels:
        grafana_dashboard: "true"

  - name: grafana-dashboard-argocd-sync
    namespace: monitoring
    files:
      - argocd-sync.json
    options:
      labels:
        grafana_dashboard: "true"

generatorOptions:
  disableNameSuffixHash: true
