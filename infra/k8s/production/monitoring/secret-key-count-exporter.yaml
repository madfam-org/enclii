---
# Secret key-count exporter
# ============================================================================
# THE FAULT THIS WATCHES FOR
# --------------------------
# `dhanam-secrets` in namespace `dhanam` is written by THREE ExternalSecrets.
# Until 2026-08-06 one of them used `creationPolicy: Orphan` while the other
# two used `Merge`. Neither Owner nor Orphan merges — both reconcile the
# target Secret's data down to exactly the keys THAT ExternalSecret produces.
# So every 15m the 2-key bridge reset the whole Secret; `-extended` re-merged
# 10 keys and core re-merged 13 about 2.5 minutes later. Pods that started
# inside that window came up with no DATABASE_URL and CrashLooped.
#
# Measured: a 6-sample / 42-minute probe caught one sample at 10 keys with
# DATABASE_URL and DIRECT_DATABASE_URL absent. Throughout, every
# ExternalSecret reported Ready=True — the health signal we had could not see
# the failure. The 2026-06-13 incident runbook proposed a key-count alert;
# it was never built. This is that alert.
#
# WHY IT READS THE SECRET AND NOT THE EXTERNALSECRET
# --------------------------------------------------
# `ExternalSecret.status.conditions[Ready]` stayed True for all three writers
# during the whole incident: each writer successfully wrote what it was asked
# to write. The only signal that moved was the number of keys on the target
# Secret. So this exporter counts keys on the Secret itself and never looks at
# an ExternalSecret condition.
#
# WHY A CONFIGMAP-EMBEDDED SCRIPT AND NOT A NEW IMAGE
# ---------------------------------------------------
# A new component would need a Dockerfile, a CI workflow, a published image
# and a human to commit the resulting digest — and until that human acted the
# control would be dark. That is precisely how the 2026-06-13 recommendation
# died. Mounting a stdlib-only script into an already-published, already-
# digest-pinned Python image keeps the operator gate at zero. Same pattern as
# infra/k8s/base/verdaccio/token-rotation-cronjob.yaml.
#
# The script is unit-tested straight out of this ConfigMap by
# tests/scripts/test_secret_key_count_exporter.py — there is no second copy to
# drift from.
#
# HOW THE METRICS REACH PROMETHEUS (verified 2026-08-06)
# ------------------------------------------------------
# There is no kube-state-metrics in this cluster (`kubectl get all -A | grep
# kube-state` → nothing), so `kube_secret_*` does not exist; and the
# `external-secrets` scrape job has zero targets because the only Service in
# that namespace is `external-secrets-webhook`, which carries no
# `prometheus.io/scrape` annotation — Prometheus reports no `externalsecret_*`
# series at all. Neither could be alerted on.
#
# What IS verified working is the `kubernetes-services` job: role=endpoints,
# `keep` on the Service annotation `prometheus.io/scrape=true`, honouring
# `prometheus.io/port`. The `monitoring/prometheus` Service is discovered that
# way and its target is UP. This exporter's Service uses the same two
# annotations.
#
# NOTE ON LABEL NAMES: that job overwrites the `namespace` and `service`
# labels of every sample it scrapes (verified: cloudflared_probe_reachable
# carries namespace="cloudflare-tunnel" and exported_namespace="dhanam").
# The metrics below therefore use `secret_namespace` / `secret_name`, which
# nothing rewrites.
#
# Alert rules live in the `prometheus-rules` ConfigMap
# (infra/k8s/production/monitoring/prometheus.yaml), because that ConfigMap is
# what the running Prometheus actually loads — PrometheusRule CRs are inert in
# this cluster (no prometheus-operator).
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-key-count-exporter-targets
  namespace: monitoring
  labels:
    app: secret-key-count-exporter
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
data:
  # To watch another Secret: append an entry AND grant read on it (Role +
  # RoleBinding below). `min_keys` is exported as
  # secret_key_count_min_expected and is what the alert compares against.
  #
  # dhanam/dhanam-secrets holds 23 keys when all three writers have merged.
  # 20 leaves headroom for a legitimately removed key while still catching
  # every state the wipe window produced (2, 10, 12, 13).
  #
  # Key is `secrets.json`, NOT `targets.json`: the latter is the probe-target
  # schema that scripts/check-probe-targets.py validates, and a ConfigMap
  # carrying that key is expected to hold name/url/service/port entries.
  secrets.json: |
    {
      "targets": [
        {
          "namespace": "dhanam",
          "secret": "dhanam-secrets",
          "min_keys": 20
        },
        {
          "//": "enclii-dhanam-staging has the mirror-image multi-writer bug (33-key Owner writer + 10-key Merge writer). Its manifests live in the dhanam repo; this entry only observes it. 33 keys when merged; 25 catches a collapse to 10.",
          "namespace": "enclii-dhanam-staging",
          "secret": "dhanam-secrets",
          "min_keys": 25
        }
      ]
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-key-count-exporter-script
  namespace: monitoring
  labels:
    app: secret-key-count-exporter
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
data:
  exporter.py: |
    """Export the number of keys held by specific Kubernetes Secrets.

    Standard library only, so it runs on any Python image without a build.
    Reads target list from TARGETS_PATH, polls the Kubernetes API every
    POLL_INTERVAL_SECONDS, serves Prometheus text format on METRICS_PORT.

    SECURITY: this process can read the Secrets it is granted (RBAC is scoped
    to two named Secrets). It only ever counts `len(data)`. Secret VALUES and
    KEY NAMES are never logged, never exported and never held beyond the
    parse. The metrics carry counts only.

    Metrics:
      secret_key_count{secret_namespace,secret_name}                  gauge
      secret_key_count_min_expected{secret_namespace,secret_name}     gauge
      secret_key_count_check_success{secret_namespace,secret_name}    gauge 1|0
      secret_key_count_last_success_timestamp_seconds{...}            gauge
      secret_key_count_polls_total                                    counter
    """

    import json
    import logging
    import os
    import ssl
    import sys
    import threading
    import time
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    TOKEN_PATH = os.environ.get("SA_TOKEN_PATH", SA_DIR + "/token")
    CA_PATH = os.environ.get("SA_CA_PATH", SA_DIR + "/ca.crt")
    TARGETS_PATH = os.environ.get("TARGETS_PATH", "/etc/secret-key-count/secrets.json")
    METRICS_PORT = int(os.environ.get("METRICS_PORT", "9092"))
    POLL_INTERVAL = int(os.environ.get("POLL_INTERVAL_SECONDS", "30"))
    API_TIMEOUT = float(os.environ.get("KUBE_API_TIMEOUT_SECONDS", "5"))

    LOG = logging.getLogger("secret-key-count-exporter")

    # Written by the poll thread, read by the HTTP thread. Python dict
    # assignment is atomic under the GIL and we always swap a whole dict, so
    # no lock is needed.
    STATE = {"results": [], "polls": 0}


    def load_targets(path):
        """Parse the targets file. Raises ValueError on malformed input."""
        with open(path, "r", encoding="utf-8") as fh:
            payload = json.load(fh)
        items = payload["targets"] if isinstance(payload, dict) and "targets" in payload else payload
        if not isinstance(items, list):
            raise ValueError("targets must be a list or {'targets': [...]}")
        targets = []
        for raw in items:
            if not isinstance(raw, dict):
                raise ValueError("target entry must be an object")
            if set(raw.keys()) <= {"//"}:
                continue  # comment-only entry
            for required in ("namespace", "secret", "min_keys"):
                if required not in raw:
                    raise ValueError("target missing required key: " + required)
            targets.append(
                {
                    "namespace": str(raw["namespace"]),
                    "secret": str(raw["secret"]),
                    "min_keys": int(raw["min_keys"]),
                }
            )
        return targets


    def read_token():
        try:
            with open(TOKEN_PATH, "r", encoding="utf-8") as fh:
                return fh.read().strip()
        except OSError:
            return None


    def ssl_context():
        if os.path.exists(CA_PATH):
            return ssl.create_default_context(cafile=CA_PATH)
        return ssl.create_default_context()


    def count_keys(namespace, secret, opener_get=None):
        """Return (count, error). count is None when the read failed.

        A failed read must never be reported as a low count: that would turn
        an RBAC or API problem into a fake secret-collapse page.
        """
        host = os.environ.get("KUBERNETES_SERVICE_HOST")
        port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
        if not host:
            return None, "KUBERNETES_SERVICE_HOST unset"
        token = read_token()
        if token is None:
            return None, "no ServiceAccount token"

        url = "https://%s:%s/api/v1/namespaces/%s/secrets/%s" % (host, port, namespace, secret)
        req = urllib.request.Request(url)
        req.add_header("Authorization", "Bearer " + token)
        req.add_header("Accept", "application/json")

        getter = opener_get or (lambda r: urllib.request.urlopen(r, timeout=API_TIMEOUT, context=ssl_context()))
        try:
            with getter(req) as resp:
                body = json.loads(resp.read().decode("utf-8"))
        except urllib.error.HTTPError as exc:
            return None, "kube API returned %s" % exc.code
        except Exception as exc:  # URLError, ssl, json — all non-conclusive
            return None, "%s: %s" % (type(exc).__name__, exc)

        data = body.get("data")
        if data is None:
            # A Secret with no data at all is a real (and alarming) state.
            return 0, None
        if not isinstance(data, dict):
            return None, "malformed Secret body"
        return len(data), None


    def poll(targets, counter=count_keys):
        results = []
        now = time.time()
        for t in targets:
            count, err = counter(t["namespace"], t["secret"])
            results.append(
                {
                    "namespace": t["namespace"],
                    "secret": t["secret"],
                    "min_keys": t["min_keys"],
                    "count": count,
                    "error": err,
                    "checked_at": now,
                }
            )
            if err is not None:
                LOG.warning(
                    json.dumps(
                        {
                            "event": "secret_read_failed",
                            "namespace": t["namespace"],
                            "secret": t["secret"],
                            "error": err,
                        }
                    )
                )
            elif count < t["min_keys"]:
                LOG.error(
                    json.dumps(
                        {
                            "event": "secret_key_count_low",
                            "namespace": t["namespace"],
                            "secret": t["secret"],
                            "count": count,
                            "min_keys": t["min_keys"],
                            "hint": (
                                "A multi-writer ExternalSecret target is being "
                                "reconciled down by a non-Merge writer. Check "
                                "creationPolicy on every ExternalSecret whose "
                                "spec.target.name is this Secret."
                            ),
                        }
                    )
                )
        return results


    def escape(value):
        return str(value).replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")


    def render(results, polls):
        """Render Prometheus text exposition format."""
        out = []
        out.append("# HELP secret_key_count Number of keys held by the Secret")
        out.append("# TYPE secret_key_count gauge")
        for r in results:
            if r["count"] is not None:
                out.append(
                    'secret_key_count{secret_namespace="%s",secret_name="%s"} %d'
                    % (escape(r["namespace"]), escape(r["secret"]), r["count"])
                )
        out.append("# HELP secret_key_count_min_expected Minimum key count expected for this Secret")
        out.append("# TYPE secret_key_count_min_expected gauge")
        for r in results:
            out.append(
                'secret_key_count_min_expected{secret_namespace="%s",secret_name="%s"} %d'
                % (escape(r["namespace"]), escape(r["secret"]), r["min_keys"])
            )
        out.append("# HELP secret_key_count_check_success 1 if the last read of this Secret succeeded")
        out.append("# TYPE secret_key_count_check_success gauge")
        for r in results:
            out.append(
                'secret_key_count_check_success{secret_namespace="%s",secret_name="%s"} %d'
                % (escape(r["namespace"]), escape(r["secret"]), 0 if r["error"] else 1)
            )
        out.append("# HELP secret_key_count_last_success_timestamp_seconds Unix time of the last successful read")
        out.append("# TYPE secret_key_count_last_success_timestamp_seconds gauge")
        for r in results:
            if not r["error"]:
                out.append(
                    'secret_key_count_last_success_timestamp_seconds{secret_namespace="%s",secret_name="%s"} %f'
                    % (escape(r["namespace"]), escape(r["secret"]), r["checked_at"])
                )
        out.append("# HELP secret_key_count_polls_total Completed poll iterations")
        out.append("# TYPE secret_key_count_polls_total counter")
        out.append("secret_key_count_polls_total %d" % polls)
        return "\n".join(out) + "\n"


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.split("?")[0] not in ("/metrics", "/"):
                self.send_response(404)
                self.end_headers()
                return
            body = render(STATE["results"], STATE["polls"]).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *_args):
            pass  # keep scrape noise out of the pod log


    def poll_forever(targets):
        while True:
            started = time.monotonic()
            try:
                STATE["results"] = poll(targets)
                STATE["polls"] = STATE["polls"] + 1
            except Exception as exc:  # never let one bad iteration kill the loop
                LOG.exception(json.dumps({"event": "poll_error", "error": str(exc)}))
            time.sleep(max(0.0, POLL_INTERVAL - (time.monotonic() - started)))


    def main():
        logging.basicConfig(
            level=os.environ.get("LOG_LEVEL", "INFO").upper(),
            format="%(asctime)s %(levelname)s %(message)s",
            stream=sys.stdout,
        )
        try:
            targets = load_targets(TARGETS_PATH)
        except Exception as exc:
            LOG.error(json.dumps({"event": "targets_load_failed", "error": str(exc)}))
            return 1
        LOG.info(json.dumps({"event": "exporter_start", "targets": len(targets), "port": METRICS_PORT}))

        # Populate once before serving so the first scrape is not empty.
        STATE["results"] = poll(targets)
        STATE["polls"] = 1

        threading.Thread(target=poll_forever, args=(targets,), daemon=True).start()
        ThreadingHTTPServer(("", METRICS_PORT), Handler).serve_forever()
        return 0


    if __name__ == "__main__":
        sys.exit(main())

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-key-count-exporter
  namespace: monitoring
  labels:
    app: secret-key-count-exporter
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii

---
# Read access is scoped by `resourceNames` to exactly the Secret being
# counted, in exactly its own namespace. There is no cluster-wide secret read
# and no wildcard: adding a target requires adding a Role here, deliberately.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-key-count-reader
  namespace: dhanam
  labels:
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dhanam-secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-key-count-reader
  namespace: dhanam
  labels:
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
subjects:
  - kind: ServiceAccount
    name: secret-key-count-exporter
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-key-count-reader

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-key-count-reader
  namespace: enclii-dhanam-staging
  labels:
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dhanam-secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-key-count-reader
  namespace: enclii-dhanam-staging
  labels:
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
subjects:
  - kind: ServiceAccount
    name: secret-key-count-exporter
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-key-count-reader

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-key-count-exporter
  namespace: monitoring
  labels:
    app: secret-key-count-exporter
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: secret-key-count-exporter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: secret-key-count-exporter
        app.kubernetes.io/name: secret-key-count-exporter
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: enclii
      annotations:
        # Restart when either ConfigMap changes so a new target or an edited
        # script takes effect without a manual rollout.
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: secret-key-count-exporter
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # Borrowed purely as a Python 3.12 runtime: this is the already
          # published, already digest-pinned deploy-pipeline-monitor image
          # (python:3.12-alpine + requests + prometheus_client). The script
          # mounted below uses the standard library only, so nothing in this
          # image beyond `python` is required. Reusing it keeps the number of
          # operator gates at zero — no build, no publish, no digest to pin
          # before this control starts working. If it is ever replaced, any
          # image with python3 will do.
          image: ghcr.io/madfam-org/enclii/deploy-pipeline-monitor@sha256:88630fb74165c2553028a2654b269a19d543a31007d499c808978a371f461e45
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /opt/secret-key-count/exporter.py
          env:
            - name: TARGETS_PATH
              value: /etc/secret-key-count/secrets.json
            - name: METRICS_PORT
              value: "9092"
            - name: POLL_INTERVAL_SECONDS
              value: "30"
            - name: KUBE_API_TIMEOUT_SECONDS
              value: "5"
            - name: LOG_LEVEL
              value: INFO
            # readOnlyRootFilesystem + no writable __pycache__.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - containerPort: 9092
              name: metrics
              protocol: TCP
          startupProbe:
            httpGet:
              path: /metrics
              port: 9092
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: script
              mountPath: /opt/secret-key-count
              readOnly: true
            - name: targets
              mountPath: /etc/secret-key-count
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: secret-key-count-exporter-script
        - name: targets
          configMap:
            name: secret-key-count-exporter-targets

---
# The two annotations below are the entire scrape contract: the
# `kubernetes-services` job keeps endpoints whose SERVICE carries
# prometheus.io/scrape=true and rewrites the address using
# prometheus.io/port. Verified against the running Prometheus on 2026-08-06 —
# monitoring/prometheus is itself discovered this way and its target is UP.
apiVersion: v1
kind: Service
metadata:
  name: secret-key-count-exporter
  namespace: monitoring
  labels:
    app: secret-key-count-exporter
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9092"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9092
      targetPort: 9092
      protocol: TCP
  selector:
    app: secret-key-count-exporter

---
# The monitoring namespace has a `default-deny-all` NetworkPolicy covering
# both Ingress and Egress (infra/k8s/production/monitoring/
# network-policies.yaml), so this exporter needs both directions spelled out.
#
# The podSelector MUST match the pod labels above. The existing
# `node-exporter-ingress` policy in that file selects `app: node-exporter`
# while node-exporter's pods are labelled `app.kubernetes.io/name:
# node-exporter` — it matches nothing, which is why all four node-exporter
# scrape targets are DOWN with i/o timeouts. Reported separately; do not
# repeat the mistake here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secret-key-count-exporter-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: secret-key-count-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9092

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secret-key-count-exporter-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  podSelector:
    matchLabels:
      app: secret-key-count-exporter
  policyTypes:
    - Egress
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server — the only other thing this pod talks to.
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
