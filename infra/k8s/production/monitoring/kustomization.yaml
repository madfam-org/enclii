apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - prometheus-operator-crds/
  - prometheus.yaml
  - grafana.yaml
  - alertmanager.yaml
  # HA Track 3: 3-replica StatefulSet with per-pod PVC. Coexists with
  # the single-replica Deployment in alertmanager.yaml during the
  # cutover window. See alertmanager-statefulset.yaml header comment
  # for the migration sequence.
  - alertmanager-statefulset.yaml
  # Object-state exporter (kube_job_*, kube_pod_*, kube_deployment_*).
  # WITHOUT this line the manifest file still sits in this directory,
  # kustomize never renders it, and Argo reports Synced/Healthy for a
  # Deployment that was never created — which is exactly how the first
  # attempt (#388) shipped and looked like it had worked.
  - kube-state-metrics.yaml
  - network-policies.yaml
  - monitoring-policy-exception.yaml
  - prometheus-platform-rules.yaml
  - pgbackrest-health-rules.yaml
  - dashboards/

# Note: commonLabels are NOT used here because kustomize adds them to service
# selectors, causing selector mismatches with pods. Labels are set directly
# in each resource's metadata instead.
labels:
  - pairs:
      app.kubernetes.io/instance: monitoring
    includeSelectors: false
    includeTemplates: false

# Common annotations
commonAnnotations:
  enclii.dev/component: monitoring
