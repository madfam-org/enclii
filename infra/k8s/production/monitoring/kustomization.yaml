apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - prometheus-operator-crds/
  - prometheus.yaml
  - grafana.yaml
  - alertmanager.yaml
  # HA Track 3: 3-replica StatefulSet with per-pod PVC. Coexists with
  # the single-replica Deployment in alertmanager.yaml during the
  # cutover window. See alertmanager-statefulset.yaml header comment
  # for the migration sequence.
  - alertmanager-statefulset.yaml
  # Projects Angelia's courier_alertmanager_secret into the monitoring
  # namespace for Alertmanager's webhook_configs credentials_file. Cross-path
  # read of secret/angelia — Angelia owns the property, this namespace does not
  # hold a second copy. See the file's header for the inert-until-provisioned
  # behaviour. Replaces alertmanager-telegram-credentials.externalsecret.yaml,
  # deleted 2026-09-05: nothing consumed it, and the telegram_configs it was
  # kept for are now forbidden by internal-devops
  # decisions/2026-09-05-third-party-messaging-via-angelia-courier.md § 2 — no
  # platform in this estate holds a messaging-network bot token any more.
  - alertmanager-courier-secret.externalsecret.yaml
  # Object-state exporter (kube_job_*, kube_pod_*, kube_deployment_*).
  # WITHOUT this line the manifest file still sits in this directory,
  # kustomize never renders it, and Argo reports Synced/Healthy for a
  # Deployment that was never created — which is exactly how the first
  # attempt (#388) shipped and looked like it had worked.
  - kube-state-metrics.yaml
  - network-policies.yaml
  - monitoring-policy-exception.yaml
  - dashboards/
  # prometheus-platform-rules.yaml, pgbackrest-health-rules.yaml, and
  # wal-archive-rules/ were removed 2026-08-26 (availability remediation
  # Tier 0.3): they were PrometheusRule CRDs with no operator to reconcile
  # them into the running Prometheus. Every rule worth keeping was ported
  # into the prometheus-rules ConfigMap in prometheus.yaml (rule_files:
  # /etc/prometheus/rules/*.yml is the only thing this Prometheus loads);
  # duplicates of already-live rules were dropped. See that ConfigMap's
  # per-key header comments for the full port/skip accounting.
  # prometheus-operator + rules-eval Prometheus (availability remediation
  # Tier 0.3b, follows the Tier 0.3 port above). New subdirectory; does not
  # touch the existing hand-rolled Prometheus/Alertmanager above. The
  # rules-eval instance evaluates PrometheusRule CRDs cluster-wide (the
  # product-repo rule fleet the 0.3 port could not reach). See
  # prometheus-operator/README.md for what this deploys and why.
  - prometheus-operator/

# Note: commonLabels are NOT used here because kustomize adds them to service
# selectors, causing selector mismatches with pods. Labels are set directly
# in each resource's metadata instead.
labels:
  - pairs:
      app.kubernetes.io/instance: monitoring
    includeSelectors: false
    includeTemplates: false

# Common annotations
commonAnnotations:
  enclii.dev/component: monitoring
