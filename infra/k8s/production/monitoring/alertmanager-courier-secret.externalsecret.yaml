---
# Alertmanager → Angelia Courier receiver secret.
#
# Migration item M1 of internal-devops
# decisions/2026-09-05-third-party-messaging-via-angelia-courier.md: every
# message this estate sends to a person on a third-party messaging network goes
# through Angelia Courier, and anything that already publishes to Alertmanager
# reaches people through `webhook_configs` →
# POST /v1/courier/alertmanager (angelia docs/adr/0010-courier-outbound-comms-substrate.md,
# amendment of 2026-09-02).
#
# READERS PROJECT, THEY DO NOT COPY.
# This is the estate's "verifier-owns, cross-path read" pattern. Angelia
# VERIFIES this secret — it is the credential its receiver compares — so the
# canonical property is `courier_alertmanager_secret` at `secret/angelia`, and
# Angelia's intake target `angelia/courier-alertmanager` is its only writer.
# This ExternalSecret reads that one copy through the shared `vault-store`
# ClusterSecretStore, whose `eso-reader` policy already grants the controller
# `secret/data/*`. There is deliberately NO second copy at `secret/alertmanager`
# for the monitoring namespace to own: a second copy is a rotation that half
# lands, and the half that does not land is a pager that stops working with no
# error anywhere.
#
# ROTATION is one intake call. Re-run `enclii secrets intake
# angelia/courier-alertmanager` with a new value; ESO re-syncs every reader
# within refreshInterval. Nothing is hand-copied, so nothing drifts.
#
# INERT UNTIL PROVISIONED, and that state is safe rather than silent:
# until the target is populated this reports SecretSyncedError, the target
# Secret does not exist, alertmanager mounts it `optional: true` and starts
# normally, the webhook POSTs with no credential, Courier answers
# 503 not_provisioned, Alertmanager records a failed webhook notification, and
# `CourierReceiverDown` (prometheus-rules, courier-receiver-rules.yml) pages
# through the EMAIL receiver — the one path that does not depend on
# angelia-api. That is the same delivery behaviour as before this change, when
# the Slack blocks pointed at a Secret that was never populated either; the
# difference is that now the estate is told about it.
#
# deletionPolicy: Retain — deleting this ExternalSecret must not delete the
# credential out from under a running alertmanager peer.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-courier-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-courier-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The Secret key is also the mount's subPath and the basename of
    # `credentials_file: /etc/alertmanager/courier-alertmanager-secret` in
    # alertmanager.yaml. Renaming it here breaks the mount silently — the file
    # is simply absent and Alertmanager sends an unauthenticated webhook.
    - secretKey: courier-alertmanager-secret
      remoteRef:
        key: secret/angelia
        property: courier_alertmanager_secret
