---
# Alertmanager SMTP password, projected from Vault.
#
# WHY THIS EXISTS (owner decision 2026-10-05, internal-devops owner action 24,
# option A). Alertmanager's email fallback authenticated with a Secret,
# `alertmanager-smtp-secret`, that an operator created by hand with
# `kubectl create secret` and mounted with subPath. Nothing rotated it, and a
# subPath mount never receives Secret updates, so a new password also needed a
# restart of every peer. On 2026-10-05 one peer had failed 942 of 948 email
# notifications and `AlertmanagerEmailDeliveryFailing` had been firing since
# 2026-10-03. `CourierReceiverDown` routes to email only, so while email is
# dead a real Courier failure reaches nobody.
#
# ONE COPY. The canonical value is `secret/monitoring:alertmanager_smtp_password`,
# the property the git-only `monitoring-secrets` ExternalSecret
# (infra/k8s/base/external-secrets/vault-secrets/monitoring-secrets.yaml) has
# always read. Its only writer is the intake target
# `monitoring/alertmanager-smtp`
# (apps/switchyard-api/internal/secretsintake/registry.yaml), which merges this
# one property into the path and leaves the others there untouched. Intake
# force-syncs THIS ExternalSecret after the write.
#
# A NEW SECRET NAME, ON PURPOSE. This writes `alertmanager-smtp`, not the
# hand-made `alertmanager-smtp-secret`. ESO v0.9.11 (the chart this repo pins)
# with `creationPolicy: Owner` would adopt an existing Secret it does not own
# and overwrite it; a separate name keeps the old Secret intact, so reverting
# this change restores the previous behaviour exactly. The owner deletes
# `alertmanager-smtp-secret` once email delivery is verified
# (docs/runbooks/SECRET_INTAKE.md, "Alertmanager SMTP credential").
#
# HOW IT REACHES THE PROCESS. alertmanager-statefulset.yaml mounts this Secret
# as a DIRECTORY at /etc/alertmanager/smtp (`optional: true`), and
# alertmanager.yaml sets
# `smtp_auth_password_file: '/etc/alertmanager/smtp/smtp-password'`. The
# kubelet refreshes a directory mount by itself, and Alertmanager v0.26.0 reads
# the password file on every send (notify/email/email.go, getPassword), so a
# submitted or rotated password is used within about a kubelet sync period,
# with no restart and no config reload.
#
# BEFORE THE FIRST SUBMIT, OR IF THE PROPERTY IS MISSING, this reports
# SecretSyncedError, the Secret does not exist, the peers start with an empty
# directory, and every email notification fails with "could not read
# /etc/alertmanager/smtp/smtp-password". `AlertmanagerEmailDeliveryFailing`
# pages through Courier, which does not depend on email.
#
# deletionPolicy: Retain, so deleting this ExternalSecret does not delete the
# credential out from under a running peer.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-smtp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The Secret key is the file name inside the /etc/alertmanager/smtp
    # directory mount, i.e. the basename of `smtp_auth_password_file` in
    # alertmanager.yaml. Renaming it breaks email with no other symptom: the
    # file is absent and every send fails. Guarded by
    # tests/scripts/test_alertmanager_secret_mounts.py.
    - secretKey: smtp-password  # pragma: allowlist secret
      remoteRef:
        key: secret/monitoring
        property: alertmanager_smtp_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
