# =============================================================================
# AlertManager HA StatefulSet — HA Track 3 from
# internal-devops/runbooks/2026-05-04-ha-gap-audit-and-plan.md
# =============================================================================
#
# This file ships the StatefulSet that REPLACES the single-replica
# Deployment in `alertmanager.yaml`. Both files coexist in the kustomization
# during the migration window to allow:
#
#   1. apply this file → 3 new pods (alertmanager-{0,1,2}) come up alongside
#      the existing single Deployment pod, each with its own PVC. Cluster
#      gossip (port 9094) lets all 4 peers exchange silence state.
#   2. observe for 30+ minutes that the new StatefulSet pods are healthy and
#      gossiping, and any in-flight silences have replicated.
#   3. delete the old Deployment + the legacy `alertmanager-data` PVC. The
#      `alertmanager` Service (which selects on `app: alertmanager`) keeps
#      pointing at the new pods.
#   4. delete the old Deployment block in `alertmanager.yaml` in a follow-up
#      cleanup commit; promote `alertmanager-statefulset.yaml` to the
#      canonical name.
#
# The cutover is intentionally MANUAL because:
#   - Silence state is local to each alertmanager pod's PVC; killing the old
#     pod before the new StatefulSet exists means losing silences that
#     operators set during ongoing incidents.
#   - The existing Deployment uses `strategy: Recreate` for the same reason,
#     and respects PVC RWO semantics — switching to StatefulSet with
#     volumeClaimTemplates is the only way to get HA without RWX.
#
# Prerequisites:
#   - `alertmanager-cluster` headless Service (defined in alertmanager.yaml,
#     selectors stay compatible — both old Deployment and new StatefulSet
#     pods carry `app: alertmanager`).
#   - `alertmanager-config` + `alertmanager-smtp-secret` (already exist).
#   - `alertmanager-courier-secret`, projected by
#     alertmanager-courier-secret.externalsecret.yaml from
#     secret/angelia:courier_alertmanager_secret. Mounted `optional: true`, so
#     the peers start without it; the Courier receiver simply answers 503 and
#     email carries alerts until the intake target is populated. The
#     `alertmanager-slack-secret` this file used to name went with the
#     slack_configs blocks (internal-devops
#     decisions/2026-09-05-third-party-messaging-via-angelia-courier.md M1).
#
# After cutover, edit `prometheus.yaml` to point Prometheus' alerting target
# at the headless Service (`alertmanager-cluster.monitoring.svc:9093`) so
# alerts hit any healthy peer round-robin.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 3
  revisionHistoryLimit: 10
  serviceName: alertmanager-cluster
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: alertmanager
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: alertmanager
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: enclii
      annotations:
        enclii.dev/component: monitoring
    spec:
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spread peers across nodes — preferred (not required) because today's
      # cluster has only 2 worker nodes; required would leave 1 pod Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: alertmanager
                topologyKey: kubernetes.io/hostname
      containers:
        - name: alertmanager
          image: docker.io/prom/alertmanager:v0.26.0@sha256:361db356b33041437517f1cd298462055580585f26555c317df1a3caf2868552
          imagePullPolicy: IfNotPresent
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--cluster.listen-address=0.0.0.0:9094"
            # Each peer's own DNS name + the explicit list of all 3 peers
            # via the headless Service. Stable DNS (StatefulSet ordinal +
            # serviceName) means cluster gossip works deterministically.
            - "--cluster.peer=alertmanager-0.alertmanager-cluster.monitoring.svc.cluster.local:9094"
            - "--cluster.peer=alertmanager-1.alertmanager-cluster.monitoring.svc.cluster.local:9094"
            - "--cluster.peer=alertmanager-2.alertmanager-cluster.monitoring.svc.cluster.local:9094"
            - "--web.external-url=https://alertmanager.enclii.dev"
          ports:
            - containerPort: 9093
              name: http
              protocol: TCP
            - containerPort: 9094
              name: cluster
              protocol: TCP
            - containerPort: 9094
              name: cluster-udp
              protocol: UDP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: smtp-secret
              mountPath: /etc/alertmanager/smtp-password
              subPath: smtp-password
              readOnly: true
            # The Courier receiver's shared secret, read by
            # `http_config.authorization.credentials_file` in both
            # webhook_configs. Replaces the slack-webhook-url mount, which went
            # with the slack_configs blocks. The telegram-bot-token mount went
            # too: nothing referenced it, and re-adding telegram_configs — the
            # only thing it existed for — is now forbidden by
            # internal-devops decisions/2026-09-05-third-party-messaging-via-angelia-courier.md § 2.
            - name: courier-secret
              mountPath: /etc/alertmanager/courier-alertmanager-secret
              subPath: courier-alertmanager-secret
              readOnly: true
            - name: data
              mountPath: /alertmanager
          startupProbe:
            httpGet:
              path: /-/ready
              port: 9093
              scheme: HTTP
            failureThreshold: 15
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
              scheme: HTTP
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
              scheme: HTTP
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            defaultMode: 420
            name: alertmanager-config
        - name: smtp-secret
          secret:
            defaultMode: 420
            secretName: alertmanager-smtp-secret
        - name: courier-secret
          secret:
            defaultMode: 420
            # Populated by alertmanager-courier-secret.externalsecret.yaml,
            # which reads secret/angelia:courier_alertmanager_secret CROSS-PATH
            # through the shared vault-store. Angelia owns that property; this
            # namespace projects it, it does not hold a second copy.
            #
            # `optional: true` on purpose: until the operator runs
            # `enclii secrets intake angelia/courier-alertmanager` the Secret
            # does not exist, and a required mount would leave every
            # alertmanager peer Pending — i.e. the whole estate's alerting down
            # waiting on a credential whose absence is supposed to be merely
            # inert. With optional, the webhook POSTs with no credential, the
            # receiver answers 503, and email keeps carrying alerts.
            secretName: alertmanager-courier-secret
            optional: true
  # Each pod gets its own 1Gi PVC. RWO is fine because each pod owns its own
  # volume — no Multi-Attach errors. Longhorn handles per-pod replication
  # for durability.
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        creationTimestamp: null
        name: data
        labels:
          app.kubernetes.io/name: alertmanager
          app.kubernetes.io/component: monitoring
          app.kubernetes.io/part-of: enclii
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        volumeMode: Filesystem
        resources:
          requests:
            storage: 1Gi
---
# The ONLY PodDisruptionBudget selecting alertmanager pods. The
# Deployment-era `alertmanager-pdb` (minAvailable: 1) in alertmanager.yaml
# selected the same `app: alertmanager` label and was removed 2026-08-26 —
# two PDBs over one pod make the eviction API choose arbitrarily between
# them, which is not a disruption policy at all.
#
# minAvailable: 2 of a 3-member gossip cluster: exactly one voluntary
# disruption at a time, so the remaining two keep quorum on silence and
# notification-dedup state. Operators planning a node drain should still
# pause silences first.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager-statefulset-pdb
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: alertmanager
