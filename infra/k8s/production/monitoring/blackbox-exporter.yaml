---
# Blackbox exporter: synthetic HTTP probes of the revenue flows.
# ----------------------------------------------------------------------------
# WHY (money-machine audit 2026-10-11, M2 F1/F2/F5). Until this file, nothing
# in this Prometheus probed an application over HTTP. Every revenue alert was
# replica-based (ClientDeploymentUnavailable) or app-supplied, so an app that
# answered 500 behind Ready pods paged nobody:
#   - cotiza.studio served its front page while every /api/* path returned 500
#     (the web proxy pointed at localhost:4000) and the quote flow was down;
#   - api.dhan.am priced USD/MXN off its hardcoded emergency table
#     (`"source":"emergency_fallback"`) while /health answered 200.
# Argo read both apps Healthy. The status page polls but does not page.
#
# WHAT. One stateless exporter. Prometheus calls it with ?target=<url>&module=
# from the `blackbox-revenue` scrape job in prometheus.yaml (prometheus-config
# ConfigMap), and the `revenue-probes` rule group in the same file pages on
# the result, `severity: critical`, so it reaches critical-receiver (Courier +
# email). The probes go out through the PUBLIC hostnames, through Cloudflare
# and the tunnel, the same path a customer's browser takes. That is the point:
# the cotiza failure was invisible from inside the cluster's Service network.
#
# Probe targets are NOT listed here; they live with the scrape job, next to
# the rules that read them. This file only defines HOW to probe (modules).
#
# COST. requests 10m CPU / 32Mi, limits 100m CPU / 128Mi; ~20 GETs a minute
# out to the public edge; ~20 x 15 series in Prometheus (probe_* per target).
# The `blackbox-geometry` job (geometry-factory hosts, 2026-10-18) adds 13
# GETs a minute and ~13 x 15 series through the same exporter, at the same
# 60s interval.
# monitoring-quota headroom (namespace.yaml): limits.cpu peak 5.5 -> 5.6 of 6,
# limits.memory ~15.0Gi -> ~15.1Gi of 16Gi, requests well inside 2 CPU / 8Gi.
#
# Image: the upstream release, pinned by digest (multi-arch index), like every
# other third-party image in this namespace. monitoring-policy-exception.yaml
# already admits quay.io Deployments here.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
data:
  config.yml: |
    # Every module:
    #   - GET over IPv4, TLS required (fail_if_not_ssl);
    #   - redirects are NOT followed: a health URL that starts redirecting
    #     (to a login page, to a locale) is a broken health URL, and following
    #     it would score the login page's 200 as healthy;
    #   - a fixed User-Agent so the probe is recognisable in edge and app logs;
    #   - 10s timeout, inside the scrape job's 15s scrape_timeout.
    modules:
      # 2xx and a JSON-ish status field. The body check exists because some
      # SPAs answer 200 with index.html for ANY path, /api/health included
      # (factl.as and yantra4d.com do today), and that would read as healthy.
      http_2xx_json:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_not_matches_regexp:
            - '"(status|ok)"\s*:'

      # 2xx and a body that is a JSON ARRAY. For list endpoints, which answer
      # a bare array (`[]` when the list is empty) and so carry no status/ok
      # field: under http_2xx_json such a URL fails every probe while it is
      # healthy, a false RevenueEndpointDown that never clears. Cotiza's
      # guest-quote list did exactly that from 2026-10-12. The regex is
      # anchored to the start of the body (Go regexp, no (?m)), so an SPA's
      # index.html or a JSON error object answered with 200 still fails.
      http_2xx_json_array:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_not_matches_regexp:
            - '^\s*\['

      # An authenticated API route answering 401 to an anonymous GET: the
      # route exists, the app is up, and auth is enforced. A 5xx, a timeout,
      # a 404 (route gone) or a 200 (auth gone) all fail.
      http_401:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          valid_status_codes: [401]
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"

      # Janua's readiness report, /api/v1/health/ready. By owner decision
      # (2026-10-04, internal-devops R107 and R109) readiness does NOT gate on
      # Redis or the database: it answers 200 while either is down, so every
      # replica stays in the Service and JWKS and discovery keep serving, and
      # it reports the state in the body. A status-code check, or a probe of
      # /health (which carries no Redis or database field at all), stays green
      # through exactly the outages in which refresh and revocation answer
      # 503. So the body decides. Every regex in the first list must match:
      #   "status":"ready"   it reads "degraded" when Redis or the database is
      #                      not healthy;
      #   "degraded":[]      the reported-only checks that are failing (Redis,
      #                      the database); empty when both are healthy;
      #   "state":"closed"   this replica's Redis circuit breaker; "open" or
      #                      "half_open" means its Redis calls are failing.
      # and the second list must not: "healthy":false is the database field.
      # The breaker is per replica and the Service picks one per probe, so a
      # single replica's open breaker fails some probes, not all;
      # RevenueEndpointDown needs 3 minutes of consecutive failure.
      http_janua_ready:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_not_matches_regexp:
            - '"status"\s*:\s*"ready"'
            - '"degraded"\s*:\s*\[\s*\]'
            - '"state"\s*:\s*"closed"'
          fail_if_body_matches_regexp:
            - '"healthy"\s*:\s*false'

      # http_401 for a session-gated web app that answers a DOCUMENT
      # navigation with a redirect to its login page and anything else with a
      # bare 401. Nauta's middleware (apps/web/src/middleware.ts) classifies a
      # request with no Accept header as a document navigation, and this
      # exporter sends none, so under plain http_401 a healthy workspace host
      # answers 307 and fails every probe. Asking for JSON makes it answer
      # 401. The 401 means: the hostname reaches the app through Cloudflare
      # and the tunnel, the app resolved the host to a client workspace (an
      # unbound host answers 404), and the session gate is on (200 fails).
      http_401_json:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          valid_status_codes: [401]
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
            Accept: "application/json"

      # Dhanam's public billing catalog: 2xx, at least one product, and at
      # least one tier carrying an IVA-inclusive MXN price (`grossPrices`),
      # the figure every pricing page displays and the checkout charges. A
      # catalog that still lists products but lost its gross prices would
      # render price-less tier cards on every product's pricing page.
      # FRESHNESS is not checkable here: the response's `updatedAt` is the
      # time of the response, not of the last Tulana-to-Dhanam sync, so a
      # stale catalog looks identical to a fresh one (recorded as a Dhanam
      # gap in the PR that added the grossPrices check).
      http_dhanam_catalog:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_not_matches_regexp:
            - '"products"\s*:\s*\[\s*\{'
            - '"grossPrices"\s*:\s*\{\s*"MXN"\s*:\s*\{\s*"monthly"\s*:\s*[1-9]'

      # Dhanam FX health: 2xx, and the test rate must NOT come from the
      # hardcoded emergency table. A body match sets
      # probe_failed_due_to_regex=1, which the DhanamFXEmergencyFallback rule
      # reads, so "FX is on the emergency table" pages as itself and not as
      # "endpoint down". Only this one regex is configured, on purpose: a
      # second one would make probe_failed_due_to_regex ambiguous.
      http_dhanam_fx:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_matches_regexp:
            - '"source"\s*:\s*"emergency_fallback"'

      # ---- Money paths (money-engine wave 2, 2026-10-18) ----------------
      # The modules below probe the PAGES and the sign-in rail a buyer goes
      # through, not only the APIs behind them. Each answers today exactly as
      # its pass condition says (the curl evidence is in the PR that added
      # them, enclii "money-path probes").

      # A public HTML page answering 2xx without a redirect. For pricing,
      # sign-up and booking pages whose prices or forms render in the browser
      # (dhan.am/pricing, app.dhan.am/register, kalya.app/madfam): the server
      # HTML carries no price to check, so the body check only proves an HTML
      # document came back. What it catches: 5xx, 404 (route gone), a
      # redirect (to a login wall or a locale), a JSON error with 200. What it
      # cannot: a page that renders broken in the browser; that is the
      # journeys runner's job (internal-devops tools/journeys).
      http_page_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_not_matches_regexp:
            - '(?i)<html'

      # http_page_2xx for a pricing page that renders its prices on the
      # server: the HTML must also name the currency and IVA. On these pages
      # the tier cards are rendered from the Dhanam catalog (gross MXN,
      # «IVA incluido»), so a page whose catalog read failed and fell back to
      # an empty or price-less shell fails here. No price VALUE is checked:
      # prices belong to Tulana and Dhanam, and a probe that pins one would
      # page on every legitimate price change.
      http_pricing_page:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_not_matches_regexp:
            - '(?i)<html'
            - 'MXN'
            - 'IVA'

      # Janua's OpenID discovery document: the issuer every product's
      # sign-in redirect and token check starts from. It must name the
      # production issuer and a JWKS URI.
      http_oidc_discovery:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_not_matches_regexp:
            - '"issuer"\s*:\s*"https://auth\.madfam\.io"'
            - '"jwks_uri"\s*:\s*"https://'

      # Janua's signing keys: at least one key. Every API that verifies a
      # Janua token (Dhanam's checkout and billing routes among them) reads
      # this; an empty key set fails every signed-in request.
      http_jwks:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_not_matches_regexp:
            - '"keys"\s*:\s*\[\s*\{'

      # The sign-in call a Dhanam buyer's browser makes, from Dhanam's
      # origin: an anonymous GET of Janua's session route with
      # `Origin: https://app.dhan.am` must answer 401 AND allow that origin.
      # This is the failure that blocked the synthetic buyer's sign-up on
      # 2026-10-17 (Janua's CORS list lacked a Dhanam origin; janua#727):
      # every Janua health check was green while the browser's sign-up call
      # was refused.
      http_janua_cors_dhanam:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          valid_status_codes: [401]
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
            Accept: "application/json"
            Origin: "https://app.dhan.am"
          fail_if_header_not_matches:
            - header: Access-Control-Allow-Origin
              regexp: '^https://app\.dhan\.am$'

      # Dhanam FX served but DEGRADED (a stored or spot rate instead of the
      # provider's): `"degraded":true` in the test rate. Separate from
      # http_dhanam_fx on purpose, so that module's one regex keeps meaning
      # "emergency_fallback" and nothing else. A warning, not a page: a
      # degraded rate is a real rate.
      http_dhanam_fx_degraded:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_matches_regexp:
            - '"degraded"\s*:\s*true'

      # Karafiel's full health report with its task broker. /api/v1/health/
      # answers 200 while Redis (the Celery broker the worker and beat read)
      # is down, because only the database decides its status code. Asynchronous
      # CFDI work (the worker's queue) stops in that state, so this module also
      # requires "redis":"connected". Karafiel has no endpoint that reports the
      # PAC (Facturapi) itself; that gap is recorded in the PR.
      http_karafiel_broker:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_not_matches_regexp:
            - '"database"\s*:\s*"connected"'
            - '"redis"\s*:\s*"connected"'

      # Exactly 200 and an HTML document. For a static site whose only honest
      # health signal is its front page: yantra4d.com is an SPA whose
      # /api/health is its index.html (see http_2xx_json), so the
      # `blackbox-geometry` job probes its root with this. An empty 200 or a
      # JSON error answered with 200 fails, as does any redirect.
      http_200_html:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          valid_status_codes: [200]
          headers:
            User-Agent: "madfam-revenue-probe/1.0 (+https://github.com/madfam-org/enclii)"
          fail_if_body_not_matches_regexp:
            - '(?i)<html'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
  annotations:
    # Roll the pod when the module ConfigMap changes.
    reloader.stakater.com/auto: "true"
spec:
  # One replica: the exporter is stateless and Prometheus is its only client.
  # While it is down every probe series goes absent, which is exactly what
  # RevenueProbesNotRunning pages on, so the gap is never silent.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
        app.kubernetes.io/name: blackbox-exporter
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: enclii
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/blackbox_exporter/config.yml
            - --web.listen-address=:9115
          ports:
            - containerPort: 9115
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox_exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  type: ClusterIP
  ports:
    - port: 9115
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: blackbox-exporter
