---
# Alertmanager → alerting heartbeat Worker bearer token.
#
# watchdog-sink (alertmanager.yaml) POSTs the always-firing Watchdog alert
# about every 2 minutes to https://heartbeat.madfam.io/v1/alertmanager, a
# Cloudflare Worker outside the cluster (internal-devops
# ops/cloudflare/alerting-heartbeat, runbooks/alerting-heartbeat.md). The
# Worker pages the pager group directly when the beats stop. This is the one
# sanctioned sender outside Angelia Courier (amendment of 2026-09-27 to
# decisions/2026-09-05-third-party-messaging-via-angelia-courier.md), because
# a dead man's switch cannot depend on the cluster it watches.
#
# The same token lives in two places, from ONE generated value: this Vault
# property, and the Worker secret HEARTBEAT_TOKEN. Rotate both together; a
# mismatch shows up as 401s from the Worker, then as a stale heartbeat page.
#
# The secretKey below is the file name alertmanager.yaml's credentials_file
# reads (/etc/alertmanager/heartbeat/alertmanager-heartbeat-token). Renaming
# it here breaks the beat silently: the file is absent and every POST fails.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-heartbeat-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-heartbeat-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: alertmanager-heartbeat-token  # pragma: allowlist secret
      remoteRef:
        key: secret/monitoring
        property: alertmanager_heartbeat_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
