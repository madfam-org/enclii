---
# Grafana local admin password, projected from Vault.
#
# WHY THIS EXISTS (2026-10-17). Grafana's admin password came from
# `grafana-credentials`, a Secret created by hand with `kubectl create secret`
# (grafana-credentials.yaml.template, infra/scripts/setup-infrastructure.sh,
# scripts/deploy-monitoring.sh). It had no writer of record and no rotation.
# This routes it through `enclii secrets intake`, the same way the
# Alertmanager SMTP password moved on 2026-10-05
# (alertmanager-smtp.externalsecret.yaml).
#
# ONE COPY. The canonical value is `secret/monitoring:grafana_admin_password`,
# the property the git-only `monitoring-secrets` ExternalSecret
# (infra/k8s/base/external-secrets/vault-secrets/monitoring-secrets.yaml) has
# always named. That ExternalSecret is not deployed, and is deliberately not
# wired here: ESO syncs all of an ExternalSecret's keys or none, so it would
# stay in SecretSyncedError until grafana_smtp_password also existed, and
# nothing mounts its `monitoring-secrets` Secret. The only writer of the
# property is the intake target `monitoring/grafana-admin`
# (apps/switchyard-api/internal/secretsintake/registry.yaml), which merges this
# one property into the path and leaves the others untouched. Intake
# force-syncs THIS ExternalSecret after the write.
#
# A NEW SECRET NAME, ON PURPOSE. This writes `grafana-admin`, not the
# hand-made `grafana-credentials`. ESO v0.9.11 with `creationPolicy: Owner`
# would adopt an existing Secret it does not own and overwrite it; a separate
# name keeps the old Secret intact, so reverting this change restores the
# previous behaviour exactly.
#
# HOW IT REACHES GRAFANA. Grafana reads GF_SECURITY_ADMIN_PASSWORD only when it
# creates its database (first run); the database lives on the grafana-data PVC,
# so changing the env var alone never changes the password anyone logs in with.
# The `admin-password-sync` init container in grafana.yaml mounts this Secret as
# a directory (`optional: true`) and, when the file is present, sets the stored
# admin password from it with `grafana-cli admin reset-admin-password
# --password-from-stdin` before Grafana starts. So the submitted value takes
# effect at the next Grafana pod start (`enclii ops pods restart`).
#
# BEFORE THE FIRST SUBMIT, OR IF THE PROPERTY IS MISSING, this reports
# SecretSyncedError, the Secret does not exist, the init container finds no file
# and exits 0 without touching the database, and Grafana keeps the admin
# password it already has. Nothing breaks.
#
# deletionPolicy: Retain, so deleting this ExternalSecret does not delete the
# credential out from under a running pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The Secret key is the file name inside the /etc/grafana-admin directory
    # mount that the admin-password-sync init container reads. Renaming it
    # turns the sync into a silent no-op. Guarded by
    # tests/scripts/test_grafana_admin_secret.py.
    - secretKey: admin-password  # pragma: allowlist secret
      remoteRef:
        key: secret/monitoring
        property: grafana_admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
