apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml

# policy.yaml is the file the descheduler reads; keep it a plain file so it
# can be reviewed and tested as-is. A stable name is enough: every run is a
# new pod that reads the ConfigMap as it is then.
configMapGenerator:
  - name: descheduler-policy
    namespace: descheduler
    files:
      - policy.yaml
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: descheduler
        app.kubernetes.io/part-of: enclii
