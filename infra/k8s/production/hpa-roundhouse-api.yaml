apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: roundhouse-api
  namespace: enclii
  labels:
    app.kubernetes.io/name: roundhouse-api
    app.kubernetes.io/component: build-worker
    app.kubernetes.io/part-of: enclii
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: roundhouse-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
