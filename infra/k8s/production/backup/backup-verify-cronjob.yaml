---
# Weekly backup verification CronJob
# Downloads latest postgres backup from R2, restores to temp container,
# validates data, then cleans up. Exit code indicates success/failure
# for Prometheus kube_job_status scraping.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verify
  namespace: enclii
  labels:
    app: backup-verify
    app.kubernetes.io/name: backup-verify
    app.kubernetes.io/component: disaster-recovery
    app.kubernetes.io/part-of: enclii
spec:
  schedule: "0 4 * * 0"  # Sunday 4am UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800  # 30 min max
      template:
        metadata:
          labels:
            app: backup-verify
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999   # postgres user
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: postgres:15
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false  # postgres needs to write data dir
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
                - name: POSTGRES_PASSWORD
                  value: "verify-temp"
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: account-id
                - name: R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: access-key-id
                - name: R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: secret-access-key
              command:
                - /bin/bash
                - -euo
                - pipefail
                - -c
                - |
                  echo "=== Backup Verification Started ==="

                  # Install aws-cli (minimal)
                  apt-get update -qq && apt-get install -y -qq python3-pip > /dev/null 2>&1
                  pip3 install -q awscli 2>/dev/null

                  # Download latest backup
                  ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
                  export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
                  export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"

                  echo "Downloading latest backup from R2..."
                  aws s3 cp s3://enclii-backups/postgres/latest.sql.gz /tmp/backup.sql.gz \
                    --endpoint-url "${ENDPOINT}" --quiet

                  BACKUP_SIZE=$(stat -c%s /tmp/backup.sql.gz 2>/dev/null || stat -f%z /tmp/backup.sql.gz)
                  echo "Backup size: ${BACKUP_SIZE} bytes"

                  if [ "${BACKUP_SIZE}" -lt 1000 ]; then
                    echo "ERROR: Backup file suspiciously small (${BACKUP_SIZE} bytes)"
                    exit 1
                  fi

                  # Start temporary postgres
                  echo "Starting temporary PostgreSQL..."
                  pg_ctlcluster 15 main start 2>/dev/null || {
                    # Fallback: init and start manually
                    initdb -D "${PGDATA}" --auth=trust > /dev/null
                    pg_ctl -D "${PGDATA}" -l /tmp/pg.log start
                  }

                  # Wait for postgres to be ready
                  for i in $(seq 1 30); do
                    pg_isready -U postgres && break
                    sleep 1
                  done

                  # Create database and restore
                  echo "Restoring backup..."
                  createdb -U postgres enclii_verify 2>/dev/null || true
                  gunzip -c /tmp/backup.sql.gz | psql -U postgres -d enclii_verify -q 2>/dev/null

                  # Validate
                  echo "Validating restored data..."
                  PROJECT_COUNT=$(psql -U postgres -d enclii_verify -t -c "SELECT count(*) FROM projects;" 2>/dev/null | tr -d ' ')

                  if [ -z "${PROJECT_COUNT}" ] || [ "${PROJECT_COUNT}" = "0" ]; then
                    echo "WARNING: projects table empty or missing (count: ${PROJECT_COUNT:-null})"
                    # Not necessarily a failure — fresh installs have 0 projects
                  fi

                  echo "=== Verification Result ==="
                  echo "Backup size: ${BACKUP_SIZE} bytes"
                  echo "Project count: ${PROJECT_COUNT:-unknown}"
                  echo "Status: SUCCESS"
                  echo "=== Backup Verification Complete ==="
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              volumeMounts:
                - name: temp-data
                  mountPath: /var/lib/postgresql/data
          volumes:
            - name: temp-data
              emptyDir:
                sizeLimit: 2Gi
