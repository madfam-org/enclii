---
# Weekly backup verification CronJob
# Downloads latest postgres backup from R2 (init container with aws-cli),
# then restores to a temp postgres instance and validates data.
# Exit code indicates success/failure for Prometheus kube_job_status scraping.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verify
  namespace: data
  labels:
    app: backup-verify
    app.kubernetes.io/name: backup-verify
    app.kubernetes.io/component: disaster-recovery
    app.kubernetes.io/part-of: enclii
spec:
  schedule: "0 4 * * 0"  # Sunday 4am UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800  # 30 min max
      template:
        metadata:
          labels:
            app: backup-verify
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999   # postgres user
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: download-backup
              image: docker.io/amazon/aws-cli:2.22.35@sha256:6977c83ae3dc99f28fcf8276b9ea5eec33833cd5be40574b34112e98113ec7a2
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: account-id
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: secret-access-key
                - name: AWS_DEFAULT_REGION
                  value: "auto"
              command:
                - /bin/bash
                - -euo
                - pipefail
                - -c
                - |
                  ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
                  echo "Downloading latest backup from R2..."

                  # Find latest backup file
                  LATEST=$(aws s3 ls "s3://enclii-backups/postgres/" --endpoint-url "${ENDPOINT}" | sort | tail -1 | awk '{print $4}')
                  if [ -z "$LATEST" ]; then
                    echo "ERROR: No backups found in s3://enclii-backups/postgres/"
                    exit 1
                  fi
                  echo "Latest backup: ${LATEST}"

                  aws s3 cp "s3://enclii-backups/postgres/${LATEST}" /shared/backup.sql.gz \
                    --endpoint-url "${ENDPOINT}" --quiet

                  BACKUP_SIZE=$(stat -c%s /shared/backup.sql.gz 2>/dev/null || stat -f%z /shared/backup.sql.gz)
                  echo "Backup size: ${BACKUP_SIZE} bytes"

                  if [ "${BACKUP_SIZE}" -lt 1000 ]; then
                    echo "ERROR: Backup file suspiciously small (${BACKUP_SIZE} bytes)"
                    exit 1
                  fi
                  echo "Download complete."
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
              volumeMounts:
                - name: shared
                  mountPath: /shared
          containers:
            - name: verify
              image: docker.io/pgvector/pgvector:pg15@sha256:bd12d6788a617f4147d5a2ae0b56d07921398adabfe5a033bd3f50c245df55a1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
                - name: POSTGRES_PASSWORD
                  value: "verify-temp"
              command:
                - /bin/bash
                - -euo
                - pipefail
                - -c
                - |
                  echo "=== Backup Verification Started ==="

                  # Start temporary postgres.
                  #
                  # Bounded ON PURPOSE: this job runs a real postgres inside the
                  # pod's memory limit and restores the ENTIRE pg_dumpall into
                  # it, so its footprint must be a function of configuration, not
                  # of how big production has grown. With initdb defaults
                  # (shared_buffers=128MB) it OOMKilled on three consecutive
                  # weekly runs once the cluster passed ~1.4 GB — silently,
                  # because BackupVerifyFailed was itself dead (kube-state-metrics
                  # was never deployed).
                  #
                  # Durability is off: this cluster is discarded at job end, so
                  # fsync would protect nothing and costs most of the restore's
                  # wall-clock.
                  echo "Starting temporary PostgreSQL..."
                  initdb -D "${PGDATA}" --auth=trust > /dev/null
                  pg_ctl -D "${PGDATA}" -l /tmp/pg.log start -o "\
                    -c shared_buffers=32MB \
                    -c maintenance_work_mem=64MB \
                    -c work_mem=4MB \
                    -c max_connections=10 \
                    -c fsync=on \
                    -c full_page_writes=on \
                    -c synchronous_commit=off \
                    -c max_wal_size=128MB \
                    -c checkpoint_timeout=60s"

                  # Wait for postgres to be ready
                  for i in $(seq 1 30); do
                    pg_isready -U postgres && break
                    sleep 1
                  done

                  cleanup() {
                    pg_ctl -D "${PGDATA}" stop -m fast >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT

                  # Restore the pg_dumpall archive into the temporary cluster.
                  echo "Restoring backup..."
                  if ! gunzip -c /shared/backup.sql.gz | psql -U postgres -d postgres -q 2>/tmp/restore.err; then
                    echo "ERROR: Restore failed"
                    sed -n '1,80p' /tmp/restore.err
                    exit 1
                  fi

                  # COMPLETENESS GATE (added 2026-08-13).
                  #
                  # The old check was `TABLE_COUNT > 0`, which passes when ONE
                  # database out of 35 restores. That is exactly what was
                  # happening: a psql/server major-version mismatch left the
                  # restore in \restrict mode, every \connect was refused, and
                  # only the alphabetically-first few databases came back — while
                  # this job reported "Status: SUCCESS".
                  #
                  # Compare what the ARCHIVE claims against what actually landed.
                  # A DR rehearsal that cannot detect losing 85% of the estate is
                  # not a rehearsal.
                  EXPECTED_DBS=$(gunzip -c /shared/backup.sql.gz | grep -c "^CREATE DATABASE" || true)
                  RESTORED_DBS=$(psql -U postgres -d postgres -tAc "SELECT count(*) FROM pg_database WHERE datistemplate = false AND datname <> 'postgres';")
                  echo "Databases in archive: ${EXPECTED_DBS}, restored: ${RESTORED_DBS}"

                  if [ "${EXPECTED_DBS}" -lt 1 ]; then
                    echo "ERROR: archive declares no databases — it is not a cluster dump"
                    exit 1
                  fi

                  if [ "${RESTORED_DBS}" -lt "${EXPECTED_DBS}" ]; then
                    echo "ERROR: INCOMPLETE RESTORE — archive has ${EXPECTED_DBS} databases, only ${RESTORED_DBS} restored"
                    echo "First 40 lines of restore stderr:"
                    sed -n '1,40p' /tmp/restore.err
                    exit 1
                  fi

                  # Validate
                  echo "Validating restored data..."
                  DB_LIST=$(psql -U postgres -d postgres -tAc "SELECT datname FROM pg_database WHERE datistemplate = false AND datallowconn = true ORDER BY datname;")
                  TABLE_COUNT=0
                  DB_SUMMARY=""
                  PROJECT_COUNT="not-found"

                  echo "Databases found:"
                  printf '%s\n' "${DB_LIST}"

                  for DB_NAME in ${DB_LIST}; do
                    echo "Checking database: ${DB_NAME}"
                    if ! DB_TABLES=$(psql -U postgres -d "${DB_NAME}" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" 2>/tmp/validate.err); then
                      echo "WARN: Could not validate database ${DB_NAME}"
                      sed -n '1,40p' /tmp/validate.err
                      continue
                    fi

                    TABLE_COUNT=$((TABLE_COUNT + DB_TABLES))
                    DB_SUMMARY="${DB_SUMMARY}${DB_NAME}:${DB_TABLES} "

                    if [ "${PROJECT_COUNT}" = "not-found" ]; then
                      HAS_PROJECTS=$(psql -U postgres -d "${DB_NAME}" -tAc "SELECT to_regclass('public.projects') IS NOT NULL;" 2>/dev/null || echo "f")
                      if [ "${HAS_PROJECTS}" = "t" ]; then
                        PROJECT_COUNT=$(psql -U postgres -d "${DB_NAME}" -tAc "SELECT count(*) FROM public.projects;" 2>/dev/null || echo "unknown")
                      fi
                    fi
                  done

                  echo "=== Verification Result ==="
                  echo "Tables: ${TABLE_COUNT}"
                  echo "Databases: ${DB_SUMMARY}"
                  echo "Project count: ${PROJECT_COUNT}"

                  if [ -z "${TABLE_COUNT}" ] || [ "${TABLE_COUNT}" = "0" ]; then
                    echo "ERROR: No tables found after restore"
                    echo "Restore stderr sample:"
                    sed -n '1,80p' /tmp/restore.err
                    exit 1
                  fi

                  echo "Status: SUCCESS"
                  echo "=== Backup Verification Complete ==="
              resources:
                requests:
                  # Sized against the TUNED postgres footprint above
                  # (shared_buffers 32M + maintenance_work_mem 64M + backends)
                  # plus dirty page cache while writing PGDATA, with ~2x headroom
                  # so ordinary data growth does not resurrect the OOM.
                  # Revisit when total prod data passes ~4 GB.
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "3Gi"
                  cpu: "1000m"
              volumeMounts:
                - name: temp-data
                  mountPath: /var/lib/postgresql/data
                - name: shared
                  mountPath: /shared
          volumes:
            - name: temp-data
              emptyDir:
                # Holds the fully restored cluster + WAL. Prod data was 1.4 GB
                # at 2026-08-13; 2Gi left almost no margin.
                sizeLimit: 6Gi
            - name: shared
              emptyDir:
                # Holds the compressed pg_dumpall downloaded from R2.
                sizeLimit: 3Gi
