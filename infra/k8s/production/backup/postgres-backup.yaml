---
# PostgreSQL Backup to Cloudflare R2
#
# This CronJob runs daily backups of PostgreSQL and uploads to R2.
# Requires r2-backup-credentials secret with R2 access keys.
#
# Usage:
#   1. Create the R2 bucket: enclii-backups
#   2. Create R2 API tokens with write access
#   3. Create the secret (see backup-secrets.yaml.template)
#   4. Apply this manifest

# Backup Script ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-script
  namespace: data
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
data:
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    # Configuration from environment
    BACKUP_BUCKET="${R2_BUCKET:-enclii-backups}"
    BACKUP_PREFIX="${BACKUP_PREFIX:-postgres}"
    R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

    # Timestamp for backup file
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    BACKUP_FILE="/tmp/backup_${TIMESTAMP}.sql.gz"
    BACKUP_KEY="${BACKUP_PREFIX}/${TIMESTAMP}.sql.gz"

    echo "[$(date)] Starting PostgreSQL backup..."

    # Dump all databases (enclii, janua, dhanam share this postgres)
    echo "[$(date)] Running pg_dumpall..."
    PGPASSWORD="${POSTGRES_PASSWORD}" pg_dumpall \
      -h "${POSTGRES_HOST}" \
      -U "${POSTGRES_USER}" \
      --no-owner \
      --no-role-passwords \
      | gzip > "${BACKUP_FILE}"

    BACKUP_SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
    echo "[$(date)] Backup created: ${BACKUP_FILE} (${BACKUP_SIZE})"

    # Upload to R2 using Python S3v4 signer (no awscli needed)
    echo "[$(date)] Uploading to R2: s3://${BACKUP_BUCKET}/${BACKUP_KEY}"
    python3 /scripts/s3upload.py put "${BACKUP_FILE}" "${BACKUP_KEY}"

    # Also maintain a 'latest' copy for easy access
    python3 /scripts/s3upload.py put "${BACKUP_FILE}" "${BACKUP_PREFIX}/latest.sql.gz"

    echo "[$(date)] Upload complete"

    # Cleanup local file
    rm -f "${BACKUP_FILE}"

    echo "[$(date)] Backup complete: ${BACKUP_KEY}"

  s3upload.py: |
    #!/usr/bin/env python3
    """Minimal S3v4-compatible upload for Cloudflare R2. No external dependencies."""
    import hashlib, hmac, os, sys, urllib.request, urllib.error
    from datetime import datetime, timezone

    REGION = "auto"
    SERVICE = "s3"
    BUCKET = os.environ.get("R2_BUCKET", "enclii-backups")
    ENDPOINT = f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com"
    ACCESS_KEY = os.environ["AWS_ACCESS_KEY_ID"]
    SECRET_KEY = os.environ["AWS_SECRET_ACCESS_KEY"]

    def sign(key, msg):
        return hmac.new(key, msg.encode("utf-8"), hashlib.sha256).digest()

    def get_signature_key(date_stamp):
        k = sign(("AWS4" + SECRET_KEY).encode("utf-8"), date_stamp)
        k = sign(k, REGION)
        k = sign(k, SERVICE)
        return sign(k, "aws4_request")

    def put_object(local_path, key):
        with open(local_path, "rb") as f:
            body = f.read()

        now = datetime.now(timezone.utc)
        date_stamp = now.strftime("%Y%m%d")
        amz_date = now.strftime("%Y%m%dT%H%M%SZ")
        host = f"{BUCKET}.{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com"
        url = f"https://{host}/{key}"

        content_hash = hashlib.sha256(body).hexdigest()
        headers_to_sign = {
            "host": host,
            "x-amz-content-sha256": content_hash,
            "x-amz-date": amz_date,
        }
        signed_header_keys = ";".join(sorted(headers_to_sign))
        canonical_headers = "".join(f"{k}:{v}\n" for k, v in sorted(headers_to_sign.items()))

        canonical_request = f"PUT\n/{key}\n\n{canonical_headers}\n{signed_header_keys}\n{content_hash}"
        credential_scope = f"{date_stamp}/{REGION}/{SERVICE}/aws4_request"
        string_to_sign = f"AWS4-HMAC-SHA256\n{amz_date}\n{credential_scope}\n{hashlib.sha256(canonical_request.encode()).hexdigest()}"

        signing_key = get_signature_key(date_stamp)
        signature = hmac.new(signing_key, string_to_sign.encode("utf-8"), hashlib.sha256).hexdigest()

        auth = f"AWS4-HMAC-SHA256 Credential={ACCESS_KEY}/{credential_scope}, SignedHeaders={signed_header_keys}, Signature={signature}"

        req = urllib.request.Request(url, data=body, method="PUT")
        req.add_header("Authorization", auth)
        req.add_header("x-amz-content-sha256", content_hash)
        req.add_header("x-amz-date", amz_date)
        req.add_header("Content-Length", str(len(body)))

        try:
            with urllib.request.urlopen(req) as resp:
                print(f"  Uploaded {key} ({len(body)} bytes) → {resp.status}")
        except urllib.error.HTTPError as e:
            print(f"  FAILED {key}: {e.code} {e.read().decode()}", file=sys.stderr)
            sys.exit(1)

    if __name__ == "__main__":
        if len(sys.argv) < 4 or sys.argv[1] != "put":
            print("Usage: s3upload.py put <local_file> <s3_key>", file=sys.stderr)
            sys.exit(1)
        put_object(sys.argv[2], sys.argv[3])

  restore.sh: |
    #!/bin/bash
    set -euo pipefail

    # Usage: restore.sh [backup_key]
    # If no backup_key provided, restores from latest
    # Requires awscli — install manually or use a helper image

    BACKUP_BUCKET="${R2_BUCKET:-enclii-backups}"
    BACKUP_PREFIX="${BACKUP_PREFIX:-postgres}"
    BACKUP_KEY="${1:-${BACKUP_PREFIX}/latest.sql.gz}"
    RESTORE_FILE="/tmp/restore.sql.gz"

    echo "[$(date)] Starting PostgreSQL restore..."
    echo "[$(date)] Downloading backup: s3://${BACKUP_BUCKET}/${BACKUP_KEY}"

    # Download using Python S3v4 signer
    python3 -c "
    import os, sys, hashlib, hmac, urllib.request, urllib.error
    from datetime import datetime, timezone
    REGION='auto'; SERVICE='s3'
    BUCKET=os.environ.get('R2_BUCKET','enclii-backups')
    AK=os.environ['AWS_ACCESS_KEY_ID']; SK=os.environ['AWS_SECRET_ACCESS_KEY']
    AID=os.environ['R2_ACCOUNT_ID']
    def sign(k,m): return hmac.new(k,m.encode('utf-8'),hashlib.sha256).digest()
    def sigkey(ds):
        k=sign(('AWS4'+SK).encode('utf-8'),ds)
        for s in [REGION,SERVICE,'aws4_request']: k=sign(k,s)
        return k
    key='${BACKUP_KEY}'; host=f'{BUCKET}.{AID}.r2.cloudflarestorage.com'
    now=datetime.now(timezone.utc); ds=now.strftime('%Y%m%d'); ad=now.strftime('%Y%m%dT%H%M%SZ')
    ch='UNSIGNED-PAYLOAD'
    hts={'host':host,'x-amz-content-sha256':ch,'x-amz-date':ad}
    shk=';'.join(sorted(hts)); cnh=''.join(f'{k}:{v}\n' for k,v in sorted(hts.items()))
    cr=f'GET\n/{key}\n\n{cnh}\n{shk}\n{ch}'
    cs=f'{ds}/{REGION}/{SERVICE}/aws4_request'
    sts=f'AWS4-HMAC-SHA256\n{ad}\n{cs}\n{hashlib.sha256(cr.encode()).hexdigest()}'
    sig=hmac.new(sigkey(ds),sts.encode('utf-8'),hashlib.sha256).hexdigest()
    auth=f'AWS4-HMAC-SHA256 Credential={AK}/{cs}, SignedHeaders={shk}, Signature={sig}'
    req=urllib.request.Request(f'https://{host}/{key}')
    req.add_header('Authorization',auth); req.add_header('x-amz-content-sha256',ch); req.add_header('x-amz-date',ad)
    with urllib.request.urlopen(req) as r, open('${RESTORE_FILE}','wb') as f: f.write(r.read())
    print(f'Downloaded {key}')
    "

    echo "[$(date)] Restoring database..."

    # Drop existing connections
    PGPASSWORD="${POSTGRES_PASSWORD}" psql \
      -h "${POSTGRES_HOST}" \
      -U "${POSTGRES_USER}" \
      -d postgres \
      -c "SELECT pg_terminate_backend(pg_stat_activity.pid) FROM pg_stat_activity WHERE pg_stat_activity.datname = '${POSTGRES_DB}' AND pid <> pg_backend_pid();" || true

    # Drop and recreate database
    PGPASSWORD="${POSTGRES_PASSWORD}" psql \
      -h "${POSTGRES_HOST}" \
      -U "${POSTGRES_USER}" \
      -d postgres \
      -c "DROP DATABASE IF EXISTS ${POSTGRES_DB};"

    PGPASSWORD="${POSTGRES_PASSWORD}" psql \
      -h "${POSTGRES_HOST}" \
      -U "${POSTGRES_USER}" \
      -d postgres \
      -c "CREATE DATABASE ${POSTGRES_DB};"

    # Restore
    gunzip -c "${RESTORE_FILE}" | PGPASSWORD="${POSTGRES_PASSWORD}" psql \
      -h "${POSTGRES_HOST}" \
      -U "${POSTGRES_USER}" \
      -d "${POSTGRES_DB}"

    # Cleanup
    rm -f "${RESTORE_FILE}"

    echo "[$(date)] Restore complete"
---
# CronJob for daily backups
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: data
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
spec:
  # Run daily at 3 AM UTC
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800  # 30 minute timeout
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: docker.io/library/postgres:16
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/bash
                - /scripts/backup.sh
              env:
                # PostgreSQL connection
                - name: POSTGRES_HOST
                  value: postgres.data.svc.cluster.local
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: username
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: database
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
                # R2 configuration
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: account-id
                - name: R2_BUCKET
                  value: enclii-backups
                - name: BACKUP_PREFIX
                  value: postgres
                - name: RETENTION_DAYS
                  value: "30"
                # AWS CLI config for R2
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: secret-access-key
                - name: AWS_DEFAULT_REGION
                  value: auto
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          volumes:
            - name: scripts
              configMap:
                name: postgres-backup-script
                defaultMode: 0755
---
# Manual backup job template (for ad-hoc backups)
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-backup-manual
  namespace: data
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: postgres-backup-manual
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          image: docker.io/library/postgres:16
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - /scripts/backup.sh
          env:
            - name: POSTGRES_HOST
              value: postgres.data.svc.cluster.local
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: account-id
            - name: R2_BUCKET
              value: enclii-backups
            - name: BACKUP_PREFIX
              value: postgres
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-backup-credentials
                  key: secret-access-key
            - name: AWS_DEFAULT_REGION
              value: auto
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: scripts
          configMap:
            name: postgres-backup-script
            defaultMode: 0755
