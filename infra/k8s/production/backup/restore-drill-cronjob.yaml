---
# Monthly Postgres Backup Restore Drill (CronJob)
#
# Non-destructive: downloads latest R2 pg_dumpall backup, restores to an ephemeral
# local PostgreSQL instance, validates table counts, then exits (no production writes).
#
# Schedule: 1st of each month at 5 AM UTC
# Results: `kubectl logs -n data job/<job-name> -c restore-drill`
# Log drill results in: docs/runbooks/RESTORE_DRILL_LOG.md
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-restore-drill
  namespace: data
  labels:
    app: postgres-restore-drill
    app.kubernetes.io/name: postgres-restore-drill
    app.kubernetes.io/component: backup-validation
    app.kubernetes.io/part-of: enclii
spec:
  schedule: "0 5 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: postgres-restore-drill
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: download-backup
              image: docker.io/amazon/aws-cli:2.33.16
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: account-id
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: secret-access-key
                - name: R2_BUCKET
                  value: "enclii-backups"
                - name: AWS_DEFAULT_REGION
                  value: "auto"
              command:
                - /bin/bash
                - -euo
                - pipefail
                - -c
                - |
                  R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
                  echo "[1/5] Finding latest backup in R2..."
                  LATEST=$(aws s3 ls "s3://${R2_BUCKET}/postgres/" --endpoint-url "${R2_ENDPOINT}" | sort | tail -1 | awk '{print $4}')
                  if [ -z "$LATEST" ]; then
                    echo "FAIL: No backups found in s3://${R2_BUCKET}/postgres/"
                    exit 1
                  fi
                  echo "  Found: ${LATEST}"
                  echo "[2/5] Downloading backup..."
                  aws s3 cp "s3://${R2_BUCKET}/postgres/${LATEST}" /shared/backup.sql.gz \
                    --endpoint-url "${R2_ENDPOINT}" --quiet
                  echo "${LATEST}" > /shared/backup-name.txt
                  echo "  Downloaded: $(du -h /shared/backup.sql.gz | cut -f1)"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
              volumeMounts:
                - name: shared
                  mountPath: /shared
          containers:
            - name: restore-drill
              image: docker.io/library/postgres:16
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
              command:
                - /bin/bash
                - -euo
                - pipefail
                - -c
                - |
                  LATEST="$(cat /shared/backup-name.txt)"
                  echo "=== Postgres Restore Drill — $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
                  echo "[3/5] Starting ephemeral PostgreSQL and restoring backup..."
                  initdb -D "${PGDATA}" --auth=trust > /dev/null
                  pg_ctl -D "${PGDATA}" -l /tmp/pg.log start
                  for i in $(seq 1 30); do
                    pg_isready -U postgres && break
                    sleep 1
                  done
                  cleanup() {
                    pg_ctl -D "${PGDATA}" stop -m fast >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT
                  if ! gunzip -c /shared/backup.sql.gz | psql -U postgres -d postgres -q 2>/tmp/restore.err; then
                    echo "FAIL: Restore failed"
                    sed -n '1,80p' /tmp/restore.err
                    exit 1
                  fi
                  echo "[4/5] Validating restore..."
                  TABLE_COUNT=0
                  for DB_NAME in $(psql -U postgres -d postgres -tAc "SELECT datname FROM pg_database WHERE datistemplate = false AND datallowconn = true ORDER BY datname;"); do
                    DB_TABLES=$(psql -U postgres -d "${DB_NAME}" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" 2>/dev/null || echo 0)
                    TABLE_COUNT=$((TABLE_COUNT + DB_TABLES))
                  done
                  echo "  Tables found: ${TABLE_COUNT}"
                  if [ "${TABLE_COUNT}" -lt 1 ]; then
                    echo "FAIL: No tables found after restore"
                    exit 1
                  fi
                  echo "[5/5] Cleanup complete (ephemeral cluster stopped on exit)"
                  echo ""
                  echo "=== RESTORE DRILL PASSED ==="
                  echo "  Backup: ${LATEST}"
                  echo "  Tables: ${TABLE_COUNT}"
                  echo "  Time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              volumeMounts:
                - name: temp-data
                  mountPath: /var/lib/postgresql/data
                - name: shared
                  mountPath: /shared
          volumes:
            - name: temp-data
              emptyDir:
                sizeLimit: 2Gi
            - name: shared
              emptyDir:
                sizeLimit: 2Gi
