---
# ArgoCD Secrets & Config Backup to Cloudflare R2
#
# Architecture: ServiceAccount in data namespace + RoleBinding in argocd namespace
#               initContainer (kubectl) exports secrets/configmaps →
#               main container (aws-cli) uploads to R2
#
# Schedule: Sunday 2:00 AM UTC (weekly)
#
# Usage:
#   1. Ensure r2-backup-credentials secret exists in data namespace
#   2. Apply this manifest (creates SA, RoleBinding, and CronJob)

# ServiceAccount for cross-namespace secret access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-backup-sa
  namespace: data
  labels:
    app.kubernetes.io/name: argocd-secrets-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
---
# Role in argocd namespace for reading secrets and configmaps
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-backup-reader
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-secrets-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
# RoleBinding granting the SA access in argocd namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-backup-reader-binding
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-secrets-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
subjects:
  - kind: ServiceAccount
    name: argocd-backup-sa
    namespace: data
roleRef:
  kind: Role
  name: argocd-backup-reader
  apiGroup: rbac.authorization.k8s.io
---
# Backup Script ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-backup-script
  namespace: data
  labels:
    app.kubernetes.io/name: argocd-secrets-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
data:
  export.sh: |
    #!/bin/sh
    set -eu

    echo "[$(date)] Starting ArgoCD secrets backup..."
    EXPORT_DIR="/backup/argocd-export"
    mkdir -p "${EXPORT_DIR}"

    # Export core ArgoCD secrets and configmaps
    for RESOURCE in \
      "secret/argocd-secret" \
      "secret/argocd-initial-admin-secret" \
      "configmap/argocd-cm" \
      "configmap/argocd-rbac-cm" \
      "configmap/argocd-cmd-params-cm" \
      "configmap/argocd-ssh-known-hosts-cm" \
      "configmap/argocd-tls-certs-cm"; do

      FILENAME=$(echo "${RESOURCE}" | tr '/' '-')
      echo "[$(date)] Exporting ${RESOURCE}..."
      if k3s kubectl get -n argocd "${RESOURCE}" -o yaml > "${EXPORT_DIR}/${FILENAME}.yaml" 2>/dev/null; then
        echo "[$(date)] OK ${RESOURCE}"
      else
        echo "[$(date)] SKIP ${RESOURCE} (not found)"
      fi
    done

    # Export repo credential secrets (labeled by ArgoCD)
    echo "[$(date)] Exporting repo credential secrets..."
    k3s kubectl get secrets -n argocd -l argocd.argoproj.io/secret-type=repository -o yaml \
      > "${EXPORT_DIR}/repo-credentials.yaml" 2>/dev/null || echo "No repo credentials found"

    # Export cluster secrets
    echo "[$(date)] Exporting cluster secrets..."
    k3s kubectl get secrets -n argocd -l argocd.argoproj.io/secret-type=cluster -o yaml \
      > "${EXPORT_DIR}/cluster-secrets.yaml" 2>/dev/null || echo "No cluster secrets found"

    # Export applications list
    echo "[$(date)] Exporting applications..."
    k3s kubectl get applications -n argocd -o yaml \
      > "${EXPORT_DIR}/applications.yaml" 2>/dev/null || echo "No applications found"

    # Export appprojects
    echo "[$(date)] Exporting app projects..."
    k3s kubectl get appprojects -n argocd -o yaml \
      > "${EXPORT_DIR}/appprojects.yaml" 2>/dev/null || echo "No app projects found"

    FILE_COUNT=$(ls -1 "${EXPORT_DIR}" | wc -l)
    echo "[$(date)] Export complete: ${FILE_COUNT} files"
    date +%Y%m%d > /backup/TIMESTAMP

  upload.sh: |
    #!/bin/bash
    set -eu

    BACKUP_BUCKET="${R2_BUCKET:-enclii-backups}"
    BACKUP_PREFIX="argocd-secrets"
    R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

    TIMESTAMP=$(cat /backup/TIMESTAMP)
    EXPORT_DIR="/backup/argocd-export"

    echo "[$(date)] Uploading to R2: s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/${TIMESTAMP}/"
    aws s3 sync "${EXPORT_DIR}/" "s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/${TIMESTAMP}/" \
      --endpoint-url "${R2_ENDPOINT}"

    aws s3 sync "${EXPORT_DIR}/" "s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/latest/" \
      --endpoint-url "${R2_ENDPOINT}"

    echo "[$(date)] Upload complete"

    # Cleanup old backups (keep last 12 weeks)
    RETENTION_DAYS=84
    echo "[$(date)] Cleaning up backups older than ${RETENTION_DAYS} days..."
    CUTOFF_DATE=$(date -d "-${RETENTION_DAYS} days" +%Y%m%d 2>/dev/null || date -v-${RETENTION_DAYS}d +%Y%m%d)

    aws s3 ls "s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/" \
      --endpoint-url "${R2_ENDPOINT}" 2>/dev/null \
      | grep "PRE" | awk '{print $2}' | tr -d '/' \
      | while read -r DIR_NAME; do
        if [ "${DIR_NAME}" != "latest" ] && echo "${DIR_NAME}" | grep -qE '^[0-9]{8}$'; then
          if [ "${DIR_NAME}" \< "${CUTOFF_DATE}" ]; then
            echo "[$(date)] Deleting old backup: ${DIR_NAME}/"
            aws s3 rm "s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/${DIR_NAME}/" \
              --endpoint-url "${R2_ENDPOINT}" --recursive
          fi
        fi
      done

    echo "[$(date)] ArgoCD secrets backup complete"
---
# CronJob for weekly ArgoCD secrets backups
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-secrets-backup
  namespace: data
  labels:
    app.kubernetes.io/name: argocd-secrets-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: argocd-secrets-backup
        spec:
          serviceAccountName: argocd-backup-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          # Step 1: k3s kubectl exports secrets and configmaps
          initContainers:
            - name: export
              image: docker.io/rancher/k3s:v1.33.7-k3s3@sha256:4ec887d176fb81c4ca64fdd6da8bd11023a3d7ea89025737df7a6da91cfdd139
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - /scripts/export.sh
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: backup-data
                  mountPath: /backup
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          # Step 2: Upload to R2
          containers:
            - name: upload
              image: docker.io/amazon/aws-cli:2.33.16@sha256:c0bf0abcdc0c330c605953dec26cd8b30243e9d22fce0da07867d454e40ddfcd
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/bash
                - /scripts/upload.sh
              env:
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: account-id
                - name: R2_BUCKET
                  value: enclii-backups
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: secret-access-key
                - name: AWS_DEFAULT_REGION
                  value: auto
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: backup-data
                  mountPath: /backup
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          volumes:
            - name: scripts
              configMap:
                name: argocd-backup-script
                defaultMode: 0755
            - name: backup-data
              emptyDir:
                sizeLimit: 500Mi
