---
# K3s Datastore Backup to Cloudflare R2
#
# Architecture: initContainer (k3s image + nsenter inline) creates host archive ->
#               main container (aws-cli) uploads to R2
#
# Requires: hostPID, control-plane nodeSelector, PolicyException
# Schedule: 1:30 AM (controller-manager local time) daily
#
# Datastore consistency: k3s keeps its SQLite datastore in WAL mode, so the
# newest committed writes live in state.db-wal until a checkpoint. A plain
# `cp state.db` misses them and, if a checkpoint runs mid-copy, can capture a
# torn file. The backup therefore uses SQLite's online backup API (host
# python3, read-only connection, one step = one read transaction = one
# consistent snapshot) and runs PRAGMA quick_check on the copy before it is
# archived. The archive's BACKUP_METHOD file records which path produced it.
#
# Scheduling: this pod can only run on the control-plane node. When that node
# is at its request ceiling the pod waits in Pending; with the old 15-minute
# deadline that wait alone failed the job (DeadlineExceeded with no container
# log at all). The job now waits up to 3 h and uses the enclii-backup-critical
# PriorityClass, which moves it to the front of the scheduling queue without
# evicting anything (see priority-class.yaml).
#
# Usage:
#   1. Ensure r2-backup-credentials secret exists in data namespace
#   2. Apply the PolicyException (k3s-backup-policy-exception.yaml)
#   3. Apply this manifest

# Upload Script ConfigMap (backup runs inline via nsenter, like node-maintenance)
apiVersion: v1
kind: ConfigMap
metadata:
  name: k3s-backup-script
  namespace: data
  labels:
    app.kubernetes.io/name: k3s-datastore-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
data:
  upload.sh: |
    #!/bin/bash
    set -eu

    BACKUP_BUCKET="${R2_BUCKET:-enclii-backups}"
    BACKUP_PREFIX="k3s-datastore"
    R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

    TIMESTAMP=$(cat /backup/TIMESTAMP)
    BACKUP_FILE="/backup/k3s-state.tar.gz"
    BACKUP_KEY="${BACKUP_PREFIX}/k3s-${TIMESTAMP}.tar.gz"

    echo "[$(date)] Uploading to R2: s3://${BACKUP_BUCKET}/${BACKUP_KEY}"
    aws s3 cp "${BACKUP_FILE}" "s3://${BACKUP_BUCKET}/${BACKUP_KEY}" \
      --endpoint-url "${R2_ENDPOINT}"

    # Maintain a 'latest' copy for easy access
    aws s3 cp "${BACKUP_FILE}" "s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/latest.tar.gz" \
      --endpoint-url "${R2_ENDPOINT}"

    echo "[$(date)] Upload complete"

    # Cleanup old backups (keep last 7 days)
    RETENTION_DAYS=7
    echo "[$(date)] Cleaning up backups older than ${RETENTION_DAYS} days..."
    CUTOFF_DATE=$(date -d "-${RETENTION_DAYS} days" +%Y%m%d 2>/dev/null || date -v-${RETENTION_DAYS}d +%Y%m%d)

    aws s3 ls "s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/" \
      --endpoint-url "${R2_ENDPOINT}" 2>/dev/null \
      | while read -r line; do
        FILE_DATE=$(echo "$line" | awk '{print $4}' | grep -oE '[0-9]{8}' | head -1 || echo "")
        FILE_NAME=$(echo "$line" | awk '{print $4}')

        if [ -n "${FILE_DATE}" ] && [ "${FILE_DATE}" \< "${CUTOFF_DATE}" ] && [ "${FILE_NAME}" != "latest.tar.gz" ]; then
          echo "[$(date)] Deleting old backup: ${FILE_NAME}"
          aws s3 rm "s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/${FILE_NAME}" \
            --endpoint-url "${R2_ENDPOINT}"
        fi
      done

    echo "[$(date)] K3s backup pipeline complete: ${BACKUP_KEY}"
---
# CronJob for daily k3s datastore backups
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-datastore-backup
  namespace: data
  labels:
    app.kubernetes.io/name: k3s-datastore-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: enclii
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Includes time spent Pending; see "Scheduling" above.
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app: k3s-datastore-backup
        spec:
          priorityClassName: enclii-backup-critical
          restartPolicy: OnFailure
          hostPID: true
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          # Step 1: nsenter into host, tar k3s state, copy to shared volume
          # Uses inline command (proven pattern from node-maintenance CronJob)
          initContainers:
            - name: backup
              image: docker.io/rancher/k3s:v1.33.7-k3s3@sha256:4ec887d176fb81c4ca64fdd6da8bd11023a3d7ea89025737df7a6da91cfdd139
              securityContext:
                privileged: true
                capabilities:
                  drop:
                    - ALL
              command:
                - nsenter
                - -t
                - "1"
                - -m
                - -u
                - -i
                - -n
                - -p
                - --
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== K3s Datastore Backup Started: $(date -u) ==="
                  TMPFILE=/tmp/k3s-state.tar.gz
                  WORKDIR=/tmp/k3s-datastore-backup
                  SNAPSHOT_NAME="enclii-k3s-$(date -u +%Y%m%d%H%M%S)"

                  rm -rf "$WORKDIR"
                  mkdir -p "$WORKDIR"

                  DB=/var/lib/rancher/k3s/server/db/state.db

                  # Consistent SQLite snapshot. See the header of this file.
                  sqlite_snapshot() {
                    if command -v python3 >/dev/null 2>&1; then
                      echo "Taking online SQLite backup of state.db (WAL-aware)..."
                      python3 - "$DB" "$WORKDIR/state.db" <<'PY'
                  import sqlite3, sys
                  src_path, dst_path = sys.argv[1], sys.argv[2]
                  src = sqlite3.connect("file:%s?mode=ro" % src_path, uri=True, timeout=60)
                  dst = sqlite3.connect(dst_path)
                  # pages=-1 (default): one step under one read transaction.
                  # Step-wise copies restart whenever k3s writes, which on a
                  # live control plane can mean they never finish.
                  src.backup(dst)
                  dst.close()
                  src.close()
                  chk = sqlite3.connect("file:%s?mode=ro" % dst_path, uri=True)
                  result = chk.execute("PRAGMA quick_check").fetchone()[0]
                  if result != "ok":
                      sys.exit("snapshot failed quick_check: %s" % result)
                  try:
                      rows, max_id = chk.execute("SELECT count(*), max(id) FROM kine").fetchone()
                      print("Snapshot OK: kine rows=%s max_id=%s" % (rows, max_id))
                  except sqlite3.Error as exc:
                      print("Snapshot OK (kine summary unavailable: %s)" % exc)
                  chk.close()
                  PY
                      echo "sqlite-online-backup" > "$WORKDIR/BACKUP_METHOD"
                    else
                      echo "WARNING: python3 not found on the host; falling back to a file copy." >&2
                      echo "WARNING: a file copy of a live WAL database is NOT guaranteed consistent." >&2
                      cp "$DB" "$WORKDIR/state.db"
                      if [ -f "$DB-wal" ]; then
                        cp "$DB-wal" "$WORKDIR/state.db-wal"
                      fi
                      echo "file-copy-not-crash-consistent" > "$WORKDIR/BACKUP_METHOD"
                    fi
                  }

                  if [ -d /var/lib/rancher/k3s/server/db/etcd ]; then
                    echo "Embedded etcd datastore directory detected; attempting k3s etcd snapshot..."
                    if k3s etcd-snapshot save \
                      --name "$SNAPSHOT_NAME" \
                      --dir "$WORKDIR"; then
                      echo "K3s etcd snapshot created"
                      echo "etcd-snapshot" > "$WORKDIR/BACKUP_METHOD"
                    elif [ -f "$DB" ]; then
                      echo "K3s etcd snapshot unavailable; using the SQLite datastore..."
                      sqlite_snapshot
                    else
                      echo "No etcd snapshot and no state.db; nothing to back up" >&2
                      exit 1
                    fi
                  elif [ -f "$DB" ]; then
                    echo "SQLite datastore detected"
                    sqlite_snapshot
                  else
                    echo "No supported k3s datastore found under /var/lib/rancher/k3s/server/db" >&2
                    exit 1
                  fi

                  echo "Copying k3s recovery materials..."
                  cp -a /var/lib/rancher/k3s/server/tls "$WORKDIR/tls"
                  cp /var/lib/rancher/k3s/server/token "$WORKDIR/token"

                  echo "Archiving k3s state..."
                  tar czf "$TMPFILE" -C "$WORKDIR" .
                  BACKUP_SIZE=$(du -h "$TMPFILE" | cut -f1)
                  echo "Archive created: $BACKUP_SIZE"
                  echo "=== K3s Datastore Backup Completed: $(date -u) ==="
              terminationMessagePolicy: FallbackToLogsOnError
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          # Step 1.5: Copy from host /tmp to shared volume + write timestamp
          # Separate container because nsenter changes mount namespace
            - name: copy
              image: docker.io/rancher/k3s:v1.33.7-k3s3@sha256:4ec887d176fb81c4ca64fdd6da8bd11023a3d7ea89025737df7a6da91cfdd139
              securityContext:
                privileged: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Copying archive from host /tmp to shared volume..."
                  cp /proc/1/root/tmp/k3s-state.tar.gz /backup/k3s-state.tar.gz
                  date +%Y%m%d > /backup/TIMESTAMP
                  echo "Copy complete: $(du -h /backup/k3s-state.tar.gz | cut -f1)"
              terminationMessagePolicy: FallbackToLogsOnError
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "25m"
                limits:
                  memory: "128Mi"
                  cpu: "100m"
          # Step 2: Upload archive to R2
          containers:
            - name: upload
              image: docker.io/amazon/aws-cli:2.33.16@sha256:c0bf0abcdc0c330c605953dec26cd8b30243e9d22fce0da07867d454e40ddfcd
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/bash
                - /scripts/upload.sh
              terminationMessagePolicy: FallbackToLogsOnError
              env:
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: account-id
                - name: R2_BUCKET
                  value: enclii-backups
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-backup-credentials
                      key: secret-access-key
                - name: AWS_DEFAULT_REGION
                  value: auto
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: backup-data
                  mountPath: /backup
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          volumes:
            - name: scripts
              configMap:
                name: k3s-backup-script
                defaultMode: 0755
            - name: backup-data
              emptyDir:
                sizeLimit: 500Mi
