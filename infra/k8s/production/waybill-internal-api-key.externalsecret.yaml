# Waybill service key, projected from Vault into enclii-secrets.
#
# ONE WRITER, ONE COPY. The value lives at secret/enclii:waybill_internal_api_key
# and its only writer is the intake target `enclii/waybill-internal-api-key`
# (apps/switchyard-api/internal/secretsintake/registry.yaml), minted
# server-side with --generate; no human holds it. Waybill verifies it, and
# every caller reads this same property:
#   - this ExternalSecret → enclii-secrets, key `waybill-internal-api-key`,
#     for waybill (INTERNAL_API_KEY), switchyard-api
#     (ENCLII_WAYBILL_INTERNAL_API_KEY) and the Roundhouse worker
#     (WAYBILL_API_KEY);
#   - monitoring/weighbridge-waybill-key, for Weighbridge.
#
# MERGE, like the other enclii-secrets writers (enclii-internal-api-key,
# enclii-resend-api-key): it adds its one key and leaves the others alone
# (scripts/check-externalsecret-writers.py). It also makes the first submit an
# UPDATE of a Secret that already exists, which Reloader acts on; a create it
# would not see (no --reload-on-create).
#
# BEFORE THE FIRST SUBMIT this reports SecretSyncedError and enclii-secrets has
# no such key. Nothing reads it until the callers are wired, so that state is
# inert. The submit force-syncs this object (it is the target's
# external_secret), so the key lands within seconds.
#
# deletionPolicy: Retain — deleting this ExternalSecret must not pull the key
# out from under running callers.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: waybill-internal-api-key
  labels:
    app.kubernetes.io/name: waybill
    app.kubernetes.io/component: billing
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/managed-by: enclii
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: enclii-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: waybill-internal-api-key
      remoteRef:
        key: secret/enclii
        property: waybill_internal_api_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
