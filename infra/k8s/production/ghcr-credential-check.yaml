---
# Monthly CronJob that validates GHCR pull credentials in each namespace.
# On failure, creates a Kubernetes Warning event on the namespace for visibility.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ghcr-credential-check
  namespace: enclii
  labels:
    app.kubernetes.io/name: ghcr-credential-check
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/component: security
spec:
  schedule: "0 9 1 * *"  # 1st of every month at 09:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400  # 1 day
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: ghcr-credential-checker
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  # Discover namespaces dynamically (managed-by=enclii label) + core namespaces
                  MANAGED=$(kubectl get namespaces -l managed-by=enclii -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
                  NAMESPACES="$MANAGED enclii enclii-builds argocd"
                  NAMESPACES=$(echo "$NAMESPACES" | tr ' ' '\n' | sort -u | tr '\n' ' ')
                  SECRET_NAME="ghcr-credentials"
                  FAILURES=0

                  for NS in $NAMESPACES; do
                    if ! kubectl get namespace "$NS" &>/dev/null; then
                      echo "[SKIP] Namespace $NS does not exist"
                      continue
                    fi

                    if kubectl get secret "$SECRET_NAME" -n "$NS" &>/dev/null; then
                      echo "[OK]   $NS/$SECRET_NAME exists"
                    else
                      echo "[FAIL] $NS/$SECRET_NAME MISSING"
                      FAILURES=$((FAILURES + 1))
                      # Create a warning event on the namespace
                      kubectl create event \
                        --namespace="$NS" \
                        --for="namespace/$NS" \
                        --type=Warning \
                        --reason=MissingRegistryCredentials \
                        --message="ghcr-credentials secret is missing — image pulls will fail" \
                        --field-manager=ghcr-credential-check 2>/dev/null || true
                    fi
                  done

                  if [ "$FAILURES" -gt 0 ]; then
                    echo ""
                    echo "ERROR: $FAILURES namespace(s) missing $SECRET_NAME"
                    echo "Run: ./scripts/rotate-ghcr-credentials.sh"
                    exit 1
                  fi

                  echo ""
                  echo "All namespaces have valid $SECRET_NAME secrets"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-credential-checker
  namespace: enclii
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ghcr-credential-checker
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ghcr-credential-checker
subjects:
  - kind: ServiceAccount
    name: ghcr-credential-checker
    namespace: enclii
roleRef:
  kind: ClusterRole
  name: ghcr-credential-checker
  apiGroup: rbac.authorization.k8s.io
