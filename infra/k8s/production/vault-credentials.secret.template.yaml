# Vault credentials for Switchyard secret intake / vault-backfill writer
#
# Operator-provisioned break-glass only — NEVER commit token values.
# Create after obtaining a scoped Vault writer token:
#
#   kubectl -n enclii create secret generic vault-credentials \
#     --from-literal=address=http://vault.vault.svc.cluster.local:8200 \
#     --from-literal=token='hvs.REDACTED'
#
# Last Updated: 2026-06-15
apiVersion: v1
kind: Secret
metadata:
  name: vault-credentials
  namespace: enclii
  labels:
    app.kubernetes.io/name: switchyard-api
    app.kubernetes.io/component: control-plane
    enclii.dev/managed-by: manual
type: Opaque
stringData:
  address: "http://vault.vault.svc.cluster.local:8200"
  token: "REPLACE_VIA_KUBECTL_CREATE_SECRET"
