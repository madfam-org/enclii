---
# Unified Cloudflare Tunnel Configuration
# Routes all external traffic through Cloudflare Tunnel to ClusterIP services
# This eliminates the need for hostPort bindings and prevents port conflicts
#
# Prerequisites:
# 1. Create a Cloudflare Tunnel in the dashboard or via CLI:
#    cloudflared tunnel create enclii-production
# 2. Add DNS routes for each hostname to point to the tunnel
# 3. Get the tunnel token and set it in the secret below
#
# Benefits:
# - Zero exposed ports on nodes
# - Zero-trust security model
# - DDoS protection at Cloudflare edge
# - Automatic TLS termination
# - Zero-downtime rolling updates (no hostPort conflicts)

apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare-tunnel
  labels:
    name: cloudflare-tunnel
    kubernetes.io/metadata.name: cloudflare-tunnel
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: ingress

---
# Note: Secret 'cloudflared-enclii-token' managed separately (contains actual tunnel token)
# The token is obtained from: cloudflared tunnel token <tunnel-name>
# Or from Cloudflare Zero Trust dashboard → Networks → Tunnels → Configure → Token

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare-tunnel
data:
  config.yaml: |
    # Cloudflare Tunnel Configuration
    # Using token-based authentication (simpler than credentials file)
    #
    # INGRESS ROUTES: Managed remotely via Cloudflare Tunnel Configuration API.
    # The domain provisioner (switchyard-api) adds/removes routes via the API.
    # cloudflared reads ingress rules from Cloudflare's remote config when
    # no local ingress section is defined.
    #
    # To view current routes: Cloudflare dashboard → Zero Trust → Networks → Tunnels
    # Audit trail: Each route change is logged in switchyard-api and the Enclii DB.

    # Metrics for monitoring
    metrics: 0.0.0.0:2000

    # Logging
    loglevel: info

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
  labels:
    app: cloudflared
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: ingress
spec:
  replicas: 2  # HA: run multiple replicas for redundancy
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.1.2@sha256:e6aba36f47b17ba21c62404f826e7be09f089dc0d8978732752204a75d9d7375
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-enclii-token
                  key: token
          ports:
            - containerPort: 2000
              name: metrics
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
              readOnly: true
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
      # Spread across nodes for HA (when multiple nodes available)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cloudflared
                topologyKey: kubernetes.io/hostname
      # Quick recovery from node issues
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30

---
# PodDisruptionBudget for HA during cluster maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-pdb
  namespace: cloudflare-tunnel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared

---
# Service for metrics scraping
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflare-tunnel
  labels:
    app: cloudflared
spec:
  ports:
    - port: 2000
      targetPort: 2000
      name: metrics
  selector:
    app: cloudflared
