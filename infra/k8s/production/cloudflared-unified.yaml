---
# Unified Cloudflare Tunnel Configuration
# Routes all external traffic through Cloudflare Tunnel to ClusterIP services
# This eliminates the need for hostPort bindings and prevents port conflicts
#
# Prerequisites:
# 1. Create a Cloudflare Tunnel in the dashboard or via CLI:
#    cloudflared tunnel create enclii-production
# 2. Add DNS routes for each hostname to point to the tunnel
# 3. Get the tunnel token and set it in the secret below
#
# Benefits:
# - Zero exposed ports on nodes
# - Zero-trust security model
# - DDoS protection at Cloudflare edge
# - Automatic TLS termination
# - Zero-downtime rolling updates (no hostPort conflicts)

apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare-tunnel
  labels:
    name: cloudflare-tunnel
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: ingress

---
# Note: Secret 'cloudflared-enclii-token' managed separately (contains actual tunnel token)
# The token is obtained from: cloudflared tunnel token <tunnel-name>
# Or from Cloudflare Zero Trust dashboard → Networks → Tunnels → Configure → Token

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare-tunnel
data:
  config.yaml: |
    # Cloudflare Tunnel Configuration
    # Using token-based authentication (simpler than credentials file)

    # Metrics for monitoring
    metrics: 0.0.0.0:2000

    # Logging
    loglevel: info

    # Ingress rules - route traffic to internal ClusterIP services
    # Order matters - first match wins
    ingress:
      # ============================================
      # Enclii Services (namespace: enclii)
      # ============================================

      # Switchyard API (Control Plane)
      - hostname: api.enclii.dev
        service: http://switchyard-api.enclii.svc.cluster.local:80
        originRequest:
          connectTimeout: 30s
          keepAliveTimeout: 90s
          httpHostHeader: api.enclii.dev

      # Switchyard UI (Dashboard)
      - hostname: app.enclii.dev
        service: http://switchyard-ui.enclii.svc.cluster.local:80
        originRequest:
          connectTimeout: 10s
          httpHostHeader: app.enclii.dev

      # Admin UI (Dispatch - Infrastructure Control Tower)
      - hostname: admin.enclii.dev
        service: http://dispatch.enclii.svc.cluster.local:80
        originRequest:
          httpHostHeader: admin.enclii.dev

      # Landing Page (apex domain)
      - hostname: enclii.dev
        service: http://landing-page.enclii.svc.cluster.local:80
        originRequest:
          httpHostHeader: enclii.dev

      # Landing Page (www subdomain)
      - hostname: www.enclii.dev
        service: http://landing-page.enclii.svc.cluster.local:80
        originRequest:
          httpHostHeader: www.enclii.dev

      # Documentation Site
      - hostname: docs.enclii.dev
        service: http://docs-site.enclii.svc.cluster.local:80
        originRequest:
          httpHostHeader: docs.enclii.dev

      # Status Page (Enclii Platform)
      - hostname: status.enclii.dev
        service: http://status-enclii.enclii.svc.cluster.local:80
        originRequest:
          httpHostHeader: status.enclii.dev

      # Status Page (MADFAM Ecosystem)
      - hostname: status.madfam.io
        service: http://status-madfam.enclii.svc.cluster.local:80
        originRequest:
          httpHostHeader: status.madfam.io

      # ============================================
      # MADFAM Automation Services (Enclii-managed)
      # ============================================

      # ============================================
      # GitOps / Platform Services (namespace: argocd)
      # ============================================

      # ArgoCD UI (GitOps Dashboard)
      - hostname: argocd.enclii.dev
        service: https://argocd-server.argocd.svc.cluster.local:443
        originRequest:
          connectTimeout: 30s
          keepAliveTimeout: 90s
          httpHostHeader: argocd.enclii.dev
          noTLSVerify: true  # ArgoCD uses self-signed cert internally

      # ============================================
      # Monitoring Services (namespace: monitoring)
      # ============================================

      # Grafana (Dashboards)
      - hostname: grafana.enclii.dev
        service: http://grafana.monitoring.svc.cluster.local:3000
        originRequest:
          connectTimeout: 10s
          httpHostHeader: grafana.enclii.dev

      # Prometheus (Metrics - restrict access in production)
      - hostname: prometheus.enclii.dev
        service: http://prometheus.monitoring.svc.cluster.local:9090
        originRequest:
          connectTimeout: 10s
          httpHostHeader: prometheus.enclii.dev

      # AlertManager (Alerts - restrict access in production)
      - hostname: alertmanager.enclii.dev
        service: http://alertmanager.monitoring.svc.cluster.local:9093
        originRequest:
          connectTimeout: 10s
          httpHostHeader: alertmanager.enclii.dev

      # ============================================
      # Janua Identity Services (namespace: janua)
      # Note: Services managed by Enclii Switchyard use port 80
      # ============================================

      # Janua API (Authentication) - Primary domain
      # Tuned for self-healing (Operation Phoenix - Jan 2026)
      - hostname: api.janua.dev
        service: http://janua-api.janua.svc.cluster.local:80
        originRequest:
          connectTimeout: 10s
          keepAliveTimeout: 90s
          noTLSVerify: false
          retries: 2
          httpHostHeader: api.janua.dev

      # Janua API (Authentication) - MADFAM alias
      - hostname: auth.madfam.io
        service: http://janua-api.janua.svc.cluster.local:80
        originRequest:
          connectTimeout: 30s
          keepAliveTimeout: 90s
          httpHostHeader: auth.madfam.io

      # Janua Dashboard - janua.dev domain
      - hostname: app.janua.dev
        service: http://janua-dashboard.janua.svc.cluster.local:80
        originRequest:
          httpHostHeader: app.janua.dev

      # Janua Admin - janua.dev domain
      - hostname: admin.janua.dev
        service: http://janua-admin.janua.svc.cluster.local:80
        originRequest:
          httpHostHeader: admin.janua.dev

      # Janua Documentation - janua.dev domain
      - hostname: docs.janua.dev
        service: http://janua-docs.janua.svc.cluster.local:80
        originRequest:
          httpHostHeader: docs.janua.dev

      # Janua Website - janua.dev domain (apex + www)
      - hostname: janua.dev
        service: http://janua-website.janua.svc.cluster.local:80
        originRequest:
          httpHostHeader: janua.dev

      - hostname: www.janua.dev
        service: http://janua-website.janua.svc.cluster.local:80
        originRequest:
          httpHostHeader: www.janua.dev

      # Janua Website - madfam.io alias
      - hostname: madfam.io
        service: http://janua-website.janua.svc.cluster.local:80
        originRequest:
          httpHostHeader: madfam.io

      - hostname: www.madfam.io
        service: http://janua-website.janua.svc.cluster.local:80
        originRequest:
          httpHostHeader: www.madfam.io

      # ============================================
      # Enclii Functions (Scale-to-Zero Serverless)
      # ============================================
      # Routes *.fn.enclii.dev to KEDA HTTP Add-on Interceptor
      # KEDA intercepts requests and scales functions from zero
      # Functions are deployed as: <function-name>.fn.enclii.dev
      - hostname: "*.fn.enclii.dev"
        service: http://keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local:8080
        originRequest:
          connectTimeout: 30s
          keepAliveTimeout: 90s
          # Let KEDA interceptor handle cold starts with timeout
          noHappyEyeballs: true

      # ============================================
      # NPM Registry (Verdaccio on Docker host)
      # ============================================
      # Routes to Verdaccio running in Docker on the host machine
      # Host IP: 95.217.198.239 (foundry-core)
      - hostname: npm.madfam.io
        service: http://95.217.198.239:4873
        originRequest:
          connectTimeout: 30s
          keepAliveTimeout: 90s
          httpHostHeader: npm.madfam.io

      # ============================================
      # Dhanam Finance Services (namespace: dhanam)
      # ============================================
      # Budget and wealth tracking for LATAM

      # Dhanam Admin Dashboard
      - hostname: admin.dhan.am
        service: http://dhanam-admin.dhanam.svc.cluster.local:80
        originRequest:
          connectTimeout: 10s
          httpHostHeader: admin.dhan.am

      # Dhanam Web App
      - hostname: app.dhan.am
        service: http://dhanam-web.dhanam.svc.cluster.local:80
        originRequest:
          connectTimeout: 10s
          httpHostHeader: app.dhan.am

      # Dhanam API
      - hostname: api.dhan.am
        service: http://dhanam-api.dhanam.svc.cluster.local:80
        originRequest:
          connectTimeout: 30s
          keepAliveTimeout: 90s
          httpHostHeader: api.dhan.am

      # Dhanam apex domain (landing page)
      - hostname: dhan.am
        service: http://dhanam-web.dhanam.svc.cluster.local:80
        originRequest:
          httpHostHeader: dhan.am

      # Dhanam www subdomain (landing page)
      - hostname: www.dhan.am
        service: http://dhanam-web.dhanam.svc.cluster.local:80
        originRequest:
          httpHostHeader: www.dhan.am

      # ============================================
      # SSH Access (Cloudflare Access protected)
      # ============================================
      # SSH to foundry-core via Cloudflare Access tunnel
      - hostname: ssh.madfam.io
        service: ssh://95.217.198.239:22

      # ============================================
      # Catch-all (required by cloudflared)
      # ============================================
      - service: http_status:404

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
  labels:
    app: cloudflared
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: ingress
spec:
  replicas: 2  # HA: run multiple replicas for redundancy
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.11.1
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-enclii-token
                  key: token
          ports:
            - containerPort: 2000
              name: metrics
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
              readOnly: true
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
      # Spread across nodes for HA (when multiple nodes available)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cloudflared
                topologyKey: kubernetes.io/hostname
      # Quick recovery from node issues
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30

---
# PodDisruptionBudget for HA during cluster maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-pdb
  namespace: cloudflare-tunnel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared

---
# Service for metrics scraping
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflare-tunnel
  labels:
    app: cloudflared
spec:
  ports:
    - port: 2000
      targetPort: 2000
      name: metrics
  selector:
    app: cloudflared
