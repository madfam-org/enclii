apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-log-archive
  namespace: enclii
  labels:
    app: audit-log-archive
    component: compliance
    part-of: switchyard
spec:
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: audit-log-archive
            component: compliance
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: archive
              image: ghcr.io/madfam-org/enclii/switchyard-api@sha256:c68b36c1ef7898e6b1843df497dffcfb1378d7c0bf6a8e9878a156f818a41133
              imagePullPolicy: IfNotPresent
              command: ["/app/switchyard-api"]
              args: ["--mode=archive-audit"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
              env:
                - name: ARCHIVE_RETENTION_DAYS
                  value: "90"
                - name: ARCHIVE_FORMAT
                  value: "jsonl.gz"
                - name: ENCLII_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: database-url
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: endpoint
                - name: R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: access-key-id
                - name: R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: secret-access-key
                - name: R2_BUCKET
                  value: "enclii-audit-archive"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
