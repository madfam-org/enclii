---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: switchyard-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0: the cluster runs near its CPU-request ceiling and the two
      # non-builder nodes cannot fit a third switchyard-api pod, so a surge
      # rollout parks Pending forever (bit the 2026-08-24 #434 rollout:
      # "0/4 nodes available: 2 Insufficient cpu, 2 untolerated builder
      # taint"). Replace-in-place instead: one replica drains, its CPU frees,
      # the new pod schedules. Brief 2→1 capacity dip per rollout, accepted.
      maxSurge: 0
      maxUnavailable: 1
---
# Note: Redis Sentinel HA cluster lives in a separate ArgoCD Application
# (infra/argocd/apps/redis-sentinel.yaml). This Deployment remains the
# switchyard-api single-instance cache in the `enclii` namespace and is
# unaffected by the Sentinel rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1