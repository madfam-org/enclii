---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: switchyard-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
# Note: Redis Sentinel HA cluster lives in a separate ArgoCD Application
# (infra/argocd/apps/redis-sentinel.yaml). This Deployment remains the
# switchyard-api single-instance cache in the `enclii` namespace and is
# unaffected by the Sentinel rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1