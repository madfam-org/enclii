---
# Kyverno Enforcement Policy: Disallow Latest Tags
# Blocks container images tagged :latest or with no tag at all.
# Untagged and :latest images make rollbacks impossible and deployments
# non-reproducible.
#
# Complements the Audit-mode policy in infra/k8s/base/kyverno/policies/best-practices.yaml
# by enforcing on Deployments (with autogen for Pods) in non-platform namespaces.
#
# NOTE: Kyverno's own CronJobs use :latest (bitnami removed version tags).
# A PolicyException already covers this:
#   infra/k8s/base/kyverno/policies/kyverno-namespace-exception.yaml
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tags
  labels:
    app.kubernetes.io/part-of: enclii
    enclii.dev/component: policy
  annotations:
    policies.kyverno.io/title: Disallow Latest Tags
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/description: >-
      Container images must use an explicit version tag or digest.
      The :latest tag and untagged images produce non-deterministic
      deployments and make rollback unreliable.
    enclii.dev/policy-exception: >-
      Kyverno namespace is exempted via PolicyException at
      infra/k8s/base/kyverno/policies/kyverno-namespace-exception.yaml
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Deployment
      exclude:
        any:
          # System namespaces managed by the distribution
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
          # Platform namespaces labelled by enclii onboarding or infra manifests
          - resources:
              namespaceSelector:
                matchExpressions:
                  - key: enclii.dev/type
                    operator: Exists
      validate:
        message: >-
          Images with the :latest tag or no tag are not allowed.
          Use a specific version tag (e.g., :v1.2.3) or a digest
          (@sha256:...) for reproducible deployments.
        pattern:
          spec:
            template:
              spec:
                containers:
                  - image: "!*:latest & ?*:?*"
                =(initContainers):
                  - image: "!*:latest & ?*:?*"
