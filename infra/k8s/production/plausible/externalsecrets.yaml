# SPEC ONLY: nothing references this directory (see README.md).
#
# Every secret Plausible needs comes from Vault through ESO. No value is ever
# typed by a person: the three secret/plausible properties are minted
# server-side by the intake targets listed in README.md (`--generate`), and
# the backup key is the existing bucket-scoped addon backup token.
#
# Each entry is an explicit `data` remoteRef, never `dataFrom.extract` plus a
# template: with extract, a missing Vault key renders as the literal
# «<no value>» and ESO still reports SecretSynced. With `data`, a missing
# property fails the sync (SecretSyncedError) and the pod that mounts it stays
# Pending, so a missing key is visible instead of silent.
#
# Provision the Vault properties BEFORE these objects are wired (runbook
# step 1); an ExternalSecret for a property that does not exist marks the Argo
# app Degraded.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: plausible-app-secrets
  namespace: plausible
  labels:
    app.kubernetes.io/name: plausible
    app.kubernetes.io/part-of: enclii-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: plausible-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Phoenix SECRET_KEY_BASE. Plausible refuses to boot under 32 bytes; the
    # intake target generates 64 random bytes (86 base64url characters).
    - secretKey: SECRET_KEY_BASE # pragma: allowlist secret -- Secret key NAME, not a value
      remoteRef:
        key: secret/plausible
        property: secret_key_base
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Password of the ClickHouse `plausible` user. Read by BOTH the ClickHouse
    # pod (users.d from_env) and the Plausible pod (CLICKHOUSE_DATABASE_URL).
    - secretKey: CLICKHOUSE_PASSWORD # pragma: allowlist secret -- Secret key NAME, not a value
      remoteRef:
        key: secret/plausible
        property: clickhouse_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Postgres role credentials. CNPG reads this as the initdb owner secret
# (kubernetes.io/basic-auth) and Plausible builds DATABASE_URL from the same
# password, so Vault stays the source of truth: a restore from backup comes
# back with a password Vault still knows.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: plausible-db-credentials
  namespace: plausible
  labels:
    app.kubernetes.io/name: plausible-db
    app.kubernetes.io/part-of: enclii-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: plausible-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: plausible
        password: "{{ .password }}"
  data:
    - secretKey: password # pragma: allowlist secret -- Secret key NAME, not a value
      remoteRef:
        key: secret/plausible
        property: db_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Barman (CNPG) object-store credentials. Reuses the bucket-scoped R2 token the
# managed-Postgres addons already use (intake target enclii/addon-db-backups,
# bucket enclii-addon-db-backups), read cross-path from secret/enclii. Plausible
# writes under its own prefix (plausible/plausible-db), so it never touches an
# addon's backups.
#
# CNPG's instance manager caches this credential and reloads it only when the
# Cluster object changes. After a rotation, touch an annotation on the Cluster
# (runbook, "Backups").
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: plausible-backup-credentials
  namespace: plausible
  labels:
    app.kubernetes.io/name: plausible-db
    app.kubernetes.io/component: backups
    app.kubernetes.io/part-of: enclii-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: plausible-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID # pragma: allowlist secret -- Secret key NAME, not a value
      remoteRef:
        key: secret/enclii
        property: addon_backup_access_key_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SECRET_ACCESS_KEY # pragma: allowlist secret -- Secret key NAME, not a value
      remoteRef:
        key: secret/enclii
        property: addon_backup_secret_access_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
