# Secret key-count exporter — ArgoCD wrapper.
#
# Why a dedicated Application (not folded into the `monitoring` app):
#   The `monitoring/` kustomization sets `namespace: monitoring`, which
#   kustomize applies to every namespaced resource it renders. This manifest
#   deliberately ships Roles and RoleBindings in the `dhanam` and
#   `enclii-dhanam-staging` namespaces — kustomize would rewrite those to
#   `monitoring` and the exporter would lose its read access. Same reason the
#   deploy-pipeline-monitor wrapper exists (its Role lives in `argocd`).
#
# The root Application (infra/argocd/root-application.yaml) syncs
# infra/argocd/apps with automated prune + selfHeal, so this file is adopted
# without an operator step.
#
# What this watches, and why:
#   `dhanam/dhanam-secrets` is written by three ExternalSecrets. While one of
#   them used a non-Merge creationPolicy the Secret cycled 23 -> 2 -> 10 -> 23
#   keys every 15m; pods starting in that window came up with no DATABASE_URL
#   and CrashLooped, while every ExternalSecret reported Ready=True. Measured
#   2026-08-06: 1 sample in 6 over 42 minutes sat at 10 keys with DATABASE_URL
#   and DIRECT_DATABASE_URL absent.
#
# Operator actions after this Application becomes Healthy:
#   1. Reload Prometheus so the new rule file in the `prometheus-rules`
#      ConfigMap is read (Prometheus does not watch rule files):
#        kubectl -n monitoring exec deploy/prometheus -- \
#          wget -qO- --post-data='' http://localhost:9090/-/reload
#      or restart the pod. --web.enable-lifecycle is already enabled.
#   2. Confirm the scrape target appears:
#        up{job="kubernetes-services", service="secret-key-count-exporter"}
#   3. Confirm the series exists:
#        secret_key_count{secret_namespace="dhanam", secret_name="dhanam-secrets"}
#      It should read 23. If it is absent, DhanamSecretsKeyCountUnmonitored
#      fires after 15m — that alert is the "did we stop looking?" guard and is
#      expected to be active between the rule reload and the exporter starting.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-key-count-exporter
  namespace: argocd
  labels:
    app.kubernetes.io/name: secret-key-count-exporter
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/component: monitoring
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/madfam-org/enclii.git
    targetRevision: main
    path: infra/k8s/production/monitoring
    directory:
      recurse: false
      # Only this manifest — everything else under monitoring/ is owned by
      # the `monitoring` Application's kustomize render and would conflict if
      # double-synced.
      include: 'secret-key-count-exporter.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

  info:
    - name: "Docs"
      value: "docs/infrastructure/EXTERNAL_SECRETS.md"
    - name: "Closes gap"
      value: "2026-06-13 + 2026-08-06 dhanam-secrets multi-writer wipe: ExternalSecret Ready=True throughout"
    - name: "Alert"
      value: "SecretKeyCountBelowExpected (prometheus-rules ConfigMap, secret-integrity-rules.yml)"
