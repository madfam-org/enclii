# GitHub Actions Runner Controller Application
# Deploys: ARC controller + runner scale sets
#
# Auto-sync DISABLED — ArgoCD v3.2.5 has a bug in multi-source OCI Helm
# revision resolution: it sends HEAD requests to the base repo URL
# (ghcr.io/.../actions-runner-controller-charts) instead of the full
# chart path (ghcr.io/.../gha-runner-scale-set-controller), causing
# ComparisonError (403 from GHCR). Pods are Healthy and functional.
# See docs/infrastructure/ARGOCD_KNOWN_ISSUES.md for full analysis,
# reproduction steps, and proposed upstream fix. Re-enable auto-sync
# when ArgoCD fixes multi-source OCI Helm revision resolution.
#
# To upgrade ARC charts, use Helm CLI directly:
#   helm upgrade arc-controller oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
#     --namespace arc-system --version 0.10.1 -f infra/helm/arc/values-controller.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners
  namespace: argocd
  labels:
    app.kubernetes.io/name: arc-runners
    app.kubernetes.io/part-of: enclii
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # ARC Controller
  sources:
    - repoURL: oci://ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set-controller
      targetRevision: 0.10.1
      helm:
        releaseName: arc-controller
        valueFiles:
          - $values/infra/helm/arc/values-controller.yaml
    # Reference values from our repo
    - repoURL: https://github.com/madfam-org/enclii.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-system

  syncPolicy:
    # Auto-sync DISABLED — see header comment (ArgoCD OCI multi-source bug)
    syncOptions:
      - CreateNamespace=true
---
# ARC Runner Scale Set (Blue)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners-blue
  namespace: argocd
  labels:
    app.kubernetes.io/name: arc-runners-blue
    app.kubernetes.io/part-of: enclii
spec:
  project: default

  sources:
    - repoURL: oci://ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.10.1
      helm:
        releaseName: arc-runner-blue
        valueFiles:
          - $values/infra/helm/arc/values-runner-set.yaml
          - $values/infra/helm/arc/values-runner-set-blue.yaml
    - repoURL: https://github.com/madfam-org/enclii.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners

  syncPolicy:
    # Auto-sync DISABLED — see header comment (ArgoCD OCI multi-source bug)
    syncOptions:
      - CreateNamespace=true
