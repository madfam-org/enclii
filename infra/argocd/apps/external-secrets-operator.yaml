# External Secrets Operator Application
# Deploys: ESO for centralized secrets management (via Helm)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/component: secrets-management
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.9.11  # Pinned: v0.16.2+ requires v1 CRD migration first
    helm:
      values: |
        # External Secrets Operator configuration for Enclii

        # Install CRDs
        installCRDs: true

        # Controller replica count.
        # Chart 0.9.11 is deployed without leader-election args in this
        # cluster; multiple controller replicas race on Secret updates.
        replicaCount: 1

        # Resource limits
        resources:
          limits:
            memory: 256Mi
            cpu: 200m
          requests:
            memory: 128Mi
            cpu: 50m

        # Webhook configuration
        webhook:
          replicaCount: 2
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
            requests:
              memory: 64Mi
              cpu: 25m

        # Cert controller
        certController:
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
            requests:
              memory: 64Mi
              cpu: 25m

        # ServiceMonitor disabled — we use raw Prometheus scrape configs,
        # not the Prometheus Operator / ServiceMonitor CRD
        serviceMonitor:
          enabled: false

        # Pod disruption budget.
        # Disabled while the controller runs as a single replica; minAvailable: 1
        # makes Argo health Degraded because disruptionsAllowed is always 0.
        podDisruptionBudget:
          enabled: false

        # Tolerate GPU nodes (don't schedule on them)
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

        # Anti-affinity for HA
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: external-secrets
                  topologyKey: kubernetes.io/hostname

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The v0.9.11 chart emits generator CRD shortNames that conflict
      # with existing API aliases in this cluster. We intentionally remove
      # those non-essential CLI aliases from live CRDs below, and Argo must
      # not restore them during self-heal.
      - RespectIgnoreDifferences=true

  # Ignore status/defaulted fields and intentionally normalized CRD aliases.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/1/clientConfig/caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: acraccesstokens.generators.external-secrets.io
      jsonPointers:
        - /spec/names/shortNames
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: ecrauthorizationtokens.generators.external-secrets.io
      jsonPointers:
        - /spec/names/shortNames
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: fakes.generators.external-secrets.io
      jsonPointers:
        - /spec/names/shortNames
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: gcraccesstokens.generators.external-secrets.io
      jsonPointers:
        - /spec/names/shortNames
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: passwords.generators.external-secrets.io
      jsonPointers:
        - /spec/names/shortNames
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: vaultdynamicsecrets.generators.external-secrets.io
      jsonPointers:
        - /spec/names/shortNames
---
# External Secrets Configuration
# Deploys: ClusterSecretStore and example ExternalSecrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: external-secrets-config
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/component: secrets-management
  annotations:
    # Deploy after ESO is installed
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/madfam-org/enclii.git
    targetRevision: main
    path: infra/k8s/base/external-secrets
    # Sync ClusterSecretStores, Vault auth TokenReview RBAC, and narrow
    # ecosystem service-auth bridges. Full per-app vault-secrets inventory is
    # intentionally not included here because several legacy mirror manifests
    # do not match current production Secret shapes.
    directory:
      include: '{cluster-secret-store.yaml,vault-cluster-secret-store.yaml,external-secrets-tokenreview-rbac.yaml,ecosystem-service-auth-external-secrets.yaml,README.md}'

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

  # Ignore secrets (contain sensitive data)
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
        - /stringData
