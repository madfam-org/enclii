# KEDA (Kubernetes Event-Driven Autoscaling)
# Deploys: KEDA operator + metrics server (via Helm)
# Purpose: Scale-to-zero and event-driven autoscaling for Functions runtime
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  labels:
    app.kubernetes.io/name: keda
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/component: autoscaling
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.16.1  # Pin to specific stable version
    helm:
      valueFiles: []
      # Reference values from the enclii repo
      # ArgoCD Helm sources don't support external valueFiles,
      # so values are inlined here matching infra/helm/keda/values.yaml
      values: |
        operator:
          replicaCount: 1

        metricsServer:
          replicaCount: 1

        # The chart (2.16.x) reads requests/limits ONLY from
        # resources.{operator,metricServer,webhooks}. The operator.resources
        # and metricsServer.resources blocks that sat here from 2026-07-07
        # were ignored, so the pods ran on chart defaults (100m CPU each).
        # 2026-11-04 right-sizing wave 3: requests from measured use (highest
        # daily CPU p95 x 1.3, at most a 50% cut per step; memory max x 1.25).
        # Limits stay at the chart defaults the pods run with today.
        resources:
          operator:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 1
              memory: 1000Mi
          metricServer:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 1
              memory: 1000Mi
          webhooks:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 1
              memory: 1000Mi

        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists

  destination:
    server: https://kubernetes.default.svc
    namespace: keda

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

  # KEDA controller manages CRDs and aggregated API service dynamically
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
    - group: apiregistration.k8s.io
      kind: APIService
      jsonPointers:
        - /spec/caBundle
