# Logging Stack Application
# Deploys: Fluent Bit (DaemonSet log collector), Loki (log aggregation)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  labels:
    app.kubernetes.io/name: logging
    app.kubernetes.io/part-of: enclii
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/madfam-org/enclii.git
    targetRevision: main
    path: infra/k8s/production/logging

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  ignoreDifferences:
    # Argo tracking labels are injected at runtime across several resource
    # kinds; ignoring metadata-only drift avoids selector mutation.
    - group: "*"
      kind: "*"
      jsonPointers:
        - /metadata/labels/app.kubernetes.io~1instance
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/revisionHistoryLimit
