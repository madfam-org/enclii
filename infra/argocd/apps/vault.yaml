# HashiCorp Vault Application
# Deploys: Vault secrets management (via Helm) in HA (Raft) mode
# Bootstrap runbook: internal-devops/runbooks/vault-bootstrap.md  (P0.2)
#
# Post-sync operator procedure (see runbook):
#   1. vault operator init  (Shamir 5-of-3)
#   2. vault operator unseal <key> x 3
#   3. vault audit enable file file_path=stderr  (CRITICAL — Fluent Bit picks up)
#   4. vault auth enable kubernetes + configure
#   5. vault secrets enable -version=2 -path=secret kv
#   6. Apply internal-devops/templates/vault/selva-secret-writer-rbac.yaml
#   7. Create vault-selva-writer policy + k8s auth role
#   8. Rotate root token
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/component: secrets-management
    roadmap-item: p0-2
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.29.1  # Pin to specific stable version
    helm:
      valueFiles: []
      # Reference values from the enclii repo.
      # ArgoCD Helm sources don't support external valueFiles, so values are
      # inlined here matching infra/helm/vault/values.yaml.
      # KEEP IN SYNC with that file when editing.
      values: |
        server:
          image:
            repository: docker.io/hashicorp/vault
            tag: "1.18.3"

          # HA mode with Raft integrated storage (replaces standalone/file).
          # replicas=1 at launch — scale to 3 after P1.2 adds a 3rd
          # non-tainted worker. Raft format supports in-place scale-up.
          ha:
            enabled: true
            replicas: 1
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true

                listener "tcp" {
                  tls_disable = 1
                  address     = "[::]:8200"
                  cluster_address = "[::]:8201"

                  telemetry {
                    unauthenticated_metrics_access = true
                  }
                }

                storage "raft" {
                  path = "/vault/data"
                }

                service_registration "kubernetes" {}

          standalone:
            enabled: false

          hostNetwork: false

          service:
            type: ClusterIP

          dataStorage:
            enabled: true
            storageClass: longhorn
            size: 5Gi

          auditStorage:
            enabled: true
            storageClass: longhorn
            size: 2Gi

          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m

          ingress:
            enabled: false

          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000

          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault

          readinessProbe:
            enabled: true
            path: "/v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200"
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            enabled: true
            path: "/v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200"
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6

          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"

          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: vault

          serviceAccount:
            create: true
            name: vault

        ui:
          enabled: true

        injector:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

  # Vault controller manages status fields and internal state dynamically.
  # Ignore fields Vault writes at runtime that ArgoCD would otherwise flag as drift.
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
        - /stringData
    # StatefulSet volumeClaimTemplates get status fields Vault manages
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
