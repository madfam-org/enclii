# KEDA HTTP Add-on
# Deploys: KEDA HTTP Add-on operator + interceptor + scaler
# Purpose: Enables HTTP-based scaling (scale-to-zero) for Functions runtime
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-http-addon
  namespace: argocd
  labels:
    app.kubernetes.io/name: keda-http-addon
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/component: autoscaling
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda-add-ons-http
    targetRevision: 0.9.0  # Or the latest stable version
    helm:
      valueFiles: []
      values: |
        operator:
          replicas: 1
        interceptor:
          replicas:
            min: 1
            max: 10
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          supplementalGroups:
            - 1000
        images:
          kubeRbacProxy:
            name: registry.k8s.io/kubebuilder/kube-rbac-proxy
            tag: v0.13.0

  destination:
    server: https://kubernetes.default.svc
    namespace: keda

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
