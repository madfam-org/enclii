# Dhanam Finance Services Application
# Deploys: dhanam-admin, dhanam-api, dhanam-web (from external repo)
# Source: https://github.com/madfam-org/dhanam (external repo)
#
# Images pushed as nested GHCR packages (auto-linked to repo):
#   - ghcr.io/madfam-org/dhanam/admin  (Admin, Next.js)
#   - ghcr.io/madfam-org/dhanam/api    (API, NestJS)
#   - ghcr.io/madfam-org/dhanam/web    (Web, Next.js)
#
# Auto-deploy flow: push main → CI builds + commits digest to kustomization.yaml → ArgoCD syncs
# ArgoCD tracks image changes via kustomize — no ignoreDifferences needed for images.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dhanam-services
  namespace: argocd
  labels:
    app.kubernetes.io/name: dhanam-services
    app.kubernetes.io/part-of: dhanam
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/madfam-org/dhanam.git
    targetRevision: main
    path: infra/k8s/production

  destination:
    server: https://kubernetes.default.svc
    namespace: dhanam

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
