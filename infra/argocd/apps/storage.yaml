# Storage Application
# Deploys: Longhorn CSI (via Helm)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: enclii
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.7.2  # Pin to specific version (matches installed)
    helm:
      valueFiles: []
      # Inline values (or reference external values file)
      values: |
        defaultSettings:
          defaultReplicaCount: 2
          storageOverProvisioningPercentage: 100
          storageMinimalAvailablePercentage: 15
          backupTarget: s3://enclii-backups@auto/
          backupTargetCredentialSecret: longhorn-backup-secret
          # Keep offsite backups serialized; R2 resets were aborting long runs.
          backupConcurrentLimit: 1
          autoSalvage: true
          replicaAutoBalance: best-effort
          # Right-sized from 12% (1440m) to 3% (360m) — actual usage ~91m
          guaranteedEngineManagerCPU: 3
          guaranteedReplicaManagerCPU: 3
        persistence:
          defaultClassReplicaCount: 2
          reclaimPolicy: Retain
        ingress:
          enabled: false
        longhornManager:
          tolerations:
            - key: "builder"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  # Longhorn creates many resources dynamically
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec
    - group: longhorn.io
      kind: "*"
      jsonPointers:
        - /status
