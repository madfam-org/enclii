# ARC platform watchdogs
#
# Two things, both plain YAML in infra/k8s/production/arc:
#
#   stuck-runner-watchdog.yaml — auto-purges EphemeralRunner CRs stuck in
#     Running against already-completed workflow runs, the root cause of the
#     intermittent "queue sits still despite idle runners" behavior seen on
#     2026-04-19.
#   pool-health-alert.yaml — pages a human when the pool stops serving jobs
#     at all. Added 2026-08-10, when org-wide CI was down for hours and the
#     only detector that noticed was a person going to look.
#
# Separate ArgoCD app because the main arc-runners/arc-runners-blue apps are
# Helm-chart-based and won't auto-sync plain Kubernetes YAML from this repo.
#
# NOTE ON `include`: it is an explicit allowlist, so a new manifest dropped in
# that directory is NOT deployed until it is named here. monitoring.yaml sits
# in the same directory and has never been applied by this app — which is part
# of why its ARCNoRunnersAvailable alert was dead for 82 days. Add the filename
# when you add a manifest, or you will ship a detector that never runs.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-watchdog
  namespace: argocd
  labels:
    app.kubernetes.io/name: arc-watchdog
    app.kubernetes.io/part-of: enclii
    app.kubernetes.io/component: platform-watchdog
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/madfam-org/enclii.git
    targetRevision: main
    path: infra/k8s/production/arc
    directory:
      include: "{stuck-runner-watchdog.yaml,pool-health-alert.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
