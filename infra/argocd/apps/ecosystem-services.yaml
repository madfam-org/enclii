# Ecosystem Services Application
# Deploys: dispatch, status-page
# NOTE: landing-page and docs-site are managed by core-services via kustomize (infra/k8s/production -> ../base)
# These services have their own manifests and are managed separately from core services.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-services
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecosystem-services
    app.kubernetes.io/part-of: enclii
  annotations:
    # Image Updater DISABLED — multi-source apps cause git write-back errors:
    # "could not get creds for repo '': unknown repository type"
    # These services change infrequently; use CI deploy workflows instead.
    # See: PR #38 (janua thrashing fix) for similar rationale.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Dispatch (admin.enclii.dev)
    - repoURL: https://github.com/madfam-org/enclii.git
      targetRevision: main
      path: apps/dispatch/k8s

    # Status page (status.enclii.dev)
    - repoURL: https://github.com/madfam-org/enclii.git
      targetRevision: main
      path: apps/status/k8s/base

  destination:
    server: https://kubernetes.default.svc
    namespace: enclii

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=false

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
