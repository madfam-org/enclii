# Ecosystem Services Application
# Deploys: dispatch, status-page, landing-page
# These services have their own manifests and are managed separately from core services.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-services
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecosystem-services
    app.kubernetes.io/part-of: enclii
  annotations:
    # ArgoCD Image Updater Configuration
    argocd-image-updater.argoproj.io/image-list: |
      dispatch=ghcr.io/madfam-org/enclii/dispatch:latest,
      status-page=ghcr.io/madfam-org/enclii/enclii-status:latest,
      landing-page=ghcr.io/madfam-org/enclii/landing-page:latest,
      docs-site=ghcr.io/madfam-org/enclii/docs-site:latest

    # Update strategies (digest: detect SHA changes on :latest tag)
    argocd-image-updater.argoproj.io/dispatch.update-strategy: digest
    argocd-image-updater.argoproj.io/status-page.update-strategy: digest
    argocd-image-updater.argoproj.io/landing-page.update-strategy: digest
    argocd-image-updater.argoproj.io/docs-site.update-strategy: digest

    # Git write-back
    argocd-image-updater.argoproj.io/write-back-method: "git:secret:argocd/git-creds"
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main

    # Kustomize image path mappings
    argocd-image-updater.argoproj.io/dispatch.kustomize.image-name: dispatch
    argocd-image-updater.argoproj.io/status-page.kustomize.image-name: enclii-status
    argocd-image-updater.argoproj.io/landing-page.kustomize.image-name: landing-page
    argocd-image-updater.argoproj.io/docs-site.kustomize.image-name: docs-site
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Dispatch (admin.enclii.dev)
    - repoURL: https://github.com/madfam-org/enclii.git
      targetRevision: main
      path: apps/dispatch/k8s

    # Status page (status.enclii.dev)
    - repoURL: https://github.com/madfam-org/enclii.git
      targetRevision: main
      path: apps/status/k8s/base

    # Landing page (enclii.dev)
    - repoURL: https://github.com/madfam-org/enclii.git
      targetRevision: main
      path: infra/k8s/base
      directory:
        include: 'landing-page.yaml'

    # Documentation site (docs.enclii.dev)
    - repoURL: https://github.com/madfam-org/enclii.git
      targetRevision: main
      path: infra/k8s/base
      directory:
        include: 'docs-site.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: enclii

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
