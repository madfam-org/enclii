# PostHog Product Analytics Application
# Deploys: PostHog (via Helm) — self-hosted product analytics
# Namespace: posthog
# External deps: PostgreSQL (data ns), Redis (data ns), Redpanda (posthog ns)
# Ingress: Cloudflare Tunnel (analytics.enclii.dev)
#
# Broker: Standalone Redpanda StatefulSet (posthog-redpanda.yaml), NOT the
# chart's bitnami/kafka subchart. Chart v30.46.0 has no Redpanda dependency —
# `redpanda: enabled: true` was silently ignored. We use externalKafka instead.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: posthog
  namespace: argocd
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/part-of: enclii
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://posthog.github.io/charts-clickhouse/
    chart: posthog
    targetRevision: "30.46.0"
    helm:
      valueFiles: []
      # Values inlined from infra/helm/posthog/values.yaml for ArgoCD.
      # The canonical reference file is infra/helm/posthog/values.yaml;
      # keep this block in sync with that file.
      values: |
        cloud: "private"

        # Use existing secret for SECRET_KEY (avoids duplicate env vars)
        externalSecret: posthog-secrets
        externalSecretKey: POSTHOG_SECRET_KEY

        web:
          replicaCount: 1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          secureCookies: false

        worker:
          replicaCount: 1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

        plugins:
          replicaCount: 1
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        ingress:
          enabled: false

        # PostHog runs behind Cloudflare tunnel
        env:
          - name: IS_BEHIND_PROXY
            value: "1"
          - name: TRUST_ALL_PROXIES
            value: "1"
          - name: DISABLE_SECURE_SSL_REDIRECT
            value: "1"

        clickhouse:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          persistence:
            enabled: true
            storageClassName: longhorn
            size: 20Gi
          layout:
            shardsCount: 1
            replicasCount: 1

        # Kafka disabled — using standalone Redpanda (posthog-redpanda.yaml)
        kafka:
          enabled: false

        # Wire PostHog to the standalone Redpanda broker
        externalKafka:
          brokers:
            - posthog-redpanda.posthog.svc.cluster.local:9092

        postgresql:
          enabled: false

        pgbouncer:
          enabled: false

        externalPostgresql:
          postgresqlHost: postgres.data.svc.cluster.local
          postgresqlPort: 5432
          postgresqlDatabase: posthog
          postgresqlUsername: posthog
          existingSecret: posthog-secrets
          existingSecretPasswordKey: POSTHOG_DB_PASSWORD

        redis:
          enabled: false

        externalRedis:
          host: redis.data.svc.cluster.local
          port: 6379
          existingSecret: posthog-secrets
          existingSecretPasswordKey: POSTHOG_REDIS_PASSWORD

        zookeeper:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          persistence:
            enabled: true
            storageClassName: longhorn
            size: 1Gi

        serviceAccount:
          create: true
          name: posthog

  destination:
    server: https://kubernetes.default.svc
    namespace: posthog

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  # ClickHouse operator creates dynamic resources; ignore status drift
  ignoreDifferences:
    - group: "clickhouse.altinity.com"
      kind: "*"
      jsonPointers:
        - /status
