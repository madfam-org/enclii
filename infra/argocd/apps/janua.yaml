# Janua Identity Services Application
# Deploys: janua-admin, janua-api, janua-dashboard, janua-docs, janua-website
# Source: https://github.com/madfam-org/janua (external repo)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: janua-services
  namespace: argocd
  labels:
    app.kubernetes.io/name: janua-services
    app.kubernetes.io/part-of: janua
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.enclii: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/madfam-org/janua.git
    targetRevision: main
    path: k8s/base/deployments

  destination:
    server: https://kubernetes.default.svc
    namespace: janua

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
