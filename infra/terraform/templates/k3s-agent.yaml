#cloud-config
# K3s Agent (Worker Node) Cloud-Init Configuration

package_update: true
package_upgrade: true

packages:
  - curl
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - jq
  - htop
  - vim

write_files:
  # Owner standard (2026-11-05): a node ends onboarding with direct SSH closed.
  # Root SSH with the provisioning key is a bootstrap path only; it is parked
  # after the join below. Break-glass: kubectl debug node, or the provider's
  # web console. 00- sorts first, and sshd keeps the first value it reads.
  - path: /etc/ssh/sshd_config.d/00-madfam-no-direct-ssh.conf
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  - path: /etc/rancher/k3s/config.yaml
    content: |
      node-name: ${node_name}
      server: https://${server_ip}:6443
      token: ${k3s_token}
    permissions: '0600'

  - path: /etc/sysctl.d/99-kubernetes.conf
    content: |
      # Kubernetes networking requirements
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

      # Performance tuning for container workloads
      net.core.somaxconn = 32768
      net.ipv4.tcp_max_syn_backlog = 32768
      net.core.netdev_max_backlog = 32768

      # Memory management
      vm.swappiness = 0
      vm.overcommit_memory = 1

  - path: /etc/security/limits.d/99-kubernetes.conf
    content: |
      * soft nofile 1048576
      * hard nofile 1048576
      * soft nproc 65535
      * hard nproc 65535

runcmd:
  # Apply sysctl settings
  - sysctl --system

  # Disable swap
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab

  # Wait for server to be ready
  - |
    echo "Waiting for K3s server..."
    while ! curl -k https://${server_ip}:6443/healthz 2>/dev/null; do
      sleep 10
    done
    echo "K3s server is ready"

  # Install K3s agent
  - |
    curl -sfL https://get.k3s.io | sh -s - agent \
      --config /etc/rancher/k3s/config.yaml

  # Close direct SSH once the agent is installed (owner standard 2026-11-05):
  # park the provisioning key as a root-only break-glass copy and apply the
  # drop-in written above.
  - |
    if [ -f /root/.ssh/authorized_keys ]; then
      mv /root/.ssh/authorized_keys /root/.ssh/authorized_keys.disabled-bootstrap
      chmod 600 /root/.ssh/authorized_keys.disabled-bootstrap
    fi
    sshd -t && (systemctl reload ssh || systemctl reload sshd)

final_message: "K3s agent ${node_name} joined cluster successfully after $UPTIME seconds"
