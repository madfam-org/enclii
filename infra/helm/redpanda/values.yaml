# Redpanda Helm values — canonical source of truth.
#
# ArgoCD's Helm source doesn't support external valueFiles, so the
# same values are also inlined into `infra/argocd/apps/redpanda.yaml`.
# If you change values here, mirror the change there (same pattern as
# `infra/helm/keda/values.yaml` ↔ `infra/argocd/apps/keda.yaml`).
#
# Docs: https://docs.redpanda.com/current/reference/k-helm-spec/

image:
  # Pin to a specific Redpanda version for deterministic upgrades.
  repository: docker.redpanda.com/redpandadata/redpanda
  tag: v24.3.6

# 3-broker StatefulSet: matches the cluster's 3-node layout; supports
# replication.factor=3 on topics without squeezing the scheduler.
statefulset:
  replicas: 3
  # Soft spread, as in the live Application: one node is tainted for CI, so
  # hard antiaffinity would leave a broker unschedulable.
  podAntiAffinity:
    topologyKey: kubernetes.io/hostname
    type: soft
    weight: 100
  # CPU request (2026-11-01): see `resources` below.
  podTemplate:
    spec:
      containers:
      - name: redpanda
        resources:
          requests:
            cpu: 200m
  # NodePort tunnel routes are provisioned via NetworkPolicy + Service,
  # not via host networking.

# Internal Kafka API only — this cluster has no reason to expose
# Kafka externally, and NetworkPolicy below isolates by namespace.
listeners:
  kafka:
    port: 9092
    tls:
      enabled: false
  admin:
    port: 9644
    tls:
      enabled: false
  rpc:
    port: 33145
    tls:
      enabled: false
  schemaRegistry:
    port: 8081
    tls:
      enabled: false
  http: # pandaproxy (Kafka REST)
    port: 8082
    tls:
      enabled: false

external:
  enabled: false

# SASL disabled — internal service, access controlled by NetworkPolicy.
# Enable in a follow-up PR once the ecosystem's Kafka clients learn SCRAM-SHA-512
# and the Vault ExternalSecret is wired (cf. `infra/k8s/base/external-secrets/vault-secrets/`).
auth:
  sasl:
    enabled: false

tls:
  enabled: false

# Persistent storage via Longhorn — 2-replica StorageClass across nodes
# (per infra/helm/longhorn/values.yaml). 50 GiB per broker covers the
# expected routecraft / future ecosystem log volume with headroom.
storage:
  persistentVolume:
    enabled: true
    storageClass: longhorn
    size: 50Gi
  tieredConfig: {}  # No S3 offload for now.

# Per-broker resources. The chart renders limits only, so Kubernetes sets the
# CPU request equal to the `cores` limit. The 2026-08-17 change here
# (`overprovisioned: true`, #413) never lowered the request: it only adds the
# `--overprovisioned` flag, and it never reached the live Application, which
# keeps `false`. On 2026-11-01 the brokers still requested 1000m each against
# a 7-day max of 80m. The request is now set in `statefulset.podTemplate`
# above, which the chart merges into the PodSpec by container name. Memory
# reservation is realistic (~440Mi used vs 2Gi cap) and kept as burst room.
#
# NOTE: `cpu.cores` MUST stay an integer (the chart schema rejects fractions).
resources:
  cpu:
    cores: 1
    overprovisioned: false
  memory:
    enable_memory_locking: false
    container:
      max: 2Gi

# Redpanda Console disabled initially (keeps the install minimal).
# Re-enable + add a tunnel route in a follow-up PR for operators.
console:
  # Redpanda Console UI for topics/partitions/consumer-groups browsing.
  # Exposed internally on data/redpanda-console:8080 only; it is not
  # published through the tunnel. Port-forward for break-glass work.
  enabled: true

# Tune for our modest cluster — auto-create topics so services can
# self-provision without an ops ticket; clients set retention per-topic.
config:
  cluster:
    auto_create_topics_enabled: true
    default_topic_partitions: 3
    default_topic_replications: 3
  tunable:
    log_segment_size: 134217728  # 128 MiB
    log_retention_ms: 604800000  # 7 days
