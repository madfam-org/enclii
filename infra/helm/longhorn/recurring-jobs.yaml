---
# Longhorn Recurring Jobs
#
# GROUPS ARE SEGMENTED BY WRITE CHURN, NOT BY IMPORTANCE. This is the fix for the
# 2026-08-07 Loki outage, where a 5 Gi volume was carrying 10.9 Gi of SNAPSHOTS:
#
#   daily-sn-98cb7b19  4.95 Gi   <- one daily snapshot, larger than the volume
#   daily-sn-e758dde5  1.49 Gi
#   daily-sn-257f700e  1.44 Gi
#   weekly-s-59de9ee7  1.39 Gi
#   daily-sn-e57ca992  0.91 Gi     ... 9 total, actualSize 218% of nominal
#
# Longhorn snapshots are copy-on-write deltas stored ON THE VOLUME ITSELF. On a
# low-churn volume a daily snapshot is small. On a HIGH-CHURN one -- Loki
# rewriting its TSDB index, Postgres WAL, redpanda segments, Elasticsearch
# merges -- each daily snapshot approaches a FULL COPY. Seven retained is then
# 5-10x nominal, and the volume fills with its own history.
#
# That is also why cluster StorageScheduled read 818 Gi against 463 Gi of
# physical disk: not workload size, but every volume silently carrying up to
# seven copies of itself.
#
# ENLARGING THE VOLUME DOES NOT FIX THIS -- a 20 Gi volume grows 20 Gi snapshots.
# Retention has to match churn, which is what the two groups below encode.
#
# Membership is by volume label:
#   recurring-job-group.longhorn.io/default    = enabled   (low churn, retain 7)
#   recurring-job-group.longhorn.io/high-churn = enabled   (retain 2)
#
# ---------------------------------------------------------------------------
# CHANGING A VOLUME'S GROUP DOES NOT MIGRATE ITS EXISTING SNAPSHOTS. IT STRANDS
# THEM. Relabelling is only half the operation; the other half is below.
#
# A recurring job prunes ONLY snapshots carrying its own `RecurringJob` label --
# never every snapshot on the volume. Proof, visible on any default-group volume:
#
#   {daily-snapshot: 7, daily-s3-backup: 1, weekly-s3-backup: 1}  = 9 snapshots
#
# while daily-snapshot's retain is 7. Per-volume pruning would have trimmed it to
# 7. It does not, because each job only counts its own.
#
# So when a volume moves default -> high-churn, the snapshots daily-snapshot made
# are left with NO owner: daily-snapshot no longer targets the volume, and
# high-churn-snapshot will only ever prune snapshots it created itself. A chain
# that was bounded and rotating at 7 becomes frozen and permanent.
#
# On 2026-08-08 this stranded 128 snapshots / 117 Gi across 14 volumes -- caused
# by the remediation for the 2026-08-07 outage, not by the outage. prometheus-data
# alone held 10 of them (53 Gi, 2.72x its nominal size).
#
# AFTER RELABELLING ANY VOLUME, delete the previous owner's snapshots explicitly:
#
#   1. Find the volume's backup anchor -- the `snapshotName` of its most recent
#      Completed backup. KEEP it; deleting it forces the next R2 backup to be a
#      full upload instead of an incremental.
#   2. `kubectl -n longhorn-system delete snapshots.longhorn.io <name>` for the
#      rest. This never touches live data: a snapshot is a past restore point,
#      not current state, and the R2 backups are independent of it.
#   3. Wait for every engine `purgeStatus` to leave `in_progress` BEFORE
#      re-measuring. `actualSize` RISES during the purge -- coalescing writes the
#      merged blocks before freeing the originals, and the surviving anchor
#      absorbs them. Measured yield on prometheus-data: 54.52 -> 20.21 Gi, i.e.
#      64% of the nominal snapshot total, not 100%.
#
# The gate `storage.no-orphaned-snapshots` (internal-devops) reports this
# condition continuously. Note that the obvious success criterion for the
# migration -- "no volume is in both groups" -- is EXACTLY the condition that
# strands the snapshots. It is correct for steady state and blind to the
# transition, which is why nothing reported it.
# ---------------------------------------------------------------------------
#
# Put a volume in high-churn when it rewrites rather than appends. Today that is
# at least: loki, redpanda, tezca-es, prometheus, and every postgres data volume.
# Offsite BACKUPS are unchanged for both groups -- backups live in R2, not on the
# volume, so they carry no local space cost. Only local SNAPSHOT retention drops.
#
# Applied to all volumes in the "default" group.
# 1. Daily local snapshots (retain 7) — fast rollback without R2 download
# 2. Daily R2 backup (retain 7) — offsite disaster recovery
# 3. Weekly R2 backup (retain 4) — longer-term offsite copies
#
# Usage:
#   kubectl apply -f recurring-jobs.yaml
#
# To verify:
#   kubectl get recurringjob -n longhorn-system

# Daily local snapshots — 02:00 UTC, retain 7 days
# Enables quick rollback of postgres-data, prometheus-data, redis-data
apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: enclii
spec:
  task: snapshot
  cron: "0 2 * * *"
  retain: 7
  concurrency: 1
  groups:
    - default
  labels:
    backup-type: snapshot
    retention: daily
---
# Daily R2 backup — 03:00 UTC, retain 7 copies
apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: daily-s3-backup
  namespace: longhorn-system
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: enclii
    backup.enclii.dev/type: disaster-recovery
spec:
  task: backup
  cron: "0 3 * * *"
  retain: 7
  concurrency: 1
  groups:
    - default
  labels:
    backup-type: scheduled
    retention: daily
---
# Weekly R2 backup — Sundays at 04:00 UTC, retain 4 weeks
# Supplements the daily backup (7 retention) with longer-term copies
apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: weekly-s3-backup
  namespace: longhorn-system
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: enclii
    backup.enclii.dev/type: disaster-recovery
spec:
  task: backup
  cron: "0 4 * * 0"
  retain: 4
  concurrency: 1
  groups:
    - default
  labels:
    backup-type: scheduled
    retention: weekly
---
# High-churn local snapshots — 02:30 UTC, retain 2
#
# Same task as daily-snapshot, deliberately a SEPARATE job so the retention can
# differ. Two is enough for "roll back this morning's bad deploy"; seven is what
# filled Loki's volume with 10.9 Gi of its own deltas. Volumes opt in with
#   recurring-job-group.longhorn.io/high-churn: enabled
# and must NOT also carry the default group, or both jobs run and the point is
# lost. Dropping the default label is what strands the snapshots daily-snapshot
# already made -- see the migration procedure in the header before relabelling.
apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: high-churn-snapshot
  namespace: longhorn-system
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: enclii
spec:
  task: snapshot
  cron: "30 2 * * *"
  retain: 2
  concurrency: 1
  groups:
    - high-churn
  labels:
    backup-type: snapshot
    retention: high-churn
---
# High-churn offsite backup — 03:30 UTC, retain 7
#
# Retention here matches the default group on purpose: backups live in R2, not on
# the volume, so keeping seven costs no local space. Durability is NOT what we are
# trading away -- only the local snapshot count is.
apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: high-churn-s3-backup
  namespace: longhorn-system
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: enclii
    backup.enclii.dev/type: disaster-recovery
spec:
  task: backup
  cron: "30 3 * * *"
  retain: 7
  concurrency: 1
  groups:
    - high-churn
  labels:
    backup-type: scheduled
    retention: high-churn
