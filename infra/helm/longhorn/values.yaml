# Longhorn CSI Storage - Multi-Node Replicated Storage
# Install: helm install longhorn longhorn/longhorn -n longhorn-system --create-namespace -f values.yaml
#
# Prerequisites:
# - helm repo add longhorn https://charts.longhorn.io
# - kubectl create namespace longhorn-system
#
# After install:
# - PVCs using 'longhorn-replicated' StorageClass will replicate across nodes
# - Dashboard available via: kubectl port-forward -n longhorn-system svc/longhorn-frontend 8080:80

defaultSettings:
  # Multi-node cluster: 2 replicas for storage redundancy across nodes
  # Increase to 3 when 3+ storage nodes available
  defaultReplicaCount: 2

  # Storage allocation settings
  storageOverProvisioningPercentage: 200
  storageMinimalAvailablePercentage: 15

  # Backup to Cloudflare R2 (offsite)
  # Requires longhorn-backup-secret in longhorn-system namespace
  backupTarget: "s3://enclii-backups@auto/"
  backupTargetCredentialSecret: "longhorn-backup-secret"
  # Keep offsite backups serialized. R2 was resetting concurrent backupstore
  # writes, causing the daily recurring job to restart after partial success.
  backupConcurrentLimit: 1

  # Performance tuning for SSD/NVMe
  # Right-sized from 12% (1440m on 12-core) to 3% (360m) — actual usage ~91m
  guaranteedEngineManagerCPU: 3
  guaranteedReplicaManagerCPU: 3

  # Auto-salvage replicas when majority are available
  autoSalvage: true

  # Disable auto-deletion of workload pods on volume degradation
  # (allows time for manual intervention)
  autoDeletePodWhenVolumeDetachedUnexpectedly: false

  # Node drain policy - allow pods to continue during maintenance
  nodeDrainPolicy: always-allow

  # Replica auto-balance across nodes
  replicaAutoBalance: best-effort

persistence:
  # Default replica count for dynamic provisioning (2 for multi-node redundancy)
  defaultClassReplicaCount: 2

  # Reclaim policy - Retain data on PVC deletion (safer for production)
  reclaimPolicy: Retain

ingress:
  enabled: false  # Use kubectl port-forward for dashboard access

# Resource limits for Longhorn components
longhornManager:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Tolerate infra taints: Longhorn must run anywhere Longhorn engines can run.
  tolerations:
    - key: "builder"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"

longhornDriver:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
