# PostHog Product Analytics - Resource-Constrained 2-Node k3s Cluster
# Install: Deployed via ArgoCD (infra/argocd/apps/posthog.yaml)
#
# Prerequisites:
# - Create namespace: kubectl create namespace posthog
# - Create posthog-secrets in posthog namespace:
#     kubectl create secret generic posthog-secrets -n posthog \
#       --from-literal=POSTHOG_DB_PASSWORD='<password>' \
#       --from-literal=POSTHOG_SECRET_KEY='<django-secret-key>' \
#       --from-literal=POSTHOG_REDIS_PASSWORD=''
# - Create posthog database in shared PostgreSQL:
#     kubectl exec -n data deploy/postgres -- psql -U postgres \
#       -c "CREATE USER posthog WITH PASSWORD '<password>';" \
#       -c "CREATE DATABASE posthog OWNER posthog;"
# - Deploy standalone Redpanda BEFORE Helm install:
#     kubectl apply -f infra/k8s/production/posthog-redpanda.yaml
#
# After install:
# - Web UI available via Cloudflare Tunnel at analytics.madfam.io
# - Add posthog namespace to data-network-policies.yaml for DB/Redis access

cloud: "private"

# ---------------------------------------------------------------------------
# Web (Django) — serves the PostHog UI and API
# ---------------------------------------------------------------------------
web:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Kyverno compliance: restricted pod security
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

# ---------------------------------------------------------------------------
# Worker — processes async tasks (Celery)
# ---------------------------------------------------------------------------
worker:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ---------------------------------------------------------------------------
# Plugins — runs PostHog plugin server (ingestion pipeline)
# ---------------------------------------------------------------------------
plugins:
  replicaCount: 1
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ---------------------------------------------------------------------------
# Ingress — disabled; traffic arrives via Cloudflare Tunnel
# ---------------------------------------------------------------------------
ingress:
  enabled: false

# ---------------------------------------------------------------------------
# ClickHouse — columnar analytics database (bundled, single-node)
# ---------------------------------------------------------------------------
clickhouse:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi
  # Single shard, single replica — sufficient for single-node analytics
  layout:
    shardsCount: 1
    replicasCount: 1

# ---------------------------------------------------------------------------
# Kafka — disabled; using standalone Redpanda as Kafka-compatible broker
# PostHog chart v30.46.0 has NO Redpanda subchart dependency. The chart only
# bundles bitnami/kafka. The `redpanda:` values block was silently ignored.
# We deploy Redpanda separately (posthog-redpanda.yaml) and wire it here.
# ---------------------------------------------------------------------------
kafka:
  enabled: false

# Point PostHog at the standalone Redpanda broker
externalKafka:
  brokers:
    - posthog-redpanda.posthog.svc.cluster.local:9092

# ---------------------------------------------------------------------------
# PostgreSQL — external (shared cluster in data namespace)
# ---------------------------------------------------------------------------
postgresql:
  enabled: false

externalPostgresql:
  postgresqlHost: postgres.data.svc.cluster.local
  postgresqlPort: 5432
  postgresqlDatabase: posthog
  postgresqlUsername: posthog
  # Password injected from posthog-secrets Secret
  existingSecret: posthog-secrets
  existingSecretPasswordKey: POSTHOG_DB_PASSWORD

# ---------------------------------------------------------------------------
# Redis — external (shared instance in data namespace)
# ---------------------------------------------------------------------------
redis:
  enabled: false

externalRedis:
  host: redis.data.svc.cluster.local
  port: 6379

# ---------------------------------------------------------------------------
# ZooKeeper — required by ClickHouse for ReplicatedMergeTree tables
# Even with a single replica, PostHog's ClickHouse schema uses replicated
# table engines that depend on ZooKeeper for metadata coordination.
# ---------------------------------------------------------------------------
zookeeper:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 1Gi

# ---------------------------------------------------------------------------
# PostHog configuration
# ---------------------------------------------------------------------------
env:
  # Django secret key from posthog-secrets
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: posthog-secrets
        key: POSTHOG_SECRET_KEY
  # Disable PostHog telemetry (self-hosted)
  - name: POSTHOG_PERSONAL_API_KEY
    value: ""
  - name: DISABLE_SECURE_SSL_REDIRECT
    value: "1"
  # Trust Cloudflare proxy headers
  - name: IS_BEHIND_PROXY
    value: "1"
  - name: TRUST_ALL_PROXIES
    value: "1"

# ---------------------------------------------------------------------------
# Service Account
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: posthog
