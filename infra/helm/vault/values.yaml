# HashiCorp Vault - Single-node file backend Deployment
# Install: Managed by ArgoCD (infra/argocd/apps/vault.yaml)
# Chart: hashicorp/vault from https://helm.releases.hashicorp.com
# Bootstrap runbook: internal-devops/runbooks/vault-bootstrap.md  (P0.2)
#
# Prerequisites:
# - Longhorn CSI installed (StorageClass: longhorn) with ~15 Gi free
# - ArgoCD syncing infra/argocd/apps/vault.yaml
# - Fluent Bit forwarding pod logs to Loki (audit device writes to stderr)
#
# After install (see vault-bootstrap.md):
# 1. kubectl exec -n vault vault-0 -- vault operator init
# 2. kubectl exec -n vault vault-0 -- vault operator unseal <key> (x3)
# 3. vault audit enable file file_path=/dev/stderr  (MUST happen before first write)
# 4. vault auth enable kubernetes; configure k8s auth
# 5. vault secrets enable -version=2 -path=secret kv
# 6. Apply internal-devops/templates/vault/selva-secret-writer-rbac.yaml
# 7. Register vault-selva-writer policy + role
# 8. Rotate root token; revoke original
#
# Storage strategy:
# The live Vault was initialized on the file backend. Keep desired state aligned
# with the initialized backend so a pod restart does not boot an empty Raft
# backend. Raft migration is a separate, controlled backup/restore procedure.

server:
  image:
    repository: docker.io/hashicorp/vault
    tag: "1.18.3"

  # HA/Raft disabled until a controlled migration from the initialized file
  # backend is performed.
  ha:
    enabled: false

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address     = "[::]:8200"
        cluster_address = "[::]:8201"

        telemetry {
          unauthenticated_metrics_access = true
        }
      }

      storage "file" {
        path = "/vault/data"
      }

  # Avoid hostNetwork (Kyverno hostPort violation)
  hostNetwork: false

  service:
    type: ClusterIP

  # Persistent storage on Longhorn CSI for the initialized file backend.
  dataStorage:
    enabled: true
    storageClass: longhorn
    size: 5Gi

  # Audit log storage (separate PVC — NOT the audit source of truth, just a
  # backup sink; the primary audit device writes to stderr for Fluent Bit).
  auditStorage:
    enabled: true
    storageClass: longhorn
    # 8Gi = the live claim (2026-10-17); see infra/argocd/apps/vault.yaml.
    size: 8Gi

  # Resource limits — HA mode is slightly heavier than standalone.
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # Ingress disabled. Vault is in-cluster only (no tunnel route); operators
  # use `kubectl exec`, the SSH policy script or a port-forward.
  ingress:
    enabled: false

  # Kyverno compliance: Pod Security Standards (restricted)
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000

  # Kyverno compliance: Container Security Context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  # Readiness/liveness probes
  # uninitcode=200 and sealedcode=200 allow vault to stay running while
  # uninitialized/sealed (init/unseal is a manual step — vault-bootstrap.md).
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200"
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200"
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

  # Avoid scheduling on GPU-tainted nodes or the builder VPS.
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"

  # Prefer scheduling on control-plane node. Pod anti-affinity is
  # 'preferred' not 'required' so a 1-replica install schedules cleanly;
  # when we scale to 3 replicas, this prefers spreading.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vault

  # ServiceAccount for Vault itself (separate from vault-selva-writer SA
  # in the selva namespace — that SA is the *client* identity).
  # FILE AUDIT ROTATION (2026-10-17). The file audit device
  # (/vault/audit/vault_audit.log) never rotates: Vault 1.18 has no rotation
  # option for it (log_rotate_* applies to the server log only), and its
  # docs say to rotate externally and send SIGHUP, which makes Vault close
  # and reopen the file. Without that the audit claim filled (8.2 GiB on
  # 8Gi, "no space left on device" on 2026-10-17); Vault kept answering
  # only because the stderr audit device still writes.
  # The sidecar below renames the file past ROTATE_BYTES, signals vault
  # (shareProcessNamespace; same uid 100, so no extra capability), gzips the
  # rotated file, and keeps the newest rotated files that fit in
  # KEEP_ROTATED files and MAX_ROTATED_BYTES (3GiB of the 8Gi claim).
  # Older ones, and a rotated file larger than the whole budget (the
  # pre-existing full log on its first pass), are DELETED, each with a log
  # line. If no vault process takes the SIGHUP, it undoes the rename and
  # deletes nothing. Same image as the server, so nothing new is pulled.
  # Logs: enclii ops pods logs vault-0 -n vault --container audit-rotate
  shareProcessNamespace: true
  extraContainers:
    - name: audit-rotate
      image: docker.io/hashicorp/vault:1.18.3
      command:
        - /bin/sh
        - -c
        - |
          set -u
          AUDIT="${AUDIT_FILE}"
          DIR="$(dirname "${AUDIT}")"
          log() { echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] audit-rotate: $*"; }
          bytes() { wc -c < "$1" 2>/dev/null | tr -d ' '; }
          log "start: rotate ${AUDIT} at ${ROTATE_BYTES} bytes; keep ${KEEP_ROTATED} rotated files, ${MAX_ROTATED_BYTES} bytes at most; every ${INTERVAL_SECONDS}s"
          while true; do
            size="$(bytes "${AUDIT}")"
            if [ -n "${size}" ] && [ "${size}" -ge "${ROTATE_BYTES}" ]; then
              rotated="${AUDIT}.$(date -u +%Y%m%dT%H%M%SZ)"
              if mv "${AUDIT}" "${rotated}"; then
                if pkill -HUP -x vault; then
                  log "rotated ${size} bytes to ${rotated}; sent SIGHUP so vault reopens ${AUDIT}"
                  # Compress unless it is already over the whole budget (the prune
                  # below deletes it, and gzip would need space the disk may lack).
                  if [ "${size}" -le "${MAX_ROTATED_BYTES}" ]; then
                    gzip -1 "${rotated}" 2>/dev/null || { rm -f "${rotated}.gz"; log "could not compress ${rotated}; kept as is"; }
                  fi
                elif mv "${rotated}" "${AUDIT}"; then
                  log "ERROR: no vault process took SIGHUP; rotation undone, nothing deleted"
                else
                  log "ERROR: no vault process took SIGHUP and ${rotated} could not be moved back"
                fi
              else
                log "ERROR: could not rename ${AUDIT}"
              fi
            fi
            # Prune rotated files, newest first: keep the newest ones while they fit
            # in KEEP_ROTATED files and MAX_ROTATED_BYTES; the first one that does not
            # fit, and every older one, is deleted. The live file is never touched.
            n=0
            total=0
            over=0
            for f in $(ls -1 "${AUDIT}".* 2>/dev/null | sort -r); do
              fsize="$(bytes "${f}")"
              [ -n "${fsize}" ] || continue
              n=$((n + 1))
              total=$((total + fsize))
              if [ "${over}" -eq 1 ] || [ "${n}" -gt "${KEEP_ROTATED}" ] || [ "${total}" -gt "${MAX_ROTATED_BYTES}" ]; then
                over=1
                rm -f "${f}" && log "deleted ${f} (${fsize} bytes): past the limit of ${KEEP_ROTATED} files / ${MAX_ROTATED_BYTES} bytes"
              fi
            done
            used="$(df -P "${DIR}" 2>/dev/null | awk 'NR==2 {gsub("%","",$5); print $5}')"
            if [ -n "${used}" ] && [ "${used}" -ge 85 ]; then
              log "WARNING: ${DIR} is ${used}% full"
            fi
            sleep "${INTERVAL_SECONDS}"
          done
      env:
        - name: AUDIT_FILE
          value: /vault/audit/vault_audit.log
        - name: ROTATE_BYTES
          value: "268435456"      # 256MiB
        - name: KEEP_ROTATED
          value: "30"
        - name: MAX_ROTATED_BYTES
          value: "3221225472"     # 3GiB
        - name: INTERVAL_SECONDS
          value: "300"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 64Mi
      volumeMounts:
        - name: audit
          mountPath: /vault/audit

  serviceAccount:
    create: true
    name: vault
    # Vault's own SA needs token-review permission to validate k8s auth.
    # The Helm chart creates a ClusterRoleBinding automatically when
    # auth.kubernetes is enabled server-side (vault-bootstrap.md step 4).

# Vault UI enabled for port-forward use only; it is not published.
ui:
  enabled: true

# Disable sidecar injector — we use External Secrets Operator (ESO) instead
# to materialize Vault-owned secrets into K8s Secret objects consumed by apps
# via `envFrom`. See infra/k8s/base/external-secrets/vault-cluster-secret-store.yaml
injector:
  enabled: false
