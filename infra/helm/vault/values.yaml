# HashiCorp Vault - HA (Raft) Deployment
# Install: Managed by ArgoCD (infra/argocd/apps/vault.yaml)
# Chart: hashicorp/vault from https://helm.releases.hashicorp.com
# Bootstrap runbook: internal-devops/runbooks/vault-bootstrap.md  (P0.2)
#
# Prerequisites:
# - Longhorn CSI installed (StorageClass: longhorn) with ~15 Gi free
# - ArgoCD syncing infra/argocd/apps/vault.yaml
# - Fluent Bit forwarding pod logs to Loki (audit device writes to stderr)
#
# After install (see vault-bootstrap.md):
# 1. kubectl exec -n vault vault-0 -- vault operator init
# 2. kubectl exec -n vault vault-0 -- vault operator unseal <key> (x3)
# 3. vault audit enable file file_path=stderr  (MUST happen before first write)
# 4. vault auth enable kubernetes; configure k8s auth
# 5. vault secrets enable -version=2 -path=secret kv
# 6. Apply internal-devops/templates/vault/selva-secret-writer-rbac.yaml
# 7. Register vault-selva-writer policy + role
# 8. Rotate root token; revoke original
#
# Replica strategy:
# replicas=1 at launch — cluster has only 2 non-tainted workers (foundry-cp +
# foundry-worker-01; foundry-builder-01 is tainted). A 3-replica Raft on 2
# nodes would place 2 replicas on the same node, violating Raft availability
# guarantees. Bump to 3 after P1.2 adds a third non-tainted worker.
# Raft on-disk format supports 1 -> 3 scale-up without re-init.

server:
  image:
    repository: docker.io/hashicorp/vault
    tag: "1.18.3"

  # HA (Raft integrated storage) — replaces standalone/file backend.
  # On-disk data at /vault/data migrates naturally 1 -> 3 replicas when the
  # cluster grows.
  ha:
    enabled: true
    replicas: 1  # See "Replica strategy" note above
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address     = "[::]:8200"
          cluster_address = "[::]:8201"

          telemetry {
            unauthenticated_metrics_access = true
          }
        }

        storage "raft" {
          path = "/vault/data"

          # When replicas scale from 1 to 3 post-P1.2, uncomment and update:
          # retry_join {
          #   leader_api_addr = "http://vault-0.vault-internal:8200"
          # }
          # retry_join {
          #   leader_api_addr = "http://vault-1.vault-internal:8200"
          # }
        }

        service_registration "kubernetes" {}

        # Phase 1: Transit auto-unseal (requires a second Vault to unseal
        # against). Leave stanza commented until that second Vault exists.
        # seal "transit" {
        #   address      = "http://transit-vault.vault.svc.cluster.local:8200"
        #   token        = "<from Vault secret, not this file>"
        #   disable_renewal = "false"
        #   key_name     = "autounseal"
        #   mount_path   = "transit/"
        # }

  # Disable standalone mode — HA (Raft) takes over.
  standalone:
    enabled: false

  # Avoid hostNetwork (Kyverno hostPort violation)
  hostNetwork: false

  service:
    type: ClusterIP

  # Persistent storage on Longhorn CSI. HA Raft needs this per-replica.
  dataStorage:
    enabled: true
    storageClass: longhorn
    size: 5Gi

  # Audit log storage (separate PVC — NOT the audit source of truth, just a
  # backup sink; the primary audit device writes to stderr for Fluent Bit).
  auditStorage:
    enabled: true
    storageClass: longhorn
    size: 2Gi

  # Resource limits — HA mode is slightly heavier than standalone.
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # Ingress disabled — access via Cloudflare Tunnel (vault.madfam.io)
  ingress:
    enabled: false

  # Kyverno compliance: Pod Security Standards (restricted)
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000

  # Kyverno compliance: Container Security Context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  # Readiness/liveness probes
  # uninitcode=200 and sealedcode=200 allow vault to stay running while
  # uninitialized/sealed (init/unseal is a manual step — vault-bootstrap.md).
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200"
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200"
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 6

  # Avoid scheduling on GPU-tainted nodes or the builder VPS.
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"

  # Prefer scheduling on control-plane node. Pod anti-affinity is
  # 'preferred' not 'required' so a 1-replica install schedules cleanly;
  # when we scale to 3 replicas, this prefers spreading.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vault

  # ServiceAccount for Vault itself (separate from vault-selva-writer SA
  # in the autoswarm-office namespace — that SA is the *client* identity).
  serviceAccount:
    create: true
    name: vault
    # Vault's own SA needs token-review permission to validate k8s auth.
    # The Helm chart creates a ClusterRoleBinding automatically when
    # auth.kubernetes is enabled server-side (vault-bootstrap.md step 4).

# Vault UI enabled (reachable via Cloudflare Tunnel → vault.madfam.io)
ui:
  enabled: true

# Disable sidecar injector — we use External Secrets Operator (ESO) instead
# to materialize Vault-owned secrets into K8s Secret objects consumed by apps
# via `envFrom`. See infra/k8s/base/external-secrets/vault-cluster-secret-store.yaml
injector:
  enabled: false
