# Shared configuration for ARC runner scale sets
# Blue and green scale sets inherit from this base configuration
# Helm chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# CURRENT STATE: Running without DinD to get stable CI working
# TODO: Add DinD support later once basic runners are stable
#
# ROOT CAUSE FOUND: When using containerMode.type=dind with custom containers,
# ARC's merge behavior doesn't work properly, causing runners to exit immediately.
# SOLUTION: Don't use custom containers - let ARC handle everything.

# Controller service account reference (required for helm template validation)
# Without this, helm template fails because it can't discover the controller in a cluster
controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: arc-system

# Org-level registration - GitHub App has org permissions
# The runner will be registered to run for all repos in the org
githubConfigUrl: "https://github.com/madfam-org"
githubConfigSecret: github-app-secret

# NOTE: Removed explicit runnerGroup setting
# GitHub may use the "Default" group which may have full repo access
# If issues persist, an org admin needs to grant the Default group access to enclii repo

# NOTE: DinD disabled for now - runners work without it
# Jobs that need Docker will need to use setup-docker action or alternative
# containerMode:
#   type: "dind"

# Runner pod template - minimal customization, let ARC handle injection
template:
  spec:
    serviceAccountName: arc-runner
    terminationGracePeriodSeconds: 300
    # Target the builder node "The Forge" (foundry-builder-01)
    nodeSelector:
      role: builder
    # Tolerate the builder taint
    tolerations:
      - key: "builder"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    containers:
      - name: runner
        # ROLLED BACK to upstream runner image 2026-04-26 after the hardened
        # MADFAM overlay (ghcr.io/madfam-org/enclii/arc-runner:stable) was
        # found to exit immediately on container start (exitCode 0, never
        # invoked run.sh). The hardened image needs an explicit ENTRYPOINT
        # or the Dockerfile must inherit FROM ghcr.io/actions/actions-runner
        # WITHOUT overriding CMD. Followup: fix the overlay Dockerfile, then
        # re-pin to :stable here.
        image: ghcr.io/actions/actions-runner:latest
        # Always pull when using :latest — Kyverno block-latest-ifnotpresent
        # rejects :latest + IfNotPresent ("the Latest Trap"). Pinning to a
        # version tag would avoid this; deferred until the hardened MADFAM
        # overlay is fixed and re-pinned.
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1500m
            memory: 2Gi

# Listener configuration (manages scale set communication with GitHub)
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        # Health probes for reliability (Wave 13 stability recommendation)
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
