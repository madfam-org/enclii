# Shared configuration for ARC runner scale sets
# Blue and green scale sets inherit from this base configuration
# Helm chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# CURRENT STATE: Running without DinD to get stable CI working
# TODO: Add DinD support later once basic runners are stable
#
# ROOT CAUSE FOUND: When using containerMode.type=dind with custom containers,
# ARC's merge behavior doesn't work properly, causing runners to exit immediately.
# SOLUTION: Don't use custom containers - let ARC handle everything.

# Controller service account reference (required for helm template validation)
# Without this, helm template fails because it can't discover the controller in a cluster
controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: arc-system

# Org-level registration - GitHub App has org permissions
# The runner will be registered to run for all repos in the org
githubConfigUrl: "https://github.com/madfam-org"
githubConfigSecret: github-app-secret

# NOTE: Removed explicit runnerGroup setting
# GitHub may use the "Default" group which may have full repo access
# If issues persist, an org admin needs to grant the Default group access to enclii repo

# DinD enabled. Chart 0.14.0's dind-runner-container helper merges our
# custom container spec (image, command, resources) with chart-injected
# DOCKER_HOST env + dind-sock + work volume mounts. Sidecars added:
#   - init container (copies /home/runner/externals to dind-externals)
#   - dind sidecar (docker:dind, /var/run shared via emptyDir)
# Required for workflows using `services:` (Postgres, Redis) or
# `container:`. Chart's startup probe on dind has timeoutSeconds default
# (no longer 1s as in the stale 2026-04-09 release).
containerMode:
  type: "dind"

# Runner pod template - minimal customization, let ARC handle injection
template:
  spec:
    serviceAccountName: arc-runner
    terminationGracePeriodSeconds: 300
    # Target the builder node "The Forge" (foundry-builder-01)
    nodeSelector:
      role: builder
    # Tolerate the builder taint
    tolerations:
      - key: "builder"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    containers:
      - name: runner
        # MADFAM hardened runner image: thin overlay on
        # ghcr.io/actions/actions-runner that adds the system packages our
        # CI needs (libatomic1 for pnpm; xz-utils for setup-node;
        # libasound2t64 + libnss3 + libxkbcommon0 + libgbm1 for Playwright;
        # jq + python3-pip for misc CI scripting). Pinned to base 2.334.0.
        # Built by .github/workflows/arc-runner-image.yml.
        # Source: infra/docker/arc-runner/.
        image: ghcr.io/madfam-org/enclii/arc-runner:stable
        # Stable is intentionally mutable after the image workflow signs and
        # publishes a hardened runner. Always pull on new pods so runner fixes
        # do not wait for manual node image-cache eviction.
        imagePullPolicy: Always
        # Explicit command — chart 0.14.0 does NOT inject one when user
        # supplies a `containers:` block, and the runner image's CMD
        # is /bin/bash (intentional, lets Dockerfile overlays inherit
        # cleanly). Without this line, pods churn at exitCode 0 in <1s.
        command:
          - /home/runner/run.sh
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1500m
            memory: 2Gi

# Listener configuration (manages scale set communication with GitHub)
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        # Do not add HTTP probes here. The GitHub scale-set listener does not
        # expose /healthz, and probing it keeps the listener NotReady/recycling
        # while assigned jobs remain queued.
