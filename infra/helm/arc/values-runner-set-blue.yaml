# Blue runner scale set (primary)
# This is the active scale set during normal operations
# Usage: helm upgrade --install madfam-runners-blue \
#          oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#          --namespace arc-runners \
#          --values values-runner-set.yaml \
#          --values values-runner-set-blue.yaml

runnerScaleSetName: "madfam-runners-blue"

# Scale configuration — runners are intentionally pinned to the dedicated
# builder node. On 2026-05-06 the builder had 8 vCPU allocatable, 7.6 vCPU
# already requested during CI bursts, and ARC pods started sticking Pending
# once desired runners exceeded 9. Pending EphemeralRunner CRs count against
# scale-set capacity, so setting max above the schedulable ceiling creates
# artificial starvation instead of more throughput.
#
# Raise this only after adding a second builder node or deliberately allowing
# a separate spillover scale set onto non-production nodes.
minRunners: 1
maxRunners: 9

# Blue-specific labels for identification
template:
  metadata:
    labels:
      arc.enclii.dev/color: blue
      arc.enclii.dev/active: "true"
    annotations:
      arc.enclii.dev/deployed-at: ""  # Will be set by Helm
  spec:
    # Target the builder node "The Forge" (foundry-builder-01)
    nodeSelector:
      role: builder
    # Tolerate the builder taint
    tolerations:
      - key: "builder"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

# NOTE: Custom PVC volumes removed for now
# ARC's container merge doesn't work properly with custom containers
# Caching will use GitHub Actions cache instead of PVC-based caching
