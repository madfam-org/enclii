# Blue runner scale set (primary)
# This is the active scale set during normal operations
# Usage: helm upgrade --install madfam-runners-blue \
#          oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#          --namespace arc-runners \
#          --values values-runner-set.yaml \
#          --values values-runner-set-blue.yaml

runnerScaleSetName: "madfam-runners-blue"

# Scale configuration — runners are intentionally pinned to the builder
# nodes. On 2026-05-21 the blue pool saturated at 9 assigned jobs while
# private-repo workflows stayed queued, and the CPU request was cut to 400m so
# 12 runners fit on the 8 vCPU builder. That over-packing is what took the
# node down on 2026-10-24 (15 runners, memory thrash, NotReady twice). Since
# 2026-10-26 the request is 1 CPU / 4Gi (values-runner-set.yaml) and the node
# holds 6. maxRunners stays 20: runners beyond what the nodes hold wait as
# Pending pods and their jobs wait queued at GitHub. That is the intended
# back-pressure, not starvation; the pool-health alert pages only when
# running == 0.
#
# 2026-08-27 reconcile: a second builder node EXISTS,
# and commit b6352294 raised blue to 20 for it — but only in
# infra/k8s/production/arc/runner-blue/rendered.yaml, not here. The cluster
# has run maxRunners=20 since; this file lagging at 12 meant the next
# successful helm-path self-deploy would have silently clamped capacity
# back to 12. Keep BOTH this file and rendered.yaml in agreement.
minRunners: 1
maxRunners: 20

# Blue-specific labels for identification
template:
  metadata:
    labels:
      arc.enclii.dev/color: blue
      arc.enclii.dev/active: "true"
    annotations:
      arc.enclii.dev/deployed-at: ""  # Will be set by Helm
  spec:
    # Target builder nodes by LABEL, not by hostname: every builder carries
    # `role=builder` and the `builder=true:NoSchedule` taint tolerated below.
    nodeSelector:
      role: builder
    # Tolerate the builder taint
    tolerations:
      - key: "builder"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

# NOTE: Custom PVC volumes removed for now
# ARC's container merge doesn't work properly with custom containers
# Caching will use GitHub Actions cache instead of PVC-based caching
