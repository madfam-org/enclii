version: "2"

run:
  timeout: 5m
  go: "1.26"
  # tests MUST stay true. With tests:false the linter cannot see test files at
  # all, so `unused` reported resolveServiceName (logs.go) as dead when
  # logs_test.go calls it twice -- acting on that report would have deleted a
  # function the tests depend on. The "many false positives" that motivated
  # tests:false were errcheck complaints about unchecked errors in test helpers;
  # those are excluded by path below, which suppresses the noise without
  # blinding every other linter to test code.
  tests: true

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - unused
    - errcheck
    - staticcheck
  exclusions:
    presets:
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: "^QF"
      - linters:
          - errcheck
        text: "\\.Close"
      # Test helpers routinely ignore errors from json.Encode/w.Write/os.WriteFile
      # on fixtures that cannot fail meaningfully. Scoped to _test.go so errcheck
      # still applies in full to production code.
      - path: '_test\.go'
        linters:
          - errcheck

      # TODO(platform): pre-existing findings, owned by branch
      # `fix/lint-gate-honesty`. CI's module discovery skipped this module
      # entirely (no *.go at the module root), so lint had never run on it.
      # Listed individually so every NEW finding still fails the job.
      - linters:
          - staticcheck
        path: "internal/cmd/addon.go"
        text: "SA9003"
      - linters:
          - staticcheck
        path: "internal/ecosystemoidc/janua.go"
        text: "ST1005"
      - linters:
          - unused
        text: "resolveServiceName"
      - linters:
          - unused
        path: "internal/cmd/vault.go"
        text: "healthStatus"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 20
  max-same-issues: 5
