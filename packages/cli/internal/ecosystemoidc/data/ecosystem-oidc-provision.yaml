  # ---------------------------------------------------------------------------
  # voxa-selva — Voxa's API asking Selva's inference gateway for next-word
  # suggestions (POST /v1/chat/completions). One edge, one client, one scope:
  # client_credentials only, scope selva:infer, no browser leg.
  #
  # audience `selva-office` is what Selva's verify_jwt checks `aud` against
  # (its JANUA_CLIENT_ID). Every Voxa request also sends
  # `X-Sensitivity: restricted`, so Selva answers only from its local model
  # and otherwise refuses with 503; Voxa then falls back to its own local
  # predictor. Voxa reads the pair as SELVA_CLIENT_ID / SELVA_CLIENT_SECRET and
  # stays off until SELVA_ENABLED=true.
  #
  # Org-bound to madfam-ecosystem (like crea-map-payment-mail, one edge, plain
  # name), so the token carries a signed org_id: Selva keys its tenant policy
  # and its usage ledger on it, and a token without one has neither.
  #
  # NOT pinned yet: the first provision run prints the client id; pin it here
  # (both copies) so later runs reconcile this client instead of creating a
  # twin. The pair lands at secret/voxa through voxa/selva-client.
  # ---------------------------------------------------------------------------
  voxa-selva:
    intake_target: voxa/selva-client
    intake_key_map:
      selva_client_id: client_id
      selva_client_secret: client_secret  # pragma: allowlist secret
    janua_client:
      name: voxa-selva
      client_key: voxa-selva  # pragma: allowlist secret
      audience: selva-office
      description: Machine edge (client_credentials) from Voxa's API to Selva's inference gateway for word suggestions, always sent as X-Sensitivity restricted. Org-bound to madfam-ecosystem, scope selva:infer only.
      is_confidential: true
      organization_id: 1a6233ef-185f-43ee-9181-e2591fbb2643
      allowed_scopes:
        - selva:infer
      grant_types:
        - client_credentials

  # ---------------------------------------------------------------------------
  # selva-yantra4d — Selva's phygital tools calling Yantra4D: POST /api/render,
  # the project analysis routes and the project quote request. One edge, one
  # client, one scope: client_credentials only, scope yantra4d:render, no
  # browser leg.
  #
  # audience `yantra4d-api` is what Yantra4D's decode_token checks `aud`
  # against (JANUA_AUDIENCE), the audience pravara-yantra4d-step-reader already
  # holds. Yantra4D requires yantra4d:render on machine tokens at its render
  # routes (apps/api/middleware/auth.py, RENDER_SCOPE) and reads no tenant from
  # them, so this client is platform-admin like pravara-yantra4d-step-reader:
  # no organization_id. Registering it needs a Janua platform-admin session,
  # since yantra4d-api and yantra4d:render are reserved.
  #
  # Selva mints from the pair at run time as SELVA_YANTRA4D_CLIENT_ID /
  # SELVA_YANTRA4D_CLIENT_SECRET (selva-office
  # packages/tools/src/selva_tools/builtins/service_auth.py), delivered by its
  # dedicated selva-service-clients ExternalSecret, whose `property:` names are
  # the intake_key_map keys below. The pair lands at secret/selva through
  # selva/yantra4d-client.
  #
  # NOT pinned yet: the first provision run prints the client id; pin it here
  # (both copies) so later runs reconcile this client instead of creating a
  # twin.
  # ---------------------------------------------------------------------------
  selva-yantra4d:
    intake_target: selva/yantra4d-client
    intake_key_map:
      yantra4d_client_id: client_id
      yantra4d_client_secret: client_secret  # pragma: allowlist secret
    janua_client:
      name: selva-yantra4d
      client_key: selva-yantra4d  # pragma: allowlist secret
      audience: yantra4d-api
      description: Machine edge (client_credentials) from Selva's phygital tools to Yantra4D render, analysis and quote requests. Platform-admin, scope yantra4d:render only.
      is_confidential: true
      allowed_scopes:
        - yantra4d:render
      grant_types:
        - client_credentials

  # ---------------------------------------------------------------------------
  # Selva's phygital tools → Pravara-MES (read). Pravara answers 403 to any
  # token without a tenant_id claim (apps/pravara-api/internal/middleware/
  # auth.go), and Janua sets tenant_id only on organization-bound clients, so
  # this edge is org-bound. Organization madfam-ecosystem, chosen 2026-10-09 on
  # the owner's instruction: Cotiza's and Forj's Pravara intake clients are
  # bound there, so the production orders Selva may read are the ones those
  # intakes create. Selva's two Pravara tools (production-order status and
  # inventory) are platform-only, so tenant swarms cannot read through it.
  #
  # audience pravara-api, like the intake clients above. Scope pravara-mes:read
  # only: GET /v1/orders/:id, /v1/inventory and /v1/inventory/:id
  # (apps/pravara-api/internal/api/route_scopes.go); writes stay refused.
  # Selva mints from the pair as SELVA_PRAVARA_CLIENT_ID /
  # SELVA_PRAVARA_CLIENT_SECRET, delivered by the same selva-service-clients
  # ExternalSecret as the Yantra4D pair; the pair lands at secret/selva through
