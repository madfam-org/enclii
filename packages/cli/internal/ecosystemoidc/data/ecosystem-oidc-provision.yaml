# MADFAM ecosystem OIDC auto-provision registry
# Consumed by: enclii secrets provision oidc
# Last Updated: 2026-06-16
#
# Operator flow (single Janua SSO session as admin@madfam.io):
#   export ENCLII_API_ENDPOINT=https://api.enclii.dev
#   enclii login
#   enclii secrets provision oidc --platform dhanam

issuer: https://auth.madfam.io

platforms:
  dhanam:
    intake_target: dhanam/oidc-janua
    session_intake_target: dhanam/session-auth
    janua_client:
      name: Dhanam
      client_key: dhanam
      audience: dhanam-api
      client_id: jnc_uE2zp9ume_Fd6jMl1elL6wqjiECM711t
      description: Dhanam wealth platform — production OIDC confidential client
      is_confidential: true
      website_url: https://app.dhan.am
      redirect_uris:
        - https://app.dhan.am/auth/callback
        - https://admin.dhan.am/auth/callback
        - http://localhost:3000/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  karafiel:
    intake_target: karafiel/web-oidc-janua
    intake_key_map:
      web_oidc_client_id: client_id
      web_janua_secret_key: client_secret
      web_oidc_issuer: issuer
    janua_client:
      name: Karafiel
      client_key: karafiel-app
      audience: karafiel-app
      client_id: jnc_ZDQhZ7jOdqUMIOxHn_zuXvqiMMbWNE0q
      description: Karafiel tenant self-serve app (app.karafiel.mx)
      is_confidential: true
      website_url: https://app.karafiel.mx
      redirect_uris:
        - https://app.karafiel.mx/api/auth/callback
        - http://localhost:3050/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  phynd-crm:
    intake_target: phynd-crm/oidc-janua
    janua_client:
      name: Phynd CRM
      client_key: phynd-crm
      audience: phynd-crm-api
      description: Phynd CRM staff SSO (crm.madfam.io)
      is_confidential: true
      website_url: https://crm.madfam.io
      redirect_uris:
        - https://crm.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  ceq:
    intake_target: ceq/janua-client-secret
    intake_key_map:
      JANUA_CLIENT_SECRET: client_secret
    janua_client:
      name: CEQ Studio
      client_key: ceq
      audience: ceq-api
      description: CEQ creative orchestrator studio
      is_confidential: true
      website_url: https://ceq.madfam.io
      redirect_uris:
        - https://ceq.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # ---------------------------------------------------------------------------
  # Nauta — fractional-CTO platform. TWO clients, two platform keys.
  #
  # The audiences differ and must be revocable independently: the cockpit is
  # MADFAM staff, the portal is a client organisation on its own branded host. A
  # single client would mean revoking staff access in order to revoke a client's.
  #
  # client_id is PINNED on both. That is what makes this reconcile rather than
  # create: without it, every run registers a fresh client. The Janua client list
  # currently carries eight duplicate "Voxa" entries, which is what that looks
  # like in production.
  #
  # Both use a lowercase intake_key_map because nauta's ExternalSecrets reference
  # `property: janua_client_id`. ESO is all-or-nothing per ExternalSecret, so a
  # case mismatch syncs ZERO keys — pods with no environment, presenting as a
  # broken image rather than a naming error. Do not "normalise" these to the
  # UPPER_SNAKE used by dhanam/ceq without changing nauta's manifests in the
  # same commit. (karafiel is lowercase too, for the same kind of reason.)
  #
  # The declaration these mirror lives at nauta:infra/oauth-redirect-uris.json.
  # Keep the redirect URIs in sync with it — a URI that exists in Janua but not
  # in that file is invisible to review.
  # ---------------------------------------------------------------------------
  nauta:
    intake_target: nauta/oidc-janua
    intake_key_map:
      janua_client_id: client_id
      janua_client_secret: client_secret
    janua_client:
      name: Nauta Cockpit
      client_key: nauta-cockpit
      audience: nauta-api
      client_id: jnc_43heE7PWV_UxbPGCDUccnMMz4OycY1kw
      description: MADFAM fractional-CTO operating cockpit (cto.madfam.io). Staff only, OIDC authorization-code flow.
      is_confidential: true
      website_url: https://cto.madfam.io
      redirect_uris:
        - https://nauta.madfam.io/api/auth/callback
        - https://cto.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # PARKED: registered and real, but no ExternalSecret projects these two
  # properties yet. Provisioned anyway because a Janua client_secret is shown
  # exactly once — capturing it now avoids a rotation on the day the portal
  # surface is wired.
  nauta-portal:
    intake_target: nauta/oidc-janua-portal
    intake_key_map:
      janua_portal_client_id: client_id
      janua_portal_client_secret: client_secret
    janua_client:
      name: Nauta Client Workspace
      client_key: nauta-portal
      audience: nauta-portal
      client_id: jnc_0ScgVo7GGbwqD7Sc5C5ScdMnn-zQBT0A
      description: White-labeled tier-3 client workspace (crea.madfam.io). Clients authenticate by magic link; this OIDC client covers the staff/admin path onto the same surface.
      is_confidential: true
      website_url: https://crea.madfam.io
      redirect_uris:
        - https://crea.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token
