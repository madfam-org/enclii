# MADFAM ecosystem OIDC auto-provision registry
# Consumed by: enclii secrets provision oidc
# Last Updated: 2026-10-08
#
# TWO COPIES, ONE CONTENT. The CLI embeds
# packages/cli/internal/ecosystemoidc/data/ecosystem-oidc-provision.yaml (go:embed
# cannot reach outside its package), and scripts/provision-ecosystem-oidc.sh passes
# THIS file with --registry. They drifted for 10 weeks (this copy lacked nauta and
# nauta-portal, #379/#473), so `registry_test.go` now fails the build when the two
# bytes differ. Edit both in the same commit (`cp` one over the other).
#
# Operator flow (single Janua SSO session as admin@madfam.io):
#   export ENCLII_API_ENDPOINT=https://api.enclii.dev
#   enclii login
#   enclii secrets provision oidc --platform dhanam
#
# PUBLIC LOGIN CLIENTS (`is_confidential: false`, no organization_id) are
# browser/device apps that sign in with PKCE and hold no secret. They need no
# intake_target: the provisioner registers or reconciles the client and prints
# the client_id, which the consumer pins in its own janua.client.yaml. It never
# resolves, rotates or intakes a secret for them.

issuer: https://auth.madfam.io

platforms:
  dhanam:
    intake_target: dhanam/oidc-janua
    session_intake_target: dhanam/session-auth
    janua_client:
      name: Dhanam
      client_key: dhanam
      audience: dhanam-api
      client_id: jnc_uE2zp9ume_Fd6jMl1elL6wqjiECM711t
      description: Dhanam wealth platform — production OIDC confidential client
      is_confidential: true
      website_url: https://app.dhan.am
      redirect_uris:
        - https://app.dhan.am/auth/callback
        - https://admin.dhan.am/auth/callback
        - http://localhost:3000/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  karafiel:
    intake_target: karafiel/web-oidc-janua
    intake_key_map:
      web_oidc_client_id: client_id
      web_janua_secret_key: client_secret
      web_oidc_issuer: issuer
    janua_client:
      name: Karafiel
      client_key: karafiel-app
      audience: karafiel-app
      client_id: jnc_ZDQhZ7jOdqUMIOxHn_zuXvqiMMbWNE0q
      description: Karafiel tenant self-serve app (app.karafiel.mx)
      is_confidential: true
      website_url: https://app.karafiel.mx
      redirect_uris:
        - https://app.karafiel.mx/api/auth/callback
        - http://localhost:3050/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  phynd-crm:
    intake_target: phynd-crm/oidc-janua
    janua_client:
      name: Phynd CRM
      client_key: phynd-crm
      audience: phynd-crm-api
      description: Phynd CRM staff SSO (crm.madfam.io)
      is_confidential: true
      website_url: https://crm.madfam.io
      redirect_uris:
        - https://crm.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  ceq:
    intake_target: ceq/janua-client-secret
    intake_key_map:
      JANUA_CLIENT_SECRET: client_secret
    janua_client:
      name: CEQ Studio
      client_key: ceq
      audience: ceq-api
      description: CEQ creative orchestrator studio
      is_confidential: true
      website_url: https://ceq.madfam.io
      redirect_uris:
        - https://ceq.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # ---------------------------------------------------------------------------
  # Nauta — fractional-CTO platform. TWO clients, two platform keys.
  #
  # The audiences differ and must be revocable independently: the cockpit is
  # MADFAM staff, the portal is a client organisation on its own branded host. A
  # single client would mean revoking staff access in order to revoke a client's.
  #
  # client_id is PINNED on both. That is what makes this reconcile rather than
  # create: without it, every run registers a fresh client. The Janua client list
  # currently carries eight duplicate "Voxa" entries, which is what that looks
  # like in production.
  #
  # Both use a lowercase intake_key_map because nauta's ExternalSecrets reference
  # `property: janua_client_id`. ESO is all-or-nothing per ExternalSecret, so a
  # case mismatch syncs ZERO keys — pods with no environment, presenting as a
  # broken image rather than a naming error. Do not "normalise" these to the
  # UPPER_SNAKE used by dhanam/ceq without changing nauta's manifests in the
  # same commit. (karafiel is lowercase too, for the same kind of reason.)
  #
  # The declaration these mirror lives at nauta:infra/oauth-redirect-uris.json.
  # Keep the redirect URIs in sync with it — a URI that exists in Janua but not
  # in that file is invisible to review.
  # ---------------------------------------------------------------------------
  nauta:
    intake_target: nauta/oidc-janua
    intake_key_map:
      janua_client_id: client_id
      janua_client_secret: client_secret
    janua_client:
      name: Nauta Cockpit
      client_key: nauta-cockpit
      audience: nauta-api
      client_id: jnc_43heE7PWV_UxbPGCDUccnMMz4OycY1kw
      description: MADFAM fractional-CTO operating cockpit (app.nauta.quest). Staff only, OIDC authorization-code flow.
      is_confidential: true
      website_url: https://app.nauta.quest
      # 2026-08-30 apex migration: cockpit moved to app.nauta.quest (hard cutover
      # from the two retired madfam.io cockpit hosts; the nauta.quest apex serves the
      # public landing). The callback path is /api/auth/callback/janua (Auth.js
      # provider id 'janua') — the earlier entries here omitted the /janua suffix,
      # which the live Janua registry never used. The retired-host callbacks were
      # dropped on 2026-09-23: both hosts answer 404 since the cutover, so the
      # transition window is over. Mirrors nauta:infra/oauth-redirect-uris.json —
      # keep in sync.
      redirect_uris:
        - https://app.nauta.quest/api/auth/callback/janua
        - http://localhost:3000/api/auth/callback/janua
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # PARKED: registered and real, but no ExternalSecret projects these two
  # properties yet. Provisioned anyway because a Janua client_secret is shown
  # exactly once — capturing it now avoids a rotation on the day the portal
  # surface is wired.
  nauta-portal:
    intake_target: nauta/oidc-janua-portal
    intake_key_map:
      janua_portal_client_id: client_id
      janua_portal_client_secret: client_secret
    janua_client:
      name: Nauta Client Workspace
      client_key: nauta-portal
      audience: nauta-portal
      client_id: jnc_0ScgVo7GGbwqD7Sc5C5ScdMnn-zQBT0A
      description: White-labeled tier-3 client workspace (crea.madfam.io). Clients authenticate by magic link; this OIDC client covers the staff/admin path onto the same surface.
      is_confidential: true
      website_url: https://crea.madfam.io
      redirect_uris:
        - https://crea.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  lexidrop:
    intake_target: lexidrop/oidc-janua
    # Lowercase Vault properties, because lexidrop's ExternalSecret reads
    # `janua_client_secret` from secret/lexidrop and ESO is all-or-nothing.
    intake_key_map:
      janua_client_id: client_id
      janua_client_secret: client_secret
    janua_client:
      name: LexiDrop
      client_key: lexidrop
      audience: lexidrop
      # Pinned to the client already registered on Janua (confirmed via the
      # by-name endpoint 2026-08-29): the pin makes this RECONCILE, not create a
      # duplicate.
      client_id: jnc_VMg2JHsr8qjmvdhS1ff5qNIRjb0fUA2x
      description: LexiDrop domain-acquisition intelligence (ld-app.madfam.io) — confidential OIDC client for the Janua-gated dashboard
      is_confidential: true
      website_url: https://ld-app.madfam.io
      redirect_uris:
        - https://ld-app.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # ---------------------------------------------------------------------------
  # Nauta → Symbiosis-HCM (service). The ecosystem's FIRST client_credentials
  # machine edge — every entry above is an authorization_code LOGIN client.
  #
  # One edge, one client, one scope (the same rule the Nauta→Karafiel edge
  # follows). A dedicated machine client, NOT the nauta-cockpit login client:
  # granting `hcm:hr` to the credential every MADFAM staffer signs in with would
  # hand payroll authority to that shared login. So this client exists only to
  # let nauta's /recursos-humanos slice mint short-lived HCM tokens.
  #
  # No redirect_uris (client_credentials has no browser leg). It is org-bound to
  # CTM/`crea` (organization_id below): Janua #595 — merged 2026-09-04, in prod
  # 2026-09-07 — emits an org-bound client's app:role scopes verbatim into the
  # roles claim, so a token minted for `hcm:hr` (colon) carries a role HCM's
  # HR_ROLES accepts. Without the org binding that verbatim emission does not
  # fire and HCM answers 403. audience `symbiosis-hcm` is HCM's own audience.
  #
  # NOT pinned with a client_id: this client does not exist yet, so the first
  # provision run CREATES it (reconcile-by-name/key/audience on later runs). Once
  # it is registered, pin its jnc_… id here to make every future run reconcile.
  #
  # intake_target writes the minted pair to Vault secret/nauta as a MERGE, so the
  # two properties land alongside nauta's other keys without clobbering them. The
  # lowercase intake_key_map matches nauta #264's `nauta-hcm-oauth` ExternalSecret
  # (`property: symbiosis_hcm_oauth_client_id` / `_secret`); ESO is all-or-nothing
  # per ExternalSecret, so the case must match exactly or that Secret syncs zero
  # keys and the RH slice stays NOT_CONNECTED.
  # ---------------------------------------------------------------------------
  nauta-symbiosis-hcm:
    intake_target: nauta/symbiosis-hcm-oauth
    intake_key_map:
      symbiosis_hcm_oauth_client_id: client_id
      symbiosis_hcm_oauth_client_secret: client_secret
    janua_client:
      name: Nauta → Symbiosis-HCM (service)
      client_key: nauta-symbiosis-hcm
      audience: symbiosis-hcm
      description: Machine edge (client_credentials) from nauta's /recursos-humanos slice to Symbiosis-HCM. Org-bound to CTM/crea, scope hcm:hr — one edge, one client, one scope. NOT the cockpit login client. Mints short-lived HCM tokens; never a browser login.
      is_confidential: true
      organization_id: e6cbd51d-8329-4c4e-8c74-aba643ab4575
      allowed_scopes:
        - hcm:hr
      grant_types:
        - client_credentials

  # ---------------------------------------------------------------------------
  # crea-map → janua payment mail (service). The second client_credentials
  # machine edge, shaped exactly like nauta-symbiosis-hcm: one edge, one client,
  # one scope. janua #635's POST /api/v1/email/payment-notices accepts ONLY an
  # RS256 token with aud `janua-email`, token_use client_credentials, actor
  # service_account and scope `crea-map:payment-mail`, then re-reads THIS client
  # row under lock (active, confidential, organization_id, audience,
  # allowed_scopes, grant_types) before every claim
  # (janua apps/api/app/services/payment_mail_auth.py). So the org binding and
  # the scope below are the authorization, not decoration.
  #
  # Org-bound to Crea Tu Mundo, like nauta-symbiosis-hcm: crea-map #688 binds
  # every staff payment-mail intent to (JANUA_ORGANIZATION_ID, this client_id).
  #
  # PINNED 2026-09-23: the first provision run created it (after janua #637
  # let registration accept the hyphenated scope). Re-runs now RECONCILE this
  # exact client instead of registering a duplicate. The pair lives at
  # secret/crea-map via crea-map/janua-mail-client.
  # ---------------------------------------------------------------------------
  crea-map-payment-mail:
    intake_target: crea-map/janua-mail-client
    intake_key_map:
      janua_mail_client_id: client_id
      janua_mail_client_secret: client_secret
    janua_client:
      name: Crea MAP → Janua payment mail (service)
      client_key: crea-map-payment-mail  # pragma: allowlist secret
      audience: janua-email
      client_id: jnc_9PHl6rQWZFakbXtmWSB5i-bAWJVWKZ1J
      description: Machine edge (client_credentials) from crea-map's staff payment-mail outbox to janua's POST /api/v1/email/payment-notices. Org-bound to CTM/crea, scope crea-map:payment-mail — one edge, one client, one scope. Never a browser login.
      is_confidential: true
      organization_id: e6cbd51d-8329-4c4e-8c74-aba643ab4575
      allowed_scopes:
        - crea-map:payment-mail
      grant_types:
        - client_credentials

  # ---------------------------------------------------------------------------
  # Telesia — completionist dashboard (app.telesia.quest), onboarded 2026-09-12.
  #
  # Modelled on nauta: one confidential authorization_code LOGIN client, with the
  # minted pair filed at a LOWERCASE intake target because telesia's
  # ExternalSecret references `property: janua_client_id` and ESO is
  # all-or-nothing per ExternalSecret — a case mismatch syncs ZERO keys and the
  # pods start with no environment at all.
  #
  # NOT pinned with a client_id: this client is not registered on Janua yet, so
  # the first provision run CREATES it (reconcile-by-name/key/audience on later
  # runs), the same shape phynd-crm, ceq and nauta-symbiosis-hcm are in. Pin its
  # jnc_… id here the moment it exists — an unpinned re-run is what produced the
  # eight duplicate "Voxa" entries in Janua's client list.
  #
  # The callback path is /api/auth/callback/janua (Auth.js provider id 'janua').
  # audience `telesia-api` is what telesia-api validates RS256 bearers against,
  # so the browser login and the API audience are one identity.
  # ---------------------------------------------------------------------------
  telesia:
    intake_target: telesia/oidc-janua
    intake_key_map:
      janua_client_id: client_id
      janua_client_secret: client_secret
    janua_client:
      name: Telesia
      client_key: telesia-api  # pragma: allowlist secret
      audience: telesia-api
      description: Telesia completionist dashboard (app.telesia.quest) — OIDC authorization-code flow, confidential
      is_confidential: true
      website_url: https://app.telesia.quest
      redirect_uris:
        - https://app.telesia.quest/api/auth/callback/janua
        - http://localhost:3000/api/auth/callback/janua
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # ---------------------------------------------------------------------------
  # yantra4d-studio — the Yantra4D Studio at app.yantra4d.com. A PUBLIC login
  # client: the Studio is a browser SPA that runs authorization_code + PKCE
  # (S256) and holds no secret (yantra4d apps/studio/src/lib/januaSso.ts), so
  # there is NO intake_target — nothing about it is secret, and the client_id
  # is pinned in the consumer's own janua.client.yaml, which deploy.yml reads at
  # build time (VITE_JANUA_CLIENT_ID). Registered 2026-09-17 after the id the
  # Studio had shipped with since 2026-04-09 turned out to be unknown to Janua.
  #
  # The redirect URI is the Studio ORIGIN, byte for byte: the SDK sends no
  # path and no trailing slash, Janua matches literally at authorize and token,
  # and Janua derives its CORS allow-list from active clients' redirect URIs —
  # so this one line is also what lets the browser read the token response.
  # The audience is shared with the machine clients that call the same API
  # (Fashion Cabinet render, the licence server, Selva's quote client); Janua
  # keys registration by NAME, so that is fine.
  # ---------------------------------------------------------------------------
  yantra4d-studio:
    janua_client:
      name: yantra4d-studio
      client_key: yantra4d-api  # pragma: allowlist secret
      audience: yantra4d-api
      # Pinned 2026-09-17 from the first provision run (created=true). A pin
      # is what makes a re-run reconcile this row instead of creating a twin.
      client_id: jnc_eu9wVVAZZlxWPVa4FICFSVoBb-hrSVVH
      description: Yantra4D Studio (app.yantra4d.com) — public PKCE login client, no secret
      is_confidential: false
      website_url: https://app.yantra4d.com
      redirect_uris:
        - https://app.yantra4d.com
        - http://localhost:5173
      allowed_scopes:
        - openid
        - profile
        - email
      grant_types:
        - authorization_code
        - refresh_token

  # ---------------------------------------------------------------------------
  # creator-census-web — the Creator Census web at cc-app.madfam.io (landing
  # cc.madfam.io, API cc-api.madfam.io). A CONFIDENTIAL login client: the
  # Next.js BFF runs authorization_code + PKCE (S256) server-side and holds the
  # secret, so browsers never see it. PKCE is a per-request property of the
  # flow, not a client field, so nothing here declares it.
  #
  # The redirect URI is exact, byte for byte: Janua compares scheme, host, PORT
  # and path, so the BFF's /auth/callback on the production origin and on
  # localhost:3000 are the only two that will ever match.
  #
  # audience `creator-census-api` is what cc-api.madfam.io validates bearers
  # against, so the session the web holds is directly usable at the API.
  #
  # Only the SECRET goes to Vault (target creator-census/web-oidc, lowercase to
  # match what Vault stores; the census ExternalSecret maps
  # `property: janua_client_secret` -> JANUA_CLIENT_SECRET). The client_id is
  # plain config in the census Deployment: copy it from the provision output
  # (`client_id=jnc_…`). SESSION_SECRET is NOT minted here: it has its own
  # target, creator-census/web-session, filled with
  # `--generate session_secret` so the value is created inside Switchyard and
  # never touches a laptop. session_intake_target is deliberately unset — it
  # would re-mint the session secret on every provision re-run and sign every
  # user out.
  #
  # PINNED: the first run CREATED the client on 2026-09-25, as a Janua admin
  # (`--profile admin`; a non-admin login fails with "Admin privileges
  # required"). Its jnc_… id is pinned below, so later runs reconcile it
  # instead of creating a duplicate.
  # ---------------------------------------------------------------------------
  creator-census-web:
    intake_target: creator-census/web-oidc
    intake_key_map:
      janua_client_secret: client_secret  # pragma: allowlist secret
    janua_client:
      name: MADFAM Creator Census
      client_key: creator-census-web  # pragma: allowlist secret
      audience: creator-census-api
      client_id: jnc_BvM29PUgEasrdGKA2mOjU14d-7utPZxc
      description: Creator Census web (cc-app.madfam.io) — confidential OIDC authorization-code + PKCE client for the Next.js BFF
      is_confidential: true
      website_url: https://cc.madfam.io
      redirect_uris:
        - https://cc-app.madfam.io/auth/callback
        - http://localhost:3000/auth/callback
      allowed_scopes:
        - openid
        - email
        - profile
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # ---------------------------------------------------------------------------
  # family-history-web — the Family History web at fh-app.madfam.io (landing
  # fh.madfam.io, API fh-api.madfam.io). A CONFIDENTIAL login client: the
  # Next.js BFF runs authorization_code + PKCE (S256) server-side and holds the
  # secret, so browsers never see it. PKCE is a per-request property of the
  # flow, not a client field, so nothing here declares it.
  #
  # ONE redirect URI, exact byte for byte (Janua compares scheme, host, PORT and
  # path). Deliberately NO localhost callback, unlike creator-census-web: this is
  # the production client and local development registers its own client, so
  # Janua refuses any authorize request that would send a production code to a
  # local listener (least privilege).
  #
  # Post-logout https://fh-app.madfam.io/ needs no field: the schema has none and
  # Janua has no separate list. Its RP-Initiated Logout
  # (validate_post_logout_redirect_uri) accepts an exact registered redirect URI
  # OR the origin root of one, so the callback below already admits
  # https://fh-app.madfam.io/ and nothing else.
  #
  # audience `family-history-api` is what the API validates bearers against:
  # Janua stamps the client's `audience` as `aud` on the authorization-code
  # access and refresh tokens (falling back to the global audience only when it
  # is unset), so the session the web holds is directly usable at the API.
  #
  # allowed_scopes is EXACTLY the web's request, `openid profile email fh:read
  # fh:write`: the API enforces fh:read on GET/HEAD/OPTIONS and fh:write on every
  # other method. fh:admin and fh:export are deliberately absent. allowed_scopes
  # is a client-level grant, so anything listed here any user of this client
  # could request. offline_access is absent too: Janua issues a refresh token on
  # every authorization-code exchange without it, and the refresh_token grant is
  # gated by grant_types alone.
  #
  # BOTH the id and the secret go to Vault (target family-history/web-oidc,
  # lowercase to match what Vault stores), nauta-style: the family-history
  # ExternalSecret family-history-web maps `property: auth_janua_client_id` ->
  # AUTH_JANUA_CLIENT_ID and `property: auth_janua_client_secret` ->
  # AUTH_JANUA_CLIENT_SECRET, so the id stays out of the public repo.
  # FH_SESSION_SECRET is NOT minted here: it has its own target,
  # family-history/web-session, filled with `--generate fh_session_secret`.
  # session_intake_target is deliberately unset — it would re-mint the session
  # secret on every provision re-run and sign every user out.
  #
  # NOT pinned with a client_id: the client does not exist yet, so the first
  # run CREATES it, as a Janua admin (`--profile admin`). Pin the jnc_… id here
  # (both copies) after that run so later runs reconcile instead of risking a
  # duplicate.
  # ---------------------------------------------------------------------------
  family-history-web:
    intake_target: family-history/web-oidc
    intake_key_map:
      auth_janua_client_id: client_id
      auth_janua_client_secret: client_secret  # pragma: allowlist secret
    janua_client:
      name: MADFAM Family History
      client_key: family-history-web  # pragma: allowlist secret
      audience: family-history-api
      description: Family History web (fh-app.madfam.io) — confidential OIDC authorization-code + PKCE client for the Next.js BFF
      is_confidential: true
      website_url: https://fh.madfam.io
      redirect_uris:
        - https://fh-app.madfam.io/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - fh:read
        - fh:write
      grant_types:
        - authorization_code
        - refresh_token

  # ---------------------------------------------------------------------------
  # Digital-twins machine edges (2026-10-03). Nine client_credentials clients,
  # each one edge, one client, the narrowest scope set. Eight are defined in
  # janua apps/api/scripts/seed_service_clients.py (SERVICE_CLIENTS and the
  # ORG_BOUND_SERVICE_CLIENTS templates); name, audience, scopes and grant are
  # copied from that file byte for byte. The ninth, pravara-fabrication-prep,
  # follows fabrication-prep's docs/operator-setup.md section 2 (audience
  # fabrication-prep-api, scope fabrication-prep:slice); Janua must reserve that
  # audience and scope before it can be registered. client_key is the client
  # name. All are confidential, client_credentials only, with no redirect_uris.
  #
  # Six are platform-admin edges (no organization_id): renders, type shells and
  # slice jobs carry no tenant. Three are ORG-BOUND to the MADFAM Ecosystem organization
  # (slug madfam-ecosystem), because the receiving API reads tenant_id from the
  # token and Janua sets it only on an org-bound client. Janua names an
  # org-bound client `<template>.<org slug>`; the platform id swaps the dot for
  # a hyphen.
  #
  # All nine are PINNED by client_id (the ids printed by the first provision
  # run, 2026-10-03), so a run reconciles exactly these clients and never
