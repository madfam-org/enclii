# MADFAM ecosystem OIDC auto-provision registry
# Consumed by: enclii secrets provision oidc
# Last Updated: 2026-09-12
#
# TWO COPIES, ONE CONTENT. The CLI embeds
# packages/cli/internal/ecosystemoidc/data/ecosystem-oidc-provision.yaml (go:embed
# cannot reach outside its package), and scripts/provision-ecosystem-oidc.sh passes
# THIS file with --registry. They drifted for 10 weeks (this copy lacked nauta and
# nauta-portal, #379/#473), so `registry_test.go` now fails the build when the two
# bytes differ. Edit both in the same commit (`cp` one over the other).
#
# Operator flow (single Janua SSO session as admin@madfam.io):
#   export ENCLII_API_ENDPOINT=https://api.enclii.dev
#   enclii login
#   enclii secrets provision oidc --platform dhanam

issuer: https://auth.madfam.io

platforms:
  dhanam:
    intake_target: dhanam/oidc-janua
    session_intake_target: dhanam/session-auth
    janua_client:
      name: Dhanam
      client_key: dhanam
      audience: dhanam-api
      client_id: jnc_uE2zp9ume_Fd6jMl1elL6wqjiECM711t
      description: Dhanam wealth platform — production OIDC confidential client
      is_confidential: true
      website_url: https://app.dhan.am
      redirect_uris:
        - https://app.dhan.am/auth/callback
        - https://admin.dhan.am/auth/callback
        - http://localhost:3000/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  karafiel:
    intake_target: karafiel/web-oidc-janua
    intake_key_map:
      web_oidc_client_id: client_id
      web_janua_secret_key: client_secret
      web_oidc_issuer: issuer
    janua_client:
      name: Karafiel
      client_key: karafiel-app
      audience: karafiel-app
      client_id: jnc_ZDQhZ7jOdqUMIOxHn_zuXvqiMMbWNE0q
      description: Karafiel tenant self-serve app (app.karafiel.mx)
      is_confidential: true
      website_url: https://app.karafiel.mx
      redirect_uris:
        - https://app.karafiel.mx/api/auth/callback
        - http://localhost:3050/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  phynd-crm:
    intake_target: phynd-crm/oidc-janua
    janua_client:
      name: Phynd CRM
      client_key: phynd-crm
      audience: phynd-crm-api
      description: Phynd CRM staff SSO (crm.madfam.io)
      is_confidential: true
      website_url: https://crm.madfam.io
      redirect_uris:
        - https://crm.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  ceq:
    intake_target: ceq/janua-client-secret
    intake_key_map:
      JANUA_CLIENT_SECRET: client_secret
    janua_client:
      name: CEQ Studio
      client_key: ceq
      audience: ceq-api
      description: CEQ creative orchestrator studio
      is_confidential: true
      website_url: https://ceq.madfam.io
      redirect_uris:
        - https://ceq.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # ---------------------------------------------------------------------------
  # Nauta — fractional-CTO platform. TWO clients, two platform keys.
  #
  # The audiences differ and must be revocable independently: the cockpit is
  # MADFAM staff, the portal is a client organisation on its own branded host. A
  # single client would mean revoking staff access in order to revoke a client's.
  #
  # client_id is PINNED on both. That is what makes this reconcile rather than
  # create: without it, every run registers a fresh client. The Janua client list
  # currently carries eight duplicate "Voxa" entries, which is what that looks
  # like in production.
  #
  # Both use a lowercase intake_key_map because nauta's ExternalSecrets reference
  # `property: janua_client_id`. ESO is all-or-nothing per ExternalSecret, so a
  # case mismatch syncs ZERO keys — pods with no environment, presenting as a
  # broken image rather than a naming error. Do not "normalise" these to the
  # UPPER_SNAKE used by dhanam/ceq without changing nauta's manifests in the
  # same commit. (karafiel is lowercase too, for the same kind of reason.)
  #
  # The declaration these mirror lives at nauta:infra/oauth-redirect-uris.json.
  # Keep the redirect URIs in sync with it — a URI that exists in Janua but not
  # in that file is invisible to review.
  # ---------------------------------------------------------------------------
  nauta:
    intake_target: nauta/oidc-janua
    intake_key_map:
      janua_client_id: client_id
      janua_client_secret: client_secret
    janua_client:
      name: Nauta Cockpit
      client_key: nauta-cockpit
      audience: nauta-api
      client_id: jnc_43heE7PWV_UxbPGCDUccnMMz4OycY1kw
      description: MADFAM fractional-CTO operating cockpit (app.nauta.quest). Staff only, OIDC authorization-code flow.
      is_confidential: true
      website_url: https://app.nauta.quest
      # 2026-08-30 apex migration: cockpit moved to app.nauta.quest (hard cutover
      # from nauta.madfam.io / cto.madfam.io; the nauta.quest apex serves the
      # public landing). The callback path is /api/auth/callback/janua (Auth.js
      # provider id 'janua') — the earlier entries here omitted the /janua suffix,
      # which the live Janua registry never used. Old-host callbacks kept for the
      # transition window; remove once DNS + config have fully moved. Mirrors
      # nauta:infra/oauth-redirect-uris.json — keep in sync.
      redirect_uris:
        - https://app.nauta.quest/api/auth/callback/janua
        - https://nauta.madfam.io/api/auth/callback/janua
        - https://cto.madfam.io/api/auth/callback/janua
        - http://localhost:3000/api/auth/callback/janua
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # PARKED: registered and real, but no ExternalSecret projects these two
  # properties yet. Provisioned anyway because a Janua client_secret is shown
  # exactly once — capturing it now avoids a rotation on the day the portal
  # surface is wired.
  nauta-portal:
    intake_target: nauta/oidc-janua-portal
    intake_key_map:
      janua_portal_client_id: client_id
      janua_portal_client_secret: client_secret
    janua_client:
      name: Nauta Client Workspace
      client_key: nauta-portal
      audience: nauta-portal
      client_id: jnc_0ScgVo7GGbwqD7Sc5C5ScdMnn-zQBT0A
      description: White-labeled tier-3 client workspace (crea.madfam.io). Clients authenticate by magic link; this OIDC client covers the staff/admin path onto the same surface.
      is_confidential: true
      website_url: https://crea.madfam.io
      redirect_uris:
        - https://crea.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  lexidrop:
    intake_target: lexidrop/oidc-janua
    # Lowercase Vault properties, because lexidrop's ExternalSecret reads
    # `janua_client_secret` from secret/lexidrop and ESO is all-or-nothing.
    intake_key_map:
      janua_client_id: client_id
      janua_client_secret: client_secret
    janua_client:
      name: LexiDrop
      client_key: lexidrop
      audience: lexidrop
      # Pinned to the client already registered on Janua (confirmed via the
      # by-name endpoint 2026-08-29): the pin makes this RECONCILE, not create a
      # duplicate.
      client_id: jnc_VMg2JHsr8qjmvdhS1ff5qNIRjb0fUA2x
      description: LexiDrop domain-acquisition intelligence (ld-app.madfam.io) — confidential OIDC client for the Janua-gated dashboard
      is_confidential: true
      website_url: https://ld-app.madfam.io
      redirect_uris:
        - https://ld-app.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # ---------------------------------------------------------------------------
  # Nauta → Symbiosis-HCM (service). The ecosystem's FIRST client_credentials
  # machine edge — every entry above is an authorization_code LOGIN client.
  #
  # One edge, one client, one scope (the same rule the Nauta→Karafiel edge
  # follows). A dedicated machine client, NOT the nauta-cockpit login client:
  # granting `hcm:hr` to the credential every MADFAM staffer signs in with would
  # hand payroll authority to that shared login. So this client exists only to
  # let nauta's /recursos-humanos slice mint short-lived HCM tokens.
  #
  # No redirect_uris (client_credentials has no browser leg). It is org-bound to
  # CTM/`crea` (organization_id below): Janua #595 — merged 2026-09-04, in prod
  # 2026-09-07 — emits an org-bound client's app:role scopes verbatim into the
  # roles claim, so a token minted for `hcm:hr` (colon) carries a role HCM's
  # HR_ROLES accepts. Without the org binding that verbatim emission does not
  # fire and HCM answers 403. audience `symbiosis-hcm` is HCM's own audience.
  #
  # NOT pinned with a client_id: this client does not exist yet, so the first
  # provision run CREATES it (reconcile-by-name/key/audience on later runs). Once
  # it is registered, pin its jnc_… id here to make every future run reconcile.
  #
  # intake_target writes the minted pair to Vault secret/nauta as a MERGE, so the
  # two properties land alongside nauta's other keys without clobbering them. The
  # lowercase intake_key_map matches nauta #264's `nauta-hcm-oauth` ExternalSecret
  # (`property: symbiosis_hcm_oauth_client_id` / `_secret`); ESO is all-or-nothing
  # per ExternalSecret, so the case must match exactly or that Secret syncs zero
  # keys and the RH slice stays NOT_CONNECTED.
  # ---------------------------------------------------------------------------
  nauta-symbiosis-hcm:
    intake_target: nauta/symbiosis-hcm-oauth
    intake_key_map:
      symbiosis_hcm_oauth_client_id: client_id
      symbiosis_hcm_oauth_client_secret: client_secret
    janua_client:
      name: Nauta → Symbiosis-HCM (service)
      client_key: nauta-symbiosis-hcm
      audience: symbiosis-hcm
      description: Machine edge (client_credentials) from nauta's /recursos-humanos slice to Symbiosis-HCM. Org-bound to CTM/crea, scope hcm:hr — one edge, one client, one scope. NOT the cockpit login client. Mints short-lived HCM tokens; never a browser login.
      is_confidential: true
      organization_id: e6cbd51d-8329-4c4e-8c74-aba643ab4575
      allowed_scopes:
        - hcm:hr
      grant_types:
        - client_credentials

  # ---------------------------------------------------------------------------
  # Telesia — completionist dashboard (app.telesia.quest), onboarded 2026-09-12.
  #
  # Modelled on nauta: one confidential authorization_code LOGIN client, with the
  # minted pair filed at a LOWERCASE intake target because telesia's
  # ExternalSecret references `property: janua_client_id` and ESO is
  # all-or-nothing per ExternalSecret — a case mismatch syncs ZERO keys and the
  # pods start with no environment at all.
  #
  # NOT pinned with a client_id: this client is not registered on Janua yet, so
  # the first provision run CREATES it (reconcile-by-name/key/audience on later
  # runs), the same shape phynd-crm, ceq and nauta-symbiosis-hcm are in. Pin its
  # jnc_… id here the moment it exists — an unpinned re-run is what produced the
  # eight duplicate "Voxa" entries in Janua's client list.
  #
  # The callback path is /api/auth/callback/janua (Auth.js provider id 'janua').
  # audience `telesia-api` is what telesia-api validates RS256 bearers against,
  # so the browser login and the API audience are one identity.
  # ---------------------------------------------------------------------------
  telesia:
    intake_target: telesia/oidc-janua
    intake_key_map:
      janua_client_id: client_id
      janua_client_secret: client_secret
    janua_client:
      name: Telesia
      client_key: telesia-api
      audience: telesia-api
      description: Telesia completionist dashboard (app.telesia.quest) — OIDC authorization-code flow, confidential
      is_confidential: true
      website_url: https://app.telesia.quest
      redirect_uris:
        - https://app.telesia.quest/api/auth/callback/janua
        - http://localhost:3000/api/auth/callback/janua
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token
