# Admission context for the CLI: every case is a CREATE; infra-ns carries the
# platform label the policy excludes, tenant-a carries none (like synthetics).
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
globalValues:
  request.operation: CREATE
namespaceSelector:
  - name: tenant-a
    labels: {}
  - name: infra-ns
    labels:
      enclii.dev/type: infrastructure
