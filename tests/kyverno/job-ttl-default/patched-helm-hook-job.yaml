apiVersion: batch/v1
kind: Job
metadata:
  name: helm-hook-job
  namespace: tenant-a
  annotations:
    argocd.argoproj.io/tracking-id: "tenant-a:batch/Job:tenant-a/helm-hook-job"
    helm.sh/hook: pre-upgrade
spec:
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox
