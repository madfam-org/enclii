apiVersion: batch/v1
kind: Job
metadata:
  name: argo-hook-job
  namespace: tenant-a
  annotations:
    argocd.argoproj.io/tracking-id: "tenant-a:batch/Job:tenant-a/argo-hook-job"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox
