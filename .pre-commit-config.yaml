# Pre-commit configuration for Enclii
# Install: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files

repos:
  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Keep this in sync with the `should_exclude_file` filter recorded in
        # `.secrets.baseline` (regenerate with the same --exclude-files regex).
        # NOTE: the previous form anchored every alternative with a leading `^`,
        # so nested generated files (apps/status/pnpm-lock.yaml, every non-root
        # go.sum) were never excluded — that is why an honest baseline used to
        # mean ~1.7k lockfile hashes.
        exclude: |
          (?x)(
            \.md$|
            _test\.go$|
            \.example$|
            \.tsbuildinfo$|
            (^|/)go\.(mod|sum)$|
            (^|/)(pnpm-lock\.yaml|package-lock\.json|yarn\.lock)$
          )

  # Go formatting and linting
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet
      - id: go-imports

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # Security scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # No `args:`. The hook entry is already
      #   `gitleaks git --pre-commit --redact --staged --verbose`
      # and sets `pass_filenames: false`, so it scans the staged diff itself.
      # The old `args: ['--no-git']` was appended to `gitleaks protect` (the
      # v8.18.1 entry), which does not accept that flag: every run printed the
      # CLI usage and exited non-zero. `protect` was replaced by
      # `git --pre-commit` upstream, hence the rev bump rather than a rev pin.
      - id: gitleaks
